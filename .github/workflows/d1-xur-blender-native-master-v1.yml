name: D1 Xur Blender native master v3 diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-blender-native-master-v1.yml'
      - 'tools/d1_blender_xur_native_master.py'
      - 'tools/d1_gltf_fix_standalone_articulated_basis.py'
      - 'tools/d1_gltf_articulated_basis_alignment_probe.py'
      - 'tools/d1_gltf_standalone_basis_preservation_probe.py'
      - 'tools/d1_gltf_skin_bind_identity_probe.py'
      - 'tools/d1_gltf_layer_merge.py'
      - 'tools/install_blender_lts.sh'

permissions:
  contents: read

env:
  XUR_RELEASE_TAG: d1-tower-xur-corpus-calibrated-textured-actions-r3
  XUR_ASSET: D1_TOWER_XUR_80C88CEF_CORPUS_CALIBRATED_TEXTURED_ALL_ACTIONS.glb
  XUR_SHA256: 37b91b4979a309b31ee899c7c617e45aa6cc8d13b15d741357d84a6b225bb5dd

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Syntax-check Xur Blender builder
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_blender_xur_native_master.py tools/d1_blender_build_tower_three_npc_test_v4.py

      - name: Recover pinned calibrated Xur carrier
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q numpy scipy
          mkdir -p input work out/reports
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${XUR_RELEASE_TAG}/${XUR_ASSET}"
          curl --fail --location --retry 5 --retry-all-errors "$url" -o "input/${XUR_ASSET}"
          echo "${XUR_SHA256}  input/${XUR_ASSET}" | sha256sum --check --strict
          test "$(stat -c %s input/${XUR_ASSET})" -eq 283675508

      - name: Audit embedded Xur image payloads before basis repair
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,struct
          p='input/D1_TOWER_XUR_80C88CEF_CORPUS_CALIBRATED_TEXTURED_ALL_ACTIONS.glb'
          raw=open(p,'rb').read()
          jl,jt=struct.unpack_from('<II',raw,12); assert jt==0x4E4F534A
          d=json.loads(raw[20:20+jl].decode().rstrip(' \\t\\r\\n\\0'))
          bo=20+jl; bl,bt=struct.unpack_from('<II',raw,bo); assert bt==0x004E4942
          blob=raw[bo+8:bo+8+bl]
          rows=[]; bad=[]
          for i,img in enumerate(d.get('images') or []):
              ex=img.get('extras') or {}
              if not (ex.get('d1_native_texture_resource') is True or ex.get('d1_derived_portable_normal') is True): continue
              bv=d['bufferViews'][int(img['bufferView'])]
              off=int(bv.get('byteOffset',0)); n=int(bv['byteLength']); payload=blob[off:off+n]
              exp=ex.get('d1_embedded_png_sha256') or ex.get('d1_png_sha256')
              got=hashlib.sha256(payload).hexdigest()
              ok=len(payload)==n and payload.startswith(bytes.fromhex('89504e470d0a1a0a')) and (not exp or got==exp)
              row={'i':i,'name':img.get('name'),'bufferView':img['bufferView'],'off':off,'n':n,'first16':payload[:16].hex(),'expected':exp,'got':got,'ok':ok}
              rows.append(row)
              if not ok: bad.append(row)
          print('XUR_EMBEDDED_IMAGE_AUDIT',json.dumps({'count':len(rows),'bad_count':len(bad),'bad':bad[:20]},sort_keys=True))
          open('out/reports/XUR_EMBEDDED_IMAGE_AUDIT_BEFORE.json','w').write(json.dumps({'rows':rows,'bad':bad},indent=2)+'\\n')
          assert not bad,bad[:3]
          PY

      - name: Prove and repair the Xur articulated basis
        run: |
          set -euo pipefail
          src="input/${XUR_ASSET}"
          fixed="work/XUR_80C88CEF_BASIS_FIXED.glb"

          python tools/d1_gltf_articulated_basis_alignment_probe.py "$src" --model 80C88CEF             --expect-mesh-axis Z --expect-joint-axis Y --allow-mismatch             -o out/reports/XUR_BASIS_BEFORE.json

          python tools/d1_gltf_fix_standalone_articulated_basis.py "$src"             --model 80C88CEF --expect-skeleton 809D80C9             --out "$fixed" --report out/reports/XUR_BASIS_FIX.json

          python tools/d1_gltf_articulated_basis_alignment_probe.py "$fixed" --model 80C88CEF             --expect-mesh-axis Y --expect-joint-axis Y             -o out/reports/XUR_BASIS_AFTER.json

          python tools/d1_gltf_skin_bind_identity_probe.py "$fixed" --max-error 0.00002             -o out/reports/XUR_BIND_IDENTITY_AFTER.json

          python tools/d1_gltf_standalone_basis_preservation_probe.py             --source "$src" --fixed "$fixed" --model 80C88CEF             -o out/reports/XUR_BASIS_PRESERVATION.json

          python - <<'PY'
          import json
          before=json.load(open('out/reports/XUR_BASIS_BEFORE.json'))
          fix=json.load(open('out/reports/XUR_BASIS_FIX.json'))
          after=json.load(open('out/reports/XUR_BASIS_AFTER.json'))
          bind=json.load(open('out/reports/XUR_BIND_IDENTITY_AFTER.json'))
          keep=json.load(open('out/reports/XUR_BASIS_PRESERVATION.json'))
          assert before['mesh_bounds']['dominant_axis']=='Z' and before['joint_bounds']['dominant_axis']=='Y',before
          assert before['dominant_axes_aligned'] is False,before
          assert fix['status']=='D1_STANDALONE_ARTICULATED_PARSER_AND_GLTF_BASIS_FIXED',fix
          assert (fix['joint_count'],fix['skinned_mesh_node_count'],fix['animation_count'])==(70,119,267),fix
          assert fix['bin_byte_length_unchanged'] is True,fix
          assert after['dominant_axes_aligned'] is True and after['mesh_bounds']['dominant_axis']==after['joint_bounds']['dominant_axis']=='Y',after
          assert bind['status']=='D1_GLTF_SKIN_BIND_IDENTITY_COMPLETE' and not bind['violations'],bind
          assert bind['max_observed_error']<=2e-5,bind
          assert keep['status']=='D1_GLTF_STANDALONE_BASIS_PRESERVATION_COMPLETE' and not keep['violations'],keep
          assert keep['visual_resource_json_unchanged'] and keep['embedded_image_bytes_unchanged'] and keep['mesh_node_json_unchanged'],keep
          print('XUR_BASIS_REPAIR_GREEN',fix['output_sha256'],bind['max_observed_error'])
          PY

      - name: Install pinned Blender and software GL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libegl1 libgl1 libgl1-mesa-dri libglu1-mesa mesa-utils
          ldconfig -p | grep -F 'libEGL.so.1'
          ldconfig -p | grep -F 'libGL.so.1'
          xvfb-run -a glxinfo -B | tee out/software-gl.txt
          bash tools/install_blender_lts.sh .blender > blender-path.txt
          cat blender-path.txt
          test -x "$(tail -n1 blender-path.txt)"

      - name: Build Xur native-semantic Blender master
        run: |
          set -euo pipefail
          BLENDER="$(tail -n1 blender-path.txt)"
          xvfb-run -a "$BLENDER" --background --factory-startup --python-exit-code 1             --python tools/d1_blender_xur_native_master.py --             --input work/XUR_80C88CEF_BASIS_FIXED.glb             --output out/XUR_80C88CEF_NATIVE_MASTER_V3_DIAGNOSTIC.blend             --preview out/XUR_80C88CEF_NATIVE_MASTER_V3_DIAGNOSTIC.png             --report out/XUR_80C88CEF_NATIVE_MASTER_V3_DIAGNOSTIC.json             | tee out/blender-build.log

      - name: Reopen and validate the saved master
        run: |
          set -euo pipefail
          BLENDER="$(tail -n1 blender-path.txt)"
          xvfb-run -a "$BLENDER" --background --python-exit-code 1 out/XUR_80C88CEF_NATIVE_MASTER_V3_DIAGNOSTIC.blend             --python-expr "import bpy; arms=[o for o in bpy.data.objects if o.type=='ARMATURE']; assert len(bpy.data.actions)==267,len(bpy.data.actions); assert len(arms)==1,len(arms); ad=arms[0].animation_data; assert ad is not None and ad.action is not None; assert arms[0].get('d1PreviewAction')==ad.action.name,(arms[0].get('d1PreviewAction'),ad.action.name); assert arms[0].get('d1PreviewActionPolicy')=='LOW_MOTION_TARGET_NATIVE_DIAGNOSTIC_NOT_RETAIL_IDLE'; assert bpy.context.scene.get('d1_preview_action_selected') is True; assert bpy.context.scene.get('d1_preview_action_policy')=='LOW_MOTION_TARGET_NATIVE_DIAGNOSTIC_NOT_RETAIL_IDLE'; assert bpy.context.scene.get('d1_runtime_default_action_selected') is False; assert bpy.context.scene.get('d1_native_material_semantics_fail_closed') is True; assert bpy.context.scene.get('d1_full_retail_equivalence_claimed') is False; assert bpy.context.scene.get('d1_portable_closure_mode')=='NATIVE_MRT0_RGB_DIAGNOSTIC_UNLIT'; bad=[m.name for m in bpy.data.materials if m.get('d1_pixel_shader')=='80876579' and m.get('d1_80876579_control_texture_never_basecolor') is not True]; assert not bad,bad; print('XUR_MASTER_REOPEN_OK',len(bpy.data.materials),len(bpy.data.actions),len(arms),ad.action.name,bpy.context.scene.frame_current)"             | tee out/blender-reopen.log

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/XUR_80C88CEF_NATIVE_MASTER_V3_DIAGNOSTIC.json')
          d=json.loads(p.read_text())
          assert d['status']=='D1_XUR_BLENDER_NATIVE_MASTER_V3_DIAGNOSTIC_COMPLETE',d
          assert (d['material_count'],d['action_count'],d['armature_count'])==(54,267,1),d
          assert d['source_basis_fix_proven'] is True,d
          assert d['startup_pose']=='LOW_MOTION_TARGET_NATIVE_DIAGNOSTIC_NOT_RETAIL_IDLE',d
          p=d['diagnostic_preview_pose']
          assert p['policy']=='LOW_MOTION_TARGET_NATIVE_DIAGNOSTIC_NOT_RETAIL_IDLE',p
          assert p['score']['pose_sane'] is True,p
          assert p['mesh_gate']['deformed_mesh_sane'] is True,p
          assert p['pose_sane_action_count']>0 and p['tested_mesh_candidate_count']>0,p
          assert d['runtime_default_action_selected'] is False,d
          assert d['runtime_material_selection_proven'] is False,d
          assert d['full_native_equation_claimed'] is False,d
          unresolved=d['material_status_counts'].get('UNRESOLVED_FAIL_CLOSED',0)
          assert unresolved <= 5,d['material_status_counts']
          assert d['material_status_counts'].get('SOURCE_CLOSED_CONSTANT_RGB_EXACT',0)>=1,d['material_status_counts']
          assert d['material_status_counts'].get('OPEN_VISIBLE_TFX_U4A4_FAIL_CLOSED',0)==1,d['material_status_counts']
          assert d['portable_closure_mode']=='NATIVE_MRT0_RGB_DIAGNOSTIC_UNLIT',d
          assert d['u4a4_visible_runtime_source_proven'] is False,d
          assert Path(d['output']).is_file() and Path(d['preview']).is_file()
          print('XUR_NATIVE_MASTER_REPORT_OK',json.dumps(d['material_status_counts'],sort_keys=True))
          PY
          find out -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-XUR-BLENDER-NATIVE-MASTER-V3-DIAGNOSTIC
          path: out/
          retention-days: 30
          compression-level: 3
          if-no-files-found: warn
