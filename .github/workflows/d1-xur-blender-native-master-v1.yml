name: D1 Xur Blender native master v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-blender-native-master-v1.yml'
      - 'tools/d1_blender_xur_native_master.py'
      - 'tools/install_blender_lts.sh'

permissions:
  contents: read

env:
  XUR_RELEASE_TAG: d1-tower-xur-corpus-calibrated-textured-actions-r3
  XUR_ASSET: D1_TOWER_XUR_80C88CEF_CORPUS_CALIBRATED_TEXTURED_ALL_ACTIONS.glb
  XUR_SHA256: 37b91b4979a309b31ee899c7c617e45aa6cc8d13b15d741357d84a6b225bb5dd

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Recover pinned calibrated Xur carrier
        run: |
          set -euo pipefail
          mkdir -p input out
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${XUR_RELEASE_TAG}/${XUR_ASSET}"
          curl --fail --location --retry 5 --retry-all-errors "$url" -o "input/${XUR_ASSET}"
          echo "${XUR_SHA256}  input/${XUR_ASSET}" | sha256sum --check --strict
          test "$(stat -c %s input/${XUR_ASSET})" -eq 283675508

      - name: Install pinned Blender and software GL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libegl1 libgl1 libgl1-mesa-dri libglu1-mesa mesa-utils
          ldconfig -p | grep -E 'libEGL\\.so\\.1|libGL\\.so\\.1'
          xvfb-run -a glxinfo -B | tee software-gl.txt
          bash tools/install_blender_lts.sh .blender > blender-path.txt
          cat blender-path.txt
          test -x "$(tail -n1 blender-path.txt)"

      - name: Build Xur native-semantic Blender master
        run: |
          set -euo pipefail
          BLENDER="$(tail -n1 blender-path.txt)"
          "$BLENDER" --background --factory-startup             --python tools/d1_blender_xur_native_master.py --             --input "input/${XUR_ASSET}"             --output out/XUR_80C88CEF_NATIVE_MASTER_V1.blend             --preview out/XUR_80C88CEF_NATIVE_MASTER_V1.png             --report out/XUR_80C88CEF_NATIVE_MASTER_V1.json             | tee out/blender-build.log

      - name: Reopen and validate the saved master
        run: |
          set -euo pipefail
          BLENDER="$(tail -n1 blender-path.txt)"
          "$BLENDER" --background out/XUR_80C88CEF_NATIVE_MASTER_V1.blend             --python-expr "import bpy; assert len(bpy.data.actions)==267,(len(bpy.data.actions)); arms=[o for o in bpy.data.objects if o.type=='ARMATURE']; assert len(arms)==1,len(arms); assert bpy.context.scene.get('d1_native_material_semantics_fail_closed') is True; assert bpy.context.scene.get('d1_full_retail_equivalence_claimed') is False; bad=[m.name for m in bpy.data.materials if m.get('d1_pixel_shader')=='80876579' and m.get('d1_80876579_control_texture_never_basecolor') is not True]; assert not bad,bad; print('XUR_MASTER_REOPEN_OK',len(bpy.data.materials),len(bpy.data.actions),len(arms))"             | tee out/blender-reopen.log

          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/XUR_80C88CEF_NATIVE_MASTER_V1.json')
          d=json.loads(p.read_text())
          assert d['status']=='D1_XUR_BLENDER_NATIVE_MASTER_V1_COMPLETE',d
          assert d['material_count']==54,d
          assert d['action_count']==267,d
          assert d['armature_count']==1,d
          assert d['runtime_material_selection_proven'] is False,d
          assert d['full_native_equation_claimed'] is False,d
          assert Path(d['output']).is_file()
          assert Path(d['preview']).is_file()
          print('XUR_NATIVE_MASTER_REPORT_OK',json.dumps(d['material_status_counts'],sort_keys=True))
          PY
          sha256sum out/* > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-XUR-BLENDER-NATIVE-MASTER-V1
          path: out/
          retention-days: 30
          compression-level: 3
          if-no-files-found: error
