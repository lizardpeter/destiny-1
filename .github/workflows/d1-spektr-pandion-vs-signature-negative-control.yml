name: D1 Spektar Pandion VS signature negative control

on:
  push:
    paths:
      - '.github/workflows/d1-spektr-pandion-vs-signature-negative-control.yml'
      - 'tools/d1_guardian_material_vs_census.py'
      - 'tools/d1_guardian_vs_signature_join.py'
      - 'tools/d1_ps4_vertex_shader_header.py'
      - 'tools/d1_ps4_shader_binary_probe.py'
      - 'tools/d1_guardian_texcoord2_lane_probe.py'
      - 'evidence/d1_investment_asset_member_catalog.json'
      - 'evidence/d1_player_gear_member_catalog.json'
      - 'evidence/d1_weapon_globals_member_catalog.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install parser dependencies and verified Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install -q numpy trimesh
          mkdir -p runtime out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Resolve all Spektar material vertex shaders including global families
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_guardian_material_vs_census.py \
            --model 80A8274E --model 80A85682 --model 809FDB1E --model 80A816E4 --model 80A862BA \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --member-catalog evidence/d1_player_gear_member_catalog.json \
            --member-catalog evidence/d1_weapon_globals_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/spektar_native_vertex_shaders_all.json

      - name: Join native 32:9 signatures to exact mesh layouts
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_guardian_vs_signature_join.py \
            --report out/spektar_native_vertex_shaders_all.json \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --member-catalog evidence/d1_player_gear_member_catalog.json \
            --member-catalog evidence/d1_weapon_globals_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/spektar_vs_signature_join.json

      - name: Validate positive and negative controls
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/spektar_vs_signature_join.json'))
          assert d['schema']=='d1_guardian_vs_signature_join/v1',d
          assert d['vertex_shader_count']==10,d
          assert d['resolved_vertex_shader_count']==10,d
          assert d['detail_shader_count']==4,d
          assert d['no_detail_shader_count']==6,d
          assert d['mixed_usage_shader_count']==0,d
          assert d['all_comparable_stride_controls_pass'] is True,d
          # The two directly comparable stream families are exact native controls.
          assert d['stride_controls']['0xc/0x14']['detail_equals_no_detail_plus_final_vec2'] is True,d
          # All decoded 32:9 headers must agree with their native OrbShdr metadata.
          for v in d['vertex_shaders']:
              assert v['checks']['wrapper_shader_size_matches_gnmx_shader_size'],v
              nc=v['native_checks']
              assert nc and nc['stage_is_vertex_shader'],v
              assert nc['gnmx_shader_size_matches_orbshdr_end'],v
              assert nc['usage_count_matches_orbshdr'],v
          print('SPEKTAR D1 NATIVE VS POSITIVE/NEGATIVE CONTROL PASSED')
          print(json.dumps(d['stride_controls'],indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-spektr-pandion-vs-signature-negative-control
          path: out/
          retention-days: 14
          if-no-files-found: error
