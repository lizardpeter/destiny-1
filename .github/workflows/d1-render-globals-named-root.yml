name: D1 render globals named-root discovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-render-globals-named-root.yml'
      - 'tools/d1_remote_named_tag_catalog.py'

permissions: {contents: read, actions: read}

env:
  GH_TOKEN: '${{ github.token }}'

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Rebuild exact current universal package catalog
        run: |
          set -euo pipefail
          mkdir -p input out
          curl --fail --location --retry 4 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o input/packages.txt
          curl --fail --location --retry 4 \
            'https://github.com/lizardpeter/destiny-1/releases/download/d1-global-activity-index-r1/D1_CURRENT_ACTIVITY_INDEX.json' \
            -o input/D1_CURRENT_ACTIVITY_INDEX.json
          echo '6b82da75f2f45852fa8addc58d2f835f914adfb48533e0388b4bd24f949b3f06  input/D1_CURRENT_ACTIVITY_INDEX.json' | sha256sum --check --strict
          python tools/d1_universal_member_catalog.py \
            --activity-index input/D1_CURRENT_ACTIVITY_INDEX.json \
            --package-list input/packages.txt \
            --out input/D1_UNIVERSAL_MEMBER_CATALOG.json
          python - <<'PY'
          import hashlib,json
          a=json.load(open('input/D1_CURRENT_ACTIVITY_INDEX.json'))
          d=json.load(open('input/D1_UNIVERSAL_MEMBER_CATALOG.json'))
          assert d['schema']=='d1_remote_package_member_catalog/v1'
          assert d['physical_member_count']==a['physical_member_count']
          assert d['package_family_count']==a['package_family_count']
          assert d['packages_txt_sha256']==hashlib.sha256(open('input/packages.txt','rb').read()).hexdigest()
          print('CURRENT_CATALOG_GREEN',d['physical_member_count'],d['package_family_count'])
          PY
      - name: Discover exact current named roots
        run: |
          set -euo pipefail
          python tools/d1_remote_named_tag_catalog.py \
            --catalog input/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --query render_globals --query client_startup_globals \
            --out out/D1_RENDER_GLOBALS_NAMED_ROOTS.json | tee out/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/D1_RENDER_GLOBALS_NAMED_ROOTS.json'))
          assert d['status']=='D1_CURRENT_NAMED_TAG_CATALOG_EXACT',d['violations']
          rg=d['queries']['render_globals']
          cs=d['queries']['client_startup_globals']
          # D1 ROI has no separately named render_globals tag in the exact current
          # named-tag corpus.  That negative result is itself part of the proof:
          # renderer-global state must be reached from client_startup_globals.
          assert rg==[],rg
          assert len(cs)==1,cs
          assert cs[0]['tag_hash']=='80B1A000',cs
          assert cs[0]['class_hash']=='80800341',cs
          assert cs[0]['package_id']=='018D',cs
          print('NO_SEPARATE_RENDER_GLOBALS_NAMED_ROOT_EXACT')
          print('RENDER_GLOBAL_ROOTS',json.dumps(rg,indent=2))
          print('CLIENT_STARTUP_ROOTS',json.dumps(cs,indent=2))
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-RENDER-GLOBALS-NAMED-ROOTS
          path: out/
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
