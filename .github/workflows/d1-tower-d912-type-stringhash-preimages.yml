name: D1 Tower D912 type StringHash preimages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-d912-type-stringhash-preimages.yml'
      - 'tools/d1_remote_stringhash_preimage_scan.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog and Oodle runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Search exact retail text for all Tower D912 group type hashes
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_stringhash_preimage_scan.py
          set +e
          python tools/d1_remote_stringhash_preimage_scan.py \
            --package-id 0x023d --package-id 0x0244 --package-id 0x024c --package-id 0x0250 --package-id 0x009f --package-id 0x0157 \
            --target 0D89E1C7 --target 0E217238 --target 170E6C74 --target 2112ABDE \
            --target 27EBAA35 --target 3064D17C --target 37DE1D4D --target 3E6B48D1 --target 3E6B48D2 \
            --target 442324CF --target 4B868608 --target 4B868609 --target 4B86860A --target 50070F9C \
            --target 52ECE273 --target 58A7319C --target 721945F6 --target 72E7BBCC --target 72E7BBCF \
            --target 7F62493C --target 8D1B9891 --target 8E434238 --target 990085DD --target A068B4DE \
            --target AC0843FD --target AC665550 --target AC665553 --target B1162C08 --target B3C2CE3D \
            --target B3C2CE3E --target B3C2CE3F --target B5D6EA47 --target B6910E5C --target B6910E5F \
            --target C7FB336D --target C7FB336E --target C7FB336F --target C92D04D9 --target C92D04DA \
            --target CEBF1595 --target CEBF1596 --target F01D2D0A --target F89ADEE0 --target FB2B5117 \
            --contains vendor --contains frame --contains sweep --contains tower --contains civilian --contains idle \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/TOWER_D912_TYPE_STRINGHASH_PREIMAGES.json | tee out/stdout.txt
          rc=${PIPESTATUS[0]}; set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-TOWER-D912-TYPE-STRINGHASH-PREIMAGES
          path: out/
          retention-days: 30
          if-no-files-found: error
