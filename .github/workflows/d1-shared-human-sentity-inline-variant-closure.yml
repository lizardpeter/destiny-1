name: D1 shared-human s_entity inline variant closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-shared-human-sentity-inline-variant-closure.yml'
      - 'tools/d1_remote_tag_payload_dump.py'
      - 'tools/d1_remote_exact_tag_probe.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog and runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out/payloads out/reports
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Dump all seven exact top-level shared-human s_entity payloads
        run: |
          set -euo pipefail
          python tools/d1_remote_tag_payload_dump.py \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            --tag 80C880B4 --tag 80C880B5 --tag 80C88216 --tag 80C88217 \
            --tag 80C883CE --tag 80C883D0 --tag 80C885AA \
            --out-dir out/payloads --report out/reports/SENTITY_PAYLOADS.json
          python tools/d1_remote_exact_tag_probe.py \
            --tag-hash 80C880B4 --tag-hash 80C880B5 --tag-hash 80C88216 --tag-hash 80C88217 \
            --tag-hash 80C883CE --tag-hash 80C883D0 --tag-hash 80C885AA \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            -o out/reports/SENTITY_EXACT_TAG_PROBE.json > out/exact_probe_stdout.txt
      - name: Classify all inline differences after removing known identity Resource[] aliases
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,struct,collections
          hs=['80C880B4','80C880B5','80C88216','80C88217','80C883CE','80C883D0','80C885AA']
          blobs={h:(Path('out/payloads')/(h+'.bin')).read_bytes() for h in hs}
          sizes={h:len(b) for h,b in blobs.items()}; assert set(sizes.values())=={34900},sizes
          n=34900
          varying=[i for i in range(n) if len({b[i] for b in blobs.values()})>1]
          runs=[]
          if varying:
              s=p=varying[0]
              for x in varying[1:]:
                  if x==p+1:p=x
                  else:runs.append([s,p]);s=p=x
              runs.append([s,p])
          probe=json.load(open('out/reports/SENTITY_EXACT_TAG_PROBE.json'))
          resolved={r['tag_hash']:{m['offset']:(m['tag_hash'],m['entry'].get('reference'),m['entry'].get('file_size')) for m in r.get('aligned_resolved_tags',[])} for r in probe['entries']}
          words=[]
          by_signature=collections.Counter()
          resolved_varying=[]
          for off in range(0,n-3,4):
              vals={h:f'{struct.unpack_from("<I",blobs[h],off)[0]:08X}' for h in hs}
              if len(set(vals.values()))<=1: continue
              rr={h:resolved[h].get(off) for h in hs}
              classes=tuple((x[1] if x else None) for x in rr.values())
              by_signature[classes]+=1
              row={'offset':off,'offset_hex':f'0x{off:X}','values':vals,'resolved':rr}
              words.append(row)
              if any(x is not None for x in rr.values()): resolved_varying.append(row)
          # Known identity-specific top-level Resource[] aliases.  These are already closed as
          # name metadata, paired identity metadata, animation state, and Wwise/audio state.
          known_sets=[
            {'80C880B9','80C880BD','80C8821D','80C88221','80C8840E','80C88412','80C885C5'},
            {'80C880BA','80C880BE','80C8821E','80C88222','80C8840F','80C88413','80C885C6'},
            {'80C88191','80C88192','80C8833E','80C8833F','80C889B3','80C889B4','80C885C7'},
            {'80C88022','80C88023','80C88036','80C88037','80C88048','80C88049','80C88CE1'},
          ]
          def is_known_alias(row):
              return set(row['values'].values()) in known_sets
          residual=[r for r in words if not is_known_alias(r)]
          residual_resolved=[r for r in residual if any(x is not None for x in r['resolved'].values())]
          rep={'schema':'d1_shared_human_sentity_inline_variant/v1','status':'D1_SHARED_HUMAN_SENTITY_INLINE_VARIANT_EXACT',
               'entities':hs,'payload_size':n,'varying_byte_count':len(varying),'varying_byte_runs':runs,
               'varying_aligned_u32_count':len(words),'resolved_varying_u32_count':len(resolved_varying),
               'known_alias_u32_count':len(words)-len(residual),'residual_varying_u32_count':len(residual),
               'residual_resolved_varying_u32_count':len(residual_resolved),'varying_words':words,'residual_words':residual,
               'policy':'Exact seven-way byte/u32 comparison of equal-size retail s_entity payloads. Known Resource[] identity aliases are removed only by exact seven-value set equality; remaining differences are not assigned semantics without independent schema evidence.'}
          Path('out/reports/SENTITY_INLINE_VARIANT_MATRIX.json').write_text(json.dumps(rep,indent=2)+'\n')
          print('INLINE_MATRIX','varying_bytes',len(varying),'runs',len(runs),'varying_u32',len(words),'known_alias',rep['known_alias_u32_count'],'residual_u32',len(residual),'residual_resolved',len(residual_resolved))
          print('RESIDUAL_RESOLVED')
          for r in residual_resolved: print(r['offset_hex'],r['values'],r['resolved'])
          print('RESIDUAL_UNRESOLVED_SAMPLE')
          for r in [x for x in residual if not any(v is not None for v in x['resolved'].values())][:120]: print(r['offset_hex'],r['values'])
          PY
          sha256sum out/payloads/*.bin out/reports/*.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-SHARED-HUMAN-SENTITY-INLINE-VARIANT-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
