name: D1 GCN PS VS DS stage frontier self-test

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/d1_gcn_shader_corpus_stage_frontier_v3.py'
      - 'tools/d1_gcn_shader_corpus_structural_census_v3.py'
      - '.github/workflows/d1-gcn-stage-frontier-v3-selftest.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Run exact three-stage structural frontier self-test
        run: |
          set -euo pipefail
          python tools/d1_gcn_shader_corpus_structural_census_v3.py --self-test
          python tools/d1_gcn_shader_corpus_stage_frontier_v3.py --self-test
