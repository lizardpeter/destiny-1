name: D1 PS UserData12 PM4 Probe

on:
  push:
    paths:
      - '.github/workflows/d1-ps-userdata12-pm4-probe.yml'
      - 'tools/d1_ps_userdata12_pm4_probe.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EBOOT_URL: https://r2.houseofkublai.com/destiny/CUSA00219_01.33/eboot.bin
      EBOOT_SHA256: 672f03411c0503dfbcda804cbb9fb27cdd9a8d73a8bcb71bf0c4f688073b0833
      EBOOT_SIZE: '29249016'
      CODEGRAPH_ARTIFACT_ID: '10939012869'

    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check -q capstone

      - name: Recover exact eboot and code graph
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/userdata12
          curl --fail --location --retry 4 --retry-delay 2 "$EBOOT_URL" -o build/userdata12/eboot.bin
          test "$(stat -c %s build/userdata12/eboot.bin)" = "$EBOOT_SIZE"
          echo "$EBOOT_SHA256  build/userdata12/eboot.bin" | sha256sum --check --strict
          curl -fsSL --retry 4             -H "Authorization: Bearer $GH_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CODEGRAPH_ARTIFACT_ID}/zip"             -o build/userdata12/codegraph.zip
          unzip -q build/userdata12/codegraph.zip -d build/userdata12/codegraph
          test -f build/userdata12/codegraph/ghidra_code_graph.json.gz

      - name: Probe PS user-data 12 PM4 binding
        run: |
          python tools/d1_ps_userdata12_pm4_probe.py             build/userdata12/eboot.bin             --codegraph build/userdata12/codegraph/ghidra_code_graph.json.gz             --out build/userdata12/d1_ps_userdata12_pm4_probe.json

      - name: Remove executable
        if: always()
        run: rm -f build/userdata12/eboot.bin build/userdata12/codegraph.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-ps-userdata12-pm4-probe
          path: build/userdata12/d1_ps_userdata12_pm4_probe.json
          if-no-files-found: warn
          retention-days: 30
