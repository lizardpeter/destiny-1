name: D1 Oodle LZH real-block oracle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-oodle-lzh-real-block-oracle.yml'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover one small Tower package and verified runtime
        run: |
          set -euo pipefail
          mkdir -p recovered runtime out
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar
          name='ps4_city_tower_destination_024c_5.pkg'
          off=7715401728
          size=1687552
          expected='b404bacccf44a4bf6859bf3b867ae02f5dc840432bdaa081c341439c2ae83311'
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=5,timeout=90)
          got=arc.copy_to(off,size,Path('recovered')/name)
          assert got.lower()==expected
          print('RECOVERED',name,size,got)
          PY
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Extract first resident compressed block and exact decoded oracle
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_oodle_probe import Oodle3, read_pkg_blocks, stored_block
          from d1_pkg_probe import BLOCK_SIZE

          pkg=Path('recovered/ps4_city_tower_destination_024c_5.pkg').resolve()
          _,blocks=read_pkg_blocks(pkg)
          oodle=Oodle3(Path('runtime').resolve())
          chosen=None
          for b in blocks:
              if not b['compressed'] or int(b['patch_id']) != 5:
                  continue
              try:
                  owner,comp=stored_block(pkg,b)
                  dec=oodle.decompress_block(comp)
              except Exception:
                  continue
              if not comp or comp[0] != 0xB7:
                  continue
              chosen=(b,owner,comp,dec)
              break
          if chosen is None:
              raise SystemExit('no resident B7 compressed block decoded')
          b,owner,comp,dec=chosen
          Path('out/d1_lzh_block.comp').write_bytes(comp)
          Path('out/d1_lzh_block.raw').write_bytes(dec)
          meta={
              'block_index':int(b['index']),
              'patch_id':int(b['patch_id']),
              'stored_size':len(comp),
              'raw_size':len(dec),
              'stored_sha1':hashlib.sha1(comp).hexdigest(),
              'stored_sha256':hashlib.sha256(comp).hexdigest(),
              'raw_sha256':hashlib.sha256(dec).hexdigest(),
              'stored_prefix_hex':comp[:128].hex(),
              'raw_prefix_hex':dec[:128].hex(),
              'logical_capacity':BLOCK_SIZE,
          }
          Path('out/meta.json').write_text(json.dumps(meta,indent=2)+'\n')
          print(json.dumps(meta,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: d1-oodle-lzh-real-block-oracle
          path: out/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
