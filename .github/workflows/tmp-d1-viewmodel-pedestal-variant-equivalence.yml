name: Temporary test D1 76-node viewmodel Pedestal motion equivalence

on:
  push:
    paths:
      - '.github/workflows/tmp-d1-viewmodel-pedestal-variant-equivalence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies and 0151
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy scipy pygltflib pyglm
          mkdir -p runtime recovered out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x45190B000 \
            --target ps4_globals_0151_0.pkg --target ps4_globals_0151_1.pkg --target ps4_globals_0151_2.pkg \
            --target ps4_globals_0151_3.pkg --target ps4_globals_0151_4.pkg --target ps4_globals_0151_5.pkg --target ps4_globals_0151_6.pkg \
            --out recovered --manifest out/0151_extract.json --retries 6 --timeout 90
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git tiger-animation-parser
          git -C tiger-animation-parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
      - name: Compare exact Pedestal deltas under both 76/74 pairs
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import io,json,sys,tempfile,math
          import numpy as np
          from pathlib import Path
          from pygltflib import GLTF2,Asset,Scene
          sys.path.insert(0,'tools');sys.path.insert(0,str(Path('tiger-animation-parser').resolve()))
          from d1_entry_extract import EntryReader
          from tag.game_version import Game_Version
          from tag_readers.read_skeleton import read_skeleton
          from tag_readers.read_rig import read_runtime_rig
          from tag_readers.read_animation import read_animation
          from animation_decoding.decode_animation import decode_animation
          from runtime_rig.rig_retarget import rig_retarget
          from animation_export.convert_animation_object_to_local import convert_obj_to_local
          from animation_export.gltf_export import create_armature_hierarchy,add_animation
          from animation_export.enums import Name_Convention
          from d1_gltf_bake_rigid_weapon_motion import read_glb,animation_tracks,source_chain,eval_world,trs_matrix

          PAIRS=[('80AA3CB2','80AA3CB3'),('80AA3CB8','80AA3CB9')]
          CLIPS=['80AA3CD6','80AA3CDA','80AA3CE2','80AA3CE3']; PED='C410084A'
          r=EntryReader(Path('recovered/ps4_globals_0151_6.pkg'),Path('runtime'));by={e['tag_hash'].upper():e for e in r.entries}
          def raw(t):return r.entry(by[t]['index'])
          ver=Game_Version.D1_ROI
          trajectories={}
          for rt,st in PAIRS:
              rig=read_runtime_rig(io.BytesIO(raw(rt)),ver);sk=read_skeleton(io.BytesIO(raw(st)),ver)
              for clip in CLIPS:
                  with tempfile.NamedTemporaryFile() as f:
                      f.write(raw(clip));f.flush();f.seek(0);anim=read_animation(f,ver)
                  dec=decode_animation(anim);ret=rig_retarget(anim,dec,sk,rig);loc=convert_obj_to_local(anim,ret,sk)
                  g=GLTF2(asset=Asset(version='2.0'),scene=0,scenes=[Scene(nodes=[])],nodes=[],meshes=[],skins=[],animations=[],materials=[],textures=[],images=[],samplers=[],buffers=[],bufferViews=[],accessors=[])
                  root,bones=create_armature_hierarchy(g,sk,Name_Convention.FNV1BE);g.scenes[0].nodes.append(root);add_animation(g,bones,loc,Name_Convention.FNV1BE,fps=30);g.animations[-1].name=clip
                  path=Path('out')/f'{st}_{clip}.glb';g.save_binary(str(path))
                  sj,sb=read_glb(path);ped=int(bones[PED]);tracks,times=animation_tracks(sj,sb,sj['animations'][0]);chain=source_chain(sj,ped)
                  mats=[]
                  for t in times:
                      tt,qq,ss=eval_world(sj,chain,tracks,float(t));mats.append(trs_matrix(tt,qq,ss))
                  inv=np.linalg.inv(mats[0]);ds=np.stack([m@inv for m in mats])
                  trajectories[(st,clip)]={'times':np.asarray(times),'deltas':ds,'ped_node':ped}
          rows=[]
          for clip in CLIPS:
              a=trajectories[(PAIRS[0][1],clip)];b=trajectories[(PAIRS[1][1],clip)]
              assert np.array_equal(a['times'],b['times'])
              diff=np.abs(a['deltas']-b['deltas'])
              max_abs=float(diff.max()); frob=float(np.linalg.norm(a['deltas']-b['deltas'],axis=(1,2)).max())
              rows.append({'clip':clip,'samples':len(a['times']),'max_matrix_abs_diff':max_abs,'max_matrix_frobenius_diff':frob,
                           'pedestal_nodes':[a['ped_node'],b['ped_node']], 'equivalent_1e-6':max_abs<1e-6})
          rep={'pairs':PAIRS,'clips':rows,'policy':'Compares source_world(t) @ inverse(source_world(t0)) matrices for Pedestal C410084A after actual decode/retarget under each candidate skeleton/rig.'}
          Path('out/pedestal_variant_equivalence.json').write_text(json.dumps(rep,indent=2)+'\n')
          print(json.dumps(rep,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-viewmodel-pedestal-variant-equivalence
          path: out/pedestal_variant_equivalence.json
          retention-days: 7
          if-no-files-found: error
