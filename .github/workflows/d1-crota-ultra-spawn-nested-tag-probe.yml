name: D1 Crota ultra-spawn nested tag probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-ultra-spawn-nested-tag-probe.yml'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover catalog and runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Probe exact nested tags
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_exact_tag_probe.py \
            --tag-hash 0x8108E679 --tag-hash 0x8108E67A --tag-hash 0x8108E740 \
            --tag-hash 0x809DD961 \
            --tag-hash 0x8108E7D9 --tag-hash 0x8108E7DA --tag-hash 0x8108E7DB --tag-hash 0x8108E7DC \
            --tag-hash 0x8108E7DD --tag-hash 0x8108E7DE --tag-hash 0x8108E7DF --tag-hash 0x8108E7E0 \
            --tag-hash 0x8108E7E1 --tag-hash 0x8108E7E2 --tag-hash 0x8108E7E3 --tag-hash 0x8108E7E4 --tag-hash 0x8108E7E5 \
            --tag-hash 0x8108E742 --tag-hash 0x8108E743 --tag-hash 0x8108E744 --tag-hash 0x80AAB06B \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --min-string 4 \
            -o out/CROTA_ULTRA_SPAWN_NESTED_TAGS.json | tee out/probe_stdout.txt

      - name: Summarize target classes and actor-like references
        run: |
          set -euo pipefail
          python - <<'PY' | tee out/summary.txt
          import json,collections
          d=json.load(open('out/CROTA_ULTRA_SPAWN_NESTED_TAGS.json'))
          assert d['violation_count']==0,d['violations']
          refs=collections.Counter()
          actor=[]
          interesting={'80800734':'s_entity','80801AB5':'s_entity_model','80800861':'EntityResource','808006BD':'skeleton_resource','80802C0E':'animation_control','808005A1':'animation_clip','808008B2':'runtime_rig_discriminator'}
          for e in d['entries']:
              ref=e['entry']['reference']; refs[ref]+=1
              print('TAG',e['tag_hash'],'CLASS',ref,'SIZE',e['payload_size'],'STRINGS',[x['string'] for x in e['printable_strings'][:8]])
              for m in e['aligned_resolved_tags']:
                  tr=m['entry']['reference']
                  if tr in interesting:
                      row=(e['tag_hash'],hex(m['offset']),m['tag_hash'],tr,interesting[tr])
                      actor.append(row); print(' INTERESTING',*row)
          print('SOURCE_CLASS_COUNTS',dict(refs))
          print('INTERESTING_COUNT',len(actor))
          PY
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-ULTRA-SPAWN-NESTED-TAG-PROBE
          path: out/
          retention-days: 30
          if-no-files-found: error
