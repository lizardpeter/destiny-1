name: D1 Spektar Pandion visual exports

on:
  push:
    paths:
      - '.github/workflows/d1-spektr-pandion-visual-exports.yml'
      - 'tools/d1_gltf_stage0_prune.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Download proven Guardian checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q pygltflib
          mkdir -p input/rig input/textured input/stage0 out
          get_artifact () {
            local name="$1" dest="$2" zip="$3"
            local url
            url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=20" \
              | python -c "import json,sys; a=[x for x in json.load(sys.stdin)['artifacts'] if not x['expired'] and x['name']==sys.argv[1]]; assert a,sys.argv[1]; a.sort(key=lambda x:x['created_at'],reverse=True); print(a[0]['archive_download_url'])" "$name")
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$url" -o "$zip"
            unzip -q "$zip" -d "$dest"
          }
          get_artifact 'D1-Spektar-Pandion-Titan-Masculine-FULL-RIGGED-ANIMATED' input/rig input/rig.zip
          get_artifact 'D1-Spektar-Pandion-Titan-Masculine-TEXTURED-RIGGED-ANIMATED' input/textured input/textured.zip
          get_artifact 'd1-spektr-pandion-stage0-draws' input/stage0 input/stage0.zip
          test -f input/rig/SPEKTAR_PANDION_TITAN_MASCULINE_FULL_RIGGED_ANIMATED.glb
          test -f input/textured/SPEKTAR_PANDION_TITAN_MASCULINE_TEXTURED_RIGGED_ANIMATED.glb
          test -f input/stage0/spektar_stage0_draws.json

      - name: Build stage-0-only visual exports
        run: |
          set -euo pipefail
          cp input/rig/SPEKTAR_PANDION_TITAN_MASCULINE_FULL_RIGGED_ANIMATED.glb \
             out/SPEKTAR_PANDION_TITAN_MASCULINE_FORENSIC_69_RANGE_RIGGED_ANIMATED.glb
          cp input/textured/SPEKTAR_PANDION_TITAN_MASCULINE_TEXTURED_RIGGED_ANIMATED.glb \
             out/SPEKTAR_PANDION_TITAN_MASCULINE_FORENSIC_69_RANGE_TEXTURED_RIGGED_ANIMATED.glb

          python tools/d1_gltf_stage0_prune.py \
            input/rig/SPEKTAR_PANDION_TITAN_MASCULINE_FULL_RIGGED_ANIMATED.glb \
            --stage0-report input/stage0/spektar_stage0_draws.json \
            -o out/SPEKTAR_PANDION_TITAN_MASCULINE_STAGE0_28_RANGE_RIGGED_ANIMATED.glb \
            --json out/stage0_rigged_report.json

          python tools/d1_gltf_stage0_prune.py \
            input/textured/SPEKTAR_PANDION_TITAN_MASCULINE_TEXTURED_RIGGED_ANIMATED.glb \
            --stage0-report input/stage0/spektar_stage0_draws.json \
            -o out/SPEKTAR_PANDION_TITAN_MASCULINE_STAGE0_28_RANGE_TEXTURED_RIGGED_ANIMATED.glb \
            --json out/stage0_textured_report.json

          cp input/stage0/spektar_stage0_draws.json out/

      - name: Validate exports
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from pygltflib import GLTF2
          import json, hashlib

          specs = [
            ('SPEKTAR_PANDION_TITAN_MASCULINE_FORENSIC_69_RANGE_RIGGED_ANIMATED.glb', 69),
            ('SPEKTAR_PANDION_TITAN_MASCULINE_FORENSIC_69_RANGE_TEXTURED_RIGGED_ANIMATED.glb', 69),
            ('SPEKTAR_PANDION_TITAN_MASCULINE_STAGE0_28_RANGE_RIGGED_ANIMATED.glb', 28),
            ('SPEKTAR_PANDION_TITAN_MASCULINE_STAGE0_28_RANGE_TEXTURED_RIGGED_ANIMATED.glb', 28),
          ]
          rows=[]
          for name, active_expected in specs:
              p=Path('out')/name
              g=GLTF2().load_binary(str(p))
              active=sum(1 for n in (g.nodes or []) if n.mesh is not None)
              assert active==active_expected,(name,active)
              assert len(g.skins or [])==1 and len(g.skins[0].joints)==67,name
              assert len(g.animations or [])==1,name
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append({'file':name,'bytes':p.stat().st_size,'sha256':h,'active_mesh_nodes':active,
                           'mesh_objects_preserved':len(g.meshes or []),'skin_joints':67,
                           'animation':g.animations[0].name})
          Path('out/EXPORT_MANIFEST.json').write_text(json.dumps(rows,indent=2)+'\n')
          for r in rows: print(r)
          PY
          sha256sum out/*.glb > out/SHA256SUMS.txt

      - name: README
        run: |
          cat > out/README.txt <<'EOF'
          Destiny 1 Rise of Iron - Spektar Pandion Titan visual comparison exports

          BEST FILE TO INSPECT FIRST:
          SPEKTAR_PANDION_TITAN_MASCULINE_STAGE0_28_RANGE_TEXTURED_RIGGED_ANIMATED.glb

          Stage0 files:
          - 28 real Bungie normal-draw ranges only.
          - exact 67-joint Guardian skin preserved.
          - exact retail 324-frame animation preserved.
          - textured file preserves the already-proven retail texture-plate binding.

          Forensic 69-range files:
          - preserve every deduplicated serialized geometry range from the prior proof export.
          - useful only as an A/B comparison against the corrected Bungie stage-0 selection.
          - not the preferred visual representation.

          Important current limitation:
          The texture-plate export has exact retail albedo/normal/GStack plate provenance, but the newly
          source-closed per-vertex dye-detail multiplier and final native dye/GStack shader recreation
          are not yet baked into this checkpoint. That is the next exporter pass.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: D1-Spektar-Pandion-Guardian-VISUAL-EXPORTS
          path: out/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
