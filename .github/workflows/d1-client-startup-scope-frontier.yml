name: D1 client startup scope frontier

on:
  workflow_dispatch:
  push:
    branches: [main, d1-crota-source-semantics-v1]
    paths:
      - 'tools/d1_remote_client_startup_globals_probe.py'
      - '.github/workflows/d1-client-startup-scope-frontier.yml'

permissions: {contents: read, actions: read}

env:
  GH_TOKEN: '${{ github.token }}'
  LINOODLE_SKIP_DLLMAIN: '1'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover current exact global activity index and Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p input/index input/catalog runtime out/payloads
          index_run="$(gh run list --workflow d1-global-activity-index.yml --status success --limit 1 --json databaseId,headSha --jq '.[0].databaseId')"
          test -n "$index_run"
          gh run download "$index_run" -n d1-global-activity-index -D input/index
          test -f input/index/D1_CURRENT_ACTIVITY_INDEX.json
          python - <<'PY'
          import hashlib,json
          src=json.load(open('input/index/D1_CURRENT_ACTIVITY_INDEX.json'))
          assert src['status']=='D1_REMOTE_ACTIVITY_INDEX_COMPLETE',src.get('violations')
          assert src['physical_member_count']==1275,src
          assert src['package_family_count']==337==src['current_package_count'],src
          assert not src['violations'],src['violations']
          rows=sum(len(v) for v in src['package_families'].values())
          assert rows==1275,(rows,src['physical_member_count'])
          out={'schema_version':1,'families':src['package_families'],
               'source_activity_index_sha256':hashlib.sha256(open('input/index/D1_CURRENT_ACTIVITY_INDEX.json','rb').read()).hexdigest(),
               'source_package_list_sha256':src['source']['package_list_sha256']}
          json.dump(out,open('input/catalog/D1_CURRENT_MEMBER_CATALOG.json','w'),indent=2)
          print('CURRENT_MEMBER_CATALOG_EXACT','FAMILIES',len(out['families']),'MEMBERS',rows,
                'INDEX_SHA',out['source_activity_index_sha256'])
          PY
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Trace client startup globals to exact D1 scope objects
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_client_startup_globals_probe.py
          python tools/d1_remote_client_startup_globals_probe.py \
            --member-catalog input/catalog/D1_CURRENT_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --max-depth 3 --max-nodes 512 --dump-dir out/payloads \
            -o out/D1_CLIENT_STARTUP_GLOBALS_SCOPE_FRONTIER.json | tee out/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/D1_CLIENT_STARTUP_GLOBALS_SCOPE_FRONTIER.json'))
          assert d['status']=='D1_CLIENT_STARTUP_GLOBALS_SCOPE_FRONTIER_EXACT',d['violations']
          assert d['gates']['client_startup_root_recovered'] is True,d['gates']
          assert d['gates']['d1_scope_class_reached'] is True,d['gates']
          universe={f'80AE40{x:02X}' for x in range(0x0E,0x25)}
          reached=set(d['scope_hashes'])
          assert reached,reached
          assert reached <= universe,(sorted(reached),sorted(universe))
          print('CLIENT_STARTUP_SCOPE_FRONTIER_GREEN',d['walk'],
                'REACHED_SCOPES',sorted(reached),
                'GLOBAL_SCOPE_UNIVERSE_MATCH_COUNT',len(reached),
                'UNIVERSE_SIZE',len(universe))
          print('CLIENT_STARTUP_SCOPE_API13_BINDING','WITHHELD_NO_SHADER_BINDING_EDGE_YET')
          PY
      - name: Persist hashes
        if: always()
        run: find out -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CLIENT-STARTUP-SCOPE-FRONTIER
          path: out/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
