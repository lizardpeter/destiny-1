name: D1 Tower highlighted architecture vertex shader

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-highlighted-vertex-shader.yml'
      - 'tools/d1_world_shader_extract.py'

permissions:
  contents: read

jobs:
  shader:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact current 024c family and runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports shader disasm
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar
          rows=[
            ('ps4_city_tower_destination_024c_0.pkg',7542949376,137527296,'ffb2e3cbb9777956384063e3c0fc5636200df51ae82a35a6aad06850dbf1fff2'),
            ('ps4_city_tower_destination_024c_1.pkg',7680477184,12226560,'21e75033fcba2f85b5d22b7377a7122c5135ce2c3f10f8453fc54a1d304c10f8'),
            ('ps4_city_tower_destination_024c_2.pkg',7692704256,13574144,'681349e0d32c213cae4bdef839bee8a6fa5aa3a5989c4a5344ee342cbe9d6e45'),
            ('ps4_city_tower_destination_024c_3.pkg',7706278912,2134016,'c6846bbe0bdf9aaf9ba194ed8a2a3b2c7e26178bd79218134e909fa460ebcaef'),
            ('ps4_city_tower_destination_024c_4.pkg',7708413440,6987776,'12dfe5e7dc65a8477d5ceabba5bb921b07c83110151a57b86a52ba3eb7d82018'),
            ('ps4_city_tower_destination_024c_5.pkg',7715401728,1687552,'b404bacccf44a4bf6859bf3b867ae02f5dc840432bdaa081c341439c2ae83311'),
          ]
          listed={Path(x.strip()).name for x in Path('reports/packages.txt').read_text().splitlines() if x.strip()}
          cur=sorted(n for n in listed if '_024c_' in n.lower()); exp=sorted(r[0] for r in rows)
          if cur!=exp: raise SystemExit(f'024c family mismatch current={cur} expected={exp}')
          arc=SplitHttpTar([f'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=120)
          for name,off,size,sha in rows:
              got=arc.copy_to(off,size,Path('recovered')/name)
              if got.lower()!=sha: raise SystemExit(f'{name}: sha mismatch {got} != {sha}')
              print('RECOVERED',name,size,got,flush=True)
          Path('reports/minimal_shader_manifest.json').write_text(json.dumps({'pixel_shader_frequency':{'80CA0CB7':1}})+'\n')
          PY
      - name: Extract exact native shader 80CA0CB7
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_shader_extract.py "${args[@]}" --runtime runtime \
            --manifest reports/minimal_shader_manifest.json --shader 80CA0CB7 \
            --out-dir shader --report reports/vertex_shader_extract.json
          test -f shader/PS_80CA0CB7_gcn.bin
      - name: Build pinned CLRX and disassemble
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/CLRX/CLRX-mirror.git clrx
          git -C clrx checkout --quiet fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df
          cmake -S clrx -B clrx/build -DCMAKE_BUILD_TYPE=Release -DNO_CLWRAPPER=ON -DBUILD_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_DOCUMENTATION=OFF >/dev/null
          cmake --build clrx/build --target clrxdisasm -j2 >/dev/null
          exe="$(find clrx/build -type f -name clrxdisasm -perm -111 | head -1)"
          "$exe" --raw --gpuType=GFX700 --hexcode shader/PS_80CA0CB7_gcn.bin > disasm/VS_80CA0CB7.s 2> disasm/VS_80CA0CB7.stderr
          test ! -s disasm/VS_80CA0CB7.stderr
          grep -q 's_endpgm' disasm/VS_80CA0CB7.s
          cp disasm/VS_80CA0CB7.s reports/VS_80CA0CB7.s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-highlighted-vertex-shader
          path: |
            reports/
            shader/
            disasm/
          retention-days: 14
          compression-level: 6
