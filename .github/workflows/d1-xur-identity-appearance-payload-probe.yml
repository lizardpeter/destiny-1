name: D1 Xur identity appearance payload probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-identity-appearance-payload-probe.yml'
      - 'tools/d1_remote_tag_payload_dump.py'
      - 'tools/d1_remote_global_stringhash_resolve.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover catalog and runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out/payloads out/reports
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Dump exact identity and representative SEntity payloads
        run: |
          set -euo pipefail
          python tools/d1_remote_tag_payload_dump.py \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            --tag 80C880BA --tag 80C880BE --tag 80C8821E --tag 80C88222 --tag 80C8840F --tag 80C88413 --tag 80C885C6 \
            --tag 80C880B4 --tag 80C880B5 --tag 80C88216 --tag 80C88217 --tag 80C883CE --tag 80C883D0 \
            --tag 80C7ACC8 --tag 80C885AA --tag 80C88CE2 \
            --out-dir out/payloads --report out/reports/XUR_IDENTITY_PAYLOADS.json
      - name: Byte-diff identity-specific 80802304 to 808029A2 family
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,struct
          tags=['80C880BA','80C880BE','80C8821E','80C88222','80C8840F','80C88413','80C885C6']
          blobs={h:(Path('out/payloads')/(h+'.bin')).read_bytes() for h in tags}; sizes={h:len(b) for h,b in blobs.items()}; n=min(sizes.values())
          varying=[off for off in range(n) if len({b[off] for b in blobs.values()})>1]
          runs=[]
          if varying:
              s=p=varying[0]
              for x in varying[1:]:
                  if x==p+1:p=x
                  else:runs.append([s,p]);s=p=x
              runs.append([s,p])
          words=[]
          for off in range(0,n-3,4):
              vals={h:f'{struct.unpack_from("<I",b,off)[0]:08X}' for h,b in blobs.items()}
              if len(set(vals.values()))>1: words.append({'offset':off,'values':vals})
          tails={h:{'offset':n,'bytes':len(b)-n,'hex':b[n:].hex()} for h,b in blobs.items() if len(b)>n}
          rep={'schema_version':2,'status':'D1_XUR_IDENTITY_PAYLOAD_BYTE_DIFF_COMPLETE','sizes':sizes,'common_prefix_length':n,'tags':tags,'varying_byte_count':len(varying),'varying_runs':runs,'varying_aligned_u32':words,'extra_tails':tails}
          Path('out/reports/XUR_IDENTITY_BYTE_DIFF.json').write_text(json.dumps(rep,indent=2)+'\n')
          print('IDENTITY_DIFF','sizes',sizes,'common_prefix',n,'varying_bytes',len(varying),'varying_u32',len(words))
          for w in words: print(f"+0x{w['offset']:03X}",w['values'])
          PY
      - name: Compare seven identity SEntity payloads and Xur duplicate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,struct
          tags=['80C880B4','80C880B5','80C88216','80C88217','80C883CE','80C883D0','80C885AA','80C7ACC8']
          blobs={h:(Path('out/payloads')/(h+'.bin')).read_bytes() for h in tags}; sizes={h:len(b) for h,b in blobs.items()}; n=min(sizes.values())
          # Aligned u32 census is intentionally broad. Exact FileHash validation is a separate step.
          words=[]
          for off in range(0,n-3,4):
              vals={h:f'{struct.unpack_from("<I",b,off)[0]:08X}' for h,b in blobs.items()}
              if len(set(vals.values()))>1: words.append({'offset':off,'values':vals})
          x1=blobs['80C885AA'];x2=blobs['80C7ACC8']; xur_diff=[off for off in range(min(len(x1),len(x2))) if x1[off]!=x2[off]]
          rep={'schema_version':1,'status':'D1_XUR_SHARED_MODEL_SENTITY_DIFF_COMPLETE','sizes':sizes,'representatives':tags,'varying_aligned_u32':words,'xur_duplicate_varying_byte_count':len(xur_diff),'xur_duplicate_varying_offsets':xur_diff}
          Path('out/reports/XUR_SENTITY_FAMILY_DIFF.json').write_text(json.dumps(rep,indent=2)+'\n')
          print('SENTITY_DIFF','sizes',sizes,'varying_u32',len(words),'xur_pair_varying_bytes',len(xur_diff))
          PY
      - name: Resolve identity-family inline StringHashes
        run: |
          set -euo pipefail
          python tools/d1_remote_global_stringhash_resolve.py \
            --string-hash 080760B4 --string-hash 6BC7A0F5 --string-hash 6C94ED20 --string-hash D745F67C \
            --string-hash FE7C7BA3 --string-hash 2207B0A3 --string-hash A6ADA445 --string-hash 270BACAF --string-hash 811C9DC5 \
            --global-package-id 0x0151 --global-package-id 0x0154 --global-package-id 0x0155 --global-package-id 0x0156 \
            --global-package-id 0x0157 --global-package-id 0x0158 --global-package-id 0x0169 --global-package-id 0x018D --global-package-id 0x01E3 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            -o out/reports/XUR_IDENTITY_STRINGS.json
          python - <<'PY'
          import json
          d=json.load(open('out/reports/XUR_IDENTITY_STRINGS.json'))
          print('IDENTITY_STRINGS_UNRESOLVED',d['unresolved_target_hashes'])
          for h,rows in d['resolved'].items():
              vals=[x.get('string') for x in rows if x.get('string')]
              if vals: print(h,vals)
          PY
          sha256sum out/payloads/*.bin out/reports/*.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-XUR-IDENTITY-APPEARANCE-PAYLOAD-PROBE
          path: out/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
