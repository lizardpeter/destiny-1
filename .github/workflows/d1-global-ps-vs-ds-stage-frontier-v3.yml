name: D1 global PS VS DS stage frontier v3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-global-ps-vs-ds-stage-frontier-v3.yml'
      - 'tools/d1_gcn_shader_corpus_stage_frontier_v3.py'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '34306771519'
  SOURCE_RUN_HEAD_SHA: 'bc2fec2f8366b32d60bb0a5b066bad8fbb5fd7ac'
  SOURCE_ARTIFACT_NAME: 'D1-GLOBAL-PS-VS-DS-STRUCTURAL-V3'

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Self-test exact three-stage stage frontier
        run: |
          set -euo pipefail
          python tools/d1_gcn_shader_corpus_stage_frontier_v3.py --self-test

      - name: Wait for exact PS VS DS structural checkpoint
        run: |
          set -euo pipefail
          mkdir -p source out
          completed=''
          for _ in $(seq 1 720); do
            curl -fsSL --retry 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
              -o source/run.json
            read -r status conclusion head_sha < <(python - <<'PY'
          import json
          d=json.load(open('source/run.json'))
          print(d.get('status',''), d.get('conclusion') or '-', d.get('head_sha',''))
          PY
            )
            echo "SOURCE_RUN status=$status conclusion=$conclusion head_sha=$head_sha"
            test "$head_sha" = "$SOURCE_RUN_HEAD_SHA"
            if test "$status" = completed; then completed=1; break; fi
            sleep 30
          done
          test "$completed" = 1
          python - <<'PY'
          import json,os
          d=json.load(open('source/run.json'))
          assert d['head_sha']==os.environ['SOURCE_RUN_HEAD_SHA'],d['head_sha']
          assert d.get('conclusion')=='success',d.get('conclusion')
          PY

      - name: Download and verify exact structural artifact
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            -o source/artifacts.json
          artifact_id=$(python - <<'PY'
          import json,os
          d=json.load(open('source/artifacts.json'))
          rows=[x for x in d.get('artifacts',[]) if x.get('name')==os.environ['SOURCE_ARTIFACT_NAME'] and not x.get('expired')]
          assert len(rows)==1,[(x.get('id'),x.get('name')) for x in d.get('artifacts',[])]
          print(rows[0]['id'])
          PY
          )
          echo "$artifact_id" > source/artifact_id.txt
          curl -fsSL --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o source/structural.zip
          sha256sum source/structural.zip | tee source/structural_zip.sha256
          mkdir -p source/structural
          unzip -q source/structural.zip -d source/structural
          (
            cd source/structural
            sha256sum --check --strict out/SHA256SUMS.txt
          )
          test -s source/structural/out/D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS_PS_VS_DS.json
          test -s source/structural/out/D1_GCN_STRUCTURAL_PARSE_ACCOUNTING_PS_VS_DS.json
          test -d source/structural/work/ir

      - name: Build exact PS VS DS structural frontier
        run: |
          set -euo pipefail
          python tools/d1_gcn_shader_corpus_stage_frontier_v3.py \
            --census source/structural/out/D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS_PS_VS_DS.json \
            --ir-dir source/structural/work/ir \
            --accounting-gate source/structural/out/D1_GCN_STRUCTURAL_PARSE_ACCOUNTING_PS_VS_DS.json \
            -o out/D1_GCN_SHADER_CORPUS_STAGE_FRONTIER_PS_VS_DS.json \
            | tee out/stage_frontier_stdout.txt

      - name: Freeze exact three-stage prioritization frontier
        run: |
          set -euo pipefail
          cp source/run.json out/SOURCE_WORKFLOW_RUN.json
          cp source/artifact_id.txt out/SOURCE_ARTIFACT_ID.txt
          cp source/structural_zip.sha256 out/SOURCE_ARTIFACT_ZIP_SHA256.txt
          python - <<'PY'
          import json
          d=json.load(open('out/D1_GCN_SHADER_CORPUS_STAGE_FRONTIER_PS_VS_DS.json'))
          assert d['status']=='D1_GCN_SHADER_CORPUS_STAGE_FRONTIER_PS_VS_DS_EXACT',d['violations'][:50]
          assert not d['violations']
          assert d['coverage']['exact_unique_gcn_programs']==26464,d['coverage']
          assert d['coverage']['stage_unique_program_counts']=={'PS':18375,'VS':8069,'DS':20},d['coverage']
          assert d['coverage']['multi_stage_exact_code_sha_count']==0,d['coverage']
          print('COVERAGE',json.dumps(d['coverage'],sort_keys=True))
          print('STAGE_EXCLUSIVE_OPCODES',json.dumps(d['cross_stage']['stage_exclusive_opcodes'],sort_keys=True))
          print('PAIRWISE',json.dumps(d['cross_stage']['pairwise'],sort_keys=True))
          print('ALL_THREE_COMMON_OPCODE_COUNT',d['cross_stage']['all_three_common_opcode_count'])
          print('NOVEL_OPCODE_COUNT',d['frontier_vs_808ee505_baseline']['novel_opcode_count'])
          print('NOVEL_FORM_COUNT',d['frontier_vs_808ee505_baseline']['novel_structural_form_count'])
          print('PROMOTION_QUEUE_TOP30',json.dumps(d['frontier_vs_808ee505_baseline']['opcode_promotion_queue'][:30],sort_keys=True))
          PY
          sha256sum out/D1_GCN_SHADER_CORPUS_STAGE_FRONTIER_PS_VS_DS.json > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-GLOBAL-PS-VS-DS-STAGE-FRONTIER-V3
          path: out/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
