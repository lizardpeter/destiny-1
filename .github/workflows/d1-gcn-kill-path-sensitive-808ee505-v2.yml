name: D1 GCN path-sensitive kill 808EE505 v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-gcn-kill-path-sensitive-808ee505-v2.yml'
      - 'tools/d1_gcn_cfg_implicit_status.py'
      - 'tools/d1_gcn_export_kill_mask_v2.py'
      - 'tools/d1_gcn_renderer_program_add_kill_v2.py'

env:
  RENDERER_ARTIFACT_ID: '10070568410'
  RENDERER_ARTIFACT_ZIP_SHA256: '48ad6e237467d89c2a91d5eb01bd549d95105eaa451c9171f74f996656e00056'
  SOURCE_ARTIFACT_ID: '10063870487'
  SOURCE_ARTIFACT_ZIP_SHA256: 'aaffc5c8f7c2270505face5c1d78de211e6bcb4612546207b0930cf16f04bb63'
  LLVM_CONTROL_REV: '14e941a0566ae06e982c5d8ddd085697c48fd413'
  GEM5_REV: 'f5c5a6e390f55dd5984977815bf9d0bd05da6945'

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover immutable renderer and source checkpoints
        run: |
          set -euo pipefail
          mkdir -p input/renderer input/source input/upstream out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RENDERER_ARTIFACT_ID}/zip" -o input/renderer.zip
          echo "${RENDERER_ARTIFACT_ZIP_SHA256}  input/renderer.zip" | sha256sum --check --strict
          unzip -q input/renderer.zip -d input/renderer
          test -f input/renderer/D1_80D777B6_808EE505_RENDERER_PROGRAM.json

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" -o input/source.zip
          echo "${SOURCE_ARTIFACT_ZIP_SHA256}  input/source.zip" | sha256sum --check --strict
          unzip -q input/source.zip -d input/source
          for f in PS_808EE505.s target_gcn_image_usage.json target_material_stage.json; do test -f "input/source/$f"; done

          curl -fsSL --retry 4 "https://raw.githubusercontent.com/llvm/llvm-project/${LLVM_CONTROL_REV}/llvm/lib/Target/AMDGPU/SOPInstructions.td" -o input/upstream/SOPInstructions.td
          curl -fsSL --retry 4 "https://raw.githubusercontent.com/gem5/gem5/${GEM5_REV}/src/arch/amdgpu/vega/insts/sop1.cc" -o input/upstream/gem5_sop1.cc
          curl -fsSL --retry 4 "https://raw.githubusercontent.com/gem5/gem5/${GEM5_REV}/src/arch/amdgpu/vega/insts/sopp.cc" -o input/upstream/gem5_sopp.cc
          curl -fsSL --retry 4 "https://raw.githubusercontent.com/gem5/gem5/${GEM5_REV}/src/arch/amdgpu/vega/insts/vop2.cc" -o input/upstream/gem5_vop2.cc

      - name: Verify frozen 232 instruction renderer boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('input/renderer/D1_80D777B6_808EE505_RENDERER_PROGRAM.json'))
          assert d['status']=='D1_GCN_RENDERER_PROGRAM_IR_EXACT_PARTIAL' and not d['violations'],d
          p=d['program'];c=p['coverage']
          assert p['material']=='80D777B6' and p['pixel_shader']=='808EE505' and p['instruction_count']==456
          assert c['primary_resolution_counts']=={
            'CONTROL_EXACT':16,'EXPRESSION_EXACT':161,'INPUT_PROVENANCE_EXACT':19,
            'RECURRENCE_EXACT':36,'STRUCTURAL_ONLY':224},c
          assert c['exact_nonstructural_instruction_count']==232
          assert p['instruction_resolution'][335]['primary_resolution']=='STRUCTURAL_ONLY'
          assert p['instruction_resolution'][338]['primary_resolution']=='STRUCTURAL_ONLY'
          print('FROZEN_RENDERER_232_VERIFIED')
          PY

      - name: Rebuild exact control semantics and structural IR
        run: |
          set -euo pipefail
          python tools/d1_gcn_cfg_ir_v2.py \
            --disasm input/source/PS_808EE505.s --shader 808EE505 \
            --image-usage input/source/target_gcn_image_usage.json \
            -o out/PS_808EE505_STRUCTURAL_IR_V2.json
          python tools/d1_gcn_control_semantics_proof.py \
            --llvm-sop input/upstream/SOPInstructions.td \
            --gem5-sop1 input/upstream/gem5_sop1.cc \
            --gem5-sopp input/upstream/gem5_sopp.cc \
            --gem5-vop2 input/upstream/gem5_vop2.cc \
            --llvm-revision "$LLVM_CONTROL_REV" --gem5-revision "$GEM5_REV" \
            -o out/GCN_CONTROL_SEMANTICS.json
          python tools/d1_gcn_cfg_implicit_status.py \
            --ir out/PS_808EE505_STRUCTURAL_IR_V2.json \
            --control-semantics out/GCN_CONTROL_SEMANTICS.json \
            -o out/PS_808EE505_STRUCTURAL_IR_V3.json
          python - <<'PY'
          import json
          d=json.load(open('out/PS_808EE505_STRUCTURAL_IR_V3.json'))
          assert d['status']=='D1_GCN_STRUCTURAL_IR_COMPLETE' and d['schema_version']>=3
          assert 'scc' in d['instructions'][337]['defs']
          assert d['instructions'][338]['uses']==['scc']
          assert d['instructions'][338]['branch_target_label']=='.L2140_0'
          assert any(x['instruction']==337 and x['opcode']=='s_andn2_b64' for x in d['implicit_status_destinations'])
          print('IMPLICIT_SCC_DEF_USE_CLOSED')
          PY

      - name: Prove path-sensitive persistent kill
        run: |
          set -euo pipefail
          python tools/d1_gcn_export_kill_mask_v2.py \
            --ir out/PS_808EE505_STRUCTURAL_IR_V3.json \
            --stage input/source/target_material_stage.json \
            --control-semantics out/GCN_CONTROL_SEMANTICS.json \
            -o out/PS_808EE505_EXPORT_KILL_MASK_V2.json
          python - <<'PY'
          import json
          d=json.load(open('out/PS_808EE505_EXPORT_KILL_MASK_V2.json'))
          assert d['status']=='D1_GCN_EXPORT_KILL_MASK_PATH_SENSITIVE_COMPLETE' and not d['violations'],d
          k=d['contracts'][0]
          assert k['predicate']['arithmetic_instruction']==335
          assert k['kill_instruction']==337
          assert k['empty_mask_branch']=={
            'instruction':338,'source_scc_instruction':337,
            'condition':'updated persistent_export_mask == 0',
            'target_label':'.L2140_0','target_instruction':443,'fallthrough_instruction':339}
          paths={x['instruction']:x for x in k['export_path_relations']}
          assert paths[449]['vm'] is False
          assert paths[449]['nonempty_mask_path']['exec_relation']=='WQM_OF_MASKED_EXEC'
          assert paths[449]['empty_mask_branch_path']['exec_relation']=='PRE_PATH_EXEC_UNCHANGED'
          assert paths[449]['kill_mask_binding']=='VM_FALSE_EXEC_EFFECT_WITHHELD'
          assert paths[454]['vm'] is True
          assert paths[454]['nonempty_mask_path']['exec_relation']=='DIRECT_MOV_MASK'
          assert paths[454]['empty_mask_branch_path']['exec_relation']=='DIRECT_MOV_MASK'
          assert paths[454]['kill_mask_binding']=='DIRECT_VALID_MASK_ON_ALL_PATHS'
          assert k['directly_mask_governed_exports']==[{
            'instruction':454,'target':'mrt0','vm':True,'binding':'DIRECT_VALID_MASK_ON_ALL_PATHS'}]
          print('PATH_SENSITIVE_KILL_CLOSED')
          PY

      - name: Selectively upgrade renderer program
        run: |
          set -euo pipefail
          python tools/d1_gcn_renderer_program_add_kill_v2.py \
            --program input/renderer/D1_80D777B6_808EE505_RENDERER_PROGRAM.json \
            --kill-v2 out/PS_808EE505_EXPORT_KILL_MASK_V2.json \
            --ir-implicit out/PS_808EE505_STRUCTURAL_IR_V3.json \
            -o out/D1_80D777B6_808EE505_RENDERER_PROGRAM.json
          python - <<'PY'
          import json
          d=json.load(open('out/D1_80D777B6_808EE505_RENDERER_PROGRAM.json'))
          assert d['status']=='D1_GCN_RENDERER_PROGRAM_IR_EXACT_PARTIAL' and not d['violations'],d
          p=d['program'];c=p['coverage'];counts=c['primary_resolution_counts']
          assert counts=={'CONTROL_EXACT':18,'EXPRESSION_EXACT':161,'INPUT_PROVENANCE_EXACT':19,'RECURRENCE_EXACT':36,'STRUCTURAL_ONLY':222},counts
          assert c['exact_nonstructural_instruction_count']==234
          assert c['kill_v2_promoted_instructions']==[335,338]
          assert p['instruction_resolution'][335]['primary_resolution']=='CONTROL_EXACT'
          assert p['instruction_resolution'][338]['primary_resolution']=='CONTROL_EXACT'
          assert 'PERSISTENT_EXPORT_KILL_PREDICATE_ARITHMETIC' in p['instruction_resolution'][335]['evidence_tags']
          assert 'PERSISTENT_EXPORT_KILL_EMPTY_MASK_BRANCH' in p['instruction_resolution'][338]['evidence_tags']
          ex={x['instruction']:x for x in p['terminal_mrt_expression']['exports']}
          assert 'governed_kill' not in ex[449] and ex[449]['kill_path_relation']['kill_mask_binding']=='VM_FALSE_EXEC_EFFECT_WITHHELD'
          assert 'governed_kill' not in ex[454] and ex[454]['kill_path_relation']['kill_mask_binding']=='DIRECT_VALID_MASK_ON_ALL_PATHS'
          spans=[(x['start_instruction'],x['end_instruction']) for x in c['structural_only_spans']]
          expected=[
            (0,0),(2,5),(7,20),(23,32),(35,57),(60,104),(106,106),(108,148),
            (191,193),(195,198),(201,205),(208,228),(230,263),(329,331),(334,334),
            (342,342),(373,374),(386,386),(391,391),(397,397),(401,401),(416,416),
            (418,418),(444,444),(450,450),(455,455)]
          assert spans==expected,(spans,expected)
          print('RENDERER_KILL_V2_JOIN_CLOSED',counts,'exact_nonstructural',c['exact_nonstructural_instruction_count'])
          PY
          sha256sum out/*.json > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-GCN-808EE505-RENDERER-PROGRAM-KILL-V2
          path: out/
          retention-days: 30
          if-no-files-found: error
