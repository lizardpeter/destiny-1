name: D1 Crota articulated texture frontier selective reuse v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_COMMIT: 1f8d971a730c4af0dc335a5359753cf42fb6464a
  SOURCE_ARTIFACT_ID: '10024452879'
  SOURCE_ARTIFACT_SHA256: 3e317ef6538c7fc8e64e95fc372d63d140dff0f893bb34d121fb9c5afb530dd5

jobs:
  inspect-current-compatible-visual-layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Prove visual layer producer compatibility
        run: |
          set -euo pipefail
          files=(
            tools/d1_activity_entity_model_plan.py
            tools/d1_remote_activity_model_visual_dependency_closure.py
            tools/d1_remote_activity_model_material_bindings.py
            tools/d1_activity_selected_material_plan.py
            tools/d1_remote_activity_material_dependency_closure.py
            tools/d1_remote_activity_texture_export.py
            tools/d1_material_decode.py
            tools/d1_texture_export.py
            tools/d1_dds_to_png.py
            tools/d1_filehash.py
            tools/d1_remote_entity_dependency_closure.py
            tools/d1_remote_entity_dependency_closure_universal.py
          )
          python - <<'PY'
          import hashlib, json, os, subprocess
          files='''tools/d1_activity_entity_model_plan.py
tools/d1_remote_activity_model_visual_dependency_closure.py
tools/d1_remote_activity_model_material_bindings.py
tools/d1_activity_selected_material_plan.py
tools/d1_remote_activity_material_dependency_closure.py
tools/d1_remote_activity_texture_export.py
tools/d1_material_decode.py
tools/d1_texture_export.py
tools/d1_dds_to_png.py
tools/d1_filehash.py
tools/d1_remote_entity_dependency_closure.py
tools/d1_remote_entity_dependency_closure_universal.py'''.splitlines()
          src=os.environ['SOURCE_COMMIT']
          rows=[]
          for f in files:
              old=subprocess.check_output(['git','show',f'{src}:{f}'])
              cur=open(f,'rb').read()
              oh=hashlib.sha256(old).hexdigest(); ch=hashlib.sha256(cur).hexdigest()
              rows.append({'file':f,'source_sha256':oh,'current_sha256':ch,'match':oh==ch})
          bad=[r for r in rows if not r['match']]
          out={'schema':'d1_selective_checkpoint_compatibility/v1','source_commit':src,'current_commit':os.environ['GITHUB_SHA'],'rows':rows,'compatible':not bad,'mismatches':bad}
          open('COMPATIBILITY.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if bad: raise SystemExit('visual layer is stale; selective reuse forbidden')
          PY

      - name: Download pinned compatible checkpoint and extract manifests only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o checkpoint.zip
          echo "${SOURCE_ARTIFACT_SHA256}  checkpoint.zip" | sha256sum --check --strict
          unzip -l checkpoint.zip | sed -n '1,160p' > ZIP_CONTENTS_HEAD.txt
          mkdir -p inspect
          for f in \
            crota_all_articulated_model_plan.json \
            crota_all_articulated_visual_closure.json \
            crota_all_articulated_material_bindings.json \
            crota_all_articulated_selected_material_plan.json \
            crota_all_articulated_material_dependencies.json \
            textures/texture_export_manifest.json; do
            unzip -p checkpoint.zip "$f" > "inspect/$(basename "$f")"
            test -s "inspect/$(basename "$f")"
          done

      - name: Isolate exact texture violation and dependency provenance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('inspect')
          model=json.load(open(p/'crota_all_articulated_model_plan.json'))
          matplan=json.load(open(p/'crota_all_articulated_selected_material_plan.json'))
          deps=json.load(open(p/'crota_all_articulated_material_dependencies.json'))
          tex=json.load(open(p/'texture_export_manifest.json'))
          violations=tex.get('violations') or []
          by_tex={}
          rows=tex.get('textures') or []
          if isinstance(rows,dict):
              by_tex={str(k).upper():v for k,v in rows.items()}
          else:
              for r in rows:
                  h=str(r.get('texture') or r.get('tag_hash') or '').upper()
                  if h: by_tex[h]=r
          bad_tags=[]
          for v in violations:
              for k in ('texture','tag_hash','hash'):
                  if v.get(k): bad_tags.append(str(v[k]).upper()); break
          detail={h:by_tex.get(h) for h in dict.fromkeys(bad_tags)}
          out={
            'schema':'d1_crota_articulated_texture_frontier/v1',
            'source_checkpoint_artifact_id':10024452879,
            'model_count':model.get('model_count'),
            'selected_material_count':matplan.get('unique_material_count'),
            'material_dependency_texture_count':deps.get('unique_texture_count'),
            'texture_status':tex.get('status'),
            'texture_count':tex.get('texture_count') or tex.get('unique_texture_count'),
            'dds_file_count':tex.get('dds_file_count'),
            'png_file_count':tex.get('png_file_count'),
            'violation_count':len(violations),
            'violations':violations,
            'bad_texture_rows':detail,
          }
          open('CROTA_ARTICULATED_TEXTURE_FRONTIER.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          assert out['model_count']==94
          assert out['selected_material_count']==683
          assert out['material_dependency_texture_count']==394
          assert len(violations)==1
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: D1-CROTA-ARTICULATED-TEXTURE-FRONTIER-V1
          path: |
            COMPATIBILITY.json
            CROTA_ARTICULATED_TEXTURE_FRONTIER.json
            inspect/texture_export_manifest.json
            ZIP_CONTENTS_HEAD.txt
          retention-days: 30
