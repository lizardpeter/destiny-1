name: D1 Tower static-map decal binary census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-static-map-decal-census.yml'
      - 'tools/d1_tower_static_map_decal_validate.py'
      - 'evidence/d1_tower_map_resource_chain_census.json'

permissions:
  contents: read

jobs:
  validate-decals:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered validation reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Direct-range recover exact 024c and 0250 package families
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar
          members=[
            ('ps4_city_tower_destination_024c_0.pkg',7542949376,137527296,'ffb2e3cbb9777956384063e3c0fc5636200df51ae82a35a6aad06850dbf1fff2'),
            ('ps4_city_tower_destination_024c_1.pkg',7680477184,12226560,'21e75033fcba2f85b5d22b7377a7122c5135ce2c3f10f8453fc54a1d304c10f8'),
            ('ps4_city_tower_destination_024c_2.pkg',7692704256,13574144,'681349e0d32c213cae4bdef839bee8a6fa5aa3a5989c4a5344ee342cbe9d6e45'),
            ('ps4_city_tower_destination_024c_3.pkg',7706278912,2134016,'c6846bbe0bdf9aaf9ba194ed8a2a3b2c7e26178bd79218134e909fa460ebcaef'),
            ('ps4_city_tower_destination_024c_4.pkg',7708413440,6987776,'12dfe5e7dc65a8477d5ceabba5bb921b07c83110151a57b86a52ba3eb7d82018'),
            ('ps4_city_tower_destination_024c_5.pkg',7715401728,1687552,'b404bacccf44a4bf6859bf3b867ae02f5dc840432bdaa081c341439c2ae83311'),
            ('ps4_city_tower_destination_0250_0.pkg',7882616320,294875136,'beb269a2673f1106e2eff20ff577d0221d7fa56a8b71f5f8763cf34272114b32'),
            ('ps4_city_tower_destination_0250_1.pkg',8177491968,17983488,'87904a97ce9899305b6bdba9df960d220749b3b2398c4ba8bd97e6efb8f81f91'),
            ('ps4_city_tower_destination_0250_2.pkg',8195475968,11143168,'7543c1926023ec76ff8949618e04e1d0a93609f8448a1f8f875fcfc505a6b219'),
            ('ps4_city_tower_destination_0250_3.pkg',8206619648,206848,'1db9423081f922b78cce256641dfab195e6a4b4afb6020e4e0c5029234f19375'),
            ('ps4_city_tower_destination_0250_4.pkg',8206827008,17901568,'5a9370d60724622fb6592a7bcfa2fc4dbb40a4fca5cd696ce8db086a5756e84f'),
            ('ps4_city_tower_destination_0250_5.pkg',8224729088,1677312,'2066afe09503eee4c35d948f6749a6e7b7b02572dcd41d1d3ca679fa523ea22c'),
          ]
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=90)
          rows=[]
          for name,off,size,expected in members:
              dst=Path('recovered')/name
              got=arc.copy_to(off,size,dst)
              if got.lower()!=expected.lower():
                  raise SystemExit(f'{name}: SHA mismatch {got} != {expected}')
              rows.append({'name':name,'data_offset':off,'size':size,'sha256':got})
              print('RECOVERED',name,size,got,flush=True)
          Path('reports/member_catalog.json').write_text(json.dumps({'source_run':33943271839,'source_artifact':9963042289,'members':rows},indent=2)+'\n')
          PY

      - name: Validate common decal carriers and minority baked-static controls
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          cat > reports/targets.tsv <<'EOF'
          common	80C98191
          baked	80C98254
          common	80C984D7
          baked	80C984D8
          common	80C98A69
          baked	80C98A6B
          common	80C993A2
          baked	80C993CD
          baked	80C993CF
          common	80C997F4
          baked	80C997F5
          common	80C99980
          baked	80C99981
          common	80CA0B6F
          baked	80CA0B70
          common	80CA0B71
          baked	80CA0B72
          common	80CA0C5F
          baked	80CA0C60
          EOF
          : > reports/validator_exit_codes.tsv
          while IFS=$'\t' read -r role h; do
            echo "VALIDATE $role $h"
            set +e
            python tools/d1_tower_static_map_decal_validate.py \
              "${args[@]}" --runtime runtime --static-map-data "$h" \
              --out "validation/${role}_${h}.json" \
              | tee "reports/${role}_${h}.stdout.txt"
            rc=${PIPESTATUS[0]}
            set -e
            printf '%s\t%s\t%s\n' "$role" "$h" "$rc" >> reports/validator_exit_codes.tsv
          done < reports/targets.tsv

      - name: Aggregate layer split
        if: always()
        run: |
          python - <<'PY'
          import glob,json
          from collections import Counter
          from pathlib import Path
          rows=[]
          for p in sorted(glob.glob('validation/*.json')):
              d=json.load(open(p)); stem=Path(p).stem; role,h=stem.split('_',1)
              s=d.get('summary',{})
              rows.append({
                'role':role,'static_map_data':h,'ok':d.get('ok'),
                'evidence_status':d.get('evidence_status'),
                'payload_size':d.get('payload_size'),
                'decal_count':s.get('decal_count'),
                'decal_records_structurally_valid':s.get('decal_records_structurally_valid'),
                'all_decal_records_singleton_transform_model':s.get('all_decal_records_singleton_transform_model'),
                'model_reference_occurrences':s.get('model_reference_occurrences'),
                'unique_entity_models':s.get('unique_entity_models'),
                'has_direct_d1_static_child':s.get('has_direct_d1_static_child'),
                'd1_static_child':s.get('d1_static_child'),
                'occlusion_bounds':s.get('occlusion_bounds'),
                'violations':d.get('violations',[]),
              })
          common=[x for x in rows if x['role']=='common']; baked=[x for x in rows if x['role']=='baked']
          rep={
            'evidence_status':'BINARY_DECAL_LAYER_CENSUS' if len(rows)==19 else 'PARTIAL_BINARY_DECAL_LAYER_CENSUS',
            'targets_expected':19,'targets_emitted':len(rows),
            'common_count':len(common),'baked_control_count':len(baked),
            'common_structurally_valid':sum(bool(x['ok']) for x in common),
            'baked_structurally_valid':sum(bool(x['ok']) for x in baked),
            'common_with_decals':sum((x['decal_count'] or 0)>0 for x in common),
            'baked_with_decals':sum((x['decal_count'] or 0)>0 for x in baked),
            'common_with_direct_d1_child':sum(bool(x['has_direct_d1_static_child']) for x in common),
            'baked_with_direct_d1_child':sum(bool(x['has_direct_d1_static_child']) for x in baked),
            'total_decal_records_common':sum(x['decal_count'] or 0 for x in common),
            'total_decal_records_baked':sum(x['decal_count'] or 0 for x in baked),
            'rows':rows,
          }
          Path('reports/tower_static_map_decal_census.json').write_text(json.dumps(rep,indent=2)+'\n')
          print(json.dumps(rep,indent=2))
          if len(rows)!=19:
              raise SystemExit(f'expected 19 outputs, got {len(rows)}')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-static-map-decal-binary-census
          path: |
            reports/
            validation/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
