name: Temporary deep-probe imported 011c visual resources

on:
  push:
    paths:
      - '.github/workflows/tmp-011c-imported-resource-deep-probe.yml'
      - 'tools/d1_entry_literal_graph_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover verified Oodle runtime and 011c family
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --start-offset 0x43779C800 \
            --target ps4_gear_weapons_011c_0.pkg --target ps4_gear_weapons_011c_1.pkg \
            --target ps4_gear_weapons_011c_2.pkg --target ps4_gear_weapons_011c_3.pkg \
            --target ps4_gear_weapons_011c_5.pkg \
            --out recovered --manifest reports/011c_extract.json --retries 6 --timeout 90
      - name: Probe retail-imported resources and nearby component owners
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_entry_literal_graph_probe.py recovered/ps4_gear_weapons_011c_5.pkg \
            --runtime runtime \
            --tag 80A39AA6 --tag 80A397EA \
            --tag 80A39E0E --tag 80A39E23 --tag 80A39E35 --tag 80A39E47 --tag 80A39E56 \
            --tag 80A39EB0 --tag 80A39EC1 --tag 80A39ED4 --tag 80A39EE5 \
            --tag 80A39EF2 --tag 80A39EFE --tag 80A39F0A --tag 80A39F17 --tag 80A39F23 \
            --tag 80A39F2D --tag 80A39F3A --tag 80A39F46 --tag 80A39F52 \
            --prefix-bytes 0x800 -o reports/imported_011c_resource_graph.json
      - uses: actions/upload-artifact@v4
        with:
          name: d1-011c-imported-resource-deep-probe
          path: reports/
          retention-days: 5
          if-no-files-found: error
