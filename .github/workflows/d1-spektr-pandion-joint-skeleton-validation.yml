name: RETIRED - D1 Spektar direct-index skeleton validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain supersession
        run: |
          cat <<'EOF'
          RETIRED: this workflow's old validation was semantically invalid.

          It treated every decoded source joint integer in [0,67) as the same-index
          bone in retail skeleton 809D8613. Exact comparison against Bungie's
          published 72-node D1 player skeleton later proved that assumption false.

          Used Spektar source slots 25, 26, 27, 28, 40 and 42 name different bones
          at the same integer positions in 809D8613. Slots 27 and 28 are especially
          important: in Bungie's exact player skeleton they are the left/right
          shoulder twist-fixup bones and carry very large Spektar gauntlet weight.

          Authoritative replacement:
            .github/workflows/d1-spektr-pandion-joint-semantic-audit.yml
            tools/d1_guardian_joint_semantic_audit.py

          Do not restore the old direct-index assertion without an explicit serialized
          PS4 skeleton/palette mapping proving it.
          EOF
