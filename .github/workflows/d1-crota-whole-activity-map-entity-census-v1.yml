name: D1 Crota whole-Activity map entity census v1

on:
  push:
    paths:
      - '.github/workflows/d1-crota-whole-activity-map-entity-census-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ACTIVITY: '810B0002'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install runtime and recover current archive index
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy
          mkdir -p runtime packages out/work
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' \
            -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' \
            -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 8 --retry-delay 3 \
            'https://github.com/lizardpeter/destiny-1/releases/download/d1-global-activity-index-r1/D1_CURRENT_ACTIVITY_INDEX.json' \
            -o out/D1_CURRENT_ACTIVITY_INDEX.json
          curl --fail --location --retry 4 \
            'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' \
            -o out/packages.txt
          python - <<'PY'
          import hashlib,json
          d=json.load(open('out/D1_CURRENT_ACTIVITY_INDEX.json'))
          actual=hashlib.sha256(open('out/packages.txt','rb').read()).hexdigest()
          expected=(d.get('source') or {}).get('package_list_sha256')
          assert d.get('status')=='D1_REMOTE_ACTIVITY_INDEX_COMPLETE',d.get('status')
          assert actual==expected,(actual,expected)
          print('ARCHIVE_INDEX_ACCEPTED',actual)
          PY

      - name: Close Activity map roots universally
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python tools/d1_world_activity_root_dependency_closure_universal.py \
            --index out/D1_CURRENT_ACTIVITY_INDEX.json \
            --package-list out/packages.txt \
            --activity "$ACTIVITY" \
            --runtime runtime --package-dir packages \
            --work-dir out/work/root \
            --root-out out/activity_map_roots.json \
            --report out/activity_root_dependency_closure.json
          python - <<'PY'
          import json
          c=json.load(open('out/activity_root_dependency_closure.json'))
          r=json.load(open('out/activity_map_roots.json'))
          assert c['status']=='D1_WORLD_ACTIVITY_ROOT_DEPENDENCY_CLOSURE_COMPLETE',c
          assert r['status']=='D1_WORLD_ACTIVITY_MAP_ROOT_CENSUS_COMPLETE',r.get('violations')
          assert r['selected_activities']==['810B0002'],r
          assert r['reachable_map_data_table_count']==255,r
          print('ROOTS',r['reachable_bubble_count'],r['reachable_map_container_count'],r['reachable_map_data_table_count'],r['total_reachable_map_entries'])
          PY

      - name: Census every map entry and preserve exact entity seeds
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find packages -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_map_data_layer_census.py "${args[@]}" --runtime runtime \
            --map-root-json out/activity_map_roots.json \
            --out out/map_data_layer_census.json
          python - <<'PY'
          import json
          from collections import Counter,defaultdict
          d=json.load(open('out/map_data_layer_census.json'))
          assert d['status']=='D1_WORLD_MAP_DATA_LAYER_CENSUS',d.get('violations')
          rows=[]
          for table in d['tables']:
            for r in table.get('entries',[]):
              h=str(r.get('entity_hash') or '').upper()
              if h in ('','00000000','FFFFFFFF'): continue
              e=r.get('entity') or {}
              meta=e.get('meta') or {}
              rows.append({
                'map_data_table':table['map_data_table'],
                'entry_index':r['index'],
                'entity_hash':h,
                'entity_exists':bool(e.get('exists')),
                'entity_reference_class':str(meta.get('reference') or '').upper() or None,
                'rotation':r.get('rotation'),
                'translation':r.get('translation'),
                'world_id':r.get('world_id'),
                'resource_class':r.get('resource_class'),
                'resource_class_name':r.get('resource_class_name')
              })
          assert len(rows)==1535,len(rows)
          assert all(x['entity_exists'] for x in rows),[x for x in rows if not x['entity_exists']][:10]
          by=defaultdict(list)
          for r in rows: by[r['entity_hash']].append(r)
          class_counts=Counter(r['entity_reference_class'] or 'NULL' for r in rows)
          unique_class_counts=Counter()
          for h,rs in by.items(): unique_class_counts[rs[0]['entity_reference_class'] or 'NULL']+=1
          out={
            'schema_version':1,
            'status':'D1_CROTA_WHOLE_ACTIVITY_MAP_ENTITY_SEEDS_EXACT',
            'activity':'810B0002',
            'source_map_data_table_count':d['map_data_table_count'],
            'source_entry_count':d['entry_count'],
            'placement_count':len(rows),
            'unique_entity_count':len(by),
            'placement_entity_reference_class_counts':dict(sorted(class_counts.items())),
            'unique_entity_reference_class_counts':dict(sorted(unique_class_counts.items())),
            'unique_entity_hashes':sorted(by),
            'placements':rows,
            'per_entity_placement_counts':{h:len(rs) for h,rs in sorted(by.items())},
            'policy':'Every seed is the exact non-null SMapDataEntry entity TagHash from all MapDataTables reachable from Activity 810B0002. No resource class, name, package proximity, or model resemblance creates an entity seed.'
          }
          json.dump(out,open('out/map_entity_seeds.json','w'),indent=2)
          print('MAP_ENTITY_SEEDS',json.dumps({k:out[k] for k in ('placement_count','unique_entity_count','placement_entity_reference_class_counts','unique_entity_reference_class_counts')},sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-crota-whole-activity-map-entity-census-v1
          path: |
            out/map_entity_seeds.json
            out/map_data_layer_census.json
            out/activity_map_roots.json
            out/activity_root_dependency_closure.json
          retention-days: 14
          compression-level: 6
