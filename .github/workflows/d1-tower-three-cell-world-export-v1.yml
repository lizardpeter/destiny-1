name: D1 Tower three-cell world export v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-three-cell-world-export-v1.yml'
      - 'tools/d1_world_static_visual_export.py'
      - 'tools/d1_world_static_vertex_decode.py'
      - 'tools/d1_world_static_common.py'
      - 'tools/d1_tower_map_schema_validate_v5.py'
      - 'tools/d1_tower_recover_current_corpus.py'
      - 'evidence/d1_tower_dependency_member_catalog.json'
      - 'evidence/d1_tower_dependency_sha256_catalog.json'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install dependencies and verified Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install numpy trimesh
          mkdir -p runtime recovered validation world reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Recover exact current Tower dependency corpus
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py \
            --package-list reports/packages.txt \
            --out-dir recovered \
            --report reports/current_corpus.json

      - name: Validate Tower map chains with v5 reader
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_tower_map_schema_validate_v5.py "${args[@]}" --runtime runtime --out validation > reports/validator_stdout.txt

      - name: Export first three retail-visible cells with affine matrices and UVs
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          for h in 80C984D8 80C98A6B 80C993CD; do
            python tools/d1_world_static_visual_export.py "${args[@]}" --runtime runtime \
              --validation-json validation/tower_map_schema_validation.json \
              --static-map-data "$h" --basis gltf-y-up \
              --out "world/TOWER_${h}_WORLD.glb" --json "world/TOWER_${h}_WORLD.json" \
              | tee "reports/world_${h}.txt"
          done

      - name: Merge and regression-check the corrected three-cell world adapter
        run: |
          set -euo pipefail
          python tools/d1_tower_merge_placements.py \
            --input world/TOWER_80C984D8_WORLD.glb \
            --input world/TOWER_80C98A6B_WORLD.glb \
            --input world/TOWER_80C993CD_WORLD.glb \
            --out world/D1_TOWER_THREE_CELL_WORLD_UV_AFFINE.glb \
            --json world/D1_TOWER_THREE_CELL_WORLD_UV_AFFINE.json \
            --expected-placements 4702
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import numpy as np,trimesh
          cells=[]
          for h in ('80C984D8','80C98A6B','80C993CD'):
              d=json.load(open(f'world/TOWER_{h}_WORLD.json'))
              if d['decode_error_count']:
                  raise SystemExit(f'{h}: decode errors {d["decode_errors"][:3]}')
              cells.append(d)
          p=Path('world/D1_TOWER_THREE_CELL_WORLD_UV_AFFINE.glb')
          s=trimesh.load(p,force='scene',process=False)
          bad=[]
          for n in s.graph.nodes_geometry:
              m,_=s.graph.get(n)
              if not np.allclose(m[3],[0,0,0,1],atol=1e-7): bad.append(n)
          if bad: raise SystemExit(f'non-affine nodes remain: {bad[:5]}')
          out={
            'status':'D1_TOWER_THREE_CELL_WORLD_UV_AFFINE_VALIDATED',
            'placements':len(s.graph.nodes_geometry),'geometry_variants':len(s.geometry),
            'non_affine_nodes':len(bad),
            'geometry_with_uv':sum(sum(1 for g in c['geometry'] if g['has_uv']) for c in cells),
            'geometry_with_normals':sum(sum(1 for g in c['geometry'] if g['has_normals']) for c in cells),
            'bounds':s.bounds.tolist() if s.bounds is not None else None,
            'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
          }
          Path('reports/three_cell_world_summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-three-cell-world-uv-affine-v1
          path: |
            world/
            reports/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
