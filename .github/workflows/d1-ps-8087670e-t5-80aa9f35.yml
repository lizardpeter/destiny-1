name: D1 PS 8087670E alternate t5 80AA9F35 decode

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-ps-8087670e-t5-80aa9f35.yml'
      - 'tools/d1_texture_export.py'
      - 'tools/d1_dds_to_png.py'

permissions: {contents: read}

jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover verified runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports textures
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover exact current 0154 logical package siblings
        run: |
          set -euo pipefail
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --start-offset 0x44EE5D200 \
            --target ps4_globals_0154_0.pkg --target ps4_globals_0154_1.pkg --target ps4_globals_0154_2.pkg \
            --target ps4_globals_0154_3.pkg --target ps4_globals_0154_4.pkg --target ps4_globals_0154_5.pkg \
            --out recovered --manifest reports/0154_extract.json --retries 6 --timeout 90
          test -f recovered/ps4_globals_0154_5.pkg
      - name: Decode exact t5 resource 80AA9F35
        run: |
          set -euo pipefail
          python tools/d1_entry_extract.py recovered/ps4_globals_0154_5.pkg --runtime runtime --tag-hash 80AA9F35 -o reports/80AA9F35_entry.json
          python tools/d1_texture_export.py recovered/ps4_globals_0154_5.pkg --runtime runtime \
            --tag-hash 80AA9F35 --out textures/80AA9F35
          python - <<'PY'
          import json, pathlib
          e=json.load(open('reports/80AA9F35_entry.json'))
          m=json.load(open('textures/80AA9F35/texture_manifest.json'))
          assert e, e
          rows=m.get('textures') or m.get('entries') or m.get('exported') or []
          print('ENTRY',json.dumps(e,indent=2))
          print('MANIFEST',json.dumps(m,indent=2))
          files=sorted(str(p) for p in pathlib.Path('textures/80AA9F35').rglob('*') if p.is_file())
          assert files, files
          print('FILES',*files,sep='\n')
          PY
      - name: Persist hashes
        if: always()
        run: |
          find reports textures -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > reports/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-PS-8087670E-T5-80AA9F35-EXACT
          path: |
            reports/
            textures/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
