name: D1 Tower actor location to visual signature join

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-actor-location-visual-signature-join.yml'
      - 'tools/d1_tower_actor_location_visual_signature_join.py'

permissions: {contents: read, actions: read}

env:
  LOCATION_ARTIFACT_ID: '10035502868'
  LOCATION_ARTIFACT_SHA256: '6306fa83be0334fe2744776b3b88921da2c90e21831cf095dd8a09c17f2ac53c'
  SIGNATURE_ARTIFACT_ID: '10035991740'
  SIGNATURE_ARTIFACT_SHA256: '4bb937be6206900ff241c93a40dd54e4e7b00387c30dfd28f991039fd5760c6f'
  RUNTIME_ARTIFACT_ID: '10000412397'
  RUNTIME_ARTIFACT_SHA256: 'fa8e5dd2b82bc5527221baae6080289af9aa598451d6a5594d8b5e0db22bc4d6'

jobs:
  join:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact green checkpoints
        run: |
          set -euo pipefail
          mkdir -p input/location input/signatures input/runtime out
          pull() {
            id="$1"; sha="$2"; zip="$3"; dst="$4"
            curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            echo "${sha}  ${zip}" | sha256sum --check --strict
            unzip -q "$zip" -d "$dst"
          }
          pull "$LOCATION_ARTIFACT_ID" "$LOCATION_ARTIFACT_SHA256" input/location.zip input/location
          pull "$SIGNATURE_ARTIFACT_ID" "$SIGNATURE_ARTIFACT_SHA256" input/signatures.zip input/signatures
          pull "$RUNTIME_ARTIFACT_ID" "$RUNTIME_ARTIFACT_SHA256" input/runtime.zip input/runtime

      - name: Join all exact location alternatives to exact visual signatures
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_tower_actor_location_visual_signature_join.py
          python tools/d1_tower_actor_location_visual_signature_join.py \
            --locations input/location/D1_TOWER_EIGHT_SCENARIO_SPAWNED_LOCATION_MANIFEST.json \
            --signatures input/signatures/D1_TOWER_ACTOR_VISIBLE_MATERIAL_SIGNATURES_FINAL.json \
            --runtime-closure input/runtime/TOWER_SPAWNED_ACTOR_RUNTIME_CLOSURE.json \
            -o out/D1_TOWER_ACTOR_LOCATION_VISUAL_SIGNATURE_JOIN.json | tee out/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/D1_TOWER_ACTOR_LOCATION_VISUAL_SIGNATURE_JOIN.json'))
          assert d['status']=='D1_TOWER_ACTOR_LOCATION_VISUAL_SIGNATURE_JOIN_COMPLETE',d['violations']
          assert d['scenario_count']==8,d
          assert d['exact_location_alternative_count']==547,d
          assert d['resolved_visual_location_alternative_count']==547,d
          assert d['resolved_visual_model_count']==13,d
          assert d['resolution_method_counts']=={
            'exact_d912_owner_configuration_signature':464,
            'single_signature_model':83,
          },d['resolution_method_counts']
          assert not d['ambiguous_calibrated_model_d912_signature_keys'],d
          assert all(v is False for v in d['gates'].values()),d['gates']
          print('LOCATION_VISUAL_JOIN_GREEN',d['resolved_visual_location_alternative_count'],'rows',d['resolved_visual_variant_count'],'variants')
          PY
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-TOWER-ACTOR-LOCATION-VISUAL-SIGNATURE-JOIN
          path: out/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
