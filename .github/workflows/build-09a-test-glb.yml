name: Build 09A proof test GLB

on:
  push:
    paths:
      - '.github/workflows/build-09a-test-glb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy scipy pygltflib pyglm pillow jsonpickle texture2ddecoder

      - name: Recover verified Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered exported recipe out reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Recover exact retail package families
        run: |
          set -euo pipefail
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          # Tiger's logical namespace can reference blocks resident in lower patch
          # siblings. Keep every required sibling beside the selected package view.
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 \
            --start-offset 0x105C6E000 \
            --target ps4_arch_vex_com01_0767_0.pkg \
            --target ps4_arch_vex_com01_0767_1.pkg \
            --target ps4_arch_vex_com01_0767_4.pkg \
            --out recovered --manifest reports/0767_extract.json
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 \
            --start-offset 0x46711B000 \
            --target ps4_globals_0156_0.pkg \
            --target ps4_globals_0156_1.pkg \
            --target ps4_globals_0156_2.pkg \
            --target ps4_globals_0156_3.pkg \
            --target ps4_globals_0156_4.pkg \
            --target ps4_globals_0156_5.pkg \
            --out recovered --manifest reports/0156_extract.json
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 \
            --start-offset 0x46AF91400 \
            --target ps4_globals_0157_0.pkg \
            --target ps4_globals_0157_1.pkg \
            --out recovered --manifest reports/0157_extract.json

      - name: Export exact retail Vex textures
        run: |
          set -euo pipefail
          python tools/d1_texture_export.py recovered/ps4_globals_0156_5.pkg --runtime runtime \
            --dependency-pkg recovered/ps4_globals_0157_1.pkg \
            --dependency-pkg recovered/ps4_arch_vex_com01_0767_4.pkg \
            --tag-hash 80AACCDD --tag-hash 80AACCDF --tag-hash 80AACC26 --tag-hash 80AACC28 --tag-hash 816CE1C5 \
            --out exported
          cat exported/texture_manifest.json
          test -n "$(find exported -maxdepth 1 -name '*.dds' -print -quit)"
          # Host Pillow DDS support varies. Decode our already-linearized DDS files
          # explicitly so PNG generation is deterministic across runners.
          mapfile -t dds_files < <(find exported -maxdepth 1 -name '*.dds' -print | sort)
          python tools/d1_dds_to_png.py --overwrite "${dds_files[@]}"
          python tools/d1_gltf_material_recipe.py --texture-dir exported --out recipe
          # Core glTF cannot bind these native sources faithfully, but the proof GLB
          # embeds them in extras/provenance so future D1-native renderers retain them.
          cp exported/80AACC26_*_BC5.png recipe/
          cp exported/80AACC28_*_RGBA8_face*.png recipe/
          find exported recipe -maxdepth 1 -type f -print | sort

      - name: Recover pinned animation validation oracle
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git tiger-animation-parser
          git -C tiger-animation-parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
          test "$(git -C tiger-animation-parser rev-parse HEAD)" = 'b9fdc3a43dd28118113275624fcc9054b75855f4'

      - name: Build textured rigged animated GLB
        run: |
          set -euo pipefail
          python tools/d1_vex_09a_test_glb.py recovered/ps4_arch_vex_com01_0767_0.pkg \
            --runtime runtime \
            --parser-root tiger-animation-parser \
            --recipe-dir recipe \
            --out out/816CE09A_PROVEN_MATERIAL_TEST.glb \
            --report reports/816CE09A_PROVEN_MATERIAL_TEST.json
          sha256sum out/816CE09A_PROVEN_MATERIAL_TEST.glb | tee reports/glb_sha256.txt
          cat reports/816CE09A_PROVEN_MATERIAL_TEST.json

      - name: Validate GLB structure
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,struct
          from pathlib import Path
          from pygltflib import GLTF2
          p=Path('out/816CE09A_PROVEN_MATERIAL_TEST.glb')
          b=p.read_bytes()
          assert b[:4]==b'glTF'
          assert struct.unpack_from('<I',b,4)[0]==2
          assert struct.unpack_from('<I',b,8)[0]==len(b)
          g=GLTF2().load_binary(str(p))
          assert len(g.meshes)==1
          assert len(g.skins)==1
          assert len(g.animations)==2
          assert [x.name for x in g.animations]==['816CE09D','816CE09E']
          assert len(g.materials)==2
          assert g.meshes[0].primitives
          assert all(x.attributes.JOINTS_0 is not None and x.attributes.WEIGHTS_0 is not None for x in g.meshes[0].primitives)
          r=json.loads(Path('reports/816CE09A_PROVEN_MATERIAL_TEST.json').read_text())
          assert r['geometry']['vertex_count']==4172
          assert r['geometry']['triangle_count']==5336
          print(json.dumps({'bytes':len(b),'nodes':len(g.nodes),'animations':[x.name for x in g.animations],'materials':[x.name for x in g.materials]},indent=2))
          PY

      - name: Bundle test artifact
        run: |
          set -euo pipefail
          cp recipe/material_recipe.json out/material_recipe.json
          cp reports/816CE09A_PROVEN_MATERIAL_TEST.json out/816CE09A_PROVEN_MATERIAL_TEST.report.json
          cp reports/glb_sha256.txt out/SHA256SUMS.txt
          cat > out/README.txt <<'EOF'
          Destiny 1 PS4 Vex 816CE09A proof test export

          Native owner/model/rig/animations:
            owner     816CE12B
            model     816CE09A
            skeleton  816CE092
            rig       816CE095
            clips     816CE09D / 816CE09E

          Default parent-selected materials:
            VariantShaderIndex 0 -> 809C475F
            VariantShaderIndex 1 -> 816CE240

          This GLB is a portable glTF approximation of byte-proven native D1 material
          behavior. Native hashes, equations and approximation policy are preserved in
          GLB extras and material_recipe.json. It is NOT a claim that core glTF PBR is
          equivalent to Destiny's native two-pass/deferred renderer.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: 816CE09A-proven-material-test-glb
          path: out/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
