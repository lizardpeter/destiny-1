name: D1 Oodle3 Rust Huffman prefix benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-oodle3-rust-fastbits-benchmark.yml'

permissions:
  contents: read

jobs:
  fastbits:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable

      - name: Recover package and reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered reference out
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar
          name='ps4_city_tower_destination_024c_5.pkg'
          off=7715401728; size=1687552
          expected='b404bacccf44a4bf6859bf3b867ae02f5dc840432bdaa081c341439c2ae83311'
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=5,timeout=90)
          got=arc.copy_to(off,size,Path('recovered')/name)
          if got.lower()!=expected: raise SystemExit(got)
          PY
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll'             -o reference/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  reference/oo2core_3_win64.dll' | sha256sum --check --strict

      - name: Build 10/11/12/13-bit variants
        shell: bash
        run: |
          set -euo pipefail
          cp rust/d1_oodle3/src/lzh.rs out/lzh.original.rs
          for bits in 10 11 12 13; do
            cp out/lzh.original.rs rust/d1_oodle3/src/lzh.rs
            python - "$bits" <<'PY'
          import sys
          from pathlib import Path
          bits=sys.argv[1]
          p=Path('rust/d1_oodle3/src/lzh.rs')
          s=p.read_text()
          old='pub const FAST_DECODE_BITS: u8 = 10;'
          if old not in s: raise SystemExit('FAST_DECODE_BITS anchor missing')
          p.write_text(s.replace(old,f'pub const FAST_DECODE_BITS: u8 = {bits};',1))
          PY
            CARGO_TARGET_DIR="rust/d1_oodle3/target-fb$bits" cargo build --manifest-path rust/d1_oodle3/Cargo.toml --release
            cp "rust/d1_oodle3/target-fb$bits/release/d1_oodle3.dll" "out/fb$bits.dll"
          done
          cp out/lzh.original.rs rust/d1_oodle3/src/lzh.rs

      - name: Benchmark variants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes,hashlib,json,statistics,sys,time
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_pkg_probe import parse_header,parse_blocks,read_table

          def bind(path):
              lib=ctypes.WinDLL(str(Path(path).resolve()))
              fn=lib.OodleLZ_Decompress
              fn.restype=ctypes.c_int64
              fn.argtypes=[ctypes.c_void_p,ctypes.c_int64,ctypes.c_void_p,ctypes.c_int64,
                           ctypes.c_uint32,ctypes.c_uint32,ctypes.c_uint32,
                           ctypes.c_void_p,ctypes.c_void_p,ctypes.c_void_p,ctypes.c_void_p,
                           ctypes.c_void_p,ctypes.c_void_p,ctypes.c_uint32]
              return fn
          def call(fn,src,dst,n,raw):
              got=fn(ctypes.cast(src,ctypes.c_void_p),n,ctypes.cast(dst,ctypes.c_void_p),raw,
                     1,0,0,None,None,None,None,None,None,3)
              if got!=raw: raise RuntimeError((got,raw))

          pkg=Path('recovered/ps4_city_tower_destination_024c_5.pkg')
          with pkg.open('rb') as f:
              h=parse_header(f); bt=read_table(f,h['block_table_offset'],h['block_table_count'],32)
          cases=[]
          for b in parse_blocks(bt):
              if not b['compressed'] or int(b['patch_id'])!=5: continue
              with pkg.open('rb') as f:
                  f.seek(int(b['offset'])); comp=f.read(int(b['size']))
              if hashlib.sha1(comp).hexdigest().lower()!=str(b['sha1']).lower(): raise RuntimeError('sha')
              cases.append((comp,ctypes.create_string_buffer(comp),0x40000))
              if len(cases)==8: break

          fns={'reference':bind('reference/oo2core_3_win64.dll')}
          for bits in (10,11,12,13): fns[f'fb{bits}']=bind(f'out/fb{bits}.dll')
          dst={k:[ctypes.create_string_buffer(raw) for _,_,raw in cases] for k in fns}
          for i,(comp,src,raw) in enumerate(cases):
              call(fns['reference'],src,dst['reference'][i],len(comp),raw)
              ref=dst['reference'][i].raw[:raw]
              for k in fns:
                  if k=='reference': continue
                  call(fns[k],src,dst[k][i],len(comp),raw)
                  if dst[k][i].raw[:raw]!=ref: raise RuntimeError(f'mismatch {k} {i}')

          for _ in range(12):
              for i,(comp,src,raw) in enumerate(cases):
                  for k,fn in fns.items(): call(fn,src,dst[k][i],len(comp),raw)

          iters=50; rounds=7; raw_bytes=sum(x[2] for x in cases)*iters
          def once(k):
              fn=fns[k]; t=time.perf_counter_ns()
              for _ in range(iters):
                  for i,(comp,src,raw) in enumerate(cases): call(fn,src,dst[k][i],len(comp),raw)
              sec=(time.perf_counter_ns()-t)/1e9
              return raw_bytes/sec/(1024*1024)
          samples={k:[] for k in fns}; order=list(fns)
          for r in range(rounds):
              seq=order if r%2==0 else list(reversed(order))
              for k in seq: samples[k].append(once(k))
          med={k:statistics.median(v) for k,v in samples.items()}
          ratios={k:med[k]/med['reference'] for k in med if k!='reference'}
          report={'median_mib_s':med,'ratios_to_oodle':ratios,'samples':samples}
          Path('out/fastbits_benchmark.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          for k,v in ratios.items(): print('FASTBITS_RATIO',k,v)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: d1-oodle23-rust-fastbits-benchmark
          path: out/fastbits_benchmark.json
          retention-days: 30
