name: D1 Crota E4D9 branch closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-e4d9-branch-closure.yml'
      - 'tools/d1_remote_exact_tag_probe.py'
      - 'tools/d1_remote_catalog_entity_resource_probe.py'
      - 'tools/d1_remote_catalog_backlinks.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Probe exact Crota-side branch leaves
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_exact_tag_probe.py \
            --tag-hash 0x8108E4D9 --tag-hash 0x8108E532 --tag-hash 0x8108E5D0 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --min-string 4 -o out/CROTA_E4D9_BRANCH_TAGS.json \
            | tee out/tag_probe_stdout.txt
          python tools/d1_remote_catalog_entity_resource_probe.py \
            --tag-hash 0x8108E4D9 --tag-hash 0x8108E532 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_E4D9_BRANCH_ENTITY_RESOURCES.json \
            | tee out/entity_resource_stdout.txt

      - name: Probe every typed downstream tag unique to E532
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          ARGS=$(python - <<'PY'
          import json
          d=json.load(open('out/CROTA_E4D9_BRANCH_TAGS.json'))
          rows={x['tag_hash']:x for x in d['entries']}
          keep=[]
          for m in rows['8108E532']['aligned_resolved_tags']:
              h=m['tag_hash'].upper(); ref=m['entry']['reference'].upper()
              if h=='8108E532': continue
              if ref!='8080058A': keep.append(h)
          print(' '.join('--tag-hash 0x'+h for h in sorted(set(keep))))
          print('E532_TYPED',[(m['tag_hash'],m['entry']['reference']) for m in rows['8108E532']['aligned_resolved_tags'] if m['tag_hash']!='8108E532'],file=__import__('sys').stderr)
          PY
          )
          if [[ -n "$ARGS" ]]; then
            python tools/d1_remote_exact_tag_probe.py $ARGS \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
              --runtime runtime --min-string 4 -o out/CROTA_E532_TYPED_CHILDREN.json \
              | tee out/typed_children_stdout.txt
          else
            printf '%s\n' '{"schema":"d1_crota_e532_typed_children/v1","entries":[],"violation_count":0,"violations":[]}' > out/CROTA_E532_TYPED_CHILDREN.json
          fi

      - name: Trace exact raid-package backlinks
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_catalog_backlinks.py \
            --scan-package-id 0x0447 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --target 0x8108E4D9 --target 0x8108E532 --target 0x8108E5D0 \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --max-entry-size 8000000 \
            -o out/CROTA_E4D9_BRANCH_BACKLINKS.json | tee out/backlinks_stdout.txt

      - name: Summarize fail-closed branch evidence
        run: |
          set -euo pipefail
          python - <<'PY' | tee out/summary.txt
          import json,collections
          t=json.load(open('out/CROTA_E4D9_BRANCH_TAGS.json')); assert t['violation_count']==0,t['violations']
          for x in t['entries']:
              print('TAG',x['tag_hash'],'CLASS',x['entry']['reference'],'SIZE',x['payload_size'])
              print(' STRINGS',[(hex(s['offset']),s['string']) for s in x['printable_strings']])
              print(' REFS',[(hex(m['offset']),m['tag_hash'],m['entry']['reference']) for m in x['aligned_resolved_tags']])
          e=json.load(open('out/CROTA_E4D9_BRANCH_ENTITY_RESOURCES.json')); assert not e['violations'],e['violations']
          for x in e['entries']:
              er=x['entity_resource']
              print('ER',x['tag_hash'],'ROLE',er.get('semantic_role'),'CLASSES',er.get('unk10_class'),er.get('unk18_class'),'MODEL',er.get('embedded_model_tag_hash'))
          c=json.load(open('out/CROTA_E532_TYPED_CHILDREN.json')); assert not c.get('violations'),c.get('violations')
          print('TYPED_CHILDREN',[(x['tag_hash'],x['entry']['reference'],x['payload_size']) for x in c.get('entries',[])])
          b=json.load(open('out/CROTA_E4D9_BRANCH_BACKLINKS.json')); assert b['error_count']==0,b['errors']
          print('BACKLINKS',b['occurrences_by_target'],b['hit_sources_by_reference'])
          PY
          find out -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-E4D9-BRANCH-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
