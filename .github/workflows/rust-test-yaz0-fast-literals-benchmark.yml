name: Rust-test SMG Yaz0 all-literal groups plus chunk copying
on:
  workflow_dispatch:
  push:
    branches: [bench/rust-test-other-decoders-20261009]
    paths:
      - '.github/workflows/rust-test-yaz0-fast-literals-benchmark.yml'
      - 'tools/codec_bench/yaz0_fast_literals*'
permissions:
  contents: read
jobs:
  yaz0:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test exact Yaz0 behavior including long overlapping copies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          rustc --edition=2021 --test -O tools/codec_bench/yaz0_fast_literals.rs -o out/yaz0_tests.exe
          ./out/yaz0_tests.exe --nocapture
          rustc --edition=2021 --test -O tools/codec_bench/yaz0_baseline.rs -o out/yaz0_baseline_tests.exe
          ./out/yaz0_baseline_tests.exe --nocapture
      - name: Benchmark same-run old and new Rust decoders
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -O -C target-cpu=native -C lto=fat -C codegen-units=1 \
            tools/codec_bench/yaz0_fast_literals_bench.rs -o out/yaz0_fast_literals_bench.exe
          ./out/yaz0_fast_literals_bench.exe | tee out/yaz0_fast_literals_bench_results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-test-yaz0-all-literals-comparison
          path: out/yaz0_fast_literals_bench_results.txt
          if-no-files-found: warn
          retention-days: 20

# Independent paired replication of safe overlap-preserving Yaz0 chunk copies.

# Independent native Windows A/B repeat of bulk literal groups and chunked matches.
