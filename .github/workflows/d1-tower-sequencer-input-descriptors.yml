name: D1 Tower Sequencer Input Descriptor Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-sequencer-input-descriptors.yml'
      - 'tools/d1_remote_filehash_probe.py'

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_URL: https://crypt.cohae.dev/destiny/ps4/packages/latest
      RESOURCE_HASH: 80AA8F06

    steps:
      - uses: actions/checkout@v4

      - name: Recover current package list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source reports payloads runtime
          run_id="$(gh run list --workflow d1-global-activity-index.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run download "$run_id" -n d1-global-activity-index -D source
          plist="$(find source -name packages.txt -print -quit)"
          test -n "$plist" -a -f "$plist"
          cp "$plist" reports/packages.txt

      - name: Install exact Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll'             -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so'             -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Fetch exact Tower sequencer resource
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python tools/d1_remote_filehash_probe.py             --tag-hash "$RESOURCE_HASH"             --package-list reports/packages.txt             --runtime runtime             --base-url "$BASE_URL"             --payload-out-dir payloads             --out reports/resource_probe.json
          test -f "payloads/$RESOURCE_HASH.bin"
          echo '8021c009bf65a4b3e6f67ef330eef68205fbd5fabe87a999f9e640f0598129d4  payloads/80AA8F06.bin' | sha256sum --check --strict

      - name: Decode exact input descriptor arrays
        run: |
          python - <<'PY'
          import json,struct,hashlib
          from pathlib import Path

          raw=Path('payloads/80AA8F06.bin').read_bytes()
          entries={
            'G11':'0x36B0',
            'G28':'0x3B08',
            'G30':'0x3D38',
          }

          def u32(o): return struct.unpack_from('<I',raw,o)[0]
          def i64(o): return struct.unpack_from('<q',raw,o)[0]
          def dyn(field,stride):
              count=u32(field)
              unknown=u32(field+4)
              rel=i64(field+8)
              # Tiger DynamicArray: data = field + 0x18 + relative.
              absolute=field+0x18+rel
              return {
                  'field_offset':field,'field_offset_hex':f'0x{field:X}',
                  'count':count,'unknown04':unknown,'relative':rel,
                  'data_offset':absolute,'data_offset_hex':f'0x{absolute:X}',
                  'stride':stride,
              }

          rows={}
          for label,entry_hex in entries.items():
              entry=int(entry_hex,16)
              a=dyn(entry,8)
              decoded=[]
              for i in range(a['count']):
                  o=a['data_offset']+i*8
                  decoded.append({
                      'index':i,
                      'row_offset':o,
                      'row_offset_hex':f'0x{o:X}',
                      'source_selector':raw[o],
                      'source_selector_hex':f'0x{raw[o]:02X}',
                      'reserved_01_03_hex':raw[o+1:o+4].hex().upper(),
                      'source_key':u32(o+4),
                      'source_key_hex':f'{u32(o+4):08X}',
                      'row_hex':raw[o:o+8].hex().upper(),
                  })
              rows[label]={
                  'entry_offset':entry,
                  'entry_offset_hex':entry_hex,
                  'input_descriptors':a,
                  'rows':decoded,
                  'entry_prefix_0x28_hex':raw[entry:entry+0x28].hex().upper(),
                  'unknown_0x14_f32':struct.unpack_from('<f',raw,entry+0x14)[0],
                  'local_channel_index':u32(entry+0x20),
              }

          out={
            'schema':'d1_tower_sequencer_input_descriptors/v1',
            'status':'EXACT_RETAIL_INPUT_DESCRIPTOR_ROWS',
            'resource_hash':'80AA8F06',
            'resource_sha256':hashlib.sha256(raw).hexdigest(),
            'resource_size':len(raw),
            'entries':rows,
            'retail_vm_evidence':{
              'vm_function':'FUN_00237710',
              'opcode_0x3c':'loads 16-byte input vector from param_2 + operand_index*0x10',
              'wrapper_function':'FUN_00111070',
              'descriptor_stride':8,
              'descriptor_source_selector_offset':0,
              'descriptor_source_key_offset':4,
              'resolver_function':'FUN_00311390',
            },
            'proof_boundary':'Rows and offsets are exact CUSA00219 01.33 retail bytes. Source selector/key semantics are retained raw until their resolver branches are closed from executable evidence.'
          }
          Path('reports/tower_sequencer_input_descriptors.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Persist exact evidence
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p evidence/generated
          cp reports/tower_sequencer_input_descriptors.json             evidence/generated/d1_tower_sequencer_input_descriptors.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/generated/d1_tower_sequencer_input_descriptors.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact Tower sequencer input descriptors'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-sequencer-input-descriptors
          path: reports/
          retention-days: 30
