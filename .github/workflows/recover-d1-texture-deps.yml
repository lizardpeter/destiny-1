name: Recover D1 texture dependencies

on:
  push:
    paths:
      - '.github/workflows/recover-d1-texture-deps.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch package 0156 pair and mirror index
        run: |
          set -euo pipefail
          mkdir -p deps
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          curl --fail --location --retry 3 "$base/" -o deps/index.html || true
          grep -ioE '[A-Za-z0-9_]+_0735_[01]\.pkg' deps/index.html | sort -u > deps/package_0735_matches.txt || true
          for f in ps4_globals_0156_0.pkg ps4_globals_0156_1.pkg; do
            curl --fail --location --retry 3 "$base/$f" --output "deps/$f"
            stat -c '%n %s bytes' "deps/$f"
            sha256sum "deps/$f"
          done

      - name: Upload dependency bundle
        uses: actions/upload-artifact@v4
        with:
          name: d1-texture-deps-0156
          path: deps/
          retention-days: 1
          if-no-files-found: error
