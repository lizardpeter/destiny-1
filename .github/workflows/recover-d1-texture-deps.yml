name: Recover D1 texture dependencies

on:
  push:
    paths:
      - '.github/workflows/recover-d1-texture-deps.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve package IDs 0156 and 0735
        run: |
          set -euo pipefail
          mkdir -p deps
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          curl --fail --location --retry 3 "$base/packages.txt" --output deps/packages.txt
          python - <<'PY'
          import re
          text=open('deps/packages.txt','r',encoding='utf-8',errors='replace').read()
          for pkg in ('0156','0735'):
              matches=sorted(set(re.findall(r'[^\s"\'<>]*_'+pkg+r'_[01]\.pkg[^\s"\'<>]*', text, flags=re.I)))
              open(f'deps/package_{pkg}_matches.txt','w').write('\n'.join(matches)+'\n')
              print(pkg+':')
              print('\n'.join(matches) if matches else 'NO_MATCH')
          PY

      - name: Upload package mappings
        uses: actions/upload-artifact@v4
        with:
          name: d1-texture-dependency-mappings
          path: deps/package_*_matches.txt
          retention-days: 1
          if-no-files-found: error
