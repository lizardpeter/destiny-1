name: D1 Tower common-layer top shader disassembly

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-common-top-shader-disassembly.yml'
      - 'tools/d1_world_shader_extract.py'
      - 'tools/d1_gcn_image_usage_analyze.py'

permissions:
  contents: read
  actions: read

jobs:
  shaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Runtime and exact common material manifest
        run: |
          set -euo pipefail
          mkdir -p runtime recovered deps prior shader disasm reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          gh run download 33994999358 -n d1-tower-common-layer-texture-census -D prior
          test -f prior/compact/common_material_texture_manifest.json

      - name: Recover exact current Tower plus shader dependency families
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py --package-list reports/packages.txt --out-dir recovered --report reports/current_corpus.json
          python tools/d1_recover_member_catalog.py --catalog evidence/d1_tower_texture_dependency_member_catalog.json \
            --package-list reports/packages.txt --family 0154 --family 0155 --family 0156 --family 0157 --family 0158 --family 01db \
            --out-dir deps --report reports/common_shader_global_recovery.json
          python tools/d1_recover_member_catalog.py --catalog evidence/d1_tower_shader_dependency_member_catalog.json \
            --package-list reports/packages.txt --family 00ec --family 00ee \
            --out-dir deps --report reports/common_shader_extra_recovery.json

      - name: Extract exact native GCN for highest-frequency common shader families
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered deps -maxdepth 1 -name '*.pkg' -type f | sort -u)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          sargs=()
          for h in 80AAE1F5 8093E96F 80AAE1F6 80CA08C4 80CA08B0 80CA08B1 8093E8A2 80CA0F50 80CA08C3 80CA08C1 80CA0BFA; do sargs+=(--shader "$h"); done
          python tools/d1_world_shader_extract.py "${args[@]}" --runtime runtime \
            --manifest prior/compact/common_material_texture_manifest.json "${sargs[@]}" \
            --out-dir shader --report reports/common_top_shader_extract.json
          python - <<'PY'
          import json
          d=json.load(open('reports/common_top_shader_extract.json'))
          if d['selected_count']!=11 or d['error_count']!=0:
              raise SystemExit('common top shader extraction incomplete: '+json.dumps(d))
          print('COMMON_TOP_SHADERS_EXACT',d['selected_count'])
          PY

      - name: Build pinned CLRX disassembler
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/CLRX/CLRX-mirror.git clrx
          git -C clrx checkout --quiet fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df
          test "$(git -C clrx rev-parse HEAD)" = 'fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df'
          cmake -S clrx -B clrx/build -DCMAKE_BUILD_TYPE=Release -DNO_CLWRAPPER=ON -DBUILD_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_DOCUMENTATION=OFF
          cmake --build clrx/build --target clrxdisasm -j2
          exe="$(find clrx/build -type f -name clrxdisasm -perm -111 | head -1)"; test -n "$exe"
          shopt -s nullglob
          for f in shader/PS_*_gcn.bin; do
            b="$(basename "$f" _gcn.bin)"
            "$exe" --raw --gpuType=GFX700 --hexcode "$f" > "disasm/${b}.s" 2> "disasm/${b}.stderr"
            test ! -s "disasm/${b}.stderr"
            grep -q 's_endpgm' "disasm/${b}.s"
          done

      - name: Prove exact native t# image consumption and emit focused instruction windows
        run: |
          set -euo pipefail
          python tools/d1_gcn_image_usage_analyze.py --extract-report reports/common_top_shader_extract.json \
            --disasm-dir disasm --out reports/common_top_gcn_image_usage.json
          python - <<'PY'
          import json,re
          from pathlib import Path
          d=json.load(open('reports/common_top_gcn_image_usage.json'))
          if d['shader_count']!=11 or d['unmatched_image_instruction_count']!=0:
              raise SystemExit('image provenance incomplete: '+json.dumps(d))
          by={x['shader']:x for x in d['shaders']}
          out=[]
          for sh,row in sorted(by.items()):
              text=(Path('disasm')/f'PS_{sh}.s').read_text(errors='replace').splitlines()
              windows=[]
              for ins in row['instructions']:
                  ln=int(ins['line_number']);lo=max(0,ln-7);hi=min(len(text),ln+7)
                  windows.append({'instruction':ins,'context':text[lo:hi]})
              out.append({'shader':sh,'image_instruction_count':row['image_instruction_count'],
                          'used_texture_indices':row['used_texture_indices'],'texture_instruction_counts':row['texture_instruction_counts'],
                          'windows':windows})
          Path('reports/common_top_image_windows.json').write_text(json.dumps({'status':'COMMON_TOP_NATIVE_IMAGE_WINDOWS','shaders':out},indent=2)+'\n')
          print(json.dumps([{k:r[k] for k in ('shader','image_instruction_count','used_texture_indices','texture_instruction_counts')} for r in out],indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-common-top-shader-disassembly
          path: |
            reports/common_top_shader_extract.json
            reports/common_top_gcn_image_usage.json
            reports/common_top_image_windows.json
            shader/
            disasm/
          retention-days: 14
          compression-level: 6
