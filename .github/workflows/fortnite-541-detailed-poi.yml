name: Fortnite 5.41 real detailed POI asset survey
on:
  pull_request:
    branches: [main]
    paths:
      - tools/fortnite_541_detailed_poi_probe.py
      - 'tools/fortnite_541_poi_rust/**'
      - .github/workflows/fortnite-541-detailed-poi.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify and inspect actual streamed Fortnite 5.41 detailed POI meshes and actor transforms
        run: python3 tools/fortnite_541_detailed_poi_probe.py
      - name: Compile production Rust high-detail POI decoder and verify exact island placements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,"tools")
          import fortnite_541_r2_material_probe as retail
          records=retail.load_index()
          for source,prefix in [
              ("Athena/Maps/Athena_POI_Foundations","foundation"),
              ("Athena/Maps/POI/Athena_POI_ToiletFactory_001","factory"),
              ("Athena/Maps/POI/Athena_POI_HedgeMaze","hedge")]:
              for suffix in (".umap",".uexp"):
                  key="FortniteGame/Content/"+source+suffix
                  raw=retail.source_payload(records[key])
                  Path("/tmp/fortnite_"+prefix+suffix).write_bytes(raw)
                  print("FORTNITE_FULL_DETAIL_ORIGINAL_SOURCE_SHA1",key,len(raw),flush=True)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,"tools")
          import fortnite_541_skylight_cube_probe as split
          split.URL="https://r2.houseofkublai.com/Fortnite/5.41/FortniteGame/Content/Paks/pakchunk0_s3-WindowsClient.pak"
          split.INDEX_SHA="27376dab8f8a3488d0d2b5332a2a2da7d28fd73e"
          index=split.source()
          package="Packages/DS_Fortnite_Terrain_NoLOD/Elevation/S_Cave_Outer_Middle"
          for suffix in (".uasset",".uexp"):
              raw=split.payload(index[package+suffix])
              Path("/tmp/fortnite_source_highdetail"+suffix).write_bytes(raw)
              print("FORTNITE_ORIGINAL_S3_LOD0_SOURCE_SHA1",package+suffix,len(raw),flush=True)
          PY
          cargo test --manifest-path tools/fortnite_541_poi_rust/Cargo.toml
          cargo run --quiet --manifest-path tools/fortnite_541_poi_rust/Cargo.toml -- /tmp/fortnite_foundation.umap /tmp/fortnite_foundation.uexp /tmp/fortnite_factory.umap /tmp/fortnite_factory.uexp /tmp/fortnite_hedge.umap /tmp/fortnite_hedge.uexp /tmp/fortnite_source_highdetail.uasset /tmp/fortnite_source_highdetail.uexp
