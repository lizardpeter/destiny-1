name: D1 Render Globals Channel Probe
# Manual exact-retail rerun requested 2026-10-04 with current-class RenderGlobals discovery.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-render-globals-channel-probe.yml'
      - 'tools/d1_remote_filehash_probe.py'
      - 'tools/d1_remote_entry_reference_class_scan.py'
      - 'tools/d1_tower_light_unk4b_census.py'
      - 'tools/d1_global_channel_defaults_decode.py'
      - 'tools/d1_remote_tower_entity_resource_census.py'
      - 'tools/d1_tower_global_channel_sequencer_symbolic.py'
      - 'tools/d1_tower_global_channel_join.py'
      - 'tools/d1_tower_light_runtime_globals_summary.py'

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_URL: https://crypt.cohae.dev/destiny/ps4/packages/latest

    steps:
      - uses: actions/checkout@v4

      - name: Recover current package list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source reports runtime
          idx_run="$(gh run list --workflow d1-global-activity-index.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$idx_run"
          gh run download "$idx_run" -n d1-global-activity-index -D source
          plist="$(find source -name packages.txt -print -quit)"
          test -n "$plist" -a -f "$plist"
          cp "$plist" reports/packages.txt

      - name: Install exact Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Recover current Tower Activity map-data graph
        env:
          GH_TOKEN: ${{ github.token }}
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          mkdir -p current-index packages reports/root_closure
          gh run download "$(gh run list --workflow d1-global-activity-index.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')" \
            -n d1-global-activity-index -D current-index
          idx="$(find current-index -name D1_CURRENT_ACTIVITY_INDEX.json -print -quit)"
          test -n "$idx" -a -f "$idx"
          cp "$idx" reports/D1_CURRENT_ACTIVITY_INDEX.json

          python tools/d1_world_activity_root_dependency_closure.py \
            --index reports/D1_CURRENT_ACTIVITY_INDEX.json \
            --package-list reports/packages.txt \
            --activity 80C98019 \
            --runtime runtime \
            --package-dir packages \
            --work-dir reports/root_closure \
            --root-out reports/activity_map_roots.json \
            --report reports/activity_root_dependency_closure.json

          mapfile -t files < <(find packages -maxdepth 1 -name '*.pkg' -type f | sort)
          test "${#files[@]}" -gt 0
          args=()
          for file in "${files[@]}"; do args+=(--snapshot "$file"); done
          python tools/d1_world_map_data_layer_census.py \
            "${args[@]}" \
            --runtime runtime \
            --map-root-json reports/activity_map_roots.json \
            --out reports/map_data_layer_census.json

          python tools/d1_remote_tower_entity_resource_census.py \
            --map-data-layer reports/map_data_layer_census.json \
            --package-list reports/packages.txt \
            --runtime runtime \
            --base-url "$BASE_URL" \
            --out reports/tower_entity_resource_census.json

      - name: Discover exact current RenderGlobals by class
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          # Source bytes B0 1B 80 80 decode to numeric 0x80801BB0 in the
          # little-endian Tiger FileEntry.Reference field.
          python tools/d1_remote_entry_reference_class_scan.py \
            --package-id 0x0151 \
            --package-id 0x0154 \
            --package-id 0x0155 \
            --package-id 0x0156 \
            --package-id 0x0157 \
            --package-id 0x0158 \
            --package-id 0x072B \
            --package-id 0x072F \
            --package-id 0x0735 \
            --package-id 0x018D \
            --package-id 0x0172 \
            --package-id 0x01A3 \
            --reference 80801BB0 \
            --package-list reports/packages.txt \
            --runtime runtime \
            --base-url "$BASE_URL" \
            --out reports/current_render_globals_class_scan.json
          render_tag="$(python - <<'PY'
          import json
          d=json.load(open('reports/current_render_globals_class_scan.json'))
          hits=[x for x in d['hits'] if x.get('available') and x.get('payload_size',0)>=0x38 and not x.get('violations')]
          if len(hits)!=1:
              raise SystemExit(f'expected one readable exact 80801BB0 RenderGlobals candidate, got {[(x["package_id"],x["tag_hash"],x.get("payload_size")) for x in hits]}')
          print(hits[0]['tag_hash'])
          PY
          )"
          echo "$render_tag" > reports/render_globals_tag.txt
          python tools/d1_remote_filehash_probe.py \
            --tag-hash "$render_tag" \
            --package-list reports/packages.txt \
            --runtime runtime \
            --base-url "$BASE_URL" \
            --out reports/render_globals.json
          python - <<'PY'
          import json
          e=json.load(open('reports/render_globals.json'))['entries'][0]
          if e.get('violations'):
              raise SystemExit(e['violations'])
          if e['entry']['reference'].upper()!='80801BB0':
              raise SystemExit(f'current RenderGlobals target class {e["entry"]["reference"]} != 80801BB0')
          PY

      - name: Follow RenderGlobals GlobalChannelDefaults tag at +0x34
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          channels_tag="$(python - <<'PY'
          import json
          d=json.load(open('reports/render_globals.json'))
          e=d['entries'][0]
          hit=[x for x in e['aligned_resolved_tag_matches'] if int(x['offset'])==0x34]
          if len(hit)!=1:
              raise SystemExit(f'expected one exact RenderGlobals +0x34 tag, got {hit}')
          print(hit[0]['tag_hash'])
          PY
          )"
          echo "$channels_tag" > reports/global_channel_defaults_tag.txt
          mkdir -p reports/payloads
          python tools/d1_remote_filehash_probe.py \
            --tag-hash "$channels_tag" \
            --package-list reports/packages.txt \
            --runtime runtime \
            --base-url "$BASE_URL" \
            --payload-out-dir reports/payloads \
            --out reports/global_channel_defaults.json
          python tools/d1_global_channel_defaults_decode.py \
            "reports/payloads/$channels_tag.bin" \
            --tag-hash "$channels_tag" \
            --index 0x11 --index 0x28 --index 0x30 --index 0x60 \
            --require-requested-in-range \
            --out reports/global_channel_defaults_decoded.json
          python tools/d1_tower_global_channel_join.py \
            --defaults reports/global_channel_defaults_decoded.json \
            --tower-census reports/tower_entity_resource_census.json \
            --out reports/tower_global_channel_join.json
          python tools/d1_tower_global_channel_sequencer_symbolic.py \
            --join reports/tower_global_channel_join.json \
            --out reports/tower_global_channel_sequencer_symbolic.json
          python tools/d1_tower_light_runtime_globals_summary.py \
            --defaults reports/global_channel_defaults_decoded.json \
            --join reports/tower_global_channel_join.json \
            --symbolic reports/tower_global_channel_sequencer_symbolic.json \
            --out reports/tower_light_runtime_global_channels.json

      - name: Record exact channel-table header census
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,struct
          def entry(path):
              return json.load(open(path))['entries'][0]
          r=entry('render_globals.json')
          g=entry('global_channel_defaults.json')
          raw=bytes.fromhex(g['prefix128'])
          words=[struct.unpack_from('<I',raw,o)[0] for o in range(0,len(raw)-3,4)]
          qwords=[struct.unpack_from('<Q',raw,o)[0] for o in range(0,len(raw)-7,8)]
          out={
            'schema':'d1_render_globals_global_channel_probe/v1',
            'status':'EXACT_CURRENT_RETAIL_RENDER_GLOBAL_CHAIN_CLOSED',
            'render_globals':{
              'tag_hash':r['tag_hash'],'entry':r['entry'],'sha256':r['payload_sha256'],
              'global_channel_defaults_field_offset':'0x34'
            },
            'global_channel_defaults':{
              'tag_hash':g['tag_hash'],'entry':g['entry'],'sha256':g['payload_sha256'],
              'payload_size':g['payload_size'],'prefix128':g['prefix128'],
              'u32_words_first_128':[f'{x:08X}' for x in words],
              'u64_words_first_128':[f'{x:016X}' for x in qwords],
            },
            'external_schema_lead':{
              'repository':'Rhys-Kovacevic/charm_exporter',
              'commit':'4bdce74798549f50d3687732d47ec5183a516069',
              'claim':'D1 RoI raw opcode 0x4B maps to PushGlobalChannelVector; runtime table is ordered GlobalChannelDefaults',
              'promotion':'withheld_pending_exact_table_and_Tower_operand_dataflow'
            },
            'proof_boundary':'This closes the exact current-retail RenderGlobals class -> +0x34 GlobalChannelDefaults FileHash chain and preserves the channel-table payload header. DynamicArray layout and requested raw 0x4B channel rows are decoded separately without assigning human-facing semantics.'
          }
          open('reports/render_globals_global_channel_probe.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Commit exact generated evidence
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p evidence/generated
          cp reports/current_render_globals_class_scan.json evidence/generated/d1_current_render_globals_class_scan.json
          cp reports/render_globals.json evidence/generated/d1_render_globals_probe.json
          cp reports/global_channel_defaults.json evidence/generated/d1_global_channel_defaults_probe.json
          cp reports/global_channel_defaults_decoded.json evidence/generated/d1_global_channel_defaults_decoded.json
          cp reports/tower_entity_resource_census.json evidence/generated/d1_tower_entity_resource_census.json
          cp reports/tower_global_channel_join.json evidence/generated/d1_tower_global_channel_join.json
          cp reports/tower_global_channel_sequencer_symbolic.json evidence/generated/d1_tower_global_channel_sequencer_symbolic.json
          cp reports/tower_light_runtime_global_channels.json evidence/generated/d1_tower_light_runtime_global_channels.json
          cp reports/render_globals_global_channel_probe.json evidence/generated/d1_render_globals_global_channel_probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/generated/d1_current_render_globals_class_scan.json \
                  evidence/generated/d1_render_globals_probe.json \
                  evidence/generated/d1_global_channel_defaults_probe.json \
                  evidence/generated/d1_global_channel_defaults_decoded.json \
                  evidence/generated/d1_tower_entity_resource_census.json \
                  evidence/generated/d1_tower_global_channel_join.json \
                  evidence/generated/d1_tower_global_channel_sequencer_symbolic.json \
                  evidence/generated/d1_tower_light_runtime_global_channels.json \
                  evidence/generated/d1_render_globals_global_channel_probe.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record exact D1 render-global channel chain'
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-render-globals-channel-probe
          path: reports/
          retention-days: 14
          compression-level: 6
