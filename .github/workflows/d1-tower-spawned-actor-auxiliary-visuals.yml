name: D1 Tower spawned actor auxiliary visual variants

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-spawned-actor-auxiliary-visuals.yml'
      - 'tools/d1_remote_owned_entity_visual_plan.py'
      - 'tools/d1_world_articulated_model_export.py'
      - 'tools/d1_world_entity_model_material_bindings.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover exact catalog and runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy trimesh
          mkdir -p input/catalog runtime corpus material_expanded reports/material_passes models out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 4 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt

      - name: Build exact source-owned auxiliary variant visual plan
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python tools/d1_remote_owned_entity_visual_plan.py \
            --entity 80C885D4 \
            --entity 80C880D7 \
            --entity 80C888BF \
            --entity 80C88229 \
            --entity 80C888C0 \
            --entity 80C888C1 \
            --entity 80C888C2 \
            --entity 80C888C3 \
            --entity 80C888C4 \
            --entity 80C888C5 \
            --entity 80C888C6 \
            --entity 80C7AC8E \
            --entity 80C88228 \
            --entity 80C889D3 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' \
            --part-count 10 --runtime runtime \
            -o reports/tower_spawned_actor_auxiliary_visual_plan.json \
            | tee reports/plan_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_spawned_actor_auxiliary_visual_plan.json'))
          assert d['status']=='D1_WORLD_ARTICULATED_ENTITY_PLAN_COMPLETE',d['violations']
          assert d['candidate_count']==14,d
          assert d['unique_model_count']==14,d
          expected={'80C88656','80C88158','80C8891E','80C882AA','80C8891F','80C88920','80C88921','80C88922','80C88934','80C88935','80C88936','80C7ACA3','80C882A9','80876D88'}
          got={x['models'][0] for x in d['candidates']}
          assert got==expected,(got,expected)
          open('reports/required_ids.txt','w').write('\n'.join(d['required_initial_package_ids'])+'\n')
          print('AUXILIARY_PLAN','entities',d['candidate_count'],'models',d['unique_model_count'],'families',d['family_count'],'required_package_ids',d['required_initial_package_ids'])
          PY

      - name: Recover all exact geometry and material dependency families
        run: |
          set -euo pipefail
          args=(); while read -r p; do args+=(--required-package-id "$p"); done < reports/required_ids.txt
          python tools/d1_tower_recover_articulated_visual_corpus.py \
            --package-list reports/packages.txt "${args[@]}" \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --out-dir corpus --report reports/tower_spawned_actor_auxiliary_visual_corpus.json
          mapfile -t files < <(find corpus -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_expand_world_material_dependencies.py "${args[@]}" \
            --runtime runtime \
            --articulated-plan reports/tower_spawned_actor_auxiliary_visual_plan.json \
            --package-list reports/packages.txt \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --expansion-dir material_expanded \
            --work-dir reports/material_passes \
            --out reports/tower_spawned_actor_auxiliary_material_bindings.json \
            --report reports/tower_spawned_actor_auxiliary_material_expansion.json

      - name: Export all exact retail-visible auxiliary models
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          mapfile -t files < <(find corpus material_expanded -name '*.pkg' -type f | sort -u)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_articulated_model_export.py "${args[@]}" \
            --runtime runtime \
            --articulated-plan reports/tower_spawned_actor_auxiliary_visual_plan.json \
            --material-bindings reports/tower_spawned_actor_auxiliary_material_bindings.json \
            --out-dir models \
            --summary reports/tower_spawned_actor_auxiliary_model_export.json
          python - <<'PY'
          import glob,json,os
          d=json.load(open('reports/tower_spawned_actor_auxiliary_model_export.json'))
          assert d['status']=='D1_WORLD_ARTICULATED_MODEL_SET_COMPLETE',d['errors']
          assert d['requested_model_count']==d['exported_model_count']==14,d
          fs=sorted(glob.glob('models/*.glb')); assert len(fs)==14,fs
          print('AUXILIARY_EXPORTED','models',len(fs),'ranges',d['geometry_count'],'triangles',d['triangle_count'],'unique_materials',d['active_material_count'])
          for r in d['models']:
              print(' MODEL',r['model'],'ranges',r['geometry_count'],'triangles',r['triangle_count'],'materials',r['active_material_count'],'bounds',r['bounds'])
          PY
          cp models/*.glb out/
          cp reports/tower_spawned_actor_auxiliary_visual_plan.json out/
          cp reports/tower_spawned_actor_auxiliary_material_bindings.json out/
          cp reports/tower_spawned_actor_auxiliary_model_export.json out/
          sha256sum out/* > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-TOWER-SPAWNED-ACTOR-AUXILIARY-EXACT-VISUALS
          path: out/
          retention-days: 30
          if-no-files-found: error
