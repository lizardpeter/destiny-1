name: D1 Tower three-NPC high-impact PS semantics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/d1_three_npc_ps_809d835a_semantic_proof.py'
      - 'tools/d1_three_npc_ps_809d835c_semantic_proof.py'
      - '.github/workflows/d1-tower-three-npc-high-impact-ps-semantics.yml'

permissions: {contents: read, actions: read}

env:
  FRONTIER_ARTIFACT_ID: '10069257974'
  FRONTIER_ARTIFACT_SHA256: 'fe26726d4853c2ad2e2bc46c4a4ae51346e71583420f6e36cc573bb344799f27'
  STATE_ARTIFACT_ID: '10069795151'
  STATE_ARTIFACT_SHA256: '5dd54066b4460a49b7bb9106b870f4a1523e2ecd7d83e0932a59fcebbda70830'

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover pinned native shader frontier and exact 85-material state
        run: |
          set -euo pipefail
          mkdir -p input/frontier input/state reports
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FRONTIER_ARTIFACT_ID}/zip" -o input/frontier.zip
          echo "${FRONTIER_ARTIFACT_SHA256}  input/frontier.zip" | sha256sum --check --strict
          unzip -q input/frontier.zip -d input/frontier
          test -f input/frontier/all_visible_ps_extract.json
          test -f input/frontier/THREE_NPC_PS_IMAGE_USAGE.json
          test -f input/frontier/disasm/PS_809D835A.s
          test -f input/frontier/disasm/PS_809D835C.s

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STATE_ARTIFACT_ID}/zip" -o input/state.zip
          echo "${STATE_ARTIFACT_SHA256}  input/state.zip" | sha256sum --check --strict
          unzip -q input/state.zip -d input/state
          test -f input/state/THREE_NPC_MATERIAL_STAGE_STATE.json

      - name: Prove 809D835A exact native color dataflow
        run: |
          set -euo pipefail
          python tools/d1_three_npc_ps_809d835a_semantic_proof.py \
            --extract-report input/frontier/all_visible_ps_extract.json \
            --image-usage input/frontier/THREE_NPC_PS_IMAGE_USAGE.json \
            --material-state input/state/THREE_NPC_MATERIAL_STAGE_STATE.json \
            --disassembly input/frontier/disasm/PS_809D835A.s \
            --out reports/PS_809D835A_SEMANTICS.json
          python - <<'PY'
          import json
          d=json.load(open('reports/PS_809D835A_SEMANTICS.json'))
          assert d['status']=='D1_TOWER_PS_809D835A_DATAFLOW_SEMANTICS_EXACT' and not d['violations'],d
          assert d['visible_primitive_count']==33,d
          assert d['gates']['native_pixel_color_dataflow_closed'] is True,d
          assert d['gates']['portable_blender_recreation_complete'] is False,d
          print('PS_809D835A_EXACT',d['visible_primitive_count'])
          PY

      - name: Prove 809D835C exact native color dataflow
        run: |
          set -euo pipefail
          python tools/d1_three_npc_ps_809d835c_semantic_proof.py \
            --extract-report input/frontier/all_visible_ps_extract.json \
            --image-usage input/frontier/THREE_NPC_PS_IMAGE_USAGE.json \
            --material-state input/state/THREE_NPC_MATERIAL_STAGE_STATE.json \
            --disassembly input/frontier/disasm/PS_809D835C.s \
            --out reports/PS_809D835C_SEMANTICS.json
          python - <<'PY'
          import json
          d=json.load(open('reports/PS_809D835C_SEMANTICS.json'))
          assert d['status']=='D1_TOWER_PS_809D835C_DATAFLOW_SEMANTICS_EXACT' and not d['violations'],d
          assert d['visible_primitive_count']==24,d
          assert d['gates']['native_pixel_color_dataflow_closed'] is True,d
          assert d['gates']['portable_blender_recreation_complete'] is False,d
          print('PS_809D835C_EXACT',d['visible_primitive_count'])
          PY

      - name: Summarize promoted high-impact semantic coverage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.load(open('reports/PS_809D835A_SEMANTICS.json')),json.load(open('reports/PS_809D835C_SEMANTICS.json'))]
          total=sum(x['visible_primitive_count'] for x in rows)
          out={
            'schema_version':1,
            'status':'D1_TOWER_THREE_NPC_HIGH_IMPACT_PS_SEMANTICS_EXACT',
            'shader_count':2,
            'shaders':[x['shader'] for x in rows],
            'visible_primitive_count':total,
            'native_pixel_color_dataflow_closed':True,
            'portable_blender_recreation_complete':False,
            'policy':'57 visible primitives are instruction/dataflow closed across 809D835A and 809D835C. This does not promote unresolved shader families or claim Blender/PBR/deferred equivalence.',
          }
          Path('reports/HIGH_IMPACT_PS_SEMANTICS_CHECKPOINT.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          find reports -type f -print0 | sort -z | xargs -0 sha256sum > reports/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-TOWER-3-NPC-HIGH-IMPACT-PS-SEMANTICS
          path: reports/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
