name: D1 Xur Blender native master

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-blender-native-master.yml'
      - 'tools/d1_blender_xur_native_master.py'
      - 'tools/install_blender_lts.sh'

permissions:
  contents: read

env:
  XUR_RELEASE_URL: 'https://github.com/lizardpeter/destiny-1/releases/download/d1-tower-xur-corpus-calibrated-textured-actions-r3/D1_TOWER_XUR_80C88CEF_CORPUS_CALIBRATED_TEXTURED_ALL_ACTIONS.glb'
  XUR_RELEASE_SHA256: '37b91b4979a309b31ee899c7c617e45aa6cc8d13b15d741357d84a6b225bb5dd'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check Xur Blender builder
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_blender_xur_native_master.py

      - name: Recover exact calibrated Xur carrier
        run: |
          set -euo pipefail
          mkdir -p input out
          curl --fail --location --retry 4 --retry-delay 2 \
            "$XUR_RELEASE_URL" \
            -o input/D1_TOWER_XUR_80C88CEF_CORPUS_CALIBRATED_TEXTURED_ALL_ACTIONS.glb
          echo "$XUR_RELEASE_SHA256  input/D1_TOWER_XUR_80C88CEF_CORPUS_CALIBRATED_TEXTURED_ALL_ACTIONS.glb" | sha256sum --check --strict

      - name: Prove carrier structure before Blender import
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, struct
          p='input/D1_TOWER_XUR_80C88CEF_CORPUS_CALIBRATED_TEXTURED_ALL_ACTIONS.glb'
          raw=open(p,'rb').read()
          assert raw[:4]==b'glTF'
          n,t=struct.unpack_from('<II',raw,12)
          assert t==0x4E4F534A
          d=json.loads(raw[20:20+n].decode().rstrip(' \t\r\n\0'))
          mats=d.get('materials') or []
          anim=d.get('animations') or []
          skins=d.get('skins') or []
          assert len(mats)==54,len(mats)
          assert len(anim)==267,len(anim)
          assert len(skins)==1,len(skins)
          exact=0
          bad=[]
          for m in mats:
              ex=m.get('extras') or {}
              if ex.get('d1_material_taghash') and ex.get('d1_pixel_shader') and isinstance(ex.get('d1_native_texture_bindings'),list):
                  exact+=1
              else:
                  bad.append(m.get('name'))
          assert exact==54,(exact,bad)
          print('XUR_CARRIER_GREEN',{'materials':len(mats),'animations':len(anim),'skins':len(skins),'exact_material_extras':exact})
          PY

      - name: Install pinned Blender
        run: |
          set -euo pipefail
          BLENDER="$(bash tools/install_blender_lts.sh .blender | tail -n1)"
          test -x "$BLENDER"
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"

      - name: Build Xur native-semantic Blender master
        run: |
          set -euo pipefail
          "$BLENDER" --background --factory-startup \
            --python tools/d1_blender_xur_native_master.py -- \
            --input input/D1_TOWER_XUR_80C88CEF_CORPUS_CALIBRATED_TEXTURED_ALL_ACTIONS.glb \
            --output out/XUR_NATIVE_MASTER.blend \
            --preview out/XUR_NATIVE_MASTER.png \
            --report out/XUR_NATIVE_MASTER.json \
            | tee out/XUR_NATIVE_MASTER.stdout.txt

      - name: Validate saved Blender master
        run: |
          set -euo pipefail
          test -s out/XUR_NATIVE_MASTER.blend
          test -s out/XUR_NATIVE_MASTER.png
          test -s out/XUR_NATIVE_MASTER.json
          "$BLENDER" --background out/XUR_NATIVE_MASTER.blend \
            --python-expr "import bpy; assert bpy.app.version[:3]==(5,2,1); assert len(bpy.data.actions)==267, len(bpy.data.actions); assert len([m for m in bpy.data.materials if m.get('d1_material_taghash')])==54; assert bpy.context.scene.get('d1_native_material_semantics_fail_closed') is True; assert bpy.context.scene.get('d1_full_retail_equivalence_claimed') is False; print('XUR_MASTER_REOPEN_GREEN',len(bpy.data.objects),len(bpy.data.materials),len(bpy.data.actions))" \
            | tee out/XUR_NATIVE_MASTER.reopen.txt
          python - <<'PY'
          import json
          d=json.load(open('out/XUR_NATIVE_MASTER.json'))
          assert d['status']=='D1_XUR_BLENDER_NATIVE_MASTER_V1_COMPLETE',d
          assert d['material_count']==54,d
          assert d['action_count']==267,d
          assert d['armature_count']==1,d
          assert d['runtime_material_selection_proven'] is False,d
          assert d['runtime_default_action_selected'] is False,d
          assert d['full_native_equation_claimed'] is False,d
          print('XUR_NATIVE_MASTER_REPORT_GREEN',d['material_status_counts'])
          PY
          sha256sum out/XUR_NATIVE_MASTER.blend out/XUR_NATIVE_MASTER.png out/XUR_NATIVE_MASTER.json > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-XUR-BLENDER-NATIVE-MASTER
          path: out/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
