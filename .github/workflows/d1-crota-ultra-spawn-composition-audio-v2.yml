name: D1 Crota ultra-spawn composition audio v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-ultra-spawn-composition-audio-v2.yml'
      - 'tools/d1_remote_activity_audio_composition_polymorphic.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  CROTA_TYPED_ARTIFACT_ID: '10005016855'
  CROTA_TYPED_ARTIFACT_ZIP_SHA256: 'b1c158ff9d6c3cbb3a549f124d9d1c2415b9e6a189caf80bd58b7e37045231d0'

jobs:
  close-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog input/crota runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CROTA_TYPED_ARTIFACT_ID}/zip" -o input/crota.zip
          echo "${CROTA_TYPED_ARTIFACT_ZIP_SHA256}  input/crota.zip" | sha256sum --check --strict
          unzip -q input/crota.zip -d input/crota
          test -f input/crota/CROTA_ULTRA_SPAWN_TYPED_V2.json
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Close polymorphic composition audio
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_remote_activity_audio_composition_closure.py tools/d1_remote_activity_audio_composition_polymorphic.py
          python tools/d1_remote_activity_audio_composition_polymorphic.py \
            --entity-closure input/crota/CROTA_ULTRA_SPAWN_TYPED_V2.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_ULTRA_SPAWN_COMPOSITION_AUDIO_V2.json \
            | tee out/audio_stdout.txt
          python - <<'PY' | tee out/summary.txt
          import json, collections
          d=json.load(open('out/CROTA_ULTRA_SPAWN_COMPOSITION_AUDIO_V2.json'))
          assert d['status']=='D1_REMOTE_ACTIVITY_AUDIO_COMPOSITION_CLOSURE_COMPLETE',d['violations']
          assert d['violation_count']==0,d['violations']
          assert d['composition_resource_count']==2,d['composition_resource_count']
          assert d['validated_composition_resource_count']==2,d['validated_composition_resource_count']
          assert d['unique_typed_event_count']==1,d['typed_event_hashes']
          assert d['typed_event_hashes']==['809DD961'],d['typed_event_hashes']
          assert d['unique_typed_stream_count']==7,d['typed_stream_hashes']
          assert d['aligned_sightings_promoted_by_exact_schema_count']==1,d
          assert d['unclosed_aligned_event_sighting_count']==0,d
          variants=collections.Counter()
          for r in d['composition_resources']:
            for arr in r.get('wwise_arrays',[]):
              variants.update(arr.get('non_audio_variant_class_counts',{}))
          print('CROTA_COMPOSITION_AUDIO_CLOSED','COMPOSITIONS',d['composition_resource_count'],'EVENTS',d['unique_typed_event_count'],'STREAMS',d['unique_typed_stream_count'],'NON_AUDIO_VARIANTS',sum(variants.values()),'VARIANT_CLASSES',dict(variants))
          print('EVENT',d['typed_event_hashes'][0])
          print('STREAMS',d['typed_stream_hashes'])
          PY
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-ULTRA-SPAWN-COMPOSITION-AUDIO-V2
          path: out/
          retention-days: 30
          if-no-files-found: error
