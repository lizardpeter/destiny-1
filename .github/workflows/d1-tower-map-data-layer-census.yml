name: D1 Tower map data layer census

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["D1 Tower activity map-root census"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  census:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover proven Activity-root ownership artifact
        run: |
          set -euo pipefail
          mkdir -p root_evidence reports
          if [ "${{ github.event_name }}" = workflow_run ]; then
            root_run='${{ github.event.workflow_run.id }}'
          else
            root_run="$(gh run list --workflow d1-tower-activity-map-root-census.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$root_run"
          echo "ACTIVITY_ROOT_RUN=$root_run"
          gh run download "$root_run" -n d1-tower-activity-map-root-census -D root_evidence
          root_json="$(find root_evidence -type f -name tower_activity_map_root_census.json -print -quit)"
          manifest_plan="$(find root_evidence -type f -name tower_activity_manifest_dependency_plan.json -print -quit)"
          test -n "$root_json" -a -f "$root_json"
          test -n "$manifest_plan" -a -f "$manifest_plan"
          cp "$root_json" reports/tower_activity_map_roots.json
          cp "$manifest_plan" reports/tower_activity_manifest_dependency_plan.json
          python - <<'PY'
          import json
          r=json.load(open('reports/tower_activity_map_roots.json'))
          m=json.load(open('reports/tower_activity_manifest_dependency_plan.json'))
          expected_tables=sorted([
            '80C98028','80C984A0','80C9895C','80C989F7','80C997DF',
            '80C99956','80CA0B0E','80CA0B11','80CA0C4E',
          ])
          if r.get('status')!='D1_WORLD_ACTIVITY_MAP_ROOT_CENSUS_COMPLETE':
              raise SystemExit('upstream Activity-root artifact not complete')
          if r.get('selected_activities')!=['80C98019'] or sorted(r.get('map_data_tables',[]))!=expected_tables or r.get('total_reachable_map_entries')!=337:
              raise SystemExit('upstream Tower Activity-root fixture changed: '+json.dumps({
                  'activities':r.get('selected_activities'),'tables':r.get('map_data_tables'),
                  'entries':r.get('total_reachable_map_entries')},indent=2))
          if m.get('status')!='D1_WORLD_ACTIVITY_MANIFEST_DEPENDENCY_PLAN_COMPLETE' or m.get('manifest_package_ids')!=['0430','0431']:
              raise SystemExit('upstream manifest dependency fixture changed: '+json.dumps(m))
          print('CONSUMING_PROVEN_ACTIVITY_ROOTS',json.dumps({
              'activity':'80C98019','manifest_packages':m['manifest_package_ids'],
              'tables':len(expected_tables),'entries':337},sort_keys=True))
          PY

      - name: Recover current Tower map dependency corpus and runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered validation
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py \
            --package-list reports/packages.txt --out-dir recovered --report reports/current_corpus.json

      - name: Census every Activity-owned Tower map-data entry
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_map_data_layer_census.py "${args[@]}" --runtime runtime \
            --map-root-json reports/tower_activity_map_roots.json \
            --out reports/tower_map_data_layer_census.json \
            | tee reports/tower_map_data_layer_census_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_map_data_layer_census.json'))
          if (d.get('root_source') or {}).get('mode')!='ownership_root_manifest':
              raise SystemExit('map-data census did not consume ownership manifest')
          if d.get('map_data_table_count')!=9 or d.get('entry_count')!=337:
              raise SystemExit('map-data census root/count regression: '+json.dumps({
                  'tables':d.get('map_data_table_count'),'entries':d.get('entry_count')}))
          print('TOWER_MAP_DATA_FROM_ACTIVITY_ROOTS_CLOSED',d['map_data_table_count'],d['entry_count'])
          PY

      - name: Close and classify every static-map ResourcePointer chain
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_static_map_resource_chain_census.py "${args[@]}" --runtime runtime \
            --map-root-json reports/tower_activity_map_roots.json \
            --out reports/tower_static_map_resource_chain_census.json \
            | tee reports/tower_static_map_resource_chain_census_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_static_map_resource_chain_census.json'))
          if (d.get('root_source') or {}).get('mode')!='ownership_root_manifest':
              raise SystemExit('resource-chain census did not consume ownership manifest')
          expected={
            'status':'D1_WORLD_STATIC_MAP_RESOURCE_CHAIN_CLOSED',
            'map_data_table_count':9,'entry_count':337,'closed_chain_count':337,
            'direct_d1_baked_entry_count':10,'no_direct_d1_static_child_entry_count':327,
            'unique_static_map_count':19,'unique_direct_d1_static_map_data_count':10,
          }
          bad={k:{'expected':v,'actual':d.get(k)} for k,v in expected.items() if d.get(k)!=v}
          if bad: raise SystemExit('Tower resource-chain regression mismatch: '+json.dumps(bad,indent=2))
          print('TOWER_RESOURCE_CHAINS_FROM_ACTIVITY_ROOTS_CLOSED',json.dumps(expected,sort_keys=True))
          PY

      - name: Derive source-driven table/decal and baked target plan
        run: |
          set -euo pipefail
          python tools/d1_world_static_map_target_plan.py \
            --chain-json reports/tower_static_map_resource_chain_census.json \
            --out reports/tower_static_map_target_plan.json \
            --tsv reports/tower_static_map_target_plan.tsv \
            | tee reports/tower_static_map_target_plan_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_static_map_target_plan.json'))
          expected={
            'status':'D1_WORLD_STATIC_MAP_TARGET_PLAN_COMPLETE','map_data_table_count':9,
            'source_entry_count':337,'table_scoped_decal_target_count':9,
            'table_scoped_target_kind_counts':{'no_direct_d1_static_child':9},
            'table_scoped_target_row_reference_count':327,'baked_static_target_count':10,
            'direct_d1_baked_row_count':10,'no_direct_d1_static_child_row_count':327,
            'unique_table_scoped_static_maps':9,'unique_baked_static_maps':10,
          }
          bad={k:{'expected':v,'actual':d.get(k)} for k,v in expected.items() if d.get(k)!=v}
          if bad: raise SystemExit('Tower source-driven target-plan mismatch: '+json.dumps(bad,indent=2))
          expected_baked=sorted([
            '80C98254','80C984D8','80C98A6B','80C993CD','80C993CF',
            '80C997F5','80C99981','80CA0B70','80CA0B72','80CA0C60',
          ])
          actual_baked=sorted(x['static_map_data'] for x in d.get('targets',[]) if x.get('role')=='baked_static_target')
          if actual_baked!=expected_baked:
              raise SystemExit('Tower discovered baked carrier set changed: '+json.dumps({'expected':expected_baked,'actual':actual_baked},indent=2))
          print('TOWER_SOURCE_DRIVEN_TARGET_PLAN_CLOSED',json.dumps(expected,sort_keys=True))
          PY

      - name: Validate table-scoped common/decal layer from discovered targets
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_table_scoped_decal_census.py "${args[@]}" --runtime runtime \
            --target-plan reports/tower_static_map_target_plan.json \
            --out reports/tower_table_scoped_decal_census.json \
            --validation-dir validation/table_scoped_targets \
            | tee reports/tower_table_scoped_decal_census_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_table_scoped_decal_census.json'))
          expected={
            'status':'D1_WORLD_TABLE_SCOPED_DECAL_CENSUS_COMPLETE','target_count':19,
            'target_role_counts':{'table_scoped_decal_target':9,'baked_static_target':10},
            'validated_target_count':19,'table_scoped_target_count':9,
            'table_scoped_decal_records':327,'table_scoped_structurally_valid_decal_records':327,
            'table_scoped_singleton_transform_model_records':327,'table_scoped_all_records_singleton':True,
            'table_scoped_model_reference_occurrences':327,'table_scoped_unique_entity_models':69,
            'table_scoped_materialized_record_count':327,'table_scoped_export_ready_singleton_records':327,
            'baked_target_count':10,
          }
          bad={k:{'expected':v,'actual':d.get(k)} for k,v in expected.items() if d.get(k)!=v}
          if bad: raise SystemExit('Tower source-driven decal census mismatch: '+json.dumps(bad,indent=2))
          print('TOWER_SOURCE_DRIVEN_DECAL_LAYER_CLOSED',json.dumps(expected,sort_keys=True))
          PY

      - name: Census baked-static content across all discovered map resources
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_static_map_content_census.py "${args[@]}" --runtime runtime \
            --chain-json reports/tower_static_map_resource_chain_census.json \
            --out reports/tower_static_map_content_census.json \
            | tee reports/tower_static_map_content_census_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_static_map_content_census.json'))
          expected={
            'status':'D1_WORLD_STATIC_MAP_CONTENT_CENSUS_COMPLETE','static_map_count':19,
            'common_no_direct_d1_static_child_maps':9,'direct_d1_baked_static_maps':10,
            'structurally_valid_baked_static_maps':10,'visual_selection_complete_baked_static_maps':10,
            'retail_visible_baked_static_emitters':10,'unique_d1_static_map_data':10,
            'total_serialized_placements':50148,'total_retail_visible_placements':11728,
            'material_cache_unresolved':0,
          }
          bad={k:{'expected':v,'actual':d.get(k)} for k,v in expected.items() if d.get(k)!=v}
          if bad: raise SystemExit('Tower static-map regression mismatch: '+json.dumps(bad,indent=2))
          print('TOWER_STATIC_MAP_CONTENT_CLOSED',json.dumps(expected,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-map-data-layer-census
          path: |
            reports/
            validation/
          retention-days: 14
          compression-level: 6
