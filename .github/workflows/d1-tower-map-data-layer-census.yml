name: D1 Tower map data layer census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-map-data-layer-census.yml'
      - 'tools/d1_world_map_data_layer_census.py'
      - 'tools/d1_world_static_map_resource_chain_census.py'
      - 'tools/d1_world_static_map_content_census.py'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover current Tower corpus and runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py --package-list reports/packages.txt --out-dir recovered --report reports/current_corpus.json
      - name: Census every entry in the Tower map-data tables
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          tables=(
            80C98028 80C984A0 80C9895C 80C989F7 80C997DF
            80C99956 80CA0B0E 80CA0B11 80CA0C4E
          )
          table_args=(); for h in "${tables[@]}"; do table_args+=(--map-data-table "$h"); done
          python tools/d1_world_map_data_layer_census.py "${args[@]}" --runtime runtime \
            "${table_args[@]}" \
            --out reports/tower_map_data_layer_census.json | tee reports/tower_map_data_layer_census_stdout.txt
      - name: Close and classify every static-map ResourcePointer chain
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          tables=(
            80C98028 80C984A0 80C9895C 80C989F7 80C997DF
            80C99956 80CA0B0E 80CA0B11 80CA0C4E
          )
          table_args=(); for h in "${tables[@]}"; do table_args+=(--map-data-table "$h"); done
          python tools/d1_world_static_map_resource_chain_census.py "${args[@]}" --runtime runtime \
            "${table_args[@]}" \
            --expected-static-map 80C98254 \
            --expected-static-map 80C984D8 \
            --expected-static-map 80C98A6B \
            --expected-static-map 80C993CD \
            --expected-static-map 80C993CF \
            --expected-static-map 80C997F5 \
            --expected-static-map 80C99981 \
            --expected-static-map 80CA0B70 \
            --expected-static-map 80CA0B72 \
            --expected-static-map 80CA0C60 \
            --out reports/tower_static_map_resource_chain_census.json \
            | tee reports/tower_static_map_resource_chain_census_stdout.txt
      - name: Census baked-static content across all unique map resources
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_static_map_content_census.py "${args[@]}" --runtime runtime \
            --chain-json reports/tower_static_map_resource_chain_census.json \
            --out reports/tower_static_map_content_census.json \
            | tee reports/tower_static_map_content_census_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_static_map_content_census.json'))
          expected={
            'status':'D1_WORLD_STATIC_MAP_CONTENT_CENSUS_COMPLETE',
            'static_map_count':19,
            'common_no_direct_d1_static_child_maps':9,
            'direct_d1_baked_static_maps':10,
            'structurally_valid_baked_static_maps':10,
            'visual_selection_complete_baked_static_maps':10,
            'retail_visible_baked_static_emitters':10,
            'unique_d1_static_map_data':10,
            'total_serialized_placements':50148,
            'total_retail_visible_placements':11728,
            'material_cache_unresolved':0,
          }
          bad={k:{'expected':v,'actual':d.get(k)} for k,v in expected.items() if d.get(k)!=v}
          if bad: raise SystemExit('Tower static-map regression mismatch: '+json.dumps(bad,indent=2))
          print('TOWER_STATIC_MAP_CONTENT_CLOSED',json.dumps(expected,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-map-data-layer-census
          path: reports/
          retention-days: 14
          compression-level: 6
