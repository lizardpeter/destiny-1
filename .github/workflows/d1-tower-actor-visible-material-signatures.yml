name: D1 Tower actor visible material signatures

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-actor-visible-material-signatures.yml'
      - 'tools/d1_remote_tower_actor_material_signature_census.py'
      - 'tools/d1_remote_tower_descriptor_selection_calibration.py'
      - 'tools/d1_world_articulated_model_export.py'

permissions:
  contents: read
  actions: read

env:
  CORPUS_ARTIFACT_ID: '10034246419'
  CORPUS_ARTIFACT_SHA256: 'e1d844190a594fd1bc06f578c256f98f40f667561f529137bbc3a36a10f00ba2'
  VISUAL_ARTIFACT_ID: '10001232930'
  VISUAL_ARTIFACT_SHA256: 'a662155f8a6259def83474f08b7508c6f1f5f1f87b1d368b924b2648e6737113'
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: '${{ github.token }}'
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover pinned placement corpus, actor visual proof, catalog, and runtime
        run: |
          set -euo pipefail
          mkdir -p input/corpus input/visual input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CORPUS_ARTIFACT_ID}/zip" -o input/corpus.zip
          echo "${CORPUS_ARTIFACT_SHA256}  input/corpus.zip" | sha256sum --check --strict
          unzip -q input/corpus.zip -d input/corpus
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VISUAL_ARTIFACT_ID}/zip" -o input/visual.zip
          echo "${VISUAL_ARTIFACT_SHA256}  input/visual.zip" | sha256sum --check --strict
          unzip -q input/visual.zip -d input/visual
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Census exact visible actor material signatures
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_tower_actor_material_signature_census.py
          python tools/d1_remote_tower_actor_material_signature_census.py \
            --placement-calibration input/corpus/D1_TOWER_PLACEMENT_PERMUTATION_CORPUS_CALIBRATION.json \
            --visual-plan input/visual/tower_spawned_actor_visual_plan.json \
            --model-export input/visual/tower_spawned_actor_model_export.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime \
            -o out/D1_TOWER_ACTOR_VISIBLE_MATERIAL_SIGNATURES.json | tee out/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/D1_TOWER_ACTOR_VISIBLE_MATERIAL_SIGNATURES.json'))
          assert d['actor_model_count']==13,d
          assert not d['violations'],d['violations']
          assert d['proof']['D1_retail_descriptor_evaluator_source_closed'] is False,d['proof']
          assert d['proof']['runtime_active_scenario_selected'] is False,d['proof']
          assert d['proof']['runtime_active_D912_group_selected'] is False,d['proof']
          assert d['proof']['runtime_actor_animation_state_selected'] is False,d['proof']
          print('VISIBLE_MATERIAL_SIGNATURE_CENSUS_PERSISTED',d['status'])
          PY

      - name: Persist hashes
        if: always()
        run: find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-TOWER-ACTOR-VISIBLE-MATERIAL-SIGNATURES
          path: out/
          retention-days: 90
          if-no-files-found: error
