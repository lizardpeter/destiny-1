name: D1 Tower runtime-rig animation owner families

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-runtime-rig-animation-owner-families.yml'
      - 'tools/d1_tower_runtime_rig_animation_owner_probe.py'
      - 'tools/d1_tower_family_f_animation_ownership.py'
      - 'tools/d1_animation_control_state_map.py'
      - 'tools/d1_animation_retarget_probe.py'
      - 'tools/d1_entity_resource_probe.py'
      - 'tools/d1_recover_member_catalog.py'
      - 'tools/d1_split_tar_extract.py'
      - 'evidence/d1_tower_runtime_rig_animation_owner_specs.json'
      - 'evidence/d1_tower_family_e_animation_source_member_catalog.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Python dependencies
        run: python -m pip install -q numpy scipy pygltflib pyglm

      - name: Install verified Oodle runtime and current package index
        run: |
          set -euo pipefail
          mkdir -p runtime source reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt

      - name: Recover exact logical 023D Tower Activity family
        run: |
          set -euo pipefail
          python tools/d1_recover_member_catalog.py \
            --catalog evidence/d1_tower_family_e_animation_source_member_catalog.json \
            --package-list reports/packages.txt --family 023d \
            --out-dir source --report reports/recover_023d.json
          test "$(find source -maxdepth 1 -name 'ps4_city_tower_activities_act_023d_*.pkg' -type f | wc -l)" -eq 6
          echo 'de0a2e4052602d26184d9f739678a0805b8cb8272f3758204700e1687cb55695  source/ps4_city_tower_activities_act_023d_5.pkg' | sha256sum --check --strict

      - name: Pin animation parser
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
          test "$(git -C parser rev-parse HEAD)" = b9fdc3a43dd28118113275624fcc9054b75855f4

      - name: Validate Family G owner control and selected clips
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python tools/d1_tower_runtime_rig_animation_owner_probe.py \
            --activity-pkg source/ps4_city_tower_activities_act_023d_5.pkg \
            --runtime runtime --parser-root parser \
            --spec evidence/d1_tower_runtime_rig_animation_owner_specs.json \
            --family G -o reports/TOWER_FAMILY_G_ANIMATION_OWNERSHIP.json

      - name: Record known cross-package Family A frontier without blocking G
        run: |
          python - <<'PY'
          import json
          d={
            'schema_version':1,
            'status':'D1_TOWER_FAMILY_A_CROSS_PACKAGE_OWNER_FRONTIER',
            'family':'A',
            'sentity_package':'023D',
            'owner_high':{'resource':'80C7A2A5','package':'023D','class_pair':['80802B92','808020BB'],'control_filehash_offset':1096},
            'owner_low':{'resource':'80BC6412','package':'01E3','class_pair':['808020BF','808029D2'],'control_filehash_offset':272},
            'skeleton':{'resource':'80BC60B2','package':'01E3','node_count':4},
            'runtime_rig':{'resource':'80BC60B4','package':'01E3','control_count':4},
            'negative_evidence':{'run':34061502855,'failure':'80BC6412 absent from 023D; single-package resolver is insufficient'},
            'next_step':'Recover exact logical 01E3 family and validate A through a 023D+01E3 multi-package resolver.',
            'policy':'Cross-package ownership is preserved as a frontier, not repaired by searching for a same-shaped local resource.'
          }
          json.dump(d,open('reports/TOWER_FAMILY_A_CROSS_PACKAGE_FRONTIER.json','w'),indent=2)
          print(json.dumps(d,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-runtime-rig-animation-owner-families
          path: reports/
          retention-days: 14
          compression-level: 6
