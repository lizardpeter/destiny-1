name: D1 locate English localized GlobalStrings

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-find-english-globalstrings.yml'
      - 'tools/d1_remote_namespace_class_locator.py'

permissions:
  contents: read
  actions: read

env:
  COMPLETE_LOCATION_ARTIFACT_ID: '9994964717'
  COMPLETE_LOCATION_ZIP_SHA256: '0b6df62c3385e3250271be0c57876351e7b2a5076c6a2de056092a4d98446955'
  COMPLETE_LOCATION_JSON_SHA256: '00cf59176c30217c5134fe42f9862b7717fb751ef2b34fd395bd60d995959ef0'

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact 2105-package location index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/location out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${COMPLETE_LOCATION_ARTIFACT_ID}/zip" -o input/location.zip
          echo "${COMPLETE_LOCATION_ZIP_SHA256}  input/location.zip" | sha256sum --check --strict
          unzip -q input/location.zip -d input/location
          echo "${COMPLETE_LOCATION_JSON_SHA256}  input/location/D1_COMPLETE_PHYSICAL_LOCATION_INDEX.json" | sha256sum --check --strict
      - name: Scan English localized namespaces for exact GlobalStrings class
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_namespace_class_locator.py
          python tools/d1_remote_namespace_class_locator.py \
            --location-index input/location/D1_COMPLETE_PHYSICAL_LOCATION_INDEX.json \
            --kind localized --locale en --reference 80800550 \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            -o out/D1_ENGLISH_GLOBALSTRINGS.json | tee out/stdout.txt
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-ENGLISH-GLOBALSTRINGS
          path: out/
          retention-days: 14
          if-no-files-found: error
