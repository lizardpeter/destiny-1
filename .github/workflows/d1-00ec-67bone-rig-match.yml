name: D1 00EC 67-bone humanoid rig bank match

on:
  push:
    paths:
      - '.github/workflows/d1-00ec-67bone-rig-match.yml'
      - 'tools/d1_skeleton_rig_bank_match.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies
        run: python -m pip install -q numpy scipy pygltflib pyglm
      - name: Recover verified 00EC family and Oodle
        run: |
          set -euo pipefail
          mkdir -p runtime recovered out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --start-offset 0xAAB580800 \
            --target ps4_race_set_all_00ec_0.pkg --target ps4_race_set_all_00ec_1.pkg \
            --target ps4_race_set_all_00ec_2.pkg --target ps4_race_set_all_00ec_3.pkg \
            --target ps4_race_set_all_00ec_4.pkg --target ps4_race_set_all_00ec_5.pkg \
            --out recovered --manifest out/00ec_extract.json --retries 6 --timeout 90
      - name: Pin animation parser
        run: |
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
          test "$(git -C parser rev-parse HEAD)" = b9fdc3a43dd28118113275624fcc9054b75855f4
      - name: Match all 23 rigs against 67-node skeleton via all 1064 clips
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_skeleton_rig_bank_match.py recovered/ps4_race_set_all_00ec_5.pkg \
            --runtime runtime --parser-root parser --skeleton 809D8613 \
            -o out/809D8613_rig_bank_match.json
          python - <<'PY'
          import json
          d=json.load(open('out/809D8613_rig_bank_match.json'))
          assert d['runtime_rig_count']==23,d['runtime_rig_count']
          assert d['animation_clip_count']==1064,d['animation_clip_count']
          top=d['ranked_rigs'][0]
          assert top['exact_component_dimension_match_count']>0,top
          print('BEST',json.dumps(top,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-00ec-67bone-rig-match
          path: out/
          retention-days: 14
          if-no-files-found: warn
