name: Temporary probe PS4 weapon texture plates

on:
  push:
    paths:
      - '.github/workflows/tmp-weapon-011c-plate-static.yml'
      - 'tools/d1_texture_plate_probe.py'
      - 'tools/d1_entity_model_export.py'

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --quiet numpy trimesh pygltflib pillow texture2ddecoder
      - name: Recover verified runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports out textures
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover exact 011c and 011e families
        run: |
          set -euo pipefail
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x43779C800 \
            --target ps4_gear_weapons_011c_0.pkg --target ps4_gear_weapons_011c_1.pkg \
            --target ps4_gear_weapons_011c_2.pkg --target ps4_gear_weapons_011c_3.pkg --target ps4_gear_weapons_011c_5.pkg \
            --out recovered --manifest reports/011c_extract.json
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x439A04A00 \
            --target ps4_gear_weapons_011e_0.pkg --target ps4_gear_weapons_011e_1.pkg \
            --target ps4_gear_weapons_011e_2.pkg --target ps4_gear_weapons_011e_3.pkg --target ps4_gear_weapons_011e_5.pkg \
            --out recovered --manifest reports/011e_extract.json
      - name: Probe exact weapon texture plates
        run: |
          set -euo pipefail
          LINOODLE_SKIP_DLLMAIN=1 python tools/d1_texture_plate_probe.py \
            recovered/ps4_gear_weapons_011c_0.pkg --runtime runtime --header-tag 80A39E17 \
            -o reports/texture_plate_80A39E17.json
          cat reports/texture_plate_80A39E17.json
      - name: Decode visible shared material
        run: |
          set -euo pipefail
          LINOODLE_SKIP_DLLMAIN=1 python tools/d1_material_decode.py \
            recovered/ps4_gear_weapons_011e_0.pkg --runtime runtime --tag-hash 80A3CD9A \
            -o reports/material_80A3CD9A.json
          cat reports/material_80A3CD9A.json
      - name: Export direct material textures
        run: |
          set -euo pipefail
          LINOODLE_SKIP_DLLMAIN=1 python tools/d1_texture_export.py \
            recovered/ps4_gear_weapons_011e_0.pkg --runtime runtime \
            --dependency-pkg recovered/ps4_gear_weapons_011e_1.pkg \
            --dependency-pkg recovered/ps4_gear_weapons_011e_2.pkg \
            --dependency-pkg recovered/ps4_gear_weapons_011e_3.pkg \
            --dependency-pkg recovered/ps4_gear_weapons_011e_5.pkg \
            --tag-hash 80A3D4CF --tag-hash 80A3D4D6 --out textures/material
      - name: Export weapon geometry with D1 strip support
        run: |
          set -euo pipefail
          LINOODLE_SKIP_DLLMAIN=1 python tools/d1_entity_model_export.py \
            recovered/ps4_gear_weapons_011c_0.pkg --runtime runtime --tag-hash 80A39E12 \
            --out out/80A39E12_static.glb --json reports/80A39E12_static.json
          sha256sum out/80A39E12_static.glb | tee reports/static_glb.sha256
          cat reports/80A39E12_static.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weapon-011c-plate-static
          path: |
            reports/
            out/
            textures/
          retention-days: 2
