name: D1 Tower sky shader closure

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['D1 global Activity index']
    types: [completed]
  push:
    paths:
      - '.github/workflows/d1-tower-sky-shader-closure.yml'
      - 'tools/d1_close_world_shader_dependencies.py'
      - 'tools/d1_world_shader_extract.py'
      - 'tools/d1_gcn_image_usage_analyze.py'
      - 'tools/d1_gcn_cbuffer_usage_analyze.py'
      - 'tools/d1_gcn_terminal_mrt0_dependency_census.py'
      - 'tools/d1_tower_sky_shader_family_cluster.py'
      - 'tools/d1_tower_sky_source_material_siblings.py'
      - 'tools/d1_shader_pair_provenance_differential.py'
      - 'tools/d1_tower_sky_terminal_output_modes.py'
      - 'tools/d1_tower_sky_high_coverage_mrt0_factorization.py'
      - 'tools/d1_tower_sky_alpha_mrt0_factorization.py'
      - 'tools/d1_tower_sky_rgb_sibling_mrt0_factorization.py'
      - 'tools/d1_gcn_terminal_symbolic_reducer.py'
      - 'tools/d1_tower_sky_complex_pair_symbolic_proof.py'
      - 'tools/d1_tower_sky_symbolic_tail_proof.py'
      - 'tools/d1_tower_sky_final_symbolic_proof.py'
      - 'tools/d1_tower_sky_factorization_coverage.py'
      - 'tools/d1_shader_structural_family_cluster.py'
      - 'tools/d1_github_actions_artifact_pull.py'

permissions:
  contents: read
  actions: read

jobs:
  shaders:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact Tower sky material manifest and current activity index
        run: |
          set -euo pipefail
          mkdir -p input/sky input/index runtime packages work shader disasm reports

          sky_run="$(gh run list --workflow d1-tower-full-sky-model-export.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$sky_run"
          python tools/d1_github_actions_artifact_pull.py \
            --repo "$GITHUB_REPOSITORY" --run-id "$sky_run" \
            --artifact-name D1-TOWER-ALL-SKY-MODELS-EXACT-TEXTURES \
            --out-dir input/sky --clean \
            --report reports/ARTIFACT_PULL_SKY_MODELS.json
          test -f input/sky/reports/material_texture_manifest.json
          cp input/sky/reports/material_texture_manifest.json reports/tower_sky_material_texture_manifest.json

          idx_run="$(gh run list --workflow d1-global-activity-index.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$idx_run"
          python tools/d1_github_actions_artifact_pull.py \
            --repo "$GITHUB_REPOSITORY" --run-id "$idx_run" \
            --artifact-name d1-global-activity-index \
            --out-dir input/index --clean \
            --report reports/ARTIFACT_PULL_GLOBAL_INDEX.json
          cp "$(find input/index -name D1_CURRENT_ACTIVITY_INDEX.json -print -quit)" reports/D1_CURRENT_ACTIVITY_INDEX.json
          cp "$(find input/index -name packages.txt -print -quit)" reports/packages.txt

          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

          python - <<'PY'
          import json
          d=json.load(open('reports/tower_sky_material_texture_manifest.json'))
          assert d['material_decode_errors']==0,d
          assert d['texture_errors']==0,d
          assert d['decoded_texture_tags']==d['unique_texture_tags'],d
          freq={str(k).upper():int(v) for k,v in d.get('pixel_shader_frequency',{}).items()}
          assert freq,'sky pixel shader frequency is empty'
          print('TOWER_SKY_SHADER_SOURCE',
                'MATERIALS',d['visible_material_count'],
                'TEXTURES',d['unique_texture_tags'],
                'PIXEL_SHADER_FAMILIES',len(freq),
                'TOP',sorted(freq.items(),key=lambda x:(-x[1],x[0]))[:20])
          PY

      - name: Prove exact source-material sibling shader groups
        run: |
          set -euo pipefail
          python tools/d1_tower_sky_source_material_siblings.py \
            --manifest reports/tower_sky_material_texture_manifest.json \
            --out reports/TOWER_SKY_SOURCE_MATERIAL_SIBLINGS.json \
            | tee reports/TOWER_SKY_SOURCE_MATERIAL_SIBLINGS_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_SKY_SOURCE_MATERIAL_SIBLINGS.json'))
          assert d['status']=='D1_TOWER_SKY_SOURCE_MATERIAL_SIBLINGS_EXACT',d
          assert d['shader_family_count']==43,d
          assert not d['violations'],d['violations']
          print('TOWER_SKY_SOURCE_SIBLING_GROUPS',d['sibling_group_count'])
          for q in d['groups']:
              print('TOWER_SKY_SOURCE_SIBLINGS',q)
          PY

      - name: Recursively close exact sky pixel shader dependencies
        run: |
          set -euo pipefail
          python tools/d1_close_world_shader_dependencies.py \
            --index reports/D1_CURRENT_ACTIVITY_INDEX.json \
            --package-list reports/packages.txt \
            --manifest reports/tower_sky_material_texture_manifest.json \
            --runtime runtime \
            --package-dir packages \
            --work-dir work \
            --out-dir shader \
            --report reports/tower_sky_shader_dependency_closure.json
          cp shader/shader_report.json reports/tower_sky_shader_report.json
          python - <<'PY'
          import json
          m=json.load(open('reports/tower_sky_material_texture_manifest.json'))
          c=json.load(open('reports/tower_sky_shader_dependency_closure.json'))
          s=json.load(open('reports/tower_sky_shader_report.json'))
          n=len(m.get('pixel_shader_frequency',{}))
          assert c['status']=='D1_WORLD_PIXEL_SHADER_DEPENDENCY_CLOSURE_COMPLETE',c
          assert s['status']=='D1_WORLD_PIXEL_SHADER_GCN_EXACT',s
          assert s['selected_count']==n and s['error_count']==0,(n,s)
          print('TOWER_SKY_SHADER_CORPUS_EXACT',n,'FAMILIES',
                'GCN_BYTES',sum(int(x.get('gcn_bytes',0)) for x in s['shaders']))
          PY

      - name: Build pinned CLRX and disassemble every sky pixel shader
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/CLRX/CLRX-mirror.git clrx
          git -C clrx checkout --quiet fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df
          test "$(git -C clrx rev-parse HEAD)" = 'fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df'
          cmake -S clrx -B clrx/build -DCMAKE_BUILD_TYPE=Release -DNO_CLWRAPPER=ON -DBUILD_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_DOCUMENTATION=OFF
          cmake --build clrx/build --target clrxdisasm -j2
          exe="$(find clrx/build -type f -name clrxdisasm -perm -111 | head -1)"
          test -n "$exe"
          n=0
          shopt -s nullglob
          for f in shader/PS_*_gcn.bin; do
            b="$(basename "$f" _gcn.bin)"
            "$exe" --raw --gpuType=GFX700 --hexcode "$f" > "disasm/${b}.s" 2> "disasm/${b}.stderr"
            test ! -s "disasm/${b}.stderr"
            grep -q 's_endpgm' "disasm/${b}.s"
            n=$((n+1))
          done
          expected="$(python - <<'PY'
          import json
          print(len(json.load(open('reports/tower_sky_material_texture_manifest.json')).get('pixel_shader_frequency',{})))
          PY
          )"
          test "$n" -eq "$expected"

      - name: Recover exact sky image and constant-buffer provenance
        run: |
          set -euo pipefail
          python tools/d1_gcn_image_usage_analyze.py \
            --extract-report reports/tower_sky_shader_report.json \
            --disasm-dir disasm \
            --out reports/tower_sky_gcn_image_usage.json \
            | tee reports/tower_sky_gcn_image_usage_stdout.txt

          python tools/d1_gcn_cbuffer_usage_analyze.py \
            --extract-report reports/tower_sky_shader_report.json \
            --disasm-dir disasm \
            --out reports/tower_sky_gcn_cbuffer_usage.json \
            | tee reports/tower_sky_gcn_cbuffer_usage_stdout.txt

          python - <<'PY'
          import json
          e=json.load(open('reports/tower_sky_shader_report.json'))
          i=json.load(open('reports/tower_sky_gcn_image_usage.json'))
          c=json.load(open('reports/tower_sky_gcn_cbuffer_usage.json'))
          n=e['selected_count']
          assert i['status']=='D1_GCN_IMAGE_RESOURCE_USAGE_EXACT' and i['shader_count']==n,i
          assert c['status']=='D1_GCN_CBUFFER_USAGE_EXACT' and c['shader_count']==n,c
          print('TOWER_SKY_PROVENANCE_EXACT',n,'SHADERS',
                'IMAGE_INSTRUCTIONS',sum(x['image_instruction_count'] for x in i['shaders']),
                'UNRESOLVED_SBUF',c['unresolved_scalar_buffer_load_count'])
          PY

      - name: Slice terminal MRT0 dependencies for every sky shader family
        run: |
          set -euo pipefail
          mapfile -t all_sky < <(python - <<'PY'
          import json
          d=json.load(open('reports/tower_sky_shader_report.json'))
          rows=sorted([x for x in d['shaders'] if not x.get('error')],
                      key=lambda x:(-int(x.get('visible_material_count',0)),x['shader']))
          for r in rows:print(r['shader'])
          PY
          )
          test "${#all_sky[@]}" -gt 0
          args=(); for h in "${all_sky[@]}"; do args+=(--shader "$h"); done
          python tools/d1_gcn_terminal_mrt0_dependency_census.py \
            --usage reports/tower_sky_gcn_image_usage.json \
            --cbuffer-usage reports/tower_sky_gcn_cbuffer_usage.json \
            --disasm-dir disasm "${args[@]}" \
            --out reports/tower_sky_all_mrt0_dependencies.json \
            | tee reports/tower_sky_all_mrt0_dependencies_stdout.txt

          python - <<'PY'
          import json
          e=json.load(open('reports/tower_sky_shader_report.json'))
          d=json.load(open('reports/tower_sky_all_mrt0_dependencies.json'))
          assert d['status']=='D1_GCN_TERMINAL_MRT0_DEPENDENCY_CENSUS_EXACT',d
          assert d['shader_count']==e['selected_count'],(d['shader_count'],e['selected_count'])
          freq={x['shader']:int(x.get('visible_material_count',0)) for x in e['shaders']}
          assert {x['shader'] for x in d['shaders']}==set(freq),(len(d['shaders']),len(freq))
          print('TOWER_SKY_ALL_MRT0_COVERAGE',d['shader_count'],'OF',e['selected_count'])
          for r in sorted(d['shaders'],key=lambda x:(-freq.get(x['shader'],0),x['shader'])):
              print('TOWER_SKY_MRT0',r['shader'],
                    'MATERIALS',freq.get(r['shader'],0),
                    'COMPRESSED',r['terminal_mrt0_compressed'],
                    'OPERANDS',r['terminal_mrt0_operands'],
                    'UNION',r['mrt0_value_union'])
              for ch,row in r['channels'].items():
                  print('  SKY_CHANNEL',ch,row['value_slice'])
          PY

      - name: Prove high-coverage exact Tower sky terminal equations
        run: |
          set -euo pipefail
          python tools/d1_tower_sky_high_coverage_mrt0_factorization.py \
            --material-manifest reports/tower_sky_material_texture_manifest.json \
            --shader-report reports/tower_sky_shader_report.json \
            --image-usage reports/tower_sky_gcn_image_usage.json \
            --cbuffer-usage reports/tower_sky_gcn_cbuffer_usage.json \
            --terminal-mrt0 reports/tower_sky_all_mrt0_dependencies.json \
            --disasm-dir disasm \
            --out reports/TOWER_SKY_HIGH_COVERAGE_MRT0_FACTORIZATION.json \
            | tee reports/TOWER_SKY_HIGH_COVERAGE_MRT0_FACTORIZATION_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_SKY_HIGH_COVERAGE_MRT0_FACTORIZATION.json'))
          assert d['status']=='D1_TOWER_SKY_HIGH_COVERAGE_MRT0_FACTORIZATION_EXACT',d
          assert d['shader_family_count']==9,d
          assert d['visible_material_count']==35,d
          assert abs(d['visible_material_fraction']-(35/74))<1e-12,d
          assert not d['violations'],d['violations']
          by={x['shader']:x for x in d['rows']}
          assert by['80B9F982']['exact_terminal_equation']['mrt0_a']=='API0[19] * API0[23] * t0.a * t1.a * t2.a',by['80B9F982']
          assert by['80B9F981']['exact_terminal_equation']['mrt0_a']=='0',by['80B9F981']
          assert by['80BA2CA6']['exact_terminal_equation']['mrt0_a']=='API0[11] * t0.a',by['80BA2CA6']
          assert by['80B9F776']['exact_terminal_equation']['mrt0_a']=='API0[11] * t1.x',by['80B9F776']
          print('TOWER_SKY_HIGH_COVERAGE_MRT0_EXACT',d['shader_family_count'],d['visible_material_count'],d['visible_material_fraction'])
          for q in d['rows']:
              print('TOWER_SKY_FACTORIZED',q['shader'],q['mode'],q['visible_material_count'],q['exact_terminal_equation'])
          PY

      - name: Prove next exact Tower sky alpha-only equations
        run: |
          set -euo pipefail
          python tools/d1_tower_sky_alpha_mrt0_factorization.py \
            --material-manifest reports/tower_sky_material_texture_manifest.json \
            --shader-report reports/tower_sky_shader_report.json \
            --terminal-mrt0 reports/tower_sky_all_mrt0_dependencies.json \
            --disasm-dir disasm \
            --out reports/TOWER_SKY_ALPHA_MRT0_FACTORIZATION.json \
            | tee reports/TOWER_SKY_ALPHA_MRT0_FACTORIZATION_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_SKY_ALPHA_MRT0_FACTORIZATION.json'))
          assert d['status']=='D1_TOWER_SKY_ALPHA_MRT0_FACTORIZATION_EXACT',d
          assert d['shader_family_count']==11,d
          assert d['visible_material_count']==12,d
          assert abs(d['visible_material_fraction']-(12/74))<1e-12,d
          assert not d['violations'],d['violations']
          by={x['shader']:x for x in d['rows']}
          assert by['80B9F729']['exact_terminal_equation']['mrt0_a']=='t0.x * t1.x * t2.x',by['80B9F729']
          assert by['80AAE110']['exact_terminal_equation']['mrt0_a']=='t0.a',by['80AAE110']
          assert by['80B9F986']['exact_terminal_equation']['mrt0_a']=='clamp(API0[23] * t0.a * t1.a * t2.a * t3.a)',by['80B9F986']
          print('TOWER_SKY_ALPHA_BATCH_EXACT',d['shader_family_count'],d['visible_material_count'],d['visible_material_fraction'])
          for q in d['rows']:
              print('TOWER_SKY_ALPHA_FACTORIZED',q['shader'],q['visible_material_count'],q['exact_terminal_equation'])
          PY

      - name: Prove next exact Tower sky RGB sibling equations
        run: |
          set -euo pipefail
          python tools/d1_tower_sky_rgb_sibling_mrt0_factorization.py \
            --material-manifest reports/tower_sky_material_texture_manifest.json \
            --shader-report reports/tower_sky_shader_report.json \
            --terminal-mrt0 reports/tower_sky_all_mrt0_dependencies.json \
            --disasm-dir disasm \
            --out reports/TOWER_SKY_RGB_SIBLING_MRT0_FACTORIZATION.json \
            | tee reports/TOWER_SKY_RGB_SIBLING_MRT0_FACTORIZATION_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_SKY_RGB_SIBLING_MRT0_FACTORIZATION.json'))
          assert d['status']=='D1_TOWER_SKY_RGB_SIBLING_MRT0_FACTORIZATION_EXACT',d
          assert d['shader_family_count']==7,d
          assert d['visible_material_count']==7,d
          assert abs(d['visible_material_fraction']-(7/74))<1e-12,d
          assert not d['violations'],d['violations']
          expected={'80AADBAA','80B9E853','80B9EA21','80B9EA28','80B9F724','80B9F985','80B9F71A'}
          assert {x['shader'] for x in d['rows']}==expected,d
          for q in d['rows']:
              assert q['exact_terminal_equation']['mrt0_a']=='0',q
              print('TOWER_SKY_RGB_BATCH_FACTORIZED',q['shader'],q['exact_terminal_equation'])
          PY

      - name: Symbolically close highest-weight Tower sky pair
        run: |
          set -euo pipefail
          python tools/d1_gcn_terminal_symbolic_reducer.py \
            --usage reports/tower_sky_gcn_image_usage.json \
            --cbuffer-usage reports/tower_sky_gcn_cbuffer_usage.json \
            --disasm-dir disasm \
            --shader 80B9F726 --shader 80B9F727 \
            --out reports/TOWER_SKY_COMPLEX_PAIR_SYMBOLIC.json \
            | tee reports/TOWER_SKY_COMPLEX_PAIR_SYMBOLIC_stdout.txt
          python tools/d1_tower_sky_complex_pair_symbolic_proof.py \
            --material-manifest reports/tower_sky_material_texture_manifest.json \
            --shader-report reports/tower_sky_shader_report.json \
            --symbolic reports/TOWER_SKY_COMPLEX_PAIR_SYMBOLIC.json \
            --out reports/TOWER_SKY_COMPLEX_PAIR_SYMBOLIC_PROOF.json \
            | tee reports/TOWER_SKY_COMPLEX_PAIR_SYMBOLIC_PROOF_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_SKY_COMPLEX_PAIR_SYMBOLIC_PROOF.json'))
          assert d['status']=='D1_TOWER_SKY_COMPLEX_PAIR_SYMBOLIC_PROOF_EXACT',d
          assert d['shader_family_count']==2 and d['visible_material_count']==6,d
          assert d['shared_alpha_gate_relation_exact'] is True,d
          by={x['shader']:x for x in d['rows']}
          assert set(by)=={'80B9F726','80B9F727'},d
          assert by['80B9F727']['exact_terminal_equation']['R']=='0',by['80B9F727']
          assert by['80B9F727']['exact_terminal_equation']['G']=='0',by['80B9F727']
          assert by['80B9F727']['exact_terminal_equation']['B']=='0',by['80B9F727']
          print('TOWER_SKY_COMPLEX_PAIR_EXACT',
                d['visible_material_count'],'MATERIALS',
                'SHARED_ALPHA_GATE',d['shared_alpha_gate_factorization'])
          print('TOWER_SKY_726_EXPR_SHA',by['80B9F726']['terminal_expression_sha256'])
          print('TOWER_SKY_727_EXPR_SHA',by['80B9F727']['terminal_expression_sha256'])
          PY

      - name: Symbolically close ten Tower sky tail families
        run: |
          set -euo pipefail
          python tools/d1_gcn_terminal_symbolic_reducer.py \
            --usage reports/tower_sky_gcn_image_usage.json \
            --cbuffer-usage reports/tower_sky_gcn_cbuffer_usage.json \
            --disasm-dir disasm \
            --shader 80B9EA14 --shader 80B9EA16 --shader 80B9EA1C --shader 80B9EA1D \
            --shader 80B9EA24 --shader 80B9EA26 --shader 80B9EA2B \
            --shader 80B9F728 --shader 80B9F775 --shader 80B9FC88 \
            --out reports/TOWER_SKY_SYMBOLIC_TAIL.json \
            | tee reports/TOWER_SKY_SYMBOLIC_TAIL_stdout.txt
          python tools/d1_tower_sky_symbolic_tail_proof.py \
            --material-manifest reports/tower_sky_material_texture_manifest.json \
            --shader-report reports/tower_sky_shader_report.json \
            --symbolic reports/TOWER_SKY_SYMBOLIC_TAIL.json \
            --out reports/TOWER_SKY_SYMBOLIC_TAIL_PROOF.json \
            | tee reports/TOWER_SKY_SYMBOLIC_TAIL_PROOF_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_SKY_SYMBOLIC_TAIL_PROOF.json'))
          assert d['status']=='D1_TOWER_SKY_SYMBOLIC_TAIL_PROOF_EXACT',d
          assert d['shader_family_count']==10 and d['visible_material_count']==10,d
          assert not d['violations'],d['violations']
          expected={'80B9EA14','80B9EA16','80B9EA1C','80B9EA1D','80B9EA24','80B9EA26','80B9EA2B','80B9F728','80B9F775','80B9FC88'}
          assert {x['shader'] for x in d['rows']}==expected,d
          print('TOWER_SKY_SYMBOLIC_TAIL_EXACT',d['shader_family_count'],d['visible_material_count'])
          for r in d['rows']:
              print('TOWER_SKY_SYMBOLIC_TAIL_ROW',r['shader'],r['terminal_expression_sha256'])
          PY

      - name: Symbolically close final four Tower sky families
        run: |
          set -euo pipefail
          python tools/d1_gcn_terminal_symbolic_reducer.py \
            --usage reports/tower_sky_gcn_image_usage.json \
            --cbuffer-usage reports/tower_sky_gcn_cbuffer_usage.json \
            --disasm-dir disasm \
            --shader 80B9EA17 --shader 80B9EA1A --shader 80B9EA23 --shader 80B9EA25 \
            --out reports/TOWER_SKY_FINAL_SYMBOLIC.json \
            | tee reports/TOWER_SKY_FINAL_SYMBOLIC_stdout.txt
          python tools/d1_tower_sky_final_symbolic_proof.py \
            --material-manifest reports/tower_sky_material_texture_manifest.json \
            --shader-report reports/tower_sky_shader_report.json \
            --symbolic reports/TOWER_SKY_FINAL_SYMBOLIC.json \
            --out reports/TOWER_SKY_FINAL_SYMBOLIC_PROOF.json \
            | tee reports/TOWER_SKY_FINAL_SYMBOLIC_PROOF_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_SKY_FINAL_SYMBOLIC_PROOF.json'))
          assert d['status']=='D1_TOWER_SKY_FINAL_SYMBOLIC_PROOF_EXACT',d
          assert d['shader_family_count']==4 and d['visible_material_count']==4,d
          assert not d['violations'],d['violations']
          assert {x['shader'] for x in d['rows']}=={'80B9EA17','80B9EA1A','80B9EA23','80B9EA25'},d
          print('TOWER_SKY_FINAL_SYMBOLIC_EXACT',d['shader_family_count'],d['visible_material_count'])
          for r in d['rows']:
              print('TOWER_SKY_FINAL_SYMBOLIC_ROW',r['shader'],r['terminal_expression_sha256'])
          PY

      - name: Account exact Tower sky equation coverage
        run: |
          set -euo pipefail
          python tools/d1_tower_sky_factorization_coverage.py \
            --manifest reports/tower_sky_material_texture_manifest.json \
            --proof reports/TOWER_SKY_HIGH_COVERAGE_MRT0_FACTORIZATION.json \
            --proof reports/TOWER_SKY_ALPHA_MRT0_FACTORIZATION.json \
            --proof reports/TOWER_SKY_RGB_SIBLING_MRT0_FACTORIZATION.json \
