name: Temporary trace D1 investment weapon assembly phase 3

on:
  push:
    paths:
      - '.github/workflows/tmp-investment-weapon-assembly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover runtime and 011c
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x43779C800 \
            --target ps4_gear_weapons_011c_0.pkg --target ps4_gear_weapons_011c_1.pkg \
            --target ps4_gear_weapons_011c_2.pkg --target ps4_gear_weapons_011c_3.pkg --target ps4_gear_weapons_011c_5.pkg \
            --out recovered --manifest reports/011c_extract.json
      - name: Locate and recover 0135 investment asset family
        run: |
          set -euo pipefail
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x439A04A00 \
            --target ps4_investment_assets_0135_0.pkg --target ps4_investment_assets_0135_1.pkg \
            --target ps4_investment_assets_0135_2.pkg --target ps4_investment_assets_0135_3.pkg \
            --target ps4_investment_assets_0135_4.pkg --target ps4_investment_assets_0135_5.pkg \
            --out recovered --manifest reports/0135_extract.json
      - name: Find 011c entity data targets in 0135 assignment parents
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import json,struct,sys,hashlib
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader
          rt=Path('runtime')
          wr=EntryReader(Path('recovered/ps4_gear_weapons_011c_5.pkg'),rt)
          entities=[e['tag_hash'].upper() for e in wr.entries if e['type']==16 and e['subtype']==0 and e['reference'].upper()=='80800734']
          needles={h:struct.pack('<I',int(h,16)) for h in entities}
          target='80A39E0E'
          rows=[]
          for p in sorted(Path('recovered').glob('ps4_investment_assets_0135_*.pkg')):
              r=EntryReader(p,rt); hits=[]
              for e in r.entries:
                  if not r.available(e['index']): continue
                  try:b=r.entry(e['index'])
                  except Exception: continue
                  found=[]
                  for h,n in needles.items():
                      pos=b.find(n)
                      if pos>=0: found.append({'entity':h,'offset':pos})
                  if found:
                      hits.append({'tag_hash':e['tag_hash'].upper(),'entry_index':e['index'],'reference':e['reference'].upper(),'type':e['type'],'subtype':e['subtype'],'size':e['file_size'],'hits':found,'payload_prefix':b[:64].hex(),'sha256':hashlib.sha256(b).hexdigest()})
              rows.append({'package':p.name,'patch_id':r.h['patch_id'],'hits':hits})
          out={'target':target,'entity_count':len(entities),'rows':rows}
          Path('reports/0135_011c_entity_parents.json').write_text(json.dumps(out,indent=2)+'\n')
          for row in rows:
              print('\nPATCH',row['patch_id'],'hits',len(row['hits']))
              for x in row['hits']:
                  print('PARENT',x['tag_hash'],'ref',x['reference'],'size',x['size'],'->',[(q['entity'],q['offset']) for q in x['hits']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: investment-weapon-assembly-phase3-0135
          path: reports/
          retention-days: 2
          if-no-files-found: error
