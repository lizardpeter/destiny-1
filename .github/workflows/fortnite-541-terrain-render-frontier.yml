name: Fortnite 5.41 original terrain shader and paint UV source proof
on:
  pull_request:
    branches: [main]
    paths:
      - tools/fortnite_541_terrain_render_frontier.py
      - .github/workflows/fortnite-541-terrain-render-frontier.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify authentic source terrain material UVs and original LayerInfo allocations
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 tools/fortnite_541_terrain_render_frontier.py
