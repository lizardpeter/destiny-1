name: D1 shared glove-collar decoded TGXM PS4 equivalence

on:
  push:
    paths:
      - '.github/workflows/d1-spektr-shared-glove-collar-geometry-equivalence.yml'
      - 'tools/d1_tgxm_ps4_geometry_equivalence.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install dependencies
        run: python -m pip install -q numpy trimesh

      - name: Recover exact target TGXM and verified Oodle runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/historical runtime out
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=D1-SPEKTAR-HISTORICAL-GEARASSET-EXACT-TGXM&per_page=20" \
            | python -c "import json,sys; a=[x for x in json.load(sys.stdin)['artifacts'] if not x['expired']]; assert a; a.sort(key=lambda x:x['created_at'],reverse=True); print(a[0]['archive_download_url'])")
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$url" -o input/historical.zip
          unzip -q input/historical.zip -d input/historical
          target=$(find input/historical -type f -path '*/tgxm_male/B4BD27A2/2943ee229ea8c0c44dd610a4dd68ace3.tgxm' -print -quit)
          test -n "$target"
          cp "$target" input/shared_glove_collar_984938936-0.tgxm
          echo 'f5e7b2efae7d7737f87997c16dbc36047e0e685bc39f36c311435afc8c47d977  input/shared_glove_collar_984938936-0.tgxm' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Verify original-order positions and expanded topology
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_tgxm_ps4_geometry_equivalence.py \
            --target-tgxm input/shared_glove_collar_984938936-0.tgxm \
            --model 80A6A345 \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --member-catalog evidence/d1_globals_pvp_0169_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' \
            --part-count 10 --runtime runtime --position-tolerance 0.000002 \
            -o out/80A6A345_vs_984938936-0_geometry_equivalence.json

      - name: Lock geometry equivalence
        run: |
          python - <<'PY'
          import json
          d=json.load(open('out/80A6A345_vs_984938936-0_geometry_equivalence.json'))
          assert d['schema']=='d1_tgxm_ps4_geometry_equivalence/v1'
          assert d['target_tgxm_sha256']=='f5e7b2efae7d7737f87997c16dbc36047e0e685bc39f36c311435afc8c47d977'
          assert d['target_tgxm_file_identifier']=='984938936-0'
          assert d['ps4_model_tag_hash']=='80A6A345'
          assert d['tgxm_active_mesh_indices']==[0,2],d
          assert d['ps4_active_mesh_indices']==[0,2],d
          assert d['active_part_count_sequence']==[5,4],d
          assert d['geometry_equivalent'] is True,d
          for m in d['active_meshes']:
              assert m['per_index_position_sequence_equivalent'] is True,m
              assert m['expanded_topology_index_sequence_equivalent'] is True,m
          print('LOCKED GEOMETRY EQUIVALENT')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-shared-glove-collar-80A6A345-geometry-equivalence
          path: out/
          retention-days: 14
          if-no-files-found: error
