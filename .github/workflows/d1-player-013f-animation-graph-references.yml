name: D1 player 013F animation graph references

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-player-013f-animation-graph-references.yml'
      - 'tools/d1_remote_target_backlinks.py'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Scan exact aligned references in logical 013F structured entries
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_target_backlinks.py \
            --package-id 0x013F --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            --member ps4_investment_assets_013f_1.pkg:0x5A9421600:17747968 \
            --member ps4_investment_assets_013f_2.pkg:0x5AA50E800:3614720 \
            --member ps4_investment_assets_013f_3.pkg:0x5AA881200:301056 \
            --member ps4_investment_assets_013f_4.pkg:0x5AA8CAC00:284672 \
            --member ps4_investment_assets_013f_5.pkg:0x5AA910600:317440 \
            --target 80A7E499 --target 80A7F90B --target 80AD27B2 --target 80A6A125 \
            --max-entry-size 2000000 -o out/013F_player_animation_graph_references.json
      - name: Preserve exact-reference evidence without semantic promotion
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/013F_player_animation_graph_references.json'))
          assert not d['errors'],d['errors'][:20]
          c={'schema':'d1_player_013f_animation_graph_reference_checkpoint/v1',
             'targets':d['targets'],'scanned_structured_entries':d['scanned_structured_entries'],
             'hit_source_count':d['hit_source_count'],'occurrences_by_target':d['occurrences_by_target'],'hits':d['hits'],
             'policy':'Every reported relation is an exact aligned serialized 32-bit value. A source record is not assigned a gameplay semantic until its class/schema is separately decoded.'}
          json.dump(c,open('out/CHECKPOINT.json','w'),indent=2);open('out/CHECKPOINT.json','a').write('\n')
          print(json.dumps({'scanned':c['scanned_structured_entries'],'occurrences':c['occurrences_by_target'],
                            'hit_source_count':c['hit_source_count'],'hits':c['hits'][:40]},indent=2))
          PY
          sha256sum out/*.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-player-013f-animation-graph-references
          path: out/
          retention-days: 14
          if-no-files-found: error
