name: D1 player 013F animation component match

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-player-013f-animation-component-match.yml'
      - 'tools/d1_remote_animation_component_census.py'
      - 'tools/d1_animation_retarget_probe.py'

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install parser and verified Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install -q numpy scipy pyglm
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
          test "$(git -C parser rev-parse HEAD)" = b9fdc3a43dd28118113275624fcc9054b75855f4
          mkdir -p runtime out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Parse all 156 resident clips against exact 80A7F90B component fingerprint
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_animation_component_census.py \
            --package-id 0x013F \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --parser-root parser \
            --member ps4_investment_assets_013f_1.pkg:0x5A9421600:17747968 \
            --member ps4_investment_assets_013f_2.pkg:0x5AA50E800:3614720 \
            --member ps4_investment_assets_013f_3.pkg:0x5AA881200:301056 \
            --member ps4_investment_assets_013f_4.pkg:0x5AA8CAC00:284672 \
            --member ps4_investment_assets_013f_5.pkg:0x5AA910600:317440 \
            --component FFCA31D7:19 --component C6703C7D:30 --component F6E216A3:9 --component 988CF8E5:8 \
            -o out/013F_80A7F90B_animation_component_census.json
      - name: Validate complete parse and preserve match result without semantic overclaim
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/013F_80A7F90B_animation_component_census.json'));s=d['summary']
          assert s['animation_clip_count']==156,s
          assert s['parse_success_count']==156,s
          assert s['parse_error_count']==0,s
          assert d['target_control_count']==66,d['target_control_count']
          # Exact match count is deliberately not guessed ahead of the retail parse.
          out={'schema':'d1_player_013f_animation_component_match_checkpoint/v1','target_rig':'80A7F90B',
               'target_components':d['target_components'],'summary':s,
               'exact_match_tags':[x['tag_hash'] for x in d['exact_component_matches']],
               'policy':'Component equality is compatibility evidence. No matching clip is labeled player idle/run/etc. until a serialized owner/selector path provides that semantic.'}
          json.dump(out,open('out/CHECKPOINT.json','w'),indent=2);open('out/CHECKPOINT.json','a').write('\n')
          print(json.dumps(out,indent=2))
          PY
          sha256sum out/*.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-player-013f-animation-component-match
          path: out/
          retention-days: 14
          if-no-files-found: error
