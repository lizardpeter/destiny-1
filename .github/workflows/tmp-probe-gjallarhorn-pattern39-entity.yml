name: Temporary probe Gjallarhorn pattern39 sandbox entity

on:
  push:
    paths:
      - '.github/workflows/tmp-probe-gjallarhorn-pattern39-entity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover runtime and exact 0135 family
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports/raw
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_split_tar_extract.py --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --start-offset 0x5996C3000 \
            --target ps4_investment_assets_0135_0.pkg --target ps4_investment_assets_0135_1.pkg --target ps4_investment_assets_0135_2.pkg --target ps4_investment_assets_0135_3.pkg --target ps4_investment_assets_0135_4.pkg --target ps4_investment_assets_0135_5.pkg \
            --out recovered --manifest reports/0135_extract.json --retries 6 --timeout 90
      - name: Decode 80A6A017 and every local EntityResource
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader
          from d1_remote_s_entity_resource_package_find import parse_entity_resources
          from d1_entity_resource_probe import parse_resource
          r=EntryReader(Path('recovered/ps4_investment_assets_0135_5.pkg'),Path('runtime'))
          by={e['tag_hash'].upper():e for e in r.entries}
          e=by['80A6A017']; assert e['reference'].upper()=='80800734',e
          b=r.entry(e['index']); Path('reports/raw/80A6A017_entity.bin').write_bytes(b)
          resources=parse_entity_resources(b); rows=[]
          for x in resources:
            row=dict(x); h=x['resource_hash']; re=by.get(h)
            if re:
              row.update({'entry_reference':re['reference'].upper(),'entry_index':re['index'],'entry_size':re['file_size'],'available':r.available(re['index'])})
              if r.available(re['index']):
                try:
                  rb=r.entry(re['index']); row['sha256']=hashlib.sha256(rb).hexdigest(); Path('reports/raw',f'{h}.bin').write_bytes(rb)
                  if re['reference'].upper()=='80800861': row['parsed_entity_resource']=parse_resource(rb,'PS4')
                except Exception as ex: row['read_error']=repr(ex)
            rows.append(row); print('GJ_PATTERN_RESOURCE',json.dumps(row,separators=(',',':')))
          out={'pattern_index':39,'pattern_entity':'80A6A017','entity_entry':e,'entity_sha256':hashlib.sha256(b).hexdigest(),'resources':rows}
          Path('reports/gjallarhorn_pattern39_entity.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-gjallarhorn-pattern39-entity
          path: reports/
          retention-days: 7
          if-no-files-found: error
