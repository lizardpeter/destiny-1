name: Fortnite 5.41 original torch material shader blend contract
on:
  pull_request:
    branches: [main]
    paths:
      - tools/fortnite_541_torch_emissive_blend_contract.py
      - tools/fortnite_541_poi_rust/src/material_surface.rs
      - tools/fortnite_541_poi_rust/src/material_numeric.rs
      - tools/fortnite_541_poi_rust/src/main.rs
      - .github/workflows/fortnite-541-torch-emissive-contract.yml
  workflow_dispatch:
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Read original source Flame parent and Bloom UMaterial emissive/blend inputs
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 tools/fortnite_541_torch_emissive_blend_contract.py
      - name: Compile and test source-exact native UE4 material expression parser
        run: cargo test --manifest-path tools/fortnite_541_poi_rust/Cargo.toml
      - name: Verify exact retail glow emitted HDR literal, blend mode and source WPO frontier
        run: cargo run --quiet --manifest-path tools/fortnite_541_poi_rust/Cargo.toml -- --audit-original-bloom-shader
      - name: Verify original Torch fire scalar/vector shader override chain in native Rust
        run: cargo run --quiet --manifest-path tools/fortnite_541_poi_rust/Cargo.toml -- --audit-original-torch-mic-numerics
