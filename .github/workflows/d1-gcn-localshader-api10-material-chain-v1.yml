name: D1 GCN LocalShader API10 material chain v1

on:
  workflow_dispatch:
  push:
    branches: [d1-crota-source-semantics-v1]
    paths:
      - 'tools/d1_gcn_localshader_api10_material_chain_v1.py'
      - '.github/workflows/d1-gcn-localshader-api10-material-chain-v1.yml'
permissions: {contents: read, actions: read}
env:
  OWNER_ARTIFACT_ID: '10126529830'
  OWNER_ZIP_SHA256: 'b526d8b22670eb2346c956ba4a6e339203e508e662c2601c42ebdb7763049a67'
  OWNER_REPORT_SHA256: '1c9088280bfd691499c2d3a0681d76bfc76348f551262f8c54a6f11c4c66ac08'
  REFERENCE_ARTIFACT_ID: '10129121118'
  REFERENCE_ZIP_SHA256: 'a293d78521b6ff5b8852bfaeeec694ded28f327a4ab03cb7d64036d44b52eb5f'
  REFERENCE_REPORT_SHA256: 'd859a8f19e267ec3a0f36afbe949d4bf523811f7f9509f6af6d2696c0142284c'
  USAGE_ARTIFACT_ID: '10172731401'
  USAGE_ZIP_SHA256: '5c4dcfc72768f3e0960dead4a612c9d35281c3246cd7ded5f32c4efc83563533'
  USAGE_REPORT_SHA256: '6c6c07d03ed06d8b53693326cbabd9fde7c7a2f7b0c41e02939e700cf4f21127'
jobs:
  join:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover pinned exact inputs
        run: |
          set -euo pipefail; mkdir -p input/owner input/reference input/usage out
          python -m py_compile tools/d1_gcn_localshader_api10_material_chain_v1.py
          for spec in "owner $OWNER_ARTIFACT_ID $OWNER_ZIP_SHA256" "reference $REFERENCE_ARTIFACT_ID $REFERENCE_ZIP_SHA256" "usage $USAGE_ARTIFACT_ID $USAGE_ZIP_SHA256"; do
            set -- $spec; n=$1; id=$2; sha=$3
            curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o input/${n}.zip
            echo "$sha  input/${n}.zip" | sha256sum --check --strict; unzip -q input/${n}.zip -d input/${n}
          done
          echo "$OWNER_REPORT_SHA256  input/owner/D1_GCN_MATERIAL_SHADER_OWNER_FRONTIER_V1.json" | sha256sum --check --strict
          echo "$REFERENCE_REPORT_SHA256  input/reference/D1_GCN_MATERIAL_SHADER_REFERENCE_PROBE_MERGED_V1.json" | sha256sum --check --strict
          echo "$USAGE_REPORT_SHA256  input/usage/D1_GCN_LOCALSHADER_TBUFFER_USAGE_BINDING_V1.json" | sha256sum --check --strict
      - name: Join exact material ownership to API10 programs
        run: |
          set -euo pipefail
          python tools/d1_gcn_localshader_api10_material_chain_v1.py --owner input/owner/D1_GCN_MATERIAL_SHADER_OWNER_FRONTIER_V1.json --reference input/reference/D1_GCN_MATERIAL_SHADER_REFERENCE_PROBE_MERGED_V1.json --usage input/usage/D1_GCN_LOCALSHADER_TBUFFER_USAGE_BINDING_V1.json -o out/D1_GCN_LOCALSHADER_API10_MATERIAL_CHAIN_V1.json | tee out/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/D1_GCN_LOCALSHADER_API10_MATERIAL_CHAIN_V1.json')); c=d['coverage']
          assert d['status']=='D1_GCN_LOCALSHADER_API10_MATERIAL_CHAIN_EXACT',d['violations'][:20]
          assert not d['violations']; assert c['exact_localshader_wrapper_count']==177 and c['localshader_material_occurrence_count']==3967,c
          assert c['api10_tbuffer_wrapper_count']==56 and c['api10_material_occurrence_count']==3386 and c['api10_unique_material_count']==3386,c
          assert c['api10_program_count']==39,c; assert c['serialized_material_stage_slot_counts']=={'VS':3386},c
          assert c['runtime_binding_owner_promotions']==0 and c['shader_stage_promotions']==0,c
          print('D1_GCN_LOCALSHADER_API10_MATERIAL_CHAIN_EXACT')
          PY
          sha256sum out/D1_GCN_LOCALSHADER_API10_MATERIAL_CHAIN_V1.json out/stdout.txt > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: D1-GCN-LOCALSHADER-API10-MATERIAL-CHAIN-V1, path: out/, retention-days: 30}
