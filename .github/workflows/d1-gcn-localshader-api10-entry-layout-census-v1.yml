name: D1 GCN LocalShader API10 entry layout census v1
on:
  workflow_dispatch:
  push:
    branches: [d1-crota-source-semantics-v1]
    paths:
      - 'tools/d1_gcn_localshader_api10_entry_layout_census_v1.py'
      - '.github/workflows/d1-gcn-localshader-api10-entry-layout-census-v1.yml'
permissions: {contents: read, actions: read}
env:
  USAGE_ARTIFACT_ID: '10172731401'
  USAGE_ZIP_SHA256: '5c4dcfc72768f3e0960dead4a612c9d35281c3246cd7ded5f32c4efc83563533'
  USAGE_REPORT_SHA256: '6c6c07d03ed06d8b53693326cbabd9fde7c7a2f7b0c41e02939e700cf4f21127'
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover pinned exact usage evidence
        run: |
          set -euo pipefail; mkdir -p input out
          python -m py_compile tools/d1_gcn_localshader_api10_entry_layout_census_v1.py
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${USAGE_ARTIFACT_ID}/zip" -o input/usage.zip
          echo "$USAGE_ZIP_SHA256  input/usage.zip" | sha256sum --check --strict
          unzip -q input/usage.zip -d input/usage
          echo "$USAGE_REPORT_SHA256  input/usage/D1_GCN_LOCALSHADER_TBUFFER_USAGE_BINDING_V1.json" | sha256sum --check --strict
      - name: Census direct API10 entry layout
        run: |
          set -euo pipefail
          python tools/d1_gcn_localshader_api10_entry_layout_census_v1.py input/usage/D1_GCN_LOCALSHADER_TBUFFER_USAGE_BINDING_V1.json -o out/D1_GCN_LOCALSHADER_API10_ENTRY_LAYOUT_CENSUS_V1.json | tee out/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/D1_GCN_LOCALSHADER_API10_ENTRY_LAYOUT_CENSUS_V1.json')); c=d['coverage']
          assert d['status']=='D1_GCN_LOCALSHADER_API10_ENTRY_LAYOUT_CENSUS_EXACT',d['violations']
          assert not d['violations']; assert c['api10_program_count']==39 and c['api10_wrapper_count']==56 and c['api10_material_occurrence_count']==3386,c
          assert c['api10_usage_layout_count']==2 and c['api10_direct_immconstbuffer_program_count']==39,c
          assert c['ptr_const_buffer_table_program_count']==0 and c['ptr_resource_table_program_count']==0,c
          assert c['ptr_extended_user_data_program_count']==26,c
          print('D1_GCN_LOCALSHADER_API10_ENTRY_LAYOUT_CENSUS_EXACT')
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: D1-GCN-LOCALSHADER-API10-ENTRY-LAYOUT-CENSUS-V1, path: out/, retention-days: 30}
