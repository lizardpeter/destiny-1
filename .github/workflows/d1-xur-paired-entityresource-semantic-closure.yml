name: D1 Xur paired EntityResource semantic closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-paired-entityresource-semantic-closure.yml'
      - 'tools/d1_remote_catalog_entity_resource_probe.py'
      - 'tools/d1_entity_resource_probe.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog and runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Parse all fourteen paired identity EntityResources with the source-pinned schema
        run: |
          set -euo pipefail
          python tools/d1_remote_catalog_entity_resource_probe.py \
            --tag-hash 80C880B9 --tag-hash 80C880BA --tag-hash 80C880BD --tag-hash 80C880BE \
            --tag-hash 80C8821D --tag-hash 80C8821E --tag-hash 80C88221 --tag-hash 80C88222 \
            --tag-hash 80C8840E --tag-hash 80C8840F --tag-hash 80C88412 --tag-hash 80C88413 \
            --tag-hash 80C885C5 --tag-hash 80C885C6 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            -o out/PAIRED_IDENTITY_ENTITYRESOURCE_SEMANTICS.json | tee out/stdout.txt
          python - <<'PY'
          import json,collections
          d=json.load(open('out/PAIRED_IDENTITY_ENTITYRESOURCE_SEMANTICS.json'))
          assert d['status']=='D1_CATALOG_ENTITY_RESOURCE_PROBE_EXACT' and not d['violations'],d
          roles=collections.Counter()
          discriminators=collections.Counter()
          parents=collections.Counter()
          resolved=collections.Counter()
          for r in d['entries']:
              er=r['entity_resource']
              roles[er['semantic_role']]+=1
              discriminators[(er.get('unk10') or {}).get('class_hash')]+=1
              parents[(er.get('unk18') or {}).get('class_hash')]+=1
              for m in r.get('aligned_resolved_tag_matches',[]): resolved[(m['offset_hex'],m['reference'])]+=1
              print('PAIR_RESOURCE',r['tag_hash'],'ROLE',er['semantic_role'],'U10',(er.get('unk10') or {}).get('class_hash'),'U18',(er.get('unk18') or {}).get('class_hash'),'RESOLVED',[(m['offset_hex'],m['tag_hash'],m['reference']) for m in r.get('aligned_resolved_tag_matches',[])])
          print('ROLE_COUNTS',dict(roles))
          print('DISCRIMINATORS',dict(discriminators))
          print('PARENTS',dict(parents))
          print('RESOLVED_OFFSET_CLASS_COUNTS',dict(resolved))
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-XUR-PAIRED-ENTITYRESOURCE-SEMANTIC-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
