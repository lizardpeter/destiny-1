name: D1 Crota terrain census v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-terrain-census-v1.yml'
      - 'tools/d1_world_map_data_layer_census_v2.py'
      - 'tools/d1_world_terrain_census.py'

permissions:
  contents: read
  actions: read

jobs:
  terrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      ACTIVITY: '810B0002'
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover runtime archive identity and Activity map roots
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q numpy
          mkdir -p runtime packages out/work/root
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl -fsSL --retry 8 'https://github.com/lizardpeter/destiny-1/releases/download/d1-global-activity-index-r1/D1_CURRENT_ACTIVITY_INDEX.json' -o out/D1_CURRENT_ACTIVITY_INDEX.json
          curl -fsSL --retry 4 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o out/packages.txt
          python - <<'PY'
          import hashlib,json
          d=json.load(open('out/D1_CURRENT_ACTIVITY_INDEX.json'))
          h=hashlib.sha256(open('out/packages.txt','rb').read()).hexdigest()
          assert d['status']=='D1_REMOTE_ACTIVITY_INDEX_COMPLETE',d
          assert h==(d.get('source') or {}).get('package_list_sha256'),(h,d.get('source'))
          print('ARCHIVE_INDEX_ACCEPTED',h)
          PY
          python tools/d1_world_activity_root_dependency_closure_universal.py \
            --index out/D1_CURRENT_ACTIVITY_INDEX.json --package-list out/packages.txt \
            --activity "$ACTIVITY" --runtime runtime --package-dir packages \
            --work-dir out/work/root --root-out out/activity_map_roots.json \
            --report out/activity_root_dependency_closure.json
          python - <<'PY'
          import json
          d=json.load(open('out/activity_map_roots.json'))
          assert d['status']=='D1_WORLD_ACTIVITY_MAP_ROOT_CENSUS_COMPLETE',d
          assert d['reachable_map_data_table_count']==255 and d['total_reachable_map_entries']==1535,d
          print('ROOTS_CLOSED',d['reachable_map_data_table_count'],d['total_reachable_map_entries'])
          PY

      - name: Resolve all 49 source-proven terrain targets
        run: |
          set -euo pipefail
          mapfile -t files < <(find packages -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_map_data_layer_census_v2.py "${args[@]}" --runtime runtime \
            --map-root-json out/activity_map_roots.json --out out/map_layers_seed.json
          python - <<'PY'
          import json
          from tools.d1_filehash import package_hex
          d=json.load(open('out/map_layers_seed.json'))
          assert d['status']=='D1_WORLD_MAP_DATA_LAYER_CENSUS',d.get('violations')
          rows=[r for t in d['tables'] for r in t.get('entries',[]) if str(r.get('resource_class') or '').upper()=='80801C37']
          assert len(rows)==49,len(rows)
          hashes=[]
          for r in rows:
            rt=r.get('resource_target') or {}
            h=str(rt.get('hash') or '').upper()
            assert h and h not in {'00000000','FFFFFFFF'},r
            hashes.append(h)
          ids=sorted({package_hex(h).lower() for h in hashes})
          json.dump({'status':'D1_CROTA_TERRAIN_TARGET_PACKAGE_PLAN','terrain_occurrences':49,'unique_terrain_targets':len(set(hashes)),'terrain_hashes':sorted(set(hashes)),'package_ids':ids},open('out/terrain_target_plan.json','w'),indent=2)
          open('out/terrain_target_package_ids.txt','w').write('\n'.join(ids)+'\n')
          print('TERRAIN_TARGETS',len(rows),'UNIQUE',len(set(hashes)),'PACKAGES',ids)
          PY
          recovery=(); while read -r p; do recovery+=(--package-id "$p"); done < out/terrain_target_package_ids.txt
          python tools/d1_recover_indexed_package_families.py \
            --index out/D1_CURRENT_ACTIVITY_INDEX.json --package-list out/packages.txt \
            "${recovery[@]}" --out-dir packages --report out/terrain_target_recovery.json
          mapfile -t files < <(find packages -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_map_data_layer_census_v2.py "${args[@]}" --runtime runtime \
            --map-root-json out/activity_map_roots.json --out out/map_layers_terrain_resolved.json
          python - <<'PY'
          import json
          d=json.load(open('out/map_layers_terrain_resolved.json'))
          rows=[r for t in d['tables'] for r in t.get('entries',[]) if str(r.get('resource_class') or '').upper()=='80801C37']
          assert len(rows)==49,len(rows)
          bad=[]
          for r in rows:
            rt=r.get('resource_target') or {}
            if not rt.get('exists') or not rt.get('class_matches'): bad.append((r.get('map_data_table'),r.get('index'),rt))
          assert not bad,bad[:20]
          print('TERRAIN_TARGET_CLASSES_CLOSED',len(rows))
          PY

      - name: Census terrain typed dependencies and recover missing families
        run: |
          set -euo pipefail
          census () {
            local out="$1"
            mapfile -t files < <(find packages -maxdepth 1 -name '*.pkg' -type f | sort)
            args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
            set +e
            python tools/d1_world_terrain_census.py "${args[@]}" --runtime runtime \
              --layer-census out/map_layers_terrain_resolved.json --out "$out"
            rc=$?
            set -e
            test "$rc" -eq 0 -o "$rc" -eq 2
          }
          recover_missing () {
            local report="$1" label="$2"
            python - "$report" <<'PY' > out/missing_ids.txt
          import json,sys
          d=json.load(open(sys.argv[1]))
          for p in sorted((d.get('missing_dependency_package_ids') or {}).keys()): print(p)
          PY
            if [ -s out/missing_ids.txt ]; then
              recovery=(); while read -r p; do recovery+=(--package-id "$p"); done < out/missing_ids.txt
              python tools/d1_recover_indexed_package_families.py \
                --index out/D1_CURRENT_ACTIVITY_INDEX.json --package-list out/packages.txt \
                "${recovery[@]}" --out-dir packages --report "out/${label}_recovery.json"
            fi
          }
          census out/terrain_census_pass1.json
          recover_missing out/terrain_census_pass1.json terrain_dep_pass1
          census out/terrain_census_pass2.json
          recover_missing out/terrain_census_pass2.json terrain_dep_pass2
          census out/terrain_census_final.json
          python - <<'PY'
          import json
          d=json.load(open('out/terrain_census_final.json'))
          assert d['status']=='D1_WORLD_TERRAIN_CENSUS_COMPLETE',d
          assert d['terrain_resource_occurrence_count']==49,d
          assert not d['missing_dependency_package_ids'] and not d['violations'],d
          print('CROTA_TERRAIN_CENSUS_CLOSED',json.dumps({k:d[k] for k in ('terrain_resource_occurrence_count','unique_terrain_count','mesh_group_count','serialized_static_part_count','selected_main_geom0_part_count','unique_static_part_material_count','unique_selected_material_count','unique_dyemap_count','unique_typed_dependency_count')},sort_keys=True))
          from collections import Counter
          refs=Counter()
          for x in d['typed_dependencies']:
            m=x.get('meta') or {};refs[str(m.get('reference') or 'NULL').upper()]+=1
          print('TERRAIN_DEPENDENCY_REFERENCE_CLASSES',json.dumps(dict(sorted(refs.items())),sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-TERRAIN-CENSUS-V1
          path: out/
          retention-days: 30
          compression-level: 6
