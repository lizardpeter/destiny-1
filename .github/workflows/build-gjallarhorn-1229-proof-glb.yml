name: Build D1 Gjallarhorn arrangement 1229 proof GLB

on:
  push:
    paths:
      - '.github/workflows/build-gjallarhorn-1229-proof-glb.yml'
      - 'tools/d1_gjallarhorn_1229_glb.py'
      - 'tools/d1_gjallarhorn_1229_glb_validated.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install exporter dependencies and Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy pygltflib
          mkdir -p runtime recovered models out reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover exact 011c 011e geometry and 0139 visual package families
        run: |
          set -euo pipefail
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x43779C800 \
            --target ps4_gear_weapons_011c_0.pkg --target ps4_gear_weapons_011c_1.pkg \
            --target ps4_gear_weapons_011c_2.pkg --target ps4_gear_weapons_011c_3.pkg --target ps4_gear_weapons_011c_5.pkg \
            --target ps4_gear_weapons_011e_0.pkg --target ps4_gear_weapons_011e_1.pkg \
            --target ps4_gear_weapons_011e_2.pkg --target ps4_gear_weapons_011e_3.pkg --target ps4_gear_weapons_011e_5.pkg \
            --out recovered --manifest reports/011c_011e_extract.json --retries 6 --timeout 90
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x59B629600 \
            --target ps4_investment_assets_0139_0.pkg --target ps4_investment_assets_0139_1.pkg \
            --target ps4_investment_assets_0139_2.pkg --target ps4_investment_assets_0139_3.pkg --target ps4_investment_assets_0139_5.pkg \
            --out recovered --manifest reports/0139_extract.json --retries 6 --timeout 90
      - name: Recover all six exact selected model headers
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader
          from d1_entity_model_probe import parse_model
          from d1_remote_investment_parent_probe import RemoteLogicalPackage,parse_member
          from d1_split_tar_extract import SplitHttpTar

          wanted=['80A72202','80A7317B','80A73256','80A73BAB','80A73D13']
          found={}; attempts=[]
          snaps=sorted(Path('recovered').glob('ps4_investment_assets_0139_*.pkg'),reverse=True)
          for tag in wanted:
            for p in snaps:
              rec={'tag':tag,'snapshot':p.name}
              try:
                r=EntryReader(p,Path('runtime')); by={e['tag_hash'].upper():e for e in r.entries}; e=by.get(tag)
                rec['present']=bool(e)
                if not e: attempts.append(rec); continue
                b=r.entry(e['index']); m=parse_model(b,'PS4')
                Path('models',f'{tag}.bin').write_bytes(b)
                rec.update({'success':True,'sha256':hashlib.sha256(b).hexdigest(),'mesh_count':m['mesh_count']}); found[tag]=rec; attempts.append(rec); break
              except Exception as ex:
                rec['error']=repr(ex); attempts.append(rec)
            if tag not in found: raise SystemExit(f'could not recover selected model {tag} from any 0139 snapshot')

          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=90)
          specs=[
            'ps4_investment_assets_013a_0.pkg:0x59C453A00:95760384',
            'ps4_investment_assets_013a_1.pkg:0x5A1FA6C00:15149056',
            'ps4_investment_assets_013a_2.pkg:0x5A2E19600:7192576',
            'ps4_investment_assets_013a_3.pkg:0x5A34F5800:165888',
            'ps4_investment_assets_013a_4.pkg:0x5A351E200:161792',
            'ps4_investment_assets_013a_5.pkg:0x5A3545C00:165888',
          ]
          ms=[parse_member(x) for x in specs]; rr=RemoteLogicalPackage(arc,{m.patch_id:m for m in ms},Path('runtime'))
          tag='80A743A6'; idx=934; e=rr.entries[idx]; assert e['tag_hash'].upper()==tag,(e['tag_hash'],tag)
          b=rr.entry(idx); m=parse_model(b,'PS4'); Path('models',f'{tag}.bin').write_bytes(b)
          found[tag]={'tag':tag,'source':'remote 013a final logical view','sha256':hashlib.sha256(b).hexdigest(),'mesh_count':m['mesh_count']}
          assert sum(x['mesh_count'] for x in found.values())==8, found
          Path('reports/model_recovery.json').write_text(json.dumps({'found':found,'attempts':attempts},indent=2)+'\n')
          print('RECOVERED_MODELS',json.dumps(found,separators=(',',':')))
          PY
      - name: Build six-model Gjallarhorn GLB
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_gjallarhorn_1229_glb.py tools/d1_gjallarhorn_1229_glb_validated.py
          python tools/d1_gjallarhorn_1229_glb_validated.py \
            --pkg-011c recovered/ps4_gear_weapons_011c_5.pkg \
            --pkg-011e recovered/ps4_gear_weapons_011e_5.pkg \
            --pkg-0139 recovered/ps4_investment_assets_0139_5.pkg \
            --runtime runtime --model-dir models \
            --out out/GJALLARHORN_YEAR3_ARRANGEMENT_1229_GEOMETRY.glb \
            --report reports/gjallarhorn_1229_geometry.json
          sha256sum out/GJALLARHORN_YEAR3_ARRANGEMENT_1229_GEOMETRY.glb | tee reports/glb_sha256.txt
      - name: Validate GLB structure
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from pygltflib import GLTF2
          p=Path('out/GJALLARHORN_YEAR3_ARRANGEMENT_1229_GEOMETRY.glb'); g=GLTF2().load_binary(str(p))
          r=json.loads(Path('reports/gjallarhorn_1229_geometry.json').read_text())
          assert len(g.meshes)==8, len(g.meshes)
          assert len(g.scenes)==1 and len(g.nodes[0].children)==6
          assert len(r['models'])==6 and sum(x['mesh_count'] for x in r['models'])==8
          assert r['total_lod1_triangles']>5000,r['total_lod1_triangles']
          assert r['output_bytes']==p.stat().st_size
          print(json.dumps({'bytes':p.stat().st_size,'meshes':len(g.meshes),'materials':len(g.materials),'triangles':r['total_lod1_triangles'],'bbox_min':r['bbox_min'],'bbox_max':r['bbox_max']},indent=2))
          PY
      - name: Bundle proof
        run: |
          cp reports/gjallarhorn_1229_geometry.json out/GJALLARHORN_YEAR3_ARRANGEMENT_1229_GEOMETRY.report.json
          cp reports/model_recovery.json reports/glb_sha256.txt out/
          cat > out/README.txt <<'EOF'
          Destiny 1 Rise of Iron Gjallarhorn Year 3 - first exact retail visual assembly proof

          Inventory hash: D471D331
          Weapon pattern: 39
          Art arrangement: 1229
          Exact selected visual entities:
            80A743A4 -> model 80A743A6
            80A73BA9 -> model 80A73BAB
            80A72200 -> model 80A72202
            80A73179 -> model 80A7317B
            80A73254 -> model 80A73256
            80A73D11 -> model 80A73D13

          This GLB exports all six retail-selected LOD1 model components in their native shared
          model coordinate system. The six models contain eight mesh records total. Geometry
          resources span logical packages 011C, 011E and 0139. A presentation root recenters
          the assembled geometry. Native material hashes are retained, but this first proof
          uses neutral portable PBR placeholders while texture/dye/shader binding is being
          closed. No geometry, weights, transforms, or animations are invented.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: D1-Gjallarhorn-Year3-arrangement-1229-geometry
          path: out/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
