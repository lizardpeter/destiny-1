name: D1 Tower Family E animation ownership

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-family-e-animation-ownership.yml'
      - 'tools/d1_tower_family_e_animation_ownership.py'
      - 'tools/d1_animation_control_state_map.py'
      - 'tools/d1_animation_retarget_probe.py'
      - 'tools/d1_world_activity_entity_table_census.py'
      - 'tools/d1_recover_member_catalog.py'
      - 'tools/d1_tower_recover_activity_root_corpus.py'
      - 'tools/d1_split_tar_extract.py'
      - 'evidence/d1_tower_family_e_animation_ownership.json'
      - 'evidence/d1_tower_shader_dependency_member_catalog.json'
      - 'evidence/d1_tower_00ef_member_catalog.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Parser dependencies
        run: python -m pip install -q numpy scipy pygltflib pyglm

      - name: Install verified Oodle runtime and package index
        run: |
          set -euo pipefail
          mkdir -p runtime recovered destination reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt

      - name: Recover exact 00EC 00EF and Tower Activity families
        run: |
          set -euo pipefail
          python tools/d1_recover_member_catalog.py \
            --catalog evidence/d1_tower_shader_dependency_member_catalog.json \
            --package-list reports/packages.txt --family 00ec \
            --out-dir recovered --report reports/recover_00ec.json
          python tools/d1_recover_member_catalog.py \
            --catalog evidence/d1_tower_00ef_member_catalog.json \
            --package-list reports/packages.txt --family 00ef \
            --out-dir recovered --report reports/recover_00ef.json
          python tools/d1_tower_recover_activity_root_corpus.py \
            --package-list reports/packages.txt --out-dir recovered \
            --report reports/recover_023d_0244.json

      - name: Recover exact 0250 SEntity member only
        run: |
          set -euo pipefail
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' \
            --part-count 10 --start-offset 7882615808 \
            --target ps4_city_tower_destination_0250_5.pkg \
            --out destination --manifest reports/recover_0250_5.json \
            --retries 6 --timeout 90
          test "$(stat -c%s destination/ps4_city_tower_destination_0250_5.pkg)" = 1677312
          echo '2066afe09503eee4c35d948f6749a6e7b7b02572dcd41d1d3ca679fa523ea22c  destination/ps4_city_tower_destination_0250_5.pkg' | sha256sum --check --strict

      - name: Pin animation parser
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
          test "$(git -C parser rev-parse HEAD)" = b9fdc3a43dd28118113275624fcc9054b75855f4

      - name: Close Family E owner-selected animation split
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python tools/d1_tower_family_e_animation_ownership.py \
            --tower-activity-pkg recovered/ps4_city_tower_activities_act_023d_5.pkg \
            --tower-destination-pkg destination/ps4_city_tower_destination_0250_5.pkg \
            --generic-owner-pkg recovered/ps4_race_set_all_00ef_5.pkg \
            --generic-animation-pkg recovered/ps4_race_set_all_00ec_5.pkg \
            --runtime runtime --parser-root parser \
            --evidence evidence/d1_tower_family_e_animation_ownership.json \
            -o reports/TOWER_FAMILY_E_ANIMATION_OWNERSHIP.json
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_FAMILY_E_ANIMATION_OWNERSHIP.json'))
          assert d['status']=='D1_TOWER_FAMILY_E_ANIMATION_OWNERSHIP_CLOSED',d['violations']
          assert d['family']['skeleton_node_count']==67,d['family']
          assert d['family']['runtime_rig_control_count']==67,d['family']
          assert d['family']['runtime_placement_count']==6,d['family']
          assert d['family']['unique_world_id_count']==6,d['family']
          assert {k:v['selection_status'] for k,v in d['entities'].items()}=={
            '80C7AD82':'owner_selected','80C7AE3E':'owner_selected','80CA0CD6':'owner_selected'
          }
          assert d['entities']['80C7AE3E']['expected_animation_clip']=='80C7AE98'
          assert d['entities']['80C7AD82']['expected_animation_clip']=='809D8572'
          assert d['entities']['80CA0CD6']['expected_animation_clip']=='809D8572'
          assert d['clips']['809D8572']['frame_count']==324,d['clips']['809D8572']
          assert d['clips']['809D8572']['exact_family_compatible'],d['clips']['809D8572']
          assert d['clips']['80C7AE98']['exact_family_compatible'],d['clips']['80C7AE98']
          print('FAMILY_E_OWNER_SELECTED_ANIMATIONS_GREEN')
          print('TOWER_LOCAL_80C7AE98_FRAMES',d['clips']['80C7AE98']['frame_count'])
          print('GENERIC_809D8572_FRAMES',d['clips']['809D8572']['frame_count'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-family-e-animation-ownership
          path: reports/
          retention-days: 14
          compression-level: 6
