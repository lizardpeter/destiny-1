name: Temporary resolve Gjallarhorn arrangement 1229

on:
  push:
    paths:
      - '.github/workflows/tmp-extract-gjallarhorn-arrangement-1229.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover runtime and exact Investment roots
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x61A5CB200 \
            --target ps4_investment_globals_012f_0.pkg --target ps4_investment_globals_012f_1.pkg \
            --target ps4_investment_globals_012f_2.pkg --target ps4_investment_globals_012f_3.pkg \
            --target ps4_investment_globals_012f_4.pkg --target ps4_investment_globals_012f_5.pkg --target ps4_investment_globals_012f_6.pkg \
            --out recovered --manifest reports/012f_extract.json --retries 6 --timeout 90
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x5A9421400 \
            --target ps4_investment_assets_013f_1.pkg --target ps4_investment_assets_013f_2.pkg \
            --target ps4_investment_assets_013f_3.pkg --target ps4_investment_assets_013f_4.pkg --target ps4_investment_assets_013f_5.pkg \
            --out recovered --manifest reports/013f_extract.json --retries 6 --timeout 90
      - name: Resolve exact Gjallarhorn arrangements
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_investment_arrangement_probe.py \
            recovered/ps4_investment_globals_012f_6.pkg recovered/ps4_investment_assets_013f_5.pkg \
            --runtime runtime -o reports/all_arrangements.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/all_arrangements.json').read_text())
          out={}
          for idx,label in [(1229,'Gjallarhorn Year1/Year3'),(4182,'Iron Gjallarhorn')]:
              r=d['arrangements'][idx]
              out[str(idx)]={
                'label':label,
                'arrangement_index':idx,
                'source':r['source'],
                'assignment_hashes':r['assignment_hashes'],
                'entity_parent_hashes':r['entity_parent_hashes'],
                'unresolved_assignment_hashes':r['unresolved_assignment_hashes'],
              }
              print('GJALLARHORN_ARRANGEMENT',json.dumps(out[str(idx)],separators=(',',':')))
          Path('reports/gjallarhorn_arrangement_1229_4182.json').write_text(json.dumps(out,indent=2)+'\n')
          assert out['1229']['assignment_hashes']
          assert all(x is not None for x in out['1229']['entity_parent_hashes'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-gjallarhorn-arrangement-1229
          path: reports/
          retention-days: 7
          if-no-files-found: error
