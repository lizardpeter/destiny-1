name: D1 Tower activity entity-layer census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-activity-entity-layer-census.yml'
      - 'tools/d1_world_activity_entity_table_census.py'
      - 'tools/d1_tower_recover_activity_root_corpus.py'
      - 'tools/d1_split_tar_extract.py'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover SHA-pinned Tower activity and ambient-activity package families
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_activity_root_corpus.py \
            --package-list reports/packages.txt \
            --out-dir recovered \
            --report reports/tower_activity_package_recovery.json
      - name: Census D1 activity-owned entity/data-table chains
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          set +e
          python tools/d1_world_activity_entity_table_census.py "${args[@]}" --runtime runtime \
            --out reports/tower_activity_entity_table_census.json | tee reports/tower_activity_entity_table_census_stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_activity_entity_table_census.json'))
          s=d['summary']
          if d['activity_count']<=0: raise SystemExit('no current named D1 80800616 Tower activity resources found')
          if s['unique_map_data_tables']<=0 and s['unique_f603_entity_resources']<=0:
              raise SystemExit('activity resource chain produced no entity/data tables')
          compact={'status':d['status'],'activity_count':d['activity_count'],**s,
                   'unique_map_data_tables':d['unique_map_data_tables'],
                   'unique_f603_entity_resources':d['unique_f603_entity_resources'],
                   'unresolved_hashes':d['unresolved_hashes'],'violations':d['violations']}
          json.dump(compact,open('reports/TOWER_ACTIVITY_ENTITY_LAYER_SUMMARY.json','w'),indent=2)
          print(json.dumps(compact,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-activity-entity-layer-census
          path: reports/
          retention-days: 14
          compression-level: 6
