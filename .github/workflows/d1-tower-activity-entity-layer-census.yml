name: D1 Tower activity entity-layer census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-activity-entity-layer-census.yml'
      - 'tools/d1_world_activity_entity_table_census.py'
      - 'tools/d1_world_activity_entity_resource_census.py'
      - 'tools/d1_world_entity_dependency_census.py'
      - 'tools/d1_expand_world_entity_dependencies.py'
      - 'tools/d1_entity_resource_probe.py'
      - 'tools/d1_skeleton_probe.py'
      - 'tools/d1_tower_recover_activity_root_corpus.py'
      - 'tools/d1_tower_recover_current_corpus.py'
      - 'tools/d1_split_tar_extract.py'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered root_corpus entity_expanded reports/entity_dependency_passes
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover SHA-pinned Tower roots and dependency corpus
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py \
            --package-list reports/packages.txt \
            --out-dir recovered \
            --report reports/tower_dependency_corpus.json
          python tools/d1_tower_recover_activity_root_corpus.py \
            --package-list reports/packages.txt \
            --out-dir root_corpus \
            --report reports/tower_activity_package_recovery.json
      - name: Census D1 activity-owned entity/data-table chains
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t deps < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          mapfile -t roots < <(find root_corpus -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${deps[@]}" "${roots[@]}"; do args+=(--snapshot "$f"); done
          root_args=(); for f in "${roots[@]}"; do root_args+=(--named-root-snapshot "$f"); done
          set +e
          python tools/d1_world_activity_entity_table_census.py "${args[@]}" "${root_args[@]}" --runtime runtime \
            --out reports/tower_activity_entity_table_census.json | tee reports/tower_activity_entity_table_census_stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_activity_entity_table_census.json'))
          s=d['summary']
          if d['activity_count']<=0: raise SystemExit('no current named D1 80800616 Tower activity resources found')
          if d.get('named_root_mode')!='isolated_named_root_snapshots': raise SystemExit('Tower entity census did not isolate named roots')
          if s['unique_map_data_tables']<=0 and s['unique_f603_entity_resources']<=0:
              raise SystemExit('activity resource chain produced no entity/data tables')
          compact={'status':d['status'],'activity_count':d['activity_count'],'named_root_mode':d.get('named_root_mode'),**s,
                   'unique_map_data_tables':d['unique_map_data_tables'],
                   'unique_f603_entity_resources':d['unique_f603_entity_resources'],
                   'unresolved_hashes':d['unresolved_hashes'],'violations':d['violations']}
          json.dump(compact,open('reports/TOWER_ACTIVITY_ENTITY_LAYER_SUMMARY.json','w'),indent=2)
          print(json.dumps(compact,indent=2))
          PY
      - name: Materialize direct and F603 entity placements
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t deps < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          mapfile -t roots < <(find root_corpus -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${deps[@]}" "${roots[@]}"; do args+=(--snapshot "$f"); done
          set +e
          python tools/d1_world_activity_entity_resource_census.py "${args[@]}" --runtime runtime \
            --entity-table-census reports/tower_activity_entity_table_census.json \
            --out reports/tower_activity_entity_resource_census.json \
            | tee reports/tower_activity_entity_resource_census_stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_activity_entity_resource_census.json'))
          if d['f603_count']<=0: raise SystemExit('no Activity-owned F603 tables reached collapse pass')
          if d['collapsed_f603_count']<=0: raise SystemExit('no F603 EntityResource collapsed into SMapDataEntry records')
          if d['real_entity_entry_count']<=0: raise SystemExit('no real entity placements materialized')
          if d['violations']: raise SystemExit('placement framing still has violations: '+repr(d['violations'][:20]))
          compact={k:d[k] for k in ('status','f603_count','collapsed_f603_count','collapse_reason_counts',
              'unique_entity_resource_tags','direct_map_data_table_count','direct_map_entry_count','f603_collapsed_entry_count',
              'collapsed_entry_count','source_kind_counts','real_entity_entry_count','unique_entity_hash_count',
              'resolved_entity_entry_count','entity_class_match_entry_count','unique_world_id_count','data_resource_class_counts','violations')}
          compact['unique_entity_hashes']=d['unique_entity_hashes']
          json.dump(compact,open('reports/TOWER_ACTIVITY_ENTITY_PLACEMENT_SUMMARY.json','w'),indent=2)
          print(json.dumps(compact,indent=2))
          PY
      - name: Recursively close placed entity dependencies
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t deps < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          mapfile -t roots < <(find root_corpus -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${deps[@]}" "${roots[@]}"; do args+=(--snapshot "$f"); done
          set +e
          python tools/d1_expand_world_entity_dependencies.py "${args[@]}" \
            --runtime runtime \
            --placements reports/tower_activity_entity_resource_census.json \
            --package-list reports/packages.txt \
            --expansion-dir entity_expanded \
            --work-dir reports/entity_dependency_passes \
            --out reports/tower_entity_dependency_census.json \
            --report reports/tower_entity_dependency_expansion.json \
            | tee reports/tower_entity_dependency_expansion_stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_entity_dependency_census.json'))
          x=json.load(open('reports/tower_entity_dependency_expansion.json'))
          if d['placed_unique_entity_count']<=0: raise SystemExit('no placed entity hashes reached dependency pass')
          if x['status']!='D1_WORLD_ENTITY_DEPENDENCY_EXPANSION_CLOSED':
              raise SystemExit('entity dependency expansion did not close: '+repr(x.get('final_unresolved_dependency_package_ids')))
          compact={k:d[k] for k in ('status','placed_unique_entity_count','parsed_entity_count','unresolved_entity_count',
              'entity_resource_reference_count','unique_entity_resource_hash_count','unresolved_resource_hash_count',
              'resource_reference_class_counts','entity_resource_role_counts','entity_resource_class_pair_counts',
              'entity_composition_class_counts','articulated_candidate_count','articulated_candidate_entities',
              'named_articulated_candidate_count','named_articulated_candidate_entities','unique_entity_name_hash_count',
              'entity_name_hash_reference_counts','specific_name_hash_reference_counts','generic_name_hash_reference_counts',
              'unique_embedded_model_count','unique_embedded_models','unique_embedded_physics_model_count',
              'unique_embedded_physics_models','unresolved_dependency_package_ids','violations')}
          compact['dependency_expansion']={k:x[k] for k in ('status','stop_reason','initial_snapshot_count','final_snapshot_count',
              'initial_package_ids','final_package_ids','recovered_package_ids','recovered_member_count','final_dependency_status',
              'final_unresolved_dependency_package_ids')}
          json.dump(compact,open('reports/TOWER_ENTITY_DEPENDENCY_SUMMARY.json','w'),indent=2)
          print(json.dumps(compact,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-activity-entity-layer-census
          path: reports/
          retention-days: 14
          compression-level: 6
