name: D1 Crota 8108E4D0 six-member family

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-8108e4d0-six-member-family.yml'
      - 'tools/d1_remote_exact_s_entity_probe.py'
      - 'tools/d1_remote_global_stringhash_resolve.py'

permissions:
  contents: read
  actions: read

env:
  BASE_URL: 'https://crypt.cohae.dev/destiny/ps4/packages/latest'
  CATALOG_ARTIFACT_ID: '9994811238'
  CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  family:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact catalog and runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Decode exact six-member s_entity family
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_exact_s_entity_probe.py \
            --tag-hash 0x8108E5C1 --tag-hash 0x8108E5C2 --tag-hash 0x8108E5C3 \
            --tag-hash 0x8108E5C4 --tag-hash 0x8108E5C5 --tag-hash 0x8108E5C6 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url "$BASE_URL" --part-count 10 --runtime runtime \
            -o out/CROTA_8108E4D0_SIX_MEMBER_ENTITIES.json | tee out/entities_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_8108E4D0_SIX_MEMBER_ENTITIES.json'))
          assert d['violation_count']==0,d['violations']
          assert [x['tag_hash'] for x in d['entries']]==['8108E5C1','8108E5C2','8108E5C3','8108E5C4','8108E5C5','8108E5C6']
          for x in d['entries']:
              print('FAMILY',x['tag_hash'],'SIZE',x['payload_size'],'RES',x['resource_count'],'MODELS',x['embedded_models'],'SKELETONS',[(s['resource_hash'],s['node_count']) for s in x['skeletons']],'SPECIFIC',x['specific_name_string_hashes'],'GENERIC',x['generic_name_tags'],'CHILDREN',[(c['resource_hash'],c['entity_hash']) for c in x['child_entities']])
          PY
      - name: Resolve exact source-mapped family names
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY' > /tmp/name_args.txt
          import json
          d=json.load(open('out/CROTA_8108E4D0_SIX_MEMBER_ENTITIES.json'))
          generic=sorted({h for x in d['entries'] for h in x.get('generic_name_tags',[])})
          specific=sorted({h for x in d['entries'] for h in x.get('specific_name_string_hashes',[])})
          print(' '.join([f'--generic-name-tag 0x{h}' for h in generic]+[f'--string-hash 0x{h}' for h in specific]))
          print('GENERIC',generic,file=__import__('sys').stderr)
          print('SPECIFIC',specific,file=__import__('sys').stderr)
          PY
          NAME_ARGS=$(cat /tmp/name_args.txt)
          if [ -n "$NAME_ARGS" ]; then
            python tools/d1_remote_global_stringhash_resolve.py \
              $NAME_ARGS \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --global-package-id 0x0151 --global-package-id 0x0154 --global-package-id 0x0155 \
              --global-package-id 0x0156 --global-package-id 0x0157 --global-package-id 0x0158 \
              --global-package-id 0x0169 --global-package-id 0x018D --global-package-id 0x01E3 \
              --global-package-id 0x072B --global-package-id 0x072F --global-package-id 0x0735 \
              --base-url "$BASE_URL" --part-count 10 --runtime runtime \
              -o out/CROTA_8108E4D0_SIX_MEMBER_NAMES.json | tee out/names_stdout.txt
          else
            printf '{"generic_name_tag_to_string_hash":{},"resolved":{},"unresolved_target_hashes":[],"violation_count":0,"violations":[]}\n' > out/CROTA_8108E4D0_SIX_MEMBER_NAMES.json
          fi
          python - <<'PY'
          import json
          e=json.load(open('out/CROTA_8108E4D0_SIX_MEMBER_ENTITIES.json'))
          n=json.load(open('out/CROTA_8108E4D0_SIX_MEMBER_NAMES.json'))
          assert n['violation_count']==0,n['violations']
          gm=n.get('generic_name_tag_to_string_hash',{})
          resolved=n.get('resolved',{})
          for x in e['entries']:
              rows=[]
              for tag in x.get('generic_name_tags',[]):
                  sh=gm.get(tag)
                  vals=sorted({r.get('string') for r in resolved.get(sh,[]) if r.get('string') is not None}) if sh else []
                  rows.append(('generic',tag,sh,vals))
              for sh in x.get('specific_name_string_hashes',[]):
                  vals=sorted({r.get('string') for r in resolved.get(sh,[]) if r.get('string') is not None})
                  rows.append(('specific',None,sh,vals))
              print('ENTITY_NAMES',x['tag_hash'],rows)
          print('UNRESOLVED',n.get('unresolved_target_hashes',[]))
          PY
      - name: Persist family closure
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          ents=json.load(open('out/CROTA_8108E4D0_SIX_MEMBER_ENTITIES.json'))
          names=json.load(open('out/CROTA_8108E4D0_SIX_MEMBER_NAMES.json'))
          out={
            'schema':'d1_crota_8108e4d0_six_member_family/v1',
            'status':'D1_CROTA_8108E4D0_SIX_MEMBER_FAMILY_EXACT',
            'container':'8108E4D0',
            'members':[x['tag_hash'] for x in ents['entries']],
            'entities':ents,
            'names':names,
            'policy':'All six members are admitted only because exact 8108E4D0 serialization identifies them as s_entity children. Names use only source-mapped generic/specific name fields and exact GlobalStrings equality. No member is promoted as Crota from family position or appearance.'
          }
          pathlib.Path('out/CROTA_8108E4D0_SIX_MEMBER_FAMILY.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-8108E4D0-SIX-MEMBER-FAMILY
          path: out/
          retention-days: 30
          if-no-files-found: error
