name: D1 Crota main visual shader closure v5

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-main-visual-shader-closure-v3.yml'
      - 'tools/d1_crota_visual_shader_v3_trigger.py'
      - 'tools/d1_remote_crota_shader_vertex_layout.py'
      - 'tools/d1_crota_visual_union_export.py'
      - 'tools/d1_world_shader_extract.py'
      - 'tools/d1_gnm_vs_ps_linkage.py'
      - 'tools/d1_crota_vs_param_vertex_input_lineage.py'
      - 'tools/d1_crota_vs_semantic_reuse.py'
      - 'tools/d1_ps4_gnm_shader_header_semantics.py'
      - 'tools/d1_gcn_image_usage_analyze.py'
      - 'tools/d1_gcn_image_coordinate_slice.py'
      - 'tools/d1_crota_955_coordinate_specialize.py'
      - 'tools/d1_gcn_cbuffer_usage_analyze.py'
      - 'tools/d1_gcn_terminal_alpha_slice.py'
      - 'tools/d1_gcn_terminal_rgb_slice.py'
      - 'tests/test_d1_gcn_provenance_analysis.py'
      - 'tools/d1_gcn_paired_shader_differential.py'
      - 'tools/d1_material_stage_state_resolve.py'
      - 'tools/d1_material_decode.py'
      - 'tools/d1_tfx_program_inventory.py'
      - 'tools/d1_crota_material_pair_census.py'
      - 'tools/d1_crota_attenuation_constant_reduce.py'
      - 'tools/d1_crota_attenuation_symbolic_reduce.py'
      - 'tools/d1_bc1_alpha_domain_proof.py'
      - 'tools/d1_crota_texture_channel_proof.py'
      - 'tools/d1_crota_attenuation_material_specialize.py'
      - 'tools/d1_crota_color_material_specialize.py'
      - 'tools/d1_crota_api13_family_boundary.py'
      - 'tools/d1_api13_cross_family_boundary.py'
      - 'evidence/d1_ps4_api13_tower_census_checkpoint_v1.json'
      - 'tools/d1_crota_serialized_pair_order.py'
      - 'tools/d1_crota_material_pair_state.py'
      - 'tools/d1_crota_material_pair_invariants.py'
      - 'tools/d1_gcn_terminal_mrt0_export_proof.py'
      - 'tools/d1_crota_vs_signed_cross_export.py'
      - 'tools/d1_crota_angular_varying_lineage.py'

permissions:
  contents: read
  actions: read

env:
  CATALOG_ARTIFACT_ID: '9994811238'
  CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  CLRX_COMMIT: 'fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df'
  ACTOR_ARTIFACT_ID: '10005225514'
  ACTOR_ZIP_SHA256: '6687cb12dcc423152592bdaff9e7efd86c119fa5b4e5e11cd885cc05ee20491b'

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Regression-test native provenance analyzers
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/d1_gcn_cbuffer_usage_analyze.py \
            tools/d1_crota_vs_param_vertex_input_lineage.py \
            tools/d1_crota_vs_semantic_reuse.py \
            tools/d1_gcn_image_coordinate_slice.py \
            tools/d1_crota_955_coordinate_specialize.py \
            tools/d1_gcn_terminal_alpha_slice.py \
            tools/d1_gcn_terminal_rgb_slice.py \
            tools/d1_crota_attenuation_constant_reduce.py \
            tools/d1_crota_attenuation_symbolic_reduce.py \
            tools/d1_bc1_alpha_domain_proof.py \
            tools/d1_crota_texture_channel_proof.py \
            tools/d1_crota_attenuation_material_specialize.py \
            tools/d1_crota_color_material_specialize.py \
            tools/d1_api13_cross_family_boundary.py \
            tools/d1_crota_serialized_pair_order.py
          python -m unittest tests.test_d1_gcn_provenance_analysis -v

      - name: Recover exact Crota shader corpus
        run: |
          set -euo pipefail
          mkdir -p input/catalog input/actor runtime corpus shader disasm out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "$CATALOG_ZIP_SHA256  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "$CATALOG_JSON_SHA256  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ACTOR_ARTIFACT_ID}/zip" -o input/actor.zip
          echo "${ACTOR_ZIP_SHA256}  input/actor.zip" | sha256sum --check --strict
          unzip -q input/actor.zip -d input/actor
          test -f input/actor/texture_export/texture_export_manifest.json
          test -f input/actor/texture_export/textures/8108E951_2048x2048_BC1.dds
          test -f input/actor/texture_export/textures/8108E952_64x64_BC1.dds
          test -f input/actor/texture_export/textures/80AACF2A_512x512_BC1.dds
          test -f input/actor/texture_export/textures/8108E7B6_2048x2048_BC4.dds
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 4 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o out/packages.txt
          python tools/d1_tower_recover_articulated_visual_corpus.py \
            --package-list out/packages.txt \
            --required-package-id 00ee --required-package-id 00ef --required-package-id 0447 --required-package-id 0157 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --out-dir corpus --report out/CROTA_VISUAL_SHADER_CORPUS.json

      - name: Resolve exact ten paired high-detail Crota materials
        run: |
          set -euo pipefail
          mapfile -t files < <(find corpus -maxdepth 1 -type f -name '*.pkg' | sort)
          snaps=(); for f in "${files[@]}"; do snaps+=(--snapshot "$f"); done
          python tools/d1_material_stage_state_resolve.py "${snaps[@]}" --runtime runtime \
            --material 0x8108E7A9 --material 0x8108E7AB \
            --material 0x8108E7AA --material 0x8108E7AC \
            --material 0x8108E7B1 --material 0x809DD1DC \
            --material 0x8108E7B2 --material 0x8108E7B4 \
            --material 0x8108E7B3 --material 0x8108E7B5 \
            --out out/CROTA_PAIRED_MATERIAL_STAGE_STATE.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_PAIRED_MATERIAL_STAGE_STATE.json'))
          wanted={'8108E7A9','8108E7AB','8108E7AA','8108E7AC','8108E7B1','809DD1DC','8108E7B2','8108E7B4','8108E7B3','8108E7B5'}
          assert d['status']=='D1_MATERIAL_STAGE_STATE_EXACT',d
          assert not d['violations'],d['violations']
          assert set(d['materials'])==wanted,(wanted-set(d['materials']),set(d['materials'])-wanted)
          for h,r in sorted(d['materials'].items()):
              assert r['material_state4_u8'][0]==0x88,(h,r['material_state4_u8'])
              print('PAIR_MATERIAL',h,'VS',r['vs']['shader'],'PS',r['ps']['shader'],'STATE4',r['material_state4_hex'],
                    'PS_TEX',[(x['texture_index'],x['texture']) for x in r['ps']['textures']['items']],
                    'PS_SAMPLERS',[x['sampler_taghash'] for x in r['ps']['sampler_references']])
          PY

      - name: Join exact retail Crota vertex layouts to color shader families
        run: |
          set -euo pipefail
          test -f input/actor/crota_raid_actor_material_bindings.json
          python tools/d1_remote_crota_shader_vertex_layout.py \
            --material-bindings input/actor/crota_raid_actor_material_bindings.json \
            --stage-state out/CROTA_PAIRED_MATERIAL_STAGE_STATE.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --model 0x8108E5B7 --parent 0x8108E4BA \
            --out out/CROTA_RETAIL_SHADER_VERTEX_LAYOUT.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_RETAIL_SHADER_VERTEX_LAYOUT.json'))
          assert d['status']=='D1_CROTA_RETAIL_SHADER_VERTEX_LAYOUT_EXACT',d
          assert not d['violations'],d['violations']
          assert d['color_range_count']==6,d
          fam=d['procedural_8108E955_source_layout_families']
          assert fam==[
            {'material':'8108E7A9','vertex_shader':'809DE9AB','source_mesh_index':0,
             'exported_uv_source':'SECONDARY_STREAM','primary_stride':16,'secondary_stride':20},
            {'material':'8108E7B2','vertex_shader':'809DF743','source_mesh_index':2,
             'exported_uv_source':'PRIMARY_STREAM','primary_stride':12,'secondary_stride':16},
          ],fam
          assert d['semantic_boundary']['GNM_vertex_input_semantic_to_Tiger_stream_element']=='WITHHELD_PENDING_FETCH_LAYOUT',d
          print('CROTA_RETAIL_955_VERTEX_LAYOUT_FAMILIES',fam)
          print('CROTA_RETAIL_MESH_LAYOUTS',d['mesh_layouts'])
          PY

      - name: Extract exact complete Crota highest-detail shader variants
        run: |
          set -euo pipefail
          printf '%s\n' '{"pixel_shader_frequency":{"8108E7B7":2,"8108E7B8":2,"8108E953":1,"80AAE1CD":1,"8108E955":2,"8108E958":2,"8108E956":2,"8108E959":2}}' > out/minimal_shader_manifest.json
          mapfile -t files < <(find corpus -maxdepth 1 -type f -name '*.pkg' | sort)
          snaps=(); for f in "${files[@]}"; do snaps+=(--snapshot "$f"); done
          python tools/d1_world_shader_extract.py "${snaps[@]}" --runtime runtime \
            --manifest out/minimal_shader_manifest.json \
            --shader 0x809DE9AB --shader 0x809DF743 \
            --shader 0x8108E7B7 --shader 0x8108E7B8 \
            --shader 0x8108E953 --shader 0x80AAE1CD \
            --shader 0x8108E955 --shader 0x8108E958 \
            --shader 0x8108E956 --shader 0x8108E959 \
            --out-dir shader --report out/CROTA_VISUAL_SHADER_EXTRACT.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_VISUAL_SHADER_EXTRACT.json'))
          assert d['status']=='D1_WORLD_PIXEL_SHADER_GCN_EXACT' and d['error_count']==0,d
          wanted={'809DE9AB','809DF743','8108E7B7','8108E7B8','8108E953','80AAE1CD','8108E955','8108E958','8108E956','8108E959'}
          assert {x['shader'] for x in d['shaders']}==wanted,(wanted-{x['shader'] for x in d['shaders']},d)
          for x in d['shaders']:
              print('EXACT',x['shader'],x['native_shader'],x['gcn_bytes'],x['gcn_sha256'])
          PY

      - name: Disassemble pinned GFX700 programs
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/CLRX/CLRX-mirror.git clrx
          git -C clrx checkout --quiet "$CLRX_COMMIT"
          test "$(git -C clrx rev-parse HEAD)" = "$CLRX_COMMIT"
          cmake -S clrx -B clrx/build -DCMAKE_BUILD_TYPE=Release -DNO_CLWRAPPER=ON -DBUILD_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_DOCUMENTATION=OFF >/dev/null
          cmake --build clrx/build --target clrxdisasm -j2 >/dev/null
          exe="$(find clrx/build -type f -name clrxdisasm -perm -111 | head -1)"; test -n "$exe"
          for f in shader/PS_*_gcn.bin; do
            b="$(basename "$f" _gcn.bin)"
            "$exe" --raw --gpuType=GFX700 --hexcode "$f" > "disasm/${b}.s" 2> "disasm/${b}.stderr"
            test ! -s "disasm/${b}.stderr"
            grep -q 's_endpgm' "disasm/${b}.s"
            cp "disasm/${b}.s" "out/${b}_GFX700.s"
          done
          test "$(find disasm -name '*.s' | wc -l)" -eq 10

      - name: Prove exact Crota vertex signed-cross export relation
        run: |
          set -euo pipefail
          python tools/d1_crota_vs_signed_cross_export.py --disasm-dir disasm \
            --out out/CROTA_VS_SIGNED_CROSS_EXPORT.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_VS_SIGNED_CROSS_EXPORT.json'))
          assert d['status']=='D1_CROTA_VS_SIGNED_CROSS_EXPORT_EXACT',d
          assert not d['violations'],d['violations']
          assert len(d['shaders'])==2,d
          for r in d['shaders']:
              assert not r['missing_anchors'],r
              assert r['export_relation']=='param2.xyz = factor * cross(param0.xyz, param1.xyz); param2.w = 1.0',r
              print('VS_SIGNED_CROSS',r['vertex_shader'],r['vector_a_registers'],r['vector_b_registers'],r['signed_cross_factor_register'])
          PY

      - name: Prove exact GNM vertex-to-pixel varying linkage
        run: |
          set -euo pipefail
          python tools/d1_gnm_vs_ps_linkage.py \
            --extract-report out/CROTA_VISUAL_SHADER_EXTRACT.json --disasm-dir disasm \
            --link 809DE9AB:8108E955 --link 809DE9AB:8108E958 \
            --link 809DE9AB:8108E956 --link 809DE9AB:8108E959 \
            --link 809DF743:8108E953 --link 809DF743:80AAE1CD \
            --link 809DF743:8108E955 --link 809DF743:8108E958 \
            --link 809DF743:8108E956 --link 809DF743:8108E959 \
            --out out/CROTA_GNM_VS_PS_LINKAGE.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_GNM_VS_PS_LINKAGE.json'))
          assert d['status']=='D1_GNM_VS_PS_LINKAGE_EXACT',d
          assert d['link_count']==10,d
          assert not d['violations'],d['violations']
          for r in d['links']:
              assert not r['unmatched_nondefault_inputs'],r
              print('GNM_LINK',r['vertex_shader'],r['pixel_shader'],
                    'CONSUMED',[(x['attr_index'],x['semantic'],x['vs_param_index']) for x in r['consumed_linkage']],
                    'ALL',[(x['attr_index'],x['semantic'],x['vs_param_index'],x['ps_default_value']) for x in r['linkage']])
          PY

      - name: Reuse exact registered VS interface semantics for Crota
        run: |
          set -euo pipefail
          python tools/d1_crota_vs_semantic_reuse.py \
            --extract-report out/CROTA_VISUAL_SHADER_EXTRACT.json \
            --linkage out/CROTA_GNM_VS_PS_LINKAGE.json \
            --registry evidence/d1_native_shader_semantic_registry_v1.json \
            --out out/CROTA_VS_SEMANTIC_REUSE.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_VS_SEMANTIC_REUSE.json'))
          assert d['status']=='D1_CROTA_VS_SEMANTIC_REUSE_EXACT',d
          assert not d['violations'],d['violations']
          p=d['procedural_8108E955_attr1_coordinate']
          assert {x['vertex_shader'] for x in p}=={'809DE9AB','809DF743'},p
          assert all(x['coordinate_source']=='TRANSFORMED_TANGENT_XY' for x in p),p
          s=d['semantic_boundary']
          assert s['8108E955_t0_coordinate_first_two_lanes']=='TRANSFORMED_TANGENT_XY',s
          assert s['angular_attr0']=='TRANSFORMED_NORMAL_XYZ',s
          assert s['angular_attr2']=='HANDED_TRANSFORMED_BITANGENT_XYZ',s
          assert s['fetch_shader_source_offsets_formats']=='WITHHELD',s
          print('CROTA_VS_SEMANTIC_REUSE_PROCEDURAL',p)
          print('CROTA_VS_SEMANTIC_REUSE_ANGULAR',d['angular_basis_rows'])
          PY

      - name: Trace surviving procedural attr1 coordinates to raw vertex inputs
        run: |
          set -euo pipefail
          python tools/d1_crota_vs_param_vertex_input_lineage.py \
            --extract-report out/CROTA_VISUAL_SHADER_EXTRACT.json \
            --linkage out/CROTA_GNM_VS_PS_LINKAGE.json \
            --disasm-dir disasm \
            --vertex-shader 809DE9AB --vertex-shader 809DF743 \
            --pixel-shader 8108E955 --attr-index 1 \
            --out out/CROTA_955_ATTR1_VERTEX_INPUT_LINEAGE.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_955_ATTR1_VERTEX_INPUT_LINEAGE.json'))
          assert d['status']=='D1_CROTA_VS_PARAM_VERTEX_INPUT_LINEAGE_EXACT',d
          assert not d['violations'],d['violations']
          assert len(d['rows'])==2,d
          for r in d['rows']:
              assert r['pixel_shader']=='8108E955' and r['pixel_attr_index']==1,r
              assert r['vs_param_index_from_linkage']==1,r
              assert r['target_param_index']==1,r
              assert r['x']['vertex_input_leaves'],r
              assert r['y']['vertex_input_leaves'],r
              assert not r['x']['unknown_vgpr_leaves'],r
              assert not r['y']['unknown_vgpr_leaves'],r
              assert r['xy_vertex_input_lineage_complete'] is True,r
              print('CROTA_955_ATTR1_VERTEX_INPUT',
                    r['vertex_shader'],
                    'RAW_LINK_SEMANTIC',r['raw_link_semantic_id'],
                    'EXPORT',r['target_export_assembly'],
                    'X_INPUTS',r['x']['vertex_input_leaves'],
                    'Y_INPUTS',r['y']['vertex_input_leaves'])
          assert d['semantic_boundary']['TEXCOORD_UV_position_normal_names']=='WITHHELD',d
          assert d['semantic_boundary']['vertex_stream_or_fetch_descriptor_identity']=='WITHHELD',d
          PY

      - name: Trace angular pixel inputs to exact vertex exports
        run: |
          set -euo pipefail
          python tools/d1_crota_angular_varying_lineage.py \
            --linkage out/CROTA_GNM_VS_PS_LINKAGE.json \
            --signed-cross out/CROTA_VS_SIGNED_CROSS_EXPORT.json \
            --out out/CROTA_ANGULAR_VARYING_LINEAGE.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_ANGULAR_VARYING_LINEAGE.json'))
          assert d['status']=='D1_CROTA_ANGULAR_VARYING_LINEAGE_EXACT',d
          assert not d['violations'],d['violations']
          assert d['link_count']==9,d
          assert d['semantic_boundary']['normal_tangent_bitangent_position_labels']=='WITHHELD',d
          assert d['semantic_boundary']['API12_vector_semantic']=='WITHHELD',d
          for r in d['links']:
              assert [x['ps_attr_index'] for x in r['angular_inputs']]==[0,2],r
              assert all(x['vs_param_index'] is not None for x in r['angular_inputs']),r
              print('ANGULAR_VARYING_LINK',r['vertex_shader'],r['pixel_shader'],
                    [(x['ps_attr_index'],x['raw_gnm_semantic_id'],x['vs_param_index'],
                      x['is_signed_cross_export_param2']) for x in r['angular_inputs']])
          PY

      - name: Prove exact terminal MRT0 channel classes
        run: |
          set -euo pipefail
          python tools/d1_gcn_terminal_mrt0_export_proof.py \
            --disasm disasm/PS_80AAE1CD_GFX700.s \
            --disasm disasm/PS_8108E953_GFX700.s \
            --disasm disasm/PS_8108E955_GFX700.s \
            --disasm disasm/PS_8108E958_GFX700.s \
            --disasm disasm/PS_8108E956_GFX700.s \
            --disasm disasm/PS_8108E959_GFX700.s \
            --out out/CROTA_TERMINAL_MRT0_EXPORT_PROOF.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_TERMINAL_MRT0_EXPORT_PROOF.json'))
          assert d['status']=='D1_GCN_TERMINAL_MRT0_EXPORT_EXACT',d
          got={x['shader']:x['channel_classes'] for x in d['shaders']}
          expected={
            '80AAE1CD':{'R':'ZERO','G':'ZERO','B':'ZERO','A':'ONE'},
            '8108E953':{'R':'COMPUTED','G':'COMPUTED','B':'COMPUTED','A':'ZERO'},
            '8108E955':{'R':'COMPUTED','G':'COMPUTED','B':'COMPUTED','A':'ZERO'},
            '8108E956':{'R':'COMPUTED','G':'COMPUTED','B':'COMPUTED','A':'ZERO'},
            '8108E958':{'R':'ZERO','G':'ZERO','B':'ZERO','A':'COMPUTED'},
            '8108E959':{'R':'ZERO','G':'ZERO','B':'ZERO','A':'COMPUTED'},
          }
          assert got==expected,(got,expected)
          for h in sorted(got): print('MRT0_CHANNELS',h,got[h])
          PY

      - name: Close exact image resource usage
        run: |
          set -euo pipefail
          python tools/d1_gcn_image_usage_analyze.py \
            --extract-report out/CROTA_VISUAL_SHADER_EXTRACT.json \
            --disasm-dir disasm --out out/CROTA_VISUAL_GCN_IMAGE_USAGE.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_VISUAL_GCN_IMAGE_USAGE.json'))
          assert d['status']=='D1_GCN_IMAGE_RESOURCE_USAGE_EXACT',d
          assert d['unmatched_image_instruction_count']==0,d
          by={x['shader']:x for x in d['shaders']}
          for h in ('8108E7B7','8108E7B8','8108E953','80AAE1CD','8108E955','8108E958','8108E956','8108E959'):
              r=by[h]
              print('PIXEL',h,'IMAGE_OPS',r['image_instruction_count'],'USED_T',r['used_texture_indices'],'OPS',r['image_opcodes'])
          PY

      - name: Recover exact GCN constant-buffer dword provenance
        run: |
          set -euo pipefail
          python tools/d1_gcn_cbuffer_usage_analyze.py \
            --extract-report out/CROTA_VISUAL_SHADER_EXTRACT.json \
            --disasm-dir disasm --out out/CROTA_GCN_CBUFFER_USAGE.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_GCN_CBUFFER_USAGE.json'))
          assert d['status']=='D1_GCN_CBUFFER_USAGE_EXACT',d
          assert not d['missing_usage'],d['missing_usage']
          by={x['shader']:x for x in d['shaders']}
