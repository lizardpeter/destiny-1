name: D1 Crota main visual shader closure v4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-main-visual-shader-closure-v3.yml'
      - 'tools/d1_crota_visual_shader_v3_trigger.py'
      - 'tools/d1_world_shader_extract.py'
      - 'tools/d1_gcn_image_usage_analyze.py'

permissions:
  contents: read
  actions: read

env:
  CATALOG_ARTIFACT_ID: '9994811238'
  CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  CLRX_COMMIT: 'fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df'

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact Crota shader corpus
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime corpus shader disasm out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "$CATALOG_ZIP_SHA256  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "$CATALOG_JSON_SHA256  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 4 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o out/packages.txt
          python tools/d1_tower_recover_articulated_visual_corpus.py \
            --package-list out/packages.txt \
            --required-package-id 00ef --required-package-id 0447 --required-package-id 0157 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --out-dir corpus --report out/CROTA_VISUAL_SHADER_CORPUS.json

      - name: Extract exact complete Crota highest-detail shader variants
        run: |
          set -euo pipefail
          printf '%s\n' '{"pixel_shader_frequency":{"8108E7B7":2,"8108E7B8":2,"8108E953":1,"80AAE1CD":1,"8108E955":2,"8108E958":2,"8108E956":2,"8108E959":2}}' > out/minimal_shader_manifest.json
          mapfile -t files < <(find corpus -maxdepth 1 -type f -name '*.pkg' | sort)
          snaps=(); for f in "${files[@]}"; do snaps+=(--snapshot "$f"); done
          python tools/d1_world_shader_extract.py "${snaps[@]}" --runtime runtime \
            --manifest out/minimal_shader_manifest.json \
            --shader 0x809DE9AB --shader 0x809DF743 \
            --shader 0x8108E7B7 --shader 0x8108E7B8 \
            --shader 0x8108E953 --shader 0x80AAE1CD \
            --shader 0x8108E955 --shader 0x8108E958 \
            --shader 0x8108E956 --shader 0x8108E959 \
            --out-dir shader --report out/CROTA_VISUAL_SHADER_EXTRACT.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_VISUAL_SHADER_EXTRACT.json'))
          assert d['status']=='D1_WORLD_PIXEL_SHADER_GCN_EXACT' and d['error_count']==0,d
          wanted={'809DE9AB','809DF743','8108E7B7','8108E7B8','8108E953','80AAE1CD','8108E955','8108E958','8108E956','8108E959'}
          assert {x['shader'] for x in d['shaders']}==wanted,(wanted-{x['shader'] for x in d['shaders']},d)
          for x in d['shaders']:
              print('EXACT',x['shader'],x['native_shader'],x['gcn_bytes'],x['gcn_sha256'])
          PY

      - name: Disassemble pinned GFX700 programs
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/CLRX/CLRX-mirror.git clrx
          git -C clrx checkout --quiet "$CLRX_COMMIT"
          test "$(git -C clrx rev-parse HEAD)" = "$CLRX_COMMIT"
          cmake -S clrx -B clrx/build -DCMAKE_BUILD_TYPE=Release -DNO_CLWRAPPER=ON -DBUILD_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_DOCUMENTATION=OFF >/dev/null
          cmake --build clrx/build --target clrxdisasm -j2 >/dev/null
          exe="$(find clrx/build -type f -name clrxdisasm -perm -111 | head -1)"; test -n "$exe"
          for f in shader/PS_*_gcn.bin; do
            b="$(basename "$f" _gcn.bin)"
            "$exe" --raw --gpuType=GFX700 --hexcode "$f" > "disasm/${b}.s" 2> "disasm/${b}.stderr"
            test ! -s "disasm/${b}.stderr"
            grep -q 's_endpgm' "disasm/${b}.s"
            cp "disasm/${b}.s" "out/${b}_GFX700.s"
          done
          test "$(find disasm -name '*.s' | wc -l)" -eq 10

      - name: Close exact image resource usage
        run: |
          set -euo pipefail
          python tools/d1_gcn_image_usage_analyze.py \
            --extract-report out/CROTA_VISUAL_SHADER_EXTRACT.json \
            --disasm-dir disasm --out out/CROTA_VISUAL_GCN_IMAGE_USAGE.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_VISUAL_GCN_IMAGE_USAGE.json'))
          assert d['status']=='D1_GCN_IMAGE_RESOURCE_USAGE_EXACT',d
          assert d['unmatched_image_instruction_count']==0,d
          by={x['shader']:x for x in d['shaders']}
          for h in ('8108E7B7','8108E7B8','8108E953','80AAE1CD','8108E955','8108E958','8108E956','8108E959'):
              r=by[h]
              print('PIXEL',h,'IMAGE_OPS',r['image_instruction_count'],'USED_T',r['used_texture_indices'],'OPS',r['image_opcodes'])
          PY
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-CROTA-MAIN-VISUAL-SHADER-CLOSURE-V4
          path: out/
          retention-days: 30
          if-no-files-found: error
