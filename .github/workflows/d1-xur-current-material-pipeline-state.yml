name: D1 Xur current material pipeline state

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-current-material-pipeline-state.yml'
      - 'tools/d1_xur_current_pipeline_state_contract.py'
      - 'tools/d1_remote_ps4_roi_material_state4.py'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  LINOODLE_SKIP_DLLMAIN: '1'
  BASE_URL: 'https://crypt.cohae.dev/destiny/ps4/packages/latest'
  XUR_RELEASE_TAG: 'd1-tower-xur-corpus-calibrated-textured-actions-r3'
  XUR_ASSET: 'D1_TOWER_XUR_80C88CEF_CORPUS_CALIBRATED_TEXTURED_ALL_ACTIONS.glb'
  XUR_SHA256: '37b91b4979a309b31ee899c7c617e45aa6cc8d13b15d741357d84a6b225bb5dd'
  ALKAHest_COMMIT: 'c632a562e88b5b805098152658b915d1c59f0f9a'

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Build live catalog and recover pinned Xur/runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog input/xur runtime source_ref out
          curl --fail --location --retry 4 "$BASE_URL/packages.txt" -o input/catalog/packages.txt
          test -s input/catalog/packages.txt
          python tools/d1_remote_activity_index.py --package-list input/catalog/packages.txt --out input/catalog/D1_CURRENT_ACTIVITY_INDEX.json --tsv input/catalog/D1_CURRENT_ACTIVITY_INDEX.tsv
          python tools/d1_universal_member_catalog.py --activity-index input/catalog/D1_CURRENT_ACTIVITY_INDEX.json --package-list input/catalog/packages.txt --out input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          psha=sha('input/catalog/packages.txt')
          idx=json.load(open('input/catalog/D1_CURRENT_ACTIVITY_INDEX.json'))
          cat=json.load(open('input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json'))
          assert idx['status']=='D1_REMOTE_ACTIVITY_INDEX_COMPLETE' and not idx.get('violations'),idx
          assert idx['source']['package_list_sha256']==psha,idx['source']
          assert cat['schema']=='d1_remote_package_member_catalog/v1' and cat['packages_txt_sha256']==psha,cat
          print('LIVE_CATALOG_GREEN',cat['physical_member_count'],cat['package_family_count'],psha)
          PY

          curl --fail --location --retry 5 --retry-all-errors             "https://github.com/${GITHUB_REPOSITORY}/releases/download/${XUR_RELEASE_TAG}/${XUR_ASSET}"             -o "input/xur/${XUR_ASSET}"
          echo "${XUR_SHA256}  input/xur/${XUR_ASSET}" | sha256sum --check --strict

          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

          curl -fsSL --retry 4             "https://raw.githubusercontent.com/cohaereo/alkahest/${ALKAHest_COMMIT}/crates/data/tfx/technique.rs"             -o source_ref/technique.rs
          curl -fsSL --retry 4             "https://raw.githubusercontent.com/cohaereo/alkahest/${ALKAHest_COMMIT}/crates/render/builtin/gpu/rasterizer_states.bin"             -o source_ref/rasterizer_states.bin
          echo '9a144f3fda66d9e972dbe88cb2b8ebf27f88ba8c450187ae82b4a1a633708571  source_ref/rasterizer_states.bin' | sha256sum --check --strict

      - name: Derive exact current 54-material set from carrier
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,struct
          from pathlib import Path
          p=Path('input/xur/D1_TOWER_XUR_80C88CEF_CORPUS_CALIBRATED_TEXTURED_ALL_ACTIONS.glb')
          raw=p.read_bytes(); jl,jt=struct.unpack_from('<II',raw,12); assert jt==0x4E4F534A
          d=json.loads(raw[20:20+jl].decode().rstrip(' \t\r\n\0'))
          tags=[]
          for m in d.get('materials') or []:
              ex=m.get('extras') or {}
              h=str(ex.get('d1_material_taghash') or '').upper()
              if h: tags.append(h)
          tags=sorted(set(tags))
          assert len(tags)==54,(len(tags),tags)
          Path('out/current_materials.txt').write_text('\n'.join(tags)+'\n')
          print('CURRENT_XUR_MATERIALS',len(tags),tags)
          PY

      - name: Read exact current material state windows
        run: |
          set -euo pipefail
          mapfile -t mats < out/current_materials.txt
          args=(); for m in "${mats[@]}"; do args+=(--material "$m"); done
          python tools/d1_remote_ps4_roi_material_state4.py             "${args[@]}"             --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json             --base-url "$BASE_URL" --part-count 10 --runtime runtime             -o out/current_material_state4.json

      - name: Promote material-local pipeline contract
        run: |
          set -euo pipefail
          python tools/d1_xur_current_pipeline_state_contract.py             --state4 out/current_material_state4.json             --technique-rs source_ref/technique.rs             --rasterizer-bin source_ref/rasterizer_states.bin             -o out/D1_XUR_CURRENT_PIPELINE_STATE_CONTRACT.json
          python - <<'PY'
          import json
          d=json.load(open('out/D1_XUR_CURRENT_PIPELINE_STATE_CONTRACT.json'))
          assert d['status']=='D1_XUR_CURRENT_MATERIAL_LOCAL_PIPELINE_STATE_EXACT',d
          assert d['material_count']==54,d
          assert not d['violations'],d
          assert d['rasterizer_state_count']==9,d
          assert d['rasterizer_table_sha256']=='9a144f3fda66d9e972dbe88cb2b8ebf27f88ba8c450187ae82b4a1a633708571',d
          print('XUR_CURRENT_PIPELINE_STATE_GREEN',d['state4_histogram'],d['selected_indices_by_lane'],d['used_rasterizer_states'])
          PY
          find out source_ref -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-XUR-CURRENT-MATERIAL-PIPELINE-STATE
          path: |
            out/
            source_ref/
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
