name: D1 Tower spawned actor animation options v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-spawned-actor-animation-options-v2.yml'
      - 'tools/d1_remote_spawned_actor_animation_options_v2.py'
      - 'evidence/d1_tower_spawned_entity_seed.json'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  close-options:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Recover exact universal catalog and pinned animation runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy scipy pyglm
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
          test "$(git -C parser rev-parse HEAD)" = b9fdc3a43dd28118113275624fcc9054b75855f4
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Source-close every selector-selected animation option through native retarget
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_spawned_actor_animation_options_v2.py
          python tools/d1_remote_spawned_actor_animation_options_v2.py \
            --seed evidence/d1_tower_spawned_entity_seed.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' \
            --part-count 10 --runtime runtime --parser-root parser \
            -o out/TOWER_SPAWNED_ACTOR_ANIMATION_OPTIONS_V2.json \
            | tee out/stdout.txt

      - name: Enforce retail canaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='out/TOWER_SPAWNED_ACTOR_ANIMATION_OPTIONS_V2.json'
          d=json.load(open(p))
          assert d['status']=='D1_TOWER_SPAWNED_ACTOR_ANIMATION_OPTIONS_COMPLETE', d['violations'][:20]
          assert d['entity_count']==57, d
          assert d['source_closed_entity_count']==57, d
          assert d['preserved_with_frontier_entity_count']==0, d
          assert d['violation_entity_count']==0, d
          assert d['animation_family_count']==6, d
          assert d['unique_control_count']==3, d
          assert d['unique_selector_selected_clip_count']==297, d
          assert d['unique_animation_list_clip_count']==356, d
          assert d['target_count']==d['closed_target_count']==6, d
          assert d['retarget_pair_execution_count']==1365, d
          assert d['retarget_pair_success_count']==1365, d
          assert d['retarget_pair_failure_count']==0, d
          expected={
            ('8087640B','80C880C9','80C880D9'):30,
            ('8087676B','80C88404','80C88439'):267,
            ('8087676E','8087676F','809D80FC'):267,
            ('809D80C9','809D80D3','809D80FC'):267,
            ('809D8613','809D80EE','809D80FC'):267,
            ('80AD27B2','80A7F90B','809D80FC'):267,
          }
          got={(x['skeleton'],x['runtime_rig'],x['control']):x['retarget_success_count'] for x in d['targets']}
          assert got==expected,(got,expected)
          print('ANIMATION_OPTIONS_V2_CLOSED',
                'entities',d['entity_count'],
                'families',d['animation_family_count'],
                'controls',d['unique_control_count'],
                'selected_unique',d['unique_selector_selected_clip_count'],
                'bank_unique',d['unique_animation_list_clip_count'],
                'pair_executions',d['retarget_pair_execution_count'])
          for x in d['targets']:
              print(' TARGET',x['skeleton'],x['runtime_rig'],x['control'],
                    'states',x['selector_state_count'],
                    'selected',x['selector_selected_unique_clip_count'],
                    'bank',x['animation_list_count'],
                    'unused_bank',x['unused_animation_list_clip_count'],
                    'exact_dims',x['exact_dimension_clip_count'],
                    'native_retarget',x['native_retarget_required_clip_count'])
          PY
          sha256sum out/* > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-TOWER-SPAWNED-ACTOR-ANIMATION-OPTIONS-V2
          path: out/
          retention-days: 30
          if-no-files-found: error
