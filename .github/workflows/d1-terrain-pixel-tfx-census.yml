name: D1 Terrain Pixel TFX Census

on:
  push:
    paths:
      - '.github/workflows/d1-terrain-pixel-tfx-census.yml'
      - 'tools/d1_world_terrain_tfx_census.py'
      - 'tools/d1_tfx_program_inventory.py'
      - 'tools/d1_roi_tfx_resource_assignment_prefix_proof.py'
      - 'tools/d1_material_decode.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NATIVE_PS_ARTIFACT_ID: '10058234988'
  NATIVE_PS_ARTIFACT_SHA256: '458dd3a2a3496760c78b2feaa72be29767c6fb6ec514afb0ec9c67623047d91f'
  LINOODLE_SKIP_DLLMAIN: '1'

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover authoritative terrain material census
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input runtime packages out
          curl -fsSL --retry 4             -H "Authorization: Bearer $GH_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${NATIVE_PS_ARTIFACT_ID}/zip"             -o input/native.zip
          echo "${NATIVE_PS_ARTIFACT_SHA256}  input/native.zip" | sha256sum --check --strict
          unzip -q input/native.zip -d input/native
          resources="$(find input/native -name terrain_ps_resources_final.json -type f -print -quit)"
          test -n "$resources"
          cp "$resources" out/terrain_ps_resources_final.json

      - name: Recover archive index and decoder runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll'             -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so'             -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl -fsSL --retry 8             'https://github.com/lizardpeter/destiny-1/releases/download/d1-global-activity-index-r1/D1_CURRENT_ACTIVITY_INDEX.json'             -o out/D1_CURRENT_ACTIVITY_INDEX.json
          curl -fsSL --retry 4             'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt'             -o out/packages.txt

      - name: Recover selected material package families
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/terrain_ps_resources_final.json'))
          ids=sorted({str(x.get('required_package_id')).lower() for x in d['materials'] if x.get('required_package_id')})
          open('out/material_package_ids.txt','w').write(''.join(x+'\n' for x in ids))
          print('material package ids',ids)
          PY
          args=()
          while read -r p; do args+=(--package-id "$p"); done < out/material_package_ids.txt
          python tools/d1_recover_indexed_package_families.py             --index out/D1_CURRENT_ACTIVITY_INDEX.json             --package-list out/packages.txt             "${args[@]}"             --out-dir packages             --report out/material_package_recovery.json

      - name: Inventory exact terrain pixel TFX programs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find packages -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_terrain_tfx_census.py             "${args[@]}"             --runtime runtime             --terrain-resources out/terrain_ps_resources_final.json             --out out/D1_TERRAIN_PIXEL_TFX_CENSUS.json

      - name: Enforce complete framing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/D1_TERRAIN_PIXEL_TFX_CENSUS.json'))
          assert d['status']=='D1_TERRAIN_PIXEL_TFX_CENSUS_COMPLETE',d
          assert d['selected_material_count']==108,d
          assert d['framed_material_count']==108,d
          assert not d['violations'],d
          print('D1_TERRAIN_PIXEL_TFX_CENSUS_GREEN',
                'materials',d['selected_material_count'],
                'unique_expr',d['unique_expression_count'],
                'extern_materials',d['live_extern_material_count'],
                'unk42_materials',d['unk42_material_count'],
                'opcodes',d['opcode_histogram'],
                'externs',d['extern_histogram'])
          PY
          sha256sum out/D1_TERRAIN_PIXEL_TFX_CENSUS.json > out/SHA256SUMS_TFX.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-terrain-pixel-tfx-census
          path: |
            out/D1_TERRAIN_PIXEL_TFX_CENSUS.json
            out/SHA256SUMS_TFX.txt
            out/material_package_ids.txt
            out/material_package_recovery.json
          if-no-files-found: error
          retention-days: 30
