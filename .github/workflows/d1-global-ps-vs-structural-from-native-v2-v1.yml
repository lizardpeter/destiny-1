name: D1 global PS VS structural from native V2 v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-global-ps-vs-structural-from-native-v2-v1.yml'

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: '34303352426'
  SOURCE_RUN_HEAD_SHA: 'a0156414c7999208c9d0c9da16fff8443fa45f50'
  SOURCE_ARTIFACT_NAME: 'D1-GLOBAL-PS-VS-NATIVE-CORPUS-V2'
  CLRX_COMMIT: 'fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df'

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Self-test strict V2 admission and corrected structural drivers
        run: |
          set -euo pipefail
          python tools/d1_shader_corpus_extract_v2_structural_projection.py --self-test
          python tools/d1_gcn_cfg_ir_parse_accounting_selftest.py
          python tools/d1_gcn_shader_corpus_stage_frontier_v2.py --self-test

      - name: Wait for exact raw native V2 source run
        run: |
          set -euo pipefail
          mkdir -p source out work
          completed=''
          for _ in $(seq 1 720); do
            curl -fsSL --retry 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
              -o source/run.json
            read -r status conclusion head_sha < <(python - <<'PY'
          import json
          d=json.load(open('source/run.json'))
          print(d.get('status',''), d.get('conclusion') or '-', d.get('head_sha',''))
          PY
            )
            echo "SOURCE_RUN status=$status conclusion=$conclusion head_sha=$head_sha"
            test "$head_sha" = "$SOURCE_RUN_HEAD_SHA"
            if test "$status" = completed; then
              completed=1
              break
            fi
            sleep 30
          done
          test "$completed" = 1

      - name: Download and verify exact native V2 checkpoint
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            -o source/artifacts.json
          artifact_id=$(python - <<'PY'
          import json,os
          d=json.load(open('source/artifacts.json'))
          want=os.environ['SOURCE_ARTIFACT_NAME']
          rows=[x for x in d.get('artifacts',[]) if x.get('name')==want and not x.get('expired')]
          assert len(rows)==1,(want,[(x.get('id'),x.get('name'),x.get('expired')) for x in d.get('artifacts',[])])
          print(rows[0]['id'])
          PY
          )
          echo "$artifact_id" | tee source/source_artifact_id.txt
          curl -fsSL --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            -o source/source_artifact.zip
          sha256sum source/source_artifact.zip | tee source/source_artifact_zip.sha256
          mkdir -p source/corpus
          unzip -q source/source_artifact.zip -d source/corpus
          test -s source/corpus/out/D1_SHADER_CORPUS_EXTRACT_V2.json
          test -s source/corpus/out/D1_SHADER_EXACT_BINARIES.tar
          (
            cd source/corpus
            sha256sum --check --strict out/SHA256SUMS.txt
            tar -xf out/D1_SHADER_EXACT_BINARIES.tar
          )
          test -d source/corpus/shader/programs
          test -d source/corpus/shader/headers

      - name: Require exact V2 source admission before structural interpretation
        run: |
          set -euo pipefail
          set +e
          python tools/d1_shader_corpus_extract_v2_structural_projection.py \
            source/corpus/out/D1_SHADER_CORPUS_EXTRACT_V2.json \
            -o out/D1_SHADER_CORPUS_EXTRACT_STRUCTURAL_V1.json \
            --report out/D1_SHADER_CORPUS_V2_STRUCTURAL_PROJECTION.json \
            | tee out/v2_projection_stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" | tee out/v2_projection_exit_code.txt
          test "$rc" -eq 0 -o "$rc" -eq 2
          test -s out/D1_SHADER_CORPUS_V2_STRUCTURAL_PROJECTION.json

      - name: Build pinned CLRX GFX700 disassembler
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/CLRX/CLRX-mirror.git clrx
          git -C clrx checkout --quiet "$CLRX_COMMIT"
          test "$(git -C clrx rev-parse HEAD)" = "$CLRX_COMMIT"
          cmake -S clrx -B clrx/build \
            -DCMAKE_BUILD_TYPE=Release -DNO_CLWRAPPER=ON \
            -DBUILD_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_DOCUMENTATION=OFF >/dev/null
          cmake --build clrx/build --target clrxdisasm -j2 >/dev/null
          exe="$(find clrx/build -type f -name clrxdisasm -perm -111 | head -1)"
          test -n "$exe"
          printf '%s\n' "$exe" > out/CLRXDISASM_PATH.txt

      - name: Run exact raw V2 GCN programs through corrected Structural IR census
        run: |
          set -euo pipefail
          exe="$(cat out/CLRXDISASM_PATH.txt)"
          set +e
          python tools/d1_gcn_shader_corpus_structural_census_v2.py \
            --extract-report source/corpus/out/D1_SHADER_CORPUS_EXTRACT_V2.json \
            --program-dir source/corpus/shader/programs \
            --clrx "$exe" \
            --baseline-header 808EE505 \
            --work-dir work \
            -o out/D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS.json \
            | tee out/structural_census_stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" | tee out/structural_census_exit_code.txt
          test "$rc" -eq 0 -o "$rc" -eq 2
          test -s out/D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS.json

      - name: Require exact native-line parse accounting and source-proven mixed stages
        run: |
          set -euo pipefail
          set +e
          python tools/d1_gcn_structural_parse_accounting_gate.py \
            --census out/D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS.json \
            --ir-dir work/ir \
            --required-header 8087695B:VS \
            --required-header 808768B7:PS \
            --required-header 808EE505 \
            -o out/D1_GCN_STRUCTURAL_PARSE_ACCOUNTING_GATE.json \
            | tee out/parse_accounting_gate_stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" | tee out/parse_accounting_gate_exit_code.txt
          test "$rc" -eq 0 -o "$rc" -eq 2
          test -s out/D1_GCN_STRUCTURAL_PARSE_ACCOUNTING_GATE.json

      - name: Build corrected exact PS VS structural frontier
        run: |
          set -euo pipefail
          set +e
          python tools/d1_gcn_shader_corpus_stage_frontier_v2.py \
            --census out/D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS.json \
            --ir-dir work/ir \
            --accounting-gate out/D1_GCN_STRUCTURAL_PARSE_ACCOUNTING_GATE.json \
            -o out/D1_GCN_SHADER_CORPUS_STAGE_FRONTIER.json \
            | tee out/stage_frontier_stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" | tee out/stage_frontier_exit_code.txt
          test "$rc" -eq 0 -o "$rc" -eq 2
          test -s out/D1_GCN_SHADER_CORPUS_STAGE_FRONTIER.json

      - name: Materialize diagnostics and promote only exact reused corpus
        run: |
          set -euo pipefail
          cp source/run.json out/SOURCE_WORKFLOW_RUN.json
          cp source/source_artifact_id.txt out/SOURCE_ARTIFACT_ID.txt
          cp source/source_artifact_zip.sha256 out/SOURCE_ARTIFACT_ZIP_SHA256.txt
          python - <<'PY'
          import json
          r=json.load(open('source/run.json'))
          p=json.load(open('out/D1_SHADER_CORPUS_V2_STRUCTURAL_PROJECTION.json'))
          c=json.load(open('out/D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS.json'))
          g=json.load(open('out/D1_GCN_STRUCTURAL_PARSE_ACCOUNTING_GATE.json'))
          f=json.load(open('out/D1_GCN_SHADER_CORPUS_STAGE_FRONTIER.json'))
          print('SOURCE_RUN',r['id'],r['status'],r.get('conclusion'),r['head_sha'])
          print('PROJECTION_STATUS',p['status'],json.dumps(p['coverage'],sort_keys=True))
          print('STRUCTURAL_STATUS',c['status'])
          print('PARSE_ACCOUNTING_STATUS',g['status'])
          print('STAGE_FRONTIER_STATUS',f['status'])
          print('COVERAGE',json.dumps(c['coverage'],sort_keys=True))
          print('PARSE_ACCOUNTING_COVERAGE',json.dumps(g['coverage'],sort_keys=True))
          print('STAGE_COVERAGE',json.dumps(f['coverage'],sort_keys=True))
          print('PS_ONLY_OPCODES',f['cross_stage']['ps_only_opcodes'])
          print('VS_ONLY_OPCODES',f['cross_stage']['vs_only_opcodes'])
          print('PROMOTION_QUEUE_TOP20',json.dumps(f['frontier_vs_808ee505_baseline']['opcode_promotion_queue'][:20],sort_keys=True))
          print('VIOLATIONS',len(p['violations']),len(c['violations']),len(g['violations']),len(f['violations']))
          PY
          find out work/ir work/disasm work/stderr \
            -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

          test "$(python - <<'PY'
          import json
          print(json.load(open('source/run.json')).get('conclusion'))
          PY
          )" = success
          test "$(cat out/v2_projection_exit_code.txt)" -eq 0
          test "$(cat out/structural_census_exit_code.txt)" -eq 0
          test "$(cat out/parse_accounting_gate_exit_code.txt)" -eq 0
          test "$(cat out/stage_frontier_exit_code.txt)" -eq 0
          python - <<'PY'
          import json
          p=json.load(open('out/D1_SHADER_CORPUS_V2_STRUCTURAL_PROJECTION.json'))
          c=json.load(open('out/D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS.json'))
          g=json.load(open('out/D1_GCN_STRUCTURAL_PARSE_ACCOUNTING_GATE.json'))
          f=json.load(open('out/D1_GCN_SHADER_CORPUS_STAGE_FRONTIER.json'))
          assert p['status']=='D1_SHADER_CORPUS_V2_STRUCTURAL_PROJECTION_EXACT',p['violations'][:50]
          assert c['status']=='D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS_COMPLETE',c['violations'][:50]
          assert not c['violations']
          assert c.get('driver',{}).get('vcc_normalized_register_classification_fixed') is True,c.get('driver')
          assert c.get('encoding_representation_boundary',{}).get('clrx_encoding_hex_concatenation_is_raw_byte_oracle') is False,c.get('encoding_representation_boundary')
          assert g['status']=='D1_GCN_STRUCTURAL_PARSE_ACCOUNTING_CORPUS_EXACT',g['violations'][:50]
          assert not g['violations']
          assert all(x['exact_structural_parse_accounting'] for x in g['required_mixed_stage_reference_headers'])
          assert f['status']=='D1_GCN_SHADER_CORPUS_STAGE_FRONTIER_EXACT',f['violations'][:50]
          assert not f['violations']
          assert f.get('driver',{}).get('vcc_precedence_over_generic_vgpr_prefix') is True,f.get('driver')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-GLOBAL-PS-VS-STRUCTURAL-FROM-NATIVE-V2-V1
          path: |
            out/
            work/ir/
            work/disasm/
            work/stderr/
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
