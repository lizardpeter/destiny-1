name: Temporary trace weapon VS and main samplers

on:
  push:
    paths:
      - '.github/workflows/tmp-disasm-80A3D28E-samplers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Recover runtime and exact namespaces
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports shader
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x43779C800 \
            --target ps4_gear_weapons_011e_0.pkg --target ps4_gear_weapons_011e_1.pkg \
            --target ps4_gear_weapons_011e_2.pkg --target ps4_gear_weapons_011e_3.pkg --target ps4_gear_weapons_011e_5.pkg \
            --out recovered --manifest reports/011e_extract.json --retries 6 --timeout 90
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x46711B000 \
            --target ps4_globals_0156_0.pkg --target ps4_globals_0156_1.pkg --target ps4_globals_0156_2.pkg \
            --target ps4_globals_0156_3.pkg --target ps4_globals_0156_4.pkg --target ps4_globals_0156_5.pkg \
            --out recovered --manifest reports/0156_extract.json --retries 6 --timeout 90
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x46AF91400 \
            --target ps4_globals_0157_0.pkg --target ps4_globals_0157_1.pkg \
            --out recovered --manifest reports/0157_extract.json --retries 6 --timeout 90

      - name: Probe exact VS and all unique main sampler tags
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_ps4_shader_binary_probe.py recovered/ps4_gear_weapons_011e_5.pkg --runtime runtime \
            --tag-hash 80A3D28E --dump-dir shader -o reports/shader_80A3D28E.json
          python tools/d1_ps4_sampler_probe.py recovered/ps4_globals_0157_1.pkg --runtime runtime \
            --tag-hash 80AAE176 --tag-hash 80AAE177 --tag-hash 80AADBAB \
            -o reports/samplers_0157.json
          python tools/d1_ps4_sampler_probe.py recovered/ps4_globals_0156_5.pkg --runtime runtime \
            --tag-hash 80AAE176 --tag-hash 80AAE177 --tag-hash 80AADBAB \
            -o reports/samplers_0156.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('reports/shader_80A3D28E.json').read_text())['shaders'][0]
          assert s['tag_hash']=='80A3D28E' and s['present'] and s['binary_info']['stage']=='VertexShader'
          rows=[]
          for p in ['reports/samplers_0157.json','reports/samplers_0156.json']:
              d=json.loads(Path(p).read_text())
              rows += [(x['tag_hash'],x.get('present'),x.get('decoded')) for x in d['samplers']]
          found={h:dec for h,present,dec in rows if present and dec}
          assert set(found)=={'80AAE176','80AAE177','80AADBAB'}, found.keys()
          for h in sorted(found):
              d=found[h]
              print(h,d['words_hex'],d['wrap_x']['gnm_name'],d['wrap_y']['gnm_name'],d['mag_filter']['gnm_name'],d['min_filter']['gnm_name'],d['mip_filter']['gnm_name'])
          PY

      - name: Build pinned CLRX and disassemble VS
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/CLRX/CLRX-mirror.git clrx
          git -C clrx checkout --quiet fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df
          test "$(git -C clrx rev-parse HEAD)" = 'fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df'
          cmake -S clrx -B clrx/build -DCMAKE_BUILD_TYPE=Release -DNO_CLWRAPPER=ON \
            -DBUILD_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_DOCUMENTATION=OFF
          cmake --build clrx/build --target clrxdisasm -j2
          exe="$(find clrx/build -type f -name clrxdisasm -perm -111 | head -1)"
          test -n "$exe"
          "$exe" --raw --gpuType=GFX700 --hexcode shader/80A3D28E_gcn_code.bin > reports/80A3D28E_gfx700.s 2> reports/80A3D28E_gfx700.stderr
          "$exe" --raw --arch=GCN1.1 --hexcode shader/80A3D28E_gcn_code.bin > reports/80A3D28E_gcn11.s 2> reports/80A3D28E_gcn11.stderr
          test ! -s reports/80A3D28E_gcn11.stderr
          grep -q 's_endpgm' reports/80A3D28E_gcn11.s
          grep -E 'exp +param|exp +pos|s_endpgm' reports/80A3D28E_gcn11.s || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 80A3D28E-vs-main-samplers
          path: |
            reports/
            shader/
          retention-days: 3
