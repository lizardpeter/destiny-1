name: D1 Xur material TFX stack IO contract

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-material-tfx-stack-io-contract.yml'
      - 'tools/d1_xur_material_tfx_stack_io_contract.py'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  STATE_ARTIFACT_ID: '10028092407'
  STATE_ARTIFACT_ZIP_SHA256: '83c5b4af4590d986fb917ddc9da4098e2d1272ad30025db8395f53cac61e4407'

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact Xur material-local state
        run: |
          set -euo pipefail
          mkdir -p input out
          curl --fail --location --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STATE_ARTIFACT_ID}/zip" \
            -o input/state.zip
          echo "${STATE_ARTIFACT_ZIP_SHA256}  input/state.zip" | sha256sum --check --strict
          unzip -q input/state.zip -d input/state
          test -f input/state/xur_material_stage_state.json

      - name: Prove D1 material TFX stack and IO behavior
        run: |
          set -euo pipefail
          python tools/d1_xur_material_tfx_stack_io_contract.py \
            --material-state input/state/xur_material_stage_state.json \
            -o out/D1_XUR_MATERIAL_TFX_STACK_IO_CONTRACT.json
          python - <<'PY'
          import json
          d=json.load(open('out/D1_XUR_MATERIAL_TFX_STACK_IO_CONTRACT.json'))
          assert d['status']=='D1_XUR_MATERIAL_TFX_STACK_IO_CONTRACT_EXACT',d
          assert d['stage_program_count']==108,d
          assert d['all_108_programs_zero_final_depth'] is True,d
          assert d['unknown_stack_delta_uniqueness']['solutions']==[[-1,1,1]],d['unknown_stack_delta_uniqueness']
          assert d['unknown_stack_delta_uniqueness']['unique_solution_is_minus1_plus1_plus1'] is True,d['unknown_stack_delta_uniqueness']
          assert d['op42_count']==54,d
          assert d['op42_all_targets_valid_cbuffer_indices'] is True,d
          assert d['op42_all_serialized_targets_zero4'] is True,d
          assert d['op4a_count']==43,d
          assert d['op4a_valid_cbuffer_operand_count']==42,d
          assert d['op4a_read_after_0x42_same_slot_count']==34,d
          assert d['op4b_count']==4,d
          assert d['op4b_operand_histogram']=={'53':4},d
          assert d['op4b_exact_lerp_then_0x42_pattern'] is True,d
          assert d['resource_assignment_destination_rule_all'] is True,d
          assert not d['violations'],d
          print('XUR_D1_TFX_STACK_IO_GREEN',d['op42_count'],d['op4a_count'],d['op4b_count'],d['resource_assignment_pair_count'])
          PY
          sha256sum out/* > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-XUR-MATERIAL-TFX-STACK-IO-CONTRACT
          path: out/
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
