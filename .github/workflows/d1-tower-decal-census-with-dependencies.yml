name: D1 Tower decal census with dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-decal-census-with-dependencies.yml'
      - 'tools/d1_tower_static_map_decal_validate.py'

permissions:
  contents: read

jobs:
  validate-decals:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered validation reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Recover exact Tower decal dependency corpus
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar
          rows=[
            ('ps4_arch_human_earth_city_009f_0.pkg',2870153216,269680640,'7446d5c4b8c2ca3fed6bb0b13a649ff68052a8a2fcfa3aae1b38bf8356c54813'),
            ('ps4_arch_human_earth_city_009f_1.pkg',3139834368,32270336,'e5907ac4b5ba8256c23b667b5f1b237b729db824503a225c9b39daad993d7719'),
            ('ps4_arch_human_earth_city_009f_2.pkg',3172105216,203638784,'467047bcfab0281f0f1a69ea2e43038c9e1bc616b0214f1cdc62eb7666844b24'),
            ('ps4_arch_human_earth_city_009f_4.pkg',3375744512,116736,'0f58f8042d96852a1641e4b4378d2b6f7316b15ba8c6294cd5674e5ac61dc504'),
            ('ps4_city_tower_destination_024c_0.pkg',7542949376,137527296,'ffb2e3cbb9777956384063e3c0fc5636200df51ae82a35a6aad06850dbf1fff2'),
            ('ps4_city_tower_destination_024c_1.pkg',7680477184,12226560,'21e75033fcba2f85b5d22b7377a7122c5135ce2c3f10f8453fc54a1d304c10f8'),
            ('ps4_city_tower_destination_024c_2.pkg',7692704256,13574144,'681349e0d32c213cae4bdef839bee8a6fa5aa3a5989c4a5344ee342cbe9d6e45'),
            ('ps4_city_tower_destination_024c_3.pkg',7706278912,2134016,'c6846bbe0bdf9aaf9ba194ed8a2a3b2c7e26178bd79218134e909fa460ebcaef'),
            ('ps4_city_tower_destination_024c_4.pkg',7708413440,6987776,'12dfe5e7dc65a8477d5ceabba5bb921b07c83110151a57b86a52ba3eb7d82018'),
            ('ps4_city_tower_destination_024c_5.pkg',7715401728,1687552,'b404bacccf44a4bf6859bf3b867ae02f5dc840432bdaa081c341439c2ae83311'),
            ('ps4_city_tower_destination_0250_0.pkg',7882616320,294875136,'beb269a2673f1106e2eff20ff577d0221d7fa56a8b71f5f8763cf34272114b32'),
            ('ps4_city_tower_destination_0250_1.pkg',8177491968,17983488,'87904a97ce9899305b6bdba9df960d220749b3b2398c4ba8bd97e6efb8f81f91'),
            ('ps4_city_tower_destination_0250_2.pkg',8195475968,11143168,'7543c1926023ec76ff8949618e04e1d0a93609f8448a1f8f875fcfc505a6b219'),
            ('ps4_city_tower_destination_0250_3.pkg',8206619648,206848,'1db9423081f922b78cce256641dfab195e6a4b4afb6020e4e0c5029234f19375'),
            ('ps4_city_tower_destination_0250_4.pkg',8206827008,17901568,'5a9370d60724622fb6592a7bcfa2fc4dbb40a4fca5cd696ce8db086a5756e84f'),
            ('ps4_city_tower_destination_0250_5.pkg',8224729088,1677312,'2066afe09503eee4c35d948f6749a6e7b7b02572dcd41d1d3ca679fa523ea22c'),
            ('ps4_env_skies_01cf_0.pkg',14216130048,277645312,'f45d85c89f46e5ba9585073f105b8a1c1229c4d543b56e38ccc840a0010d297a'),
            ('ps4_env_skies_01cf_1.pkg',14493775872,3885056,'16a54200f04680d06ed3936afc44aac1eaea8f111cc44acac2fa18cdd394b34f'),
            ('ps4_env_skies_01cf_2.pkg',14497661440,87631872,'1999fa9d728ef75393f59171325b397cb1356d94322694b6fedd60e339f171f9'),
          ]
          arc=SplitHttpTar([f'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=120)
          out=[]
          for name,off,size,sha in rows:
              got=arc.copy_to(off,size,Path('recovered')/name)
              if got.lower()!=sha.lower(): raise SystemExit(f'{name}: SHA mismatch')
              out.append({'name':name,'offset':off,'size':size,'sha256':got})
          Path('reports/member_catalog.json').write_text(json.dumps({'members':out},indent=2)+'\n')
          PY

      - name: Validate all nine common decal carriers and ten baked controls
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          commons=(80C98191 80C984D7 80C98A69 80C993A2 80C997F4 80C99980 80CA0B6F 80CA0B71 80CA0C5F)
          baked=(80C98254 80C984D8 80C98A6B 80C993CD 80C993CF 80C997F5 80C99981 80CA0B70 80CA0B72 80CA0C60)
          for h in "${commons[@]}"; do
            python tools/d1_tower_static_map_decal_validate.py "${args[@]}" --runtime runtime --static-map-data "$h" --out "validation/common_${h}.json"
          done
          for h in "${baked[@]}"; do
            python tools/d1_tower_static_map_decal_validate.py "${args[@]}" --runtime runtime --static-map-data "$h" --out "validation/baked_${h}.json"
          done

      - name: Assert complete binary decal-layer closure
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          common=[]; baked=[]
          for p in sorted(Path('validation').glob('common_*.json')): common.append(json.loads(p.read_text()))
          for p in sorted(Path('validation').glob('baked_*.json')): baked.append(json.loads(p.read_text()))
          if len(common)!=9 or len(baked)!=10: raise SystemExit('unexpected target count')
          if not all(x['ok'] for x in common):
              raise SystemExit('common decal carrier failed: '+json.dumps([(x['static_map_data'],x['violations']) for x in common if not x['ok']]))
          if not all(x['ok'] for x in baked): raise SystemExit('baked control failed')
          if any(x['summary']['has_direct_d1_static_child'] for x in common): raise SystemExit('common carrier unexpectedly has D1 static child')
          if not all(x['summary']['has_direct_d1_static_child'] for x in baked): raise SystemExit('baked control lacks D1 child')
          total=sum(x['summary']['decal_count'] for x in common)
          valid=sum(x['summary']['decal_records_structurally_valid'] for x in common)
          singleton=sum(x['summary']['singleton_transform_model_records'] for x in common)
          if (total,valid,singleton)!=(327,327,327): raise SystemExit(f'decal totals mismatch {(total,valid,singleton)}')
          hist=Counter()
          for x in common: hist.update(x['summary']['entity_model_histogram'])
          rep={
            'evidence_status':'CONFIRMED_BINARY_TOWER_COMMON_DECAL_LAYER',
            'common_carriers':9,'baked_controls':10,'decal_records':327,
            'structurally_valid_records':327,'singleton_transform_model_records':327,
            'unique_entity_models':len(hist),'entity_model_histogram':dict(hist),
            'common_resources':[{'hash':x['static_map_data'],'decals':x['summary']['decal_count'],'unique_models':x['summary']['unique_entity_models']} for x in common],
            'interpretation':'The large/common 808008B4 resources are binary-confirmed decal carriers; the paired 0x38 baked resources contain zero decal records and a direct 80801B75 static child.',
          }
          Path('reports/decal_layer_closure.json').write_text(json.dumps(rep,indent=2)+'\n')
          print(json.dumps(rep,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-decal-layer-with-dependencies
          path: |
            reports/
            validation/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
