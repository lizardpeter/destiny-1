name: D1 Tower activity map-root census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-activity-map-root-census.yml'
      - 'tools/d1_tower_recover_map_activity_root_corpus.py'
      - 'tools/d1_tower_recover_activity_root_corpus.py'
      - 'tools/d1_tower_recover_current_corpus.py'
      - 'tools/d1_recover_package_ids.py'
      - 'tools/d1_tag_manifest_resolver.py'
      - 'tools/d1_world_activity_manifest_dependency_plan.py'
      - 'tools/d1_world_activity_map_root_census.py'
      - 'tools/d1_world_map_root_census.py'
      - 'tools/d1_world_map_data_layer_census.py'
      - 'tools/d1_tower_map_schema_validate_v5.py'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Recover pinned Tower map/activity roots
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_map_activity_root_corpus.py \
            --package-list reports/packages.txt \
            --out-dir recovered \
            --report reports/tower_map_activity_root_corpus.json

      - name: Derive and recover shared-manifest package dependencies
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t root_files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          root_args=(); for f in "${root_files[@]}"; do root_args+=(--snapshot "$f"); done
          python tools/d1_world_activity_manifest_dependency_plan.py "${root_args[@]}" --runtime runtime \
            --out reports/tower_activity_manifest_dependency_plan.json \
            --package-id-list reports/tower_activity_manifest_package_ids.txt \
            | tee reports/tower_activity_manifest_dependency_plan_stdout.txt

          python - <<'PY'
          import json
          d=json.load(open('reports/tower_activity_manifest_dependency_plan.json'))
          expected={
            'status':'D1_WORLD_ACTIVITY_MANIFEST_DEPENDENCY_PLAN_COMPLETE',
            'selected_activity_count':1,
            'selected_activities':['80C98019'],
            'child_edge_count':5,
            'manifest_parent_edge_count':5,
            'direct_class_edge_count':0,
            'manifest_package_id_count':2,
            'manifest_package_ids':['0430','0431'],
          }
          bad={k:{'expected':v,'actual':d.get(k)} for k,v in expected.items() if d.get(k)!=v}
          if bad: raise SystemExit('Tower Activity manifest dependency regression mismatch: '+json.dumps(bad,indent=2))
          print('TOWER_ACTIVITY_MANIFEST_DEPENDENCIES_DISCOVERED',json.dumps(expected,sort_keys=True))
          PY

          mapfile -t manifest_ids < reports/tower_activity_manifest_package_ids.txt
          test "${#manifest_ids[@]}" -gt 0
          manifest_args=(); for pid in "${manifest_ids[@]}"; do manifest_args+=(--package-id "$pid"); done
          python tools/d1_recover_package_ids.py \
            --package-list reports/packages.txt "${manifest_args[@]}" \
            --out-dir recovered \
            --report reports/activity_discovered_manifest_recovery.json

      - name: Trace current named D1 Activity through manifest-resolved bubbles to map tables
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_activity_map_root_census.py "${args[@]}" --runtime runtime \
            --out reports/tower_activity_map_root_census.json \
            | tee reports/tower_activity_map_root_census_stdout.txt

      - name: Validate Activity-owned Tower root fixture
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_map_root_census.py "${args[@]}" --runtime runtime \
            --out reports/tower_all_resolved_bubble_map_root_census.json \
            | tee reports/tower_all_resolved_bubble_map_root_census_stdout.txt
          python - <<'PY'
          import json
          a=json.load(open('reports/tower_activity_map_root_census.json'))
          b=json.load(open('reports/tower_all_resolved_bubble_map_root_census.json'))
          expected=sorted([
            '80C98028','80C984A0','80C9895C','80C989F7','80C997DF',
            '80C99956','80CA0B0E','80CA0B11','80CA0C4E',
          ])
          if a.get('status')!='D1_WORLD_ACTIVITY_MAP_ROOT_CENSUS_COMPLETE':
              raise SystemExit('activity ownership census incomplete: '+json.dumps(a.get('violations')))
          if a.get('current_d1_activity_count')!=1 or a.get('current_d1_activity_named_row_count')!=2:
              raise SystemExit('Tower named Activity alias fixture changed: '+json.dumps({
                  'unique':a.get('current_d1_activity_count'),
                  'named_rows':a.get('current_d1_activity_named_row_count'),
                  'activities':a.get('current_d1_activities')}))
          if a.get('selected_activities')!=['80C98019']:
              raise SystemExit('Tower root Activity changed: '+json.dumps(a.get('selected_activities')))
          actual=sorted(a.get('map_data_tables',[]))
          if actual!=expected:
              raise SystemExit('activity-owned Tower table set changed: '+json.dumps({'expected':expected,'actual':actual},indent=2))
          if a.get('total_reachable_map_entries')!=337:
              raise SystemExit(f'activity-owned Tower entry total changed: {a.get("total_reachable_map_entries")}')

          # Package-wide class discovery is deliberately broader than Activity
          # ownership. It is a cross-check, not the world-selection mechanism.
          all_tables=set(b.get('map_data_tables',[]))
          missing=sorted(set(expected)-all_tables)
          if missing:
              raise SystemExit('Activity-owned tables absent from resolved bubble census: '+json.dumps(missing))
          missing_bubbles=sorted(set(a.get('bubble_definitions',[]))-set(b.get('bubble_definitions',[])))
          if missing_bubbles:
              raise SystemExit('Activity-owned bubbles absent from package-wide class census: '+json.dumps(missing_bubbles))
          print('TOWER_ACTIVITY_TO_MAP_ROOTS_CLOSED',json.dumps({
              'activity':'80C98019',
              'activity_alias_rows':a.get('current_d1_activity_named_row_count'),
              'manifest_packages':json.load(open('reports/tower_activity_manifest_dependency_plan.json'))['manifest_package_ids'],
              'bubbles':a.get('reachable_bubble_count'),
              'containers':a.get('reachable_map_container_count'),
              'tables':len(actual),
              'entries':a.get('total_reachable_map_entries'),
              'package_wide_resolved_tables':len(all_tables),
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-activity-map-root-census
          path: reports/
          retention-days: 14
          compression-level: 6
