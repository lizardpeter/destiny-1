name: D1 Tower activity map-root census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-activity-map-root-census.yml'
      - 'tools/d1_world_activity_map_root_census.py'
      - 'tools/d1_world_map_root_census.py'
      - 'tools/d1_world_map_data_layer_census.py'
      - 'tools/d1_tower_map_schema_validate_v5.py'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Recover established 24-package Tower map/activity core
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python - <<'PY'
          import json,re,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar

          names=[Path(x.strip()).name for x in Path('reports/packages.txt').read_text(errors='replace').splitlines() if x.strip()]
          # This is a Tower regression corpus fixture, not semantic map discovery.
          # The generic parser below receives only bytes and class ownership.
          rx=re.compile(r'^ps4_city_tower_(?:activities_act_023d|ambient_activi_0244|destination_024c|destination_0250)_[0-9]+\.pkg$',re.I)
          wanted=sorted(x for x in names if rx.match(x))
          if len(wanted)!=24:
              raise SystemExit(f'expected established 24-member Tower core, found {len(wanted)}: {wanted}')
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=90)
          found,headers=arc.find(set(wanted))
          missing=sorted(set(wanted)-set(found))
          if missing: raise SystemExit('missing Tower core members: '+json.dumps(missing))
          rows=[]
          for name in wanted:
              r=found[name]
              sha=arc.copy_to(r['data_offset'],r['size'],Path('recovered')/name)
              rows.append({'name':name,**r,'sha256':sha})
              print('RECOVERED',name,r['size'],sha,flush=True)
          Path('reports/tower_core_member_catalog.json').write_text(json.dumps({
              'schema_version':1,
              'status':'D1_TOWER_ESTABLISHED_MAP_ACTIVITY_CORE_RECOVERED',
              'tar_headers_scanned':headers,
              'member_count':len(rows),
              'members':rows,
              'policy':'Physical regression fixture only; semantic world roots are discovered from D1 class ownership after recovery.'
          },indent=2)+'\n')
          PY

      - name: Trace current D1 activities through bubbles to map tables
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_activity_map_root_census.py "${args[@]}" --runtime runtime \
            --out reports/tower_activity_map_root_census.json \
            | tee reports/tower_activity_map_root_census_stdout.txt

      - name: Compare activity-owned roots with current-class bubble roots
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_map_root_census.py "${args[@]}" --runtime runtime \
            --out reports/tower_all_bubble_map_root_census.json \
            | tee reports/tower_all_bubble_map_root_census_stdout.txt
          python - <<'PY'
          import json
          a=json.load(open('reports/tower_activity_map_root_census.json'))
          b=json.load(open('reports/tower_all_bubble_map_root_census.json'))
          expected=sorted([
            '80C98028','80C984A0','80C9895C','80C989F7','80C997DF',
            '80C99956','80CA0B0E','80CA0B11','80CA0C4E',
          ])
          if a.get('status')!='D1_WORLD_ACTIVITY_MAP_ROOT_CENSUS_COMPLETE':
              raise SystemExit('activity ownership census incomplete: '+json.dumps(a.get('violations')))
          actual=sorted(a.get('map_data_tables',[]))
          if actual!=expected:
              raise SystemExit('activity-owned Tower table set changed: '+json.dumps({'expected':expected,'actual':actual},indent=2))
          if a.get('total_reachable_map_entries')!=337:
              raise SystemExit(f'activity-owned Tower entry total changed: {a.get("total_reachable_map_entries")}')
          # The exact Tower map/activity core should not need package-level orphan
          # bubble roots to recover the static destination tables.
          all_tables=sorted(b.get('map_data_tables',[]))
          if all_tables!=expected:
              raise SystemExit('all current bubble roots disagree with Tower fixture: '+json.dumps(all_tables))
          if sorted(a.get('unowned_current_map_data_tables',[])):
              raise SystemExit('current Tower map tables exist outside activity ownership: '+json.dumps(a['unowned_current_map_data_tables']))
          print('TOWER_ACTIVITY_TO_MAP_ROOTS_CLOSED',json.dumps({
              'activities':a.get('selected_activity_count'),
              'bubbles':a.get('reachable_bubble_count'),
              'containers':a.get('reachable_map_container_count'),
              'tables':len(actual),
              'entries':a.get('total_reachable_map_entries'),
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-activity-map-root-census
          path: reports/
          retention-days: 14
          compression-level: 6
