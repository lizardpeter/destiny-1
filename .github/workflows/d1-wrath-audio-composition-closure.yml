name: D1 Wrath activity composition audio closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-wrath-audio-composition-closure.yml'
      - 'tools/d1_remote_activity_audio_composition_closure.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  WRATH_SOURCE_ARTIFACT_ID: '10003468849'
  WRATH_SOURCE_ARTIFACT_ZIP_SHA256: '81c395d9be86c569b96e0de1e79f852f8f7d642aa33344fc7807d505feee0999'

jobs:
  close-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact catalog, retained Wrath closure, and Oodle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog input/wrath runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${WRATH_SOURCE_ARTIFACT_ID}/zip" -o input/wrath.zip
          echo "${WRATH_SOURCE_ARTIFACT_ZIP_SHA256}  input/wrath.zip" | sha256sum --check --strict
          unzip -q input/wrath.zip -d input/wrath
          test -f input/wrath/wrath/entity_dependency_closure.json

          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Source-close composition Wwise events and streams
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_activity_audio_composition_closure.py
          python tools/d1_remote_activity_audio_composition_closure.py \
            --entity-closure input/wrath/wrath/entity_dependency_closure.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime \
            -o out/wrath_activity_audio_composition_closure.json \
            | tee out/audio_closure.txt
          python - <<'PY'
          import json
          d=json.load(open('out/wrath_activity_audio_composition_closure.json'))
          assert d['status']=='D1_REMOTE_ACTIVITY_AUDIO_COMPOSITION_CLOSURE_COMPLETE',d['violations'][:20]
          assert d['violation_count']==0,d['violations'][:20]
          assert d['composition_resource_count']>0,d
          assert d['validated_composition_resource_count']==d['composition_resource_count'],d
          assert d['typed_event_edge_count']>0,d
          assert d['unique_typed_event_count']>0,d
          assert d['unique_typed_stream_count']>0,d
          assert d['aligned_event_sighting_count']>=d['aligned_sightings_promoted_by_exact_schema_count'],d
          assert d['aligned_event_sighting_class_pair_counts'].get('8080079A->80800610',0)>0,d
          for e in d['events'].values():
              assert e['meta']['reference']=='8080080A',e
              assert e['validation_ok'],e['violations']
              for s in e['streams']:
                  if s['is_null']: continue
                  assert (s['meta']['type'],s['meta']['subtype'])==(8,21),s
                  assert 'payload_sha256' in s,s
          print('WRATH_AUDIO_COMPOSITION_CLOSED',d['composition_resource_count'],d['typed_event_edge_count'],d['unique_typed_event_count'],d['unique_typed_stream_count'],d['unclosed_aligned_event_sighting_count'])
          print('PAIR_COUNTS',d['aligned_event_sighting_class_pair_counts'])
          PY
          sha256sum out/* > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-WRATH-ACTIVITY-AUDIO-COMPOSITION-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
