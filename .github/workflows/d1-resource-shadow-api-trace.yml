name: D1 Resource Shadow API Trace

on:
  push:
    paths:
      - '.github/workflows/d1-resource-shadow-api-trace.yml'
      - 'tools/d1_resource_shadow_api_trace.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EBOOT_URL: https://r2.houseofkublai.com/destiny/CUSA00219_01.33/eboot.bin
      EBOOT_SHA256: 672f03411c0503dfbcda804cbb9fb27cdd9a8d73a8bcb71bf0c4f688073b0833
      EBOOT_SIZE: '29249016'
      CODEGRAPH_ARTIFACT_ID: '10939012869'

    steps:
      - uses: actions/checkout@v4
      - name: Install Capstone
        run: python -m pip install --disable-pip-version-check -q capstone
      - name: Recover exact eboot and Ghidra graph
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/resource-shadow-api-trace
          curl --fail --location --retry 4 --retry-delay 2 "$EBOOT_URL"             -o build/resource-shadow-api-trace/eboot.bin
          test "$(stat -c %s build/resource-shadow-api-trace/eboot.bin)" = "$EBOOT_SIZE"
          echo "$EBOOT_SHA256  build/resource-shadow-api-trace/eboot.bin" | sha256sum --check --strict
          curl -fsSL --retry 4             -H "Authorization: Bearer $GH_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CODEGRAPH_ARTIFACT_ID}/zip"             -o build/resource-shadow-api-trace/codegraph.zip
          unzip -q build/resource-shadow-api-trace/codegraph.zip -d build/resource-shadow-api-trace/codegraph
          test -f build/resource-shadow-api-trace/codegraph/ghidra_code_graph.json.gz
      - name: Trace exact state setter API
        run: |
          python tools/d1_resource_shadow_api_trace.py             build/resource-shadow-api-trace/eboot.bin             --codegraph build/resource-shadow-api-trace/codegraph/ghidra_code_graph.json.gz             --out build/resource-shadow-api-trace/resource_shadow_api_trace.json
      - name: Remove executable
        if: always()
        run: rm -f build/resource-shadow-api-trace/eboot.bin build/resource-shadow-api-trace/codegraph.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-resource-shadow-api-trace
          path: build/resource-shadow-api-trace/resource_shadow_api_trace.json
          if-no-files-found: warn
          retention-days: 30
