name: D1 Tower common-layer model export

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-common-layer-model-export.yml'
      - 'tools/d1_entity_model_corpus_export.py'

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install exporter dependencies and Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy trimesh
          mkdir -p runtime recovered reports models
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover exact current Tower/dependency corpus
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py --package-list reports/packages.txt --out-dir recovered --report reports/current_corpus.json
      - name: Export all 69 binary-confirmed common-layer models with retail map-decal selection
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          models=(
            80CA0D0D 80CA0EFB 80CA0A55 80C98233 80C98234 80C98235 80C98236 80C98237 80C98238 80C98239
            80CA025E 8093E1A3 80C9823A 80C9823B 8093E1A4 8093E1A2 80C9823C 80C9823D 80C98587 80C98588
            80C98589 80C9858A 80CA0589 80C98A35 80CA058A 80CA058B 80C98D6C 8093E850 80C98D6D 80C98D6E
            80C98A36 80C98D6F 80C98D70 80C98D71 80C98D72 80C98D73 80C98D74 80CA0F39 80C99AF4 80C99AF5
            80C9939C 80C9939D 80C99AF7 80C99AF8 80C99567 80C99AFA 80C99AFB 80C9939E 80C99AFC 80C99AFD
            80C9939F 80C99AFE 80CA11FB 80C993A0 80C993A1 80C998A0 80CA05CE 80CA05CF 80CA05D0 80CA05D1
            80CA05D2 80CA05D3 80CA05D4 80CA0B95 80B9F669 80B9F663 80CA0B97 80B9F668 80CA0E39
          )
          margs=(); for h in "${models[@]}"; do margs+=(--model "$h"); done
          set +e
          python tools/d1_entity_model_corpus_export.py "${args[@]}" --runtime runtime "${margs[@]}" --mode map-decal --out-dir models --summary reports/common_layer_model_export.json | tee reports/common_layer_model_export_stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json
          d=json.load(open('reports/common_layer_model_export.json'))
          s={k:d[k] for k in ('status','requested_models','exported_models','failed_models','geometry_count','triangle_count')}
          s['failed_hashes']=[r['model'] for r in d['models'] if not r['ok']]
          s['zero_geometry_models']=[r['model'] for r in d['models'] if r.get('ok') and r.get('geometry_count',0)==0]
          open('reports/common_layer_model_export_summary.json','w').write(json.dumps(s,indent=2)+'\n')
          print(json.dumps(s,indent=2))
          if d['exported_models'] < 50:
              raise SystemExit('cross-package exporter regressed: fewer than 50/69 models exported')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-common-layer-model-export
          path: |
            reports/
            models/
          retention-days: 14
          compression-level: 6
