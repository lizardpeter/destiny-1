name: D1 Tower common-layer model export

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-common-layer-model-export.yml'
      - 'tools/d1_entity_model_corpus_export.py'
      - 'tools/d1_tower_recover_activity_root_corpus.py'
      - 'tools/d1_world_activity_map_root_census.py'
      - 'tools/d1_world_map_root_census.py'
      - 'tools/d1_world_map_data_layer_census.py'
      - 'tools/d1_world_static_map_resource_chain_census.py'
      - 'tools/d1_world_static_map_target_plan.py'
      - 'tools/d1_world_static_map_decal_validate.py'
      - 'tools/d1_world_table_scoped_decal_census.py'
      - 'tools/d1_world_common_model_plan.py'

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install exporter dependencies and Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy trimesh
          mkdir -p runtime recovered root_corpus reports models validation/source_driven
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover geometry dependencies and isolated Activity root corpus
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt

          # Large downstream dependency corpus: geometry/material/model resolution.
          python tools/d1_tower_recover_current_corpus.py \
            --package-list reports/packages.txt --out-dir recovered --report reports/current_corpus.json
          python tools/d1_recover_member_catalog.py --catalog evidence/d1_tower_texture_dependency_member_catalog.json \
            --package-list reports/packages.txt --family 0154 --family 0155 --family 0156 \
            --out-dir recovered --report reports/common_model_global_recovery.json

          # Small upstream ownership corpus: add only the SHA-pinned 023D/0244 Activity
          # roots, then hard-link the already recovered pinned 024C/0250 destination
          # generations. Root discovery therefore cannot be polluted by unrelated
          # geometry/material dependency packages.
          python tools/d1_tower_recover_activity_root_corpus.py \
            --package-list reports/packages.txt --out-dir root_corpus \
            --report reports/activity_root_recovery.json
          for f in recovered/ps4_city_tower_destination_024c_*.pkg recovered/ps4_city_tower_destination_0250_*.pkg; do
            test -f "$f"
            ln "$f" root_corpus/"$(basename "$f")"
          done
          test "$(find root_corpus -maxdepth 1 -name '*.pkg' -type f | wc -l)" -eq 24

      - name: Discover Activity-owned map roots
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t root_files < <(find root_corpus -maxdepth 1 -name '*.pkg' -type f | sort)
          root_args=(); for f in "${root_files[@]}"; do root_args+=(--snapshot "$f"); done
          python tools/d1_world_activity_map_root_census.py "${root_args[@]}" --runtime runtime \
            --out reports/common_layer_activity_map_roots.json \
            | tee reports/common_layer_activity_map_roots_stdout.txt

          python - <<'PY'
          import json
          r=json.load(open('reports/common_layer_activity_map_roots.json'))
          expected_tables=sorted([
            '80C98028','80C984A0','80C9895C','80C989F7','80C997DF',
            '80C99956','80CA0B0E','80CA0B11','80CA0C4E',
          ])
          actual=sorted(r.get('map_data_tables',[]))
          if r.get('status')!='D1_WORLD_ACTIVITY_MAP_ROOT_CENSUS_COMPLETE':
              raise SystemExit('Tower Activity map-root census not complete: '+json.dumps(r.get('violations')))
          if actual!=expected_tables:
              raise SystemExit('Tower Activity-owned map-table set changed: '+json.dumps({'expected':expected_tables,'actual':actual},indent=2))
          if r.get('total_reachable_map_entries')!=337:
              raise SystemExit(f'unexpected Activity-owned Tower map-entry total {r.get("total_reachable_map_entries")}')
          if r.get('unowned_current_map_data_tables'):
              raise SystemExit('current Tower tables outside Activity ownership: '+json.dumps(r['unowned_current_map_data_tables']))
          print('ACTIVITY_OWNED_MAP_ROOTS_CLOSED',json.dumps({
              'activities':r.get('selected_activity_count'),
              'bubbles':r.get('reachable_bubble_count'),
              'containers':r.get('reachable_map_container_count'),
              'tables':len(actual),
              'entries':r.get('total_reachable_map_entries'),
          },sort_keys=True))
          PY

      - name: Derive common-layer records and model set from ownership manifest
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done

          python tools/d1_world_static_map_resource_chain_census.py "${args[@]}" --runtime runtime \
            --map-root-json reports/common_layer_activity_map_roots.json \
            --out reports/common_layer_resource_chain.json \
            | tee reports/common_layer_resource_chain_stdout.txt

          python tools/d1_world_static_map_target_plan.py \
            --chain-json reports/common_layer_resource_chain.json \
            --out reports/common_layer_target_plan.json \
            --tsv reports/common_layer_target_plan.tsv \
            | tee reports/common_layer_target_plan_stdout.txt

          python tools/d1_world_table_scoped_decal_census.py "${args[@]}" --runtime runtime \
            --target-plan reports/common_layer_target_plan.json \
            --out reports/common_layer_source_census.json \
            --validation-dir validation/source_driven \
            | tee reports/common_layer_source_census_stdout.txt

          python tools/d1_world_common_model_plan.py \
            --census reports/common_layer_source_census.json \
            --out reports/common_layer_model_plan.json \
            --model-list reports/common_layer_models.txt \
            | tee reports/common_layer_model_plan_stdout.txt

          python - <<'PY'
          import json
          chain=json.load(open('reports/common_layer_resource_chain.json'))
          c=json.load(open('reports/common_layer_source_census.json'))
          p=json.load(open('reports/common_layer_model_plan.json'))
          if (chain.get('root_source') or {}).get('mode')!='ownership_root_manifest':
              raise SystemExit('resource-chain census did not consume ownership manifest')
          expected_census={
            'status':'D1_WORLD_TABLE_SCOPED_DECAL_CENSUS_COMPLETE',
            'table_scoped_target_count':9,
            'table_scoped_decal_records':327,
            'table_scoped_materialized_record_count':327,
            'table_scoped_export_ready_singleton_records':327,
            'table_scoped_unique_entity_models':69,
          }
          bad={k:{'expected':v,'actual':c.get(k)} for k,v in expected_census.items() if c.get(k)!=v}
          if bad: raise SystemExit('Tower source-driven common census mismatch: '+json.dumps(bad,indent=2))
          expected_plan={
            'status':'D1_WORLD_COMMON_MODEL_PLAN_COMPLETE',
            'source_record_count':327,
            'resolved_model_reference_records':327,
            'unique_model_count':69,
          }
          bad={k:{'expected':v,'actual':p.get(k)} for k,v in expected_plan.items() if p.get(k)!=v}
          if bad: raise SystemExit('Tower common-model plan mismatch: '+json.dumps(bad,indent=2))
          print('DISCOVERED_COMMON_MODELS',p['unique_model_count'],p['models'])
          PY
      - name: Export discovered common-layer models with retail map-decal selection
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          mapfile -t models < reports/common_layer_models.txt
          test "${#models[@]}" -eq 69
          margs=(); for h in "${models[@]}"; do margs+=(--model "$h"); done
          set +e
          python tools/d1_entity_model_corpus_export.py "${args[@]}" --runtime runtime "${margs[@]}" --mode map-decal --out-dir models --summary reports/common_layer_model_export.json | tee reports/common_layer_model_export_stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json,collections
          d=json.load(open('reports/common_layer_model_export.json'))
          reasons=collections.Counter(); unavailable=[]
          for r in d['models']:
              for m in r.get('meshes',[]):
                  for p in m.get('parts',[]):
                      for reason in p.get('rejection_reasons',[]): reasons[reason]+=1
                      if 'material_unavailable' in p.get('rejection_reasons',[]):
                          unavailable.append({'model':r['model'],'mesh':m['mesh_index'],'part':p['part_index'],'lod':p['lod'],'material':p['material']})
          s={k:d[k] for k in ('status','requested_models','exported_models','failed_models','geometry_count','triangle_count')}
          s['failed_hashes']=[r['model'] for r in d['models'] if not r['ok']]
          s['zero_geometry_models']=[r['model'] for r in d['models'] if r.get('ok') and r.get('geometry_count',0)==0]
          s['rejection_reason_histogram']=dict(reasons);s['unavailable_material_parts']=unavailable
          open('reports/common_layer_model_export_summary.json','w').write(json.dumps(s,indent=2)+'\n')
          print(json.dumps(s,indent=2))
          if d['requested_models'] != 69:
              raise SystemExit(f'unexpected requested model count {d["requested_models"]}')
          if d['failed_models'] != 0 or d['exported_models'] != 69:
              raise SystemExit('common-layer model dependency closure incomplete: '+json.dumps(s))
          if unavailable:
              raise SystemExit('common-layer material dependency closure incomplete: '+json.dumps(unavailable))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-common-layer-model-export
          path: |
            reports/
            models/
            validation/source_driven/
          retention-days: 14
          compression-level: 6
