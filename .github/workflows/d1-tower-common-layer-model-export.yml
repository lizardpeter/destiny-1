name: D1 Tower common-layer model export

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-common-layer-model-export.yml'
      - 'tools/d1_world_table_scoped_decal_census.py'
      - 'tools/d1_world_common_model_plan.py'
      - 'tools/d1_entity_model_corpus_export.py'
      - 'tools/d1_github_actions_artifact_pull.py'
  workflow_run:
    workflows: ["D1 Tower activity map-root census"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  export:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install exporter dependencies and Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy trimesh
          mkdir -p runtime recovered root_evidence reports models validation/source_driven
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Recover proven Activity-root ownership artifact
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_run ]; then
            root_run='${{ github.event.workflow_run.id }}'
          else
            root_run="$(gh run list --workflow d1-tower-activity-map-root-census.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$root_run"
          echo "ACTIVITY_ROOT_RUN=$root_run"
          python tools/d1_github_actions_artifact_pull.py \
            --repo "$GITHUB_REPOSITORY" --run-id "$root_run" \
            --artifact-name d1-tower-activity-map-root-census \
            --out-dir root_evidence --clean \
            --report reports/ARTIFACT_PULL_ACTIVITY_ROOT.json
          root_json="$(find root_evidence -type f -name tower_activity_map_root_census.json -print -quit)"
          manifest_plan="$(find root_evidence -type f -name tower_activity_manifest_dependency_plan.json -print -quit)"
          test -n "$root_json" -a -f "$root_json"
          test -n "$manifest_plan" -a -f "$manifest_plan"
          cp "$root_json" reports/tower_activity_map_roots_full.json
          cp "$manifest_plan" reports/common_layer_activity_manifest_dependency_plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.load(open('reports/tower_activity_map_roots_full.json'))
          m=json.load(open('reports/common_layer_activity_manifest_dependency_plan.json'))
          expected=[
            '80C98028','80C984A0','80C9895C','80C989F7','80C997DF',
            '80C99956','80CA0B0E','80CA0B11','80CA0C4E',
          ]
          if r.get('status')!='D1_WORLD_ACTIVITY_MAP_ROOT_CENSUS_COMPLETE':
              raise SystemExit('upstream Activity-root artifact not complete')
          if r.get('selected_activities')!=['80C98019']:
              raise SystemExit('upstream Tower Activity identity changed: '+json.dumps(r.get('selected_activities')))
          available=set(r.get('map_data_tables') or [])
          missing=[h for h in expected if h not in available]
          if missing:
              raise SystemExit('proven common-layer table(s) disappeared from full Activity ownership: '+json.dumps(missing))
          counts=r.get('map_data_table_entry_counts') or {}
          scoped_counts={h:int(counts.get(h,-1)) for h in expected}
          if any(v<0 for v in scoped_counts.values()) or sum(scoped_counts.values())!=337:
              raise SystemExit('common-layer 9-table entry fixture changed: '+json.dumps(scoped_counts,sort_keys=True))
          owners=r.get('table_activity_owners') or {}
          scoped_owners={h:owners.get(h) for h in expected}
          bad_owners={h:v for h,v in scoped_owners.items() if v!=['80C98019']}
          if bad_owners:
              raise SystemExit('common-layer table ownership changed: '+json.dumps(bad_owners,sort_keys=True))
          if m.get('status')!='D1_WORLD_ACTIVITY_MANIFEST_DEPENDENCY_PLAN_COMPLETE' or m.get('manifest_package_ids')!=['0430','0431']:
              raise SystemExit('upstream Activity manifest dependencies changed: '+json.dumps(m,indent=2))

          scoped={
            'schema_version':1,
            'status':'D1_TOWER_COMMON_LAYER_ACTIVITY_ROOT_SCOPE_EXACT',
            'selection_mode':'source_closed_common_layer_9_table_subset_of_full_tower_activity',
            'selected_activities':['80C98019'],
            'map_data_tables':expected,
            'map_data_table_entry_counts':scoped_counts,
            'total_reachable_map_entries':sum(scoped_counts.values()),
            'table_activity_owners':scoped_owners,
            'source_full_activity_status':r['status'],
            'source_full_activity_map_data_table_count':len(r.get('map_data_tables') or []),
            'source_full_activity_total_reachable_map_entries':r.get('total_reachable_map_entries'),
            'bubble_definitions':[],
            'map_containers':[],
            'policy':'The full current Tower Activity ownership census is preserved separately. This document narrows it to the nine historically proven common/decal carrier tables only; every selected table remains singly owned by Activity 80C98019. No claim is made that the Tower itself has only nine map-data tables.'
          }
          Path('reports/common_layer_activity_map_roots.json').write_text(json.dumps(scoped,indent=2)+'\n')
          print('CONSUMING_SCOPED_COMMON_ACTIVITY_ROOTS',json.dumps({
              'activity':'80C98019','manifest_packages':m['manifest_package_ids'],
              'full_tables':len(r.get('map_data_tables') or []),
              'full_entries':r.get('total_reachable_map_entries'),
              'scoped_tables':len(expected),'scoped_entries':337},sort_keys=True))
          PY

      - name: Recover common geometry and material dependency corpus
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py \
            --package-list reports/packages.txt --out-dir recovered --report reports/current_corpus.json
          python tools/d1_recover_member_catalog.py --catalog evidence/d1_tower_texture_dependency_member_catalog.json \
            --package-list reports/packages.txt --family 0154 --family 0155 --family 0156 \
            --out-dir recovered --report reports/common_model_global_recovery.json

      - name: Derive common-layer records and model set from ownership manifest
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done

          python tools/d1_world_static_map_resource_chain_census.py "${args[@]}" --runtime runtime \
            --map-root-json reports/common_layer_activity_map_roots.json \
            --out reports/common_layer_resource_chain.json \
            | tee reports/common_layer_resource_chain_stdout.txt

          python tools/d1_world_static_map_target_plan.py \
            --chain-json reports/common_layer_resource_chain.json \
            --out reports/common_layer_target_plan.json \
            --tsv reports/common_layer_target_plan.tsv \
            | tee reports/common_layer_target_plan_stdout.txt

          python tools/d1_world_table_scoped_decal_census.py "${args[@]}" --runtime runtime \
            --target-plan reports/common_layer_target_plan.json \
            --out reports/common_layer_source_census.json \
            --validation-dir validation/source_driven \
            | tee reports/common_layer_source_census_stdout.txt

          python tools/d1_world_common_model_plan.py \
            --census reports/common_layer_source_census.json \
            --out reports/common_layer_model_plan.json \
            --model-list reports/common_layer_models.txt \
            | tee reports/common_layer_model_plan_stdout.txt

          python - <<'PY'
          import json
          chain=json.load(open('reports/common_layer_resource_chain.json'))
          c=json.load(open('reports/common_layer_source_census.json'))
          p=json.load(open('reports/common_layer_model_plan.json'))
          if (chain.get('root_source') or {}).get('mode')!='ownership_root_manifest':
              raise SystemExit('resource-chain census did not consume ownership manifest')
          expected_census={
            'status':'D1_WORLD_TABLE_SCOPED_DECAL_CENSUS_COMPLETE',
            'table_scoped_target_count':9,'table_scoped_decal_records':327,
            'table_scoped_materialized_record_count':327,
            'table_scoped_export_ready_singleton_records':327,
            'table_scoped_unique_entity_models':69,
          }
          bad={k:{'expected':v,'actual':c.get(k)} for k,v in expected_census.items() if c.get(k)!=v}
          if bad: raise SystemExit('Tower source-driven common census mismatch: '+json.dumps(bad,indent=2))
          expected_plan={
            'status':'D1_WORLD_COMMON_MODEL_PLAN_COMPLETE','source_record_count':327,
            'resolved_model_reference_records':327,'unique_model_count':69,
          }
          bad={k:{'expected':v,'actual':p.get(k)} for k,v in expected_plan.items() if p.get(k)!=v}
          if bad: raise SystemExit('Tower common-model plan mismatch: '+json.dumps(bad,indent=2))
          print('DISCOVERED_COMMON_MODELS',p['unique_model_count'],p['models'])
          PY

      - name: Export discovered common-layer models with retail map-decal selection
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          mapfile -t models < reports/common_layer_models.txt
          test "${#models[@]}" -eq 69
          margs=(); for h in "${models[@]}"; do margs+=(--model "$h"); done
          set +e
          python tools/d1_entity_model_corpus_export.py "${args[@]}" --runtime runtime "${margs[@]}" --mode map-decal --out-dir models --summary reports/common_layer_model_export.json | tee reports/common_layer_model_export_stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json,collections
          d=json.load(open('reports/common_layer_model_export.json'))
          reasons=collections.Counter(); unavailable=[]
          for r in d['models']:
              for m in r.get('meshes',[]):
                  for p in m.get('parts',[]):
                      for reason in p.get('rejection_reasons',[]): reasons[reason]+=1
                      if 'material_unavailable' in p.get('rejection_reasons',[]):
                          unavailable.append({'model':r['model'],'mesh':m['mesh_index'],'part':p['part_index'],'lod':p['lod'],'material':p['material']})
          s={k:d[k] for k in ('status','requested_models','exported_models','failed_models','geometry_count','triangle_count')}
          s['failed_hashes']=[r['model'] for r in d['models'] if not r['ok']]
          s['zero_geometry_models']=[r['model'] for r in d['models'] if r.get('ok') and r.get('geometry_count',0)==0]
          s['rejection_reason_histogram']=dict(reasons);s['unavailable_material_parts']=unavailable
          open('reports/common_layer_model_export_summary.json','w').write(json.dumps(s,indent=2)+'\n')
          print(json.dumps(s,indent=2))
          if d['requested_models'] != 69:
              raise SystemExit(f'unexpected requested model count {d["requested_models"]}')
          if d['failed_models'] != 0 or d['exported_models'] != 69:
              raise SystemExit('common-layer model dependency closure incomplete: '+json.dumps(s))
          if unavailable:
              raise SystemExit('common-layer material dependency closure incomplete: '+json.dumps(unavailable))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-common-layer-model-export
          path: |
            reports/
            models/
            validation/source_driven/
          retention-days: 90
          compression-level: 6
