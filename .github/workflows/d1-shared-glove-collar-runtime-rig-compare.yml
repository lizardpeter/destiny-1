name: D1 shared glove-collar runtime-rig comparison

on:
  push:
    paths:
      - '.github/workflows/d1-shared-glove-collar-runtime-rig-compare.yml'
      - 'tools/d1_remote_runtime_rig_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install dependencies and pin D1 animation parser
        run: |
          set -euo pipefail
          python -m pip install -q numpy trimesh scipy pyglm
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
          test "$(git -C parser rev-parse HEAD)" = b9fdc3a43dd28118113275624fcc9054b75855f4
      - name: Recover verified Oodle and 00EC family
        run: |
          set -euo pipefail
          mkdir -p runtime recovered out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --start-offset 0xAAB580800 \
            --target ps4_race_set_all_00ec_0.pkg --target ps4_race_set_all_00ec_1.pkg \
            --target ps4_race_set_all_00ec_2.pkg --target ps4_race_set_all_00ec_3.pkg \
            --target ps4_race_set_all_00ec_4.pkg --target ps4_race_set_all_00ec_5.pkg \
            --out recovered --manifest out/00ec_extract.json --retries 6 --timeout 90
      - name: Decode exact shared glove-collar rig 80A7F90B
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_runtime_rig_probe.py \
            --rig-resource 80A7F90B \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --parser-root parser -o out/80A7F90B_runtime_rig.json
      - name: Decode prior 67-node rig and compare dimensions
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import io,json,sys
          from pathlib import Path
          sys.path.insert(0,'tools');sys.path.insert(0,'parser')
          from d1_entry_extract import EntryReader
          from tag.game_version import Game_Version
          from tag_readers.read_rig import read_runtime_rig
          r=EntryReader(Path('recovered/ps4_race_set_all_00ec_5.pkg'),Path('runtime'))
          by={e['tag_hash'].upper():e for e in r.entries};h='809D856E';e=by[h]
          rig=read_runtime_rig(io.BytesIO(r.entry(e['index'])),Game_Version.D1_ROI)
          def seq(x):
              try:return list(x)
              except:return []
          old={
            'tag_hash':h,'control_count':len(seq(rig.controls_relations)),
            'bone_to_control':[int(x) for x in seq(rig.bone_to_control)],
            'control_to_bone':[int(x) for x in seq(rig.control_to_bone)],
            'components':[{'hash':f'{int(x.hash)&0xffffffff:08X}','count':int(x.count)} for x in seq(rig.rig_components)],
          }
          new=json.load(open('out/80A7F90B_runtime_rig.json'))
          nf=new['decoded_fields']
          out={
            'schema':'d1_runtime_rig_dimension_compare/v1','old':old,
            'new':{'tag_hash':new['rig_resource_tag_hash'],'control_count':new['control_count'],
                   'bone_to_control':nf.get('bone_to_control',[]),'control_to_bone':nf.get('control_to_bone',[]),
                   'components':new['runtime_rig_components']},
            'control_count_equal':old['control_count']==new['control_count'],
            'component_fingerprint_equal':old['components']==new['runtime_rig_components'],
            'bone_to_control_exact':old['bone_to_control']==nf.get('bone_to_control',[]),
            'control_to_bone_exact':old['control_to_bone']==nf.get('control_to_bone',[]),
          }
          json.dump(out,open('out/809D856E_vs_80A7F90B.json','w'),indent=2);open('out/809D856E_vs_80A7F90B.json','a').write('\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-shared-glove-collar-runtime-rig-compare
          path: out/
          retention-days: 14
          if-no-files-found: error
