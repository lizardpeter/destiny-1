name: D1 shared glove-collar 80A6A345 exact owner trace

on:
  push:
    paths:
      - '.github/workflows/d1-spektr-shared-glove-collar-80a6a345-owner.yml'
      - 'tools/d1_remote_model_owner_trace.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover verified Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Trace exact 0135 EntityResource and s_entity ownership
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_model_owner_trace.py \
            --model 80A6A345 \
            --scan-package-id 0x0135 \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --member-catalog evidence/d1_globals_pvp_0169_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' \
            --part-count 10 --runtime runtime \
            -o out/80A6A345_owner_0135.json

      - name: Lock exact model target
        run: |
          python - <<'PY'
          import json
          d=json.load(open('out/80A6A345_owner_0135.json'))
          assert d['schema']=='d1_remote_model_owner_trace/v1'
          assert d['model_tag_hash']=='80A6A345'
          assert d['scan_package_ids']==['0135']
          assert d['resource_error_count']==0,d['resource_errors'][:3]
          assert d['entity_error_count']==0,d['entity_errors'][:3]
          print('MODEL OWNER RESOURCES',d['model_owner_resource_count'])
          for x in d['model_owner_resources']: print('RESOURCE',x)
          print('S_ENTITY OWNERS',d['s_entity_owner_count'])
          for x in d['s_entity_owners']: print('ENTITY',x['entity_hash'],'matches',x['matching_resources'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: d1-shared-glove-collar-80A6A345-owner-0135
          path: out/
          retention-days: 14
          if-no-files-found: error
