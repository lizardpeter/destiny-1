name: D1 lowercase crota semantic resource closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-lowercase-semantic-resource-closure.yml'

permissions:
  contents: read
  actions: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    env:
      UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
      UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
      UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Probe all five exact literal-hit source tags
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_exact_tag_probe.py \
            --tag-hash 0x80AA9C0D --tag-hash 0x80AADD3E --tag-hash 0x80AB026E \
            --tag-hash 0x80B1A004 --tag-hash 0x8166A3E8 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --min-string 4 -o out/CROTA_LOWERCASE_LITERAL_SOURCES.json | tee out/exact_tag_stdout.txt

      - name: Decode the four exact EntityResource sources
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_catalog_entity_resource_probe.py \
            --tag-hash 0x80AA9C0D --tag-hash 0x80AADD3E --tag-hash 0x80AB026E --tag-hash 0x8166A3E8 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_LOWERCASE_ENTITY_RESOURCES.json | tee out/entity_resource_stdout.txt

      - name: Trace exact owners of all five source tags
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_catalog_backlinks.py \
            --scan-package-id 0x0151 --scan-package-id 0x0154 --scan-package-id 0x0155 --scan-package-id 0x0156 \
            --scan-package-id 0x0157 --scan-package-id 0x0158 --scan-package-id 0x0169 --scan-package-id 0x018D \
            --scan-package-id 0x01E3 --scan-package-id 0x072B --scan-package-id 0x072F --scan-package-id 0x0735 \
            --target 0x80AA9C0D --target 0x80AADD3E --target 0x80AB026E --target 0x80B1A004 --target 0x8166A3E8 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --max-entry-size 8000000 -o out/CROTA_LOWERCASE_SOURCE_BACKLINKS.json | tee out/backlinks_stdout.txt

      - name: Summarize exact semantics without promoting untyped hashes
        run: |
          set -euo pipefail
          python - <<'PY' | tee out/summary.txt
          import json
          t=json.load(open('out/CROTA_LOWERCASE_LITERAL_SOURCES.json'))
          e=json.load(open('out/CROTA_LOWERCASE_ENTITY_RESOURCES.json'))
          b=json.load(open('out/CROTA_LOWERCASE_SOURCE_BACKLINKS.json'))
          assert t['violation_count']==0,t['violations']
          assert not e['violations'],e['violations']
          assert b['error_count']==0,b['errors']
          exact_expected={
            '80AA9C0D':('80800861',[788,3884]),
            '80AADD3E':('80800861',[6916]),
            '80AB026E':('80800861',[6916]),
            '80B1A004':('80802257',[2172]),
            '8166A3E8':('80800861',[3620]),
          }
          # Confirm the original exact aligned ACC65F88 observations still exist in raw tag payloads.
          for row in t['entries']:
              h=row['tag_hash']; ref=row['entry']['reference']; expected_ref,offs=exact_expected[h]
              assert ref==expected_ref,(h,ref,expected_ref)
              got=[m['offset'] for m in row['aligned_resolved_tags'] if m['tag_hash']=='ACC65F88']
              # ACC65F88 is a StringHash-like scalar and usually does not resolve as FileHash, so exact-tag probe may not list it.
              print('SOURCE',h,'REF',ref,'SIZE',row['payload_size'],'PRINTABLE_STRINGS',[(x['offset'],x['string']) for x in row['printable_strings']])
              print(' FILEHASH_RESOLUTIONS',[(m['offset'],m['tag_hash'],m['entry']['reference']) for m in row['aligned_resolved_tags']])
              print(' KNOWN_ACC65F88_OFFSETS_FROM_SEMANTIC_SCAN',offs)
          for row in e['entries']:
              er=row.get('entity_resource') or {}
              print('ENTITY_RESOURCE',row['tag_hash'],'ROLE',er.get('semantic_role'),
                    'UNK10',(er.get('unk10') or {}).get('class_hash'),
                    'UNK18',(er.get('unk18') or {}).get('class_hash'))
              print(' RESOLVED_TAGS',[(m['offset_hex'],m['tag_hash'],m['reference'],m['size']) for m in row.get('aligned_resolved_tag_matches',[])])
          print('BACKLINK_HIT_SOURCES',b['hit_source_count'],'BY_REFERENCE',b['hit_sources_by_reference'],'BY_TARGET',b['occurrences_by_target'])
          for row in b['hits']:
              print(' OWNER',row['package_id'],row['source_tag_hash'],row['reference'],row['targets'])
          print('POLICY ACC65F88 is exact lowercase crota FNV1 evidence only. No source field is semantically typed by this workflow unless the shared EntityResource parser already recognizes the enclosing resource role.')
          PY
          sha256sum out/* > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-CROTA-LOWERCASE-SEMANTIC-RESOURCE-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
