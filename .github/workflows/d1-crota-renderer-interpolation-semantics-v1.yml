name: D1 Crota renderer interpolation semantics 808EE505 v1

on:
  workflow_dispatch:
  push:
    branches:
      - d1-crota-source-semantics-v1
    paths:
      - '.github/workflows/d1-crota-renderer-interpolation-semantics-v1.yml'
      - 'tools/d1_gcn_renderer_program_add_interpolation_semantics.py'

env:
  RENDERER_ARTIFACT_ID: '10080623187'
  RENDERER_ARTIFACT_ZIP_SHA256: '6aad7bd77bd502743c2d2e595eb7885454593b62f57b2317618070138b658db7'

permissions:
  contents: read
  actions: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover immutable green renderer checkpoint
        run: |
          set -euo pipefail
          mkdir -p input out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RENDERER_ARTIFACT_ID}/zip" -o input/renderer.zip
          echo "${RENDERER_ARTIFACT_ZIP_SHA256}  input/renderer.zip" | sha256sum --check --strict
          unzip -q input/renderer.zip -d input/renderer
          test -f input/renderer/D1_80D777B6_808EE505_RENDERER_PROGRAM.json
          test -f input/renderer/PS_808EE505_STRUCTURAL_IR_V3.json

      - name: Verify exact pre-promotion boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('input/renderer/D1_80D777B6_808EE505_RENDERER_PROGRAM.json'))
          ir=json.load(open('input/renderer/PS_808EE505_STRUCTURAL_IR_V3.json'))
          assert d['status']=='D1_GCN_RENDERER_PROGRAM_IR_EXACT_PARTIAL' and not d['violations'],d
          p=d['program']; c=p['coverage']
          assert c['primary_resolution_counts']=={
            'CONTROL_EXACT':18,'EXPRESSION_EXACT':161,'INPUT_PROVENANCE_EXACT':30,
            'RECURRENCE_EXACT':36,'STRUCTURAL_ONLY':211},c
          assert c['exact_nonstructural_instruction_count']==245
          assert ir['status']=='D1_GCN_STRUCTURAL_IR_COMPLETE' and ir['shader']=='808EE505' and ir['instruction_count']==456
          structural=[x['instruction'] for x in p['instruction_resolution'] if x['primary_resolution']=='STRUCTURAL_ONLY' and x['opcode'].startswith('v_interp_')]
          assert len(structural)==40,structural
          assert [x['instruction'] for x in p['instruction_resolution'] if x['opcode'].startswith('v_interp_') and x['primary_resolution']=='EXPRESSION_EXACT']==[443,446]
          print('GREEN_INTERPOLATION_INPUT_BOUNDARY',len(structural))
          PY

      - name: Promote source-proven interpolation pairs
        run: |
          set -euo pipefail
          python tools/d1_gcn_renderer_program_add_interpolation_semantics.py \
            --program input/renderer/D1_80D777B6_808EE505_RENDERER_PROGRAM.json \
            --ir input/renderer/PS_808EE505_STRUCTURAL_IR_V3.json \
            -o out/D1_80D777B6_808EE505_RENDERER_PROGRAM.json
          python - <<'PY'
          import json
          d=json.load(open('out/D1_80D777B6_808EE505_RENDERER_PROGRAM.json'))
          assert d['status']=='D1_GCN_RENDERER_PROGRAM_IR_EXACT_PARTIAL' and not d['violations'],d
          p=d['program']; c=p['coverage']
          expected={'CONTROL_EXACT':18,'EXPRESSION_EXACT':161,'INPUT_PROVENANCE_EXACT':70,'RECURRENCE_EXACT':36,'STRUCTURAL_ONLY':171}
          assert c['primary_resolution_counts']==expected,(c['primary_resolution_counts'],expected)
          assert c['exact_nonstructural_instruction_count']==285
          assert c['interpolation_semantics_promoted_instruction_count']==40
          assert c['interpolation_semantics_corroborated_existing_instructions']==[443,446]
          assert len(p['interpolation_bindings'])==21
          assert all(x['primary_resolution']!='STRUCTURAL_ONLY' for x in p['instruction_resolution'] if x['opcode'].startswith('v_interp_'))
          assert d['semantic_boundary']['pixel_interpolation']=='EXACT_SYMBOLIC_GCN_P1_P2_FOR_ALL_21_PAIRS'
          assert d['semantic_boundary']['raster_interpolation_coefficient_live_values']=='RUNTIME_INPUT_NOT_NUMERICALLY_CAPTURED'
          print('CROTA_INTERPOLATION_SEMANTICS_CLOSED',expected,'exact_nonstructural',c['exact_nonstructural_instruction_count'])
          PY
          cp input/renderer/PS_808EE505_STRUCTURAL_IR_V3.json out/
          cp input/renderer/PS_808EE505_DESCRIPTOR_LIVE_PROVENANCE.json out/
          cp input/renderer/GFX7_DESCRIPTOR_SEMANTICS.json out/
          sha256sum out/*.json > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-CROTA-808EE505-RENDERER-INTERPOLATION-SEMANTICS-V1
          path: out/
          retention-days: 30
          if-no-files-found: error
