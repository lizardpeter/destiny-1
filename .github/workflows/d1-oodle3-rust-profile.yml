name: D1 Oodle3 Rust hot-path profile
# model-shape rerun fixed-symbol

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-oodle3-rust-profile.yml'
      - 'rust/d1_oodle3/**'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable

      - name: Recover exact Tower benchmark package
        run: |
          set -euo pipefail
          mkdir -p recovered profile out
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar
          name='ps4_city_tower_destination_024c_5.pkg'
          off=7715401728
          size=1687552
          expected='b404bacccf44a4bf6859bf3b867ae02f5dc840432bdaa081c341439c2ae83311'
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=5,timeout=90)
          got=arc.copy_to(off,size,Path('recovered')/name)
          if got.lower()!=expected:
              raise SystemExit(f'package SHA mismatch: {got}')
          PY

      - name: Extract eight benchmark compressed blocks
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_pkg_probe import parse_header,parse_blocks,read_table

          pkg=Path('recovered/ps4_city_tower_destination_024c_5.pkg')
          with pkg.open('rb') as f:
              h=parse_header(f)
              bt=read_table(f,h['block_table_offset'],h['block_table_count'],32)
          chosen=[]
          for b in parse_blocks(bt):
              if not b['compressed'] or int(b['patch_id'])!=5:
                  continue
              with pkg.open('rb') as f:
                  f.seek(int(b['offset']))
                  comp=f.read(int(b['size']))
              got=hashlib.sha1(comp).hexdigest()
              if got.lower()!=str(b['sha1']).lower():
                  raise SystemExit(f"block {b['index']} SHA mismatch")
              path=Path('profile')/f"block_{int(b['index'])}.comp"
              path.write_bytes(comp)
              chosen.append(path)
              if len(chosen)==8:
                  break
          if len(chosen)!=8:
              raise SystemExit(f'expected 8 blocks, got {len(chosen)}')
          Path('out/profile_inputs.txt').write_text('\n'.join(map(str,chosen))+'\n')
          print('PROFILE_BLOCKS',*[p.name for p in chosen])
          PY

      - name: Run instrumented native decoder
        working-directory: rust/d1_oodle3
        run: |
          set -euo pipefail
          mapfile -t files < ../../out/profile_inputs.txt
          args=()
          for f in "${files[@]}"; do args+=("../../$f"); done
          cargo run --release --features profile --bin profile_decode -- 262144 "${args[@]}" | tee ../../out/hot_profile.txt

      - uses: actions/upload-artifact@v4
        with:
          name: d1-oodle23-rust-hot-profile
          path: out/
          retention-days: 30
