name: Temporary diagnose weapon 011c geometry

on:
  push:
    paths:
      - '.github/workflows/tmp-weapon-011c-final-snapshot-census.yml'
      - 'tools/d1_weapon_geometry_diagnostic.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover runtime and exact 011c family
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' \
            --part-count 10 --start-offset 0x43779C800 \
            --target ps4_gear_weapons_011c_0.pkg \
            --target ps4_gear_weapons_011c_1.pkg \
            --target ps4_gear_weapons_011c_2.pkg \
            --target ps4_gear_weapons_011c_3.pkg \
            --target ps4_gear_weapons_011c_5.pkg \
            --out recovered --manifest reports/011c_extract.json

      - name: Diagnose target entity and model in patch 0 and patch 5 snapshots
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_weapon_geometry_diagnostic.py \
            recovered/ps4_gear_weapons_011c_0.pkg --runtime runtime \
            -o reports/weapon_geometry_patch0.json
          python tools/d1_weapon_geometry_diagnostic.py \
            recovered/ps4_gear_weapons_011c_5.pkg --runtime runtime \
            -o reports/weapon_geometry_patch5.json
          python tools/d1_entity_resource_probe.py \
            recovered/ps4_gear_weapons_011c_5.pkg --runtime runtime \
            -o reports/entity_resources_patch5.json
          python tools/d1_entity_model_probe.py \
            recovered/ps4_gear_weapons_011c_5.pkg --runtime runtime \
            --tag-hash 80A39E12 -o reports/model_80A39E12_patch5.json

      - name: Summarize geometry evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p0=json.load(open('reports/weapon_geometry_patch0.json'))
          p5=json.load(open('reports/weapon_geometry_patch5.json'))
          for name,r in [('patch0',p0),('patch5',p5)]:
              print('\n===',name,'===')
              e=r['entity']
              print('entity',e['tag_hash'],'resources',e['unique_entity_resources'])
              for x in e['resources']:
                  print(' resource',x['tag_hash'],'role',x.get('semantic_role'),'model',x.get('embedded_model_tag_hash'))
              m=r['model']
              print('model',m['tag_hash'],'entry',m['entry_index'],'size',m['size'],'meshes',m['mesh_count'])
              for q in m['meshes']:
                  ps=q['position_stream']
                  print(' mesh',q['mesh_index'],
                        'vtx',ps['vertex_count'],
                        'stride/type',ps['header'].get('stride'),ps['header'].get('vertex_type'),
                        'secondary',q['secondary_stream']['header'].get('stride'),q['secondary_stream']['header'].get('vertex_type'),
                        'fourth',ps['fourth_i16_minmax'],'unique',ps['fourth_i16_unique_count'],
                        'tris',q['lod1_triangle_count_deduplicated_ranges'],
                        'components',q['connected_component_count'])
                  print('  bbox used',ps['decoded_bbox_lod1_used_tiger_model_space'])
                  for i,c in enumerate(q['connected_components'][:12]):
                      print('  component',i,'tris',c['triangle_count'],'verts',c['vertex_count'],'bbox',c['bbox_tiger_model_space'])
          print('\n=== patch differences ===')
          print('model size',p0['model']['size'],p5['model']['size'])
          for a,b in zip(p0['model']['meshes'],p5['model']['meshes']):
              print('mesh',a['mesh_index'],
                    'pos payload',a['position_stream']['payload_tag'],b['position_stream']['payload_tag'],
                    'vtx',a['position_stream']['vertex_count'],b['position_stream']['vertex_count'],
                    'bbox_equal',a['position_stream']['decoded_bbox_lod1_used_tiger_model_space']==b['position_stream']['decoded_bbox_lod1_used_tiger_model_space'],
                    'range_materials0',[x['materials'] for x in a['lod1_ranges']],
                    'range_materials5',[x['materials'] for x in b['lod1_ranges']])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: weapon-011c-geometry-diagnostic
          path: reports/
          retention-days: 2
          if-no-files-found: error

  native-oodle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover verified Windows Oodle runtime and 011c family
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force runtime,recovered,reports | Out-Null
          curl.exe -L --fail --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          $h=(Get-FileHash runtime/oo2core_3_win64.dll -Algorithm SHA256).Hash.ToLower()
          if ($h -ne '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62') { throw "Oodle hash mismatch: $h" }
          python tools/d1_split_tar_extract.py --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --start-offset 0x43779C800 --target ps4_gear_weapons_011c_0.pkg --target ps4_gear_weapons_011c_1.pkg --target ps4_gear_weapons_011c_2.pkg --target ps4_gear_weapons_011c_3.pkg --target ps4_gear_weapons_011c_5.pkg --out recovered --manifest reports/011c_extract_windows.json

      - name: Probe historically failing blocks with native Windows Oodle 3
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_oodle_probe import read_pkg_blocks,Oodle3,probe_one
          pkg=Path('recovered/ps4_gear_weapons_011c_5.pkg').resolve()
          h,blocks=read_pkg_blocks(pkg)
          oodle=Oodle3(Path('runtime'))
          out={'package':str(pkg),'platform':h['platform'],'package_patch_id':h['patch_id'],'results':[]}
          for i in (245,299):
              b=blocks[i]
              row={'block_index':i,'metadata':b}
              try:
                  row['probe']=probe_one(pkg,blocks,i,oodle)
                  row['success']=True
              except Exception as ex:
                  row['success']=False
                  row['error']=repr(ex)
              out['results'].append(row)
              print(i,'success' if row['success'] else 'FAIL',row.get('error',''))
          Path('reports/native_windows_oodle_blocks_245_299.json').write_text(json.dumps(out,indent=2)+'\n')
          '@ | python -

      - uses: actions/upload-artifact@v4
        with:
          name: weapon-011c-native-windows-oodle
          path: reports/
          retention-days: 2
          if-no-files-found: error
