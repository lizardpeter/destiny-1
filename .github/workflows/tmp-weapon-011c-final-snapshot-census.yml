name: Temporary weapon 011c geometry-only and pedestal probe

on:
  push:
    paths:
      - '.github/workflows/tmp-weapon-011c-final-snapshot-census.yml'
      - 'tools/d1_weapon_geometry_only_glb.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install check dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy scipy pygltflib pyglm

      - name: Recover runtime and exact 011c family
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' \
            --part-count 10 --start-offset 0x43779C800 \
            --target ps4_gear_weapons_011c_0.pkg \
            --target ps4_gear_weapons_011c_1.pkg \
            --target ps4_gear_weapons_011c_2.pkg \
            --target ps4_gear_weapons_011c_3.pkg \
            --target ps4_gear_weapons_011c_5.pkg \
            --out recovered --manifest reports/011c_extract.json

      - name: Build latest-snapshot skeleton-free geometry GLB
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_weapon_geometry_only_glb.py \
            recovered/ps4_gear_weapons_011c_5.pkg --runtime runtime \
            --model 80A39E12 \
            --out out/80A39E12_PATCH5_GEOMETRY_ONLY.glb \
            --report reports/80A39E12_PATCH5_GEOMETRY_ONLY.json
          sha256sum out/80A39E12_PATCH5_GEOMETRY_ONLY.glb | tee reports/geometry_only_sha256.txt

      - name: Recover pinned animation parser
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git tiger-animation-parser
          git -C tiger-animation-parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
          test "$(git -C tiger-animation-parser rev-parse HEAD)" = 'b9fdc3a43dd28118113275624fcc9054b75855f4'

      - name: Prove weapon Pedestal rest-space transform
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import json,sys
          from pathlib import Path
          import numpy as np
          sys.path.insert(0,'tools')
          sys.path.insert(0,'tiger-animation-parser')
          from d1_entry_extract import EntryReader
          from tag.game_version import Game_Version
          from tag_readers.read_skeleton import read_skeleton, transform_to_np_matrix
          from matrix_operations.numpy_matrix_operations import np_decompose_matrix

          r=EntryReader(Path('recovered/ps4_gear_weapons_011c_5.pkg'),Path('runtime'))
          by={e['tag_hash'].upper():e for e in r.entries}
          sb=r.entry(by['80A39DF2']['index'])
          import io
          s=read_skeleton(io.BytesIO(sb),Game_Version.D1_ROI)
          assert len(s.node_defs)==73
          rows=[]
          for i in (23,24,72):
              nd=s.node_defs[i]
              world=np.array(s.default_obj_space_matrices[i],dtype=float)
              invworld=np.array(s.default_inv_obj_space_matrices[i],dtype=float)
              local=np.array(s.bone_to_parent_offset[i],dtype=float)
              sc,rot,tr=np_decompose_matrix(local)
              rows.append({
                'index':i,'bone_hash':f'{int(nd.bone_hash):08X}','parent':int(nd.parent_node_index),
                'world_matrix':world.tolist(),'inverse_world_matrix':invworld.tolist(),
                'local_matrix':local.tolist(),'local_translation_gltf':np.asarray(tr,dtype=float).tolist(),
                'local_rotation_xyzw':rot.as_quat().astype(float).tolist(),
                'local_scale':np.asarray(sc,dtype=float).tolist(),
                'world_translation_gltf':[float(world[3][0]),float(world[3][1]),float(world[3][2])],
              })
          p=rows[-1]
          # Also test matrix product orientation numerically instead of assuming it.
          ident_a=np.array(s.default_obj_space_matrices[72],dtype=float) @ np.array(s.default_inv_obj_space_matrices[72],dtype=float)
          ident_b=np.array(s.default_inv_obj_space_matrices[72],dtype=float) @ np.array(s.default_obj_space_matrices[72],dtype=float)
          out={'skeleton':'80A39DF2','nodes':rows,
               'pedestal_world_identity_max_abs':float(np.max(np.abs(np.array(s.default_obj_space_matrices[72],dtype=float)-np.eye(4)))),
               'world_times_inverse_error':float(np.max(np.abs(ident_a-np.eye(4)))),
               'inverse_times_world_error':float(np.max(np.abs(ident_b-np.eye(4))))}
          Path('reports/weapon_pedestal_rest_transform.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Validate geometry-only GLB
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pygltflib import GLTF2
          g=GLTF2().load_binary('out/80A39E12_PATCH5_GEOMETRY_ONLY.glb')
          r=json.load(open('reports/80A39E12_PATCH5_GEOMETRY_ONLY.json'))
          assert len(g.meshes)==2
          assert len(g.nodes)==2
          assert len(g.skins)==0
          assert len(g.animations)==0
          assert r['total_lod1_triangles']==2620
          assert [x['vertex_count'] for x in r['meshes']]==[28,2500]
          print('geometry-only GLB validated:',r['bytes'],'bytes, 2 meshes, 2528 vertices, 2620 triangles')
          PY

      - name: Bundle check artifact
        run: |
          set -euo pipefail
          cp reports/80A39E12_PATCH5_GEOMETRY_ONLY.json out/
          cp reports/weapon_pedestal_rest_transform.json out/
          cp reports/geometry_only_sha256.txt out/SHA256SUMS.txt
          cat > out/README.txt <<'EOF'
          D1 ROI PS4 80A39E12 geometry-only diagnostic

          This GLB intentionally contains ONLY the two LOD1 meshes from the final
          patch-5 logical snapshot.  It has no skeleton, skin, animation, weapon
          Pedestal parenting, textures, or inferred native render semantics.

          Purpose: visually distinguish model-geometry completeness from the old
          rigged fixture's attachment/rest-space behavior in Blender.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: 80A39E12-patch5-geometry-only-check
          path: out/
          retention-days: 2
          if-no-files-found: error
          compression-level: 0
