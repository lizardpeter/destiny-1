name: D1 Crota 8108E5BD exact reference chain

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-8108e5bd-reference-chain.yml'
      - 'tools/d1_remote_exact_tag_probe.py'
      - 'tools/d1_remote_catalog_backlinks.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Probe exact 8108E5BD child references
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_exact_tag_probe.py \
            --tag-hash 0x810B117A --tag-hash 0x80D777AA --tag-hash 0x80AADEB4 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --min-string 4 \
            -o out/CROTA_8108E5BD_REFERENCE_CHAIN.json | tee out/probe_stdout.txt
      - name: Trace exact backlinks to the three child references
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          : > out/backlinks_stdout.txt
          for PKG in 0x0447 0x044B 0x0450 0x0458 0x0156 0x0157 0x0158; do
            NAME=$(printf '%04X' $((PKG)))
            python tools/d1_remote_catalog_backlinks.py \
              --scan-package-id "$PKG" \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --target 0x810B117A --target 0x80D777AA --target 0x80AADEB4 \
              --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
              --runtime runtime --max-entry-size 8000000 \
              -o "out/CROTA_8108E5BD_BACKLINKS_${NAME}.json" | tee -a out/backlinks_stdout.txt
          done
      - name: Summarize exact chain
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,glob,collections
          d=json.load(open('out/CROTA_8108E5BD_REFERENCE_CHAIN.json'))
          assert d['violation_count']==0,d['violations']
          for x in d['entries']:
              e=x['entry']
              print('TAG',x['tag_hash'],'CLASS',e['reference'],'SIZE',e['file_size'],'SHA256',x['payload_sha256'])
              for s in x['printable_strings']: print(' STRING',hex(s['offset']),repr(s['string']))
              for m in x['aligned_resolved_tags']:
                  me=m['entry']; print(' EDGE',hex(m['offset']),m['tag_hash'],me['reference'],me['file_size'])
          totals=collections.Counter(); classes=collections.Counter()
          for p in glob.glob('out/CROTA_8108E5BD_BACKLINKS_*.json'):
              b=json.load(open(p)); assert b['error_count']==0,(p,b['errors'])
              totals.update(b['occurrences_by_target']); classes.update(b['hit_sources_by_reference'])
          print('BACKLINK_OCCURRENCES',dict(totals)); print('BACKLINK_SOURCE_CLASSES',dict(classes))
          PY
          find out -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-8108E5BD-REFERENCE-CHAIN
          path: out/
          retention-days: 30
          if-no-files-found: error
