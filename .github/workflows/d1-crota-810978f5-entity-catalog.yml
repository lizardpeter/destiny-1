name: D1 Crota 810978F5 entity catalog

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-810978f5-entity-catalog.yml'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover corpus/runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Close all 810978F5 serialized s_entities
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_entity_dependency_closure_universal.py \
            --seed 0x80AAC2A5 --seed 0x8108F4E0 --seed 0x80AAC2B5 --seed 0x80AAC2A1 \
            --seed 0x81096A2A --seed 0x80AAC2B6 --seed 0x8108F4E1 --seed 0x8108F4E2 --seed 0x8108F4E3 \
            --seed 0x81657A1E --seed 0x816E3EB0 --seed 0x816E3EB1 --seed 0x80AAC29F --seed 0x80AAC2A2 \
            --seed 0x80AAC2A0 --seed 0x8108F4E4 --seed 0x80AAC2B7 --seed 0x80AAC2B8 --seed 0x80AAC2A3 \
            --seed 0x8108F4E5 --seed 0x80AAC2B9 --seed 0x81096A2C --seed 0x81096A2B --seed 0x80AAC2BA \
            --seed 0x80AAC2BB --seed 0x80AAC2BC --seed 0x80AAC2A4 --seed 0x80AAC29E --seed 0x8108F4E6 --seed 0x80AACE3A \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --max-depth 2 --max-nodes 500 \
            -o out/CROTA_810978F5_ENTITY_CATALOG.json | tee out/closure.txt
          python - <<'PY' | tee out/summary.txt
          import json
          d=json.load(open('out/CROTA_810978F5_ENTITY_CATALOG.json'))
          assert d['status']=='D1_ENTITY_DEPENDENCY_CLOSURE_COMPLETE',d.get('status')
          assert not d['violations'],d['violations'][:20]
          assert not d['truncated'],d
          print('CROTA_810978F5_ENTITY_CATALOG','ROOTS',len(d['seeds']),'NODES',d['node_count'],'ARTICULATED',len(d['articulated_entities']))
          for a in d['articulated_entities']:
            print('ARTICULATED',a['tag_hash'],'DEPTH',a['depth'],'PATH',a['path_class'],'MODELS',a.get('embedded_models'),'SKELETONS',a.get('skeletons'),'SPECIFIC',a.get('specific_name_hashes'),'GENERIC',a.get('generic_name_hashes'))
          roots={x['tag_hash']:x for x in d['nodes'] if x.get('depth')==0}
          for h in d['seeds']:
            n=roots.get(h,{})
            print('ROOT',h,'RESOURCES',[(r.get('resource_hash'),r.get('semantic_role'),r.get('unk10'),r.get('unk18')) for r in n.get('resources',[])])
          PY
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-810978F5-ENTITY-CATALOG
          path: out/
          retention-days: 30
          if-no-files-found: error
