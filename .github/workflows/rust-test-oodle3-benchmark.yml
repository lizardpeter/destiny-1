name: Rust-test Oodle3 Refill and MatchCopy A-B
on:
  push:
    branches: [bench/oodle3-rust-test-20261008]
    paths:
      - 'rust/d1_oodle3/**'
      - '.github/workflows/rust-test-oodle3-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile and test baseline and single-refill candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/d1_oodle3/Cargo.toml --release --lib
          mkdir -p out
          (cd rust/d1_oodle3 && CARGO_TARGET_DIR=target-scalar cargo build --release)
          cp rust/d1_oodle3/target-scalar/release/d1_oodle3.dll out/rust_scalar.dll
          (cd rust/d1_oodle3 && CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 RUSTFLAGS="-C target-cpu=native" CARGO_TARGET_DIR=target-native cargo build --release)
          cp rust/d1_oodle3/target-native/release/d1_oodle3.dll out/rust_native.dll
          python - <<'PY'
          from pathlib import Path
          path=Path('rust/d1_oodle3/src/lzh.rs')
          src=path.read_text()
          marker='    fn ensure_bits_fast(&mut self, count: usize) {'
          endmarker='    fn read_bits_fast(&mut self, count: usize) -> u64 {'
          p=src.index(marker)
          q=src.index(endmarker,p)
          middle=src[p:q]
          old='while usize::from(self.bit_count) < count {'
          if middle.count(old)!=1: raise RuntimeError('Expected unique fast-refill loop')
          middle=middle.replace(old,'if usize::from(self.bit_count) < count {')
          path.write_text(src[:p]+middle+src[q:])
          print('FAST_REFILL_IF_CANDIDATE_APPLIED')
          PY
          cargo test --manifest-path rust/d1_oodle3/Cargo.toml --release --lib
          (cd rust/d1_oodle3 && CARGO_TARGET_DIR=target-candidate cargo build --release)
          cp rust/d1_oodle3/target-candidate/release/d1_oodle3.dll out/rust_candidate.dll
          (cd rust/d1_oodle3 && CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 RUSTFLAGS="-C target-cpu=native" CARGO_TARGET_DIR=target-candidate-native cargo build --release)
          cp rust/d1_oodle3/target-candidate-native/release/d1_oodle3.dll out/rust_candidate_native.dll
          python - <<'PY'
          from pathlib import Path
          p=Path('rust/d1_oodle3/src/lzh.rs')
          src=p.read_text()
          head=src.index('fn copy_match_into(')
          tail=src.index('\n}\n',head)+3
          fn=src[head:tail]
          dist_start=fn.index('    if distance == 1 {')
          dist_end=fn.index('\n\n    let match_start = *output_pos;',dist_start)
          dist_block=fn[dist_start:dist_end]
          fn=fn[:dist_start]+fn[dist_end:]
          small_start=fn.index('        if length <= 8 && physical_remaining >= 8 {')
          small_end=fn.index('        if length <= 16 && physical_remaining >= 16 {',small_start)
          small_block=fn[small_start:small_end]
          fn=fn[:small_start]+fn[small_end:]
          anchor='    let source_start = match_start - distance;\n'
          if fn.count(anchor)!=1: raise RuntimeError('Missing match copy anchor')
          short='\n'.join([
              "    // Most match tokens are short: handle them before the rarer",
              "    // RLE, SIMD or longer copy paths, after all bounds validation.",
              "    if distance >= 8 && length <= 8 && output.len() - match_start >= 8 {",
              "        unsafe {",
              "            let base = output.as_mut_ptr();",
              "            let word = core::ptr::read_unaligned(base.add(source_start).cast::<u64>());",
              "            core::ptr::write_unaligned(base.add(match_start).cast::<u64>(), word);",
              "        }",
              "        *output_pos += length;",
              "        return Ok(());",
              "    }",
              "",
              "",
          ])    // Most match tokens are short: handle them before the rarer
    // RLE, SIMD or longer copy paths, after all bounds validation.
    if distance >= 8 && length <= 8 && output.len() - match_start >= 8 {
        unsafe {
            let base = output.as_mut_ptr();
            let word = core::ptr::read_unaligned(base.add(source_start).cast::<u64>());
            core::ptr::write_unaligned(base.add(match_start).cast::<u64>(), word);
        }
        *output_pos += length;
        return Ok(());
    }

'''
          fn=fn.replace(anchor,anchor+'\n'+short+dist_block+'\n')
          if small_block.count('if length <= 8')!=1 or fn.count('if distance == 1')!=1: raise RuntimeError('Unexpected copy path')
          p.write_text(src[:head]+fn+src[tail:])
          print('SHORT_MATCH_FAST_PATH_REORDER_APPLIED')
          PY
          cargo test --manifest-path rust/d1_oodle3/Cargo.toml --release --lib
          (cd rust/d1_oodle3 && CARGO_TARGET_DIR=target-match cargo build --release)
          cp rust/d1_oodle3/target-match/release/d1_oodle3.dll out/rust_match.dll
          (cd rust/d1_oodle3 && CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 RUSTFLAGS="-C target-cpu=native" CARGO_TARGET_DIR=target-match-native cargo build --release)
          cp rust/d1_oodle3/target-match-native/release/d1_oodle3.dll out/rust_match_native.dll
      - name: Recover source-verified Destiny package and reference Oodle DLL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered reference
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from d1_split_tar_extract import SplitHttpTar
          name = 'ps4_city_tower_destination_024c_5.pkg'
          offset, size = 7715401728, 1687552
          expected = 'b404bacccf44a4bf6859bf3b867ae02f5dc840432bdaa081c341439c2ae83311'
          base = 'https://crypt.cohae.dev/destiny/ps4/packages/latest'
          archive = SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)], retries=5, timeout=90)
          actual = archive.copy_to(offset, size, Path('recovered')/name)
          if actual.lower() != expected: raise SystemExit('Package SHA mismatch: '+actual)
          print('RECOVERED_VERIFIED_PACKAGE_SHA256', actual)
          globals_name='ps4_globals_0157_6.pkg'
          globals_sha=archive.copy_to(0x47AF53A00, 356352, Path('recovered')/globals_name)
          print('RECOVERED_HOLDOUT_PACKAGE_SHA256', globals_sha)
          PY
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o reference/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  reference/oo2core_3_win64.dll' | sha256sum --check --strict
      - name: Byte-verify and benchmark original and fast-refill candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ctypes, hashlib, json, statistics, sys, time
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from d1_pkg_probe import parse_header, parse_blocks, read_table
          def bind(path):
              lib = ctypes.WinDLL(str(Path(path).resolve()))
              fn = lib.OodleLZ_Decompress
              fn.restype = ctypes.c_int64
              fn.argtypes = [ctypes.c_void_p, ctypes.c_int64, ctypes.c_void_p, ctypes.c_int64, ctypes.c_uint32, ctypes.c_uint32, ctypes.c_uint32, ctypes.c_void_p, ctypes.c_void_p, ctypes.c_void_p, ctypes.c_void_p, ctypes.c_void_p, ctypes.c_void_p, ctypes.c_uint32]
              return lib,fn
          cases=[]
          sources=[
              ('ps4_city_tower_destination_024c_5.pkg',5,8),
              ('ps4_globals_0157_6.pkg',6,3),
          ]
          for member,patch,limit in sources:
              pkg=Path('recovered')/member
              with pkg.open('rb') as f:
                  h=parse_header(f)
                  table=read_table(f,h['block_table_offset'],h['block_table_count'],32)
              selected=0
              for block in parse_blocks(table):
                  if not block['compressed'] or int(block['patch_id'])!=patch: continue
                  with pkg.open('rb') as f:
                      f.seek(int(block['offset']))
                      comp=f.read(int(block['size']))
                  if hashlib.sha1(comp).hexdigest().lower()!=str(block['sha1']).lower():
                      raise RuntimeError('Compressed block SHA mismatch: '+member)
                  cases.append((member+'/'+str(block['index']),comp,0x40000))
                  selected+=1
                  if selected==limit: break
              if selected!=limit: raise RuntimeError(f'Expected {limit} holdout blocks from {member}; got {selected}')
          libs={
              'original_oodle':bind('reference/oo2core_3_win64.dll'),
              'rust_scalar':bind('out/rust_scalar.dll'),
              'rust_native':bind('out/rust_native.dll'),
              'rust_candidate':bind('out/rust_candidate.dll'),
              'rust_candidate_native':bind('out/rust_candidate_native.dll'),
              'rust_match':bind('out/rust_match.dll'),
              'rust_match_native':bind('out/rust_match_native.dll')
          }
          buffers={name:[(ctypes.create_string_buffer(comp),ctypes.create_string_buffer(raw),len(comp),raw) for _,comp,raw in cases] for name in libs}
          def call(name,i):
              src,dst,cl,raw=buffers[name][i]
              fn=libs[name][1]
              n=fn(ctypes.cast(src,ctypes.c_void_p),cl,ctypes.cast(dst,ctypes.c_void_p),raw,1,0,0,None,None,None,None,None,None,3)
              if n!=raw: raise RuntimeError(f'{name} block {cases[i][0]} returned {n}, expected {raw}')
              return dst.raw[:raw]
          for i,(index,_,_) in enumerate(cases):
              outs={name:call(name,i) for name in libs}
              if len(set(outs.values()))!=1: raise RuntimeError(f'Decode output mismatch on {index}')
          print('CORRECTNESS: 11/11 blocks byte-identical (Tower + globals holdout, Oodle + 4 Rust variants)')
          for _ in range(20):
              for name in libs:
                  for i in range(len(cases)): call(name,i)
          rounds=11
          iterations=75
          total_bytes=sum(x[2] for x in cases)*iterations
          samples={name:[] for name in libs}
          names=list(libs)
          orders=[names, names[1:]+names[:1], names[2:]+names[:2], names[3:]+names[:3], names[::-1], list(reversed(names[1:]))+[names[0]]]
          for j in range(rounds):
              results={}
              for name in orders[j%len(orders)]:
                  start=time.perf_counter_ns()
                  for _ in range(iterations):
                      for i in range(len(cases)): call(name,i)
                  sec=(time.perf_counter_ns()-start)/1e9
                  speed=total_bytes/sec/(1024*1024)
                  results[name]=speed
                  samples[name].append(speed)
              print('ROUND',j+1,json.dumps(results))
          medians={name:statistics.median(v) for name,v in samples.items()}
          ratios={
              'candidate_over_scalar':medians['rust_candidate']/medians['rust_scalar'],
              'candidate_native_over_native':medians['rust_candidate_native']/medians['rust_native'],
              'native_over_oodle':medians['rust_native']/medians['original_oodle'],
              'candidate_native_over_oodle':medians['rust_candidate_native']/medians['original_oodle'],
              'match_over_refill':medians['rust_match']/medians['rust_candidate'],
              'match_native_over_refill_native':medians['rust_match_native']/medians['rust_candidate_native'],
              'match_native_over_oodle':medians['rust_match_native']/medians['original_oodle']
          }
          report={'blocks':[x[0] for x in cases], 'correctness':str(len(cases))+'/'+str(len(cases))+' byte-identical', 'rounds':rounds,'iterations':iterations,'median_mib_s':medians,'ratios':ratios,'samples_mib_s':samples}
          Path('out/benchmark.json').write_text(json.dumps(report,indent=2)+'\n')
          print('BENCHMARK_RESULT',json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-test-oodle3-benchmark
          path: out/benchmark.json
          retention-days: 14
          if-no-files-found: ignore
