name: D1 Tower common-layer pixel-shader disassembly

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['D1 Tower common-layer material texture census']
    types: [completed]
  push:
    paths:
      - '.github/workflows/d1-tower-common-layer-shader-disassembly.yml'
      - 'tools/d1_world_shader_extract.py'
      - 'tools/d1_gcn_image_usage_analyze.py'
      - 'tools/d1_gcn_cbuffer_usage_analyze.py'
      - 'tools/d1_gcn_terminal_mrt0_dependency_census.py'
      - 'tools/d1_gcn_terminal_symbolic_reducer.py'
      - 'tools/d1_tower_common_symbolic_coverage.py'
      - 'tools/d1_tower_common_terminal_symbolic_coverage.py'
      - 'tools/d1_shader_structural_family_cluster.py'
      - 'tools/d1_shader_texture_roles.py'
      - 'tools/d1_validate_shader_texture_roles.py'
      - 'tools/d1_tower_common_shader_semantic_coverage.py'
      - 'tools/d1_tower_common_ps_80ca0f50_semantic_proof.py'
      - 'tools/d1_tower_common_ps_8093e8a2_runtime_output_contract.py'
      - 'tools/d1_split_tar_extract.py'
      - 'tools/d1_github_actions_artifact_pull.py'

permissions:
  contents: read
  actions: read

jobs:
  shaders:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install verified Oodle runtime and recover common texture manifest
        run: |
          set -euo pipefail
          mkdir -p runtime recovered shader_deps prior shader reports disasm
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          if [ "${{ github.event_name }}" = workflow_run ]; then
            texture_run='${{ github.event.workflow_run.id }}'
          else
            texture_run="$(gh run list --workflow d1-tower-common-layer-texture-census.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$texture_run"
          echo "COMMON_TEXTURE_SOURCE_RUN=$texture_run"
          python tools/d1_github_actions_artifact_pull.py \
            --repo "$GITHUB_REPOSITORY" --run-id "$texture_run" \
            --artifact-name d1-tower-common-layer-texture-census \
            --out-dir prior --clean \
            --report reports/ARTIFACT_PULL_COMMON_TEXTURE_CENSUS.json
          test -f prior/compact/common_material_texture_manifest.json

      - name: Recover Tower plus global shader dependency corpus
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py --package-list reports/packages.txt --out-dir recovered --report reports/current_corpus.json
          python tools/d1_recover_member_catalog.py --catalog evidence/d1_tower_texture_dependency_member_catalog.json \
            --package-list reports/packages.txt --family 0154 --family 0155 --family 0156 --family 0157 --family 0158 --family 01db \
            --out-dir shader_deps --report reports/global_shader_dep_recovery.json
          if [ -f evidence/d1_tower_shader_dependency_member_catalog.json ]; then
            python tools/d1_recover_member_catalog.py --catalog evidence/d1_tower_shader_dependency_member_catalog.json \
              --package-list reports/packages.txt --family 00ec --family 00ee \
              --out-dir shader_deps --report reports/race_shader_dep_recovery.json
          fi
          # The only first-pass gap was native shader 80A3D3AE.  Its exact D1
          # TagHash namespace is package 011E: (80A3D3AE-80800000)>>13 == 0x011E.
          # Reuse the already source-closed weapon-family TAR start used by the
          # 011E weapon workflows rather than guessing a package from the shader name.
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --start-offset 0x439A04A00 \
            --target ps4_gear_weapons_011e_0.pkg --target ps4_gear_weapons_011e_1.pkg \
            --target ps4_gear_weapons_011e_2.pkg --target ps4_gear_weapons_011e_3.pkg \
            --target ps4_gear_weapons_011e_5.pkg --out shader_deps --manifest reports/011e_shader_dep_recovery.json

      - name: Extract all 65 exact common-layer pixel shader families
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered shader_deps -maxdepth 1 -name '*.pkg' -type f | sort -u)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          set +e
          python tools/d1_world_shader_extract.py "${args[@]}" --runtime runtime \
            --manifest prior/compact/common_material_texture_manifest.json --top 65 \
            --out-dir shader --report reports/common65_shader_extract.json
          rc=$?
          set -e
          test "$rc" -eq 0
          python - <<'PY'
          import json
          d=json.load(open('reports/common65_shader_extract.json'))
          ok=[r for r in d['shaders'] if not r.get('error')]
          bad=[r for r in d['shaders'] if r.get('error')]
          s={'requested':len(d['shaders']),'exact':len(ok),'failed':len(bad),
             'failed_rows':[{'shader':r['shader'],'visible_material_count':r.get('visible_material_count'),'error':r.get('error'),'native_shader':r.get('native_shader')} for r in bad]}
          open('reports/common65_shader_extract_summary.json','w').write(json.dumps(s,indent=2)+'\n')
          print(json.dumps(s,indent=2))
          if s != {'requested':65,'exact':65,'failed':0,'failed_rows':[]}:
              raise SystemExit('common shader corpus is not 65/65 exact')
          PY

      - name: Build pinned CLRX disassembler
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/CLRX/CLRX-mirror.git clrx
          git -C clrx checkout --quiet fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df
          test "$(git -C clrx rev-parse HEAD)" = 'fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df'
          cmake -S clrx -B clrx/build -DCMAKE_BUILD_TYPE=Release -DNO_CLWRAPPER=ON -DBUILD_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_DOCUMENTATION=OFF
          cmake --build clrx/build --target clrxdisasm -j2

      - name: Disassemble every resolved common shader
        run: |
          set -euo pipefail
          exe="$(find clrx/build -type f -name clrxdisasm -perm -111 | head -1)"
          test -n "$exe"
          count=0; failures=0
          shopt -s nullglob
          for f in shader/PS_*_gcn.bin; do
            count=$((count+1)); b="$(basename "$f" _gcn.bin)"
            "$exe" --raw --gpuType=GFX700 --hexcode "$f" > "disasm/${b}.s" 2> "disasm/${b}.stderr" || failures=$((failures+1))
            test ! -s "disasm/${b}.stderr" || failures=$((failures+1))
            grep -q 's_endpgm' "disasm/${b}.s" || failures=$((failures+1))
          done
          echo "DISASSEMBLED=$count FAILURES=$failures"
          test "$count" -eq 65
          test "$failures" -eq 0

      - name: Map every native image instruction to exact D1 texture register
        run: |
          set -euo pipefail
          python tools/d1_gcn_image_usage_analyze.py \
            --extract-report reports/common65_shader_extract.json \
            --disasm-dir disasm --out reports/common65_gcn_image_usage.json \
            | tee reports/common65_gcn_image_usage_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/common65_gcn_image_usage.json'))
          e=json.load(open('reports/common65_shader_extract.json'))
          freq={r['shader']:int(r.get('visible_material_count',0)) for r in e['shaders']}
          pr=[]
          for r in d.get('shaders',[]):
              pr.append({'shader':r.get('shader'),'visible_material_count':freq.get(r.get('shader'),0),
                         'image_instruction_count':r.get('image_instruction_count',0),
                         'image_ops':r.get('image_opcodes',[]),'texture_registers':r.get('used_texture_indices',[])})
          pr.sort(key=lambda x:(-x['visible_material_count'],x['shader'] or ''))
          open('reports/common_shader_semantic_priority.json','w').write(json.dumps(pr,indent=2)+'\n')
          if len(pr)!=65: raise SystemExit(f'expected 65 usage rows, got {len(pr)}')
          print(json.dumps(pr[:15],indent=2))
          PY

      - name: Recover cbuffer provenance and terminal MRT0 dependencies for top unresolved families
        run: |
          set -euo pipefail
          python tools/d1_gcn_cbuffer_usage_analyze.py \
            --extract-report reports/common65_shader_extract.json \
            --disasm-dir disasm \
            --out reports/common65_gcn_cbuffer_usage.json \
            | tee reports/common65_gcn_cbuffer_usage_stdout.txt

          python tools/d1_gcn_terminal_mrt0_dependency_census.py \
            --usage reports/common65_gcn_image_usage.json \
            --cbuffer-usage reports/common65_gcn_cbuffer_usage.json \
            --disasm-dir disasm \
            --shader 8093E8A2 --shader 80CA0F50 \
            --out reports/common_top_unresolved_mrt0_dependencies.json \
            | tee reports/common_top_unresolved_mrt0_dependencies_stdout.txt

          python - <<'PY'
          import json
          d=json.load(open('reports/common_top_unresolved_mrt0_dependencies.json'))
          assert d['status']=='D1_GCN_TERMINAL_MRT0_DEPENDENCY_CENSUS_EXACT',d
          assert {x['shader'] for x in d['shaders']}=={'8093E8A2','80CA0F50'},d
          for r in d['shaders']:
              print('TOWER_COMMON_TOP_UNRESOLVED_MRT0',r['shader'],
                    'COMPRESSED',r['terminal_mrt0_compressed'],
                    'OPERANDS',r['terminal_mrt0_operands'],
                    'UNION',r['mrt0_value_union'])
              for ch,row in r['channels'].items():
                  print('  CHANNEL',ch,row['value_slice'])
          PY

      - name: Slice terminal MRT0 dependencies for all 65 common shader families
        run: |
          set -euo pipefail
          mapfile -t all_common < <(python - <<'PY'
          import json
          d=json.load(open('reports/common65_shader_extract.json'))
          for r in sorted([x for x in d['shaders'] if not x.get('error')],
                          key=lambda x:(-int(x.get('visible_material_count',0)),x['shader'])):
              print(r['shader'])
          PY
          )
          test "${#all_common[@]}" -eq 65
          args=(); for h in "${all_common[@]}"; do args+=(--shader "$h"); done
          python tools/d1_gcn_terminal_mrt0_dependency_census.py \
            --usage reports/common65_gcn_image_usage.json \
            --cbuffer-usage reports/common65_gcn_cbuffer_usage.json \
            --disasm-dir disasm "${args[@]}" \
            --out reports/common65_all_mrt0_dependencies.json \
            | tee reports/common65_all_mrt0_dependencies_stdout.txt
          python - <<'PY'
          import json
          e=json.load(open('reports/common65_shader_extract.json'))
          d=json.load(open('reports/common65_all_mrt0_dependencies.json'))
          assert d['status']=='D1_GCN_TERMINAL_MRT0_DEPENDENCY_CENSUS_EXACT',d
          assert d['shader_count']==65,d
          assert {x['shader'] for x in d['shaders']}=={x['shader'] for x in e['shaders'] if not x.get('error')},d
          print('TOWER_COMMON_ALL65_MRT0_COVERAGE',d['shader_count'])
          PY

      - name: Symbolically reduce all 65 common terminal equations
        run: |
          set -euo pipefail
          mapfile -t all_common < <(python - <<'PY'
          import json
          d=json.load(open('reports/common65_shader_extract.json'))
          for r in sorted([x for x in d['shaders'] if not x.get('error')],
                          key=lambda x:(-int(x.get('visible_material_count',0)),x['shader'])):
              print(r['shader'])
          PY
          )
          test "${#all_common[@]}" -eq 65
          args=(); for h in "${all_common[@]}"; do args+=(--shader "$h"); done

          set +e
          python tools/d1_gcn_terminal_symbolic_reducer.py \
            --usage reports/common65_gcn_image_usage.json \
            --cbuffer-usage reports/common65_gcn_cbuffer_usage.json \
            --disasm-dir disasm "${args[@]}" \
            --out reports/TOWER_COMMON65_SYMBOLIC_TERMINAL.json \
            | tee reports/TOWER_COMMON65_SYMBOLIC_TERMINAL_stdout.txt
          rc=$?
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2

          python tools/d1_tower_common_symbolic_coverage.py \
            --manifest prior/compact/common_material_texture_manifest.json \
            --shader-report reports/common65_shader_extract.json \
            --symbolic reports/TOWER_COMMON65_SYMBOLIC_TERMINAL.json \
            --out reports/TOWER_COMMON65_SYMBOLIC_COVERAGE.json \
            | tee reports/TOWER_COMMON65_SYMBOLIC_COVERAGE_stdout.txt

          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_COMMON65_SYMBOLIC_COVERAGE.json'))
          assert d['status']=='D1_TOWER_COMMON_SYMBOLIC_COVERAGE_EXACT',d
          assert d['total_shader_family_count']==65,d
          assert d['exact_terminal_equation_family_count']==65,d
          assert d['unresolved_terminal_equation_family_count']==0,d
          assert d['exact_terminal_equation_visible_material_count']==99,d
          assert d['total_visible_material_count']==99,d
          assert d['family_coverage_fraction']==1.0,d
          assert d['visible_material_coverage_fraction']==1.0,d
          print('TOWER_COMMON_SYMBOLIC_COVERAGE',
                'EXACT_FAMILIES',d['exact_terminal_equation_family_count'],
                'OF',d['total_shader_family_count'],
                'EXACT_VISIBLE_MATERIALS',d['exact_terminal_equation_visible_material_count'],
                'OF',d['total_visible_material_count'],
                'FAMILY_FRACTION',d['family_coverage_fraction'],
                'MATERIAL_FRACTION',d['visible_material_coverage_fraction'])
          for r in d['highest_priority_unresolved_rows'][:30]:
              print('TOWER_COMMON_SYMBOLIC_BLOCKER',r['shader'],
                    'WEIGHT',r['visible_material_count'],
                    'BYTES',r['gcn_bytes'],
                    'BAD_CHANNELS',r['terminal_bad_channels'],
                    'UNRESOLVED',r['terminal_unresolved_markers'],
                    'UNSUPPORTED',[(x['address'],x['mnemonic']) for x in r['unsupported_operations'][:12]])
          PY

      - name: Pin complete common terminal equation corpus
        run: |
          set -euo pipefail
          python tools/d1_tower_common_terminal_symbolic_coverage.py \
            --shader-report reports/common65_shader_extract.json \
            --symbolic reports/TOWER_COMMON65_SYMBOLIC_TERMINAL.json \
            --out reports/TOWER_COMMON65_TERMINAL_SYMBOLIC_PIN.json \
            | tee reports/TOWER_COMMON65_TERMINAL_SYMBOLIC_PIN_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_COMMON65_TERMINAL_SYMBOLIC_PIN.json'))
          assert d['status']=='D1_TOWER_COMMON_TERMINAL_SYMBOLIC_COVERAGE_EXACT',d
          assert d['shader_family_count']==65,d
          assert d['visible_material_count']==99,d
          assert d['shader_family_coverage_fraction']==1.0,d
          assert d['visible_material_coverage_fraction']==1.0,d
          assert d['canonical_projection_sha256']=='8dd0014b2b95c50c89f301b7d59898bc1ebba590b7965d09a1d96e4a2c7abbb0',d
          assert d['initial_vgpr_leaf_shaders']==['80AADBB4','80AAE1F5'],d
          print('TOWER_COMMON_TERMINAL_EQUATION_FRONTIER','CLOSED_65_OF_65_FAMILIES_99_OF_99_MATERIALS')
          print('TOWER_COMMON_TERMINAL_CANONICAL_SHA256',d['canonical_projection_sha256'])
          print('TOWER_COMMON_INITIAL_VGPR_LEAVES',d['initial_vgpr_leaf_shaders'])
          PY

      - name: Cluster exact common shader structural families
        run: |
          set -euo pipefail
          python tools/d1_shader_structural_family_cluster.py \
            --extract-report reports/common65_shader_extract.json \
            --image-usage reports/common65_gcn_image_usage.json \
            --cbuffer-usage reports/common65_gcn_cbuffer_usage.json \
            --terminal-mrt0 reports/common65_all_mrt0_dependencies.json \
            --out reports/TOWER_COMMON65_STRUCTURAL_SHADER_CLUSTERS.json \
            | tee reports/TOWER_COMMON65_STRUCTURAL_SHADER_CLUSTERS_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_COMMON65_STRUCTURAL_SHADER_CLUSTERS.json'))
          assert d['status']=='D1_SHADER_STRUCTURAL_FAMILY_CLUSTER_EXACT',d
          assert d['shader_family_count']==65,d
          assert not d['violations'],d['violations']
          print('TOWER_COMMON65_STRUCTURAL_CLUSTERS',
                'CLUSTERS',d['cluster_count'],
                'MULTI_SHADER',d['multi_shader_cluster_count'])
          for r in d['clusters'][:20]:
              print('COMMON_CLUSTER',r['cluster_index'],
                    'WEIGHT',r['visible_material_count_sum'],
                    'SHADERS',r['shaders'])
          PY

      - name: Prove exact 8093E8A2 runtime alpha-only output contract
        run: |
          set -euo pipefail
          python tools/d1_tower_common_ps_8093e8a2_runtime_output_contract.py \
            --manifest prior/compact/common_material_texture_manifest.json \
            --shader-report reports/common65_shader_extract.json \
            --image-usage reports/common65_gcn_image_usage.json \
            --cbuffer-usage reports/common65_gcn_cbuffer_usage.json \
            --terminal-mrt0 reports/common_top_unresolved_mrt0_dependencies.json \
            --disasm disasm/PS_8093E8A2.s \
            --out reports/common_ps_8093e8a2_runtime_output_contract.json \
            | tee reports/common_ps_8093e8a2_runtime_output_contract_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/common_ps_8093e8a2_runtime_output_contract.json'))
          assert d['status']=='D1_TOWER_COMMON_PS_8093E8A2_RUNTIME_OUTPUT_CONTRACT_EXACT',d
          assert d['authored_material_ps_texture_role_status']=='NOT_APPLICABLE_NO_SERIALIZED_PS_TEXTURES',d
          assert d['mrt0_contract']['rgb']=='(0,0,0) exact literals',d
          assert d['semantic_boundary']['pass_identity']=='WITHHELD',d
          print('TOWER_COMMON_8093E8A2_RUNTIME_ALPHA_ONLY_EXACT',d['mrt0_contract'])
          PY

      - name: Prove exact 80CA0F50 algebraic texture roles
        run: |
          set -euo pipefail
          python tools/d1_tower_common_ps_80ca0f50_semantic_proof.py \
            --extract-report reports/common65_shader_extract.json \
            --image-usage reports/common65_gcn_image_usage.json \
            --cbuffer-usage reports/common65_gcn_cbuffer_usage.json \
            --mrt0-deps reports/common_top_unresolved_mrt0_dependencies.json \
            --manifest prior/compact/common_material_texture_manifest.json \
            --disassembly disasm/PS_80CA0F50.s \
            --out reports/common_ps_80ca0f50_semantic_proof.json \
            | tee reports/common_ps_80ca0f50_semantic_proof_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/common_ps_80ca0f50_semantic_proof.json'))
          assert d['status']=='D1_TOWER_COMMON_PS_80CA0F50_SEMANTICS_EXACT',d
          assert d['alpha_exact_zero'] is True,d
          assert set(d['promoted_texture_roles'])=={'0','1','2'},d
          print('TOWER_COMMON_80CA0F50_CLOSED',d['instruction_level_equation'])
          PY

      - name: Validate already-proven roles against common shader corpus
        run: |
          set -euo pipefail
          python tools/d1_validate_shader_texture_roles.py \
            --image-usage reports/common65_gcn_image_usage.json \
            --manifest prior/compact/common_material_texture_manifest.json \
            --out reports/common65_shader_texture_role_validation.json \
            | tee reports/common65_shader_texture_role_validation_stdout.txt

      - name: Measure exact sampled-material semantic coverage
        run: |
          set -euo pipefail
          python tools/d1_tower_common_shader_semantic_coverage.py \
            --extract-report reports/common65_shader_extract.json \
            --image-usage reports/common65_gcn_image_usage.json \
            --manifest prior/compact/common_material_texture_manifest.json \
            --out reports/common65_semantic_coverage.json \
            | tee reports/common65_semantic_coverage_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/common65_semantic_coverage.json'))
          assert d['status']=='D1_TOWER_COMMON_SHADER_SEMANTIC_COVERAGE_EXACT',d
          assert d['exact_shader_family_count']==65,d
          print('TOWER_COMMON_SEMANTIC_COVERAGE',
                'FAMILIES_ANY_ROLE',d['families_with_any_proven_roles'],
                'FAMILIES_FULL_TEXTURE_ROLE',d['families_with_full_sampled_material_texture_role_coverage'],
                'VISIBLE_FREQ_ANY_ROLE',d['visible_material_frequency_any_role_fraction'],
                'VISIBLE_FREQ_FULL_ROLE',d['visible_material_frequency_full_material_texture_role_fraction'],
                'SAMPLED_BINDING_ROLE',d['sampled_material_texture_register_role_fraction'])
          for r in d['highest_priority_unresolved_families'][:20]:
              print('TOWER_COMMON_UNRESOLVED',r['shader'],
                    'VISIBLE_MATERIALS',r['visible_material_count'],
                    'MISSING_T',r['unproven_sampled_material_texture_indices'],
                    'USED_T',r['native_used_texture_indices'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-common65-pixel-shader-disassembly
          path: |
            reports/
            shader/
            disasm/
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
