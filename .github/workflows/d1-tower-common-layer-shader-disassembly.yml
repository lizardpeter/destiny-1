name: D1 Tower common-layer pixel-shader disassembly

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-common-layer-shader-disassembly.yml'
      - 'tools/d1_world_shader_extract.py'
      - 'tools/d1_gcn_image_usage_analyze.py'
      - 'tools/d1_shader_texture_roles.py'
      - 'tools/d1_validate_shader_texture_roles.py'
      - 'tools/d1_split_tar_extract.py'

permissions:
  contents: read
  actions: read

jobs:
  shaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install verified Oodle runtime and recover common texture manifest
        run: |
          set -euo pipefail
          mkdir -p runtime recovered shader_deps prior shader reports disasm
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          gh run download 33994999358 -n d1-tower-common-layer-texture-census -D prior
          test -f prior/compact/common_material_texture_manifest.json

      - name: Recover Tower plus global shader dependency corpus
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py --package-list reports/packages.txt --out-dir recovered --report reports/current_corpus.json
          python tools/d1_recover_member_catalog.py --catalog evidence/d1_tower_texture_dependency_member_catalog.json \
            --package-list reports/packages.txt --family 0154 --family 0155 --family 0156 --family 0157 --family 0158 --family 01db \
            --out-dir shader_deps --report reports/global_shader_dep_recovery.json
          if [ -f evidence/d1_tower_shader_dependency_member_catalog.json ]; then
            python tools/d1_recover_member_catalog.py --catalog evidence/d1_tower_shader_dependency_member_catalog.json \
              --package-list reports/packages.txt --family 00ec --family 00ee \
              --out-dir shader_deps --report reports/race_shader_dep_recovery.json
          fi
          # The only first-pass gap was native shader 80A3D3AE.  Its exact D1
          # TagHash namespace is package 011E: (80A3D3AE-80800000)>>13 == 0x011E.
          # Reuse the already source-closed weapon-family TAR start used by the
          # 011E weapon workflows rather than guessing a package from the shader name.
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --start-offset 0x439A04A00 \
            --target ps4_gear_weapons_011e_0.pkg --target ps4_gear_weapons_011e_1.pkg \
            --target ps4_gear_weapons_011e_2.pkg --target ps4_gear_weapons_011e_3.pkg \
            --target ps4_gear_weapons_011e_5.pkg --out shader_deps --manifest reports/011e_shader_dep_recovery.json

      - name: Extract all 65 exact common-layer pixel shader families
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered shader_deps -maxdepth 1 -name '*.pkg' -type f | sort -u)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          set +e
          python tools/d1_world_shader_extract.py "${args[@]}" --runtime runtime \
            --manifest prior/compact/common_material_texture_manifest.json --top 65 \
            --out-dir shader --report reports/common65_shader_extract.json
          rc=$?
          set -e
          test "$rc" -eq 0
          python - <<'PY'
          import json
          d=json.load(open('reports/common65_shader_extract.json'))
          ok=[r for r in d['shaders'] if not r.get('error')]
          bad=[r for r in d['shaders'] if r.get('error')]
          s={'requested':len(d['shaders']),'exact':len(ok),'failed':len(bad),
             'failed_rows':[{'shader':r['shader'],'visible_material_count':r.get('visible_material_count'),'error':r.get('error'),'native_shader':r.get('native_shader')} for r in bad]}
          open('reports/common65_shader_extract_summary.json','w').write(json.dumps(s,indent=2)+'\n')
          print(json.dumps(s,indent=2))
          if s != {'requested':65,'exact':65,'failed':0,'failed_rows':[]}:
              raise SystemExit('common shader corpus is not 65/65 exact')
          PY

      - name: Build pinned CLRX disassembler
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/CLRX/CLRX-mirror.git clrx
          git -C clrx checkout --quiet fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df
          test "$(git -C clrx rev-parse HEAD)" = 'fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df'
          cmake -S clrx -B clrx/build -DCMAKE_BUILD_TYPE=Release -DNO_CLWRAPPER=ON -DBUILD_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_DOCUMENTATION=OFF
          cmake --build clrx/build --target clrxdisasm -j2

      - name: Disassemble every resolved common shader
        run: |
          set -euo pipefail
          exe="$(find clrx/build -type f -name clrxdisasm -perm -111 | head -1)"
          test -n "$exe"
          count=0; failures=0
          shopt -s nullglob
          for f in shader/PS_*_gcn.bin; do
            count=$((count+1)); b="$(basename "$f" _gcn.bin)"
            "$exe" --raw --gpuType=GFX700 --hexcode "$f" > "disasm/${b}.s" 2> "disasm/${b}.stderr" || failures=$((failures+1))
            test ! -s "disasm/${b}.stderr" || failures=$((failures+1))
            grep -q 's_endpgm' "disasm/${b}.s" || failures=$((failures+1))
          done
          echo "DISASSEMBLED=$count FAILURES=$failures"
          test "$count" -eq 65
          test "$failures" -eq 0

      - name: Map every native image instruction to exact D1 texture register
        run: |
          set -euo pipefail
          python tools/d1_gcn_image_usage_analyze.py \
            --extract-report reports/common65_shader_extract.json \
            --disasm-dir disasm --out reports/common65_gcn_image_usage.json \
            | tee reports/common65_gcn_image_usage_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/common65_gcn_image_usage.json'))
          e=json.load(open('reports/common65_shader_extract.json'))
          freq={r['shader']:int(r.get('visible_material_count',0)) for r in e['shaders']}
          pr=[]
          for r in d.get('shaders',[]):
              pr.append({'shader':r.get('shader'),'visible_material_count':freq.get(r.get('shader'),0),
                         'image_instruction_count':r.get('image_instruction_count',0),
                         'image_ops':r.get('image_opcodes',[]),'texture_registers':r.get('used_texture_indices',[])})
          pr.sort(key=lambda x:(-x['visible_material_count'],x['shader'] or ''))
          open('reports/common_shader_semantic_priority.json','w').write(json.dumps(pr,indent=2)+'\n')
          if len(pr)!=65: raise SystemExit(f'expected 65 usage rows, got {len(pr)}')
          print(json.dumps(pr[:15],indent=2))
          PY

      - name: Validate already-proven roles against common shader corpus
        run: |
          set -euo pipefail
          python tools/d1_validate_shader_texture_roles.py \
            --image-usage reports/common65_gcn_image_usage.json \
            --manifest prior/compact/common_material_texture_manifest.json \
            --out reports/common65_shader_texture_role_validation.json \
            | tee reports/common65_shader_texture_role_validation_stdout.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-common65-pixel-shader-disassembly
          path: |
            reports/
            shader/
            disasm/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
