name: D1 Cross-Activity Terrain PS Frontier

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-cross-activity-terrain-ps-frontier.yml'
      - 'tools/d1_world_terrain_census.py'
      - 'tools/d1_world_terrain_ps_resource_census.py'

permissions:
  contents: read

env:
  LINOODLE_SKIP_DLLMAIN: '1'

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: plaguelands
            activity: '817DA002'
          - scope: hiveship
            activity: '8128E008'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover runtime, archive index, and Activity roots
        shell: bash
        env:
          ACTIVITY: ${{ matrix.activity }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q numpy
          mkdir -p runtime packages expanded out/work/root
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll'             -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so'             -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl -fsSL --retry 8             'https://github.com/lizardpeter/destiny-1/releases/download/d1-global-activity-index-r1/D1_CURRENT_ACTIVITY_INDEX.json'             -o out/index.json
          curl -fsSL --retry 4             'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt'             -o out/packages.txt
          python tools/d1_world_activity_root_dependency_closure_universal.py             --index out/index.json --package-list out/packages.txt             --activity "$ACTIVITY" --runtime runtime --package-dir packages             --work-dir out/work/root --root-out out/activity_map_roots.json             --report out/activity_root_dependency_closure.json

      - name: Resolve terrain targets and typed dependencies
        shell: bash
        run: |
          set -euo pipefail
          census_layers () {
            mapfile -t files < <(find packages expanded -maxdepth 1 -name '*.pkg' -type f | sort -u)
            args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
            python tools/d1_world_map_data_layer_census_v2.py "${args[@]}" --runtime runtime               --map-root-json out/activity_map_roots.json --out out/map_layers.json
          }
          census_terrain () {
            local dst="$1"
            mapfile -t files < <(find packages expanded -maxdepth 1 -name '*.pkg' -type f | sort -u)
            args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
            set +e
            python tools/d1_world_terrain_census.py "${args[@]}" --runtime runtime               --layer-census out/map_layers.json --out "$dst"
            rc=$?
            set -e
            test "$rc" -eq 0 -o "$rc" -eq 2
          }
          recover_report_missing () {
            local report="$1" label="$2"
            python - "$report" <<'PY' > out/missing_ids.txt
          import json,sys
          d=json.load(open(sys.argv[1]))
          for p in sorted((d.get('missing_dependency_package_ids') or {}).keys()):
              print(p)
          PY
            if [ -s out/missing_ids.txt ]; then
              args=(); while read -r p; do args+=(--package-id "$p"); done < out/missing_ids.txt
              python tools/d1_recover_indexed_package_families.py                 --index out/index.json --package-list out/packages.txt                 "${args[@]}" --out-dir expanded --report "out/${label}_recovery.json"
            fi
          }

          census_layers
          # First terrain pass may reveal exact target package IDs. Recover and
          # repeat the layer census so resource_target metadata becomes complete.
          census_terrain out/terrain_pass1.json
          recover_report_missing out/terrain_pass1.json terrain_pass1
          census_layers
          for pass in 2 3 4; do
            census_terrain "out/terrain_pass${pass}.json"
            cp "out/terrain_pass${pass}.json" out/terrain_census_final.json
            recover_report_missing "out/terrain_pass${pass}.json" "terrain_pass${pass}"
            if [ ! -s out/missing_ids.txt ]; then break; fi
            census_layers
          done
          python - <<'PY'
          import json
          d=json.load(open('out/terrain_census_final.json'))
          assert d['status']=='D1_WORLD_TERRAIN_CENSUS_COMPLETE',d
          assert not d['violations'] and not d['missing_dependency_package_ids'],d
          print('TERRAIN_CLOSED',{
            k:d[k] for k in (
              'terrain_resource_occurrence_count','unique_terrain_count',
              'selected_main_geom0_part_count','unique_selected_material_count',
              'unique_dyemap_count'
            )
          })
          PY

      - name: Close selected terrain materials to native PS resources
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3 4; do
            mapfile -t files < <(find packages expanded -maxdepth 1 -name '*.pkg' -type f | sort -u)
            args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
            set +e
            python tools/d1_world_terrain_ps_resource_census.py "${args[@]}" --runtime runtime               --terrain-census out/terrain_census_final.json               --out "out/terrain_ps_resources_pass${pass}.json"
            rc=$?
            set -e
            test "$rc" -eq 0 -o "$rc" -eq 2
            cp "out/terrain_ps_resources_pass${pass}.json" out/terrain_ps_resources_final.json
            python - "$pass" <<'PY' > out/missing_ps_ids.txt
          import json,sys
          d=json.load(open(f'out/terrain_ps_resources_pass{sys.argv[1]}.json'))
          for p in sorted((d.get('missing_dependency_package_ids') or {}).keys()):
              print(p)
          PY
            if [ ! -s out/missing_ps_ids.txt ]; then break; fi
            rargs=(); while read -r p; do rargs+=(--package-id "$p"); done < out/missing_ps_ids.txt
            python tools/d1_recover_indexed_package_families.py               --index out/index.json --package-list out/packages.txt               "${rargs[@]}" --out-dir expanded --report "out/ps_recovery_pass${pass}.json"
          done
          python - <<'PY'
          import json
          d=json.load(open('out/terrain_ps_resources_final.json'))
          assert d['status']=='D1_WORLD_TERRAIN_PS_RESOURCE_CENSUS_COMPLETE',d
          assert not d['violations'] and not d['missing_dependency_package_ids'],d
          print('TERRAIN_PS_CLOSED',{
            k:d[k] for k in (
              'selected_material_count','unique_pixel_shader_count',
              'native_stage_histogram','native_texture_api_slot_histogram'
            )
          })
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-cross-activity-terrain-ps-${{ matrix.scope }}
          path: out/
          if-no-files-found: error
          retention-days: 30
