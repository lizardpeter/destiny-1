name: D1 Spektar Pandion texcoord2 lane census

on:
  push:
    paths:
      - '.github/workflows/d1-spektr-pandion-texcoord2-lanes.yml'
      - 'tools/d1_guardian_texcoord2_lane_probe.py'
      - 'tools/d1_guardian_visual_context_probe.py'
      - 'tools/d1_entity_model_export.py'
      - 'tools/d1_entity_model_probe.py'
      - 'evidence/d1_investment_asset_member_catalog.json'
      - 'evidence/d1_player_gear_member_catalog.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install parser dependencies and verified Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install -q numpy trimesh
          mkdir -p runtime out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Probe exact Spektar secondary stream lanes
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_guardian_texcoord2_lane_probe.py \
            --model 80A8274E --model 80A85682 --model 809FDB1E --model 80A816E4 --model 80A862BA \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --member-catalog evidence/d1_player_gear_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/spektar_texcoord2_lane_probe.json

      - name: Validate complete five-model census
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/spektar_texcoord2_lane_probe.json'))
          assert d['schema']=='d1_guardian_texcoord2_lane_probe/v1',d
          assert d['model_count']==5,d
          assert d['mesh_count']>0,d
          assert sum(d['stride_pair_distribution'].values())==d['mesh_count'],d
          assert sum(d['uv0_source_distribution'].values())==d['mesh_count'],d
          print('SPEKTAR TEXCOORD2 RAW LANE CENSUS COMPLETE')
          print('stride pairs',d['stride_pair_distribution'])
          print('uv0 sources',d['uv0_source_distribution'])
          for m in d['models']:
              print('MODEL',m)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-spektr-pandion-texcoord2-lanes
          path: out/
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
