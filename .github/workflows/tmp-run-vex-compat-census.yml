name: Temporary run Vex animation-proxy compatibility census

on:
  push:
    paths:
      - '.github/workflows/tmp-run-vex-compat-census.yml'
  pull_request:
    paths:
      - '.github/workflows/tmp-run-vex-compat-census.yml'

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover proven base corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corpus runtime out notes/generated
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          for f in \
            ps4_arch_vex_com01_0767_0.pkg \
            ps4_arch_vex_00e2_0.pkg \
            ps4_globals_0156_0.pkg \
            ps4_globals_0157_0.pkg \
            ps4_globals_0157_1.pkg; do
            echo "Downloading $f"
            curl --fail --location --retry 3 --connect-timeout 20 "$base/$f" -o "corpus/$f"
            stat -c '%n %s bytes' "corpus/$f"
            sha256sum "corpus/$f"
          done

      - name: Recover and verify Oodle runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' \
            -o runtime/oo2core_3_win64.dll
          test "$(stat -c '%s' runtime/oo2core_3_win64.dll)" = '894752'
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' \
            -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Run compatibility probes
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/tools"
          for f in \
            ps4_arch_vex_com01_0767_0.pkg \
            ps4_arch_vex_00e2_0.pkg \
            ps4_globals_0156_0.pkg \
            ps4_globals_0157_0.pkg \
            ps4_globals_0157_1.pkg; do
            python tools/d1_animation_proxy_compat_probe.py "corpus/$f" \
              --runtime runtime \
              --include-all \
              --include-backlinks \
              -o "out/${f%.pkg}.compat.json"
          done

      - name: Merge evidence and write readable ranking
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json
          from pathlib import Path

          reports=[]
          for p in sorted(Path('out').glob('*.compat.json')):
              data=json.loads(p.read_text())
              pkg=data['packages'][0]
              raw=Path('corpus')/Path(pkg['package']).name
              pkg['sha256']=hashlib.sha256(raw.read_bytes()).hexdigest()
              reports.append(pkg)

          combined={
              'classification':'816CE09A is treated as an animation-bundle/proxy model, not a final visible model',
              'ranking_is_heuristic':True,
              'target':{
                  'proxy_model':'816CE09A','skeleton':'816CE092','runtime_rig':'816CE095',
                  'runtime_component_fingerprint':'76F7A98E','bone_count':12
              },
              'packages':reports,
          }
          Path('notes/generated/PS4_09A_VISIBLE_MODEL_COMPAT_CENSUS.json').write_text(json.dumps(combined,indent=2)+'\n')

          rows=[]
          for pkg in reports:
              name=Path(pkg['package']).name
              for c in (pkg.get('all_candidates') or pkg.get('candidates') or []):
                  rows.append((c['score'],name,c))
          rows.sort(key=lambda x:(-x[0],x[1],x[2]['parent_tag_hash']))

          lines=[
              '# PS4 `816CE09A` visible-model compatibility census','',
              'Generated from retail base-package bytes using `tools/d1_animation_proxy_compat_probe.py`.','',
              '**Important:** `816CE09A` is treated here as an animation-bundle/proxy model. The scores below are triage evidence, not ownership proof.','',
              '## Corpus',''
          ]
          for pkg in reports:
              lines += [
                  f"- `{Path(pkg['package']).name}` — SHA-256 `{pkg['sha256']}`, entries {pkg['entry_count']}, standard model parents {pkg['standard_model_parent_count']}, decoded {len(pkg.get('decoded_skeletons',[]))} skeleton EntityResources, compatible 12-bone skeletons {len(pkg.get('compatible_skeleton_hashes',[]))}, component-fingerprint sources {len(pkg.get('component_fingerprint_sources',[]))}",
              ]
          lines += ['','## Global candidate ranking','']
          if rows:
              for i,(score,name,c) in enumerate(rows[:40],1):
                  ev='; '.join(c.get('evidence') or []) or 'structural baseline only'
                  lines += [
                      f"### {i}. `{c['parent_tag_hash']} -> {c['model_tag_hash']}` — score **{score}** — `{name}`",
                      '',
                      f"- evidence: {ev}",
                      f"- graph distance from rig seeds: `{c.get('graph_distance_from_rig_seeds')}`",
                      f"- compatible skeleton co-refs: `{c.get('co_referenced_compatible_skeletons',[])}`",
                      f"- component co-occurrence sources: `{c.get('co_referenced_component_sources',[])}`",
                      f"- shared-hash co-refs: `{c.get('co_referenced_shared_hashes',{})}`",
                      f"- model features: `{c.get('model_features',{})}`",
                      '',
                  ]
          else:
              lines += ['No standard visible-model candidates were decoded from this corpus.','']

          lines += ['','## Direct target-fingerprint observations','']
          for pkg in reports:
              name=Path(pkg['package']).name
              lines += [
                  f"### `{name}`",'',
                  f"- `76F7A98E` structured sources: `{pkg.get('component_fingerprint_sources',[])}`",
                  f"- decoded 12-bone skeleton hashes: `{pkg.get('compatible_skeleton_hashes',[])}`",''
              ]

          lines += [
              '## Interpretation rule','',
              'A candidate is not promoted to the final visible Vex body from score alone. It still requires byte-proven entity/skeleton/control compatibility, successful animation retargeting, its own exact external-material resolution, and Blender validation.',''
          ]
          Path('notes/PS4_09A_VISIBLE_MODEL_COMPAT_CENSUS.md').write_text('\n'.join(lines))
          print('\n'.join(lines[:160]))
          PY

      - name: Commit text-only evidence
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/PS4_09A_VISIBLE_MODEL_COMPAT_CENSUS.md notes/generated/PS4_09A_VISIBLE_MODEL_COMPAT_CENSUS.json
          git commit -m 'Record 09A visible-model compatibility census'
          git push

      - name: Upload census evidence
        uses: actions/upload-artifact@v4
        with:
          name: vex-09a-visible-model-compat-census
          path: |
            out/*.json
            notes/PS4_09A_VISIBLE_MODEL_COMPAT_CENSUS.md
            notes/generated/PS4_09A_VISIBLE_MODEL_COMPAT_CENSUS.json
          retention-days: 1
          if-no-files-found: error
