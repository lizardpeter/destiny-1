name: D1 Tower first two baked-static cells current

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-first-two-static-cells.yml'
      - 'tools/d1_tower_map_schema_validate_v3.py'
      - 'tools/d1_tower_static_chunk_export_v3.py'
      - 'tools/d1_tower_static_chunk_export_v2.py'
      - 'tools/d1_tower_static_chunk_export.py'

permissions:
  contents: read

jobs:
  export-two-cells:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install dependencies and Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy trimesh
          mkdir -p runtime recovered validation export reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Discover exact current 0250 + 009F + full 0157 families
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python - <<'PY'
          import json,re
          from pathlib import Path
          names=[Path(x.strip()).name for x in Path('reports/packages.txt').read_text(errors='replace').splitlines() if x.strip()]
          groups={
            'tower_0250':sorted(x for x in names if re.match(r'^ps4_city_tower_destination_0250_[0-9]+\.pkg$',x,re.I)),
            'arch_009f':sorted(x for x in names if re.match(r'^ps4_arch_human_earth_city_009f_[0-9]+\.pkg$',x,re.I)),
            'globals_0157':sorted(x for x in names if re.match(r'^ps4_globals_0157_[0-9]+\.pkg$',x,re.I)),
          }
          if not all(groups.values()): raise SystemExit(f'missing required current family: {groups}')
          # Current archive must not silently regress to the historical _0/_1-only 0157 corpus.
          suffixes=[int(re.search(r'_(\d+)\.pkg$',x).group(1)) for x in groups['globals_0157']]
          if max(suffixes) < 2:
              raise SystemExit(f'current 0157 family unexpectedly has no post-_1 snapshots: {groups["globals_0157"]}')
          members=sorted(set(sum(groups.values(),[])))
          Path('reports/current_target_families.json').write_text(json.dumps({**groups,'members':members},indent=2)+'\n')
          Path('reports/target_members.txt').write_text('\n'.join(members)+'\n')
          print(json.dumps(groups,indent=2))
          PY

      - name: Sparse recover current required package members
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar
          wanted=set(Path('reports/target_members.txt').read_text().splitlines())
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=90)
          found,headers=arc.find(wanted)
          missing=sorted(wanted-set(found))
          if missing: raise SystemExit(f'missing archive members: {missing}')
          rows=[]
          for name in sorted(wanted):
              r=found[name]; dst=Path('recovered')/name
              sha=arc.copy_to(r['data_offset'],r['size'],dst)
              rows.append({'name':name,**r,'sha256':sha})
              print('RECOVERED',name,r['size'],sha,flush=True)
          Path('reports/member_catalog.json').write_text(json.dumps({'tar_headers_scanned':headers,'members':rows},indent=2)+'\n')
          PY

      - name: Record current 80AAE174 generation history
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader
          from d1_tower_map_schema_validate_v3 import base
          snaps=sorted(Path('recovered').glob('ps4_globals_0157_*.pkg'),key=lambda p:int(re.search(r'_(\d+)\.pkg$',p.name).group(1)))
          rows=[]
          for p in snaps:
              r=EntryReader(p,Path('runtime'))
              e=r.entries[0x174] if len(r.entries)>0x174 else None
              row={'snapshot':p.name,'entry_count':len(r.entries)}
              if e:
                  row.update({k:e[k] for k in ('index','tag_hash','reference','type','subtype','starting_block','starting_block_offset','file_size')})
                  row['available']=r.available(e['index'])
                  if row['available']:
                      try:
                          b=r.entry(e['index']); row['payload_bytes']=len(b); row['payload_ok']=True
                      except Exception as ex:
                          row['payload_ok']=False; row['payload_error']=repr(ex)
              rows.append(row)
          c=base.Corpus([p.resolve() for p in Path('recovered').glob('*.pkg')],Path('runtime').resolve())
          meta=c.entry_meta('80AAE174'); payload,src=c.payload('80AAE174')
          out={'physical_history':rows,'class_stable_current_meta':meta,'class_stable_payload_source':src,'class_stable_payload_bytes':None if payload is None else len(payload)}
          Path('reports/80AAE174_current_history.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if not meta: raise SystemExit('current 80AAE174 entry absent')
          if payload is None: raise SystemExit('current-class 80AAE174 payload unavailable')
          PY

      - name: Run class-stable static-map validator v3
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_tower_map_schema_validate_v3.py "${args[@]}" --runtime runtime --out validation | tee reports/validator_v3_stdout.txt

      - name: Require both exact cells to pass v3
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('validation/tower_map_schema_validation.json'))
          expected={
            '80CA0B70':('80CA0B96',123,124,556),
            '80CA0C60':('80CA0C6B',304,471,1596),
          }
          summary={}
          for parent,(child,instances,meshes,placements) in expected.items():
              rows=[x for x in d.get('static_map_data',[]) if x.get('hash','').upper()==parent]
              good=[x for x in rows if x.get('ok')]
              if len(good)!=1: raise SystemExit(f'{parent}: passing rows={len(good)}, total rows={len(rows)}')
              c=good[0]['d1_validation']
              if c['hash'].upper()!=child or not c['ok']: raise SystemExit(f'{parent}: child mismatch/fail')
              if c['instance_count']!=instances or not c.get('transform_size_exact'): raise SystemExit(f'{child}: transform invariant failed')
              mesh_count=sum(t['summary']['meshes'] for t in c['static_tables'])
              placement_count=sum(sum(i['instance_count'] for i in t['info_entries']) for t in c['static_tables'])
              if (mesh_count,placement_count)!=(meshes,placements):
                  raise SystemExit(f'{child}: expected {(meshes,placements)}, got {(mesh_count,placement_count)}')
              if not all(t['summary']['all_required_mesh_targets_exist'] and t['summary']['all_info_indices_in_bounds'] for t in c['static_tables']):
                  raise SystemExit(f'{child}: static-table invariant failed')
              summary[parent]={'d1':child,'instances':instances,'meshes':mesh_count,'placements':placement_count,
                               'null_v1_records':sum(t['summary'].get('null_vertices1_sentinel_records',0) for t in c['static_tables'])}
          Path('reports/two_cell_validation_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY

      - name: Export both current binary-passing cells
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_tower_static_chunk_export_v3.py "${args[@]}" --runtime runtime \
            --validation-json validation/tower_map_schema_validation.json --static-map-data 80CA0B70 \
            --out export/TOWER_80CA0B70_STATIC_ASSEMBLY_PROOF_V3.glb \
            --json export/TOWER_80CA0B70_STATIC_ASSEMBLY_PROOF_V3.json | tee reports/export_80CA0B70_stdout.txt
          python tools/d1_tower_static_chunk_export_v3.py "${args[@]}" --runtime runtime \
            --validation-json validation/tower_map_schema_validation.json --static-map-data 80CA0C60 \
            --out export/TOWER_80CA0C60_STATIC_ASSEMBLY_PROOF_V3.glb \
            --json export/TOWER_80CA0C60_STATIC_ASSEMBLY_PROOF_V3.json | tee reports/export_80CA0C60_stdout.txt

      - name: Verify GLBs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import trimesh
          specs=[
            ('80CA0B70',556,Path('export/TOWER_80CA0B70_STATIC_ASSEMBLY_PROOF_V3.glb'),Path('export/TOWER_80CA0B70_STATIC_ASSEMBLY_PROOF_V3.json')),
            ('80CA0C60',1596,Path('export/TOWER_80CA0C60_STATIC_ASSEMBLY_PROOF_V3.glb'),Path('export/TOWER_80CA0C60_STATIC_ASSEMBLY_PROOF_V3.json')),
          ]
          cells=[]
          for h,n,g,j in specs:
              d=json.loads(j.read_text())
              if d['decode_failure_count']!=0 or d['node_instance_count']!=n: raise SystemExit(f'{h}: export invariant failed')
              s=trimesh.load(g,force='scene',process=False)
              cells.append({'static_map':h,'d1':d['d1_static_map_data'],'placed_nodes':n,'geometry_variants':d['geometry_variant_count'],
                            'scene_geometry':len(s.geometry),'scene_graph_nodes':len(s.graph.nodes),
                            'bounds':s.bounds.tolist() if s.bounds is not None else None,'glb_bytes':g.stat().st_size})
          out={'status':'TWO_CURRENT_BINARY_VALIDATED_INNER_STATIC_CELLS_EXPORTED',
               'outer_transform':'Both map-owned target entries are independently proven identity in evidence/d1_tower_map_owned_outer_chains_confirmed.json',
               'generation_policy':'Newest FileEntry.Reference defines current class; fallback is same-class only',
               'cells':cells,'total_placed_nodes':sum(x['placed_nodes'] for x in cells)}
          Path('reports/two_cell_export_summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-first-two-baked-static-cells-current
          path: |
            export/
            reports/
            validation/tower_map_schema_validation.json
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
