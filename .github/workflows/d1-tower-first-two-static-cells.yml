name: D1 Tower first two baked-static cells

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-first-two-static-cells.yml'
      - 'tools/d1_tower_map_schema_validate_v2.py'
      - 'tools/d1_tower_static_chunk_export.py'
      - 'tools/d1_tower_static_chunk_export_v2.py'

permissions:
  contents: read

jobs:
  export-two-cells:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install dependencies and Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy trimesh
          mkdir -p runtime recovered validation export reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Direct-range recover exact 0250 + 009F corpus and 0157 dependency pair
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar

          # 0250 + 009F positions and SHA-256 are from successful binary-validator
          # run 33944444030 / artifact 9962935387. 0157 offsets/sizes are from the
          # independently successful cross-package resource census catalog in
          # evidence/d1_weapon_globals_member_catalog.json. The known 0250/009F
          # SHA checks pin this run to the same archive layout before 0157 is trusted.
          pinned=[
            ('ps4_arch_human_earth_city_009f_0.pkg',2870153216,269680640,'7446d5c4b8c2ca3fed6bb0b13a649ff68052a8a2fcfa3aae1b38bf8356c54813'),
            ('ps4_arch_human_earth_city_009f_1.pkg',3139834368,32270336,'e5907ac4b5ba8256c23b667b5f1b237b729db824503a225c9b39daad993d7719'),
            ('ps4_arch_human_earth_city_009f_2.pkg',3172105216,203638784,'467047bcfab0281f0f1a69ea2e43038c9e1bc616b0214f1cdc62eb7666844b24'),
            ('ps4_arch_human_earth_city_009f_4.pkg',3375744512,116736,'0f58f8042d96852a1641e4b4378d2b6f7316b15ba8c6294cd5674e5ac61dc504'),
            ('ps4_city_tower_destination_0250_0.pkg',7882616320,294875136,'beb269a2673f1106e2eff20ff577d0221d7fa56a8b71f5f8763cf34272114b32'),
            ('ps4_city_tower_destination_0250_1.pkg',8177491968,17983488,'87904a97ce9899305b6bdba9df960d220749b3b2398c4ba8bd97e6efb8f81f91'),
            ('ps4_city_tower_destination_0250_2.pkg',8195475968,11143168,'7543c1926023ec76ff8949618e04e1d0a93609f8448a1f8f875fcfc505a6b219'),
            ('ps4_city_tower_destination_0250_3.pkg',8206619648,206848,'1db9423081f922b78cce256641dfab195e6a4b4afb6020e4e0c5029234f19375'),
            ('ps4_city_tower_destination_0250_4.pkg',8206827008,17901568,'5a9370d60724622fb6592a7bcfa2fc4dbb40a4fca5cd696ce8db086a5756e84f'),
            ('ps4_city_tower_destination_0250_5.pkg',8224729088,1677312,'2066afe09503eee4c35d948f6749a6e7b7b02572dcd41d1d3ca679fa523ea22c'),
          ]
          deps=[
            ('ps4_globals_0157_0.pkg',int('46AF91600',16),206192640),
            ('ps4_globals_0157_1.pkg',int('477435800',16),30326784),
          ]
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=90)
          rows=[]
          for name,off,size,expected in pinned:
              dst=Path('recovered')/name
              got=arc.copy_to(off,size,dst)
              if got.lower()!=expected.lower():
                  raise SystemExit(f'{name}: archive identity/SHA mismatch {got} != {expected}')
              rows.append({'name':name,'data_offset':off,'size':size,'sha256':got,'sha_pinned':True})
              print('RECOVERED PINNED',name,size,got,flush=True)
          for name,off,size in deps:
              dst=Path('recovered')/name
              got=arc.copy_to(off,size,dst)
              rows.append({'name':name,'data_offset':off,'size':size,'sha256':got,'sha_pinned':False,
                           'offset_source':'evidence/d1_weapon_globals_member_catalog.json'})
              print('RECOVERED DEP',name,size,got,flush=True)
          Path('reports/member_catalog.json').write_text(json.dumps({
            'pinned_validator_run':33944444030,
            'dependency_offset_source':'evidence/d1_weapon_globals_member_catalog.json',
            'members':rows
          },indent=2)+'\n')
          PY

      - name: Validate package IDs and target 0157 dependency entry
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_tower_map_schema_validate import Corpus
          snaps=sorted(Path('recovered').glob('*.pkg'))
          c=Corpus([p.resolve() for p in snaps],Path('runtime').resolve())
          m=c.entry_meta('80AAE174')
          if not m:
              raise SystemExit('required 0157 buffer header 80AAE174 is absent from recovered corpus')
          b,src=c.payload('80AAE174')
          if b is None:
              raise SystemExit(f'80AAE174 metadata exists but payload is unavailable: {m}')
          print('0157_TARGET_AVAILABLE',m,'payload_source',src,'payload_bytes',len(b))
          PY

      - name: Run corrected static-map validator v2
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_tower_map_schema_validate_v2.py "${args[@]}" --runtime runtime --out validation | tee reports/validator_v2_stdout.txt

      - name: Require both map-owned cells to pass v2
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('validation/tower_map_schema_validation.json'))
          expected={
            '80CA0B70':('80CA0B96',123,124,556),
            '80CA0C60':('80CA0C6B',304,471,1596),
          }
          summary={}
          for parent,(child,instances,meshes,placements) in expected.items():
              rows=[x for x in d.get('static_map_data',[]) if x.get('hash','').upper()==parent]
              good=[x for x in rows if x.get('ok')]
              if len(good)!=1:
                  raise SystemExit(f'{parent}: expected one passing row, got rows={len(rows)} good={len(good)}')
              c=good[0]['d1_validation']
              if c['hash'].upper()!=child or not c['ok']:
                  raise SystemExit(f'{parent}: child mismatch/fail {c.get("hash")} ok={c.get("ok")}')
              if c['instance_count']!=instances or not c.get('transform_size_exact'):
                  raise SystemExit(f'{child}: unexpected transform count/inexact backing')
              mesh_count=sum(t['summary']['meshes'] for t in c['static_tables'])
              place_count=sum(sum(i['instance_count'] for i in t['info_entries']) for t in c['static_tables'])
              if mesh_count!=meshes or place_count!=placements:
                  raise SystemExit(f'{child}: expected meshes/placements {meshes}/{placements}, got {mesh_count}/{place_count}')
              if not all(t['summary']['all_required_mesh_targets_exist'] and t['summary']['all_info_indices_in_bounds'] for t in c['static_tables']):
                  raise SystemExit(f'{child}: v2 table invariant failed')
              summary[parent]={'d1':child,'instances':instances,'meshes':mesh_count,'placements':place_count,
                               'null_v1_records':sum(t['summary'].get('null_vertices1_sentinel_records',0) for t in c['static_tables'])}
          open('reports/two_cell_validation_summary.json','w').write(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY

      - name: Export both corrected baked-static proof cells
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_tower_static_chunk_export_v2.py "${args[@]}" \
            --runtime runtime --validation-json validation/tower_map_schema_validation.json \
            --static-map-data 80CA0B70 \
            --out export/TOWER_80CA0B70_STATIC_ASSEMBLY_PROOF_V2.glb \
            --json export/TOWER_80CA0B70_STATIC_ASSEMBLY_PROOF_V2.json \
            | tee reports/export_80CA0B70_stdout.txt
          python tools/d1_tower_static_chunk_export_v2.py "${args[@]}" \
            --runtime runtime --validation-json validation/tower_map_schema_validation.json \
            --static-map-data 80CA0C60 \
            --out export/TOWER_80CA0C60_STATIC_ASSEMBLY_PROOF_V2.glb \
            --json export/TOWER_80CA0C60_STATIC_ASSEMBLY_PROOF_V2.json \
            | tee reports/export_80CA0C60_stdout.txt

      - name: Verify both GLBs and write combined summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import trimesh
          specs=[
            ('80CA0B70',556,Path('export/TOWER_80CA0B70_STATIC_ASSEMBLY_PROOF_V2.glb'),Path('export/TOWER_80CA0B70_STATIC_ASSEMBLY_PROOF_V2.json')),
            ('80CA0C60',1596,Path('export/TOWER_80CA0C60_STATIC_ASSEMBLY_PROOF_V2.glb'),Path('export/TOWER_80CA0C60_STATIC_ASSEMBLY_PROOF_V2.json')),
          ]
          out=[]
          for h,n,glb,jp in specs:
              d=json.loads(jp.read_text())
              if d['decode_failure_count']!=0: raise SystemExit(f'{h}: decode failures {d["decode_failure_count"]}')
              if d['node_instance_count']!=n: raise SystemExit(f'{h}: nodes {d["node_instance_count"]} != {n}')
              s=trimesh.load(glb,force='scene',process=False)
              out.append({'static_map':h,'d1':d['d1_static_map_data'],'placed_nodes':n,
                          'geometry_variants':d['geometry_variant_count'],'scene_geometry':len(s.geometry),
                          'scene_graph_nodes':len(s.graph.nodes),'bounds':s.bounds.tolist() if s.bounds is not None else None,
                          'glb_bytes':glb.stat().st_size,'decode_failures':0})
          report={'status':'TWO_BINARY_VALIDATED_INNER_STATIC_CELLS_EXPORTED',
                  'matrix_convention':'raw Tiger column-vector 0x40 matrices',
                  'outer_world_placement_status':'PENDING MapDataEntry +0x88 ResourcePointer validation; cells are not merged into one world-space Tower scene yet',
                  'cells':out,'total_placed_nodes':sum(x['placed_nodes'] for x in out)}
          Path('reports/two_cell_export_summary.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-first-two-baked-static-cells
          path: |
            export/
            reports/
            validation/tower_map_schema_validation.json
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
