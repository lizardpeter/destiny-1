name: D1 Tower 80C88434 entity selector probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-80c88434-entity-selector-probe.yml'
      - 'tools/d1_remote_tower_80c88434_entity_selector_probe.py'

permissions: {contents: read, actions: read}
env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {GH_TOKEN: '${{ github.token }}', LINOODLE_SKIP_DLLMAIN: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact catalog and runtime
        run: |
          set -euo pipefail; mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Trace selector literals and resource deltas
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_tower_80c88434_entity_selector_probe.py
          python tools/d1_remote_tower_80c88434_entity_selector_probe.py --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime -o out/D1_TOWER_80C88434_ENTITY_SELECTOR_PROBE.json | tee out/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/D1_TOWER_80C88434_ENTITY_SELECTOR_PROBE.json'))
          assert d['status']=='D1_TOWER_80C88434_ENTITY_SELECTOR_PROBE_COMPLETE',d['violations']
          assert len(d['entities'])==3,d
          assert d['gates']['visible_variant0_material_selected'] is False,d
          print('80C88434_ENTITY_SELECTOR_PROBE_PERSISTED')
          PY
      - name: Persist hashes
        if: always()
        run: find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: D1-TOWER-80C88434-ENTITY-SELECTOR-PROBE, path: out/, retention-days: 90, if-no-files-found: error}
