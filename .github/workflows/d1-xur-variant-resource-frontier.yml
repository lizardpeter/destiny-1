name: D1 Xur shared-NPC variant resource frontier

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-variant-resource-frontier.yml'
      - 'tools/d1_remote_catalog_entity_resource_probe.py'
      - 'tools/d1_entity_resource_probe.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog and runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Decode the only two unexplained identity-varying Resource slots
        run: |
          set -euo pipefail
          python tools/d1_remote_catalog_entity_resource_probe.py \
            --tag-hash 80C88191 --tag-hash 80C88192 --tag-hash 80C8833E --tag-hash 80C8833F \
            --tag-hash 80C889B3 --tag-hash 80C889B4 --tag-hash 80C885C7 \
            --tag-hash 80C88022 --tag-hash 80C88023 --tag-hash 80C88036 --tag-hash 80C88037 \
            --tag-hash 80C88048 --tag-hash 80C88049 --tag-hash 80C88CE1 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            -o out/SHARED_NPC_VARIANT_RESOURCES.json | tee out/stdout.txt
          python - <<'PY'
          import json,collections
          d=json.load(open('out/SHARED_NPC_VARIANT_RESOURCES.json'))
          assert d['status']=='D1_CATALOG_ENTITY_RESOURCE_PROBE_EXACT' and not d['violations'],d
          fam34=['80C88191','80C88192','80C8833E','80C8833F','80C889B3','80C889B4','80C885C7']
          fam36=['80C88022','80C88023','80C88036','80C88037','80C88048','80C88049','80C88CE1']
          rows={r['tag_hash']:r for r in d['entries']}
          def summarize(name,hs):
              print('FAMILY',name)
              sigs={}
              for h in hs:
                  r=rows[h];er=r['entity_resource']
                  matches=[(m['offset_hex'],m['tag_hash'],m['reference'],m['package_id']) for m in r.get('aligned_resolved_tag_matches',[]) if m['tag_hash']!=h]
                  sig=((er.get('unk10') or {}).get('class_hash'),(er.get('unk18') or {}).get('class_hash'),r['payload_size'])
                  sigs.setdefault(sig,[]).append(h)
                  print('VARIANT',h,'SIG',sig,'MATCHES',matches)
              print('SIGNATURE_GROUPS',sigs)
              # Compare resolved dependency offsets.  Values that change at a fixed offset are prime selector edges.
              byoff={}
              for h in hs:
                  for m in rows[h].get('aligned_resolved_tag_matches',[]):
                      if m['tag_hash']==h: continue
                      byoff.setdefault(m['offset_hex'],{})[h]=(m['tag_hash'],m['reference'],m['package_id'])
              for off,vals in sorted(byoff.items(),key=lambda kv:int(kv[0],16)):
                  uniq=set(vals.values())
                  print('OFFSET',off,'ALL_PRESENT',len(vals)==len(hs),'UNIQUE',len(uniq),'VALUES',vals)
          summarize('owner_resource_slot_34',fam34)
          summarize('owner_resource_slot_36',fam36)
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-XUR-SHARED-NPC-VARIANT-RESOURCE-FRONTIER
          path: out/
          retention-days: 30
          if-no-files-found: error
