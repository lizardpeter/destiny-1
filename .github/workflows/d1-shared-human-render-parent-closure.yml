name: D1 shared-human render-parent closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-shared-human-render-parent-closure.yml'
      - 'tools/d1_remote_render_parent_context_probe.py'
      - 'tools/d1_render_owner_probe.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog and runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Decode exact shared model parent and complete external material banks
        run: |
          set -euo pipefail
          python tools/d1_remote_render_parent_context_probe.py \
            --entity-resource 80C88CE2 --expected-model 80C88CEF \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            -o out/SHARED_HUMAN_RENDER_PARENT.json | tee out/stdout.txt
          python - <<'PY'
          import json,collections
          d=json.load(open('out/SHARED_HUMAN_RENDER_PARENT.json'))
          assert d['error_count']==0 and len(d['rows'])==1,d
          p=d['rows'][0]['render_parent']
          assert p['embedded_model_tag_hash']=='80C88CEF',p
          mats=p['external_material_tag_hashes']; mp=p['external_materials_map_entries']
          print('MODEL',p['embedded_model_tag_hash'])
          print('TEXTURE_PLATES',p['texture_plates_roi_entries'])
          print('EXTERNAL_MAP_COUNT',len(mp),'EXTERNAL_MATERIAL_COUNT',len(mats))
          multi=[]
          for r in mp:
              c=r['material_count'];s=r['material_start_index']
              bank=mats[s:s+c] if c>0 and 0<=s<=len(mats) else []
              print('VARIANT',r['variant_shader_index'],'COUNT',c,'START',s,'UNK08',r['unk08'],'BANK',bank)
              if c>1: multi.append({'variant_shader_index':r['variant_shader_index'],'materials':bank})
          print('MULTI_MATERIAL_VARIANTS',multi)
          xur={'80C885E6','80C885E7','80C885E8','80C885E9','80C885EA'}
          print('XUR_BANK_POSITIONS',{h:[i for i,x in enumerate(mats) if x==h] for h in sorted(xur)})
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-SHARED-HUMAN-RENDER-PARENT-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
