name: D1 shared-human render-parent closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-shared-human-render-parent-closure.yml'
      - 'tools/d1_remote_render_parent_context_probe.py'
      - 'tools/d1_render_owner_probe.py'
      - 'tools/d1_remote_tag_payload_dump.py'
      - 'tools/d1_entity_model_probe.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog and runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out/payloads
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Decode exact shared model parent and material permutation tables
        run: |
          set -euo pipefail
          python tools/d1_remote_render_parent_context_probe.py \
            --entity-resource 80C88CE2 --expected-model 80C88CEF \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            -o out/SHARED_HUMAN_RENDER_PARENT.json | tee out/stdout.txt
          python tools/d1_remote_tag_payload_dump.py \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            --tag 80C88CEF --tag 80C88CE2 --out-dir out/payloads --report out/PAYLOADS.json
          python - <<'PY'
          import json,collections,sys,struct
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entity_model_probe import parse_model

          d=json.load(open('out/SHARED_HUMAN_RENDER_PARENT.json'))
          assert d['error_count']==0 and len(d['rows'])==1,d
          p=d['rows'][0]['render_parent']
          assert p['embedded_model_tag_hash']=='80C88CEF',p
          mats=p['external_material_tag_hashes']; mp=p['external_materials_map_entries']
          desc=p['external_material_permutation_descriptors']
          aux=p['external_material_aux_index_values']
          model=parse_model(Path('out/payloads/80C88CEF.bin').read_bytes(),'PS4')
          rb=Path('out/payloads/80C88CE2.bin').read_bytes()
          base=int(p['parent_offset'])
          print('MODEL',p['embedded_model_tag_hash'],'MESHES',model['mesh_count'],'PARENT_BASE',hex(base),'RESOURCE_SIZE',len(rb))
          print('TEXTURE_PLATES',p['texture_plates_roi_entries'])
          print('EXTERNAL_MAP_COUNT',len(mp),'AUX_INDEX_COUNT',len(aux),'DESCRIPTOR_COUNT',len(desc),'EXTERNAL_MATERIAL_COUNT',len(mats))
          print('AUX_INDEX_HEADER',p['external_material_aux_index_table'])
          print('AUX_INDEX_VALUES',aux)
          for r in desc:
              print('PERM_DESC',r['index'],'PAIR0',(r['pair0_count'],r['pair0_start'],r['pair0_aux_indices']),'PAIR1',(r['pair1_count'],r['pair1_start'],r['pair1_aux_indices']))

          for r in mp:
              c=int(r['material_count']); u=int(r['unk08']); s=int(r['material_start_index'])
              assert c>0 and 0<=u and u+c<=len(desc),(r,len(desc))
              assert 0<=s and s+c<=len(mats),(r,len(mats))
          print('PARALLEL_DESCRIPTOR_MATERIAL_SPANS',len(mp),'OK')

          xur={'80C885E6','80C885E7','80C885E8','80C885E9','80C885EA'}
          xur_rows=[]
          for r in mp:
              c=int(r['material_count']); u=int(r['unk08']); s=int(r['material_start_index'])
              for j in range(c):
                  material=mats[s+j]
                  if material in xur:
                      dr=desc[u+j]
                      xur_rows.append({'variant':r['variant_shader_index'],'member':j,'material':material,'descriptor_index':u+j,
                                       'pair0_count':dr['pair0_count'],'pair0_start':dr['pair0_start'],'pair0_aux_indices':dr['pair0_aux_indices'],
                                       'pair1_count':dr['pair1_count'],'pair1_start':dr['pair1_start'],'pair1_aux_indices':dr['pair1_aux_indices']})
          print('XUR_MATERIAL_DESCRIPTOR_ROWS',xur_rows)
          Path('out/XUR_MATERIAL_DESCRIPTOR_ROWS.json').write_text(json.dumps(xur_rows,indent=2)+'\n')

          # Find the D1 counterpart of MIDA's parent-level switch-key/value table.
          # Scan only the 0x290-byte 9C1A8080 parent header. A candidate DynamicArray
          # is admitted only if its pointer resolves inside this exact retail resource.
          def u32(o): return struct.unpack_from('<I',rb,o)[0]
          def q64(o): return struct.unpack_from('<q',rb,o)[0]
          def dyn(field):
              if field<0 or field+16>len(rb): return None
              n=u32(field); rel=q64(field+8); data=field+8+rel+0x10
              if not (0<n<=4096 and 0<=data<len(rb)): return None
              return {'parent_relative':field-base,'count':n,'field_offset':field,'data_offset':data,'relative':rel,'pad04':u32(field+4)}
          candidates=[]
          for ro in range(0,0x290-15,4):
              x=dyn(base+ro)
              if x: candidates.append(x)
          print('PARENT_DYNAMIC_ARRAY_CANDIDATES',candidates)
          Path('out/PARENT_DYNAMIC_ARRAY_CANDIDATES.json').write_text(json.dumps(candidates,indent=2)+'\n')

          # The +0x250 int16 table contains values up to 53, so a switch-record
          # source must have at least 54 rows if these are direct record indices.
          # Test every candidate with >=54 rows against the later-Tiger 0x18-byte
          # record shape (nested DynamicArray at +0x8), but report rather than assume.
          nested_reports=[]
          for ca in candidates:
              if ca['count']<54: continue
              for stride in (0x18,0x20,0x28,0x30):
                  if ca['data_offset']+ca['count']*stride>len(rb): continue
                  rows=[]; valid=0; hashpairs=[]
                  for i in range(ca['count']):
                      eo=ca['data_offset']+i*stride
                      na=dyn(eo+8)
                      rr={'index':i,'entry_offset':eo,'nested':na}
                      if na and na['count']<=32 and na['data_offset']+na['count']*8<=len(rb):
                          valid+=1
                          pairs=[]
                          for j in range(na['count']):
                              po=na['data_offset']+j*8
                              pairs.append((f'{u32(po):08X}',f'{u32(po+4):08X}'))
                          rr['hash_pairs']=pairs; hashpairs.extend(pairs)
                      rows.append(rr)
                  rep={'candidate_parent_relative':ca['parent_relative'],'count':ca['count'],'stride':stride,
                       'valid_nested_count':valid,'unique_hash_pair_count':len(set(hashpairs)),'rows':rows}
                  nested_reports.append(rep)
                  if valid:
                      print('SWITCH_TABLE_SHAPE_CANDIDATE',hex(ca['parent_relative']),ca['count'],'STRIDE',hex(stride),'VALID_NESTED',valid,'UNIQUE_PAIRS',len(set(hashpairs)))
                      if valid>=min(ca['count'],54):
                          print('SWITCH_TABLE_FULL_ROWS',rep)
          Path('out/SWITCH_TABLE_SHAPE_SCAN.json').write_text(json.dumps(nested_reports,indent=2)+'\n')

          corr=[]
          for mi,mesh in enumerate(model['meshes']):
              for pi,part in enumerate(mesh['parts']):
                  v=int(part['variant_shader_index'])
                  if v < 0 or v >= len(mp): continue
                  mr=mp[v]
                  corr.append({'mesh':mi,'part':pi,'variant':v,'external_identifier':int(part['external_identifier']),
                               'dye':int(part['gear_dye_change_color_index']),'lod':part['lod'],
                               'unk1a':int(part['unk1a']),'unk1b':int(part['unk1b']),'flags_d1':int(part['flags_d1']),
                               'unk20':int(part['unk20']),'lod_run':int(part['lod_run']),
                               'descriptor_start':int(mr['unk08']),'material_count':int(mr['material_count'])})
          Path('out/PART_PERMUTATION_CORRELATION.json').write_text(json.dumps({'rows':corr},indent=2)+'\n')
          print('PART_COUNT_WITH_EXTERNAL_VARIANT',len(corr))
          print('EXTERNAL_IDENTIFIER_COUNTS',dict(sorted(collections.Counter(r['external_identifier'] for r in corr).items())))
          print('DYE_COUNTS',dict(sorted(collections.Counter(r['dye'] for r in corr).items())))
          PY
          find out -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-SHARED-HUMAN-RENDER-PARENT-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
