name: D1 Crota 808EE505 final texture resource closure v1

on:
  workflow_dispatch:
  push:
    branches: [d1-crota-source-semantics-v1]
    paths:
      - '.github/workflows/d1-crota-808ee505-final-texture-resource-closure-v1.yml'

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

permissions:
  contents: read
  actions: read

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install exact texture export Python dependencies
        run: |
          set -euo pipefail
          python -m pip install -q numpy pillow texture2ddecoder trimesh
      - name: Recover exact universal package catalog
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Export exact final resource bindings
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_texture_export.py \
            --tag-hash 0x808EE4FE --tag-hash 0x808EE500 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --out out/textures | tee out/texture_export_stdout.txt
          python - <<'PY'
          import json,pathlib
          m=json.load(open('out/textures/remote_texture_manifest.json'))
          assert m['requested_texture_hashes']==['808EE4FE','808EE500'],m
          assert m['requested_count']==2 and m['resolved_count']==2 and not m['missing_requested'],m
          assert len(m['textures'])==2
          by={x['header']:x for x in m['textures']}
          assert set(by)=={'808EE4FE','808EE500'},set(by)
          for h,x in by.items():
              assert x.get('png') and not x.get('png_error'),(h,x)
              print('TEXTURE',h,'OWNER',x.get('owner_package'),'SIZE',x.get('width'),x.get('height'),'FORMAT',x.get('format'),'CLASS',x.get('resource_class'),'BACKING',x.get('backing'))
          pf=json.load(open('out/textures/remote_texture_preflight.json'))
          assert pf['requested_count']==2 and pf['success_count']==2 and pf['failure_count']==0,pf
          pathlib.Path('out/D1_CROTA_808EE505_FINAL_TEXTURE_RESOURCE_CLOSURE.json').write_text(json.dumps({'status':'D1_CROTA_808EE505_FINAL_TEXTURE_RESOURCES_EXACT','shader':'808EE505','textures':m['textures'],'preflight':pf},indent=2)+'\n')
          PY
          sha256sum out/D1_CROTA_808EE505_FINAL_TEXTURE_RESOURCE_CLOSURE.json out/textures/*.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-CROTA-808EE505-FINAL-TEXTURE-RESOURCE-CLOSURE-V1
          path: out/
          retention-days: 30
          if-no-files-found: error
