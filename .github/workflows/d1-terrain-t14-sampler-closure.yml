name: D1 Terrain T14 Sampler Closure

on:
  push:
    paths:
      - '.github/workflows/d1-terrain-t14-sampler-closure.yml'
      - 'tools/d1_world_terrain_sampler_census.py'
      - 'tools/d1_material_decode.py'
      - 'tools/d1_ps4_sampler_probe.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  NATIVE_PS_ARTIFACT_ID: '10058234988'
  NATIVE_PS_ARTIFACT_SHA256: '458dd3a2a3496760c78b2feaa72be29767c6fb6ec514afb0ec9c67623047d91f'
  LINOODLE_SKIP_DLLMAIN: '1'

jobs:
  sampler-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover authoritative native terrain PS evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input runtime packages expanded out
          curl -fsSL --retry 4             -H "Authorization: Bearer $GH_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${NATIVE_PS_ARTIFACT_ID}/zip"             -o input/native.zip
          echo "${NATIVE_PS_ARTIFACT_SHA256}  input/native.zip" | sha256sum --check --strict
          unzip -q input/native.zip -d input/native
          resources="$(find input/native -name terrain_ps_resources_final.json -type f -print -quit)"
          dataflow="$(find input/native -name FINAL_CROTA_TERRAIN_NATIVE_PS_DATAFLOW.json -type f -print -quit)"
          test -n "$resources" -a -n "$dataflow"
          cp "$resources" out/terrain_ps_resources_final.json
          cp "$dataflow" out/FINAL_CROTA_TERRAIN_NATIVE_PS_DATAFLOW.json

      - name: Recover archive index and Oodle runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll'             -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so'             -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl -fsSL --retry 8             'https://github.com/lizardpeter/destiny-1/releases/download/d1-global-activity-index-r1/D1_CURRENT_ACTIVITY_INDEX.json'             -o out/D1_CURRENT_ACTIVITY_INDEX.json
          curl -fsSL --retry 4             'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt'             -o out/packages.txt

      - name: Recover selected terrain material package families
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/terrain_ps_resources_final.json'))
          ids=sorted({str(x.get('required_package_id')).lower() for x in d['materials'] if x.get('required_package_id')})
          open('out/material_package_ids.txt','w').write(''.join(x+'\n' for x in ids))
          print('material package ids',ids)
          PY
          args=()
          while read -r p; do args+=(--package-id "$p"); done < out/material_package_ids.txt
          python tools/d1_recover_indexed_package_families.py             --index out/D1_CURRENT_ACTIVITY_INDEX.json             --package-list out/packages.txt             "${args[@]}"             --out-dir packages             --report out/material_package_recovery.json

      - name: Close every T14 sampler with dependency recovery
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3 4; do
            mapfile -t files < <(find packages expanded -maxdepth 1 -name '*.pkg' -type f | sort -u)
            args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
            set +e
            python tools/d1_world_terrain_sampler_census.py               "${args[@]}"               --runtime runtime               --terrain-resources out/terrain_ps_resources_final.json               --native-dataflow out/FINAL_CROTA_TERRAIN_NATIVE_PS_DATAFLOW.json               --out "out/terrain_t14_sampler_pass${pass}.json"
            rc=$?
            set -e
            test "$rc" -eq 0 -o "$rc" -eq 2
            cp "out/terrain_t14_sampler_pass${pass}.json" out/D1_TERRAIN_T14_SAMPLER_CLOSURE.json
            python - "$pass" <<'PY'
          import json,sys
          p=sys.argv[1]
          d=json.load(open(f'out/terrain_t14_sampler_pass{p}.json'))
          ids=sorted((d.get('missing_dependency_package_ids') or {}).keys())
          open('out/missing_sampler_package_ids.txt','w').write(''.join(x+'\n' for x in ids))
          print('SAMPLER_PASS',p,d['status'],'closed',d['closed_t14_material_count'],'/',d['selected_t14_material_count'],'missing',ids)
          PY
            if [ ! -s out/missing_sampler_package_ids.txt ]; then break; fi
            rargs=()
            while read -r p; do rargs+=(--package-id "$p"); done < out/missing_sampler_package_ids.txt
            python tools/d1_recover_indexed_package_families.py               --index out/D1_CURRENT_ACTIVITY_INDEX.json               --package-list out/packages.txt               "${rargs[@]}"               --out-dir expanded               --report "out/sampler_package_recovery_pass${pass}.json"
          done

      - name: Enforce exact T14 sampler closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/D1_TERRAIN_T14_SAMPLER_CLOSURE.json'))
          assert d['status']=='D1_TERRAIN_T14_SAMPLER_CLOSURE_COMPLETE',d
          assert d['t14_shader_count']==91,d
          assert d['closed_t14_material_count']==d['selected_t14_material_count'],d
          assert not d['missing_dependency_package_ids'] and not d['violations'],d
          print('D1_TERRAIN_T14_SAMPLERS_CLOSED',
                'materials',d['closed_t14_material_count'],
                'api_slots',d['t14_sampler_api_slot_histogram'],
                'unique_native_samplers',d['unique_t14_sampler_hash_count'])
          PY
          find out -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-terrain-t14-sampler-closure
          path: out/
          if-no-files-found: error
          retention-days: 30
