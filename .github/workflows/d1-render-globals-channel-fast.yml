name: D1 Render Globals Channel Fast Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/d1-render-globals-channel-fast.yml"
      - "tools/d1_remote_entry_reference_class_scan.py"
      - "tools/d1_remote_filehash_probe.py"
      - "tools/d1_global_channel_defaults_decode.py"

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: https://crypt.cohae.dev/destiny/ps4/packages/latest
      LINOODLE_SKIP_DLLMAIN: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Recover current package list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source reports runtime
          idx_run="$(gh run list --workflow d1-global-activity-index.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$idx_run"
          gh run download "$idx_run" -n d1-global-activity-index -D source
          cp "$(find source -name packages.txt -print -quit)" reports/packages.txt

      - name: Install exact Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll'             -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so'             -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Scan bounded RenderGlobals package families in parallel
        run: |
          set -euo pipefail
          mkdir -p reports/scans
          printf '%s\n'             0x0151 0x0154 0x0155 0x0156 0x0157 0x0158             0x072B 0x072F 0x0735 0x018D 0x0172 0x01A3           | xargs -P 6 -I{} bash -c '
              set -euo pipefail
              id="{}"
              safe="${id#0x}"
              python tools/d1_remote_entry_reference_class_scan.py                 --package-id "$id"                 --reference 80801BB0                 --package-list reports/packages.txt                 --runtime runtime                 --base-url "$BASE_URL"                 --out "reports/scans/render_globals_${safe}.json"
            '
          python - <<'PY'
          import json, glob
          files=sorted(glob.glob('reports/scans/render_globals_*.json'))
          scans=[json.load(open(p)) for p in files]
          hits=[]
          packages=[]
          violations=[]
          for s in scans:
              packages.extend(s.get('packages',[]))
              hits.extend(s.get('hits',[]))
              violations.extend(s.get('violations',[]))
          readable=[x for x in hits if x.get('available') and x.get('payload_size',0)>=0x38 and not x.get('violations')]
          if len(readable)!=1:
              raise SystemExit(f'expected one readable exact 80801BB0 RenderGlobals hit, got {[(x.get("package_id"),x.get("tag_hash"),x.get("payload_size")) for x in readable]}; all hits={[(x.get("package_id"),x.get("tag_hash"),x.get("violations")) for x in hits]}')
          hit=readable[0]
          raw=bytes.fromhex(hit['prefix256'])
          channels=int.from_bytes(raw[0x34:0x38],'little')
          if channels in (0,0xffffffff):
              raise SystemExit(f'RenderGlobals +0x34 is null: {channels:08X}')
          out={
              'schema':'d1_render_globals_parallel_class_scan/v1',
              'status':'EXACT_CURRENT_RENDER_GLOBALS_CLASS_HIT',
              'reference':'80801BB0',
              'scanned_package_ids':[p.get('package_id') for p in packages],
              'hit':hit,
              'global_channel_defaults_tag':f'{channels:08X}',
              'violations':violations,
              'proof_boundary':'One exact current logical FileEntry.Reference 80801BB0 hit across the bounded global/startup family set. +0x34 is preserved as a FileHash-like u32 and decoded separately before semantic promotion.'
          }
          open('reports/current_render_globals_fast.json','w').write(json.dumps(out,indent=2)+'\n')
          open('reports/render_globals_tag.txt','w').write(hit['tag_hash']+'\n')
          open('reports/global_channel_defaults_tag.txt','w').write(f'{channels:08X}\n')
          print(json.dumps({
              'render_globals_package':hit['package_id'],
              'render_globals_tag':hit['tag_hash'],
              'global_channel_defaults_tag':f'{channels:08X}',
              'payload_sha256':hit.get('payload_sha256')
          },indent=2))
          PY

      - name: Decode exact current GlobalChannelDefaults rows
        run: |
          set -euo pipefail
          channels_tag="$(tr -d '\r\n' < reports/global_channel_defaults_tag.txt)"
          mkdir -p reports/payloads
          python tools/d1_remote_filehash_probe.py             --tag-hash "$channels_tag"             --package-list reports/packages.txt             --runtime runtime             --base-url "$BASE_URL"             --payload-out-dir reports/payloads             --out reports/current_global_channel_defaults_probe.json
          python tools/d1_global_channel_defaults_decode.py             "reports/payloads/$channels_tag.bin"             --tag-hash "$channels_tag"             --index 0x11 --index 0x28 --index 0x30 --index 0x60             --require-requested-in-range             --out reports/current_global_channel_defaults_decoded.json
          python - <<'PY'
          import json
          d=json.load(open('reports/current_global_channel_defaults_decoded.json'))
          rows=d.get('channels') or d.get('requested_channels') or d
          print(json.dumps({
              'status':'CURRENT_GLOBAL_CHANNEL_DEFAULTS_DECODED',
              'source_tag':d.get('source_hash') or d.get('tag_hash'),
              'requested':rows
          },indent=2)[:20000])
          PY

      - name: Persist exact current channel evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/generated
          cp reports/current_render_globals_fast.json             evidence/generated/d1_current_render_globals_fast.json
          cp reports/current_global_channel_defaults_probe.json             evidence/generated/d1_current_global_channel_defaults_probe.json
          cp reports/current_global_channel_defaults_decoded.json             evidence/generated/d1_current_global_channel_defaults_decoded.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             evidence/generated/d1_current_render_globals_fast.json             evidence/generated/d1_current_global_channel_defaults_probe.json             evidence/generated/d1_current_global_channel_defaults_decoded.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record current D1 lighting channel defaults'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-render-globals-channel-fast
          path: reports/
          retention-days: 7
