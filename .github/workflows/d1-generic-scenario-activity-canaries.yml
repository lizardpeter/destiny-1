name: D1 generic scenario activity canaries

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-generic-scenario-activity-canaries.yml'
      - 'tools/d1_remote_activity_graph_extract.py'
      - 'tools/d1_remote_activity_f603_resource_census.py'
      - 'tools/d1_activity_stage_resource_matrix.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  scenario-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: vault_of_glass
            hash: 80FE0103
            name: 'venus_raid_1:scenario_client'
          - id: kings_fall
            hash: 812700B9
            name: 'raid_epiphany:scenario_client'
          - id: cosmo_strike
            hash: 80CB84FA
            name: 'strike_reliquary:scenario_client'
          - id: plaguelands_patrol
            hash: 8179E047
            name: 'plaguelands_patrol:scenario_client'
          - id: reef_social
            hash: 81194008
            name: 'social_landing:scenario_client'
          - id: anomaly_pvp
            hash: 80D8E003
            name: 'pvp_anomaly:scenario_client'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Extract exact scenario activity graph
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_remote_activity_graph_extract.py tools/d1_remote_activity_f603_resource_census.py tools/d1_activity_stage_resource_matrix.py
          python tools/d1_remote_activity_graph_extract.py \
            --activity-hash '${{ matrix.hash }}' --activity-name '${{ matrix.name }}' --activity-class 80800616 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --output-dir 'out/${{ matrix.id }}' \
            | tee 'out/${{ matrix.id }}.orchestrator.txt'
          python - <<'PY'
          import json
          d=json.load(open('out/${{ matrix.id }}/activity_graph_manifest.json'))
          assert d['status']=='D1_REMOTE_ACTIVITY_GRAPH_EXACT',d
          assert d['activity']['tag_hash']=='${{ matrix.hash }}'
          PY
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-GENERIC-SCENARIO-ACTIVITY-${{ matrix.id }}
          path: out/
          retention-days: 30
          if-no-files-found: error
