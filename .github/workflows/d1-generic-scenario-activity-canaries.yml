name: D1 generic scenario activity canaries

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-generic-scenario-activity-canaries.yml'
      - 'tools/d1_remote_activity_graph_extract.py'
      - 'tools/d1_remote_activity_placements.py'
      - 'tools/d1_world_activity_entity_table_census.py'
      - 'tools/d1_world_activity_entity_resource_census.py'
      - 'tools/d1_remote_activity_f603_resource_census.py'
      - 'tools/d1_remote_activity_scripted_entity_census.py'
      - 'tools/d1_world_scripted_entity_identity_census.py'
      - 'tools/d1_remote_s6e_stage_probe.py'
      - 'tools/d1_activity_stage_resource_matrix.py'
      - 'tools/d1_activity_asset_dependency_seeds.py'
      - 'tools/d1_remote_entity_dependency_closure.py'
      - 'tools/d1_remote_entity_dependency_closure_universal.py'
      - 'tools/d1_activity_entity_model_plan.py'
      - 'tools/d1_remote_activity_model_visual_dependency_closure.py'
      - 'tools/d1_remote_activity_model_material_bindings.py'
      - 'tools/d1_filehash.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  scenario-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: vault_of_glass
            hash: '80FE0103'
            name: 'venus_raid_1:scenario_client'
            deep_closure: false
          - id: crotas_end
            hash: '8108E004'
            name: 'moon_raid_1:scenario_client'
            deep_closure: false
          - id: kings_fall
            hash: '812700B9'
            name: 'raid_epiphany:scenario_client'
            deep_closure: false
          - id: wrath
            hash: '8179E00B'
            name: 'raid_promise:scenario_client'
            deep_closure: true
          - id: cosmo_strike
            hash: '80CB84FA'
            name: 'strike_reliquary:scenario_client'
            deep_closure: false
          - id: plaguelands_patrol
            hash: '8179E047'
            name: 'plaguelands_patrol:scenario_client'
            deep_closure: false
          - id: reef_social
            hash: '81194008'
            name: 'social_landing:scenario_client'
            deep_closure: true
          - id: anomaly_pvp
            hash: '80D8E003'
            name: 'pvp_anomaly:scenario_client'
            deep_closure: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Validate universal FileHash decoder
        run: |
          set -euo pipefail
          python tools/d1_filehash.py
          python -m py_compile tools/d1_remote_entity_dependency_closure_universal.py tools/d1_activity_entity_model_plan.py tools/d1_remote_activity_model_visual_dependency_closure.py tools/d1_remote_activity_model_material_bindings.py tools/d1_remote_activity_scripted_entity_census.py tools/d1_world_scripted_entity_identity_census.py

      - name: Extract exact scenario activity graph and dependency seeds
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile \
            tools/d1_remote_activity_graph_extract.py \
            tools/d1_remote_activity_placements.py \
            tools/d1_world_activity_entity_table_census.py \
            tools/d1_world_activity_entity_resource_census.py \
            tools/d1_remote_activity_f603_resource_census.py \
            tools/d1_remote_activity_scripted_entity_census.py \
            tools/d1_world_scripted_entity_identity_census.py \
            tools/d1_remote_s6e_stage_probe.py \
            tools/d1_activity_stage_resource_matrix.py \
            tools/d1_activity_asset_dependency_seeds.py
          python tools/d1_remote_activity_graph_extract.py \
            --activity-hash '${{ matrix.hash }}' --activity-name '${{ matrix.name }}' --activity-class 80800616 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --output-dir 'out/${{ matrix.id }}' \
            | tee 'out/${{ matrix.id }}.orchestrator.txt'
          python tools/d1_activity_asset_dependency_seeds.py \
            --graph-dir 'out/${{ matrix.id }}' \
            -o 'out/${{ matrix.id }}/activity_asset_dependency_seeds.json' \
            | tee 'out/${{ matrix.id }}.asset_seeds.txt'
          python - <<'PY'
          import json
          g=json.load(open('out/${{ matrix.id }}/activity_graph_manifest.json'))
          s=json.load(open('out/${{ matrix.id }}/activity_asset_dependency_seeds.json'))
          x=json.load(open('out/${{ matrix.id }}/activity_scripted_entities.json'))
          assert g['status']=='D1_REMOTE_ACTIVITY_GRAPH_EXACT',g
          assert g['activity']['tag_hash']=='${{ matrix.hash }}'
          assert g['counts']['unique_root_entities'] > 0 or g['counts']['runtime_placements'] == 0,g['counts']
          assert s['status']=='D1_ACTIVITY_ASSET_DEPENDENCY_SEEDS_EXACT',s
          assert s['activity']['tag_hash']=='${{ matrix.hash }}'
          assert s['counts'].get('placement_entities',0) == g['counts']['unique_root_entities'],(s['counts'],g['counts'])
          assert s['counts'].get('s_entities',0) >= s['counts'].get('placement_entities',0)
          assert s['counts'].get('scripted_only_entities',0) == len(set(s['seed_groups'].get('scripted_entities',[]))-set(s['seed_groups'].get('placement_entities',[])))
          assert s['closure_seed_count'] >= s['counts'].get('s_entities',0)
          assert x['status']=='D1_REMOTE_ACTIVITY_SCRIPTED_ENTITY_CENSUS_COMPLETE',x['violations'][:10]
          assert not x['violations'],x['violations'][:10]
          assert sum(x.get('scripted_runtime_relation_counts',{}).values())==x['scripted_record_count'],x
          PY

      - name: Recursively close exact entity/control dependencies
        if: ${{ matrix.deep_closure }}
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          seed_file='out/${{ matrix.id }}/activity_asset_dependency_seeds.json'
          python - "$seed_file" > 'out/${{ matrix.id }}/closure_seeds.txt' <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          for h in d['closure_seed_hashes']:
              print(h)
          PY
          mapfile -t seeds < 'out/${{ matrix.id }}/closure_seeds.txt'
          test "${#seeds[@]}" -gt 0
          args=(); for h in "${seeds[@]}"; do args+=(--seed "$h"); done
          max_nodes=$(( ${#seeds[@]} * 6 + 750 ))
          python tools/d1_remote_entity_dependency_closure_universal.py \
            "${args[@]}" \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --max-depth 7 --max-nodes "$max_nodes" \
            -o 'out/${{ matrix.id }}/entity_dependency_closure.json' \
            | tee 'out/${{ matrix.id }}.entity_closure.txt'
          python - <<'PY'
          import json
          s=json.load(open('out/${{ matrix.id }}/activity_asset_dependency_seeds.json'))
          d=json.load(open('out/${{ matrix.id }}/entity_dependency_closure.json'))
          assert d['status']=='D1_ENTITY_DEPENDENCY_CLOSURE_COMPLETE',d['violations'][:10]
          assert not d['truncated'],d
          assert set(d['seeds'])==set(s['closure_seed_hashes']),(len(d['seeds']),s['closure_seed_count'])
          assert d['node_count']>=s['closure_seed_count'],d
          assert d['typed_edge_count']>=0 and d['untyped_literal_edge_count']>=0,d
          print('ENTITY_CLOSURE', '${{ matrix.id }}', d['node_count'], d['edge_count'], d['typed_edge_count'], len(d['articulated_entities']))
          PY

      - name: Close exact activity EntityModels and visual dependencies
        if: ${{ matrix.deep_closure }}
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_activity_entity_model_plan.py \
            --entity-closure 'out/${{ matrix.id }}/entity_dependency_closure.json' \
            -o 'out/${{ matrix.id }}/activity_entity_model_plan.json' \
            | tee 'out/${{ matrix.id }}.model_plan.txt'
          model_count="$(python - <<'PY'
          import json
          print(json.load(open('out/${{ matrix.id }}/activity_entity_model_plan.json'))['model_count'])
          PY
          )"
          if [ "$model_count" -gt 0 ]; then
            python tools/d1_remote_activity_model_visual_dependency_closure.py \
              --model-plan 'out/${{ matrix.id }}/activity_entity_model_plan.json' \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
              --runtime runtime \
              -o 'out/${{ matrix.id }}/activity_model_visual_dependency_closure.json' \
              | tee 'out/${{ matrix.id }}.model_visual_closure.txt'
          else
            python - <<'PY'
          import json
          d={
            'schema':'d1_remote_activity_model_visual_dependency_closure/v1',
            'status':'D1_REMOTE_ACTIVITY_MODEL_VISUAL_DEPENDENCY_CLOSURE_COMPLETE',
            'source_model_plan':'out/${{ matrix.id }}/activity_entity_model_plan.json',
            'model_count':0,'models':[],'buffer_header_count':0,'buffer_headers':[],
            'backing_payload_count':0,'backing_payload_hashes':[],
            'inline_material_count':0,'inline_materials':[],
            'external_variant_part_count':0,'external_variant_parts':[],
            'rows':[],'typed_edges':[],'typed_edge_count':0,'violations':[],
            'policy':'Exact empty visual closure: the source-typed activity entity closure contains no s_entity_model nodes.'
          }
          json.dump(d,open('out/${{ matrix.id }}/activity_model_visual_dependency_closure.json','w'),indent=2);open('out/${{ matrix.id }}/activity_model_visual_dependency_closure.json','a').write('\n')
          print('STATUS',d['status'],'MODELS',0)
          PY
          fi
          python - <<'PY'
          import json
          p=json.load(open('out/${{ matrix.id }}/activity_entity_model_plan.json'))
          d=json.load(open('out/${{ matrix.id }}/activity_model_visual_dependency_closure.json'))
          assert p['status']=='D1_ACTIVITY_ENTITY_MODEL_PLAN_COMPLETE',p['violations']
          assert d['status']=='D1_REMOTE_ACTIVITY_MODEL_VISUAL_DEPENDENCY_CLOSURE_COMPLETE',d['violations'][:10]
          assert d['model_count']==p['model_count'],(d['model_count'],p['model_count'])
          assert not d['violations'],d['violations']
          print('MODEL_VISUAL', '${{ matrix.id }}', d['model_count'], d['buffer_header_count'], d['backing_payload_count'], d['inline_material_count'], d['external_variant_part_count'])
          PY

      - name: Resolve exact external material variants
        if: ${{ matrix.deep_closure }}
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_activity_model_material_bindings.py \
            --entity-closure 'out/${{ matrix.id }}/entity_dependency_closure.json' \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime \
            -o 'out/${{ matrix.id }}/activity_model_material_bindings.json' \
            | tee 'out/${{ matrix.id }}.material_bindings.txt'
          python - <<'PY'
          import json
          v=json.load(open('out/${{ matrix.id }}/activity_model_visual_dependency_closure.json'))
          m=json.load(open('out/${{ matrix.id }}/activity_model_material_bindings.json'))
          assert m['status']=='D1_REMOTE_ACTIVITY_MODEL_MATERIAL_BINDINGS_COMPLETE',m['violations'][:10]
          assert m['validated_pair_count']==m['model_parent_pair_count'],m
          inline=set(v.get('inline_materials',[]))
          selected=set(m.get('selected_materials',[]))
          union=sorted(inline|selected)
          unresolved_models=sorted({x['model'] for x in v.get('external_variant_parts',[])}-{x['model'] for x in m.get('bindings',[])})
          plan={
            'schema':'d1_activity_selected_material_plan/v1',
            'status':'D1_ACTIVITY_SELECTED_MATERIAL_PLAN_COMPLETE' if not unresolved_models else 'D1_ACTIVITY_SELECTED_MATERIAL_PLAN_PARTIAL',
            'inline_material_count':len(inline),'owner_selected_material_count':len(selected),
            'unique_material_count':len(union),'materials':union,
            'visual_external_variant_part_count':v.get('external_variant_part_count',0),
            'owner_external_variant_part_count':m.get('external_variant_part_count',0),
            'unresolved_external_variant_models':unresolved_models,
            'policy':'Material union contains exact inline model materials plus exact owner-selected materials. External variants without an exact model-parent owner remain unresolved rather than guessed.'
          }
          json.dump(plan,open('out/${{ matrix.id }}/activity_selected_material_plan.json','w'),indent=2);open('out/${{ matrix.id }}/activity_selected_material_plan.json','a').write('\n')
          print('MATERIAL_PLAN', '${{ matrix.id }}', plan['status'], plan['unique_material_count'], 'UNRESOLVED_VARIANT_MODELS',len(unresolved_models))
          PY

      - name: Hash outputs
        if: always()
        run: |
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-GENERIC-SCENARIO-ACTIVITY-${{ matrix.id }}
          path: out/
          retention-days: 30
          if-no-files-found: error
