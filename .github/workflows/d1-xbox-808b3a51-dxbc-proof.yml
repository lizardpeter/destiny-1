name: D1 Xbox 808B3A51 exact DXBC proof

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xbox-808b3a51-dxbc-proof.yml'
      - 'tools/d1_xbox_dxbc_target_extract.py'
      - 'tools/d1_dxbc_probe.py'
      - 'tools/d1_entry_extract.py'
      - 'tools/d1_material_decode.py'

permissions:
  contents: read

jobs:
  dxbc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install tools and recover exact user-shared retail package
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          sudo apt-get update -qq
          sudo apt-get install -y -qq vkd3d-compiler
          mkdir -p runtime retail out reports
          gdown --id '1ZlnqOedZoCBE1oUoiFfIUFKSsJZJZm6D' -O retail/xboxone_arch_cabal_0059_1.pkg
          echo '8836546ecbbbf6ba31fd50035a180c80c7bcb6407780f4b61be7a8217d24fde8  retail/xboxone_arch_cabal_0059_1.pkg' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          vkd3d-compiler --version | tee reports/vkd3d_version.txt
          vkd3d-compiler -x dxbc-tpf --print-target-types | tee reports/vkd3d_dxbc_targets.txt

      - name: Extract exact material and DXBC from retail bytes
        run: |
          set -euo pipefail
          python tools/d1_xbox_dxbc_target_extract.py \
            retail/xboxone_arch_cabal_0059_1.pkg --runtime runtime \
            --material 808B3A48 --expect-ps 808B3A51 \
            --out-dir out --report reports/808B3A51_exact_dxbc.json \
            | tee reports/808B3A51_exact_dxbc_stdout.txt
          python tools/d1_dxbc_probe.py retail/xboxone_arch_cabal_0059_1.pkg --runtime runtime \
            --material 808B3A48 -o reports/808B3A48_dxbc_probe.json
          python - <<'PY'
          import json
          d=json.load(open('reports/808B3A51_exact_dxbc.json'))
          assert d['status']=='D1_XBOX_EXACT_DXBC_TARGET_EXTRACTED',d
          assert d['material']=='808B3A48' and d['pixel_shader']=='808B3A51',d
          dec=d['dxbc']['declarations']
          assert [x['register'] for x in dec['textures']]==[0,1],dec
          assert [x['register'] for x in dec['samplers']]==[1,2],dec
          assert {'register':0,'vec4_count':7} in dec['cbuffers'],dec
          assert {'register':13,'vec4_count':2} in dec['cbuffers'],dec
          print('EXACT_808B3A51_DXBC_DECLARATIONS_GREEN')
          PY

      - name: Disassemble exact DXBC token stream
        run: |
          set -euo pipefail
          if grep -q 'd3d-asm' reports/vkd3d_dxbc_targets.txt; then
            vkd3d-compiler -x dxbc-tpf -b d3d-asm --formatting=offsets,header,signatures \
              out/808B3A51.dxbc > reports/808B3A51.d3dasm
          else
            echo 'd3d-asm target unavailable' >&2
            exit 2
          fi
          test -s reports/808B3A51.d3dasm
          grep -E 'cb13|cbuffer|t0|t1|sample|mad|mul' reports/808B3A51.d3dasm | tee reports/808B3A51_key_lines.txt || true
          sha256sum out/* reports/808B3A51.d3dasm | tee reports/808B3A51_output_sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-xbox-808b3a51-exact-dxbc-proof
          path: |
            out/
            reports/
          retention-days: 14
          compression-level: 6
