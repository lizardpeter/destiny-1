name: D1 Tower 80CA0B97 inline array probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-80ca0b97-inline-array-probe.yml'
      - 'tools/d1_remote_ps4_material_array_window_probe.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  BASE_URL: 'https://crypt.cohae.dev/destiny/ps4/packages/latest'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal corpus routing
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Probe both exact card materials around PS inline state
        run: |
          set -euo pipefail
          python tools/d1_remote_ps4_material_array_window_probe.py \
            --material 80B9E8C2 --material 80B9E8C3 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url "$BASE_URL" --part-count 10 --runtime runtime \
            --start 0x2E0 --end 0x340 -o out/80CA0B97_CARD_PS_ARRAY_WINDOW.json
          python - <<'PY'
          import json
          d=json.load(open('out/80CA0B97_CARD_PS_ARRAY_WINDOW.json'))
          assert d['status']=='D1_REMOTE_PS4_MATERIAL_ARRAY_WINDOW_PROBE_COMPLETE' and not d['violations'],d
          assert len(d['materials'])==2
          for r in d['materials']:
              k=r['known_arrays']
              assert k['ps_textures']['count']==2 and k['ps_textures']['in_bounds'],r
              assert k['ps_tfx_bytecode']['count'] in (51,78) and k['ps_tfx_bytecode']['in_bounds'],r
              assert k['ps_samplers']['count']==2 and k['ps_samplers']['in_bounds'],r
              print('CARD_ARRAYS',r['material'],'candidates',[(hex(x['header_offset']),x['count'],hex(x['absolute_offset']),x['vec4_values']) for x in r['plausible_vec4_arrays']])
          PY
          sha256sum out/*.json > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-TOWER-80CA0B97-EXACT-INLINE-ARRAY-PROBE
          path: out/
          retention-days: 30
          if-no-files-found: error
          compression-level: 6
