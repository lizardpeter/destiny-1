name: D1 GCN SGPR and M0 SSA v1

on:
  workflow_dispatch:
  push:
    branches:
      - d1-crota-source-semantics-v1
    paths:
      - tools/d1_gcn_sgpr_machine_semantics_v1.py
      - tools/d1_gcn_sgpr_ssa_v1.py
      - tools/d1_gcn_sgpr_ssa_corpus_replay_v1.py
      - tools/d1_gcn_m0_implicit_frontier_v1.py
      - tools/d1_gcn_exec_mask_semantics_v1.py
      - tools/d1_gcn_exec_symbolic_dataflow_v1.py
      - .github/workflows/d1-gcn-sgpr-ssa-v1.yml

permissions:
  actions: read
  contents: read

env:
  STRUCTURAL_ARTIFACT_ID: "10087524653"
  STRUCTURAL_ARTIFACT_ZIP_SHA256: "d806e55c856546df11416e0677989a34f5b454189d10f713da38b93501ec50fb"
  STRUCTURAL_CENSUS_SHA256: "5477f5a4194303b266dabdb22b10f050001011b1f61708c18877736273f800ed"

  SGPR_FRONTIER_ARTIFACT_ID: "10108920407"
  SGPR_FRONTIER_ARTIFACT_ZIP_SHA256: "bdb949bfa55acb418ec1fd7d9b83b412cb25f5f77cd1b3303b935e22ccf008f9"
  SGPR_FRONTIER_REPORT_SHA256: "4786131931a55768faa1c84b9ac7845a31afe281c15a0f12b7f0d17b42e5754c"

  M0_FRONTIER_ARTIFACT_ID: "10109357318"
  M0_FRONTIER_ARTIFACT_ZIP_SHA256: "9c97ef6cb026ff5481b96c53b59e9bf36a5c8be6315a9273ec33009fd4406fee"
  M0_FRONTIER_REPORT_SHA256: "11499032987523e928bfde1a1086bbc599fed8b5a793fd23163536b53219a1c7"

  EXEC_SEMANTICS_BLOB_SHA1: "3f100abaff594335fc2a709dbd4cd2d285d8fcae"
  EXEC_SYMBOLIC_BLOB_SHA1: "17072972b387492346596b83754b758b49531fd5"
  M0_FRONTIER_BLOB_SHA1: "1fbd1757a56004c28d1e69adc98356c02a97dc80"
  SGPR_MACHINE_SEMANTICS_BLOB_SHA1: "b76b8594cb38fee94fed57b556ebc7f5291a1ddc"
  SGPR_SSA_BLOB_SHA1: "235584542a7bcaedc98137811e64c258fab016b3"
  SGPR_REPLAY_BLOB_SHA1: "cfa6e27973edfa225b9c74768b57ce5b8f8941ec"

jobs:
  sgpr-ssa:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pin exact scalar-state implementations
        run: |
          set -euo pipefail
          test "$(git hash-object tools/d1_gcn_exec_mask_semantics_v1.py)" = "$EXEC_SEMANTICS_BLOB_SHA1"
          test "$(git hash-object tools/d1_gcn_exec_symbolic_dataflow_v1.py)" = "$EXEC_SYMBOLIC_BLOB_SHA1"
          test "$(git hash-object tools/d1_gcn_m0_implicit_frontier_v1.py)" = "$M0_FRONTIER_BLOB_SHA1"
          test "$(git hash-object tools/d1_gcn_sgpr_machine_semantics_v1.py)" = "$SGPR_MACHINE_SEMANTICS_BLOB_SHA1"
          test "$(git hash-object tools/d1_gcn_sgpr_ssa_v1.py)" = "$SGPR_SSA_BLOB_SHA1"
          test "$(git hash-object tools/d1_gcn_sgpr_ssa_corpus_replay_v1.py)" = "$SGPR_REPLAY_BLOB_SHA1"
          python tools/d1_gcn_sgpr_machine_semantics_v1.py > /tmp/sgpr_machine_semantics.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/sgpr_machine_semantics.json'))
          assert d['status']=='D1_GCN_SGPR_MACHINE_SEMANTICS_SOURCE_CLOSED',d
          assert len(d['observed_sgpr_def_opcodes'])==31,d
          assert len(d['compare_mask_destination_opcodes'])==12,d
          assert d['rmw_destination_opcodes']==['s_addk_i32'],d
          assert d['shader_expression_semantic_promotions']==0,d
          PY

      - name: Download exact structural corpus
        run: |
          set -euo pipefail
          mkdir -p out source/structural source/sgpr_frontier source/m0_frontier
          curl -fsSL --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STRUCTURAL_ARTIFACT_ID}/zip" \
            -o source/structural.zip
          echo "$STRUCTURAL_ARTIFACT_ZIP_SHA256  source/structural.zip" | sha256sum --check --strict
          unzip -q source/structural.zip \
            'out/D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS_PS_VS_DS.json' \
            'work/ir/*' \
            -d source/structural
          echo "$STRUCTURAL_CENSUS_SHA256  source/structural/out/D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS_PS_VS_DS.json" | sha256sum --check --strict
          test "$(find source/structural/work/ir -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 26464

      - name: Verify frozen SGPR identity frontier
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SGPR_FRONTIER_ARTIFACT_ID}/zip" \
            -o source/sgpr_frontier.zip
          echo "$SGPR_FRONTIER_ARTIFACT_ZIP_SHA256  source/sgpr_frontier.zip" | sha256sum --check --strict
          unzip -q source/sgpr_frontier.zip D1_GCN_SGPR_MACHINE_FRONTIER_V1.json -d source/sgpr_frontier
          echo "$SGPR_FRONTIER_REPORT_SHA256  source/sgpr_frontier/D1_GCN_SGPR_MACHINE_FRONTIER_V1.json" | sha256sum --check --strict
          python - <<'PY'
          import json
          d=json.load(open('source/sgpr_frontier/D1_GCN_SGPR_MACHINE_FRONTIER_V1.json'))
          assert d['status']=='D1_GCN_SGPR_MACHINE_FRONTIER_EXACT',d.get('violations',[])[:20]
          assert not d['violations']
          c=d['coverage']
          assert c['exact_program_count']==26464,c
          assert c['exact_instruction_count']==4896165,c
          assert c['sgpr_def_instruction_count']==610052,c
          assert c['sgpr_def_entry_count']==2056285,c
          assert c['sgpr_use_instruction_count']==1666084,c
          assert c['sgpr_use_entry_count']==4112684,c
          assert c['m0_def_instruction_count']==17894,c
          assert c['m0_use_instruction_count']==0,c
          assert c['max_sgpr_index']==95,c
          assert c['shader_expression_semantic_promotions']==0,c
          PY

      - name: Verify frozen implicit M0 frontier
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${M0_FRONTIER_ARTIFACT_ID}/zip" \
            -o source/m0_frontier.zip
          echo "$M0_FRONTIER_ARTIFACT_ZIP_SHA256  source/m0_frontier.zip" | sha256sum --check --strict
          unzip -q source/m0_frontier.zip D1_GCN_M0_IMPLICIT_FRONTIER_V1.json -d source/m0_frontier
          echo "$M0_FRONTIER_REPORT_SHA256  source/m0_frontier/D1_GCN_M0_IMPLICIT_FRONTIER_V1.json" | sha256sum --check --strict
          python - <<'PY'
          import json
          d=json.load(open('source/m0_frontier/D1_GCN_M0_IMPLICIT_FRONTIER_V1.json'))
          assert d['status']=='D1_GCN_M0_IMPLICIT_FRONTIER_EXACT',d.get('violations',[])[:20]
          assert not d['violations']
          assert not d['unresolved']
          c=d['coverage']
          assert c['exact_program_count']==26464,c
          assert c['exact_instruction_count']==4896165,c
          assert c['explicit_m0_def_instruction_count']==17894,c
          assert c['structural_explicit_m0_use_instruction_count']==0,c
          assert c['implicit_m0_value_use_instruction_count']==425866,c
          assert c['implicit_m0_value_use_category_counts']=={
            'LDS_DS_M0_BOUNDS':490,
            'RELATIVE_GPR_INDEX_M0':6,
            'VINTRP_AUTOMATIC_M0':425370,
          },c
          assert c['unresolved_m0_sensitive_instruction_count']==0,c
          assert c['shader_expression_semantic_promotions']==0,c
          PY

      - name: Replay physical SGPR and M0 SSA globally
        run: |
          set -euo pipefail
          python tools/d1_gcn_sgpr_ssa_corpus_replay_v1.py \
            --workers 4 \
            --ir-dir source/structural/work/ir \
            --structural-census source/structural/out/D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS_PS_VS_DS.json \
            --sgpr-machine-frontier source/sgpr_frontier/D1_GCN_SGPR_MACHINE_FRONTIER_V1.json \
            --m0-implicit-frontier source/m0_frontier/D1_GCN_M0_IMPLICIT_FRONTIER_V1.json \
            -o out/D1_GCN_SGPR_SSA_CORPUS_REPLAY_V1.json \
            | tee out/sgpr_ssa_replay_stdout.txt

      - name: Fail closed on exact global scalar SSA boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/D1_GCN_SGPR_SSA_CORPUS_REPLAY_V1.json'))
          assert d['status']=='D1_GCN_SGPR_SSA_CORPUS_REPLAY_EXACT',d['violations'][:50]
          assert not d['violations']
          c=d['coverage']
          assert c['exact_programs_replayed']==26464,c
          assert c['stage_program_counts']=={'DS':20,'PS':18375,'VS':8069},c
          assert c['exact_instructions_replayed']==4896165,c
          assert c['effect_aware_basic_block_count']==68622,c
          assert c['concrete_cfg_edge_count']==51073,c
          assert c['max_sgpr_index']==95,c
          assert c['sgpr_def_instruction_count']==610052,c
          assert c['sgpr_def_entry_count']==2056285,c
          assert c['sgpr_use_instruction_count']==1666084,c
          assert c['sgpr_use_entry_count']==4112684,c
          assert c['m0_def_instruction_count']==17894,c
          assert c['implicit_m0_use_instruction_count']==425866,c
          assert c['whole_scalar_write_entry_count'] + c['exec_gated_mask_half_write_entry_count'] == 2056285,c
          assert c['scalar_result_component_node_count']==2056285,c
          assert c['whole_scalar_rmw_write_entry_count']==c['implicit_rmw_use_entry_count'],c
          assert c['shader_expression_semantic_promotions']==0,c
          print('D1_GCN_SGPR_SSA_CORPUS_REPLAY_EXACT')
          print(json.dumps(c,sort_keys=True))
          PY
          sha256sum out/D1_GCN_SGPR_SSA_CORPUS_REPLAY_V1.json > out/SHA256SUMS.txt
          printf '%s\n' "$STRUCTURAL_ARTIFACT_ID" > out/SOURCE_STRUCTURAL_ARTIFACT_ID.txt
          printf '%s\n' "$SGPR_FRONTIER_ARTIFACT_ID" > out/SOURCE_SGPR_FRONTIER_ARTIFACT_ID.txt
          printf '%s\n' "$M0_FRONTIER_ARTIFACT_ID" > out/SOURCE_M0_FRONTIER_ARTIFACT_ID.txt
          printf '%s\n' "$GITHUB_SHA" > out/SOURCE_COMMIT_SHA.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-GCN-SGPR-SSA-V1
          path: out/
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
