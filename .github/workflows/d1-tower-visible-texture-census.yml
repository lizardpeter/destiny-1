name: D1 Tower visible material texture census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-visible-texture-census.yml'
      - 'tools/d1_world_material_texture_export.py'
      - 'tools/d1_texture_export.py'
      - 'tools/d1_texture_backing_chain_v1.py'
      - 'tests/test_d1_world_material_texture_strict_chain.py'
      - 'tools/d1_dds_to_png.py'
      - 'tools/d1_material_decode.py'
      - 'tools/d1_tower_recover_current_corpus.py'
      - 'evidence/d1_tower_dependency_member_catalog.json'
      - 'evidence/d1_tower_dependency_sha256_catalog.json'

permissions:
  contents: read
  actions: read

jobs:
  textures:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install dependencies and verified Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install numpy pillow texture2ddecoder
          mkdir -p runtime recovered prior textures reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Download exact nine-cell visual selection sidecars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 33978906679 -n d1-tower-nine-cell-retail-visible-v5 -D prior
          test -f prior/visual/TOWER_80C984D8_VISUAL.json
          test -f prior/visual/TOWER_80CA0C60_VISUAL.json

      - name: Recover current Tower dependency corpus
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py \
            --package-list reports/packages.txt \
            --out-dir recovered \
            --report reports/current_corpus.json

      - name: Export exact visible material texture dependencies
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          mapfile -t vis < <(find prior/visual -maxdepth 1 -name 'TOWER_*_VISUAL.json' -type f | sort)
          vargs=(); for f in "${vis[@]}"; do vargs+=(--visual-json "$f"); done
          python tools/d1_world_material_texture_export.py \
            "${args[@]}" --runtime runtime "${vargs[@]}" --out textures \
            | tee reports/texture_export_stdout.txt
          cp textures/material_texture_manifest.json reports/material_texture_manifest.json
          python - <<'PY'
          import collections,json
          d=json.load(open('textures/material_texture_manifest.json'))
          assert d['texture_backing_policy']=='STRICT_PROVEN_SHAPES_ONLY',d
          ok=[r for r in d['textures'].values() if not r.get('error')]
          bad=[r for r in d['textures'].values() if r.get('error')]
          modes=collections.Counter(r.get('strict_backing_chain_mode') for r in ok)
          assert set(modes).issubset({'direct','two_hop_65_1_to_5_1'}),modes
          assert all(r.get('strict_backing_hash') for r in ok),[r['texture'] for r in ok if not r.get('strict_backing_hash')]
          summary={
            'status':'D1_TOWER_VISIBLE_TEXTURE_STRICT_CHAIN_CENSUS',
            'visible_material_count':d['visible_material_count'],
            'unique_texture_tags':d['unique_texture_tags'],
            'decoded_texture_tags':d['decoded_texture_tags'],
            'texture_errors':d['texture_errors'],
            'strict_chain_mode_histogram':dict(sorted(modes.items())),
            'error_reason_histogram':dict(sorted(collections.Counter(r.get('error') for r in bad).items())),
            'missing_texture_package_ids':d['missing_texture_package_ids'],
          }
          json.dump(summary,open('reports/D1_TOWER_VISIBLE_TEXTURE_STRICT_CHAIN_SUMMARY.json','w'),indent=2)
          print(json.dumps(summary,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-visible-material-textures-v1
          path: |
            textures/
            reports/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
