name: D1 Spektar Pandion full rigged animation

on:
  push:
    paths:
      - '.github/workflows/d1-spektr-pandion-full-rigged-animation.yml'
      - 'tools/d1_guardian_combined_skin_animation.py'
      - 'tools/d1_guardian_inline_skin_probe.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies and exact static Guardian artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy scipy pygltflib pyglm trimesh
          mkdir -p input runtime recovered out
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=d1-spektr-pandion-titan-masculine&per_page=20" \
            | python -c "import json,sys; a=[x for x in json.load(sys.stdin)['artifacts'] if not x['expired']]; print(a[0]['archive_download_url'])")
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$url" -o input/spektar.zip
          unzip -q input/spektar.zip -d input/spektar
          test -f input/spektar/SPEKTAR_PANDION_TITAN_MASCULINE.glb
          test -f input/spektar/spektar_pandion_masculine_export.json
          python - <<'PY'
          import json,os
          d=json.load(open('input/spektar/spektar_pandion_masculine_export.json'))
          assert d['exported_model_count']==5,d
          assert d['total_geometry_count']==69,d
          assert d['total_triangle_count']==28140,d
          print('STATIC SOURCE',d['exported_model_count'],'models',d['total_geometry_count'],'groups',d['total_triangle_count'],'triangles')
          PY
      - name: Recover exact 67-bone retail animation family and Oodle
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --start-offset 0xAAB580800 \
            --target ps4_race_set_all_00ec_0.pkg --target ps4_race_set_all_00ec_1.pkg \
            --target ps4_race_set_all_00ec_2.pkg --target ps4_race_set_all_00ec_3.pkg \
            --target ps4_race_set_all_00ec_4.pkg --target ps4_race_set_all_00ec_5.pkg \
            --out recovered --manifest out/00ec_extract.json --retries 6 --timeout 90
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
          test "$(git -C parser rev-parse HEAD)" = b9fdc3a43dd28118113275624fcc9054b75855f4
      - name: Reconstruct all exact retail skin weights and bind one Guardian armature
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_guardian_combined_skin_animation.py \
            input/spektar/SPEKTAR_PANDION_TITAN_MASCULINE.glb \
            --model-report input/spektar/spektar_pandion_masculine_export.json \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --member-catalog evidence/d1_player_gear_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime \
            --animation-pkg recovered/ps4_race_set_all_00ec_5.pkg --parser-root parser \
            --skeleton 809D8613 --rig 809D856E --clip 809D8572 \
            --animation-name STATE_13433E07_809D8572 \
            --out out/SPEKTAR_PANDION_TITAN_MASCULINE_FULL_RIGGED_ANIMATED.glb \
            --report out/full_guardian_report.json
      - name: Validate complete glTF skin and animation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from pygltflib import GLTF2
          p=Path('out/SPEKTAR_PANDION_TITAN_MASCULINE_FULL_RIGGED_ANIMATED.glb')
          r=json.load(open('out/full_guardian_report.json'))
          g=GLTF2().load_binary(str(p));blob=g.binary_blob()
          assert r['model_count']==5,r
          assert r['original_mesh_count']==69,r
          assert r['bound_primitive_count']==69,r
          assert r['skin_joint_count']==67,r
          assert r['runtime_rig_control_count']==67,r
          assert r['clip_frame_count']==324,r
          assert r['decoded_track_count']==r['retargeted_track_count']==r['local_track_count']==67,r
          assert len(g.skins)==1 and len(g.skins[0].joints)==67
          assert len(g.animations)==1 and g.animations[0].name=='STATE_13433E07_809D8572'
          mesh_nodes=[n for n in g.nodes if n.mesh is not None]
          assert len(mesh_nodes)==69,len(mesh_nodes)
          assert all(n.skin==0 for n in mesh_nodes)
          assert any(n.name=='b_head' for n in g.nodes)
          def read_acc(idx):
              a=g.accessors[idx];v=g.bufferViews[a.bufferView];off=(v.byteOffset or 0)+(a.byteOffset or 0)
              comps={'SCALAR':1,'VEC2':2,'VEC3':3,'VEC4':4,'MAT4':16}[a.type]
              dt={5123:'<u2',5126:'<f4'}[a.componentType]
              return np.frombuffer(blob,dtype=dt,count=a.count*comps,offset=off).reshape((a.count,comps))
          verts=0;bones=set();multi=0
          for m in g.meshes:
              assert len(m.primitives)==1
              prim=m.primitives[0]
              assert prim.attributes.JOINTS_0 is not None and prim.attributes.WEIGHTS_0 is not None
              j=read_acc(prim.attributes.JOINTS_0);w=read_acc(prim.attributes.WEIGHTS_0)
              assert len(j)==len(w)==g.accessors[prim.attributes.POSITION].count
              assert np.allclose(np.sum(w,axis=1),1.0,atol=1e-6)
              assert np.all(j[w>0] < 67)
              verts+=len(j);bones.update(int(x) for x in j[w>0]);multi+=int(np.count_nonzero(np.count_nonzero(w>0,axis=1)>1))
          assert verts==r['bound_vertex_count'],(verts,r['bound_vertex_count'])
          assert multi>0,multi
          assert {1,11,18,21,22} <= bones,bones
          print(json.dumps({'bytes':p.stat().st_size,'models':r['model_count'],'meshes':len(g.meshes),
                            'bound_vertices':verts,'multi_weight_vertices':multi,'bone_domain':sorted(bones),
                            'skin_joints':len(g.skins[0].joints),'clip_frames':r['clip_frame_count'],
                            'animation_channels':r['animation_channel_count']},indent=2))
          PY
          sha256sum out/SPEKTAR_PANDION_TITAN_MASCULINE_FULL_RIGGED_ANIMATED.glb | tee out/sha256.txt
      - name: Provenance README
        run: |
          cat > out/README.txt <<'EOF'
          Destiny 1 Rise of Iron - complete Spektar Pandion Titan masculine rigged proof

          Five exact named retail equipment models:
            Gauntlets 80A8274E
            Plate     80A85682
            Mark      809FDB1E
            Helmet    80A816E4
            Greaves   80A862BA

          Playable Guardian body rig family:
            skeleton 809D8613 (67 nodes)
            runtime rig 809D856E (67 controls; 75F560CA x67)
            animation clip 809D8572 (324 frames / 67 nodes / 67 controls)
            clip control 809D856F, state hash 13433E07 (semantic name still unknown)

          D1 ROI skinning is reconstructed directly from primary vertex bytes:
            stride 0x0C ordinary W -> rigid one-bone skin
            stride 0x0C W +/-0x7FFF -> inline 2-index / 2-weight skin
            stride 0x10 -> inline 4-weight / 4-index skin

          Every source U8 weight tuple was required to sum to 255 and every nonzero
          index was required to fit the 67-node skeleton. No weights were synthesized,
          normalized, clamped, or guessed.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: D1-Spektar-Pandion-Titan-Masculine-FULL-RIGGED-ANIMATED
          path: out/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
