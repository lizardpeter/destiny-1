name: D1 activity material dependency canary

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-activity-material-dependency-canary.yml'
      - 'tools/d1_remote_activity_material_dependency_closure.py'
      - 'tools/d1_remote_activity_texture_export.py'
      - 'tools/d1_material_decode.py'
      - 'tools/d1_texture_export.py'
      - 'tools/d1_dds_to_png.py'
      - 'tools/d1_remote_activity_placements.py'
      - 'tools/d1_filehash.py'
      - 'tests/fixtures/d1_anomaly_pvp_selected_material_plan.json'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  anomaly-material-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install Python image dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python - <<'PY'
          import PIL
          assert PIL.__version__ == '11.3.0', PIL.__version__
          print('PILLOW', PIL.__version__)
          PY

      - name: Recover verified universal package catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Close exact Anomaly material dependencies
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_remote_activity_material_dependency_closure.py tools/d1_remote_activity_texture_export.py
          python tools/d1_filehash.py
          python tools/d1_remote_activity_material_dependency_closure.py \
            --selected-material-plan tests/fixtures/d1_anomaly_pvp_selected_material_plan.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime \
            -o out/anomaly_material_dependency_closure.json \
            | tee out/anomaly_material_dependency_closure.txt
          python - <<'PY'
          import json
          d=json.load(open('out/anomaly_material_dependency_closure.json'))
          assert d['status']=='D1_REMOTE_ACTIVITY_MATERIAL_DEPENDENCY_CLOSURE_COMPLETE',d['violations'][:20]
          assert d['material_count']==32,d['material_count']
          assert not d['unresolved_external_variant_models'],d['unresolved_external_variant_models']
          assert not d['violations'],d['violations'][:20]
          assert d['unique_texture_count']>0,d
          assert d['unique_shader_count']>0,d
          assert d['typed_edge_count']>0,d
          for r in d['rows']:
              for stage in ('vertex','pixel'):
                  for t in r.get('dependencies',{}).get(stage,{}).get('textures',[]):
                      assert t['binding_role']==f"{stage}:t{t['texture_index']}"
                      assert t['register']==f"t{t['texture_index']}"
          print('ANOMALY_MATERIAL_CLOSURE',d['material_count'],d['unique_texture_count'],d['unique_shader_count'],d['unique_vector4_container_count'],d['typed_edge_count'])
          PY

      - name: Materialize exact Anomaly textures
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_activity_texture_export.py \
            --material-closure out/anomaly_material_dependency_closure.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --out-dir out/texture_export \
            | tee out/anomaly_texture_export.txt
          python - <<'PY'
          import json
          m=json.load(open('out/anomaly_material_dependency_closure.json'))
          t=json.load(open('out/texture_export/texture_export_manifest.json'))
          assert t['status']=='D1_REMOTE_ACTIVITY_TEXTURE_EXPORT_COMPLETE',t['violations'][:20]
          assert not t['violations'],t['violations'][:20]
          assert t['texture_count']==m['unique_texture_count'],(t['texture_count'],m['unique_texture_count'])
          assert t['dds_file_count']>0,t
          assert t['png_file_count']>0,t
          print('ANOMALY_TEXTURE_EXPORT',t['texture_count'],t['dds_file_count'],t['png_file_count'])
          PY
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-ANOMALY-MATERIAL-DEPENDENCY-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
