name: D1 shader stage scope audit self-test

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/d1_shader_stage_scope_audit.py'
      - '.github/workflows/d1-shader-stage-scope-audit-selftest.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Run fail-closed shader-stage scope audit self-test
        run: |
          set -euo pipefail
          python tools/d1_shader_stage_scope_audit.py --self-test
