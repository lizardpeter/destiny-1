name: D1 Tower three-NPC Blender Action-slot fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/d1_blender_fix_test_action_slots.py'
      - 'tools/d1_blender_validate_assigned_action_motion.py'
      - '.github/workflows/d1-tower-three-npc-action-slot-fix.yml'

permissions: {contents: read, actions: read}

env:
  TEST_ARTIFACT_ID: '10064475475'
  TEST_ARTIFACT_SHA256: '65ae5922e8913bc4fa217dd1a05de2d35411684a60fa4c3b08d27499bbc27a25'

jobs:
  fix_and_validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - name: Recover exact corrected 23MB test blend
        run: |
          set -euo pipefail
          mkdir -p input out reports
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TEST_ARTIFACT_ID}/zip" -o input/test.zip
          echo "$TEST_ARTIFACT_SHA256  input/test.zip" | sha256sum --check --strict
          unzip -q input/test.zip -d input/test
          test -f input/test/D1_TOWER_3_NPC_LAPTOP_TEST_V2_UPRIGHT.blend
      - name: Install Blender 5.2.1 LTS
        run: |
          set -euo pipefail
          BLENDER="$(bash tools/install_blender_lts.sh .blender)"; echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"
          "$BLENDER" --version | tee reports/blender_version.txt
          grep -q 'Blender 5.2.1' reports/blender_version.txt
      - name: Pair assigned Actions with compatible Blender Action slots
        run: |
          set -euo pipefail
          "$BLENDER" --background input/test/D1_TOWER_3_NPC_LAPTOP_TEST_V2_UPRIGHT.blend --python tools/d1_blender_fix_test_action_slots.py -- \
            --out-blend out/D1_TOWER_3_NPC_LAPTOP_TEST_V3_UPRIGHT_ANIMATED.blend \
            --report reports/ACTION_SLOT_FIX.json | tee reports/slot_fix_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/ACTION_SLOT_FIX.json'));assert not d['violations'],d
          assert (d['armature_count'],d['assigned_slot_count'])==(3,3),d
          print('ACTION_SLOTS_GREEN',[(x['armature'],x['action'],x['slot_identifier']) for x in d['rows']])
          PY
      - name: Prove all three assigned Actions visibly move pose bones
        run: |
          set -euo pipefail
          "$BLENDER" --background out/D1_TOWER_3_NPC_LAPTOP_TEST_V3_UPRIGHT_ANIMATED.blend --python tools/d1_blender_validate_assigned_action_motion.py -- --report reports/MOTION_VALIDATION.json | tee reports/motion_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/MOTION_VALIDATION.json'));assert not d['violations'],d
          assert (d['armature_count'],d['moving_armature_count'])==(3,3),d
          print('MOTION_GREEN',[(x['armature'],x['action'],x['pose_matrix_max_abs_delta']) for x in d['rows']])
          PY
      - name: Reopen saved V3 and persist inspection metadata
        run: |
          set -euo pipefail
          "$BLENDER" --background out/D1_TOWER_3_NPC_LAPTOP_TEST_V3_UPRIGHT_ANIMATED.blend --python tools/d1_blender_validate_tower_three_npc_test_v2.py -- --report reports/REOPEN_VALIDATION.json | tee reports/reopen_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/REOPEN_VALIDATION.json'));assert not d['violations'],d
          assert d['assigned_preview_action_count']==3,d
          PY
          cp reports/ACTION_SLOT_FIX.json out/
          cp reports/MOTION_VALIDATION.json out/
          cp reports/REOPEN_VALIDATION.json out/
          cp reports/blender_version.txt out/
          cp input/test/README.txt out/README_V2_MATERIAL_AXIS_NOTES.txt || true
          cat > out/README.txt <<'EOF'
          D1 Tower 3-NPC laptop test V3.

          This file includes the V2 axis/material fixes plus the Blender 5.2 Action-slot fix.
          - All three NPCs are upright via one -90 degree X root correction.
          - Unsafe D1 COLOR_0 semantics are withheld; unproven portable material slots are neutral gray rather than false neon colors.
          - One D1_TEST_* Action is assigned AND paired with the compatible Blender ActionSlot on every armature.
          - CI samples pose matrices across the timeline and requires actual movement on all three rigs before this artifact is published.

          Press Play immediately after opening. Additional D1_TEST_* Actions remain in the Action Editor.
          The assigned clips are diagnostic samples, not claims about the retail runtime-active animation state.
          EOF
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
          ls -lh out/D1_TOWER_3_NPC_LAPTOP_TEST_V3_UPRIGHT_ANIMATED.blend
      - uses: actions/upload-artifact@v4
        with:
          name: D1-TOWER-3-NPC-LAPTOP-TEST-V3-UPRIGHT-ANIMATED
          path: out/
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
