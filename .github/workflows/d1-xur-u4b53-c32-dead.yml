name: D1 Xur U4B53 c32 native dead-write proof

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-u4b53-c32-dead.yml'
      - 'tools/d1_xur_u4b53_c32_dead_gcn_proof.py'

permissions: {contents: read, actions: read}

env:
  GH_TOKEN: '${{ github.token }}'
  FRONTIER_ARTIFACT_ID: '10069257974'
  FRONTIER_ZIP_SHA256: 'fe26726d4853c2ad2e2bc46c4a4ae51346e71583420f6e36cc573bb344799f27'
  SYMBOLIC_ARTIFACT_ID: '10801410664'
  SYMBOLIC_ZIP_SHA256: '3f0413c5c0e528e837ebf18dc412d531ccf26da9e5fc9cc0164bcdb2f0fda9b4'

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover pinned native and symbolic evidence
        run: |
          set -euo pipefail
          mkdir -p input/frontier input/symbolic out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FRONTIER_ARTIFACT_ID}/zip" -o input/frontier.zip
          echo "${FRONTIER_ZIP_SHA256}  input/frontier.zip" | sha256sum --check --strict
          unzip -q input/frontier.zip -d input/frontier
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SYMBOLIC_ARTIFACT_ID}/zip" -o input/symbolic.zip
          echo "${SYMBOLIC_ZIP_SHA256}  input/symbolic.zip" | sha256sum --check --strict
          unzip -q input/symbolic.zip -d input/symbolic
          test -f input/frontier/disasm/PS_8087630D.s
          test -f input/frontier/disasm/PS_809D836C.s
          test -f input/frontier/disasm/PS_809D8370.s
          test -f input/symbolic/D1_XUR_VISIBLE_PS_TFX_SYMBOLIC_CONTRACT.json

      - name: Prove U4B53 writes cannot reach native pixel outputs
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_xur_u4b53_c32_dead_gcn_proof.py
          python tools/d1_xur_u4b53_c32_dead_gcn_proof.py \
            --symbolic-contract input/symbolic/D1_XUR_VISIBLE_PS_TFX_SYMBOLIC_CONTRACT.json \
            --disasm-dir input/frontier/disasm \
            -o out/D1_XUR_U4B53_C32_NATIVE_PS_DEAD_WRITE.json | tee out/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/D1_XUR_U4B53_C32_NATIVE_PS_DEAD_WRITE.json'))
          assert d['status']=='D1_XUR_U4B53_C32_NATIVE_PS_DEAD_WRITE_EXACT',d
          p=d['proof']
          assert p['all_visible_U4B53_stores_target_only_c32'] is True,p
          assert p['all_three_native_shaders_have_only_parsed_immediate_scalar_buffer_loads'] is True,p
          assert p['no_native_scalar_buffer_load_overlaps_c32'] is True,p
          assert p['all_native_scalar_buffer_loads_end_below_c32'] is True,p
          assert p['U4B53_is_dead_to_scoped_native_pixel_shaders'] is True,p
          assert p['opcode_0x4B_semantic_identity_proven'] is False,p
          assert not d['violations'],d
          print('XUR_U4B53_C32_NATIVE_DEAD_WRITE_GREEN', {
            x['shader']:hex(x['max_loaded_end_byte']) for x in d['native_shader_rows']
          })
          PY
          sha256sum out/* > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-XUR-U4B53-C32-NATIVE-DEAD-WRITE
          path: out/
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
