name: D1 Crota exact rigged animated export v2
# Registered workflow trigger; no evidence/export semantics changed.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-exact-rigged-animated-export-v2.yml'
      - 'tools/d1_remote_single_actor_rigged_animated_glb.py'
      - 'tools/d1_world_articulated_model_export.py'

permissions:
  contents: read
  actions: read

env:
  BASE_URL: https://crypt.cohae.dev/destiny/ps4/packages/latest
  CATALOG_ARTIFACT_ID: '9994811238'
  CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  RAID_ACTOR_ASSET_ARTIFACT_ID: '10005225514'
  RAID_ACTOR_ASSET_ZIP_SHA256: '6687cb12dcc423152592bdaff9e7efd86c119fa5b4e5e11cd885cc05ee20491b'
  MATERIAL_BINDINGS_SHA256: '84bcac8236bde3cb9e5c5faad5d1cc2d20768a5bfe89a62c5797de863f3e6fb8'
  MATERIAL_DEPENDENCIES_SHA256: 'd488fd455b799e6348ea48452f66935b0831a32163629dac63a4be79ca82a36c'
  SKIN_ARTIFACT_ID: '10027692774'
  SKIN_ARTIFACT_ZIP_SHA256: 'f459f939f698449940c96bf42b24894c602c7750b0d668d902483c8e8e7d51a2'
  BODY_ANIMATION_ARTIFACT_ID: '10027389376'
  BODY_ANIMATION_ARTIFACT_ZIP_SHA256: '9cb9f25e01138bf89de4b641e19308bcbc3f2ca49f73f223b0a01890ffca0ca4'
  PARSER_COMMIT: 'b9fdc3a43dd28118113275624fcc9054b75855f4'

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact retained proof artifacts and pinned runtime
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python -m pip install -q numpy scipy pyglm trimesh pygltflib
          mkdir -p input/catalog input/actor input/skin input/body runtime out/geometry out/textures
          fetch_artifact() {
            local id="$1" dst="$2" sha="$3" dir="$4"
            curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$dst"
            echo "$sha  $dst" | sha256sum --check --strict
            unzip -q "$dst" -d "$dir"
          }
          fetch_artifact "$CATALOG_ARTIFACT_ID" input/catalog.zip "$CATALOG_ZIP_SHA256" input/catalog
          echo "$CATALOG_JSON_SHA256  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          fetch_artifact "$RAID_ACTOR_ASSET_ARTIFACT_ID" input/actor.zip "$RAID_ACTOR_ASSET_ZIP_SHA256" input/actor
          echo "$MATERIAL_BINDINGS_SHA256  input/actor/crota_raid_actor_material_bindings.json" | sha256sum --check --strict
          echo "$MATERIAL_DEPENDENCIES_SHA256  input/actor/crota_raid_actor_material_dependencies.json" | sha256sum --check --strict
          fetch_artifact "$SKIN_ARTIFACT_ID" input/skin.zip "$SKIN_ARTIFACT_ZIP_SHA256" input/skin
          test -f input/skin/CROTA_EXACT_SKIN_CENSUS.json
          fetch_artifact "$BODY_ANIMATION_ARTIFACT_ID" input/body.zip "$BODY_ANIMATION_ARTIFACT_ZIP_SHA256" input/body
          test -f input/body/CROTA_ANIMATION_OPTIONS_V3.json
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet "$PARSER_COMMIT"
          test "$(git -C parser rev-parse HEAD)" = "$PARSER_COMMIT"
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Export exact Crota stage-0 geometry and material subset
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys,glob,shutil,hashlib
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_playable_guardian_entity_resource_resolve import load_catalogs
          from d1_split_tar_extract import SplitHttpTar
          from d1_remote_activity_placements import RemoteCorpus
          from d1_world_articulated_model_export import export_one

          bind=json.load(open('input/actor/crota_raid_actor_material_bindings.json'))
          assert bind['schema']=='d1_remote_activity_model_material_bindings/v2',bind.get('schema')
          assert bind['status']=='D1_REMOTE_ACTIVITY_MODEL_MATERIAL_BINDINGS_COMPLETE',bind.get('status')
          assert not bind['violations'],bind['violations']
          rows=[x for x in bind['bindings'] if x['model']=='8108E5B7' and x['parent_resource']=='8108E4BA']
          assert len(rows)==1,rows
          assert rows[0]['validation_ok'] and not rows[0]['violations'],rows[0]

          cats=load_catalogs([Path('input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json')])
          arc=SplitHttpTar([f'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=90)
          c=RemoteCorpus(arc,cats,Path('runtime'))
          rep=export_one(c,'8108E5B7',rows[0],Path('out/geometry'))
          assert rep['status']=='D1_WORLD_ARTICULATED_MODEL_EXPORT_COMPLETE',rep
          assert rep['model']=='8108E5B7' and rep['mesh_count']==3,rep
          assert rep['stage0_selected_range_count']==rep['geometry_count']==len(rep['ranges']),rep
          assert rep['triangle_count']>0 and rep['active_material_count']>0,rep

          dep=json.load(open('input/actor/crota_raid_actor_material_dependencies.json'))
          assert dep['schema']=='d1_remote_activity_material_dependency_closure/v1',dep.get('schema')
          assert dep['status']=='D1_REMOTE_ACTIVITY_MATERIAL_DEPENDENCY_CLOSURE_COMPLETE',dep.get('status')
          assert not dep['violations'],dep['violations']
          active=set(rep['active_materials'])
          drows=[x for x in dep['rows'] if x['material'] in active]
          assert len(drows)==len(active),(len(drows),len(active),sorted(active-set(x['material'] for x in drows)))
          assert all(not x.get('violations') for x in drows),[x['material'] for x in drows if x.get('violations')]
          textures={}; shaders={}
          for row in drows:
            for stage in ('vertex','pixel'):
              dd=(row.get('dependencies') or {}).get(stage) or {}
              sh=(dd.get('shader') or {}).get('tag_hash')
              if sh and sh not in ('00000000','FFFFFFFF'): shaders[sh]=dd.get('shader')
              for tex in dd.get('textures',[]): textures[tex['texture']]=tex
          copied=[]; texdir=Path('out/textures')
          for h in sorted(textures):
            matches=sorted(glob.glob(f'input/actor/texture_export/textures/{h}_*'))
            assert matches,h
            for src in matches:
              dst=texdir/Path(src).name; shutil.copy2(src,dst)
              copied.append({'texture':h,'file':str(dst.relative_to(Path('out'))),'bytes':dst.stat().st_size,'sha256':hashlib.sha256(dst.read_bytes()).hexdigest()})
          subset={
            'schema':'d1_crota_exact_material_texture_subset/v2','status':'D1_CROTA_EXACT_MATERIAL_TEXTURE_SUBSET_COMPLETE',
            'entity':'8108E484','entity_name':'Crota, Son of Oryx','model':'8108E5B7','model_parent':'8108E4BA',
            'selected_range_count':rep['stage0_selected_range_count'],'triangle_count':rep['triangle_count'],
            'active_material_count':len(active),'active_materials':sorted(active),'material_rows':drows,
            'unique_texture_count':len(textures),'textures':textures,'unique_shader_count':len(shaders),'shaders':shaders,
            'copied_texture_files':copied,
            'policy':'Exact stage-0/highest-detail materials only. Native vertex/pixel shader hashes and t# register bindings are preserved. No D1 texture register is guessed into a portable PBR semantic.'
          }
          Path('out/CROTA_EXACT_MATERIAL_TEXTURE_SUBSET.json').write_text(json.dumps(subset,indent=2)+'\n')
          print('CROTA_EXACT_GEOMETRY','RANGES',rep['geometry_count'],'TRIANGLES',rep['triangle_count'],'MATERIALS',len(active),'TEXTURES',len(textures),'SHADERS',len(shaders))
          print('ACTIVE_MATERIALS',sorted(active))
          print('TEXTURES',sorted(textures))
          PY

      - name: Bind exact skin and append every selected Crota animation
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_single_actor_rigged_animated_glb.py
          python tools/d1_remote_single_actor_rigged_animated_glb.py \
            out/geometry/8108E5B7.glb \
            --entity 0x8108E484 --model 0x8108E5B7 --skeleton 0x8108E4BB \
            --runtime-rig 0x8108E4CB --control 0x8108E5C0 --bone-count 50 \
            --model-report out/geometry/8108E5B7.json \
            --skin-census input/skin/CROTA_EXACT_SKIN_CENSUS.json \
            --animation-options input/body/CROTA_ANIMATION_OPTIONS_V3.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url "$BASE_URL" --part-count 10 --runtime runtime --parser-root parser \
            --fps 30 \
            --out out/CROTA_SON_OF_ORYX_EXACT_RIGGED_ANIMATED.glb \
            --report out/CROTA_SON_OF_ORYX_EXACT_RIGGED_ANIMATED.json \
            | tee out/rigged_animated_stdout.txt

      - name: Validate and package exact Crota checkpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from pygltflib import GLTF2
          r=json.load(open('out/CROTA_SON_OF_ORYX_EXACT_RIGGED_ANIMATED.json'))
          m=json.load(open('out/CROTA_EXACT_MATERIAL_TEXTURE_SUBSET.json'))
          assert r['status']=='D1_SINGLE_ACTOR_RIGGED_ANIMATED_GLB_COMPLETE',r
          assert (r['entity'],r['model'],r['skeleton'],r['runtime_rig'],r['animation_control'])==('8108E484','8108E5B7','8108E4BB','8108E4CB','8108E5C0'),r
          assert r['skeleton_node_count']==50 and r['runtime_rig_control_count']==44,r
          assert r['selector_state_count']==128,r
          assert r['animation_list_entry_count']==137,r
          assert r['unique_animation_list_clip_count']==135,r
          assert r['selected_clip_count']==82 and r['animation_count']==82,r
          assert r['native_retarget_success_count']==82 and r['native_retarget_failure_count']==0,r
          assert r['binary_prefix_exact'],r
          assert m['status']=='D1_CROTA_EXACT_MATERIAL_TEXTURE_SUBSET_COMPLETE',m
          g=GLTF2().load_binary('out/CROTA_SON_OF_ORYX_EXACT_RIGGED_ANIMATED.glb')
          assert len(g.skins or [])==1 and len(g.skins[0].joints or [])==50
          assert len(g.animations or [])==82 and all(len(a.channels or [])>0 for a in g.animations)
          cp={
            'schema':'d1_crota_exact_export_checkpoint/v2','status':'D1_CROTA_SON_OF_ORYX_EXACT_EXPORT_CHECKPOINT_COMPLETE',
            'identity':{'script_family':'dark_lens.sq_crota','script_family_hash':'A384A910','entity_name_hash':'64C53DB9','entity_name':'Crota, Son of Oryx','s_entity':'8108E484'},
            'physical':{'model':'8108E5B7','model_parent':'8108E4BA','skeleton':'8108E4BB','bones':50,'runtime_rig':'8108E4CB','runtime_rig_controls':44,'animation_control':'8108E5C0'},
            'visual':{'selected_ranges':r['selected_range_count'],'triangles':r['triangle_count'],'active_material_count':m['active_material_count'],'active_materials':m['active_materials'],'unique_texture_count':m['unique_texture_count'],'texture_hashes':sorted(m['textures']),'unique_shader_count':m['unique_shader_count'],'shader_hashes':sorted(m['shaders'])},
            'animation':{'selector_states':128,'animation_list_entries':137,'unique_animation_list_clips':135,'selector_selected_clips':82,'native_retarget_success':82,'native_retarget_failure':0,'gltf_animations':82,'default_action':'UNRESOLVED','loop_semantic':'UNRESOLVED'},
            'glb':{'file':'CROTA_SON_OF_ORYX_EXACT_RIGGED_ANIMATED.glb','bytes':Path('out/CROTA_SON_OF_ORYX_EXACT_RIGGED_ANIMATED.glb').stat().st_size,'sha256':r['output_sha256'],'geometry_binary_prefix_exact':True},
            'policy':'Identity, geometry/material selection, skin, skeleton, runtime rig and selector-selected animation population are independently source-closed. Native shader/register texture evidence is packaged separately; no PBR role, default animation, loop behavior or synchronization semantic is guessed.'
          }
          Path('out/CROTA_EXACT_EXPORT_CHECKPOINT.json').write_text(json.dumps(cp,indent=2)+'\n')
          print(json.dumps(cp,indent=2))
          PY
          cat > out/README.txt <<'EOF'
          CROTA, SON OF ORYX — D1 PS4 SOURCE-CLOSED EXPORT

          Open in Blender:
            CROTA_SON_OF_ORYX_EXACT_RIGGED_ANIMATED.glb

          Exact identity chain:
            dark_lens.sq_crota / A384A910
            EntityName 64C53DB9 = Crota, Son of Oryx
            s_entity 8108E484
            model 8108E5B7
            skeleton 8108E4BB (50 joints)
            runtime rig 8108E4CB (44 controls)
            animation control 8108E5C0

          All 82 selector-selected clips are embedded as separate glTF Animations.
          No startup/default clip, loop rule, or synchronization behavior is guessed.

          Exact native Material/shader/t# texture-register dependencies and exact retail
          DDS/PNG texture files are in CROTA_EXACT_MATERIAL_TEXTURE_SUBSET.json and textures/.
          They are deliberately not guessed into glTF PBR slots in this checkpoint.
          EOF
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-SON-OF-ORYX-EXACT-RIGGED-ANIMATED-V2
          path: out/
          retention-days: 30
          if-no-files-found: error
