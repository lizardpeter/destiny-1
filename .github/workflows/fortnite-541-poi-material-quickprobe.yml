name: Fortnite 5.41 original direct mesh material slot fast proof
on:
  pull_request:
    branches: [main]
    paths:
      - tools/fortnite_541_poi_material_quickprobe.py
      - .github/workflows/fortnite-541-poi-material-quickprobe.yml
  workflow_dispatch:
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original first detailed Factory static meshes and inspect real material slot contracts
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 tools/fortnite_541_poi_material_quickprobe.py
