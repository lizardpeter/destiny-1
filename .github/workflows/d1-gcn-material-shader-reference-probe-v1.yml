name: D1 GCN material shader reference probe v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-gcn-material-shader-reference-probe-v1.yml'
      - 'tools/d1_gcn_material_shader_reference_probe_v1.py'

permissions:
  contents: read
  actions: read

env:
  OWNER_ARTIFACT_ID: '10126529830'
  OWNER_ZIP_SHA256: 'b526d8b22670eb2346c956ba4a6e339203e508e662c2601c42ebdb7763049a67'
  OWNER_REPORT_SHA256: '1c9088280bfd691499c2d3a0681d76bfc76348f551262f8c54a6f11c4c66ac08'
  CATALOG_ARTIFACT_ID: '9994811238'
  CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  reference-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Pin implementation source
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_gcn_material_shader_reference_probe_v1.py
          git diff --exit-code
          git status --short

      - name: Recover frozen failed owner frontier and universal package catalog
        run: |
          set -euo pipefail
          mkdir -p input/owner input/catalog runtime out

          curl -fsSL --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${OWNER_ARTIFACT_ID}/zip" \
            -o input/owner.zip
          echo "$OWNER_ZIP_SHA256  input/owner.zip" | sha256sum --check --strict
          unzip -q input/owner.zip -d input/owner
          echo "$OWNER_REPORT_SHA256  input/owner/D1_GCN_MATERIAL_SHADER_OWNER_FRONTIER_V1.json" | sha256sum --check --strict

          curl -fsSL --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATALOG_ARTIFACT_ID}/zip" \
            -o input/catalog.zip
          echo "$CATALOG_ZIP_SHA256  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "$CATALOG_JSON_SHA256  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

          python - <<'PY'
          import json,re
          o=json.load(open('input/owner/D1_GCN_MATERIAL_SHADER_OWNER_FRONTIER_V1.json'))
          assert o['schema']=='d1_gcn_material_shader_owner_frontier/v1'
          assert len(o['violations'])==3987,len(o['violations'])
          rx=re.compile(r'^shader_header_absent:[0-9A-F]{8}:(VS|PS):([0-9A-F]{8})$')
          rows=[rx.match(v) for v in o['violations']]
          assert all(rows),[v for v,m in zip(o['violations'],rows) if not m][:10]
          assert len({m.group(2) for m in rows})==196
          c=json.load(open('input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json'))
          assert c['schema']=='d1_remote_package_member_catalog/v1'
          assert c['package_family_count']==337
          print('D1_REFERENCE_PROBE_INPUT_EXACT',len(rows),len({m.group(2) for m in rows}))
          PY

      - name: Recover pinned Oodle 3 runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' \
            -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' \
            -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Probe exact omitted material shader references
        run: |
          set -euo pipefail
          python tools/d1_gcn_material_shader_reference_probe_v1.py \
            input/owner/D1_GCN_MATERIAL_SHADER_OWNER_FRONTIER_V1.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' \
            --runtime runtime \
            -o out/D1_GCN_MATERIAL_SHADER_REFERENCE_PROBE_V1.json \
            | tee out/material_shader_reference_probe_stdout.txt

      - name: Fail closed and freeze diagnostic denominator
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='out/D1_GCN_MATERIAL_SHADER_REFERENCE_PROBE_V1.json'
          d=json.load(open(p)); c=d['coverage']
          assert d['schema']=='d1_gcn_material_shader_reference_probe/v1'
          assert d['status']=='D1_GCN_MATERIAL_SHADER_REFERENCE_PROBE_EXACT',d['violations'][:50]
          assert not d['violations']
          assert c['owner_violation_count']==3987,c
          assert c['shader_header_absent_occurrence_count']==3987,c
          assert c['unique_missing_reference_count']==196,c
          assert c['target_resolved_count']==196,c
          assert c['target_payload_recovered_count']==196,c
          assert c['shader_stage_promotions']==0,c
          assert c['shader_expression_semantic_promotions']==0,c
          print('D1_MATERIAL_SHADER_REFERENCE_PROBE_EXACT',json.dumps(c,sort_keys=True))
          PY
          sha256sum out/D1_GCN_MATERIAL_SHADER_REFERENCE_PROBE_V1.json > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-GCN-MATERIAL-SHADER-REFERENCE-PROBE-V1
          path: |
            out/D1_GCN_MATERIAL_SHADER_REFERENCE_PROBE_V1.json
            out/SHA256SUMS.txt
            out/material_shader_reference_probe_stdout.txt
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
