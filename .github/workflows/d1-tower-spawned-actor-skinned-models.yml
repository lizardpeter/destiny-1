name: D1 Tower spawned actor skinned models

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-spawned-actor-skinned-models.yml'
      - 'tools/d1_tower_spawned_actor_skin_bind_v2.py'
      - 'tools/d1_tower_spawned_actor_skin_bind.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  VISUAL_ARTIFACT_ID: '10001232930'
  VISUAL_ARTIFACT_ZIP_SHA256: 'a662155f8a6259def83474f08b7508c6f1f5f1f87b1d368b924b2648e6737113'
  SKIN_CENSUS_ARTIFACT_ID: '10001306768'
  SKIN_CENSUS_ZIP_SHA256: 'cb9a2d4401d6ca70b42536b73f90fe7b06f2ad885bcfac4443e3c6fee3c315df'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact artifacts, parser, and runtime
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python -m pip install -q numpy scipy pygltflib pyglm
          mkdir -p input/catalog input/visual input/skin runtime out reports
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${VISUAL_ARTIFACT_ID}/zip" -o input/visual.zip
          echo "${VISUAL_ARTIFACT_ZIP_SHA256}  input/visual.zip" | sha256sum --check --strict
          unzip -q input/visual.zip -d input/visual
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SKIN_CENSUS_ARTIFACT_ID}/zip" -o input/skin.zip
          echo "${SKIN_CENSUS_ZIP_SHA256}  input/skin.zip" | sha256sum --check --strict
          unzip -q input/skin.zip -d input/skin
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
          test "$(git -C parser rev-parse HEAD)" = b9fdc3a43dd28118113275624fcc9054b75855f4
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Bind all 13 exact retail skins
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_tower_spawned_actor_skin_bind.py tools/d1_tower_spawned_actor_skin_bind_v2.py
          python tools/d1_tower_spawned_actor_skin_bind_v2.py \
            --model-dir input/visual \
            --model-report input/visual/tower_spawned_actor_model_export.json \
            --skin-census input/skin/TOWER_SPAWNED_ACTOR_SKIN_CENSUS.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --parser-root parser --out-dir out --report reports/TOWER_SPAWNED_ACTOR_SKIN_BIND.json | tee reports/stdout.txt
          python - <<'PY'
          import glob,json
          from pygltflib import GLTF2
          d=json.load(open('reports/TOWER_SPAWNED_ACTOR_SKIN_BIND.json'))
          assert d['status']=='D1_TOWER_SPAWNED_ACTOR_SKIN_BIND_COMPLETE',d['violations']
          assert d['model_count']==13
          fs=sorted(glob.glob('out/*_SKINNED.glb'));assert len(fs)==13,fs
          for p in fs:
              g=GLTF2().load_binary(p)
              assert len(g.skins or [])==1
              assert all(n.skin==0 for n in g.nodes if n.mesh is not None)
          print('SKINNED_MODEL_VALIDATION',len(fs),'models')
          PY
          cp reports/TOWER_SPAWNED_ACTOR_SKIN_BIND.json out/
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-TOWER-SPAWNED-ACTOR-EXACT-SKINNED-MODELS
          path: out/
          retention-days: 30
          if-no-files-found: error
