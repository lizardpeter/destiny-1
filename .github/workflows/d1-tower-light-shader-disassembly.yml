name: D1 Tower light shader disassembly

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['D1 Tower light shader census']
    types: [completed]
  push:
    paths:
      - '.github/workflows/d1-tower-light-shader-disassembly.yml'
      - 'tools/d1_gcn_constant_buffer_usage_analyze.py'
      - 'tools/d1_gcn_image_usage_analyze.py'
      - 'tools/d1_gcn_cbuffer_usage_analyze.py'
      - 'tools/d1_gcn_terminal_mrt0_dependency_census.py'
      - 'tools/d1_tower_light_shader_family_cluster.py'
      - 'tools/d1_tower_light_80aae153_mrt0_factorization.py'
      - 'tools/d1_tower_light_809dce96_mrt0_factorization.py'
      - 'tools/d1_tower_light_80ca0451_gated_mrt0_factorization.py'
      - 'tools/d1_tower_light_80ca0ed3_mrt0_factorization.py'
      - 'tools/d1_tower_light_80ca109b_mrt0_factorization.py'
      - 'tools/d1_tower_light_80ca0ad8_mrt0_factorization.py'
      - 'tools/d1_tower_light_80ca0636_mrt0_factorization.py'
      - 'tools/d1_tower_light_80ca10a0_mrt0_factorization.py'
      - 'tools/d1_tower_light_80aae1be_mrt0_factorization.py'
      - 'tools/d1_tower_light_80c998e6_gated_mrt0_factorization.py'
      - 'tools/d1_tower_light_80ca0d1a_mrt0_factorization.py'
      - 'tools/d1_tower_light_80ca0296_gated_mrt0_factorization.py'
      - 'tests/test_d1_gcn_provenance_analysis.py'
      - 'tools/d1_tfx_program_inventory.py'
      - 'tools/d1_github_actions_artifact_pull.py'

permissions:
  contents: read
  actions: read

jobs:
  disasm:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact bounded light GCN corpus
        run: |
          set -euo pipefail
          mkdir -p upstream upstream_material shader disasm reports
          if [ "${{ github.event_name }}" = workflow_run ]; then
            run_id='${{ github.event.workflow_run.id }}'
          else
            run_id="$(gh run list --workflow d1-tower-light-shader-census.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id"
          python tools/d1_github_actions_artifact_pull.py \
            --repo "$GITHUB_REPOSITORY" --run-id "$run_id" \
            --artifact-name d1-tower-light-shader-census \
            --out-dir upstream --clean \
            --report reports/ARTIFACT_PULL_LIGHT_SHADER_CENSUS.json
          cp upstream/tower_light_shader_report.json reports/tower_light_shader_report.json
          cp upstream/light_gcn/PS_*_gcn.bin shader/

          material_run="$(gh run list --workflow d1-tower-light-material-census.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$material_run"
          python tools/d1_github_actions_artifact_pull.py \
            --repo "$GITHUB_REPOSITORY" --run-id "$material_run" \
            --artifact-name d1-tower-light-material-census \
            --out-dir upstream_material --clean \
            --report reports/ARTIFACT_PULL_LIGHT_MATERIALS.json
          cp upstream_material/tower_light_material_manifest.json reports/tower_light_material_manifest.json
          python - <<'PY'
          import json,glob
          d=json.load(open('reports/tower_light_shader_report.json'))
          assert d['status']=='D1_WORLD_PIXEL_SHADER_GCN_EXACT' and d['selected_count']==32 and d['error_count']==0,d
          assert len(glob.glob('shader/PS_*_gcn.bin'))==32
          PY

      - name: Build pinned CLRX and disassemble all 32 D1 light pixel shaders
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/CLRX/CLRX-mirror.git clrx
          git -C clrx checkout --quiet fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df
          test "$(git -C clrx rev-parse HEAD)" = 'fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df'
          cmake -S clrx -B clrx/build -DCMAKE_BUILD_TYPE=Release -DNO_CLWRAPPER=ON -DBUILD_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_DOCUMENTATION=OFF
          cmake --build clrx/build --target clrxdisasm -j2
          exe="$(find clrx/build -type f -name clrxdisasm -perm -111 | head -1)"; test -n "$exe"
          shopt -s nullglob
          n=0
          for f in shader/PS_*_gcn.bin; do
            b="$(basename "$f" _gcn.bin)"
            "$exe" --raw --gpuType=GFX700 --hexcode "$f" > "disasm/${b}.s" 2> "disasm/${b}.stderr"
            test ! -s "disasm/${b}.stderr"
            grep -q 's_endpgm' "disasm/${b}.s"
            n=$((n+1))
          done
          test "$n" -eq 32

      - name: Map exact GCN constant-buffer loads through OrbShdr usage metadata
        run: |
          set -euo pipefail
          python tools/d1_gcn_constant_buffer_usage_analyze.py \
            --extract-report reports/tower_light_shader_report.json \
            --disasm-dir disasm \
            --out reports/tower_light_gcn_constant_buffer_usage.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('reports/tower_light_gcn_constant_buffer_usage.json'))
          assert d['status']=='D1_GCN_CONSTANT_BUFFER_USAGE_ANALYZED',d['violations']
          assert d['shader_count']==32,d
          out=[]
          by={x['shader']:x for x in d['shaders']}
          for sh,row in sorted(by.items()):
              text=(Path('disasm')/f'PS_{sh}.s').read_text(errors='replace').splitlines()
              windows=[]
              for load in row['loads']:
                  ln=load['line_number']; lo=max(0,ln-6); hi=min(len(text),ln+6)
                  windows.append({'load':load,'context':text[lo:hi]})
              out.append({'shader':sh,'imm_constant_buffers':row['imm_constant_buffers'],'windows':windows})
          Path('reports/tower_light_gcn_constant_windows.json').write_text(json.dumps({'status':'D1_TOWER_LIGHT_GCN_CONSTANT_WINDOWS','shaders':out},indent=2)+'\n')
          print('LIGHT_GCN_CONSTANT_USAGE',json.dumps({k:d[k] for k in ('total_scalar_buffer_load_count','mapped_constant_buffer_load_count','unmatched_scalar_buffer_load_count','constant_buffer_api_slot_histogram','constant_buffer_static_offset_histograms')},indent=2))
          PY

      - name: Slice exact image/cbuffer/terminal output dependencies for top-twelve light shaders
        run: |
          set -euo pipefail
          python tools/d1_gcn_image_usage_analyze.py \
            --extract-report reports/tower_light_shader_report.json \
            --disasm-dir disasm \
            --out reports/tower_light_gcn_image_usage.json \
            | tee reports/tower_light_gcn_image_usage_stdout.txt

          python tools/d1_gcn_cbuffer_usage_analyze.py \
            --extract-report reports/tower_light_shader_report.json \
            --disasm-dir disasm \
            --out reports/tower_light_gcn_cbuffer_usage_v2.json \
            | tee reports/tower_light_gcn_cbuffer_usage_v2_stdout.txt

          mapfile -t top < <(python - <<'PY'
          import json
          d=json.load(open('reports/tower_light_shader_report.json'))
          rows=sorted(
              [x for x in d['shaders'] if not x.get('error')],
              key=lambda x:(-int(x.get('visible_material_count',0)),x['shader'])
          )[:12]
          for r in rows: print(r['shader'])
          PY
          )
          test "${#top[@]}" -eq 12
          args=(); for h in "${top[@]}"; do args+=(--shader "$h"); done
          python tools/d1_gcn_terminal_mrt0_dependency_census.py \
            --usage reports/tower_light_gcn_image_usage.json \
            --cbuffer-usage reports/tower_light_gcn_cbuffer_usage_v2.json \
            --disasm-dir disasm "${args[@]}" \
            --out reports/tower_light_top12_mrt0_dependencies.json \
            | tee reports/tower_light_top12_mrt0_dependencies_stdout.txt

          python - <<'PY'
          import json
          e=json.load(open('reports/tower_light_shader_report.json'))
          d=json.load(open('reports/tower_light_top12_mrt0_dependencies.json'))
          assert d['status']=='D1_GCN_TERMINAL_MRT0_DEPENDENCY_CENSUS_EXACT',d
          freq={x['shader']:int(x.get('visible_material_count',0)) for x in e['shaders']}
          assert len(d['shaders'])==12,d
          ordered=sorted(d['shaders'],key=lambda x:(-freq.get(x['shader'],0),x['shader']))
          for r in ordered:
              print('TOWER_LIGHT_TOP_MRT0',r['shader'],
                    'INSTANCES',freq.get(r['shader'],0),
                    'COMPRESSED',r['terminal_mrt0_compressed'],
                    'OPERANDS',r['terminal_mrt0_operands'],
                    'UNION',r['mrt0_value_union'])
              for ch,row in r['channels'].items():
                  print('  LIGHT_CHANNEL',ch,row['value_slice'])
          PY

      - name: Cluster exact Tower light shader families by source structure
        run: |
          set -euo pipefail
          python tools/d1_tower_light_shader_family_cluster.py \
            --material-manifest reports/tower_light_material_manifest.json \
            --shader-report reports/tower_light_shader_report.json \
            --image-usage reports/tower_light_gcn_image_usage.json \
            --cbuffer-usage reports/tower_light_gcn_cbuffer_usage_v2.json \
            --terminal-mrt0 reports/tower_light_top12_mrt0_dependencies.json \
            --out reports/TOWER_LIGHT_SHADER_FAMILY_CLUSTER.json \
            | tee reports/TOWER_LIGHT_SHADER_FAMILY_CLUSTER_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_LIGHT_SHADER_FAMILY_CLUSTER.json'))
          assert d['status']=='D1_TOWER_LIGHT_SHADER_FAMILY_CLUSTER_EXACT',d
          assert (d['light_instance_count'],d['unique_light_material_count'],d['pixel_shader_family_count'])==(737,497,32),d
          assert d['top8_instance_count']==575,d
          assert abs(d['top8_instance_fraction']-(575/737))<1e-12,d
          top={x['shader']:x for x in d['shaders']}
          assert top['80AAE153']['instance_count']==195,top['80AAE153']
          assert top['80AAE153']['renderer_resource_status']=='NO_SERIALIZED_PS_TEXTURE_BINDINGS',top['80AAE153']
          print('TOWER_LIGHT_TOP8_COVERAGE',d['top8_shaders'],d['top8_instance_count'],d['top8_instance_fraction'])
          for q in d['renderer_resource_clusters']:
              print('TOWER_LIGHT_STRUCTURAL_CLUSTER',q)
          PY

      - name: Run GCN provenance regression tests
        run: |
          set -euo pipefail
          python -m unittest tests.test_d1_gcn_provenance_analysis

      - name: Prove 80AAE1BE terminal light equation
        run: |
          set -euo pipefail
          python tools/d1_tower_light_80aae1be_mrt0_factorization.py \
            --material-manifest reports/tower_light_material_manifest.json \
            --shader-report reports/tower_light_shader_report.json \
            --image-usage reports/tower_light_gcn_image_usage.json \
            --cbuffer-usage reports/tower_light_gcn_cbuffer_usage_v2.json \
            --terminal-mrt0 reports/tower_light_top12_mrt0_dependencies.json \
            --disasm disasm/PS_80AAE1BE.s \
            --out reports/TOWER_LIGHT_80AAE1BE_MRT0_FACTORIZATION.json \
            | tee reports/TOWER_LIGHT_80AAE1BE_MRT0_FACTORIZATION_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_LIGHT_80AAE1BE_MRT0_FACTORIZATION.json'))
          assert d['status']=='D1_TOWER_LIGHT_80AAE1BE_MRT0_FACTORIZATION_EXACT',d
          assert d['instance_count']==37 and d['unique_material_count']==14,d
          assert d['exact_terminal_equation']['mrt0_a']=='0',d
          assert all(v is False for v in d['negative_proof'].values()),d
          print('TOWER_LIGHT_80AAE1BE_MRT0_EXACT',d['exact_terminal_equation'])
          PY

      - name: Prove gated 80C998E6 terminal light equation
