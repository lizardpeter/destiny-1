name: Verify exact Rust-test SMG Yaz0 and T6 IPAK CRC optimizations
on:
  workflow_dispatch:
  push:
    branches: [verify/rust-test-smg-yaz0-crc-20261009]
    paths:
      - '.github/workflows/rust-test-other-decoders-source-validation.yml'
      - 'tools/codec_bench/rust_test_*'
      - 'tools/codec_bench/yaz0_reference.rs'
permissions:
  contents: read
jobs:
  exact_sources:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run exact Rust-test Yaz0 source differential and boundary tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          rustc --edition=2021 --test -O tools/codec_bench/rust_test_yaz0_promoted.rs -o out/yaz0_tests.exe
          ./out/yaz0_tests.exe --nocapture
      - name: Benchmark exact promoted Yaz0 and IPAK CRC source on same Windows CPU
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -O -C target-cpu=native -C lto=fat -C codegen-units=1 \
            tools/codec_bench/rust_test_yaz0_verify.rs -o out/yaz0_bench.exe
          ./out/yaz0_bench.exe | tee out/yaz0_result.txt
          rustc --edition=2021 -O -C target-cpu=native -C lto=fat -C codegen-units=1 \
            tools/codec_bench/rust_test_crc32_verify.rs -o out/crc_bench.exe
          ./out/crc_bench.exe | tee out/crc_result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-rust-test-other-decoder-results
          path: |
            out/yaz0_result.txt
            out/crc_result.txt
          if-no-files-found: warn
          retention-days: 20
