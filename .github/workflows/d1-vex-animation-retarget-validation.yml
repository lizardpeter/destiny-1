name: D1 Vex animation retarget validation

on:
  push:
    paths:
      - '.github/workflows/d1-vex-animation-retarget-validation.yml'
      - 'tools/d1_animation_retarget_probe.py'
      - 'tests/test_animation_retarget_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies and unit test
        run: |
          python -m pip install -q pytest numpy scipy pygltflib pyglm
          python -m pytest -q tests/test_animation_retarget_probe.py
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git tiger-animation-parser
          git -C tiger-animation-parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4

      - name: Recover runtime and Vex 0767
        run: |
          set -euo pipefail
          mkdir -p runtime recovered out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 \
            --start-offset 0x105C6E000 \
            --target ps4_arch_vex_com01_0767_0.pkg \
            --target ps4_arch_vex_com01_0767_1.pkg \
            --target ps4_arch_vex_com01_0767_4.pkg \
            --out recovered --manifest out/0767_extract.json --retries 6 --timeout 90

      - name: Validate canonical 12-bone Vex clip pair
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_animation_retarget_probe.py \
            recovered/ps4_arch_vex_com01_0767_4.pkg \
            --runtime runtime --parser-root tiger-animation-parser \
            --skeleton 816CE092 --rig 816CE095 \
            --clip 816CE09D --clip 816CE09E \
            -o out/vex_12bone_retarget.json
          python - <<'PY'
          import json
          d=json.load(open('out/vex_12bone_retarget.json'))
          assert d['target']['skeleton_node_count']==12,d['target']
          assert d['target']['runtime_rig_control_count']==12,d['target']
          assert d['summary']=={'clip_count':2,'success_count':2,'failure_count':0},d['summary']
          assert all(x['native_control_limit']==12 for x in d['clips']),d['clips']
          assert all(x['local_track_count']==12 for x in d['clips']),d['clips']
          print(json.dumps(d,indent=2))
          PY

      - name: Probe auto-discovered 3-bone animated cluster with same generic tool
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          set +e
          python tools/d1_animation_retarget_probe.py \
            recovered/ps4_arch_vex_com01_0767_4.pkg \
            --runtime runtime --parser-root tiger-animation-parser \
            --skeleton 816CE0DE --rig 816CE122 \
            --clip 816CE113 --clip 816CE114 --clip 816CE115 \
            -o out/vex_3bone_retarget.json
          rc=$?
          set -e
          test -f out/vex_3bone_retarget.json
          python - <<'PY'
          import json
          d=json.load(open('out/vex_3bone_retarget.json'))
          print(json.dumps(d,indent=2))
          assert d['target']['skeleton_node_count']==3,d['target']
          PY
          echo "3-bone probe exit code: $rc"

      - uses: actions/upload-artifact@v4
        with:
          name: d1-vex-animation-retarget-validation
          path: out/
          retention-days: 14
          if-no-files-found: error
