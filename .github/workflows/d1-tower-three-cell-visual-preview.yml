name: D1 Tower three-cell visual preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-three-cell-visual-preview.yml'
      - 'tools/d1_tower_visual_filter.py'
      - 'tools/d1_tower_merge_placements.py'

permissions:
  contents: read
  actions: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install dependencies and verified Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install numpy trimesh
          mkdir -p runtime recovered proof visual reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Download prior byte-proof artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 33974062363 -n d1-tower-nine-cell-baked-static-shell -D proof
          test -f proof/validation/tower_map_schema_validation.json
          for f in TOWER_80C984D8 TOWER_80C98A6B TOWER_80C993CD; do
            test -f "proof/export/${f}.glb"
          done

      - name: Recover exact current 024C and 0250 material corpus
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar
          rows=[
            ('ps4_city_tower_destination_024c_0.pkg',7542949376,137527296,'ffb2e3cbb9777956384063e3c0fc5636200df51ae82a35a6aad06850dbf1fff2'),
            ('ps4_city_tower_destination_024c_1.pkg',7680477184,12226560,'21e75033fcba2f85b5d22b7377a7122c5135ce2c3f10f8453fc54a1d304c10f8'),
            ('ps4_city_tower_destination_024c_2.pkg',7692704256,13574144,'681349e0d32c213cae4bdef839bee8a6fa5aa3a5989c4a5344ee342cbe9d6e45'),
            ('ps4_city_tower_destination_024c_3.pkg',7706278912,2134016,'c6846bbe0bdf9aaf9ba194ed8a2a3b2c7e26178bd79218134e909fa460ebcaef'),
            ('ps4_city_tower_destination_024c_4.pkg',7708413440,6987776,'12dfe5e7dc65a8477d5ceabba5bb921b07c83110151a57b86a52ba3eb7d82018'),
            ('ps4_city_tower_destination_024c_5.pkg',7715401728,1687552,'b404bacccf44a4bf6859bf3b867ae02f5dc840432bdaa081c341439c2ae83311'),
            ('ps4_city_tower_destination_0250_0.pkg',7882616320,294875136,'beb269a2673f1106e2eff20ff577d0221d7fa56a8b71f5f8763cf34272114b32'),
            ('ps4_city_tower_destination_0250_1.pkg',8177491968,17983488,'87904a97ce9899305b6bdba9df960d220749b3b2398c4ba8bd97e6efb8f81f91'),
            ('ps4_city_tower_destination_0250_2.pkg',8195475968,11143168,'7543c1926023ec76ff8949618e04e1d0a93609f8448a1f8f875fcfc505a6b219'),
            ('ps4_city_tower_destination_0250_3.pkg',8206619648,206848,'1db9423081f922b78cce256641dfab195e6a4b4afb6020e4e0c5029234f19375'),
            ('ps4_city_tower_destination_0250_4.pkg',8206827008,17901568,'5a9370d60724622fb6592a7bcfa2fc4dbb40a4fca5cd696ce8db086a5756e84f'),
            ('ps4_city_tower_destination_0250_5.pkg',8224729088,1677312,'2066afe09503eee4c35d948f6749a6e7b7b02572dcd41d1d3ca679fa523ea22c'),
          ]
          arc=SplitHttpTar([f'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=120)
          for name,off,size,sha in rows:
              got=arc.copy_to(off,size,Path('recovered')/name)
              if got.lower()!=sha.lower(): raise SystemExit(f'{name}: SHA mismatch')
              print(name,got,flush=True)
          PY

      - name: Apply exact D1 visual static filter
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          declare -A d1=(
            [80C984D8]=80C9858B
            [80C98A6B]=80C98A77
            [80C993CD]=80C994B1
          )
          for h in 80C984D8 80C98A6B 80C993CD; do
            python tools/d1_tower_visual_filter.py "${args[@]}" --runtime runtime \
              --validation-json proof/validation/tower_map_schema_validation.json \
              --d1-static-map-data "${d1[$h]}" \
              --input-glb "proof/export/TOWER_${h}.glb" \
              --out "visual/TOWER_${h}_VISUAL.glb" \
              --json "visual/TOWER_${h}_VISUAL.json"
          done

      - name: Merge visual placements and verify
        run: |
          set -euo pipefail
          python tools/d1_tower_merge_placements.py \
            visual/TOWER_80C984D8_VISUAL.glb \
            visual/TOWER_80C98A6B_VISUAL.glb \
            visual/TOWER_80C993CD_VISUAL.glb \
            -o visual/D1_TOWER_THREE_CELL_VISUAL_FILTERED.glb \
            --json visual/D1_TOWER_THREE_CELL_VISUAL_FILTERED.json
          python - <<'PY'
          import json
          from pathlib import Path
          import trimesh
          rows=[json.load(open(p)) for p in sorted(Path('visual').glob('TOWER_*_VISUAL.json'))]
          expected=sum(r['visual_placements'] for r in rows)
          s=trimesh.load('visual/D1_TOWER_THREE_CELL_VISUAL_FILTERED.glb',force='scene',process=False)
          got=len(s.graph.nodes_geometry)
          if got!=expected: raise SystemExit(f'merged visual placement mismatch {got} != {expected}')
          out={'status':'D1_THREE_CELL_VISUAL_FILTER_EXACT','expected_visual_placements':expected,'merged_nodes':got,
               'geometry_variants':len(s.geometry),'bounds':s.bounds.tolist() if s.bounds is not None else None,
               'cells':[{'d1':r['d1_static_map_data'],'placements':r['visual_placements'],'removed':r['removed'],
                         'visual_materials':r['visual_materials'],'unique_materials':r['unique_materials']} for r in rows]}
          Path('reports/visual_summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-three-cell-visual-preview
          path: |
            visual/
            reports/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
