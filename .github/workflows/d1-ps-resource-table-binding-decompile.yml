name: D1 PS ResourceTable Binding Decompile

on:
  push:
    paths:
      - '.github/workflows/d1-ps-resource-table-binding-decompile.yml'
      - 'tools/ghidra/D1ExportFunctionOffsets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EBOOT_URL: https://r2.houseofkublai.com/destiny/CUSA00219_01.33/eboot.bin
      EBOOT_SHA256: 672f03411c0503dfbcda804cbb9fb27cdd9a8d73a8bcb71bf0c4f688073b0833
      EBOOT_SIZE: "29249016"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Recover exact owner-provided eboot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/d1-ps-resource-table
          curl --fail --location --retry 4 --retry-delay 2 "$EBOOT_URL"             -o build/d1-ps-resource-table/eboot.bin
          test "$(stat -c %s build/d1-ps-resource-table/eboot.bin)" = "$EBOOT_SIZE"
          echo "$EBOOT_SHA256  build/d1-ps-resource-table/eboot.bin" | sha256sum --check --strict

      - name: Download latest official Ghidra
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request(
              "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest",
              headers={
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "User-Agent":"d1-ps-resource-table-binding",
              })
          with urllib.request.urlopen(req) as r:
              rel=json.load(r)
          assets=[x for x in rel.get("assets",[]) if x.get("name","").endswith(".zip") and "PUBLIC" in x.get("name","")]
          if not assets: raise SystemExit("no Ghidra PUBLIC zip")
          open("build/d1-ps-resource-table/ghidra_url.txt","w").write(assets[0]["browser_download_url"]+"\n")
          PY
          curl --fail --location --retry 4             "$(cat build/d1-ps-resource-table/ghidra_url.txt)"             -o build/d1-ps-resource-table/ghidra.zip
          unzip -q build/d1-ps-resource-table/ghidra.zip -d build/d1-ps-resource-table/
          GHIDRA_DIR="$(find build/d1-ps-resource-table -maxdepth 1 -type d -name 'ghidra_*' | head -1)"
          test -n "$GHIDRA_DIR"
          echo "GHIDRA_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"

      - name: Install bundled PyGhidra
        run: |
          python3 -m pip install --disable-pip-version-check --quiet             --no-index             --find-links "$GHIDRA_DIR/Ghidra/Features/PyGhidra/pypkg/dist"             pyghidra

      - name: Decompile PS resource-table binding chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/d1-ps-resource-table/project
          "$GHIDRA_DIR/support/pyghidraRun" --headless             build/d1-ps-resource-table/project D1PsResourceTable             -import build/d1-ps-resource-table/eboot.bin             -overwrite             -analysisTimeoutPerFile 3600             -scriptPath "$GITHUB_WORKSPACE/tools/ghidra"             -postScript D1ExportFunctionOffsets.py               "$GITHUB_WORKSPACE/build/d1-ps-resource-table/ps_resource_table_binding.json"               1               0xF80210 0xF83520 0xF8D880 0xF8DF60 0xF8E680               0xF7FFE0 0xF80080 0xF80150 0xF802A0

      - name: Summarize exact binding path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p="build/d1-ps-resource-table/ps_resource_table_binding.json"
          d=json.load(open(p))
          wanted={0xF80210,0xF83520,0xF8D880,0xF8DF60,0xF8E680,0xF7FFE0,0xF80080,0xF80150,0xF802A0}
          print("functions",d["function_count"])
          for f in d["functions"]:
              if f["image_offset"] not in wanted:
                  continue
              print("\n==",hex(f["image_offset"]),f["name"],"decompiled",f["decompilation"]["completed"],"==")
              c=f["decompilation"].get("c") or ""
              print(c[:12000])
          PY

      - name: Remove executable and Ghidra
        if: always()
        shell: bash
        run: |
          rm -f build/d1-ps-resource-table/eboot.bin build/d1-ps-resource-table/ghidra.zip
          rm -rf "$GHIDRA_DIR" build/d1-ps-resource-table/project

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-ps-resource-table-binding-decompile
          path: |
            build/d1-ps-resource-table/ps_resource_table_binding.json
            build/d1-ps-resource-table/ghidra_url.txt
          if-no-files-found: warn
          retention-days: 30
