name: D1 Crota 808EE505 native and texture resource acceptance v1

on:
  workflow_dispatch:
  push:
    branches: [d1-crota-source-semantics-v1]
    paths:
      - 'tools/d1_gcn_renderer_program_bind_exact_texture_resources.py'
      - '.github/workflows/d1-crota-808ee505-native-and-texture-resource-accept-v1.yml'

env:
  NATIVE_PROGRAM_ARTIFACT_ID: '10081667660'
  NATIVE_PROGRAM_ZIP_SHA256: 'c3e3fb0d78dc9b22d914e929231d023a645cdd45327304f8500d8951d96a7327'
  TEXTURE_RESOURCE_ARTIFACT_ID: '10081880396'
  TEXTURE_RESOURCE_ZIP_SHA256: '085697024343d3c7d9094eaf6fc96301e77a0e3549a0f54fd959623aa36f9f0b'

permissions:
  contents: read
  actions: read

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover immutable native program and texture closure
        run: |
          set -euo pipefail
          mkdir -p input/native input/resources out
          curl -fsSL --retry 4 -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${NATIVE_PROGRAM_ARTIFACT_ID}/zip" -o input/native.zip
          echo "${NATIVE_PROGRAM_ZIP_SHA256}  input/native.zip" | sha256sum --check --strict
          unzip -q input/native.zip -d input/native
          curl -fsSL --retry 4 -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TEXTURE_RESOURCE_ARTIFACT_ID}/zip" -o input/resources.zip
          echo "${TEXTURE_RESOURCE_ZIP_SHA256}  input/resources.zip" | sha256sum --check --strict
          unzip -q input/resources.zip -d input/resources
      - name: Bind exact native samples to exact decoded resources
        run: |
          set -euo pipefail
          python tools/d1_gcn_renderer_program_bind_exact_texture_resources.py \
            --program input/native/D1_80D777B6_808EE505_RENDERER_PROGRAM.json \
            --resources input/resources/D1_CROTA_808EE505_FINAL_TEXTURE_RESOURCE_CLOSURE.json \
            -o out/D1_80D777B6_808EE505_RENDERER_PROGRAM_RESOURCE_CLOSED.json
          python - <<'PY'
          import json
          p='out/D1_80D777B6_808EE505_RENDERER_PROGRAM_RESOURCE_CLOSED.json'
          x=json.load(open(p))
          assert x['status']=='D1_GCN_RENDERER_PROGRAM_IR_NATIVE_AND_TEXTURE_RESOURCES_EXACT',x
          assert not x['violations']
          assert x['program']['coverage']['exact_nonstructural_instruction_count']==456
          assert x['program']['coverage']['structural_only_instruction_count']==0
          r=x['program']['exact_texture_resources']
          assert len(r)==2
          by={q['texture_taghash']:q for q in r}
          assert by['808EE4FE']['format_name']=='BC3' and by['808EE4FE']['width']==1024 and by['808EE4FE']['height']==1024
          assert by['808EE500']['format_name']=='BC5' and by['808EE500']['width']==1024 and by['808EE500']['height']==1024
          assert x['semantic_boundary']['visual_texture_role_names']=='WITHHELD_UNLESS_SEPARATELY_SOURCE_PROVEN'
          assert x['semantic_boundary']['sampler_state_bit_decode']=='NOT_DECODED_BY_THIS_LAYER'
          print('ACCEPTED native instructions 456/456; resources 2/2 exact')
          PY
          sha256sum out/D1_80D777B6_808EE505_RENDERER_PROGRAM_RESOURCE_CLOSED.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-CROTA-808EE505-NATIVE-AND-TEXTURE-RESOURCE-CLOSED-V1
          path: out/
          retention-days: 30
          if-no-files-found: error
