name: D1 Crota R10 Blender native material exact R8 carrier
# Trigger after scalar-equivalent BC4 control binding update.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-r10-blender-native.yml'
      - 'tools/d1_blender_crota_r10_native_rebuild.py'
      - 'tools/d1_gltf_mirror_normal_topology_probe.py'
      - 'tools/d1_crota_glb_material_vertex_layout.py'

permissions:
  contents: read
  actions: read

env:
  R8_ARTIFACT_ID: '10033385248'
  R8_ZIP_SHA256: '57a1ed385753a121fb33335f090e9af19964d1ae2baa831432370d9ffb03812e'
  LIBGL_ALWAYS_SOFTWARE: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and smoke-test Blender runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            blender python3-numpy xvfb xauth libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri libegl-mesa0
          blender --version | tee blender-version.txt
          xvfb-run -a -s '-screen 0 1280x1280x24' blender --background --python-expr \
            "import sys,numpy,bpy; print('BLENDER_PYTHON',sys.version); print('BLENDER_NUMPY',numpy.__version__); print('BLENDER_ENGINE',bpy.context.scene.render.engine)" \
            | tee blender-python.txt
          grep -q 'BLENDER_NUMPY' blender-python.txt
      - name: Recover exact pre-proxy R8 carrier files
        run: |
          set -euo pipefail
          mkdir -p input/r8 out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${R8_ARTIFACT_ID}/zip" -o input/r8.zip
          echo "${R8_ZIP_SHA256}  input/r8.zip" | sha256sum --check --strict
          unzip -q input/r8.zip -d input/r8
          test -f input/r8/CROTA_SON_OF_ORYX_R8_CLEAN_COLOR_BIND_POSE.glb
          test -f input/r8/CROTA_SON_OF_ORYX_R8_CLEAN_COLOR_ANIM_809D9D19.glb
          test -f input/r8/CROTA_SON_OF_ORYX_R8_CLEAN_COLOR_FULL_82.glb
      - name: Preserve exact material to source vertex-layout provenance
        run: |
          set -euo pipefail
          python tools/d1_crota_glb_material_vertex_layout.py \
            input/r8/CROTA_SON_OF_ORYX_R8_CLEAN_COLOR_BIND_POSE.glb \
            --out out/CROTA_R8_MATERIAL_VERTEX_LAYOUT.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_R8_MATERIAL_VERTEX_LAYOUT.json'))
          assert d['status']=='D1_CROTA_GLB_MATERIAL_VERTEX_LAYOUT_EXACT',d
          assert not d['violations'],d['violations']
          assert d['active_color_surface_count']==6,d
          fam=d['procedural_8108E955_source_layout_families']
          assert fam==[
            {'material':'8108E7A9','vertex_shader':'809DE9AB','source_mesh_index':0,
             'exported_texcoord0_source':'SECONDARY_STREAM','primary_stride':16,'secondary_stride':20},
            {'material':'8108E7B2','vertex_shader':'809DF743','source_mesh_index':2,
             'exported_texcoord0_source':'PRIMARY_STREAM','primary_stride':12,'secondary_stride':16},
          ],fam
          assert d['semantic_boundary']['PS_attr1_or_VS_raw_semantic_equals_TEXCOORD_0']=='WITHHELD_PENDING_SHADER_LINEAGE_JOIN',d
          print('CROTA_955_SOURCE_LAYOUT_FAMILIES',fam)
          PY

      - name: Prove exact mirrored source normals before Blender
        run: |
          set -euo pipefail
          python -m pip install -q numpy
          python tools/d1_gltf_mirror_normal_topology_probe.py \
            input/r8/CROTA_SON_OF_ORYX_R8_CLEAN_COLOR_BIND_POSE.glb \
            --node 8108E5B7_mesh2_range45583_4904 --axis 1 \
            --out out/CROTA_R8_MIRROR_NORMAL_TOPOLOGY.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_R8_MIRROR_NORMAL_TOPOLOGY.json'))
          assert d['status']=='D1_GLTF_MIRROR_NORMAL_TOPOLOGY_EXACT',d
          assert d['connected_component_count']==101,d
          assert d['mirror_pair_count']==49,d
          assert d['mirror_paired_component_count']==98,d
          assert d['mirror_paired_triangle_count']==2778,d
          assert d['triangle_count']==2856,d
          assert d['mirror_paired_triangle_fraction']>0.97,d
          assert d['minimum_mirrored_normal_dot']>0.9999,d
          assert d['semantic_boundary']['normal_recompute_authority']=='REJECTED_AS_SOURCE_REPLACEMENT',d
          print('CROTA_R8_SOURCE_NORMALS_MIRROR_EXACT',
                'PAIRS',d['mirror_pair_count'],
                'PAIRED_TRIANGLES',d['mirror_paired_triangle_count'],
                'TOTAL_TRIANGLES',d['triangle_count'],
                'OPPOSITE_FACE_AGREEMENT_PAIRS',d['mirror_pair_opposite_face_agreement_count'])
          PY

      - name: Build Blender-native bind scene and render
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x1280x24' blender --background --python tools/d1_blender_crota_r10_native_rebuild.py -- \
            --input input/r8/CROTA_SON_OF_ORYX_R8_CLEAN_COLOR_BIND_POSE.glb \
            --output out/CROTA_SON_OF_ORYX_R10_BLENDER_NATIVE_BIND.blend \
            --preview out/CROTA_R10_BIND_PREVIEW.png \
            --mode bind | tee out/bind-build.txt
          test -s out/CROTA_SON_OF_ORYX_R10_BLENDER_NATIVE_BIND.blend
          test -s out/CROTA_R10_BIND_PREVIEW.png
          grep -q 'D1_CROTA_R10_BLENDER_NATIVE_COMPLETE' out/bind-build.txt
      - name: Build Blender-native one-animation scene and render
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x1280x24' blender --background --python tools/d1_blender_crota_r10_native_rebuild.py -- \
            --input input/r8/CROTA_SON_OF_ORYX_R8_CLEAN_COLOR_ANIM_809D9D19.glb \
            --output out/CROTA_SON_OF_ORYX_R10_BLENDER_NATIVE_ANIM_809D9D19.blend \
            --preview out/CROTA_R10_ANIM_FRAME1_PREVIEW.png \
            --mode anim | tee out/anim-build.txt
          test -s out/CROTA_SON_OF_ORYX_R10_BLENDER_NATIVE_ANIM_809D9D19.blend
          test -s out/CROTA_R10_ANIM_FRAME1_PREVIEW.png
          grep -q 'D1_CROTA_R10_BLENDER_NATIVE_COMPLETE' out/anim-build.txt
      - name: Build full 82-action Blender scene
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x1280x24' blender --background --python tools/d1_blender_crota_r10_native_rebuild.py -- \
            --input input/r8/CROTA_SON_OF_ORYX_R8_CLEAN_COLOR_FULL_82.glb \
            --output out/CROTA_SON_OF_ORYX_R10_BLENDER_NATIVE_FULL_82.blend \
            --preview out/CROTA_R10_FULL_FRAME1_PREVIEW.png \
            --mode anim | tee out/full-build.txt
          test -s out/CROTA_SON_OF_ORYX_R10_BLENDER_NATIVE_FULL_82.blend
          test -s out/CROTA_R10_FULL_FRAME1_PREVIEW.png
          grep -q 'D1_CROTA_R10_BLENDER_NATIVE_COMPLETE' out/full-build.txt
      - name: Validate saved Blender scenes
        run: |
          set -euo pipefail
          cat > /tmp/validate_crota_r10.py <<'PY'
          import bpy, json
          active={'D1_8108E7A9','D1_8108E7AA','D1_8108E7B1','D1_8108E7B2','D1_8108E7B3'}
          mats={m.name for m in bpy.data.materials}
          assert active <= mats,(active-mats)
          for name in active:
              m=bpy.data.materials[name]
              assert m.use_nodes
              nn={n.name for n in m.node_tree.nodes}
              for required in ('D1_NATIVE_OUTPUT','D1_DESTINATION_ATTENUATION','D1_ADDITIVE_COLOR','D1_NATIVE_SOURCE_PLUS_DESTINATION'):
                  assert required in nn,(name,required,nn)
              assert m.get('d1_r10_blend_equation_exact')=='Source + Destination*(1-SourceAlpha)'
              assert m.get('d1_r10_partner_alpha_input')=='SOURCE_CLOSED_FOR_SELECTED_RETAIL_MATERIAL'
              assert m.get('d1_r10_native_pass_order')=='WITHHELD'
              assert str(m.get('d1_r10_blender_closure','')).startswith('PORTABLE_INSPECTION_ASSUMPTION:')
          for name in ('D1_8108E7A9','D1_8108E7B2'):
              m=bpy.data.materials[name]
              nn={n.name for n in m.node_tree.nodes}
              assert 'D1_EXACT_958_SPECIALIZED_ALPHA' in nn,(name,nn)
              assert 'D1_PROXY_955_PROC_COLOR_RAMP' not in nn,(name,nn)
              assert 'D1_PORTABLE_955_REPEATED_BC1_SAMPLE_AT_ZERO' in nn,(name,nn)
              assert 'D1_EXACT_955_ZERO_COORDINATE' in nn,(name,nn)
              assert 'D1_PROXY_955_ANGULAR_U' in nn,(name,nn)
              assert 'D1_PROXY_API13_RGB_SCALE' in nn,(name,nn)
              assert 'D1_EXACT_955_RGB_COMBINE' in nn,(name,nn)
              assert all(f'D1_EXACT_955_{ch}_X_API13' in nn for ch in ('R','G','B')),(name,nn)
              assert m.get('d1_r10_color_shader')=='8108E955',m.items()
              assert list(m.get('d1_r10_color_exact_normalized_gain'))==[0.18661969900131226,1.0,0.8700880408287048],m.items()
              assert m.get('d1_r10_color_exact_material_scalar')==55.0,m.items()
              assert m.get('d1_r10_color_repeated_sample_relation')=='t1=t2=t4=S from texture 80AACF2A, same sampler, first two encoded coordinate lanes (0,0)',m.items()
              assert m.get('d1_r10_color_t3_coordinate_effect')=='DEAD_FOR_T4_COORDINATE_AFTER_EXACT_ZERO_MULTIPLIERS',m.items()
              assert 'ramp and 1.65 gain removed' in m.get('d1_r10_color_preview_proxy',''),m.items()
              assert 'not claimed PS4 bit-identical' in m.get('d1_r10_portable_filter_boundary',''),m.items()
              assert 'API12[28:30]' in m.get('d1_r10_color_remaining_runtime',''),m.items()
              assert m.node_tree.nodes['D1_ADDITIVE_COLOR'].inputs['Strength'].default_value==1.0,(name,'unexpected procedural emission strength')
              assert 'D1_PROXY_ATTENUATION_SCALE' not in nn,(name,nn)
              assert 'D1_PROXY_ATTENUATION_BIAS' not in nn,(name,nn)
          for name in ('D1_8108E7AA','D1_8108E7B3'):
              m=bpy.data.materials[name]
              nn={n.name for n in m.node_tree.nodes}
              assert 'D1_EXACT_8108E959_PARTNER_ALPHA_ONE' in nn,(name,nn)
              assert 'D1_PROXY_956_ANGULAR_V' in nn,(name,nn)
              assert 'D1_PROXY_API13_RGB_SCALE' in nn,(name,nn)
              assert 'D1_EXACT_956_STATIC_RGB_VECTOR' in nn,(name,nn)
              assert 'D1_EXACT_956_ANGULAR_RGB_COMBINE' in nn,(name,nn)
              assert 'D1_PROXY_956_ATLAS_TINT' not in nn,(name,nn)
              assert 'D1_SOURCE_GREEN_TINT' not in nn,(name,nn)
              assert m.get('d1_r10_color_shader')=='8108E956',m.items()
              assert list(m.get('d1_r10_color_exact_static_rgb_vector'))==[0.3931313157081604,0.6766623854637146,0.6658802032470703],m.items()
              assert list(m.get('d1_r10_color_exact_angular_bias'))==[0.0003782951971516013,0.008264296688139439,0.0054319994524121284],m.items()
              assert list(m.get('d1_r10_color_exact_angular_slope'))==[0.9996216893196106,0.9917356967926025,0.9945679903030396],m.items()
              assert m.get('d1_r10_color_exact_material_scalar')==18.0,m.items()
              assert m.get('d1_r10_color_equation_replay')=='t0.rgb * (bias+slope*V) * staticRGB * 18 * API13[6]*API13[7]',m.items()
              assert 'tint and 2.2 gain removed' in m.get('d1_r10_color_preview_proxy',''),m.items()
              emission=m.node_tree.nodes['D1_ADDITIVE_COLOR']
              assert emission.inputs['Strength'].is_linked,(name,'strength not equation-linked')
              assert 'D1_PROXY_8108E959_RUNTIME_ATTENUATION' not in nn,(name,nn)
          dm=bpy.data.materials['D1_8108E7B1']
          nn={n.name for n in dm.node_tree.nodes}
          assert 'D1_EXACT_80AAE1CD_PARTNER_ALPHA_ONE' in nn,nn
          assert 'D1_EXACT_953_MATERIAL_RGB_VECTOR' in nn,nn
          assert 'D1_PROXY_953_ANGULAR_U' in nn,nn
          assert 'D1_PROXY_API13_RGB_SCALE' in nn,nn
          assert dm.get('d1_r10_color_shader')=='8108E953',dm.items()
          assert list(dm.get('d1_r10_color_exact_material_rgb_vector'))==[0.22183096408843994,1.0,0.9177990555763245],dm.items()
          assert dm.get('d1_r10_color_exact_material_scalar')==9.0,dm.items()
          assert dm.get('d1_r10_color_equation_replay')=='t0.rgb * materialRGB * U * 9 * API13[6]*API13[7]',dm.items()
          assert 'arbitrary emission strength 2.0 removed' in dm.get('d1_r10_color_preview_proxy',''),dm.items()
          assert dm.node_tree.nodes['D1_ADDITIVE_COLOR'].inputs['Strength'].is_linked,'detail strength not equation-linked'
          assert 'D1_PROXY_80AAE1CD_ATTENUATION' not in nn,nn
          arms=[o for o in bpy.context.scene.objects if o.type=='ARMATURE']
          assert all(o.hide_get() and o.hide_render for o in arms),[(o.name,o.hide_get(),o.hide_render) for o in arms]
          meshes=[o for o in bpy.context.scene.objects if o.type=='MESH' and not o.hide_get()]
          assert len(meshes)==6,[o.name for o in meshes]
          assert all(o.name.startswith('8108E5B7_') for o in meshes),[o.name for o in meshes]
          print(json.dumps({'status':'CROTA_R10_BLEND_VALID','materials':sorted(active),'visible_meshes':len(meshes),'armatures':len(arms),'animations':len(bpy.data.actions),'frame_range':[bpy.context.scene.frame_start,bpy.context.scene.frame_end]},indent=2))
          PY
          xvfb-run -a blender --background out/CROTA_SON_OF_ORYX_R10_BLENDER_NATIVE_BIND.blend --python /tmp/validate_crota_r10.py | tee out/validate-bind.txt
          xvfb-run -a blender --background out/CROTA_SON_OF_ORYX_R10_BLENDER_NATIVE_ANIM_809D9D19.blend --python /tmp/validate_crota_r10.py | tee out/validate-anim.txt
          xvfb-run -a blender --background out/CROTA_SON_OF_ORYX_R10_BLENDER_NATIVE_FULL_82.blend --python /tmp/validate_crota_r10.py | tee out/validate-full.txt
          for f in out/validate-bind.txt out/validate-anim.txt out/validate-full.txt; do grep -q 'CROTA_R10_BLEND_VALID' "$f"; done
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-CROTA-R10-BLENDER-NATIVE
          path: |
            out/
            blender-version.txt
            blender-python.txt
          retention-days: 30
          if-no-files-found: error
