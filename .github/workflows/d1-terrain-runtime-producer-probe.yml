name: D1 Terrain Runtime Producer Probe

on:
  push:
    paths:
      - '.github/workflows/d1-terrain-runtime-producer-probe.yml'
      - 'tools/d1_executable_terrain_runtime_probe.py'
      - 'tools/d1_executable_renderer_label_tables.py'
      - 'tools/d1_executable_probe.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EBOOT_URL: https://r2.houseofkublai.com/destiny/CUSA00219_01.33/eboot.bin
      EBOOT_SHA256: 672f03411c0503dfbcda804cbb9fb27cdd9a8d73a8bcb71bf0c4f688073b0833
      EBOOT_SIZE: '29249016'
      CODEGRAPH_ARTIFACT_ID: '10939012869'
    steps:
      - uses: actions/checkout@v4

      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check -q capstone

      - name: Recover exact owner-provided eboot
        run: |
          set -euo pipefail
          mkdir -p build/terrain-runtime
          curl --fail --location --retry 4 --retry-delay 2 "$EBOOT_URL" -o build/terrain-runtime/eboot.bin
          test "$(stat -c %s build/terrain-runtime/eboot.bin)" = "$EBOOT_SIZE"
          echo "$EBOOT_SHA256  build/terrain-runtime/eboot.bin" | sha256sum --check --strict

      - name: Recover exact-build Ghidra code graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 4             -H "Authorization: Bearer $GH_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CODEGRAPH_ARTIFACT_ID}/zip"             -o build/terrain-runtime/codegraph.zip
          unzip -q build/terrain-runtime/codegraph.zip -d build/terrain-runtime/codegraph-artifact
          test -f build/terrain-runtime/codegraph-artifact/ghidra_code_graph.json.gz

      - name: Trace terrain renderer ownership
        run: |
          set -euo pipefail
          python tools/d1_executable_terrain_runtime_probe.py             build/terrain-runtime/eboot.bin             --codegraph build/terrain-runtime/codegraph-artifact/ghidra_code_graph.json.gz             --out build/terrain-runtime/terrain_runtime_probe.json

      - name: Summarize exact frontier
        run: |
          python - <<'PY'
          import json
          d=json.load(open('build/terrain-runtime/terrain_runtime_probe.json'))
          print('pointer hits',d['terrain_pointer_hit_count'])
          print('code refs',len(d['code_references_to_terrain_table_neighborhoods']))
          print('candidate functions',d['candidate_function_count'])
          for f in d['candidate_functions'][:30]:
              print(
                  f['entry_hex'],
                  'slot-like',f['slot_like_instruction_count'],
                  'callers',len(f['caller_entries']),
                  'callees',len(f['called_function_entries']),
              )
              for ins in f['slot_like_instructions'][:10]:
                  print(' ',ins['address_hex'],ins['mnemonic'],ins['op_str'],ins['interesting_slot_like_values'])
          PY

      - name: Remove executable before artifact upload
        if: always()
        run: rm -f build/terrain-runtime/eboot.bin build/terrain-runtime/codegraph.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-terrain-runtime-producer-probe
          path: build/terrain-runtime/terrain_runtime_probe.json
          if-no-files-found: warn
          retention-days: 30
