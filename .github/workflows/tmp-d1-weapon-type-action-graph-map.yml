name: Temporary map D1 weapon types to shared action graph records

on:
  push:
    paths:
      - '.github/workflows/tmp-d1-weapon-type-action-graph-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Runtime and 0151
        run: |
          set -euo pipefail
          mkdir -p runtime recovered out/raw
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x45190B000 \
            --target ps4_globals_0151_0.pkg --target ps4_globals_0151_1.pkg --target ps4_globals_0151_2.pkg \
            --target ps4_globals_0151_3.pkg --target ps4_globals_0151_4.pkg --target ps4_globals_0151_5.pkg --target ps4_globals_0151_6.pkg \
            --out recovered --manifest out/0151_extract.json --retries 6 --timeout 90
      - name: Census 80800368 and weapon-type hashes
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import hashlib,json,struct,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader
          from d1_fnv1_action_probe import fnv1

          names=['auto_rifle','hand_cannon','pulse_rifle','scout_rifle','shotgun','sniper_rifle','fusion_rifle','machinegun','machine_gun',
                 'rocket_launcher','sidearm','sword','trace_rifle','submachine_gun','grenade_launcher','bow']
          hashes={fnv1(n):n for n in names}
          assert fnv1('rocket_launcher')==0xC9EB0270
          REF='80800368'; CONTROL='80802C0E'; WRAPPER='8080222A'; RES='80800861'; CLIP='808005A1'
          r=EntryReader(Path('recovered/ps4_globals_0151_6.pkg'),Path('runtime')); byint={int(e['tag_hash'],16):e for e in r.entries}
          rows=[]
          for e in r.entries:
              if e['reference'].upper()!=REF or not r.available(e['index']): continue
              try:b=r.entry(e['index'])
              except Exception as ex:
                  rows.append({'entry':{'index':e['index'],'tag_hash':e['tag_hash'].upper(),'size':e['file_size']},'error':repr(ex)});continue
              Path('out/raw',e['tag_hash'].upper()+'.bin').write_bytes(b)
              type_hits=[];refs=[];small=[]
              for off in range(0,len(b)-(len(b)%4),4):
                  v=struct.unpack_from('<I',b,off)[0]
                  if v in hashes:type_hits.append({'offset':off,'hash':f'{v:08X}','name':hashes[v]})
                  x=byint.get(v)
                  if x:refs.append({'offset':off,'tag_hash':x['tag_hash'].upper(),'reference':x['reference'].upper(),'index':x['index'],'size':x['file_size']})
              # Detect repeated 8-byte/hash+small-index looking pairs independently of semantics.
              for off in range(0,len(b)-7,4):
                  a,c=struct.unpack_from('<II',b,off)
                  if a in hashes and c<512: small.append({'offset':off,'weapon_type':hashes[a],'hash':f'{a:08X}','next_u32':c})
              rows.append({'entry':{'index':e['index'],'tag_hash':e['tag_hash'].upper(),'size':len(b)},'sha256':hashlib.sha256(b).hexdigest(),
                           'weapon_type_hits':type_hits,'resolved_filehash_dwords':refs,'weapon_type_plus_small':small,
                           'prefix128':b[:128].hex()})
          # Also reverse: for each 80800368 hit, capture nearby controls/wrappers/resources.
          for q in rows:
              idx=q['entry']['index']; nb=[]
              for i in range(max(0,idx-24),min(len(r.entries),idx+25)):
                  x=r.entries[i]
                  if x['reference'].upper() in {REF,CONTROL,WRAPPER,RES,CLIP} or abs(i-idx)<=4:
                      nb.append({'rel':i-idx,'index':i,'tag_hash':x['tag_hash'].upper(),'reference':x['reference'].upper(),'size':x['file_size']})
              q['neighborhood']=nb
          out={'class_reference':REF,'candidate_names':{n:f'{fnv1(n):08X}' for n in names},'entry_count':len(rows),'entries':rows,
               'evidence_policy':'Weapon type names are exact FNV1 preimages only. FileHash dwords and neighborhood are raw structural evidence; no control ownership inferred solely from adjacency.'}
          Path('out/d1_weapon_type_action_graph_map.json').write_text(json.dumps(out,indent=2)+'\n')
          for q in rows:
              if q.get('weapon_type_hits'):
                  print('TYPE_GRAPH_ENTRY',json.dumps({k:q[k] for k in ('entry','weapon_type_hits','resolved_filehash_dwords','weapon_type_plus_small')},separators=(',',':')))
          print('80800368_COUNT',len(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-weapon-type-action-graph-map
          path: out/
          retention-days: 7
          if-no-files-found: error
