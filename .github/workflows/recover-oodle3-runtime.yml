name: Recover verified Oodle 3 runtime

on:
  push:
    paths:
      - '.github/workflows/recover-oodle3-runtime.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PS4 package 0157
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' \
            --output packages.txt
          python - <<'PY'
          import re
          text=open('packages.txt','r',encoding='utf-8',errors='replace').read()
          # Package IDs appear as the four hex digits immediately before patch suffix _0/_1.pkg.
          matches=sorted(set(re.findall(r'[^\s"\'<>]*_0157_[01]\.pkg[^\s"\'<>]*', text, flags=re.I)))
          open('package_0157_matches.txt','w').write('\n'.join(matches)+'\n')
          print('\n'.join(matches) if matches else 'NO_MATCH')
          PY

      - name: Upload package mapping
        uses: actions/upload-artifact@v4
        with:
          name: d1-ps4-package-0157-mapping
          path: package_0157_matches.txt
          retention-days: 1
          if-no-files-found: error
