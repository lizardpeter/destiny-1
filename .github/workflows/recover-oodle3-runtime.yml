name: Recover verified Oodle 3 runtime

on:
  push:
    paths:
      - '.github/workflows/recover-oodle3-runtime.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify Oodle 2.3 runtime
        run: |
          set -euo pipefail
          mkdir -p runtime
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' \
            --output runtime/oo2core_3_win64.dll
          test "$(stat -c '%s' runtime/oo2core_3_win64.dll)" = '894752'
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict

      - name: Download and verify tiger-pkg Linux bridge
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' \
            --output runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Fetch current Tiger animation parser
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/SolUnshadowed/tiger-animation-parser.git tiger-animation-parser
          rm -rf tiger-animation-parser/.git

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download parser dependency wheels
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          python -m pip download --only-binary=:all: -d wheelhouse pyglm pygltflib

      - name: Upload verified runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: verified-oodle3-runtime-bundle
          path: runtime/
          retention-days: 1
          if-no-files-found: error

      - name: Upload animation parser source
        uses: actions/upload-artifact@v4
        with:
          name: tiger-animation-parser-source
          path: tiger-animation-parser/
          retention-days: 1
          if-no-files-found: error

      - name: Upload parser wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: tiger-animation-parser-wheelhouse
          path: wheelhouse/
          retention-days: 1
          if-no-files-found: error
