name: Recover verified Oodle 3 runtime

on:
  push:
    paths:
      - '.github/workflows/recover-oodle3-runtime.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PS4 global package 0157 pair
        run: |
          set -euo pipefail
          mkdir -p pkg0157
          for f in ps4_globals_0157_0.pkg ps4_globals_0157_1.pkg; do
            curl --fail --location --retry 3 \
              "https://crypt.cohae.dev/destiny/ps4/packages/latest/$f" \
              --output "pkg0157/$f"
            stat -c '%n %s bytes' "pkg0157/$f"
            sha256sum "pkg0157/$f"
          done

      - name: Upload package pair
        uses: actions/upload-artifact@v4
        with:
          name: d1-ps4-globals-0157
          path: pkg0157/
          retention-days: 1
          if-no-files-found: error
