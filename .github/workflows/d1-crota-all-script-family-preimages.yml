name: D1 Crota all raid script-family StringHash preimages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-all-script-family-preimages.yml'
      - 'tools/d1_remote_stringhash_preimage_scan.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  RAID_SCRIPTED_CENSUS_ARTIFACT_ID: '9997371058'
  RAID_SCRIPTED_CENSUS_ZIP_SHA256: '756a6ead36218efe3208532ba5b6b94c2769ffa71c3857af43e2ca01c44e8202'

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact universal catalog and raid scripted census
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog input/census runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RAID_SCRIPTED_CENSUS_ARTIFACT_ID}/zip" -o input/census.zip
          echo "${RAID_SCRIPTED_CENSUS_ZIP_SHA256}  input/census.zip" | sha256sum --check --strict
          unzip -q input/census.zip -d input/census
          test -f input/census/CROTA_RAID_SCRIPTED_ENTITY_CENSUS.json

      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Scan all 182 exact raid script-family hashes for retail preimages
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          ARGS=$(python - <<'PY'
          import json
          d=json.load(open('input/census/CROTA_RAID_SCRIPTED_ENTITY_CENSUS.json'))
          hashes=sorted(d['script_family_string_hash_counts'])
          assert len(hashes)==182,len(hashes)
          print(' '.join('--target 0x'+h for h in hashes))
          PY
          )
          python -m py_compile tools/d1_remote_stringhash_preimage_scan.py
          python tools/d1_remote_stringhash_preimage_scan.py \
            --package-id 0x0447 --package-id 0x044B --package-id 0x0450 --package-id 0x0458 \
            $ARGS \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --max-entry-size 8000000 \
            -o out/CROTA_ALL_SCRIPT_FAMILY_STRINGHASH_PREIMAGES.json \
            | tee out/stdout.txt

      - name: Join recovered names back to exact D912 and EntitySK families
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,collections,re
          c=json.load(open('input/census/CROTA_RAID_SCRIPTED_ENTITY_CENSUS.json'))
          p=json.load(open('out/CROTA_ALL_SCRIPT_FAMILY_STRINGHASH_PREIMAGES.json'))
          hits=collections.defaultdict(list)
          for x in p['hits']:
              hits[x['target']].append(x)
          rows=[]
          for t in c['scripted_tables']:
              h=t['script_family_string_hash']
              names=sorted({x['preimage'] for x in hits.get(h,[])})
              if not names: continue
              entities=sorted({r['entity_hash'] for r in t['records']})
              rows.append({'d912':t['scripted_entity_table'],'script_family_string_hash':h,'preimages':names,'entities':entities,'record_count':t['record_count']})
          out={
              'schema':'d1_crota_script_family_preimage_join/v1',
              'target_hash_count':len(c['script_family_string_hash_counts']),
              'resolved_hash_count':len(hits),
              'resolved_d912_count':len(rows),
              'rows':rows,
              'policy':'Preimages are accepted only from exact FNV1-32 equality over printable retail runs. D912 and EntitySK joins come only from the pinned raid scripted census.',
          }
          open('out/CROTA_ALL_SCRIPT_FAMILY_PREIMAGE_JOIN.json','w').write(json.dumps(out,indent=2)+'\n')
          print('TARGET_HASHES',out['target_hash_count'],'RESOLVED_HASHES',out['resolved_hash_count'],'RESOLVED_D912',out['resolved_d912_count'])
          keywords=re.compile(r'crota|final|boss|ultra|knight|oversoul|lens|dark|sword|oryx',re.I)
          for r in rows:
              text=' '.join(r['preimages'])
              if keywords.search(text):
                  print('HIGH_VALUE',r['d912'],r['script_family_string_hash'],r['preimages'],'ENTITIES',r['entities'])
          for r in rows:
              print('JOIN',r['d912'],r['script_family_string_hash'],r['preimages'],'ENTITIES',r['entities'])
          PY
          sha256sum out/* > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-ALL-SCRIPT-FAMILY-PREIMAGES
          path: out/
          retention-days: 30
          if-no-files-found: error
