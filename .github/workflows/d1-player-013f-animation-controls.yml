name: D1 player 013F animation controls

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-player-013f-animation-controls.yml'
      - 'tools/d1_remote_animation_control_census.py'
      - 'tools/d1_animation_control_state_map.py'

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Decode both 013F action controls
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_animation_control_census.py \
            --package-id 0x013F --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            --member ps4_investment_assets_013f_1.pkg:0x5A9421600:17747968 \
            --member ps4_investment_assets_013f_2.pkg:0x5AA50E800:3614720 \
            --member ps4_investment_assets_013f_3.pkg:0x5AA881200:301056 \
            --member ps4_investment_assets_013f_4.pkg:0x5AA8CAC00:284672 \
            --member ps4_investment_assets_013f_5.pkg:0x5AA910600:317440 \
            -o out/013F_animation_controls.json
      - name: Validate complete two-control decode
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/013F_animation_controls.json'));s=d['summary']
          assert s['control_count']==2,s
          assert s['decode_success_count']==2,s
          assert s['decode_error_count']==0,s
          print('PLAYER_013F_CONTROLS',json.dumps({'summary':s,'selected_clip_tags':d['selected_clip_tags']},sort_keys=True))
          PY
          sha256sum out/*.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-player-013f-animation-controls
          path: out/
          retention-days: 14
          if-no-files-found: error
