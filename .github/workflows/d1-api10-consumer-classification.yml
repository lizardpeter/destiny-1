name: D1 API10 consumer classification gate
on:
  workflow_dispatch:
  push:
    branches: [d1-crota-source-semantics-v1]
    paths:
      - 'tools/d1_validate_api10_consumer_classification_v1.py'
      - 'tests/test_d1_validate_api10_consumer_classification_v1.py'
      - 'evidence/d1_api10_consumer_classification_v1.json'
      - 'evidence/d1_api10_localshader_consumer_classification_v1.json'
      - 'evidence/frozen/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json'
      - '.github/workflows/d1-api10-consumer-classification.yml'
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: |
          set -euo pipefail
          python -m py_compile tools/d1_validate_api10_consumer_classification_v1.py tests/test_d1_validate_api10_consumer_classification_v1.py
          python tests/test_d1_validate_api10_consumer_classification_v1.py
          python tools/d1_validate_api10_consumer_classification_v1.py             evidence/d1_api10_consumer_classification_v1.json             --localshader-census evidence/frozen/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json
          python - <<'PY'
          import json
          d=json.load(open('evidence/d1_api10_consumer_classification_v1.json'))
          assert d['status']=='SOURCE_CLOSED_CROSS_STAGE_REFERENCE_ONLY'
          assert d['coverage']['classified_cross_stage_programs']==4
          assert d['coverage']['localshader_api10_program_denominator']==39
          assert d['coverage']['localshader_membership_overlap']==0
          assert d['coverage']['localshader_programs_classified_by_this_manifest']==0
          assert d['coverage']['classification_complete_for_localshader'] is False
          assert d['population_relation']['conclusion']=='DISJOINT_GCN_POPULATIONS'
          assert len({x['gcn_sha256'] for x in d['programs']})==4
          assert {x['source_hardware_stage'] for x in d['programs']}=={'VertexShader'}
          assert all(v=='WITHHELD' for v in d['semantic_boundary'].values())
          l=json.load(open('evidence/d1_api10_localshader_consumer_classification_v1.json'))
          assert l['status']=='SOURCE_CLOSED_LOCALSHADER_PARTIAL'
          assert l['coverage']=={'classified_localshader_programs':2,'localshader_api10_program_denominator':39,'unclassified_localshader_programs':37,'classification_complete_for_localshader':False}
          assert {x['tbuffer_instruction_count'] for x in l['programs']}=={3,6}
          assert {x['source_hardware_stage'] for x in l['programs']}=={'LocalShader'}
          assert all(v=='WITHHELD' for v in l['semantic_boundary'].values())
          PY
