name: D1 Tower 80C88434 resource edge metadata census

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/d1_tower_80c88434_resource_edge_metadata_census.py'
      - '.github/workflows/d1-tower-80c88434-resource-edge-metadata.yml'

permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  RESOURCE_ARTIFACT_ID: '10077266753'
  RESOURCE_ARTIFACT_SHA256: '405744a82451b6040699ae5d65acb7fc6c74dd112d726734c0db3f7dedb40f90'
  CATALOG_ARTIFACT_ID: '9994811238'
  CATALOG_ARTIFACT_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  LINOODLE_SKIP_DLLMAIN: '1'

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover pinned exact resource payloads and universal catalog
        run: |
          set -euo pipefail
          mkdir -p input/resources input/catalog runtime reports
          for spec in \
            "resources:${RESOURCE_ARTIFACT_ID}:${RESOURCE_ARTIFACT_SHA256}" \
            "catalog:${CATALOG_ARTIFACT_ID}:${CATALOG_ARTIFACT_SHA256}"; do
            IFS=: read -r name aid sha <<< "$spec"
            curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" -o "input/${name}.zip"
            echo "${sha}  input/${name}.zip" | sha256sum --check --strict
            unzip -q "input/${name}.zip" -d "input/${name}"
          done
          test -f input/resources/D1_TOWER_80C88434_RESOURCE_CLASS_CENSUS.json
          test -d input/resources/payloads
          test "$(find input/resources/payloads -name '*.bin' -type f | wc -l)" -eq 42
          echo "${CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

      - name: Recover verified decompression runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Resolve every exact direct FileHash edge
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_tower_80c88434_resource_edge_metadata_census.py
          python tools/d1_tower_80c88434_resource_edge_metadata_census.py \
            --payload-dir input/resources/payloads \
            --resource-census input/resources/D1_TOWER_80C88434_RESOURCE_CLASS_CENSUS.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime \
            -o reports/D1_TOWER_80C88434_RESOURCE_EDGE_METADATA.json | tee reports/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/D1_TOWER_80C88434_RESOURCE_EDGE_METADATA.json'))
          assert d['status']=='D1_TOWER_80C88434_RESOURCE_EDGE_METADATA_EXACT',d['violations']
          assert d['source_resource_count']==42,d
          assert d['exact_direct_edge_count']>0 and d['unique_direct_target_count']>0,d
          print('80C88434_RESOURCE_EDGE_METADATA_GREEN',d['exact_direct_edge_count'],d['unique_direct_target_count'])
          print('DIRECT_TEXTURE_HEADERS',d['direct_texture_headers'])
          print('DIRECT_DYES',d['direct_d1_dyes'])
          print('DIRECT_MATERIALS',d['direct_roi_materials'])
          print('SECOND_TEXTURE_HEADERS',d['second_hop_texture_headers'])
          print('SECOND_DYES',d['second_hop_d1_dyes'])
          PY

      - name: Persist exact hashes
        if: always()
        run: find reports -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > reports/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-TOWER-80C88434-RESOURCE-EDGE-METADATA
          path: reports/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
