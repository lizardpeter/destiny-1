name: D1 GCN architectural effects frontier v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-gcn-architectural-effects-frontier-v1.yml'
      - 'tools/d1_gcn_arch_effects_v1.py'
      - 'tools/d1_gcn_arch_effects_frontier_v1.py'

permissions:
  contents: read
  actions: read

env:
  EVIDENCE_ARTIFACT_ID: '10088200204'
  EVIDENCE_REPORT_SHA256: '0fc89bae78694917b431b2062bbce794d72e3ef770aa66603dd1bc6f560069cd'

jobs:
  architectural-effects:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate source-closed architectural registry
        run: |
          set -euo pipefail
          python tools/d1_gcn_arch_effects_v1.py > /tmp/D1_GCN_ARCH_EFFECT_REGISTRY_V1.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/D1_GCN_ARCH_EFFECT_REGISTRY_V1.json'))
          assert d['status']=='D1_GCN_ARCH_EFFECT_REGISTRY_SOURCE_CLOSED_TRANCHE_V1'
          assert d['source_closed_opcode_count']==27
          assert d['semantic_promotions']==0
          assert all(x['architectural_status']=='SOURCE_CLOSED' for x in d['opcodes'].values())
          assert all(x['shader_expression_status']=='UNPROVEN' for x in d['opcodes'].values())
          print('D1_GCN_ARCH_EFFECT_REGISTRY_V1_OK')
          PY

      - name: Download exact global structural evidence artifact
        run: |
          set -euo pipefail
          mkdir -p source out
          curl -fsSL --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ARTIFACT_ID}/zip" \
            -o source/evidence.zip
          unzip -q source/evidence.zip D1_GCN_OPCODE_STRUCTURAL_EVIDENCE_FRONTIER_V1.json -d source
          echo "$EVIDENCE_REPORT_SHA256  source/D1_GCN_OPCODE_STRUCTURAL_EVIDENCE_FRONTIER_V1.json" | sha256sum --check --strict

      - name: Build exact architectural-effects frontier
        run: |
          set -euo pipefail
          python tools/d1_gcn_arch_effects_frontier_v1.py \
            --evidence source/D1_GCN_OPCODE_STRUCTURAL_EVIDENCE_FRONTIER_V1.json \
            --expected-sha256 "$EVIDENCE_REPORT_SHA256" \
            -o out/D1_GCN_ARCH_EFFECTS_FRONTIER_V1.json \
            | tee out/stdout.txt

      - name: Fail closed on coverage or semantic promotion drift
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          p='out/D1_GCN_ARCH_EFFECTS_FRONTIER_V1.json'
          d=json.load(open(p))
          assert d['status']=='D1_GCN_ARCH_EFFECTS_FRONTIER_SOURCE_CLOSED_EXACT',d['violations'][:50]
          assert not d['violations']
          c=d['coverage']
          assert c['exact_novel_opcode_count']==67,c
          assert c['exact_novel_opcode_instruction_occurrences']==261733,c
          assert c['source_closed_opcode_count']==27,c
          assert c['source_closed_opcode_instruction_occurrences']==255449,c
          assert c['source_closed_unique_programs']==20137,c
          assert c['source_closed_stage_programs']=={'PS':12050,'VS':8068,'DS':19},c
          assert c['remaining_architecturally_unclosed_opcode_count']==40,c
          assert c['remaining_architecturally_unclosed_occurrences']==6284,c
          assert math.isclose(c['source_closed_novel_occurrence_ratio'],255449/261733,rel_tol=0,abs_tol=1e-15),c
          assert c['shader_expression_semantic_promotions']==0,c
          by={x['opcode']:x for x in d['source_closed_opcodes']}
          assert 'ARCHITECTURAL_USES_DIFFER' in by['v_writelane_b32']['structural_correction_classes']
          assert 'ARCHITECTURAL_USES_DIFFER' in by['v_readfirstlane_b32']['structural_correction_classes']
          assert 'ARCHITECTURAL_DEFS_DIFFER' in by['s_or_b64']['structural_correction_classes']
          assert 'ARCHITECTURAL_CONTROL_FLOW_EFFECT' in by['s_swappc_b64']['structural_correction_classes']
          assert 'ARCHITECTURAL_DEFS_DIFFER' in by['v_cmpx_eq_i32']['structural_correction_classes']
          assert 'ARCHITECTURAL_DEFS_DIFFER' in by['v_cmpx_lt_u32']['structural_correction_classes']
          print('D1_GCN_ARCH_EFFECTS_FRONTIER_V1_EXACT')
          PY
          cp /tmp/D1_GCN_ARCH_EFFECT_REGISTRY_V1.json out/
          sha256sum out/D1_GCN_ARCH_EFFECTS_FRONTIER_V1.json out/D1_GCN_ARCH_EFFECT_REGISTRY_V1.json > out/SHA256SUMS.txt
          printf '%s\n' "$EVIDENCE_ARTIFACT_ID" > out/SOURCE_EVIDENCE_ARTIFACT_ID.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-GCN-ARCHITECTURAL-EFFECTS-FRONTIER-V1
          path: out/
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
