name: D1 Crota 809DEA3C owner names

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-809dea3c-owner-names.yml'
      - 'tools/d1_remote_global_stringhash_resolve.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  names:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Resolve all generic names for exact 809DEA3C owners
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_global_stringhash_resolve.py \
            --generic-name-tag 0x8108E544 --generic-name-tag 0x8108E545 \
            --generic-name-tag 0x8108EBB4 --generic-name-tag 0x8108F0EC \
            --generic-name-tag 0x8108F17A --generic-name-tag 0x8109664B \
            --string-hash 0xA90FADAA \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --global-package-id 0x0151 --global-package-id 0x0154 --global-package-id 0x0155 \
            --global-package-id 0x0156 --global-package-id 0x0157 --global-package-id 0x0158 \
            --global-package-id 0x0169 --global-package-id 0x018D --global-package-id 0x01E3 \
            --global-package-id 0x072B --global-package-id 0x072F --global-package-id 0x0735 \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_809DEA3C_OWNER_NAMES.json \
            | tee out/stdout.txt
      - name: Print exact owner name mapping
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_809DEA3C_OWNER_NAMES.json'))
          assert d['violation_count']==0,d['violations']
          owners={
            '8108E49C':'8108E544',
            '8108E49D':'8108E545',
            '8108EB93':'8108EBB4',
            '8108EFF5':'8108F0EC',
            '8108F000':'8108F17A',
            '81096624':'8109664B',
          }
          for ent,tag in owners.items():
              sh=d['generic_name_tag_to_string_hash'][tag]
              vals=[x['string'] for x in d['resolved'].get(sh,[]) if x.get('string') is not None]
              print('OWNER',ent,'TAG',tag,'STRING_HASH',sh,'NAMES',vals)
          print('SPECIFIC_A90FADAA',[x['string'] for x in d['resolved'].get('A90FADAA',[]) if x.get('string') is not None])
          print('UNRESOLVED',d['unresolved_target_hashes'])
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-809DEA3C-OWNER-NAMES
          path: out/
          retention-days: 30
          if-no-files-found: error
