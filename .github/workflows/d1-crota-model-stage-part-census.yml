name: D1 Crota exact model stage-part census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-model-stage-part-census.yml'
      - 'tools/d1_crota_model_stage_part_census.py'

env:
  BASE_URL: https://crypt.cohae.dev/destiny/ps4/packages/latest
  CATALOG_ARTIFACT_ID: '9994811238'
  CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  ACTOR_ARTIFACT_ID: '10005225514'
  ACTOR_ZIP_SHA256: '6687cb12dcc423152592bdaff9e7efd86c119fa5b4e5e11cd885cc05ee20491b'

permissions:
  contents: read
  actions: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact catalog, Crota parent bindings and runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog input/actor runtime out
          fetch_artifact() {
            local id="$1" zip="$2" sha="$3" dst="$4"
            curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            echo "$sha  $zip" | sha256sum --check --strict
            unzip -q "$zip" -d "$dst"
          }
          fetch_artifact "$CATALOG_ARTIFACT_ID" input/catalog.zip "$CATALOG_ZIP_SHA256" input/catalog
          echo "$CATALOG_JSON_SHA256  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          fetch_artifact "$ACTOR_ARTIFACT_ID" input/actor.zip "$ACTOR_ZIP_SHA256" input/actor
          test -f input/actor/crota_raid_actor_material_bindings.json
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Census exact Crota model stages, LODs and material variants
        run: |
          set -euo pipefail
          python tools/d1_crota_model_stage_part_census.py \
            --material-bindings input/actor/crota_raid_actor_material_bindings.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url "$BASE_URL" --part-count 10 --runtime runtime \
            -o out/CROTA_8108E5B7_STAGE_PART_CENSUS.json | tee out/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_8108E5B7_STAGE_PART_CENSUS.json'))
          assert d['status']=='D1_CROTA_MODEL_STAGE_PART_CENSUS_COMPLETE',d
          assert d['model']=='8108E5B7' and d['parent_resource']=='8108E4BA',d
          assert d['mesh_count']==3 and d['part_count']==54,d
          assert d['lod_enum']['7']=='LowPolyGeom2' and d['lod_enum']['9']=='LowPolyGeom3',d['lod_enum']
          print('CROTA_STAGE_CENSUS_GREEN','STAGES',len(d['stage_summary']),'FAMILIES',len(d['geometry_families']))
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-8108E5B7-STAGE-PART-CENSUS
          path: out/
          retention-days: 30
          if-no-files-found: error
