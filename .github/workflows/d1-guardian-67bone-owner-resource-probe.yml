name: D1 Guardian 67-bone owner resource probe

on:
  push:
    paths:
      - '.github/workflows/d1-guardian-67bone-owner-resource-probe.yml'
      - 'tools/d1_entity_resource_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact 00EC retail family and Oodle
        run: |
          set -euo pipefail
          mkdir -p runtime recovered out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --start-offset 0xAAB580800 \
            --target ps4_race_set_all_00ec_0.pkg --target ps4_race_set_all_00ec_1.pkg \
            --target ps4_race_set_all_00ec_2.pkg --target ps4_race_set_all_00ec_3.pkg \
            --target ps4_race_set_all_00ec_4.pkg --target ps4_race_set_all_00ec_5.pkg \
            --out recovered --manifest out/00ec_extract.json --retries 6 --timeout 90
      - name: Decode exact EntityResource pointer classes and aligned references
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import json,struct,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader
          from d1_entity_resource_probe import parse_resource

          r=EntryReader(Path('recovered/ps4_race_set_all_00ec_5.pkg'),Path('runtime'))
          by={e['tag_hash'].upper():e for e in r.entries}
          targets={'809D8466','809D856F','809D8613','809D856E','809D8469','809D846A','809D8572'}
          out={'schema':'d1_guardian_owner_resource_probe/v1','resources':[]}
          for tag in ('809D8886','809D8887'):
              e=by[tag]; b=r.entry(e['index'])
              p=parse_resource(b,r.h['platform'])
              refs=[]
              for off in range(0,len(b)-(len(b)%4),4):
                  v=struct.unpack_from('<I',b,off)[0]; h=f'{v:08X}'
                  if h in targets: refs.append({'offset':off,'target':h})
              row={'tag_hash':tag,'entry_index':e['index'],'reference':e['reference'].upper(),'size':len(b),
                   'parsed':p,'family_refs':refs,'prefix_256':b[:256].hex()}
              out['resources'].append(row)
              print('\nRESOURCE',tag,'size',len(b),'role',p.get('semantic_role'))
              for k in ('unk08','unk10','unk18'): print(k,p.get(k))
              print('family refs',refs)
          Path('out/809D8886_8887_probe.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-guardian-67bone-owner-resource-probe
          path: out/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
