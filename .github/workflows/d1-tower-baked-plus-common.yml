name: D1 Tower baked plus common world layers

on:
  workflow_run:
    workflows: ["D1 Tower common-layer model export"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install scene dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy trimesh
          mkdir -p source_models source_decals common combined chunks reports
      - name: Recover exact common model and binary decal evidence artifacts
        run: |
          set -euo pipefail
          gh run download "${{ github.event.workflow_run.id }}" -n d1-tower-common-layer-model-export -D source_models
          gh run download 33974200735 -n d1-tower-decal-layer-with-dependencies -D source_decals
          test -f source_models/reports/common_layer_model_export.json
          test -f source_decals/reports/decal_layer_closure.json
      - name: Assemble exactly nine table-scoped common carriers
        run: |
          set -euo pipefail
          vals=(); for p in source_decals/validation/common_*.json; do vals+=(--validation "$p"); done
          test "${#vals[@]}" -eq 18
          python tools/d1_world_common_layer_scene.py "${vals[@]}" --model-dir source_models/models \
            --out common/D1_TOWER_COMMON_LAYER.glb --report reports/common_layer_scene.json
          python - <<'PY'
          import json
          d=json.load(open('reports/common_layer_scene.json'))
          if d['source_record_count']!=327 or d['unique_model_count']!=69 or d['source_resolved_records']!=327 or d['unresolved_records']!=0:
              raise SystemExit('common layer invariant failed: '+json.dumps({k:d.get(k) for k in ['source_record_count','unique_model_count','source_resolved_records','unresolved_records','zero_selected_geometry_models','valid_zero_geometry_records']}))
          print('COMMON_LAYER_SOURCE_COVERAGE_OK',d['source_record_count'],d['geometry_emitting_record_placements'],d['valid_zero_geometry_records'])
          PY
      - name: Recover current ten-cell textured baked-static reference
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://github.com/lizardpeter/destiny-1/releases/download/d1-tower-ten-cell-r1/D1_TOWER_TEN_CELL_TEXTURED_BROAD_BASE_NORMAL.glb' \
            -o combined/D1_TOWER_TEN_CELL_TEXTURED_BROAD_BASE_NORMAL.glb
          echo 'dc8a4f20e3b17f06720fe128e59ee1bd1c9e1492d7823f961c6df9adee6340aa  combined/D1_TOWER_TEN_CELL_TEXTURED_BROAD_BASE_NORMAL.glb' | sha256sum --check --strict
      - name: Merge independently validated baked and common layers
        run: |
          set -euo pipefail
          python tools/d1_world_layer_merge.py \
            --layer baked_static=combined/D1_TOWER_TEN_CELL_TEXTURED_BROAD_BASE_NORMAL.glb \
            --layer common_decal=common/D1_TOWER_COMMON_LAYER.glb \
            --logical-count baked_static=11728 --logical-count common_decal=327 \
            --out combined/D1_TOWER_BAKED_PLUS_COMMON.glb --report reports/baked_plus_common.json
          python - <<'PY'
          import json
          d=json.load(open('reports/baked_plus_common.json'))
          if d['logical_source_records_total']!=12055 or d['layer_count']!=2:
              raise SystemExit('combined logical count mismatch')
          c=json.load(open('reports/common_layer_scene.json'))
          out={
            'status':'D1_TOWER_BAKED_PLUS_COMMON_STRUCTURAL_MILESTONE',
            'baked_retail_visible_placements':11728,
            'common_source_records':327,
            'common_geometry_emitting_records':c['geometry_emitting_record_placements'],
            'common_valid_zero_geometry_records':c['valid_zero_geometry_records'],
            'logical_source_records':12055,
            'combined_geometry_nodes':d['geometry_nodes'],
            'combined_geometry_variants':d['geometry_variants'],
            'bounds':d['bounds'],'bytes':d['glb_bytes'],'sha256':d['glb_sha256'],
            'scope':'Baked-static + table-scoped common/decal model layers only; terrain/entities/sky/lights/runtime layers remain separate future layers.',
          }
          open('reports/FINAL_BAKED_PLUS_COMMON.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Split combined GLB for artifact handoff
        run: |
          set -euo pipefail
          split -b 90M -d -a 2 combined/D1_TOWER_BAKED_PLUS_COMMON.glb chunks/D1_TOWER_BAKED_PLUS_COMMON.glb.part
          cp reports/FINAL_BAKED_PLUS_COMMON.json reports/common_layer_scene.json reports/baked_plus_common.json chunks/
          python - <<'PY'
          from pathlib import Path
          parts=sorted(p.name for p in Path('chunks').glob('*.glb.part*'))
          Path('chunks/REASSEMBLE_WINDOWS.cmd').write_text('@echo off\r\ncopy /b '+ '+'.join(parts)+' D1_TOWER_BAKED_PLUS_COMMON.glb\r\ncertutil -hashfile D1_TOWER_BAKED_PLUS_COMMON.glb SHA256\r\npause\r\n')
          Path('chunks/README.txt').write_text('Structural Tower milestone: 11,728 baked-static placements plus 327 table-scoped common/decal source records. Common materials are not yet fully texture-baked.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-tower-common-layer-scene
          path: |
            common/D1_TOWER_COMMON_LAYER.glb
            reports/common_layer_scene.json
          retention-days: 14
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: d1-tower-baked-plus-common-chunks
          path: chunks/
          retention-days: 14
          compression-level: 0
