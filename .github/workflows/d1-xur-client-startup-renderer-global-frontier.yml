name: D1 Xur client-startup renderer-global frontier

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-client-startup-renderer-global-frontier.yml'
      - 'tools/d1_remote_client_startup_globals_probe.py'
      - 'tools/d1_universal_member_catalog.py'

permissions: {contents: read}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Rebuild exact current package catalog and runtime
        run: |
          set -euo pipefail
          mkdir -p input runtime out/payloads
          curl --fail --location --retry 4 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o input/packages.txt
          curl --fail --location --retry 4             'https://github.com/lizardpeter/destiny-1/releases/download/d1-global-activity-index-r1/D1_CURRENT_ACTIVITY_INDEX.json'             -o input/D1_CURRENT_ACTIVITY_INDEX.json
          echo '6b82da75f2f45852fa8addc58d2f835f914adfb48533e0388b4bd24f949b3f06  input/D1_CURRENT_ACTIVITY_INDEX.json' | sha256sum --check --strict
          python tools/d1_universal_member_catalog.py             --activity-index input/D1_CURRENT_ACTIVITY_INDEX.json             --package-list input/packages.txt             --out input/D1_UNIVERSAL_MEMBER_CATALOG.json
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll'             -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so'             -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Trace client startup renderer-resource graph
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_client_startup_globals_probe.py
          python tools/d1_remote_client_startup_globals_probe.py             --member-catalog input/D1_UNIVERSAL_MEMBER_CATALOG.json             --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10             --runtime runtime --max-depth 5 --max-nodes 4096 --dump-dir out/payloads             -o out/D1_XUR_CLIENT_STARTUP_RENDERER_GLOBAL_FRONTIER.json | tee out/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/D1_XUR_CLIENT_STARTUP_RENDERER_GLOBAL_FRONTIER.json'))
          assert d['status']=='D1_CLIENT_STARTUP_GLOBALS_SCOPE_FRONTIER_EXACT',d['violations']
          assert d['named_root']=={'hash':'80B1A000','named_class':'80800341','package_id':'018D'},d['named_root']
          assert d['gates']['client_startup_root_recovered'] is True,d['gates']
          assert d['walk']['visited_node_count']>1,d['walk']
          assert d['walk']['edge_count']>0,d['walk']
          print('CLIENT_STARTUP_DEEP_FRONTIER_GREEN',json.dumps({
            'walk':d['walk'],
            'scope_hashes':d['scope_hashes'],
            'class_histogram':d['visited_class_histogram']
          },sort_keys=True))
          PY
          find out -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-XUR-CLIENT-STARTUP-RENDERER-GLOBAL-FRONTIER
          path: out/
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
