name: SMG Indexed GX Palette A-B Benchmark
on:
  push:
    branches: [bench/smg-indexed-palette-20261009]
    paths:
      - 'bench/smg_palette/**'
      - '.github/workflows/smg-indexed-palette-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact source unit tests
        shell: bash
        run: cargo test --release --manifest-path bench/smg_palette/Cargo.toml
      - name: Palette-indexed texture decode A-B
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS="-C target-cpu=native" CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 cargo run --release --manifest-path bench/smg_palette/Cargo.toml
