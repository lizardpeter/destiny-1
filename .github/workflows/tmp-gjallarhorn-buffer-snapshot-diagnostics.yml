name: Temporary diagnose Gjallarhorn stream headers

on:
  push:
    paths:
      - '.github/workflows/tmp-gjallarhorn-buffer-snapshot-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover runtime and exact 011c 011e snapshots
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x43779C800 \
            --target ps4_gear_weapons_011c_0.pkg --target ps4_gear_weapons_011c_1.pkg \
            --target ps4_gear_weapons_011c_2.pkg --target ps4_gear_weapons_011c_3.pkg --target ps4_gear_weapons_011c_5.pkg \
            --target ps4_gear_weapons_011e_0.pkg --target ps4_gear_weapons_011e_1.pkg \
            --target ps4_gear_weapons_011e_2.pkg --target ps4_gear_weapons_011e_3.pkg --target ps4_gear_weapons_011e_5.pkg \
            --out recovered --manifest reports/extract.json --retries 6 --timeout 90
      - name: Diagnose selected buffer headers and linked payloads
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import hashlib,json,struct,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader, decode_known

          targets={
            '80A39971':'vertex','80A39972':'vertex','80A3997A':'vertex','80A39973':'vertex','80A39974':'index',
            '80A3D4D3':'index',
          }
          rows=[]
          for family in ['011c','011e']:
            for p in sorted(Path('recovered').glob(f'ps4_gear_weapons_{family}_*.pkg')):
              try:
                r=EntryReader(p,Path('runtime')); by={e['tag_hash'].upper():e for e in r.entries}
              except Exception as ex:
                rows.append({'snapshot':p.name,'reader_error':repr(ex)}); continue
              for tag,expected in targets.items():
                e=by.get(tag)
                if not e: continue
                rec={'snapshot':p.name,'tag':tag,'expected':expected,'index':e['index'],'type':e['type'],'subtype':e['subtype'],'reference':e['reference'].upper(),'file_size':e['file_size'],'available':r.available(e['index'])}
                try:
                  b=r.entry(e['index']); rec['header_sha256']=hashlib.sha256(b).hexdigest(); rec['header_prefix']=b[:32].hex(); rec['decoded']=decode_known(e,b,r.h['platform'])
                  ref=by.get(e['reference'].upper())
                  rec['ref_present']=bool(ref)
                  if ref:
                    rec['ref_type']=ref['type'];rec['ref_subtype']=ref['subtype'];rec['ref_size']=ref['file_size'];rec['ref_available']=r.available(ref['index'])
                    try:
                      pb=r.entry(ref['index']);rec['payload_len']=len(pb);rec['payload_sha256']=hashlib.sha256(pb).hexdigest()
                    except Exception as ex: rec['payload_error']=repr(ex)
                  if expected=='vertex' and len(b)>=8:
                    rec['raw_stride_s16']=struct.unpack_from('<h',b,4)[0]
                  if expected=='index' and len(b)>=2:
                    rec['is32bit']=bool(b[1])
                except Exception as ex:
                  rec['header_error']=repr(ex)
                rows.append(rec)
                print('GJ_BUFFER_SNAPSHOT',json.dumps(rec,separators=(',',':')),flush=True)
          Path('reports/gjallarhorn_buffer_snapshot_diagnostics.json').write_text(json.dumps({'rows':rows},indent=2)+'\n')
          valid72=[x for x in rows if x.get('tag')=='80A39972' and x.get('type')==32 and x.get('subtype')==4 and x.get('raw_stride_s16',0)>0 and not x.get('payload_error')]
          print('VALID_80A39972',json.dumps(valid72,separators=(',',':')))
          if not valid72: raise SystemExit('no valid 80A39972 vertex header/payload snapshot')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-gjallarhorn-buffer-snapshot-diagnostics
          path: reports/
          retention-days: 7
          if-no-files-found: error
