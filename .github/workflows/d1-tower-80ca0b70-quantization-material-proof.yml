name: D1 Tower 80CA0B70 quantization and material proof

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-80ca0b70-quantization-material-proof.yml'
      - 'tools/d1_tower_static_quantization_proof.py'
      - 'tools/d1_tower_static_model_crosscheck.py'
      - 'tools/d1_material_literal_reference_join.py'
      - 'evidence/d1_tower_80ca0b70_material_references.json'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install dependencies and Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy trimesh
          mkdir -p runtime recovered validation model_reports diagnostics
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Direct-range recover exact validated corpus
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar
          # Exact member positions/SHA values were independently recovered by validator
          # run 33944444030 / artifact 9962935387. A changed `latest` archive fails SHA.
          members=[
            ('ps4_arch_human_earth_city_009f_0.pkg',2870153216,269680640,'7446d5c4b8c2ca3fed6bb0b13a649ff68052a8a2fcfa3aae1b38bf8356c54813'),
            ('ps4_arch_human_earth_city_009f_1.pkg',3139834368,32270336,'e5907ac4b5ba8256c23b667b5f1b237b729db824503a225c9b39daad993d7719'),
            ('ps4_arch_human_earth_city_009f_2.pkg',3172105216,203638784,'467047bcfab0281f0f1a69ea2e43038c9e1bc616b0214f1cdc62eb7666844b24'),
            ('ps4_arch_human_earth_city_009f_4.pkg',3375744512,116736,'0f58f8042d96852a1641e4b4378d2b6f7316b15ba8c6294cd5674e5ac61dc504'),
            ('ps4_city_tower_destination_0250_0.pkg',7882616320,294875136,'beb269a2673f1106e2eff20ff577d0221d7fa56a8b71f5f8763cf34272114b32'),
            ('ps4_city_tower_destination_0250_1.pkg',8177491968,17983488,'87904a97ce9899305b6bdba9df960d220749b3b2398c4ba8bd97e6efb8f81f91'),
            ('ps4_city_tower_destination_0250_2.pkg',8195475968,11143168,'7543c1926023ec76ff8949618e04e1d0a93609f8448a1f8f875fcfc505a6b219'),
            ('ps4_city_tower_destination_0250_3.pkg',8206619648,206848,'1db9423081f922b78cce256641dfab195e6a4b4afb6020e4e0c5029234f19375'),
            ('ps4_city_tower_destination_0250_4.pkg',8206827008,17901568,'5a9370d60724622fb6592a7bcfa2fc4dbb40a4fca5cd696ce8db086a5756e84f'),
            ('ps4_city_tower_destination_0250_5.pkg',8224729088,1677312,'2066afe09503eee4c35d948f6749a6e7b7b02572dcd41d1d3ca679fa523ea22c'),
          ]
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=90)
          rows=[]
          for name,off,size,expected in members:
              dst=Path('recovered')/name
              got=arc.copy_to(off,size,dst)
              if got.lower()!=expected.lower():
                  raise SystemExit(f'{name}: SHA mismatch {got} != {expected}')
              rows.append({'name':name,'data_offset':off,'size':size,'sha256':got})
              print('RECOVERED',name,size,got,flush=True)
          Path('diagnostics/member_catalog.json').write_text(json.dumps({'source_validation_run':33944444030,'members':rows},indent=2)+'\n')
          PY

      - name: Revalidate exact 80CA0B70 chain
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_tower_map_schema_validate.py "${args[@]}" --runtime runtime --out validation > diagnostics/validator_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('validation/tower_map_schema_validation.json'))
          good=[x for x in d['static_map_data'] if x.get('hash')=='80CA0B70' and x.get('ok')]
          if len(good)!=1: raise SystemExit(f'80CA0B70 passing rows={len(good)}')
          x=good[0]['d1_validation']
          assert x['hash']=='80CA0B96' and x['ok'] and x['instance_count']==123 and x['transform_size_exact']
          assert len(x['static_tables'])==4 and sum(t['summary']['meshes'] for t in x['static_tables'])==124
          assert all(t['summary']['all_mesh_targets_exist'] and t['summary']['all_info_indices_in_bounds'] for t in x['static_tables'])
          print('REVALIDATED 80CA0B70 -> 80CA0B96')
          PY

      - name: Independently decode the two exact matching entity models
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          p=recovered/ps4_city_tower_destination_0250_5.pkg
          python tools/d1_entity_model_export.py "$p" --runtime runtime --tag-hash 80CA0B95 --out model_reports/80CA0B95.glb --json model_reports/80CA0B95.json > diagnostics/model_80CA0B95_stdout.txt
          python tools/d1_entity_model_export.py "$p" --runtime runtime --tag-hash 80CA0F39 --out model_reports/80CA0F39.glb --json model_reports/80CA0F39.json > diagnostics/model_80CA0F39_stdout.txt

      - name: Cross-check static records against independent model decodes
        run: |
          set -euo pipefail
          python tools/d1_tower_static_model_crosscheck.py \
            --validation-json validation/tower_map_schema_validation.json \
            --model-report-dir model_reports \
            --static-map-data 80CA0B70 \
            --out diagnostics/static_model_crosscheck.json | tee diagnostics/static_model_crosscheck_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('diagnostics/static_model_crosscheck.json'))['summary']
          assert d['static_mesh_records']==124
          assert d['exact_buffer_range_primitive_lod_matches']==24
          assert d['exact_matches_with_unique_decode_signature']==24
          assert d['exact_matches_with_conflicting_decode_signature']==0
          assert d['matching_models']=={'80CA0B95':18,'80CA0F39':6}
          PY

      - name: Prove or reject static quantization composition algebraically
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          set +e
          python tools/d1_tower_static_quantization_proof.py "${args[@]}" \
            --runtime runtime \
            --validation-json validation/tower_map_schema_validation.json \
            --crosscheck-json diagnostics/static_model_crosscheck.json \
            --static-map-data 80CA0B70 \
            --out diagnostics/static_quantization_proof.json \
            | tee diagnostics/static_quantization_stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > diagnostics/static_quantization_exit_code.txt
          # A rejection is a useful reverse-engineering result; preserve it instead of hiding the artifact.
          test -s diagnostics/static_quantization_proof.json

      - name: Parse exact current-generation material arrays
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          p=recovered/ps4_city_tower_destination_0250_5.pkg
          args=()
          for h in 80CA0BD6 80CA0BD7 80CA0BD8 80CA0BD9 80CA0BDA 80CA0BDB 80CA0BDC 80CA0C37 80CA0C38 80CA0C39 80CA0C3A 80CA0CB1 80CA0CB2 80CA0D87 80CA0D8D 80CA0D90 80CA0D91 80CA0D93 80CA0DBC 80CA0E6E 80CA0F4B 80CA0F4C; do args+=(--tag-hash "$h"); done
          python tools/d1_material_decode.py "$p" --runtime runtime "${args[@]}" -o diagnostics/materials_0250_5.json
          python - <<'PY'
          import json
          decoded=json.load(open('diagnostics/materials_0250_5.json'))
          prior=json.load(open('evidence/d1_tower_80ca0b70_material_references.json'))
          by={x['tag_hash']:x for x in decoded['materials']}
          rows=[]; total=0; matched=0
          for m in prior['materials']:
              d=by[m['material']]
              arrays=[]
              for stage in ('vs_textures','ps_textures'):
                  for item in d.get(stage,{}).get('items',[]):
                      arrays.append({'stage':stage.removesuffix('_textures'),'texture_index':item['texture_index'],'texture':item['texture']})
              for t in m['textures']:
                  total += len(t['offsets'])
                  hits=[x for x in arrays if x['texture']==t['target']]
                  matched += len(hits)
                  rows.append({'material':m['material'],'literal_texture':t['target'],'literal_offsets':t['offsets'],'decoded_array_hits':hits})
          out={'evidence_status':'CURRENT_GENERATION_MATERIAL_ARRAY_PARSE','snapshot':'ps4_city_tower_destination_0250_5.pkg',
               'materials_decoded':len(decoded['materials']),'prior_literal_occurrences':total,
               'decoded_array_hit_count':matched,'rows':rows,
               'policy':'stage and texture_index are assigned only from d1_material_decode.py dynamic-array parsing of shipped _5 bytes'}
          open('diagnostics/material_texture_slot_join.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Compact proof summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def load(p):
              q=Path(p)
              return json.loads(q.read_text()) if q.exists() else None
          q=load('diagnostics/static_quantization_proof.json')
          m=load('diagnostics/material_texture_slot_join.json')
          c=load('diagnostics/static_model_crosscheck.json')
          out={'static_map_data':'80CA0B70','static_model_crosscheck':None if not c else c.get('summary'),
               'quantization_conclusion':None if not q else q.get('conclusion'),
               'quantization_aggregate':None if not q else q.get('aggregate'),
               'material_slot_summary':None if not m else {k:m[k] for k in ('materials_decoded','prior_literal_occurrences','decoded_array_hit_count')},
               'status':'DIAGNOSTIC_COMPLETE' if q and m and c else 'DIAGNOSTIC_PARTIAL'}
          Path('diagnostics/summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-80ca0b70-quantization-material-proof
          path: |
            diagnostics/
            validation/tower_map_schema_validation.json
            model_reports/*.json
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
