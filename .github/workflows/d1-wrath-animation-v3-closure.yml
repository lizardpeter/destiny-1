name: D1 Wrath activity animation v3 closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-wrath-animation-v3-closure.yml'
      - 'tools/d1_animation_control_state_map_v2.py'
      - 'tools/d1_tiger_animation_safe_offsets.py'
      - 'tools/d1_remote_spawned_actor_animation_options_v3.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  WRATH_SOURCE_ARTIFACT_ID: '10003468849'
  WRATH_SOURCE_ARTIFACT_ZIP_SHA256: '81c395d9be86c569b96e0de1e79f852f8f7d642aa33344fc7807d505feee0999'
  PARSER_COMMIT: 'b9fdc3a43dd28118113275624fcc9054b75855f4'

jobs:
  close-animation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact catalog, Wrath closure, parser, and runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy scipy pyglm
          mkdir -p input/catalog input/wrath runtime out

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${WRATH_SOURCE_ARTIFACT_ID}/zip" -o input/wrath.zip
          echo "${WRATH_SOURCE_ARTIFACT_ZIP_SHA256}  input/wrath.zip" | sha256sum --check --strict
          unzip -q input/wrath.zip -d input/wrath
          test -f input/wrath/wrath/entity_dependency_closure.json

          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet "$PARSER_COMMIT"
          test "$(git -C parser rev-parse HEAD)" = "$PARSER_COMMIT"

          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Compile source-closed adapters and derive actor seeds
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/d1_animation_control_state_map_v2.py \
            tools/d1_tiger_animation_safe_offsets.py \
            tools/d1_remote_spawned_actor_animation_options_v3.py \
            tools/d1_activity_actor_animation_seed.py
          python tools/d1_activity_actor_animation_seed.py \
            --entity-closure input/wrath/wrath/entity_dependency_closure.json \
            -o out/wrath_activity_actor_animation_seed.json \
            | tee out/actor_seed.txt
          python - <<'PY'
          import json
          d=json.load(open('out/wrath_activity_actor_animation_seed.json'))
          assert d['status']=='D1_ACTIVITY_ACTOR_ANIMATION_SEED_COMPLETE',d
          assert not d['violations'],d['violations']
          assert d['exact_sentity_count']==241,d['exact_sentity_count']
          assert d['animation_capable_entity_count']==123,d['animation_capable_entity_count']
          PY

      - name: Execute full source-closed animation v3 path
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python tools/d1_remote_spawned_actor_animation_options_v3.py \
            --seed out/wrath_activity_actor_animation_seed.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' \
            --part-count 10 --runtime runtime --parser-root parser \
            -o out/wrath_activity_actor_animation_options_v3.json \
            | tee out/animation_v3.txt

          python - <<'PY'
          import json
          d=json.load(open('out/wrath_activity_actor_animation_options_v3.json'))
          assert d['schema']=='d1_remote_spawned_actor_animation_options/v3',d.get('schema')
          assert d['status']=='D1_ACTIVITY_ACTOR_ANIMATION_OPTIONS_COMPLETE',d['status']
          assert d['entity_count']==123,d['entity_count']
          assert d['source_closed_entity_count']==123,d['source_closed_entity_count']
          assert d['preserved_with_frontier_entity_count']==0,d
          assert d['violation_entity_count']==0,d
          assert d['frontier_count']==0,d['frontiers'][:20]
          assert d['violation_count']==0,d['violations'][:20]
          assert d['unique_control_count']==45,d['unique_control_count']
          assert d['closed_target_count']==d['target_count'],(d['closed_target_count'],d['target_count'])
          assert d['retarget_pair_failure_count']==0,d['retarget_pair_failure_count']
          assert d['retarget_pair_success_count']==d['retarget_pair_execution_count'],d
          assert d['implicit_null_selector_count']==2,d['implicit_null_selector_count']
          assert set(d['implicit_null_selector_controls'])=={'817A55AD','817BD0EC'},d['implicit_null_selector_controls']
          assert d['exact_empty_control_target_count']==4,d['exact_empty_control_target_count']
          for h in ('8179E6A6','8179E6AE','8179E6B8'):
              hits=[c for t in d['targets'] for c in t.get('clips',[]) if c.get('clip')==h]
              assert hits and all(x.get('retarget_success') for x in hits),(h,hits)
          null_states=[]
          for ch,ci in d['controls'].items():
              for st in ci.get('state_table',{}).get('records',[]):
                  if st.get('selection_kind')=='range_with_implicit_null_tail':
                      null_states.append((ch,st))
          assert len(null_states)==2,null_states
          assert all(len(st['selected_animations'])==1 and st.get('implicit_null_count')==1 for _,st in null_states),null_states
          print('WRATH_ANIMATION_V3_CLOSED',d['entity_count'],d['unique_control_count'],d['target_count'],d['retarget_pair_execution_count'],d['unique_selector_selected_clip_count'],d['unique_animation_list_clip_count'])
          print('NULL_TAIL_CONTROLS',d['implicit_null_selector_controls'],'EMPTY_TARGETS',d['exact_empty_control_target_count'])
          PY

      - name: Hash outputs
        if: always()
        run: |
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-WRATH-ACTIVITY-ANIMATION-V3-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
