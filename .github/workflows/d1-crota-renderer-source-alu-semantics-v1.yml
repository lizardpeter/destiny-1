name: D1 Crota renderer source ALU semantics 808EE505 v1

on:
  workflow_dispatch:
  push:
    branches:
      - d1-crota-source-semantics-v1
    paths:
      - '.github/workflows/d1-crota-renderer-source-alu-semantics-v1.yml'
      - 'tools/d1_gcn_renderer_program_add_source_alu_semantics.py'

env:
  RENDERER_ARTIFACT_ID: '10080897663'
  RENDERER_ARTIFACT_ZIP_SHA256: 'ba979f80e14a536f4943a703ed06df4b2a92da75bf994918c56cd144fe41b0ce'

permissions:
  contents: read
  actions: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Recover immutable interpolation checkpoint
        run: |
          set -euo pipefail
          mkdir -p input out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RENDERER_ARTIFACT_ID}/zip" -o input/renderer.zip
          echo "${RENDERER_ARTIFACT_ZIP_SHA256}  input/renderer.zip" | sha256sum --check --strict
          unzip -q input/renderer.zip -d input/renderer
          test -f input/renderer/D1_80D777B6_808EE505_RENDERER_PROGRAM.json
          test -f input/renderer/PS_808EE505_STRUCTURAL_IR_V3.json
      - name: Promote exact source-backed scalar VGPR ALU contracts
        run: |
          set -euo pipefail
          python tools/d1_gcn_renderer_program_add_source_alu_semantics.py \
            --program input/renderer/D1_80D777B6_808EE505_RENDERER_PROGRAM.json \
            --ir input/renderer/PS_808EE505_STRUCTURAL_IR_V3.json \
            -o out/D1_80D777B6_808EE505_RENDERER_PROGRAM.json
          python - <<'PY'
          import json
          d=json.load(open('out/D1_80D777B6_808EE505_RENDERER_PROGRAM.json'))
          assert d['status']=='D1_GCN_RENDERER_PROGRAM_IR_EXACT_PARTIAL' and not d['violations'],d
          p=d['program'];c=p['coverage']
          expected={'CONTROL_EXACT':18,'EXPRESSION_EXACT':254,'INPUT_PROVENANCE_EXACT':70,'RECURRENCE_EXACT':36,'STRUCTURAL_ONLY':78}
          assert c['primary_resolution_counts']==expected,c
          assert c['exact_nonstructural_instruction_count']==378
          assert c['source_alu_semantics_promoted_instruction_count']==93
          assert len(p['source_alu_instruction_contracts'])==93
          assert d['semantic_boundary']['source_backed_scalar_vgpr_alu']=='EXACT_SYMBOLIC_FOR_LISTED_93_INSTRUCTIONS'
          print('CROTA_SOURCE_ALU_SEMANTICS_CLOSED',expected,'exact_nonstructural',378)
          PY
          cp input/renderer/PS_808EE505_STRUCTURAL_IR_V3.json out/
          cp input/renderer/PS_808EE505_DESCRIPTOR_LIVE_PROVENANCE.json out/
          cp input/renderer/GFX7_DESCRIPTOR_SEMANTICS.json out/
          sha256sum out/*.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-CROTA-808EE505-RENDERER-SOURCE-ALU-SEMANTICS-V1
          path: out/
          retention-days: 30
          if-no-files-found: error
