name: D1 Oodle3 baseline profile snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-oodle3-exp-baseline-profile.yml'

permissions:
  contents: write

jobs:
  profile:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable

      - name: Recover exact benchmark blocks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered profile out
          python - <<'PY'
          import hashlib,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar
          from d1_pkg_probe import parse_header,parse_blocks,read_table

          name='ps4_city_tower_destination_024c_5.pkg'
          off=7715401728; size=1687552
          expected='b404bacccf44a4bf6859bf3b867ae02f5dc840432bdaa081c341439c2ae83311'
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=5,timeout=90)
          pkg=Path('recovered')/name
          got=arc.copy_to(off,size,pkg)
          if got.lower()!=expected: raise SystemExit(got)

          with pkg.open('rb') as f:
              h=parse_header(f); bt=read_table(f,h['block_table_offset'],h['block_table_count'],32)
          chosen=[]
          for b in parse_blocks(bt):
              if not b['compressed'] or int(b['patch_id'])!=5: continue
              with pkg.open('rb') as f:
                  f.seek(int(b['offset'])); comp=f.read(int(b['size']))
              if hashlib.sha1(comp).hexdigest().lower()!=str(b['sha1']).lower():
                  raise RuntimeError('sha mismatch')
              p=Path('profile')/f"block_{int(b['index'])}.comp"
              p.write_bytes(comp); chosen.append(p)
              if len(chosen)==8: break
          if len(chosen)!=8: raise SystemExit(len(chosen))
          PY

      - name: Hot-path census
        working-directory: rust/d1_oodle3
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in ../../profile/block_*.comp; do args+=("$f"); done
          cargo run --release --features profile --bin profile_decode -- 262144 "${args[@]}" | tee ../../out/hot_profile.txt

      - name: Stage profile
        working-directory: rust/d1_oodle3
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for f in ../../profile/block_*.comp; do args+=("$f"); done
          cargo run --release --features stage_profile --bin stage_profile_decode -- 262144 160 "${args[@]}" | tee ../../out/stage_profile.txt

      - name: Summarize profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def parse(path):
              out={}
              for line in Path(path).read_text().splitlines():
                  if ' ' not in line: continue
                  k,v=line.split(' ',1)
                  try:
                      out[k]=float(v) if '.' in v else int(v)
                  except:
                      out[k]=v
              return out

          hot=parse('out/hot_profile.txt')
          stage=parse('out/stage_profile.txt')
          symbols=hot.get('PROFILE_HUFFMAN_FAST',0)+hot.get('PROFILE_HUFFMAN_LONG',0)+hot.get('PROFILE_HUFFMAN_TAIL',0)
          matches=hot.get('PROFILE_RECENT_MATCHES',0)+hot.get('PROFILE_EXPLICIT_MATCHES',0)
          report={
              'base_commit':'ad42564c1958780289a6af01f2cbb2568c7cb695',
              'hot':hot,
              'stage':stage,
              'derived':{
                  'total_huffman_symbols':symbols,
                  'literal_fraction': hot.get('PROFILE_LITERALS',0)/symbols if symbols else None,
                  'match_token_fraction': matches/symbols if symbols else None,
                  'long_huffman_fraction': hot.get('PROFILE_HUFFMAN_LONG',0)/symbols if symbols else None,
                  'refill32_per_symbol': hot.get('PROFILE_REFILL_32',0)/symbols if symbols else None,
                  'avg_literal_run_between_matches': hot.get('PROFILE_LITERALS',0)/matches if matches else None
              }
          }
          Path('out/baseline_profile.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Commit profile result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/benchmarks
          cp out/baseline_profile.json evidence/benchmarks/oodle3_baseline_profile.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add evidence/benchmarks/oodle3_baseline_profile.json
          git commit -m "Record Oodle3 retained-head profile" || exit 0
          git push
