name: D1 Spektar Pandion 0x7FFF representation probe

on:
  push:
    paths:
      - '.github/workflows/d1-spektr-pandion-7fff-representation-probe.yml'
      - 'tools/d1_guardian_vertex_representation_probe.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy trimesh
          mkdir -p input runtime out
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=d1-spektr-pandion-titan-masculine&per_page=20" \
            | python -c "import json,sys; a=[x for x in json.load(sys.stdin)['artifacts'] if not x['expired']]; print(a[0]['archive_download_url'])")
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$url" -o input/spektar.zip
          unzip -q input/spektar.zip -d input/spektar
          test -f input/spektar/spektar_pandion_resources.json
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Probe both body variants
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          for role in masculine feminine; do
            python tools/d1_guardian_vertex_representation_probe.py \
              --report input/spektar/spektar_pandion_resources.json --body-role "$role" \
              --member-catalog evidence/d1_investment_asset_member_catalog.json \
              --member-catalog evidence/d1_player_gear_member_catalog.json \
              --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
              --runtime runtime -o "out/spektar_${role}_vertex_representation.json"
          done
          python - <<'PY'
          import json
          for role in ('masculine','feminine'):
              d=json.load(open(f'out/spektar_{role}_vertex_representation.json'))
              print('\n===',role.upper(),'7FFF MESHES ===')
              for m in d['models']:
                  name=(m.get('examples') or [{}])[0].get('name')
                  for x in m['meshes']:
                      if x['contains_7fff']:
                          ur=x['resources']['unk_resource']; old=x['resources']['old_weights']
                          print(name,m['tag_hash'],'mesh',x['mesh_index'],'lane',x['joint_lane_distribution'],
                                'strides',x['stride0'],x['stride1'],
                                'old',x['old_weights'],old.get('reference'),
                                'unk',x['unk_resource'],ur.get('reference'),
                                'unk_payload',(ur.get('linked_payload') or {}).get('tag_hash'),
                                (ur.get('linked_payload') or {}).get('type'),(ur.get('linked_payload') or {}).get('subtype'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-spektr-pandion-7fff-representation-probe
          path: out/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
