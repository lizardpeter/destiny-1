name: D1 Spektar Pandion inline skin validation

on:
  push:
    paths:
      - '.github/workflows/d1-spektr-pandion-inline-skin-validation.yml'
      - 'tools/d1_guardian_inline_skin_probe.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies, Spektar report, and Oodle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy trimesh
          mkdir -p input runtime out
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=d1-spektr-pandion-titan-masculine&per_page=20" \
            | python -c "import json,sys; a=[x for x in json.load(sys.stdin)['artifacts'] if not x['expired']]; print(a[0]['archive_download_url'])")
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$url" -o input/spektar.zip
          unzip -q input/spektar.zip -d input/spektar
          test -f input/spektar/spektar_pandion_resources.json
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Decode every exact Spektar skin influence
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          for role in masculine feminine; do
            python tools/d1_guardian_inline_skin_probe.py \
              --report input/spektar/spektar_pandion_resources.json --body-role "$role" --node-count 67 \
              --member-catalog evidence/d1_investment_asset_member_catalog.json \
              --member-catalog evidence/d1_player_gear_member_catalog.json \
              --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
              --runtime runtime -o "out/spektar_${role}_inline_skin.json"
          done
      - name: Fail closed on malformed retail weights
        run: |
          python - <<'PY'
          import json
          for role in ('masculine','feminine'):
              d=json.load(open(f'out/spektar_{role}_inline_skin.json'))
              t=d['totals']
              assert t.get('weight_sum_failures',0)==0,(role,t,d['failure_meshes'])
              assert t.get('out_of_range',0)==0,(role,t,d['failure_meshes'])
              assert t.get('unresolved',0)==0,(role,t,d['failure_meshes'])
              assert t.get('mode:inline2',0)>0,(role,t)
              assert t.get('mode:inline4',0)>0,(role,t)
              assert t.get('mode:rigid_w',0)>0,(role,t)
              assert d['failure_meshes']==[],(role,d['failure_meshes'])
              print(role,'SUCCESS',t,'bone_domain',d['bone_domain'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-spektr-pandion-inline-skin-validation
          path: out/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
