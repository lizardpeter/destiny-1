name: D1 Spektar exact texture plates

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/d1_entry_extract.py'
      - 'tools/d1_oodle_probe.py'
      - 'tools/d1_spektar_texture_plate_build.py'
      - '.github/workflows/d1-spektar-exact-texture-plates.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover verified Oodle 3 runtime
        run: |
          set -euo pipefail
          mkdir -p runtime out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Build exact Spektar texture plates
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_spektar_texture_plate_build.py --runtime runtime --output-dir out
      - name: Require complete exact source set
        run: |
          python - <<'PY'
          import json, pathlib
          reports=list(pathlib.Path('out').glob('*.json'))
          assert reports, 'no Spektar plate report emitted'
          data=json.loads(reports[0].read_text())
          text=json.dumps(data)
          if '159' not in text:
              print(json.dumps(data,indent=2)[:12000])
              raise SystemExit('report does not demonstrate the expected 159-source corpus')
          print(json.dumps(data,indent=2)[:12000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-spektar-exact-texture-plates
          path: out/
          retention-days: 14
