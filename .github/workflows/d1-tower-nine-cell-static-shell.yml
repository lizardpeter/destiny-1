name: D1 Tower nine-cell baked-static shell

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-nine-cell-static-shell.yml'
      - 'tools/d1_tower_map_schema_validate_v3.py'
      - 'tools/d1_tower_static_chunk_export_v3.py'
      - 'tools/d1_tower_merge_placements.py'
      - 'evidence/d1_tower_dependency_member_catalog.json'

permissions:
  contents: read

jobs:
  build-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install numpy trimesh
          mkdir -p runtime recovered validation export reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Verify current archive family membership and recover exact corpus
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python - <<'PY'
          import json,re,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar

          # Previously byte/SHA-proven core package members.
          pinned=[
            ('ps4_arch_human_earth_city_009f_0.pkg',2870153216,269680640,'7446d5c4b8c2ca3fed6bb0b13a649ff68052a8a2fcfa3aae1b38bf8356c54813'),
            ('ps4_arch_human_earth_city_009f_1.pkg',3139834368,32270336,'e5907ac4b5ba8256c23b667b5f1b237b729db824503a225c9b39daad993d7719'),
            ('ps4_arch_human_earth_city_009f_2.pkg',3172105216,203638784,'467047bcfab0281f0f1a69ea2e43038c9e1bc616b0214f1cdc62eb7666844b24'),
            ('ps4_arch_human_earth_city_009f_4.pkg',3375744512,116736,'0f58f8042d96852a1641e4b4378d2b6f7316b15ba8c6294cd5674e5ac61dc504'),
            ('ps4_city_tower_destination_024c_0.pkg',7542949376,137527296,'ffb2e3cbb9777956384063e3c0fc5636200df51ae82a35a6aad06850dbf1fff2'),
            ('ps4_city_tower_destination_024c_1.pkg',7680477184,12226560,'21e75033fcba2f85b5d22b7377a7122c5135ce2c3f10f8453fc54a1d304c10f8'),
            ('ps4_city_tower_destination_024c_2.pkg',7692704256,13574144,'681349e0d32c213cae4bdef839bee8a6fa5aa3a5989c4a5344ee342cbe9d6e45'),
            ('ps4_city_tower_destination_024c_3.pkg',7706278912,2134016,'c6846bbe0bdf9aaf9ba194ed8a2a3b2c7e26178bd79218134e909fa460ebcaef'),
            ('ps4_city_tower_destination_024c_4.pkg',7708413440,6987776,'12dfe5e7dc65a8477d5ceabba5bb921b07c83110151a57b86a52ba3eb7d82018'),
            ('ps4_city_tower_destination_024c_5.pkg',7715401728,1687552,'b404bacccf44a4bf6859bf3b867ae02f5dc840432bdaa081c341439c2ae83311'),
            ('ps4_city_tower_destination_0250_0.pkg',7882616320,294875136,'beb269a2673f1106e2eff20ff577d0221d7fa56a8b71f5f8763cf34272114b32'),
            ('ps4_city_tower_destination_0250_1.pkg',8177491968,17983488,'87904a97ce9899305b6bdba9df960d220749b3b2398c4ba8bd97e6efb8f81f91'),
            ('ps4_city_tower_destination_0250_2.pkg',8195475968,11143168,'7543c1926023ec76ff8949618e04e1d0a93609f8448a1f8f875fcfc505a6b219'),
            ('ps4_city_tower_destination_0250_3.pkg',8206619648,206848,'1db9423081f922b78cce256641dfab195e6a4b4afb6020e4e0c5029234f19375'),
            ('ps4_city_tower_destination_0250_4.pkg',8206827008,17901568,'5a9370d60724622fb6592a7bcfa2fc4dbb40a4fca5cd696ce8db086a5756e84f'),
            ('ps4_city_tower_destination_0250_5.pkg',8224729088,1677312,'2066afe09503eee4c35d948f6749a6e7b7b02572dcd41d1d3ca679fa523ea22c'),
            ('ps4_globals_0157_0.pkg',18974578176,206192640,'e4f0844d75dde0d062ddf42f6a13b82d00689b76543c28255aefa28785d3f7b6'),
            ('ps4_globals_0157_1.pkg',19180771328,30326784,'91c19b8c392f8f12c98ec6527306190fe2a59012abfe016a975b54b42a7dad2f'),
            ('ps4_globals_0157_2.pkg',19211098624,30464000,'c8f71e22a37d2feed68178dbb60aed245bfbbe5d342c70d0e11dfd580684573f'),
            ('ps4_globals_0157_3.pkg',19241563136,268288,'d06814d03e9b00d9df8ed683bff036627cd3195edb8fe58fcf80566c13d3f79a'),
            ('ps4_globals_0157_4.pkg',19241831936,546816,'98b0e7abdfd88eabe7a3d6534b8f487dbbaa4ea0bf8e87b2d0fe6ec29c229077'),
            ('ps4_globals_0157_5.pkg',19242379264,380928,'723b1d79ed9904474bd737f9af6065dc6b6266eaf2c59d123e3452434550089c'),
            ('ps4_globals_0157_6.pkg',19242760704,356352,'51cb4f9bdb8a10e0fc25de757a9885641cce0c887549019831b9a0687a44b089'),
            ('ps4_env_skies_01cf_0.pkg',14216130048,277645312,'f45d85c89f46e5ba9585073f105b8a1c1229c4d543b56e38ccc840a0010d297a'),
            ('ps4_env_skies_01cf_1.pkg',14493775872,3885056,'16a54200f04680d06ed3936afc44aac1eaea8f111cc44acac2fa18cdd394b34f'),
            ('ps4_env_skies_01cf_2.pkg',14497661440,87631872,'1999fa9d728ef75393f59171325b397cb1356d94322694b6fedd60e339f171f9'),
          ]

          dep_catalog=json.loads(Path('evidence/d1_tower_dependency_member_catalog.json').read_text())
          extra_ids={'00ef','013a','0169','01c5','01d1','01e3'}
          extras=[]
          for r in dep_catalog['members']:
              m=re.search(r'_([0-9a-fA-F]{4})_[0-9]+\.pkg$',r['name'])
              if m and m.group(1).lower() in extra_ids:
                  extras.append((r['name'],int(r['data_offset']),int(r['size'])))

          # Ensure the archive has exactly the physical siblings represented by
          # our current core + dependency catalog for every package ID we consume.
          package_names={Path(x.strip()).name for x in Path('reports/packages.txt').read_text(errors='replace').splitlines() if x.strip()}
          expected_names={name for name,_,_,_ in pinned} | {name for name,_,_ in extras}
          ids={'009f','024c','0250','0157','01cf'} | extra_ids
          current={i:sorted(n for n in package_names if re.search(rf'_{i}_[0-9]+\.pkg$',n,re.I)) for i in ids}
          expected={i:sorted(n for n in expected_names if re.search(rf'_{i}_[0-9]+\.pkg$',n,re.I)) for i in ids}
          mismatch={i:{'expected':expected[i],'current':current[i]} for i in ids if expected[i]!=current[i]}
          if mismatch:
              raise SystemExit('current archive family membership differs from evidence catalog: '+json.dumps(mismatch,indent=2))
          Path('reports/family_membership.json').write_text(json.dumps(current,indent=2)+'\n')

          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=120)
          rows=[]
          for name,off,size,expected_sha in pinned:
              got=arc.copy_to(off,size,Path('recovered')/name)
              if got.lower()!=expected_sha.lower():
                  raise SystemExit(f'{name}: SHA mismatch {got} != {expected_sha}')
              rows.append({'name':name,'data_offset':off,'size':size,'sha256':got,'sha_pinned':True})
              print('PINNED',name,size,got,flush=True)
          for name,off,size in extras:
              got=arc.copy_to(off,size,Path('recovered')/name)
              rows.append({'name':name,'data_offset':off,'size':size,'sha256':got,'sha_pinned':False,
                           'offset_source':'evidence/d1_tower_dependency_member_catalog.json'})
              print('DEPENDENCY',name,size,got,flush=True)
          Path('reports/full_member_catalog.json').write_text(json.dumps({'members':rows},indent=2)+'\n')
          PY

      - name: Validate all nine normal map-owned baked-static cells
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_tower_map_schema_validate_v3.py "${args[@]}" --runtime runtime --out validation | tee reports/validator_v3_stdout.txt
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('validation/tower_map_schema_validation.json'))
          expected={
            '80C984D8':('80C9858B',372,570,1800),
            '80C98A6B':('80C98A77',2346,2191,12498),
            '80C993CD':('80C994B1',786,1056,5115),
            '80C993CF':('80C994B2',2523,2825,13827),
            '80C997F5':('80C9981A',444,567,2409),
            '80C99981':('80C9999B',326,607,1800),
            '80CA0B70':('80CA0B96',123,124,556),
            '80CA0B72':('80CA0B98',258,141,772),
            '80CA0C60':('80CA0C6B',304,471,1596),
          }
          out={}
          for parent,(child,nx,nm,np_) in expected.items():
              rows=[x for x in d.get('static_map_data',[]) if x.get('hash','').upper()==parent]
              good=[x for x in rows if x.get('ok')]
              if len(good)!=1:
                  detail=[{'ok':x.get('ok'),'violations':x.get('violations'),'child':(x.get('d1_validation') or {}).get('hash')} for x in rows]
                  raise SystemExit(f'{parent}: expected one passing row, got {len(good)}; {detail}')
              c=good[0]['d1_validation']
              meshes=sum(t['summary']['meshes'] for t in c['static_tables'])
              placements=sum(sum(i['instance_count'] for i in t['info_entries']) for t in c['static_tables'])
              null_v1=sum(t['summary'].get('null_vertices1_sentinel_records',0) for t in c['static_tables'])
              if c['hash'].upper()!=child or not c.get('ok') or c['instance_count']!=nx or meshes!=nm or placements!=np_ or not c.get('transform_size_exact'):
                  raise SystemExit(f'{parent}: exact invariant mismatch child={c.get("hash")} transforms={c.get("instance_count")} meshes={meshes} placements={placements}')
              if not all(t['summary']['all_required_mesh_targets_exist'] and t['summary']['all_info_indices_in_bounds'] for t in c['static_tables']):
                  raise SystemExit(f'{parent}: required-buffer or info-index invariant failed')
              out[parent]={'d1':child,'transforms':nx,'meshes':meshes,'placements':placements,'null_v1_records':null_v1}
          if sum(x['placements'] for x in out.values()) != 40373:
              raise SystemExit('nine-cell placement total mismatch')
          if sum(x['meshes'] for x in out.values()) != 8552:
              raise SystemExit('nine-cell mesh-record total mismatch')
          Path('reports/nine_cell_validation_summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Export nine validated Tower cells
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          for h in 80C984D8 80C98A6B 80C993CD 80C993CF 80C997F5 80C99981 80CA0B70 80CA0B72 80CA0C60; do
            echo "EXPORT $h"
            python tools/d1_tower_static_chunk_export_v3.py "${args[@]}" --runtime runtime \
              --validation-json validation/tower_map_schema_validation.json \
              --static-map-data "$h" --out "export/TOWER_${h}.glb" --json "export/TOWER_${h}.json" \
              | tee "reports/export_${h}.txt"
          done

      - name: Verify per-cell exports and merge serialized placements only
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          expected={
            '80C984D8':1800,'80C98A6B':12498,'80C993CD':5115,'80C993CF':13827,
            '80C997F5':2409,'80C99981':1800,'80CA0B70':556,'80CA0B72':772,'80CA0C60':1596,
          }
          rows=[]
          for h,n in expected.items():
              d=json.loads(Path(f'export/TOWER_{h}.json').read_text())
              if d['decode_failure_count'] != 0:
                  raise SystemExit(f'{h}: {d["decode_failure_count"]} geometry decode failures')
              if d['node_instance_count'] != n:
                  raise SystemExit(f'{h}: node instances {d["node_instance_count"]} != {n}')
              rows.append({'static_map':h,'d1':d['d1_static_map_data'],'placements':n,'geometry_variants':d['geometry_variant_count']})
          Path('reports/nine_cell_export_reports.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          python tools/d1_tower_merge_placements.py \
            --input export/TOWER_80C984D8.glb \
            --input export/TOWER_80C98A6B.glb \
            --input export/TOWER_80C993CD.glb \
            --input export/TOWER_80C993CF.glb \
            --input export/TOWER_80C997F5.glb \
            --input export/TOWER_80C99981.glb \
            --input export/TOWER_80CA0B70.glb \
            --input export/TOWER_80CA0B72.glb \
            --input export/TOWER_80CA0C60.glb \
            --expected-placements 40373 \
            --out export/TOWER_NINE_CELL_BAKED_STATIC_SHELL.glb \
            --json reports/TOWER_NINE_CELL_BAKED_STATIC_SHELL.json

      - name: Final shell verification
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import trimesh
          p=Path('export/TOWER_NINE_CELL_BAKED_STATIC_SHELL.glb')
          r=json.loads(Path('reports/TOWER_NINE_CELL_BAKED_STATIC_SHELL.json').read_text())
          s=trimesh.load(p,force='scene',process=False)
          if r['serialized_placement_nodes'] != 40373: raise SystemExit('report placement count mismatch')
          if len(s.graph.nodes_geometry) != 40373: raise SystemExit(f'reloaded shell geometry nodes {len(s.graph.nodes_geometry)} != 40373')
          summary={
            'status':'NINE_CURRENT_BINARY_VALIDATED_MAP_OWNED_TOWER_STATIC_CELLS_MERGED',
            'outer_transform':'identity for all cells from serialized MapDataEntry ResourcePointer proof run 33945026693',
            'cell_count':9,'static_mesh_records':8552,'serialized_placements':40373,
            'scene_geometry_variants':len(s.geometry),'scene_geometry_nodes':len(s.graph.nodes_geometry),
            'vertices_over_unique_variants':sum(len(g.vertices) for g in s.geometry.values()),
            'triangles_over_unique_variants':sum(len(g.faces) for g in s.geometry.values()),
            'bounds':s.bounds.tolist() if s.bounds is not None else None,
            'glb_bytes':p.stat().st_size,
            'excluded_known_cell':'80C98254 -> 80C98258 remains isolated because current 80801B75 payload is unavailable from failing Tiger/Oodle logical block 725; it is not treated as an alternate schema.',
            'visual_status':'geometry-only baked-static shell; materials/textures/decals/dynamic entities remain separate work',
          }
          Path('reports/nine_cell_shell_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-nine-cell-baked-static-shell
          path: |
            export/
            reports/
            validation/tower_map_schema_validation.json
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
