name: Temporary decode Gjallarhorn six texture plates

on:
  push:
    paths:
      - '.github/workflows/tmp-gjallarhorn-six-texture-plates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover runtime and package snapshots
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x43779C800 \
            --target ps4_gear_weapons_011c_0.pkg --target ps4_gear_weapons_011c_1.pkg \
            --target ps4_gear_weapons_011c_2.pkg --target ps4_gear_weapons_011c_3.pkg --target ps4_gear_weapons_011c_5.pkg \
            --out recovered --manifest reports/011c_extract.json --retries 6 --timeout 90
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x5A9421400 \
            --target ps4_investment_assets_013f_1.pkg --target ps4_investment_assets_013f_2.pkg \
            --target ps4_investment_assets_013f_3.pkg --target ps4_investment_assets_013f_4.pkg --target ps4_investment_assets_013f_5.pkg \
            --out recovered --manifest reports/013f_extract.json --retries 6 --timeout 90
      - name: Decode six exact plate headers with cross-package generation-safe fallback
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import hashlib,json,re,struct,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader
          from d1_investment_arrangement_probe import filehash_pkg_index

          HEADER_CLASS='80801C3C'; PLATE_CLASS='80800147'; TRANSFORM_SIZE=0x14
          owners={
            '80A743A6':'80A39C90',
            '80A73BAB':'80A398B5',
            '80A72202':'80A38D5D',
            '80A7317B':'80A39407',
            '80A73256':'80A3947C',
            '80A73D13':'80A7E1B4',
          }
          def patchnum(p):
            m=re.search(r'_(\d+)\.pkg$',p.name);return int(m.group(1)) if m else -1
          paths={
            0x011C:sorted(Path('recovered').glob('ps4_gear_weapons_011c_*.pkg'),key=patchnum,reverse=True),
            0x013F:sorted(Path('recovered').glob('ps4_investment_assets_013f_*.pkg'),key=patchnum,reverse=True),
          }
          cache={}
          for pkg,ps in paths.items():
            cache[pkg]=[]
            for p in ps:
              try:
                r=EntryReader(p,Path('runtime'));cache[pkg].append((r,{e['tag_hash'].upper():e for e in r.entries}))
              except Exception: pass
          def dyn(b,field):
            count=struct.unpack_from('<I',b,field)[0];rel=struct.unpack_from('<q',b,field+8)[0];data=field+8+rel+0x10
            return count,data,rel
          def pow2(v): return 0 if v<=0 else 1<<(v-1).bit_length()
          def resolve_struct(tag,expected_class):
            pkg,idx=filehash_pkg_index(int(tag,16)); attempts=[]
            if pkg not in cache: return None,[{'error':f'package {pkg:04X} not mounted'}]
            for r,by in cache[pkg]:
              e=by.get(tag)
              rec={'snapshot':r.pkg.name,'present':bool(e)}
              if not e: attempts.append(rec);continue
              rec.update({'entry_index':e['index'],'type':e['type'],'subtype':e['subtype'],'reference':e['reference'].upper(),'size':e['file_size']})
              if e['reference'].upper()!=expected_class:
                rec['reject']=f'expected class {expected_class}';attempts.append(rec);continue
              try:
                b=r.entry(e['index']);rec['accepted']=True;attempts.append(rec);return (r,by,e,b),attempts
              except Exception as ex:
                rec['error']=repr(ex);attempts.append(rec)
            return None,attempts
          def parse_plate_cross(tag):
            got,attempts=resolve_struct(tag,PLATE_CLASS)
            if got is None: raise RuntimeError(f'plate {tag} unresolved: {attempts}')
            r,by,e,b=got
            count,data,rel=dyn(b,0x10);trs=[];maxdim=0
            if data<0 or data+count*TRANSFORM_SIZE>len(b): raise ValueError(f'{tag} transform array OOB')
            for i in range(count):
              o=data+i*TRANSFORM_SIZE
              tex=f'{struct.unpack_from("<I",b,o)[0]:08X}'
              tx,ty,sx,sy=struct.unpack_from('<iiii',b,o+4)
              maxdim=max(maxdim,tx+sx,ty+sy)
              tpkg,tidx=filehash_pkg_index(int(tex,16))
              trs.append({'index':i,'offset':o,'texture':tex,'texture_filehash_package_id':tpkg,'texture_filehash_entry_index':tidx,'translation':[tx,ty],'scale':[sx,sy]})
            return {'tag_hash':tag,'package_id':filehash_pkg_index(int(tag,16))[0],'snapshot':r.pkg.name,'entry_index':e['index'],'class_hash':e['reference'].upper(),'sha256':hashlib.sha256(b).hexdigest(),'transform_count':count,'transforms':trs,'plate_dimension_source_max':maxdim,'plate_dimension_pow2':pow2(maxdim),'attempts':attempts}

          rows=[]
          for model,header_tag in owners.items():
            got,hattempts=resolve_struct(header_tag,HEADER_CLASS)
            if got is None: raise SystemExit(f'header {header_tag} unresolved: {hattempts}')
            hr,hby,he,hb=got
            if len(hb)<0x30: raise ValueError(f'short header {header_tag}: {len(hb)}')
            tags={'albedo':f'{struct.unpack_from("<I",hb,0x24)[0]:08X}','normal':f'{struct.unpack_from("<I",hb,0x28)[0]:08X}','gstack':f'{struct.unpack_from("<I",hb,0x2c)[0]:08X}'}
            plates={role:parse_plate_cross(pt) for role,pt in tags.items()}
            row={'model_tag':model,'header_tag':header_tag,'header_package_id':filehash_pkg_index(int(header_tag,16))[0],'header_snapshot':hr.pkg.name,'header_entry_index':he['index'],'header_sha256':hashlib.sha256(hb).hexdigest(),'header_attempts':hattempts,'plate_tags':tags,'plates':plates}
            rows.append(row)
            print('GJ_PLATE',json.dumps({k:v for k,v in row.items() if k not in ('plates','header_attempts')},separators=(',',':')))
            for role,p in plates.items():
              print(' GJ_PLATE_ROLE',model,role,p['tag_hash'],'pkg',f"{p['package_id']:04X}",'dim',p['plate_dimension_pow2'],'transforms',json.dumps(p['transforms'],separators=(',',':')))

          alltex=[]
          for row in rows:
            for p in row['plates'].values():
              for t in p['transforms']:
                if t['texture'] not in alltex: alltex.append(t['texture'])
          out={'arrangement':1229,'models':rows,'unique_source_texture_hashes':alltex,'unique_source_texture_count':len(alltex)}
          Path('reports/gjallarhorn_1229_texture_plates.json').write_text(json.dumps(out,indent=2)+'\n')
          print('UNIQUE_SOURCE_TEXTURES',len(alltex),alltex)
          assert len(rows)==6
          assert all(set(r['plates'])=={'albedo','normal','gstack'} for r in rows)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-gjallarhorn-1229-texture-plates
          path: reports/
          retention-days: 7
          if-no-files-found: error
