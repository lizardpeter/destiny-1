name: Fortnite 5.41 sky source audit
on:
  pull_request:
    branches: [main]
    paths:
      - tools/fortnite_541_skylight_cube_probe.py
      - .github/workflows/fortnite-541-sky-audit.yml
  workflow_dispatch:
jobs:
  sky:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify original s4 archive and skylight package identities
        run: python3 tools/fortnite_541_skylight_cube_probe.py
      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-athena-skylight-source-metadata
          path: fortnite541_skylight_s4_source_audit.json
          if-no-files-found: ignore
          retention-days: 3
