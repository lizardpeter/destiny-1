name: Build private FalkorDB on public Windows runner

# Private source never enters the public repository or any public build artifact.
# A repository-scoped token is required to check out the private source and
# deliver logs/binaries to the PRIVATE repository's Releases page.
on:
  workflow_dispatch:
  push:
    branches:
      - falkordb-secure-build-20261009
    paths:
      - '.github/workflows/falkordb-private-win-build.yml'

permissions:
  contents: read

concurrency:
  group: private-falkordb-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - name: Verify private-repository credential configured
        shell: pwsh
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.FALKORDB_CI_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_REPO_TOKEN)) {
            throw "Configure secret FALKORDB_CI_TOKEN on this public repository, scoped ONLY to lizardpeter/custom-falkor-db with Contents read/write. Private source cannot be fetched with the default GitHub token."
          }

      - name: Check out private FalkorDB source to ephemeral Windows workspace
        uses: actions/checkout@v4
        with:
          repository: lizardpeter/custom-falkor-db
          ref: main
          path: private-falkordb
          token: ${{ secrets.FALKORDB_CI_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install Windows Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Verify build prerequisites
        shell: pwsh
        run: |
          foreach ($tool in @("rustc", "cargo", "cmake", "git", "python", "gh")) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Missing tool: $tool" }
          }

      - name: Build and test (private output kept off public logs)
        id: build
        shell: pwsh
        env:
          PRIVATE_SOURCE: ${{ github.workspace }}\private-falkordb
          PRIVATE_LOGS: ${{ runner.temp }}\falkordb-private-build
        run: |
          New-Item -ItemType Directory -Path $env:PRIVATE_LOGS -Force | Out-Null
          $log = Join-Path $env:PRIVATE_LOGS "build.txt"
          $script = Join-Path $env:PRIVATE_SOURCE "scripts\build_local_release.ps1"
          $exitCode = 1
          try {
            Push-Location $env:PRIVATE_SOURCE
            try {
              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script *> $log
              $exitCode = $LASTEXITCODE
            } finally {
              Pop-Location
            }
          } catch {
            "Build process threw an exception (details confined to private logs)." | Out-File -FilePath $log -Append -Encoding utf8
          }
          "exit_code=$exitCode" >> $env:GITHUB_OUTPUT
          if ($exitCode -ne 0) { Write-Host "Private FalkorDB build failed. Diagnostic logs will be uploaded to the PRIVATE repository." }
          else { Write-Host "Private FalkorDB build succeeded. Binary will be uploaded to the PRIVATE repository." }

      - name: Upload build result and private logs to PRIVATE repository
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.FALKORDB_CI_TOKEN }}
          PRIVATE_SOURCE: ${{ github.workspace }}\private-falkordb
          PRIVATE_LOGS: ${{ runner.temp }}\falkordb-private-build
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "Private release upload requires FALKORDB_CI_TOKEN" }
          $repo = "lizardpeter/custom-falkor-db"
          $tag = "diagnostics-build-${{ github.run_id }}-${{ github.run_attempt }}"
          $log = Join-Path $env:PRIVATE_LOGS "build.txt"
          if (-not (Test-Path $log)) {
            New-Item -ItemType Directory -Path $env:PRIVATE_LOGS -Force | Out-Null
            "No private compiler log was produced. Build failed before compilation." | Set-Content $log
          }
          $zip = Join-Path $env:PRIVATE_SOURCE "build\package\falkordb-native-windows-x64.zip"
          $asset = @($log)
          if ((Test-Path $zip) -and ('${{ steps.build.outputs.exit_code }}' -eq '0')) {
            $asset += $zip
          }
          gh release create $tag @asset --repo $repo --title "FalkorDB Windows build ${{ github.run_id }}" --notes "Built on an ephemeral public Windows runner. Source, logs, and binary are kept in this private repository." --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Could not deliver private build results to the private repository" }
          Write-Host "Results available in the PRIVATE repository Releases page."

      - name: Fail workflow if compilation or packaging failed
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.build.outputs.exit_code }}' -ne '0') {
            throw "Native Windows compilation or packaging did not succeed; see the PRIVATE release build log."
          }
