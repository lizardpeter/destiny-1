name: D1 player rig index-map correlation

on:
  push:
    paths:
      - '.github/workflows/d1-player-rig-indexmap-correlation.yml'
      - 'tools/d1_remote_skeleton_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correlate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Runtime
        run: |
          set -euo pipefail
          mkdir -p runtime reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Read full candidate skeleton index maps
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_remote_skeleton_probe.py --package-id 0x00EC --base-url "$base" --runtime runtime \
            --member ps4_race_set_all_00ec_0.pkg:45824346624:82720768 --member ps4_race_set_all_00ec_1.pkg:45907067904:10065920 --member ps4_race_set_all_00ec_2.pkg:45917134336:2072576 --member ps4_race_set_all_00ec_3.pkg:45919207424:151552 --member ps4_race_set_all_00ec_4.pkg:45919359488:151552 --member ps4_race_set_all_00ec_5.pkg:45919511552:155648 \
            --tag-hash 809D80C9 --tag-hash 809D8613 -o reports/00ec_skeletons.json
          python tools/d1_remote_skeleton_probe.py --package-id 0x00EE --base-url "$base" --runtime runtime \
            --member ps4_race_set_all_00ee_0.pkg:45919667712:88512512 --member ps4_race_set_all_00ee_1.pkg:46008180736:9631744 --member ps4_race_set_all_00ee_2.pkg:46017812992:5148672 --member ps4_race_set_all_00ee_3.pkg:46022962176:151552 --member ps4_race_set_all_00ee_5.pkg:46023114240:161792 \
            --tag-hash 809DDC67 -o reports/00ee_skeletons.json
          python tools/d1_remote_skeleton_probe.py --package-id 0x00EF --base-url "$base" --runtime runtime \
            --member ps4_race_set_all_00ef_0.pkg:46023276544:232409088 --member ps4_race_set_all_00ef_1.pkg:46255686144:12650496 --member ps4_race_set_all_00ef_2.pkg:46268337152:6375424 --member ps4_race_set_all_00ef_3.pkg:46274713088:176128 --member ps4_race_set_all_00ef_5.pkg:46274889728:184320 \
            --tag-hash 809DE53A --tag-hash 809DF370 --tag-hash 809DEF65 -o reports/00ef_skeletons.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('reports').glob('*_skeletons.json')):
              d=json.loads(p.read_text())
              for s in d['skeletons']:
                  if 'node_count' not in s: continue
                  r=s['range_index_map']['items']; i=s['inner_index_map']['items']
                  rows.append({'package_id':d['package_id'],'tag_hash':s['tag_hash'],'node_count':s['node_count'],
                               'range_count':len(r),'range_minmax':[min(r),max(r)] if r else None,'range_items':r,
                               'inner_count':len(i),'inner_minmax':[min(i),max(i)] if i else None,'inner_items':i})
          Path('reports/indexmap_summary.json').write_text(json.dumps(rows,indent=2)+'\n')
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-player-rig-indexmap-correlation
          path: reports/
          retention-days: 14
