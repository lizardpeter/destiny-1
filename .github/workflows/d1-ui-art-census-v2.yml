name: D1 UI art census v2 tolerant

on:
  push:
    paths:
      - '.github/workflows/d1-ui-art-census-v2.yml'
      - 'tools/d1_texture_census_tolerant.py'
      - 'tools/d1_contact_sheet.py'
      - 'evidence/d1_ui_member_catalog.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies and runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow texture2ddecoder
          mkdir -p runtime recovered reports exports contact_sheets
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover exact UI members directly from checkpointed offsets
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar
          cat=json.load(open('evidence/d1_ui_member_catalog.json'))
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=90)
          report={}
          for fam,rows in cat['families'].items():
              out=[]
              for r in rows:
                  off=int(r['data_offset'],0);size=int(r['size']);dst=Path('recovered')/r['name']
                  sha=arc.copy_to(off,size,dst)
                  out.append({**r,'sha256':sha})
                  print('RECOVERED',r['name'],size,sha,flush=True)
              report[fam]=out
          Path('reports/ui_direct_recovery.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Tolerant generation-safe texture census per UI family
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import json,re,subprocess,sys
          from pathlib import Path
          cat=json.load(open('evidence/d1_ui_member_catalog.json'))
          family_names={'000A':'core_000a','0018':'menus_0018','0026':'orbit_0026','002D':'pve_002d','0034':'pvp_0034'}
          summary={}
          for fam,rows in cat['families'].items():
              def patch(r):
                  m=re.search(r'_(\d+)\.pkg$',r['name']);return int(m.group(1))
              snaps=sorted(rows,key=patch,reverse=True)
              out=Path('exports')/family_names[fam];out.mkdir(parents=True,exist_ok=True)
              cmd=[sys.executable,'tools/d1_texture_census_tolerant.py','--runtime','runtime','--out',str(out)]
              for r in snaps:cmd += ['--snapshot',str(Path('recovered')/r['name'])]
              print('CENSUS',family_names[fam],flush=True);subprocess.run(cmd,check=True)
              pngs=list(out.glob('*.png'))
              if pngs:
                  subprocess.run([sys.executable,'tools/d1_contact_sheet.py',str(out),'--out',f'contact_sheets/{family_names[fam]}.jpg','--columns','6','--max-images','1000'],check=True)
              rep=json.load(open(out/'texture_manifest.json'))
              formats={}
              for q in rep['textures']:
                  f=(q.get('texture') or {}).get('format_name','unknown');formats[f]=formats.get(f,0)+1
              summary[family_names[fam]]={'headers':rep['unique_texture_header_count'],'resolved':rep['resolved_count'],'failed':rep['failed_count'],'pngs':len(pngs),'formats':formats}
          Path('reports/ui_texture_summary_v2.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-ui-art-census-v2
          path: |
            reports/
            contact_sheets/
            exports/*/texture_manifest.json
            exports/*/*.png
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
