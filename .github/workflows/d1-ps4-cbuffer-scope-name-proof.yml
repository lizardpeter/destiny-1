name: D1 PS4 CBuffer scope name proof

on:
  workflow_dispatch:
  push:
    branches: [d1-crota-source-semantics-v1]
    paths:
      - 'tools/d1_ps4_cbuffer_scope_name_proof.py'
      - 'evidence/d1_vex_09a_native_state_closure_2026-09-18.json'
      - '.github/workflows/d1-ps4-cbuffer-scope-name-proof.yml'

permissions:
  contents: read

env:
  CHARM_COMMIT: '50d36ee1f9ecadad7522504c20b1f3f9c97e30af'
  CHARM_EXTERNS_BLOB_SHA1: '7311688c71ab3a9e9d6eacd5393d07254688bace'

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Pin D1 TfxScope source
        run: |
          set -euo pipefail
          mkdir -p source out
          curl -fsSL --retry 4 \
            "https://raw.githubusercontent.com/MontagueM/Charm/${CHARM_COMMIT}/Tiger/Schema/Shaders/TFX%20Bytecode/Externs.cs" \
            -o source/Externs.cs
          test "$(git hash-object source/Externs.cs)" = "${CHARM_EXTERNS_BLOB_SHA1}"
          grep -q '//Based on CBuffer index' source/Externs.cs
          grep -q 'View = 12' source/Externs.cs
          grep -q 'Frame = 13' source/Externs.cs
          if grep -Eq '^ *[A-Za-z0-9_]+ *= *15,' source/Externs.cs; then
            echo 'ERROR: TfxScope unexpectedly contains index 15' >&2
            exit 1
          fi

      - name: Cross-source prove API12 View and API13 Frame labels
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_ps4_cbuffer_scope_name_proof.py
          python tools/d1_ps4_cbuffer_scope_name_proof.py \
            --charm-externs source/Externs.cs \
            --vex-proof evidence/d1_vex_09a_native_state_closure_2026-09-18.json \
            -o out/D1_PS4_CBUFFER_SCOPE_NAME_PROOF.json
          python - <<'PY'
          import json
          d=json.load(open('out/D1_PS4_CBUFFER_SCOPE_NAME_PROOF.json'))
          assert d['status']=='D1_PS4_CBUFFER_SCOPE_NAMES_CROSS_SOURCE_EXACT' and not d['violations'],d
          assert d['promoted_scope_names']['api12']['source_name']=='View',d
          assert d['promoted_scope_names']['api13']['source_name']=='Frame',d
          assert d['api15']['present_in_source_tfx_scope_enum'] is False,d
          assert d['gates']['api12_runtime_writer_closed'] is False,d
          assert d['gates']['api13_live_values_closed'] is False,d
          assert d['gates']['api15_source_scope_name_closed'] is False,d
          print('D1_PS4_CBUFFER_SCOPE_NAMES_CROSS_SOURCE_EXACT')
          PY
          sha256sum out/D1_PS4_CBUFFER_SCOPE_NAME_PROOF.json > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-PS4-CBUFFER-SCOPE-NAME-PROOF
          path: out/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
