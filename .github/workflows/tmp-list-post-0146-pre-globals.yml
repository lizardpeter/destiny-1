name: Temporary list package headers after 0146 before globals

on:
  push:
    paths:
      - '.github/workflows/tmp-list-post-0146-pre-globals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Walk exact TAR headers
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar,parse_tar_number,tar_header_checksum_ok,tar_name
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=90)
          off=0x615862600  # exact next TAR header after ps4_investment_assets_0146_6
          stop=0x61A5CB200 # known ps4_investment_globals_012f_0 header
          rows=[]
          while off<=stop:
              h=arc.read_at(off,512)
              if h[257:262]!=b'ustar' or not tar_header_checksum_ok(h):
                  raise RuntimeError(f'invalid header at 0x{off:X} magic={h[257:263]!r}')
              name=tar_name(h); size=parse_tar_number(h[124:136])
              row={'name':name,'header_offset':off,'data_offset':off+512,'size':size}
              rows.append(row); print('MEMBER',json.dumps(row,separators=(',',':')),flush=True)
              if off==stop: break
              off+=512+((size+511)//512)*512
              if off>stop: raise RuntimeError(f'walk crossed known globals header: 0x{off:X}')
          targets=[r for r in rows if '_0131_' in r['name'] or '_0132_' in r['name']]
          print('TARGETS',len(targets))
          for r in targets: print('TARGET',json.dumps(r,separators=(',',':')),flush=True)
          json.dump({'members':rows,'targets':targets},open('reports/post_0146_pre_globals.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-post-0146-pre-globals-headers
          path: reports/
          retention-days: 5
          if-no-files-found: error
