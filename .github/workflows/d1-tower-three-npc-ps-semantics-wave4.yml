name: D1 Tower three-NPC PS semantics wave 4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/d1_three_npc_ps_simple_tail_semantic_proof.py'
      - '.github/workflows/d1-tower-three-npc-ps-semantics-wave4.yml'

permissions: {contents: read, actions: read}

env:
  FRONTIER_ARTIFACT_ID: '10069257974'
  FRONTIER_ARTIFACT_SHA256: 'fe26726d4853c2ad2e2bc46c4a4ae51346e71583420f6e36cc573bb344799f27'
  STATE_ARTIFACT_ID: '10069795151'
  STATE_ARTIFACT_SHA256: '5dd54066b4460a49b7bb9106b870f4a1523e2ecd7d83e0932a59fcebbda70830'
  WAVE3_ARTIFACT_ID: '10073025980'
  WAVE3_ARTIFACT_SHA256: '3cd993fc54fb4023cd6fb6dbbeec1547a3259ea2856a75024c0d99f9d7eae915'

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover pinned evidence and 167-of-218 predecessor
        run: |
          set -euo pipefail
          mkdir -p input/frontier input/state input/wave3 reports
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FRONTIER_ARTIFACT_ID}/zip" -o input/frontier.zip
          echo "${FRONTIER_ARTIFACT_SHA256}  input/frontier.zip" | sha256sum --check --strict
          unzip -q input/frontier.zip -d input/frontier
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STATE_ARTIFACT_ID}/zip" -o input/state.zip
          echo "${STATE_ARTIFACT_SHA256}  input/state.zip" | sha256sum --check --strict
          unzip -q input/state.zip -d input/state
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${WAVE3_ARTIFACT_ID}/zip" -o input/wave3.zip
          echo "${WAVE3_ARTIFACT_SHA256}  input/wave3.zip" | sha256sum --check --strict
          unzip -q input/wave3.zip -d input/wave3
          test -f input/frontier/all_visible_ps_extract.json
          test -f input/frontier/THREE_NPC_PS_IMAGE_USAGE.json
          test -f input/frontier/disasm/PS_80AAE185.s
          test -f input/frontier/disasm/PS_808768AF.s
          test -f input/state/THREE_NPC_MATERIAL_STAGE_STATE.json
          test -f input/wave3/CUMULATIVE_PS_SEMANTICS_167_OF_218.json

      - name: Verify predecessor boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('input/wave3/CUMULATIVE_PS_SEMANTICS_167_OF_218.json'))
          assert d['status']=='D1_TOWER_THREE_NPC_BLOCKED_PS_SEMANTICS_167_OF_218_EXACT',d
          assert (d['original_blocked_visible_primitive_count'],d['semantic_closed_visible_primitive_count'],d['semantic_remaining_visible_primitive_count'])==(218,167,51),d
          print('PREDECESSOR_167_OF_218_EXACT')
          PY

      - name: Prove constant and direct-RGB families
        run: |
          set -euo pipefail
          python tools/d1_three_npc_ps_simple_tail_semantic_proof.py \
            --extract-report input/frontier/all_visible_ps_extract.json \
            --image-usage input/frontier/THREE_NPC_PS_IMAGE_USAGE.json \
            --material-state input/state/THREE_NPC_MATERIAL_STAGE_STATE.json \
            --disasm-dir input/frontier/disasm \
            --out reports/SIMPLE_TAIL_SEMANTICS.json
          python - <<'PY'
          import json
          d=json.load(open('reports/SIMPLE_TAIL_SEMANTICS.json'))
          assert d['status']=='D1_TOWER_THREE_NPC_SIMPLE_TAIL_SEMANTICS_EXACT' and not d['violations'],d
          assert d['visible_primitive_count']==16,d
          assert d['families']['80AAE185']['portable_color_kind']=='CONSTANT_RGB_EXACT',d
          assert d['families']['808768AF']['portable_color_kind']=='DIRECT_TEXTURE_RGB_EXACT',d
          print('SIMPLE_TAIL_16_EXACT')
          PY

      - name: Build cumulative 183-of-218 checkpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          prev=json.load(open('input/wave3/CUMULATIVE_PS_SEMANTICS_167_OF_218.json'))
          cur=json.load(open('reports/SIMPLE_TAIL_SEMANTICS.json'))
          original=prev['original_blocked_visible_primitive_count']
          closed=prev['semantic_closed_visible_primitive_count']+cur['visible_primitive_count']
          remaining=original-closed
          assert (original,closed,remaining)==(218,183,35),(original,closed,remaining)
          out={
            'schema_version':1,
            'status':'D1_TOWER_THREE_NPC_BLOCKED_PS_SEMANTICS_183_OF_218_EXACT',
            'original_blocked_visible_primitive_count':original,
            'semantic_closed_visible_primitive_count':closed,
            'semantic_remaining_visible_primitive_count':remaining,
            'semantic_closed_fraction':closed/original,
            'new_wave_programs':['80AAE185','808768AF'],
            'new_wave_visible_primitive_count':16,
            'portable_color_source_closed_for_new_wave':True,
            'portable_blender_recreation_complete':False,
            'policy':'183 of 218 formerly heuristic-forbidden visible primitives have CI-promoted native/current-state color semantics. The remaining 35 stay fail-closed.',
          }
          Path('reports/CUMULATIVE_PS_SEMANTICS_183_OF_218.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          find reports -type f -print0 | sort -z | xargs -0 sha256sum > reports/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-TOWER-3-NPC-PS-SEMANTICS-WAVE4
          path: reports/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
