name: D1 Crota unaccounted articulated census v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-unaccounted-articulated-census-v2.yml'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover corpus/runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Recensus all articulated raid-package entities
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          C=input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json
          B='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_crota_raid_candidate_probe.py \
            --raid-package-id 0x0447 --raid-package-id 0x044B --raid-package-id 0x0458 \
            --hive-arch-package-id 0x0075 --hive-arch-package-id 0x0077 --hive-arch-package-id 0x075D \
            --member-catalog "$C" --base-url "$B" --part-count 10 --runtime runtime \
            -o out/CROTA_RAID_ARTICULATED_CANDIDATES_V2.json | tee out/census.txt

      - name: Resolve exact retail names for articulated candidates
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_entity_names_resolve.py \
            --candidate-report out/CROTA_RAID_ARTICULATED_CANDIDATES_V2.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --global-package-id 0x0151 --global-package-id 0x0154 --global-package-id 0x0155 \
            --global-package-id 0x0156 --global-package-id 0x0157 --global-package-id 0x0158 \
            --global-package-id 0x0169 --global-package-id 0x018D --global-package-id 0x01E3 \
            --global-package-id 0x072B --global-package-id 0x072F --global-package-id 0x0735 \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_RAID_ARTICULATED_NAMES_V2.json | tee out/names.txt

      - name: Subtract source-owned known raid actors and rejected branches
        run: |
          set -euo pipefail
          python - <<'PY' | tee out/summary.txt
          import json
          c=json.load(open('out/CROTA_RAID_ARTICULATED_CANDIDATES_V2.json'))
          n=json.load(open('out/CROTA_RAID_ARTICULATED_NAMES_V2.json'))
          assert c['error_count']==0,c['errors'][:20]
          known={
            '8108E107','8108E484','8108E49B','8108E49C','8108E49D','8108E4B1',
            '8108EB93','8108EB94','8108EB95','81096305','81096306','81096307',
            '81096308','81096309','81096624','81096625','81096A1E','81097986'
          }
          rejected={'8108EFFC':'mission_souvenir exact-owned'}
          nameby={x['entity_hash']:x for x in n['entities']}
          print('RAID_S_ENTITIES',c['s_entity_count'],'ARTICULATED',c['articulated_candidate_count'])
          un=[]
          for a in c['articulated_candidates']:
            h=a['entity_hash']; names=[]
            for x in nameby.get(h,{}).get('names',[]):
              names.extend(r.get('string') for r in x.get('resolved',[]) if r.get('string') is not None)
            state='KNOWN_SCRIPTED' if h in known else ('REJECTED_'+rejected[h] if h in rejected else 'UNACCOUNTED')
            row={'entity':h,'package':a['package_id'],'state':state,'models':a['embedded_models'],'skeletons':[(s['resource_hash'],s['node_count']) for s in a['skeletons']], 'names':names,'hive_arch_cross_refs':a['hive_arch_cross_refs'],'roles':a['exact_roles']}
            print('ARTICULATED',row)
            if state=='UNACCOUNTED':un.append(row)
          print('UNACCOUNTED_COUNT',len(un))
          for x in un:print('UNACCOUNTED',x)
          open('out/CROTA_RAID_UNACCOUNTED_ARTICULATED_V2.json','w').write(json.dumps({'schema':'d1_crota_unaccounted_articulated/v2','unaccounted':un,'policy':'Unaccounted means only not in the 18 source-owned scripted roots and not the exact mission_souvenir rejection. It is not Crota identity proof.'},indent=2)+'\n')
          PY
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-UNACCOUNTED-ARTICULATED-CENSUS-V2
          path: out/
          retention-days: 30
          if-no-files-found: error
