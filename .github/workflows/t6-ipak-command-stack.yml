name: T6 IPAK command heap vs stack benchmark
on:
  push:
    branches: [bench/t6-ipak-command-stack-20261009]
    paths:
      - 'bench/t6_ipak_commands/**'
      - '.github/workflows/t6-ipak-command-stack.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate 0 through 31 raw and skip IPAK commands
        shell: bash
        run: cargo test --release --manifest-path bench/t6_ipak_commands/Cargo.toml
      - name: Alternate original heap and fixed array block handling
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS="-C target-cpu=native" CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 cargo run --release --manifest-path bench/t6_ipak_commands/Cargo.toml
