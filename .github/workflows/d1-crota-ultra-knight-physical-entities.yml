name: D1 Crota Dark Lens ultra-Knight physical entities

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-ultra-knight-physical-entities.yml'
      - 'tools/d1_remote_exact_s_entity_probe.py'
      - 'tools/d1_remote_catalog_entity_resource_probe.py'
      - 'tools/d1_remote_catalog_backlinks.py'
      - 'tools/d1_remote_model_owner_trace.py'
      - 'tools/d1_entity_resource_probe.py'
      - 'tools/d1_skeleton_probe.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out/model_traces
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Decode exact physical-entity candidates from authored ultra spawn
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_remote_exact_s_entity_probe.py
          python tools/d1_remote_exact_s_entity_probe.py \
            --tag-hash 0x8108E5C3 --tag-hash 0x8108E671 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_ULTRA_PHYSICAL_S_ENTITIES.json \
            | tee out/s_entities_stdout.txt

      - name: Decode every serialized child EntityResource plus immunity owner
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          ARGS=$(python - <<'PY'
          import json
          d=json.load(open('out/CROTA_ULTRA_PHYSICAL_S_ENTITIES.json'))
          tags={'8108E4C6'}
          for e in d['entries']:
              for r in e.get('resources',[]):
                  m=r.get('entry') or {}
                  if m.get('reference')=='80800861':
                      tags.add(r['resource_hash'].upper())
          print(' '.join('--tag-hash 0x'+x for x in sorted(tags)))
          PY
          )
          echo "ENTITY_RESOURCE_ARGS=$ARGS" | tee out/child_resource_args.txt
          python tools/d1_remote_catalog_entity_resource_probe.py $ARGS \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_ULTRA_PHYSICAL_CHILD_RESOURCES.json \
            | tee out/child_resources_stdout.txt

      - name: Trace exact backlinks to physical candidates
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_catalog_backlinks.py \
            --scan-package-id 0x0447 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --target 0x8108E5C3 --target 0x8108E671 --target 0x8108E4C6 \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --max-entry-size 8000000 \
            -o out/CROTA_ULTRA_PHYSICAL_BACKLINKS.json \
            | tee out/backlinks_stdout.txt

      - name: Trace any exact embedded models back to owners
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY' > out/model_tags.txt
          import json
          d=json.load(open('out/CROTA_ULTRA_PHYSICAL_S_ENTITIES.json'))
          models=sorted({m for e in d['entries'] for m in e.get('embedded_models',[])})
          print('\n'.join(models))
          PY
          if [[ -s out/model_tags.txt ]]; then
            while read -r MODEL; do
              echo "TRACE_MODEL $MODEL"
              python tools/d1_remote_model_owner_trace.py \
                --model "0x${MODEL}" \
                --scan-package-id 0x0447 --scan-package-id 0x044B --scan-package-id 0x0458 \
                --scan-package-id 0x0075 --scan-package-id 0x0077 --scan-package-id 0x075D \
                --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
                --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
                --runtime runtime -o "out/model_traces/${MODEL}.json"
            done < out/model_tags.txt
          else
            echo 'NO_SOURCE_CLOSED_EMBEDDED_MODELS_AT_FIRST_RESOURCE_LEVEL'
          fi | tee out/model_trace_stdout.txt

      - name: Validate proof boundary and summarize
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_ULTRA_PHYSICAL_S_ENTITIES.json'))
          assert d['violation_count']==0,d['violations']
          assert [x['tag_hash'] for x in d['entries']]==['8108E5C3','8108E671']
          for e in d['entries']:
              assert e['entry']['reference']=='80800734',e
              print('PHYSICAL_CANDIDATE',e['tag_hash'],'RESOURCES',e['resource_count'],
                    'MODELS',e.get('embedded_models',[]),
                    'SKELETONS',[(s['resource_hash'],s['node_count']) for s in e.get('skeletons',[])])
              for r in e.get('resources',[]):
                  m=r.get('entry') or {}; er=r.get('entity_resource') or {}; sk=r.get('skeleton') or {}
                  print(' CHILD',r.get('resource_index'),r.get('resource_hash'),'REF',m.get('reference'),
                        'ROLE',er.get('semantic_role'),'CLASSES',(er.get('unk10_class'),er.get('unk18_class')),
                        'MODEL',er.get('embedded_model_tag_hash'),'SKEL_NODES',sk.get('node_count'))
          c=json.load(open('out/CROTA_ULTRA_PHYSICAL_CHILD_RESOURCES.json'))
          assert not c['violations'],c['violations']
          print('CHILD_RESOURCE_COUNT',len(c['entries']))
          for x in c['entries']:
              er=x['entity_resource']
              print(' RESOURCE_DETAIL',x['tag_hash'],'ROLE',er.get('semantic_role'),
                    'U10',(er.get('unk10') or {}).get('class_hash'),
                    'U18',(er.get('unk18') or {}).get('class_hash'),
                    'ALIGNED',[(hex(m['offset']),m['tag_hash'],m['reference']) for m in x['aligned_resolved_tag_matches']])
          b=json.load(open('out/CROTA_ULTRA_PHYSICAL_BACKLINKS.json'))
          assert b['error_count']==0,b['errors']
          print('BACKLINK_SOURCES',b['hit_source_count'],'OCCURRENCES',b['occurrences_by_target'],
                'BY_REFERENCE',b['hit_sources_by_reference'])
          PY
          sha256sum out/*.json out/*.txt > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-ULTRA-KNIGHT-PHYSICAL-ENTITIES
          path: out/
          retention-days: 30
          if-no-files-found: error
