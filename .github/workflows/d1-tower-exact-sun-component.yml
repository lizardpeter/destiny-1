name: D1 Tower Exact Sun Component Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-exact-sun-component.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_URL: https://crypt.cohae.dev/destiny/ps4/packages/latest
      RESOURCE_HASH: 80AAE484

    steps:
      - uses: actions/checkout@v4

      - name: Recover current package list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source reports runtime payloads
          idx_run="$(gh run list --workflow d1-global-activity-index.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$idx_run"
          gh run download "$idx_run" -n d1-global-activity-index -D source
          plist="$(find source -name packages.txt -print -quit)"
          test -n "$plist" -a -f "$plist"
          cp "$plist" reports/packages.txt

      - name: Install exact Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll'             -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so'             -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Probe exact Tower SMapData sun resources
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          for TABLE in 80CA0B18 80C984AA; do
            python tools/d1_remote_filehash_probe.py \
              --tag-hash "$TABLE" \
              --package-list reports/packages.txt \
              --runtime runtime \
              --base-url "$BASE_URL" \
              --payload-out-dir payloads \
              --out "reports/map_$TABLE.json"
          done

          python - <<'PY'
          import json,struct,pathlib,hashlib
          rows=[]
          suns=[]
          for h in ('80CA0B18','80C984AA'):
              b=(pathlib.Path('payloads')/(h+'.bin')).read_bytes()
              obj=0x1f8
              cls=struct.unpack_from('<I',b,obj-4)[0]
              sun=struct.unpack_from('<I',b,obj+0x0c)[0]
              row={
                'map_data_table':h,
                'payload_sha256':hashlib.sha256(b).hexdigest(),
                'resource_absolute':'0x1F8',
                'resource_class':f'{cls:08X}',
                'sun_filehash_offset':'0x204',
                'sun_tag':f'{sun:08X}',
                'resource_bytes':b[obj:obj+0x40].hex(),
              }
              if cls != 0x80801B13:
                  raise SystemExit(f'{h}: resource class {cls:08X} != 80801B13')
              if sun not in (0,0xffffffff):
                  suns.append(f'{sun:08X}')
              rows.append(row)
          if not suns:
              raise SystemExit('no non-null sun FileHash in exact Tower SMapData resources')
          out={
            'status':'EXACT_TOWER_SMAPDATA_SUN_RESOURCES_FOLLOWED',
            'rows':rows,
            'unique_non_null_sun_tags':sorted(set(suns)),
            'proof':'resource absolute/class comes from exact current Tower map-data census; +0x0C is the eboot/Rust importer sun FileHash field'
          }
          pathlib.Path('reports/sun_resource_follow.json').write_text(json.dumps(out,indent=2)+'\n')
          pathlib.Path('reports/sun_tags.txt').write_text('\n'.join(sorted(set(suns)))+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Probe exact Tower sun tag time fields
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          : > reports/tower_sun_time_fields.jsonl
          while read -r SUN_TAG; do
            test -n "$SUN_TAG"
            python tools/d1_remote_filehash_probe.py \
              --tag-hash "$SUN_TAG" \
              --package-list reports/packages.txt \
              --runtime runtime \
              --base-url "$BASE_URL" \
              --payload-out-dir payloads \
              --out "reports/sun_tag_$SUN_TAG.json"
            SUN_TAG="$SUN_TAG" python - <<'PY'
          import json,struct,pathlib,hashlib,os
          h=os.environ['SUN_TAG']
          p=pathlib.Path('payloads')/(h+'.bin')
          if not p.exists():
              raise SystemExit(f'sun payload not recovered: {h}')
          b=p.read_bytes()
          if len(b)<0x20:
              raise SystemExit(f'sun tag {h} too small: {len(b)}')
          u32=lambda o: struct.unpack_from('<I',b,o)[0]
          f32=lambda o: struct.unpack_from('<f',b,o)[0]
          out={
            'schema':'d1_tower_exact_sun_component/v2',
            'status':'EXACT_CURRENT_TOWER_SUN_TIME_FIELDS_CAPTURED',
            'sun_tag':h,
            'payload_sha256':hashlib.sha256(b).hexdigest(),
            'payload_size':len(b),
            'raw_prefix_0x00_0x40':b[:0x40].hex(),
            'fields':{
              '0x00_f32':f32(0x00),
              '0x04_f32':f32(0x04),
              '0x08_u32':f'{u32(0x08):08X}',
              '0x0c_u32':f'{u32(0x0c):08X}',
              '0x10_f32':f32(0x10),
              '0x14_f32':f32(0x14),
              '0x18_u32':f'{u32(0x18):08X}',
              '0x1c_u32':f'{u32(0x1c):08X}',
            },
            'eboot_contract':{
              'loader':'0x8B2BF9',
              'known_rule':'if component+0x10 > 0 use live timer/cycle path; both paths add component+0x14 then normalize/fraction before storing time-of-day',
            }
          }
          with open('reports/tower_sun_time_fields.jsonl','a') as fp:
              fp.write(json.dumps(out)+'\n')
          print(json.dumps(out,indent=2))
          PY
          done < reports/sun_tags.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-exact-sun-component
          path: reports/
          retention-days: 30
