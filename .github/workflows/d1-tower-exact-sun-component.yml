name: D1 Tower Exact Sun Component Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-exact-sun-component.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_URL: https://crypt.cohae.dev/destiny/ps4/packages/latest
      RESOURCE_HASH: 80AAE484

    steps:
      - uses: actions/checkout@v4

      - name: Recover current package list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source reports runtime payloads
          idx_run="$(gh run list --workflow d1-global-activity-index.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$idx_run"
          gh run download "$idx_run" -n d1-global-activity-index -D source
          plist="$(find source -name packages.txt -print -quit)"
          test -n "$plist" -a -f "$plist"
          cp "$plist" reports/packages.txt

      - name: Install exact Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll'             -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so'             -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Probe exact Tower sun EntityResource
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python tools/d1_remote_filehash_probe.py             --tag-hash "$RESOURCE_HASH"             --package-list reports/packages.txt             --runtime runtime             --base-url "$BASE_URL"             --payload-out-dir payloads             --out reports/sun_entity_resource.json

          python - <<'PY'
          import json,struct,pathlib
          h='80AAE484'
          p=pathlib.Path('payloads')/(h+'.bin')
          b=p.read_bytes()
          if len(b)<0x78:
              raise SystemExit(f'{h} payload too small: {len(b)}')
          # Preserved exact census proves EntityResource +0x08 pointer target is
          # object offset 0x68, class 80801B13; retail layout places Sun FileHash
          # at object +0x0C => payload offset 0x74.
          sun=struct.unpack_from('<I',b,0x74)[0]
          out={
            'status':'EXACT_TOWER_SUN_RESOURCE_FOLLOWED',
            'entity_resource':h,
            'payload_sha256':__import__('hashlib').sha256(b).hexdigest(),
            'sun_object_offset':'0x68',
            'sun_object_class':'80801B13',
            'sun_filehash_field_offset':'0x74',
            'sun_tag':f'{sun:08X}',
            'sun_object_prefix_0x68_0x90':b[0x68:0x90].hex(),
          }
          pathlib.Path('reports/sun_resource_follow.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          print(f'SUN_TAG={sun:08X}')
          pathlib.Path('reports/sun_tag.txt').write_text(f'{sun:08X}\n')
          PY

      - name: Probe exact Tower sun tag and time fields
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          SUN_TAG="$(cat reports/sun_tag.txt)"
          python tools/d1_remote_filehash_probe.py             --tag-hash "$SUN_TAG"             --package-list reports/packages.txt             --runtime runtime             --base-url "$BASE_URL"             --payload-out-dir payloads             --out reports/sun_tag_probe.json

          python - <<'PY'
          import json,struct,pathlib,hashlib,math
          h=pathlib.Path('reports/sun_tag.txt').read_text().strip()
          b=(pathlib.Path('payloads')/(h+'.bin')).read_bytes()
          if len(b)<0x20:
              raise SystemExit(f'sun tag {h} too small: {len(b)}')
          u32=lambda o: struct.unpack_from('<I',b,o)[0]
          f32=lambda o: struct.unpack_from('<f',b,o)[0]
          out={
            'schema':'d1_tower_exact_sun_component/v1',
            'status':'EXACT_CURRENT_TOWER_SUN_TIME_FIELDS_CAPTURED',
            'sun_tag':h,
            'payload_sha256':hashlib.sha256(b).hexdigest(),
            'payload_size':len(b),
            'raw_prefix_0x00_0x40':b[:0x40].hex(),
            'fields':{
              '0x00_f32':f32(0x00),
              '0x04_f32':f32(0x04),
              '0x08_u32':f'{u32(0x08):08X}',
              '0x0c_u32':f'{u32(0x0c):08X}',
              '0x10_f32':f32(0x10),
              '0x14_f32':f32(0x14),
              '0x18_u32':f'{u32(0x18):08X}',
              '0x1c_u32':f'{u32(0x1c):08X}',
            },
            'eboot_contract':{
              'loader':'0x8B2BF9',
              'known_rule':'fixed/paused activities use frac(component+0x14); live-cycle activities use frac(runtime_clock + component+0x14) with component+0x10 cycle seconds',
              'semantic_boundary':'This probe records exact serialized fields; fixed-vs-live flag identity is taken only from exact eboot decompilation, not guessed from field values.'
            }
          }
          pathlib.Path('reports/tower_sun_time_fields.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-exact-sun-component
          path: reports/
          retention-days: 30
