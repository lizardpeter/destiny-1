name: D1 lowercase crota source classification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-lowercase-source-classification.yml'

permissions:
  contents: read
  actions: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    env:
      UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
      UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
      UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Inputs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum -c --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum -c --strict
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum -c --strict
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum -c --strict
      - name: Exact tag payloads
        run: |
          set -euo pipefail; export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_exact_tag_probe.py \
            --tag-hash 0x80AA9C0D --tag-hash 0x80AADD3E --tag-hash 0x80AB026E --tag-hash 0x80B1A004 --tag-hash 0x8166A3E8 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            -o out/TAGS.json | tee out/tags.txt
      - name: Exact EntityResource classification
        run: |
          set -euo pipefail; export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_catalog_entity_resource_probe.py \
            --tag-hash 0x80AA9C0D --tag-hash 0x80AADD3E --tag-hash 0x80AB026E --tag-hash 0x8166A3E8 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            -o out/ENTITY_RESOURCES.json | tee out/entity_resources.txt
      - name: Summary
        run: |
          set -euo pipefail
          python - <<'PY' | tee out/summary.txt
          import json
          t=json.load(open('out/TAGS.json')); e=json.load(open('out/ENTITY_RESOURCES.json'))
          assert t['violation_count']==0,t['violations']; assert not e['violations'],e['violations']
          for x in e['entries']:
              r=x['entity_resource']
              print('ER',x['tag_hash'],'SIZE',x['entry']['file_size'],'ROLE',r.get('semantic_role'),
                    'UNK10',(r.get('unk10') or {}).get('class_hash'),'UNK18',(r.get('unk18') or {}).get('class_hash'))
              print(' MATCHES',[(m['offset_hex'],m['tag_hash'],m['reference'],m['size']) for m in x['aligned_resolved_tag_matches']])
          raw=next(x for x in t['entries'] if x['tag_hash']=='80B1A004')
          print('RAW_80B1A004','REF',raw['entry']['reference'],'SIZE',raw['payload_size'],'STRINGS',[(s['offset'],s['string']) for s in raw['printable_strings']])
          print(' RAW_MATCHES',[(m['offset'],m['tag_hash'],m['entry']['reference']) for m in raw['aligned_resolved_tags']])
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-CROTA-LOWERCASE-SOURCE-CLASSIFICATION
          path: out/
          retention-days: 30
          if-no-files-found: error
