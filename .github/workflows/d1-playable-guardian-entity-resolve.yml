name: D1 playable Guardian final entity resolution

on:
  push:
    paths:
      - '.github/workflows/d1-playable-guardian-entity-resolve.yml'
      - 'tools/d1_playable_guardian_parent_resolve.py'
      - 'evidence/d1_investment_asset_member_catalog.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover latest playable Guardian arrangement join
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input runtime out
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=d1-playable-guardian-arrangement-join&per_page=20" \
            | python -c "import json,sys; a=[x for x in json.load(sys.stdin)['artifacts'] if not x['expired']]; print(a[0]['archive_download_url'])")
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$url" -o input/guardian.zip
          unzip -q input/guardian.zip -d input/guardian
          test -f input/guardian/playable_guardian_arrangements.json
      - name: Recover verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Resolve every serialized Guardian EntityParent edge
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_playable_guardian_parent_resolve.py
          python tools/d1_playable_guardian_parent_resolve.py \
            input/guardian/playable_guardian_arrangements.json \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/playable_guardian_entity_resolution.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/playable_guardian_entity_resolution.json')
          d=json.load(open(p))
          assert d['arrangement_count'] >= 2000
          assert d['unique_parent_count'] > 100
          assert d['resolved_parent_count'] > 0
          summary={k:v for k,v in d.items() if k not in ('parents','arrangements','items','errors')}
          Path('out/playable_guardian_entity_resolution_summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-playable-guardian-entity-resolution
          path: out/
          retention-days: 14
          if-no-files-found: warn
