name: D1 Tower highlighted static vertex input probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-highlighted-static-input-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install dependencies and exact 024c corpus
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy trimesh
          mkdir -p runtime recovered validation world reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar
          rows=[
            ('ps4_city_tower_destination_024c_0.pkg',7542949376,137527296,'ffb2e3cbb9777956384063e3c0fc5636200df51ae82a35a6aad06850dbf1fff2'),
            ('ps4_city_tower_destination_024c_1.pkg',7680477184,12226560,'21e75033fcba2f85b5d22b7377a7122c5135ce2c3f10f8453fc54a1d304c10f8'),
            ('ps4_city_tower_destination_024c_2.pkg',7692704256,13574144,'681349e0d32c213cae4bdef839bee8a6fa5aa3a5989c4a5344ee342cbe9d6e45'),
            ('ps4_city_tower_destination_024c_3.pkg',7706278912,2134016,'c6846bbe0bdf9aaf9ba194ed8a2a3b2c7e26178bd79218134e909fa460ebcaef'),
            ('ps4_city_tower_destination_024c_4.pkg',7708413440,6987776,'12dfe5e7dc65a8477d5ceabba5bb921b07c83110151a57b86a52ba3eb7d82018'),
            ('ps4_city_tower_destination_024c_5.pkg',7715401728,1687552,'b404bacccf44a4bf6859bf3b867ae02f5dc840432bdaa081c341439c2ae83311'),
          ]
          arc=SplitHttpTar([f'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=120)
          for name,off,size,sha in rows:
              got=arc.copy_to(off,size,Path('recovered')/name)
              if got.lower()!=sha: raise SystemExit(f'{name}: sha mismatch {got} != {sha}')
          PY
      - name: Rebuild highlighted cell and inspect exact source streams
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_tower_map_schema_validate_v5.py "${args[@]}" --runtime runtime --out validation >/dev/null
          python tools/d1_world_static_visual_export.py "${args[@]}" --runtime runtime \
            --validation-json validation/tower_map_schema_validation.json --static-map-data 80C984D8 --basis gltf-y-up \
            --out world/highlighted_cell.glb --json world/highlighted_cell.json >/dev/null
          python - <<'PY'
          import json,struct,sys
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0,'tools')
          import d1_tower_map_schema_validate_v5 as v5
          d=json.load(open('world/highlighted_cell.json'))
          mats={'80C988A8','80C988A9'}
          geos=[g for g in d['geometry'] if g['source_key']['material_hash'].upper() in mats]
          nodes=[n for n in d['nodes'] if n['material_hash'].upper() in mats or int(n['transform_index'])==368]
          c=v5.v3.base.Corpus([Path(x) for x in sorted(str(p) for p in Path('recovered').glob('*.pkg'))],Path('runtime').resolve())
          streams={}
          for g in geos:
              for field in ('vertices0','vertices1'):
                  h=g['source_key'].get(field)
                  if not h or h.upper()=='FFFFFFFF' or h in streams: continue
                  m=c.entry_meta(h); hb,hs=c.payload(h)
                  row={'hash':h,'meta':m,'header_source':hs}
                  if hb is not None and len(hb)>=12:
                      data_size,stride,typ,dead=struct.unpack_from('<Ihhi',hb,0)
                      ref=(m or {}).get('reference','FFFFFFFF'); db,ds=c.payload(ref)
                      row.update({'data_size':data_size,'stride':stride,'type':typ,'deadbeef':f'{dead&0xffffffff:08X}','backing':ref,'backing_source':ds,'backing_bytes':None if db is None else len(db)})
                      if db is not None and stride>0 and len(db)%stride==0:
                          row['vertex_count']=len(db)//stride
                          row['first_vertices_hex']=[db[i*stride:(i+1)*stride].hex() for i in range(min(32,len(db)//stride))]
                          if stride==0x18:
                              # Preserve both known D1 stride-24 candidate colour locations.
                              a=[tuple(db[i*stride+4:i*stride+8]) for i in range(len(db)//stride)]
                              b=[tuple(db[i*stride+20:i*stride+24]) for i in range(len(db)//stride)]
                              row['rgba8_at_04_histogram']=[[list(k),v] for k,v in Counter(a).most_common(32)]
                              row['rgba8_at_14_histogram']=[[list(k),v] for k,v in Counter(b).most_common(32)]
                  streams[h]=row
          out={'status':'HIGHLIGHTED_TOWER_STATIC_INPUT_PROBE','materials':sorted(mats),'geometry_matches':geos,'node_matches':nodes,'streams':streams,
               'vertex_shader_fact':{'shader':'80CA0CB7','main_vs_param3_export':'param3=(v16,v17,v10,v11)','pixel_attr3_w_source':'incoming_v11','fetch_shader_required_for_exact_source_semantic':True},
               'policy':'Raw source-stream bytes and both stride-24 candidate colour locations are preserved. No semantic is assigned to v11 until fetch/input-layout evidence identifies it.'}
          Path('reports/highlighted_static_input_probe.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({'geometry_matches':[{'source_key':g['source_key'],'stride0':g['stride0'],'stride1':g['stride1'],'layout':g['layout'],'has_colors':g['has_colors']} for g in geos],
                            'nodes':[{'node':n['node'],'material':n['material_hash'],'transform':n['transform_index'],'detail':n['detail_level']} for n in nodes],
                            'streams':{k:{x:v.get(x) for x in ('stride','type','backing','backing_bytes','vertex_count','rgba8_at_04_histogram','rgba8_at_14_histogram')} for k,v in streams.items()}},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-highlighted-static-input-probe
          path: reports/highlighted_static_input_probe.json
          retention-days: 14
