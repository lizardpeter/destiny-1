name: D1 API10 membership provenance v1
on:
  workflow_dispatch:
  push:
    branches: [d1-crota-source-semantics-v1]
    paths:
      - 'tools/d1_verify_api10_membership_provenance_v1.py'
      - 'tools/d1_gcn_localshader_api10_access_family_census_v1.py'
      - 'evidence/d1_localshader_api10_membership_provenance_v1.json'
      - '.github/workflows/d1-api10-membership-provenance-v1.yml'
permissions:
  actions: read
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover pinned exact producer inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10172731401/zip > usage.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10529319011/zip > materials.zip
          unzip -q usage.zip -d usage
          unzip -q materials.zip -d materials
      - name: Rebuild and verify exact membership bytes
        run: |
          mkdir -p reports
          python3 tools/d1_gcn_localshader_api10_access_family_census_v1.py \
            --usage usage/D1_GCN_LOCALSHADER_TBUFFER_USAGE_BINDING_V1.json \
            --materials materials/D1_GCN_LOCALSHADER_API10_MATERIAL_CHAIN_V1.json \
            --out reports/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json
          python3 tools/d1_verify_api10_membership_provenance_v1.py \
            --manifest evidence/d1_localshader_api10_membership_provenance_v1.json \
            --usage usage/D1_GCN_LOCALSHADER_TBUFFER_USAGE_BINDING_V1.json \
            --materials materials/D1_GCN_LOCALSHADER_API10_MATERIAL_CHAIN_V1.json \
            --membership reports/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: d1-api10-membership-provenance-v1
          path: reports/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json
          if-no-files-found: error
