name: D1 base character corpus fast

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-base-character-corpus-fast.yml'
      - 'tools/d1_base_character_candidate_index_fast.py'
      - 'tools/d1_remote_character_corpus_probe.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal base catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl --fail --location --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Fast structural census of 337 base families
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_base_character_candidate_index_fast.py tools/d1_remote_character_corpus_probe.py
          python tools/d1_base_character_candidate_index_fast.py input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --out out/D1_BASE_CHARACTER_CANDIDATES.json | tee out/candidate_stdout.txt
      - name: Decode every strong base articulated family
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_character_corpus_probe.py out/D1_BASE_CHARACTER_CANDIDATES.json \
            --runtime runtime --kind base --out out/D1_BASE_CHARACTER_CORPUS.json | tee out/corpus_stdout.txt
      - name: Lock base corpus census
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          c=json.load(open('out/D1_BASE_CHARACTER_CANDIDATES.json'));d=json.load(open('out/D1_BASE_CHARACTER_CORPUS.json'))
          assert c['status']=='D1_CHARACTER_CANDIDATE_INDEX_COMPLETE',c['violations'][:5]
          assert c['namespace_family_count']==337,c['namespace_family_count']
          assert c['strong_character_payload_candidate_count']>0
          assert d['probed_family_count']==c['strong_character_payload_candidate_count'],(d['probed_family_count'],c['strong_character_payload_candidate_count'])
          assert d['structural_articulated_family_count']>0
          assert d['unique_ordered_skeleton_family_count']>0
          print('D1_BASE_CHARACTER_CORPUS_FAST_COMPLETE')
          print(json.dumps({
            'candidate_families':c['articulated_signature_family_count'],'strong_candidates':c['strong_character_payload_candidate_count'],
            'structural_families':d['structural_articulated_family_count'],'skeleton_occurrences':d['skeleton_occurrence_count'],
            'unique_skeleton_families':d['unique_ordered_skeleton_family_count'],'bone_counts':d['skeleton_bone_count_frequency']},indent=2))
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-BASE-CHARACTER-CORPUS-FAST
          path: out/
          retention-days: 14
          if-no-files-found: error
