name: D1 GCN renderer program 230-263 reuse 808EE505 v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-gcn-renderer-program-230-263-reuse-808ee505-v1.yml'
      - 'tools/d1_gcn_renderer_program_add_straightline.py'

permissions:
  contents: read
  actions: read

env:
  BASE_ARTIFACT_ID: '10076459009'
  BASE_ARTIFACT_ZIP_SHA256: '2e76a4987a4038b59c93aa3e4d7f1e101f90eb0f0ef3870226efc7af65cab1cc'
  BLOCK_ARTIFACT_ID: '10076674405'
  BLOCK_ARTIFACT_ZIP_SHA256: 'a01f556213e7e44e32e0aa992973d4de52fec4ff233b5ed994f77525bbc7bb28'

jobs:
  join:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover immutable green checkpoints
        run: |
          set -euo pipefail
          mkdir -p input/base input/block out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" -o input/base.zip
          echo "${BASE_ARTIFACT_ZIP_SHA256}  input/base.zip" | sha256sum --check --strict
          unzip -q input/base.zip -d input/base
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BLOCK_ARTIFACT_ID}/zip" -o input/block.zip
          echo "${BLOCK_ARTIFACT_ZIP_SHA256}  input/block.zip" | sha256sum --check --strict
          unzip -q input/block.zip -d input/block
          test -f input/base/D1_80D777B6_808EE505_RENDERER_PROGRAM.json
          test -f input/block/PS_808EE505_STRAIGHTLINE_230_263_EXPR.json

      - name: Verify checkpoint boundaries before mutation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,collections
          b=json.load(open('input/base/D1_80D777B6_808EE505_RENDERER_PROGRAM.json'))
          s=json.load(open('input/block/PS_808EE505_STRAIGHTLINE_230_263_EXPR.json'))
          assert b['status']=='D1_GCN_RENDERER_PROGRAM_IR_EXACT_PARTIAL' and not b['violations'],b
          p=b['program']; c=p['coverage']; rows=p['instruction_resolution']
          assert p['material']=='80D777B6' and p['pixel_shader']=='808EE505' and p['instruction_count']==456
          assert p['persistent_export_kill_contract_version']==2
          assert b['semantic_boundary']['persistent_export_kill_cfg']=='EXACT_PATH_AWARE_V2'
          assert c['primary_resolution_counts']=={
            'CONTROL_EXACT':18,'EXPRESSION_EXACT':161,'INPUT_PROVENANCE_EXACT':19,
            'RECURRENCE_EXACT':36,'STRUCTURAL_ONLY':222},c
          assert c['exact_nonstructural_instruction_count']==234
          assert all(rows[i]['primary_resolution']=='STRUCTURAL_ONLY' for i in range(230,264))
          assert s['status']=='D1_GCN_STRAIGHTLINE_230_263_EXPRESSION_EXACT' and not s['violations'],s
          e=s['expression']
          assert e['shader']=='808EE505' and e['material']=='80D777B6'
          assert e['instruction_range']==[230,263] and e['value_instruction_indices']==list(range(230,264))
          assert e['node_count']==86
          assert e['input_roots']['incoming_registers']==['s44','s45','s46','v0','v1','v13','v15','v7']
          assert len(e['input_roots']['raster_interpolation_coefficients'])==18
          ops=collections.Counter(n['op'] for n in e['nodes'])
          assert ops['MADMK']==14 and ops['CONST']==14 and ops['INPUT']==26
          assert e['semantic_boundary']['portable_barycentric_reconstruction']=='WITHHELD'
          print('GREEN_CHECKPOINTS_PINNED',c['primary_resolution_counts'],ops)
          PY

      - name: Attach exact 230-263 DAG and recompute renderer ledger
        run: |
          set -euo pipefail
          python tools/d1_gcn_renderer_program_add_straightline.py \
            --program input/base/D1_80D777B6_808EE505_RENDERER_PROGRAM.json \
            --straightline-expr input/block/PS_808EE505_STRAIGHTLINE_230_263_EXPR.json \
            -o out/D1_80D777B6_808EE505_RENDERER_PROGRAM.json
          python - <<'PY'
          import json
          d=json.load(open('out/D1_80D777B6_808EE505_RENDERER_PROGRAM.json'))
          assert d['status']=='D1_GCN_RENDERER_PROGRAM_IR_EXACT_PARTIAL' and not d['violations'],d
          p=d['program']; c=p['coverage']; rows=p['instruction_resolution']
          expected={'CONTROL_EXACT':18,'EXPRESSION_EXACT':195,'INPUT_PROVENANCE_EXACT':19,'RECURRENCE_EXACT':36,'STRUCTURAL_ONLY':188}
          assert c['primary_resolution_counts']==expected,(c['primary_resolution_counts'],expected)
          assert c['exact_nonstructural_instruction_count']==268
          assert c['structural_only_instruction_count']==188
          assert c['straightline_promoted_instruction_count']==34
          assert c['straightline_promoted_instructions']==list(range(230,264))
          for i in range(230,264):
            q=rows[i]
            assert q['primary_resolution']=='EXPRESSION_EXACT'
            assert 'STRAIGHTLINE_230_263_EXPRESSION_DAG' in q['evidence_tags']
          assert p['persistent_export_kill_contract_version']==2
          assert d['semantic_boundary']['persistent_export_kill_cfg']=='EXACT_PATH_AWARE_V2'
          spans=[(x['start_instruction'],x['end_instruction']) for x in c['structural_only_spans']]
          expected_spans=[
            (0,0),(2,5),(7,20),(23,32),(35,57),(60,104),(106,106),(108,148),
            (191,193),(195,198),(201,205),(208,228),(329,331),(334,334),(342,342),
            (373,374),(386,386),(391,391),(397,397),(401,401),(416,416),(418,418),
            (444,444),(450,450),(455,455)]
          assert spans==expected_spans,(spans,expected_spans)
          print('RENDERER_230_263_JOIN_CLOSED',expected,'exact_nonstructural',c['exact_nonstructural_instruction_count'])
          PY
          cp input/block/PS_808EE505_STRAIGHTLINE_230_263_EXPR.json out/
          sha256sum out/*.json > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-GCN-808EE505-RENDERER-PROGRAM-230-263-V1
          path: out/
          retention-days: 30
          if-no-files-found: error
