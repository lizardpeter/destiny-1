name: Recover Vex 00E2 patch siblings

on:
  push:
    paths:
      - '.github/workflows/recover-vex-00e2-patches.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Try public mirror package siblings
        run: |
          set -euo pipefail
          mkdir -p out
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          for f in ps4_arch_vex_00e2_1.pkg ps4_arch_vex_00e2_2.pkg ps4_arch_vex_00e2_4.pkg; do
            echo "Trying $f"
            if curl --fail --location --retry 2 "$base/$f" --output "out/$f"; then
              stat -c '%n %s bytes' "out/$f"
              sha256sum "out/$f"
            else
              echo "MISS $f" | tee -a out/misses.txt
              rm -f "out/$f"
            fi
          done
          ls -lh out
      - name: Upload whatever was found
        uses: actions/upload-artifact@v4
        with:
          name: vex-00e2-patch-siblings
          path: out/
          retention-days: 1
          if-no-files-found: error
