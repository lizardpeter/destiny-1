name: D1 Spektar Pandion Titan playable assembly

on:
  push:
    paths:
      - '.github/workflows/d1-spektr-pandion-titan-assembly.yml'
      - 'tools/d1_remote_model_export.py'
      - 'tools/d1_playable_guardian_entity_resource_resolve.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies
        run: python -m pip install -q numpy trimesh
      - name: Recover full Guardian retail entity-resolution artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input runtime out/models
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=d1-playable-guardian-entity-resolution&per_page=20" \
            | python -c "import json,sys; a=[x for x in json.load(sys.stdin)['artifacts'] if not x['expired']]; print(a[0]['archive_download_url'])")
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$url" -o input/full.zip
          unzip -q input/full.zip -d input/full
          test -f input/full/playable_guardian_entity_resolution.json
      - name: Select exact five-piece Spektar Pandion Titan set
        run: |
          python - <<'PY'
          import json
          src=json.load(open('input/full/playable_guardian_entity_resolution.json'))
          names={
            'Spektar Pandion Gauntlets','Spektar Pandion Plate','Spektar Pandion Mark',
            'Spektar Pandion Helmet','Spektar Pandion Greaves'
          }
          items=[x for x in src['items'] if x.get('className')=='Titan' and x.get('name') in names]
          assert {x['name'] for x in items}==names,{x.get('name') for x in items}
          arr_ids={x['arrangement_index'] for x in items}
          assert arr_ids=={3867,3868,3869,3870,3871},arr_ids
          arr=[x for x in src['arrangements'] if x.get('className')=='Titan' and x.get('arrangement_index') in arr_ids]
          assert len(arr)==5,len(arr)
          # Retain the entire exact branch data here; the exporter later selects masculine.
          out={**src,'arrangements':arr,'items':items,'arrangement_count':5,'named_item_count':5}
          json.dump(out,open('input/spektar_pandion_titan.json','w'),indent=2)
          for x in sorted(items,key=lambda z:z['itemTypeName']):
              print(x['itemTypeName'],x['name'],x['arrangement_index'],[(b['body_role'],b.get('entity_data_hash')) for b in x['resolved_body_assignments']])
          PY
      - name: Recover verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Resolve exact five-piece entities to model hashes
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_playable_guardian_entity_resource_resolve.py \
            input/spektar_pandion_titan.json \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --member-catalog evidence/d1_player_gear_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/spektar_pandion_resources.json
      - name: Export and merge masculine Guardian models directly from retail ranges
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_model_export.py \
            --report out/spektar_pandion_resources.json --body-role masculine \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --member-catalog evidence/d1_player_gear_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --out-dir out/models \
            --combined-glb out/SPEKTAR_PANDION_TITAN_MASCULINE.glb \
            -o out/spektar_pandion_masculine_export.json
          python - <<'PY'
          import json,os
          d=json.load(open('out/spektar_pandion_masculine_export.json'))
          assert d['selected_model_count']==5,d['selected_model_count']
          assert d['exported_model_count']==5,d['exported_model_count']
          assert os.path.getsize('out/SPEKTAR_PANDION_TITAN_MASCULINE.glb')>1000
          print('COMPLETE TITAN',d['total_geometry_count'],'geometry groups',d['total_triangle_count'],'triangles',d['combined_bounds'])
          for x in d['models']:
              print(x['examples'][0]['itemTypeName'],x['examples'][0]['name'],x['tag_hash'],f"pkg={x['package_id']:04X}",x['triangle_count'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-spektr-pandion-titan-masculine
          path: out/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
