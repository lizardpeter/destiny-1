name: D1 Spektar Pandion Titan playable assembly

on:
  push:
    paths:
      - '.github/workflows/d1-spektr-pandion-titan-assembly.yml'
      - 'tools/d1_remote_model_export.py'
      - 'tools/d1_entity_model_export.py'
      - 'tools/d1_playable_guardian_entity_resource_resolve.py'
      - 'evidence/d1_investment_asset_member_catalog.json'
      - 'evidence/d1_player_gear_member_catalog.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies
        run: python -m pip install -q numpy trimesh
      - name: Recover full Guardian retail entity-resolution artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input runtime out/models
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=d1-playable-guardian-entity-resolution&per_page=20" \
            | python -c "import json,sys; a=[x for x in json.load(sys.stdin)['artifacts'] if not x['expired']]; print(a[0]['archive_download_url'])")
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$url" -o input/full.zip
          unzip -q input/full.zip -d input/full
          test -f input/full/playable_guardian_entity_resources.json
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Select coherent Spektar Pandion five-piece set
        run: |
          set -euo pipefail
          python tools/d1_guardian_set_select.py input/full/playable_guardian_entity_resources.json \
            --item 'Spektar Pandion Gauntlets' --item 'Spektar Pandion Plate' --item 'Spektar Pandion Mark' \
            --item 'Spektar Pandion Helmet' --item 'Spektar Pandion Greaves' \
            -o out/spektar_pandion_resources.json
          python - <<'PY'
          import json
          d=json.load(open('out/spektar_pandion_resources.json'))
          assert d['arrangement_count']==5,d
          names={e['name'] for a in d['arrangements'] for e in a.get('examples',[])}
          expected={'Spektar Pandion Gauntlets','Spektar Pandion Plate','Spektar Pandion Mark','Spektar Pandion Helmet','Spektar Pandion Greaves'}
          assert expected <= names,(expected,names)
          print('SELECTED',sorted(expected))
          PY
      - name: Export exact masculine models through verified multi-package reader
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_model_export.py \
            --report out/spektar_pandion_resources.json --body-role masculine \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --member-catalog evidence/d1_player_gear_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --out-dir out/models \
            --combined-glb out/SPEKTAR_PANDION_TITAN_MASCULINE.glb \
            --manifest out/spektar_pandion_masculine_export.json
      - name: Validate complete five-piece assembly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import trimesh
          d=json.load(open('out/spektar_pandion_masculine_export.json'))
          assert d['exported_model_count']==5,d
          expected={'80A8274E','80A85682','809FDB1E','80A816E4','80A862BA'}
          got={x['model_tag_hash'] for x in d['models']}
          assert got==expected,(got,expected)
          assert d['total_geometry_count']==69,d
          assert d['total_triangle_count']==28140,d
          assert not d['failures'],d['failures']
          s=trimesh.load('out/SPEKTAR_PANDION_TITAN_MASCULINE.glb',force='scene',process=False)
          assert len(s.geometry)==69,len(s.geometry)
          assert sum(len(g.faces) for g in s.geometry.values())==28140
          assert s.bounds is not None
          # Ensure the corrected stream-pair decoder actually reached both UV source paths.
          reports=[json.load(open(x['json'])) for x in d['models']]
          sources={m.get('uv_source') for r in reports for m in r.get('meshes',[])}
          assert {'primary','secondary'} <= sources,sources
          print('SUCCESS',d['exported_model_count'],'models',len(s.geometry),'groups',sum(len(g.faces) for g in s.geometry.values()),'triangles','UV sources',sorted(sources))
          print('bounds',s.bounds.tolist())
          PY
          sha256sum out/SPEKTAR_PANDION_TITAN_MASCULINE.glb | tee out/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: d1-spektr-pandion-titan-masculine
          path: out/
          retention-days: 14
          compression-level: 1
