          print('CROTA_SELECTOR_CURVE_SEQUENCE_GROUPS',d['decoded_curve_sequence_group_count'])
          print('CROTA_CROSS_FILEHASH_CURVE_SEQUENCE_ALIAS_GROUPS',
                d['cross_filehash_curve_sequence_alias_group_count'])
          print('CROTA_DIFFERENT_CLIP_HASH_SAME_DECODED_CURVE_GROUPS',
                d['different_clip_hash_same_decoded_curve_group_count'])
          for x in d['different_clip_hash_same_decoded_curve_groups']:
              print('DECODED_CURVE_ALIAS',x['decoded_local_curve_sha256'],x['clips'],x['controls'])
          for x in d['cross_filehash_curve_sequence_alias_groups']:
              print('SELECTOR_CURVE_ALIAS',x['decoded_curve_sequence'],x['selected_clip_sequences'],x['state_hashes'])
          PY

      - name: Correlate exact frame-event pointers with timing and selector reuse
        run: |
          set -euo pipefail
          python tools/d1_animation_event_timing_correlation.py \
            --events out/CROTA_ANIMATION_FRAME_EVENT_POINTER_CENSUS.json \
            --timing out/CROTA_ANIMATION_STATE_SCALAR_TIMING_PROOF.json \
            --aliases out/CROTA_ANIMATION_SELECTOR_ALIAS_CENSUS.json \
            --out out/CROTA_ANIMATION_EVENT_TIMING_CORRELATION.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_ANIMATION_EVENT_TIMING_CORRELATION.json'))
          assert d['status']=='D1_ANIMATION_EVENT_TIMING_CORRELATION_EXACT',d
          assert not d['violations'],d['violations']
          assert d['clip_count']==82,d
          assert d['semantic_boundary']['pointer_count_as_event_count']=='WITHHELD',d
          assert d['semantic_boundary']['event_behavior']=='WITHHELD',d
          print('CROTA_EVENT_TIMING_GROUPS',d['pointer_count_frame_groups'])
          print('CROTA_EVENT_BEARING_CLIPS',d['event_pointer_bearing_clip_count'])
          for x in d['event_pointer_bearing_clips'][:30]:
              print('EVENT_POINTER_CLIP',x['clip'],'FRAMES',x['frame_count'],
                    'POINTERS',x['frame_event_pointer_count'],'STATE_HASHES',x['state_hash_count'])
          PY

      - name: Hash and upload
        if: always()
        run: |
          set -euo pipefail
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-EXACT-BODY-ANIMATION-V1
          path: out/
          retention-days: 30
          if-no-files-found: error
