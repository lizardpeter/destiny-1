name: D1 Crota exact body rig and animation v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-exact-body-animation-v1.yml'
      - 'tools/d1_remote_exact_s_entity_probe.py'
      - 'tools/d1_remote_runtime_rig_probe.py'
      - 'tools/d1_remote_spawned_actor_animation_options_v3.py'
      - 'tools/d1_remote_spawned_actor_animation_options_v2.py'
      - 'tools/d1_animation_motion_census.py'\n      - 'tools/d1_animation_motion_bone_map.py'\n      - 'tools/d1_crota_skeleton_usage_union.py'\n      - 'tools/d1_crota_skeleton_usage_matrix.py'\n      - 'tools/d1_crota_skin_bone_map.py'\n      - 'tools/d1_world_articulated_skin_census.py'\n      - 'tools/d1_remote_crota_skin_census.py'\n      - 'tools/d1_animation_frame_event_pointer_census.py'
      - 'tools/d1_crota_runtime_component_boundary.py'\n      - 'tools/d1_crota_runtime_control_skeleton_map.py'
      - 'tools/d1_animation_state_scalar_timing_proof.py'
      - 'tools/d1_animation_selector_alias_census.py'
      - 'tools/d1_animation_control_state_map_v2.py'
      - 'tools/d1_tiger_animation_safe_offsets.py'

permissions:
  contents: read
  actions: read

env:
  BASE_URL: https://crypt.cohae.dev/destiny/ps4/packages/latest
  CATALOG_ARTIFACT_ID: '9994811238'
  CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  PARSER_COMMIT: 'b9fdc3a43dd28118113275624fcc9054b75855f4'

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact catalog, pinned parser, and runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy scipy pyglm trimesh
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet "$PARSER_COMMIT"
          test "$(git -C parser rev-parse HEAD)" = "$PARSER_COMMIT"
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Reopen exact Crota physical s_entity and lock core resources
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python tools/d1_remote_exact_s_entity_probe.py \
            --tag-hash 0x8108E484 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url "$BASE_URL" --part-count 10 --runtime runtime \
            -o out/CROTA_EXACT_S_ENTITY_8108E484.json | tee out/s_entity_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_EXACT_S_ENTITY_8108E484.json'))
          assert d['violation_count']==0,d['violations']
          assert len(d['entries'])==1,d['entries']
          e=d['entries'][0]
          assert e['tag_hash']=='8108E484',e
          assert e['entry']['reference']=='80800734',e['entry']
          assert e['resource_count']==58,e['resource_count']
          assert e['embedded_models']==['8108E5B7'],e.get('embedded_models')
          sk=[(x['resource_hash'],x['node_count']) for x in e.get('skeletons',[])]
          assert sk==[('8108E4BB',50)],sk
          rigs=[]; owners={}
          for r in e['resources']:
              er=r.get('entity_resource') or {}
              pair=(er.get('unk10_class'),er.get('unk18_class'))
              if pair==('808008B2','8080099B'): rigs.append(r['resource_hash'])
              if pair in (('808020BF','808029D2'),('80802B92','808020BB')):
                  owners.setdefault(pair,[]).append(r['resource_hash'])
          assert rigs==['8108E4CB'],rigs
          assert all(len(owners.get(p,[]))==1 for p in (('808020BF','808029D2'),('80802B92','808020BB'))),owners
          print('CROTA_BODY','8108E484','MODEL','8108E5B7','SKELETON','8108E4BB','BONES',50,'RIG',rigs[0])
          print('ANIMATION_OWNERS',owners)
          open('out/CROTA_EXACT_ANIMATION_OWNER_TAGS.json','w').write(json.dumps({'rig':rigs[0],'owners':{f'{a}->{b}':v for (a,b),v in owners.items()}},indent=2)+'\\n')
          PY

      - name: Decode exact Crota runtime rig
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python tools/d1_remote_runtime_rig_probe.py \
            --rig-resource 0x8108E4CB \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url "$BASE_URL" --part-count 10 --runtime runtime --parser-root parser \
            -o out/CROTA_RUNTIME_RIG_8108E4CB.json | tee out/rig_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_RUNTIME_RIG_8108E4CB.json'))
          assert d['rig_resource_tag_hash']=='8108E4CB',d
          assert (d['discriminator_class'],d['info_class'])==('808008B2','8080099B'),d
          assert d['control_count']>0,d
          print('CROTA_RUNTIME_RIG_CONTROLS',d['control_count'],'COMPONENTS',d['runtime_rig_components'])
          PY

      - name: Execute exact single-entity animation v3 closure
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/d1_animation_control_state_map_v2.py \
            tools/d1_tiger_animation_safe_offsets.py \
            tools/d1_remote_spawned_actor_animation_options_v3.py
          python tools/d1_remote_spawned_actor_animation_options_v3.py \
            --entity 0x8108E484 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url "$BASE_URL" --part-count 10 --runtime runtime --parser-root parser \
            -o out/CROTA_ANIMATION_OPTIONS_V3.json | tee out/animation_stdout.txt

      - name: Validate and summarize exact Crota animation population
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          d=json.load(open('out/CROTA_ANIMATION_OPTIONS_V3.json'))
          assert d['schema']=='d1_remote_spawned_actor_animation_options/v3',d.get('schema')
          assert d['entity_count']==1,d['entity_count']
          assert d['entities'][0]['entity']=='8108E484',d['entities']
          assert d['violation_count']==0,d['violations'][:20]
          assert d['frontier_count']==0,d['frontiers'][:20]
          assert d['retarget_pair_failure_count']==0,d['retarget_pair_failure_count']
          assert d['retarget_pair_success_count']==d['retarget_pair_execution_count'],d
          assert d['closed_target_count']==d['target_count'],d
          assert d['status']=='D1_ACTIVITY_ACTOR_ANIMATION_OPTIONS_COMPLETE',d['status']
          row=d['entities'][0]
          out={
              'schema':'d1_crota_exact_body_animation_checkpoint/v1',
              'status':'D1_CROTA_EXACT_BODY_ANIMATION_SOURCE_CLOSED',
              'semantic_identity':{
                  'script_family':'dark_lens.sq_crota','script_family_hash':'A384A910',
                  'entity_name_hash':'64C53DB9','entity_name':'Crota, Son of Oryx',
                  'physical_s_entity':'8108E484',
              },
              'physical':{'model':'8108E5B7','skeleton_resource':'8108E4BB','skeleton_node_count':50,'runtime_rig':'8108E4CB'},
              'animation':{
                  'control_hashes':row.get('control_hashes',[]),
                  'control_count':len(row.get('control_hashes',[])),
                  'target_count':d['target_count'],
                  'unique_control_count':d['unique_control_count'],
                  'unique_selector_selected_clip_count':d['unique_selector_selected_clip_count'],
                  'unique_selector_selected_clip_hashes':d['unique_selector_selected_clip_hashes'],
                  'unique_animation_list_clip_count':d['unique_animation_list_clip_count'],
                  'retarget_pair_execution_count':d['retarget_pair_execution_count'],
                  'retarget_pair_success_count':d['retarget_pair_success_count'],
                  'exact_empty_control_target_count':d['exact_empty_control_target_count'],
                  'implicit_null_selector_count':d['implicit_null_selector_count'],
              },
              'policy':'Identity comes from the source-mapped D912 SMapDataEntry EntitySK plus S331 EntityName 64C53DB9 resolved through exact GlobalStrings. Physical resources come only from s_entity 8108E484 Resource[]. Animation controls come only from the two calibrated owner class pairs and their fixed source-proven 80802C0E fields; every selected clip must pass the pinned native D1 retarget path.',
          }
          pathlib.Path('out/CROTA_EXACT_BODY_ANIMATION_CHECKPOINT.json').write_text(json.dumps(out,indent=2)+'\\n')
          print('CROTA_ANIMATION_SOURCE_CLOSED','CONTROLS',out['animation']['unique_control_count'],'SELECTED_CLIPS',out['animation']['unique_selector_selected_clip_count'],'BANK_CLIPS',out['animation']['unique_animation_list_clip_count'],'RETARGETS',out['animation']['retarget_pair_execution_count'])
          print('CONTROL_HASHES',out['animation']['control_hashes'])
          print('SELECTED_CLIP_HASHES',out['animation']['unique_selector_selected_clip_hashes'])
          PY

      - name: Census exact selected-clip frame-event pointer structures
        run: |
          set -euo pipefail
          python tools/d1_animation_frame_event_pointer_census.py \
            --options out/CROTA_ANIMATION_OPTIONS_V3.json \
            --out out/CROTA_ANIMATION_FRAME_EVENT_POINTER_CENSUS.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_ANIMATION_FRAME_EVENT_POINTER_CENSUS.json'))
          assert d['status']=='D1_ANIMATION_FRAME_EVENT_POINTER_CENSUS_EXACT',d
          assert not d['violations'],d['violations']
          assert d['resolved_clip_count']==d['selected_unique_clip_count'],d
          assert d['semantic_boundary']['event_record_schema']=='WITHHELD',d
          assert d['semantic_boundary']['event_names']=='WITHHELD',d
          print('CROTA_FRAME_EVENT_POINTER_HISTOGRAM',d['frame_event_pointer_count_histogram'])
          print('CROTA_CLIPS_WITH_FRAME_EVENT_POINTERS',d['clips_with_nonzero_frame_event_pointer_count'])
          print('CROTA_EVENT_POINTER_TOTAL',d['total_frame_event_pointer_count'])
          print('CROTA_EVENT_PREFIX_GROUPS',[(x['occurrence_count'],x['target_prefix_byte_count'],x['target_prefix_sha256']) for x in d['target_prefix_groups'][:16]])
          PY

      - name: Prove exact Crota runtime-component retarget boundary
        run: |
          set -euo pipefail
          python tools/d1_crota_runtime_component_boundary.py \
            --animation-options out/CROTA_ANIMATION_OPTIONS_V3.json \
            --runtime-rig out/CROTA_RUNTIME_RIG_8108E4CB.json \
            --out out/CROTA_RUNTIME_COMPONENT_BOUNDARY.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_RUNTIME_COMPONENT_BOUNDARY.json'))
          assert d['status']=='D1_CROTA_RUNTIME_COMPONENT_BOUNDARY_EXACT',d
          assert not d['violations'],d['violations']
          assert d['shared_retargetable_control_prefix_count']==37,d
          assert d['remaining_target_control_count']==7,d
          assert d['source_component_family_count']==3,d
          assert [x['clip_count'] for x in d['source_component_families']]==[68,13,1],d
          print('CROTA_COMPONENT_TARGET',d['target_components'])
          print('CROTA_COMPONENT_SOURCE_FAMILIES',d['source_component_families'])
          PY

      - name: Map runtime-rig controls onto exact skeleton nodes
        run: |
          set -euo pipefail
          python tools/d1_crota_runtime_control_skeleton_map.py \
            --runtime-rig out/CROTA_RUNTIME_RIG_8108E4CB.json \
            --s-entity out/CROTA_EXACT_S_ENTITY_8108E484.json \
            --component-boundary out/CROTA_RUNTIME_COMPONENT_BOUNDARY.json \
            --skeleton-resource 8108E4BB \
            --out out/CROTA_RUNTIME_CONTROL_SKELETON_MAP.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_RUNTIME_CONTROL_SKELETON_MAP.json'))
          assert d['status']=='D1_CROTA_RUNTIME_CONTROL_SKELETON_MAP_EXACT',d
          assert not d['violations'],d['violations']
          assert d['control_count']==44,d
          assert d['shared_prefix_control_count']==37,d
          assert d['target_only_suffix_control_count']==7,d
          assert not d['inverse_mapping_mismatches'],d
          assert d['semantic_boundary']['target_only_suffix_behavior']=='WITHHELD',d
          print('CROTA_CONTROLLED_SKELETON_NODES',d['controlled_skeleton_node_count'])
          print('CROTA_TARGET_ONLY_CONTROL_SUFFIX',[(x['control_index'],x['bone_index'],x['node_hash'],x['parent_node_index']) for x in d['target_only_suffix_controls']])
          PY

      - name: Census exact retargeted Crota motion variation
        run: |
          set -euo pipefail
          python tools/d1_animation_motion_census.py out/CROTA_ANIMATION_OPTIONS_V3.json \
            --out out/CROTA_ANIMATION_MOTION_CENSUS.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_ANIMATION_MOTION_CENSUS.json'))
          assert d['status']=='D1_ANIMATION_MOTION_CENSUS_EXACT',d
          assert d['missing_motion_summary_count']==0,d['missing_motion_summaries']
          assert d['successful_clip_instance_count']>0,d
          assert d['sample_rate_hz']=='WITHHELD',d
          assert d['behavioral_clip_names']=='WITHHELD',d
          for r in d['rows']:
              assert r['target_node_count']==50,r
              m=r['local_motion_summary']
              assert m['track_count']==50,m
              assert m['semantic_boundary']=='LOCAL_SPACE_VARIATION_ONLY_BONE0_NOT_NAMED_ROOT_MOTION',m
          print('CROTA_MOTION_CLIPS',d['successful_clip_instance_count'])
          print('FRAME_HISTOGRAM',d['frame_count_histogram'])
          print('DYNAMIC_ANY_TRACK_HISTOGRAM',d['dynamic_any_track_count_histogram'])
          print('DYNAMIC_TRANSLATION_TRACK_HISTOGRAM',d['dynamic_translation_track_count_histogram'])
          print('DYNAMIC_ROTATION_TRACK_HISTOGRAM',d['dynamic_rotation_track_count_histogram'])
          print('DYNAMIC_SCALE_TRACK_HISTOGRAM',d['dynamic_scale_track_count_histogram'])
          print('ANIMATED_CODEC_HISTOGRAM',d['animated_codec_type_histogram'])
          print('STATIC_CODEC_HISTOGRAM',d['static_codec_type_histogram'])
          print('CONTROL_MAP_SHAPES',d['control_map_shape_histogram'])
          assert sum(d['animated_codec_type_histogram'].values())==d['successful_clip_instance_count'],d
          assert sum(d['static_codec_type_histogram'].values())==d['successful_clip_instance_count'],d
          for r in d['rows']:
              assert r['source_animation_hash'],r
              assert r['source_control_map_counts'],r
              ac=r['source_animated_codec']
              if ac is not None:
                  assert 0 <= int(ac['codec_type']) <= 3,ac
                  assert int(ac['scale_stream_count']) >= 0 and int(ac['rotation_stream_count']) >= 0 and int(ac['translation_stream_count']) >= 0,ac
          print('BONE0_END_DISPLACEMENT_RANGE',d['bone0_translation_end_displacement_range'])
          print('BONE0_PEAK_DISPLACEMENT_RANGE',d['bone0_translation_peak_displacement_range'])
          PY

      - name: Map dynamic tracks onto exact Crota skeleton hierarchy
        run: |
          set -euo pipefail
          python tools/d1_animation_motion_bone_map.py \
            --motion-census out/CROTA_ANIMATION_MOTION_CENSUS.json \
            --s-entity out/CROTA_EXACT_S_ENTITY_8108E484.json \
            --skeleton-resource 8108E4BB \
            --out out/CROTA_ANIMATION_MOTION_BONE_MAP.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_ANIMATION_MOTION_BONE_MAP.json'))
          assert d['status']=='D1_ANIMATION_MOTION_BONE_MAP_EXACT',d
          assert not d['violations'],d['violations']
          assert d['skeleton_resource']=='8108E4BB',d
          assert d['skeleton_node_count']==50,d
          assert d['clip_instance_count']>0,d
          assert len(d['node_activity_rows'])==50,d
          assert d['semantic_boundary']['anatomical_names']=='WITHHELD',d
          assert d['semantic_boundary']['bone0_root_motion_semantic']=='WITHHELD',d
          for n in d['node_activity_rows']:
              assert len(n['node_hash'])==8,n
              assert 0 <= int(n['index']) < 50,n
          top=sorted(d['node_activity_rows'],key=lambda x:(-x['dynamic_any_clip_instances'],x['index']))[:15]
          print('CROTA_DYNAMIC_SKELETON_NODES',d['nodes_dynamic_in_any_clip_instance'])
          print('CROTA_DYNAMIC_TRANSLATION_NODES',d['nodes_dynamic_translation_in_any_clip_instance'])
          print('CROTA_DYNAMIC_ROTATION_NODES',d['nodes_dynamic_rotation_in_any_clip_instance'])
          print('CROTA_DYNAMIC_SCALE_NODES',d['nodes_dynamic_scale_in_any_clip_instance'])
          print('CROTA_TOP_DYNAMIC_NODE_HASHES',[(x['index'],x['node_hash'],x['parent_node_index'],x['dynamic_any_clip_instances']) for x in top])
          PY

      - name: Join exact retail skin use with dynamic animation use
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python tools/d1_remote_crota_skin_census.py \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url "$BASE_URL" --part-count 10 --runtime runtime \
            --out out/CROTA_EXACT_SKIN_CENSUS.json
          python tools/d1_crota_skin_bone_map.py \
            --skin-census out/CROTA_EXACT_SKIN_CENSUS.json \
            --s-entity out/CROTA_EXACT_S_ENTITY_8108E484.json \
            --skeleton-resource 8108E4BB \
            --out out/CROTA_SKIN_BONE_MAP.json
          python tools/d1_crota_skeleton_usage_union.py \
            --skin-bone-map out/CROTA_SKIN_BONE_MAP.json \
            --motion-bone-map out/CROTA_ANIMATION_MOTION_BONE_MAP.json \
            --out out/CROTA_SKELETON_USAGE_UNION.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_SKELETON_USAGE_UNION.json'))
          assert d['status']=='D1_CROTA_SKELETON_USAGE_UNION_EXACT',d
          assert not d['violations'],d['violations']
          assert d['node_count']==50,d
          assert sum(d['usage_class_counts'].values())==50,d
          assert d['semantic_boundary']['helper_bone_label']=='WITHHELD',d
          print('CROTA_SKELETON_USAGE_CLASSES',d['usage_class_counts'])
          print('CROTA_SKELETON_USAGE_OBSERVATIONS',d['structural_observations'])
          for x in d['nodes']:
              if x['usage_class']!='SKIN_AND_DYNAMIC_MOTION':
                  print('SKELETON_USAGE_EXCEPTION',x['index'],x['node_hash'],x['parent_node_index'],
                        x['usage_class'],'SKIN_REFS',x['skin_reference_count'],
                        'DYNAMIC_CLIPS',x['dynamic_any_clip_instances'])
          PY
          python tools/d1_crota_skeleton_usage_matrix.py \
            --usage-union out/CROTA_SKELETON_USAGE_UNION.json \
            --control-map out/CROTA_RUNTIME_CONTROL_SKELETON_MAP.json \
            --out out/CROTA_SKELETON_USAGE_MATRIX.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_SKELETON_USAGE_MATRIX.json'))
          assert d['status']=='D1_CROTA_SKELETON_USAGE_MATRIX_EXACT',d
          assert not d['violations'],d['violations']
          assert d['node_count']==50 and d['runtime_control_count']==44,d
          assert d['semantic_boundary']['helper_bone_interpretation']=='WITHHELD',d
          print('CROTA_SKELETON_PATTERN_HISTOGRAM',d['pattern_histogram'])
          print('CROTA_SKELETON_THREE_DOMAIN_OBSERVATIONS',d['observations'])
          for x in d['nodes']:
              if x['has_target_only_suffix_control'] or (x['has_skin_influence'] and not x['has_runtime_control']) or (x['has_dynamic_motion'] and not x['has_runtime_control']):
                  print('CROTA_SKELETON_MATRIX_NODE',x['index'],x['node_hash'],x['parent_node_index'],
                        x['structural_pattern'],x['runtime_controls'])
          PY

      - name: Prove exact control-scalar to frame timing ratio
        run: |
          set -euo pipefail
          python tools/d1_animation_state_scalar_timing_proof.py \
            --options out/CROTA_ANIMATION_OPTIONS_V3.json \
            --motion out/CROTA_ANIMATION_MOTION_CENSUS.json \
            --out out/CROTA_ANIMATION_STATE_SCALAR_TIMING_PROOF.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_ANIMATION_STATE_SCALAR_TIMING_PROOF.json'))
          assert d['status']=='D1_ANIMATION_STATE_SCALAR_TIMING_RATIO_EXACT',d
          assert d['ratio_frame_intervals_per_scalar_unit']==30.0,d
          assert d['single_selection_record_count']==126,d
          assert d['single_selection_matching_count']==126,d
          assert d['single_selection_max_abs_error']<1e-5,d
          assert d['multi_selection_record_count']==2,d
          assert d['multi_selection_first_choice_matching_count']==2,d
          assert d['semantic_boundary']['scalar_field_engine_name']=='WITHHELD',d
          print('CROTA_TIMING_RATIO_EXACT',
                d['single_selection_matching_count'],'OF',d['single_selection_record_count'],
                'SINGLE_SELECTION_RECORDS',
                'RATIO',d['ratio_frame_intervals_per_scalar_unit'],
                'MAX_ERROR',d['single_selection_max_abs_error'])
          for r in d['multi_selection_records']:
              print('MULTI_SELECTION_TIMING',r['record_index'],r['state_hash'],r['scalar_f32'],
                    [(x['clip'],x['frame_count'],x['matches_ratio_30']) for x in r['selected']])
          PY

      - name: Census exact selector aliases and clip reuse
        run: |
          set -euo pipefail
          python tools/d1_animation_selector_alias_census.py \
            --options out/CROTA_ANIMATION_OPTIONS_V3.json \
            --timing out/CROTA_ANIMATION_STATE_SCALAR_TIMING_PROOF.json \
            --out out/CROTA_ANIMATION_SELECTOR_ALIAS_CENSUS.json
          python - <<'PY'
          import json
