name: D1 Crota exact body rig and animation v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-exact-body-animation-v1.yml'
      - 'tools/d1_remote_exact_s_entity_probe.py'
      - 'tools/d1_skeleton_lineage_name_map.py'
      - 'tools/d1_remote_runtime_rig_probe.py'
      - 'tools/d1_remote_spawned_actor_animation_options_v3.py'
      - 'tools/d1_remote_spawned_actor_animation_options_v2.py'
      - 'tests/test_d1_animation_header_vectors.py'
      - 'tools/d1_animation_motion_census.py'
      - 'tools/d1_animation_motion_signature_census.py'
      - 'tools/d1_animation_motion_bone_map.py'
      - 'tools/d1_crota_skeleton_usage_union.py'
      - 'tools/d1_crota_skeleton_usage_matrix.py'
      - 'tools/d1_crota_named_skeleton_usage.py'
      - 'tools/d1_crota_unresolved_skeleton_context.py'
      - 'tools/d1_crota_skin_bone_map.py'
      - 'tools/d1_world_articulated_skin_census.py'
      - 'tools/d1_remote_crota_skin_census.py'
      - 'tools/d1_animation_frame_event_pointer_census.py'
      - 'tools/d1_animation_header_unnamed_vector_census.py'
      - 'tools/d1_animation_event_prefix_structure.py'
      - 'tools/d1_animation_event_target_layout.py'
      - 'tools/d1_crota_runtime_component_boundary.py'
      - 'tools/d1_crota_animation_component_state_census.py'
      - 'tools/d1_crota_component_motion_profile.py'
      - 'tools/d1_crota_runtime_control_skeleton_map.py'
      - 'tools/d1_animation_state_scalar_timing_proof.py'
      - 'tools/d1_animation_selector_alias_census.py'
      - 'tools/d1_animation_selector_curve_alias_join.py'
      - 'tools/d1_animation_event_timing_correlation.py'
      - 'tools/d1_animation_event_prefix_timing_candidates.py'
      - 'tools/d1_animation_control_state_map_v2.py'
      - 'tools/d1_tiger_animation_safe_offsets.py'

permissions:
  contents: read
  actions: read

env:
  BASE_URL: https://crypt.cohae.dev/destiny/ps4/packages/latest
  CATALOG_ARTIFACT_ID: '9994811238'
  CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  PARSER_COMMIT: 'b9fdc3a43dd28118113275624fcc9054b75855f4'

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact catalog, pinned parser, and runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy scipy pyglm trimesh
          python -m unittest tests.test_d1_animation_header_vectors -v
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet "$PARSER_COMMIT"
          test "$(git -C parser rev-parse HEAD)" = "$PARSER_COMMIT"
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Reopen exact Crota physical s_entity and lock core resources
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python tools/d1_remote_exact_s_entity_probe.py \
            --tag-hash 0x8108E484 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url "$BASE_URL" --part-count 10 --runtime runtime \
            -o out/CROTA_EXACT_S_ENTITY_8108E484.json | tee out/s_entity_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_EXACT_S_ENTITY_8108E484.json'))
          assert d['violation_count']==0,d['violations']
          assert len(d['entries'])==1,d['entries']
          e=d['entries'][0]
          assert e['tag_hash']=='8108E484',e
          assert e['entry']['reference']=='80800734',e['entry']
          assert e['resource_count']==58,e['resource_count']
          assert e['embedded_models']==['8108E5B7'],e.get('embedded_models')
          sk=[(x['resource_hash'],x['node_count']) for x in e.get('skeletons',[])]
          assert sk==[('8108E4BB',50)],sk
          rigs=[]; owners={}
          for r in e['resources']:
              er=r.get('entity_resource') or {}
              pair=(er.get('unk10_class'),er.get('unk18_class'))
              if pair==('808008B2','8080099B'): rigs.append(r['resource_hash'])
              if pair in (('808020BF','808029D2'),('80802B92','808020BB')):
                  owners.setdefault(pair,[]).append(r['resource_hash'])
          assert rigs==['8108E4CB'],rigs
          assert all(len(owners.get(p,[]))==1 for p in (('808020BF','808029D2'),('80802B92','808020BB'))),owners
          print('CROTA_BODY','8108E484','MODEL','8108E5B7','SKELETON','8108E4BB','BONES',50,'RIG',rigs[0])
          print('ANIMATION_OWNERS',owners)
          open('out/CROTA_EXACT_ANIMATION_OWNER_TAGS.json','w').write(json.dumps({'rig':rigs[0],'owners':{f'{a}->{b}':v for (a,b),v in owners.items()}},indent=2)+'\\n')
          PY

      - name: Join exact Crota node hashes to pinned parser lineage names
        run: |
          set -euo pipefail
          python tools/d1_skeleton_lineage_name_map.py \
            --s-entity out/CROTA_EXACT_S_ENTITY_8108E484.json \
            --skeleton-resource 8108E4BB \
            --parser-root parser \
            --out out/CROTA_SKELETON_LINEAGE_NAMES.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_SKELETON_LINEAGE_NAMES.json'))
          assert d['status']=='D1_SKELETON_LINEAGE_NAME_MAP_EXACT_HASH_JOIN',d
          assert not d['violations'],d['violations']
          assert d['node_count']==50,d
          assert d['lineage_named_node_count']==46,d
          assert d['unresolved_node_count']==4,d
          by={x['index']:x for x in d['rows']}
          assert (by[0]['node_hash'],by[0]['bungie_name'])==('E5685C1A','b_pedestal'),by[0]
          assert (by[2]['node_hash'],by[2]['bungie_name'])==('6EBAC0C7','b_pelvis'),by[2]
          assert (by[5]['node_hash'],by[5]['bungie_name'])==('A2A652A1','b_spine_1'),by[5]
          assert (by[18]['node_hash'],by[18]['bungie_name'])==('40D6927E','b_head'),by[18]
          assert (by[27]['node_hash'],by[27]['bungie_name'])==('9EF0E980','b_utility'),by[27]
          assert [(x['index'],x['node_hash']) for x in d['unresolved_nodes']]==[
            (1,'0E355AA8'),(21,'A485F9B8'),(26,'A91E97AF'),(30,'57F11E8A')
          ],d['unresolved_nodes']
          assert d['evidence_classes']['node_hash_and_order']=='EXACT_RETAIL_ENTITYSKELETON',d
          assert d['evidence_classes']['bungie_name_string']=='PINNED_COMMUNITY_PARSER_LINEAGE_TABLE',d
          print('CROTA_LINEAGE_NAMED_BONES',d['lineage_named_node_count'],'OF',d['node_count'])
          print('CROTA_UNRESOLVED_BONE_HASHES',[(x['index'],x['node_hash']) for x in d['unresolved_nodes']])
          PY

      - name: Decode exact Crota runtime rig
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python tools/d1_remote_runtime_rig_probe.py \
            --rig-resource 0x8108E4CB \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url "$BASE_URL" --part-count 10 --runtime runtime --parser-root parser \
            -o out/CROTA_RUNTIME_RIG_8108E4CB.json | tee out/rig_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_RUNTIME_RIG_8108E4CB.json'))
          assert d['rig_resource_tag_hash']=='8108E4CB',d
          assert (d['discriminator_class'],d['info_class'])==('808008B2','8080099B'),d
          assert d['control_count']>0,d
          print('CROTA_RUNTIME_RIG_CONTROLS',d['control_count'],'COMPONENTS',d['runtime_rig_components'])
          PY

      - name: Execute exact single-entity animation v3 closure
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/d1_animation_control_state_map_v2.py \
            tools/d1_tiger_animation_safe_offsets.py \
            tools/d1_remote_spawned_actor_animation_options_v3.py
          python tools/d1_remote_spawned_actor_animation_options_v3.py \
            --entity 0x8108E484 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url "$BASE_URL" --part-count 10 --runtime runtime --parser-root parser \
            -o out/CROTA_ANIMATION_OPTIONS_V3.json | tee out/animation_stdout.txt

      - name: Validate and summarize exact Crota animation population
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          d=json.load(open('out/CROTA_ANIMATION_OPTIONS_V3.json'))
          assert d['schema']=='d1_remote_spawned_actor_animation_options/v3',d.get('schema')
          assert d['entity_count']==1,d['entity_count']
          assert d['entities'][0]['entity']=='8108E484',d['entities']
          assert d['violation_count']==0,d['violations'][:20]
          assert d['frontier_count']==0,d['frontiers'][:20]
          assert d['retarget_pair_failure_count']==0,d['retarget_pair_failure_count']
          assert d['retarget_pair_success_count']==d['retarget_pair_execution_count'],d
          assert d['closed_target_count']==d['target_count'],d
          assert d['status']=='D1_ACTIVITY_ACTOR_ANIMATION_OPTIONS_COMPLETE',d['status']
          row=d['entities'][0]
          out={
              'schema':'d1_crota_exact_body_animation_checkpoint/v1',
              'status':'D1_CROTA_EXACT_BODY_ANIMATION_SOURCE_CLOSED',
              'semantic_identity':{
                  'script_family':'dark_lens.sq_crota','script_family_hash':'A384A910',
                  'entity_name_hash':'64C53DB9','entity_name':'Crota, Son of Oryx',
                  'physical_s_entity':'8108E484',
              },
              'physical':{'model':'8108E5B7','skeleton_resource':'8108E4BB','skeleton_node_count':50,'runtime_rig':'8108E4CB'},
              'animation':{
                  'control_hashes':row.get('control_hashes',[]),
                  'control_count':len(row.get('control_hashes',[])),
                  'target_count':d['target_count'],
                  'unique_control_count':d['unique_control_count'],
                  'unique_selector_selected_clip_count':d['unique_selector_selected_clip_count'],
                  'unique_selector_selected_clip_hashes':d['unique_selector_selected_clip_hashes'],
                  'unique_animation_list_clip_count':d['unique_animation_list_clip_count'],
                  'retarget_pair_execution_count':d['retarget_pair_execution_count'],
                  'retarget_pair_success_count':d['retarget_pair_success_count'],
                  'exact_empty_control_target_count':d['exact_empty_control_target_count'],
                  'implicit_null_selector_count':d['implicit_null_selector_count'],
              },
              'policy':'Identity comes from the source-mapped D912 SMapDataEntry EntitySK plus S331 EntityName 64C53DB9 resolved through exact GlobalStrings. Physical resources come only from s_entity 8108E484 Resource[]. Animation controls come only from the two calibrated owner class pairs and their fixed source-proven 80802C0E fields; every selected clip must pass the pinned native D1 retarget path.',
          }
          pathlib.Path('out/CROTA_EXACT_BODY_ANIMATION_CHECKPOINT.json').write_text(json.dumps(out,indent=2)+'\\n')
          print('CROTA_ANIMATION_SOURCE_CLOSED','CONTROLS',out['animation']['unique_control_count'],'SELECTED_CLIPS',out['animation']['unique_selector_selected_clip_count'],'BANK_CLIPS',out['animation']['unique_animation_list_clip_count'],'RETARGETS',out['animation']['retarget_pair_execution_count'])
          print('CONTROL_HASHES',out['animation']['control_hashes'])
          print('SELECTED_CLIP_HASHES',out['animation']['unique_selector_selected_clip_hashes'])
          PY

      - name: Census exact selected-clip frame-event pointer structures
        run: |
          set -euo pipefail
          python tools/d1_animation_frame_event_pointer_census.py \
            --options out/CROTA_ANIMATION_OPTIONS_V3.json \
            --out out/CROTA_ANIMATION_FRAME_EVENT_POINTER_CENSUS.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_ANIMATION_FRAME_EVENT_POINTER_CENSUS.json'))
          assert d['status']=='D1_ANIMATION_FRAME_EVENT_POINTER_CENSUS_EXACT',d
          assert not d['violations'],d['violations']
          assert d['resolved_clip_count']==d['selected_unique_clip_count'],d
          assert d['semantic_boundary']['event_record_schema']=='WITHHELD',d
          assert d['semantic_boundary']['event_names']=='WITHHELD',d
          print('CROTA_FRAME_EVENT_POINTER_HISTOGRAM',d['frame_event_pointer_count_histogram'])
          print('CROTA_CLIPS_WITH_FRAME_EVENT_POINTERS',d['clips_with_nonzero_frame_event_pointer_count'])
          print('CROTA_EVENT_POINTER_TOTAL',d['total_frame_event_pointer_count'])
          print('CROTA_EVENT_PREFIX_GROUPS',[(x['occurrence_count'],x['target_prefix_byte_count'],x['target_prefix_sha256']) for x in d['target_prefix_groups'][:16]])
          PY

      - name: Census discarded D1 ROI header vector beside frame events
        run: |
          set -euo pipefail
          python tools/d1_animation_header_unnamed_vector_census.py \
            --options out/CROTA_ANIMATION_OPTIONS_V3.json \
            --out out/CROTA_ANIMATION_HEADER_UNNAMED_VECTOR_CENSUS.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_ANIMATION_HEADER_UNNAMED_VECTOR_CENSUS.json'))
          assert d['status']=='D1_ANIMATION_HEADER_UNNAMED_VECTOR_CENSUS_EXACT',d
          assert not d['violations'],d['violations']
          assert d['clip_count']==82,d
          assert d['semantic_boundary']['unnamed_vector_element_stride']=='WITHHELD',d
          assert d['semantic_boundary']['unnamed_vector_element_type']=='WITHHELD',d
          print('CROTA_UNNAMED_HEADER_VECTOR_LENGTH_HIST',d['unnamed_length_histogram'])
          print('CROTA_UNNAMED_HEADER_VECTOR_EVENT_COUNT_PAIRS',d['unnamed_length_frame_event_count_pair_histogram'])
          print('CROTA_UNNAMED_HEADER_VECTOR_EQUAL_EVENT_COUNT',d['unnamed_length_equals_frame_event_count_clip_count'])
          print('CROTA_UNNAMED_HEADER_VECTOR_RELATION_MATCHES',d['unnamed_length_relation_match_counts'])
          print('CROTA_UNNAMED_HEADER_VECTOR_KNOWN_TARGET_ALIASES',d['unnamed_target_known_field_alias_histogram'])
          print('CROTA_UNNAMED_HEADER_VECTOR_TARGET_REGIONS',d['target_region_histogram'])
          print('CROTA_UNNAMED_HEADER_VECTOR_DISTANCE_CANDIDATES',d['integral_distance_per_element_candidate_histogram'])
          for x in d['rows']:
              if x['unnamed_length'] or x['frame_event_pointer_count']:
                  print('CROTA_UNNAMED_HEADER_VECTOR_CLIP',x['clip'],
                        'FRAMES',x['frame_count'],
                        'UNNAMED_LEN',x['unnamed_length'],
                        'COUNT_MATCHES',x['unnamed_length_relation_matches'],
                        'KNOWN_TARGET_ALIASES',x['unnamed_target_aliases_to_known_fields'],
                        'EVENT_PTRS',x['frame_event_pointer_count'],
                        'UNNAMED_TARGET',x['unnamed_target_offset'],
                        'EVENT_ARRAY',x['frame_pointer_array_target_offset'],
                        'DIST',x['unnamed_to_frame_pointer_array_distance'],
                        'CANDIDATE',x['distance_divided_by_unnamed_length_if_integral'],
                        'EVENT_TARGET_REL',x['unknown_target_event_target_relation'])
          PY

      - name: Census exact frame-event target layout
        run: |
          set -euo pipefail
          python tools/d1_animation_event_target_layout.py \
            --events out/CROTA_ANIMATION_FRAME_EVENT_POINTER_CENSUS.json \
            --out out/CROTA_ANIMATION_EVENT_TARGET_LAYOUT.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_ANIMATION_EVENT_TARGET_LAYOUT.json'))
          assert d['status']=='D1_ANIMATION_EVENT_TARGET_LAYOUT_EXACT',d
          assert not d['violations'],d['violations']
          assert d['semantic_boundary']['record_size']=='WITHHELD',d
          assert d['semantic_boundary']['candidate_stride_from_gcd']=='STRUCTURAL_DIAGNOSTIC_ONLY',d
          print('CROTA_EVENT_TARGET_DELTA_GCD',d['global_positive_target_delta_gcd'])
          print('CROTA_EVENT_TARGET_MIN_DELTA',d['global_minimum_positive_target_delta'])
          print('CROTA_EVENT_TARGET_REGIONS',d['target_region_histogram'])
          print('CROTA_EVENT_TARGET_ALIGNMENTS',d['target_alignment_remainders'])
          print('CROTA_EVENT_TARGET_PREFIX_OVERLAPS',d['overlapping_32byte_prefix_window_pair_count'])
          for x in d['rows']:
              if x['nonnull_pointer_count']:
                  print('EVENT_TARGET_LAYOUT',x['clip'],
                        'ARRAY',(x['pointer_array_offset'],x['pointer_array_end']),
                        'TARGETS',x['unique_target_offsets'],
                        'DELTAS',x['adjacent_positive_target_deltas'],
                        'DUPREF',x['duplicate_target_reference_count'])
          PY

      - name: Census bounded frame-event target prefix structure
        run: |
          set -euo pipefail
          python tools/d1_animation_event_prefix_structure.py \
            --events out/CROTA_ANIMATION_FRAME_EVENT_POINTER_CENSUS.json \
            --out out/CROTA_ANIMATION_EVENT_PREFIX_STRUCTURE.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_ANIMATION_EVENT_PREFIX_STRUCTURE.json'))
          assert d['status']=='D1_ANIMATION_EVENT_PREFIX_STRUCTURE_EXACT',d
          assert not d['violations'],d['violations']
          assert d['sample_count']>0,d
          assert d['semantic_boundary']['record_size']=='WITHHELD',d
          assert d['semantic_boundary']['frame_field']=='WITHHELD',d
          assert d['semantic_boundary']['event_type']=='WITHHELD',d
          print('CROTA_EVENT_PREFIX_SAMPLES',d['sample_count'])
          print('CROTA_EVENT_PREFIX_UNIQUE',d['unique_32byte_prefix_count'])
          print('CROTA_EVENT_FRAME_BOUNDED_CANDIDATE_LANES',d['frame_bounded_candidate_lanes'])
          for k in d['frame_bounded_candidate_lanes']:
              r=d['lanes'][k]
              print('EVENT_PREFIX_CANDIDATE',k,'DISTINCT',r['distinct_value_count'],
                    'RANGE',(r['min'],r['max']),
                    'LT_FRAME_FRAC',r['value_lt_frame_count_fraction'],
                    'MONOTONIC',r['monotonic_nondecreasing_clip_count'],'OF',r['multi_pointer_clip_count'])
          PY

      - name: Prove exact Crota runtime-component retarget boundary
        run: |
          set -euo pipefail
          python tools/d1_crota_runtime_component_boundary.py \
            --animation-options out/CROTA_ANIMATION_OPTIONS_V3.json \
            --runtime-rig out/CROTA_RUNTIME_RIG_8108E4CB.json \
            --out out/CROTA_RUNTIME_COMPONENT_BOUNDARY.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_RUNTIME_COMPONENT_BOUNDARY.json'))
          assert d['status']=='D1_CROTA_RUNTIME_COMPONENT_BOUNDARY_EXACT',d
          assert not d['violations'],d['violations']
          assert d['shared_retargetable_control_prefix_count']==37,d
          assert d['remaining_target_control_count']==7,d
          assert d['source_component_family_count']==3,d
          assert [x['clip_count'] for x in d['source_component_families']]==[68,13,1],d
          print('CROTA_COMPONENT_TARGET',d['target_components'])
          print('CROTA_COMPONENT_SOURCE_FAMILIES',d['source_component_families'])
          PY

      - name: Census selector states by exact runtime-component family
        run: |
          set -euo pipefail
          python tools/d1_crota_animation_component_state_census.py \
            --options out/CROTA_ANIMATION_OPTIONS_V3.json \
            --control 8108E5C0 \
            --out out/CROTA_ANIMATION_COMPONENT_STATE_CENSUS.json
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_ANIMATION_COMPONENT_STATE_CENSUS.json'))
          assert d['status']=='D1_CROTA_ANIMATION_COMPONENT_STATE_CENSUS_EXACT',d
          assert not d['violations'],d['violations']
          assert d['control']=='8108E5C0',d
          assert d['selected_clip_count']==82,d
          assert d['state_record_count']==128,d
          assert d['component_family_count']==3,d
          assert [x['selected_clip_count'] for x in d['families']]==[68,13,1],d['families']
          pats={(x['selection_count'],tuple(x['family_sequence'])):x['state_record_count'] for x in d['state_family_patterns']}
          assert pats[(1,(0,))]==100,pats
          assert pats[(1,(1,))]==24,pats
          assert pats[(1,(2,))]==2,pats
          assert pats[(2,(0,0))]==1,pats
          assert pats[(2,(0,1))]==1,pats
          assert d['multi_selection_record_count']==2,d
          mr={x['record_index']:x for x in d['multi_selection_records']}
          assert mr[92]['state_hash']=='2866EB1D' and mr[92]['family_sequence']==[0,0],mr[92]
          assert [x['frame_count'] for x in mr[92]['selected']]==[31,31],mr[92]
          assert mr[127]['state_hash']=='A726F478' and mr[127]['family_sequence']==[0,1],mr[127]
          assert [x['frame_count'] for x in mr[127]['selected']]==[31,41],mr[127]
          assert abs(mr[92]['scalar_minus_lead_clip_frame_intervals_div_30'])<1e-6,mr[92]
          assert abs(mr[127]['scalar_minus_lead_clip_frame_intervals_div_30'])<1e-6,mr[127]
          assert d['semantic_boundary']['behavioral_clip_names']=='WITHHELD',d
          print('CROTA_COMPONENT_STATE_FAMILIES',
                [(x['family_index'],x['selected_clip_count'],x['runtime_components']) for x in d['families']])
          print('CROTA_COMPONENT_STATE_PATTERNS',d['state_family_patterns'])
          print('CROTA_COMPONENT_MULTI_SELECTION',
                [(x['record_index'],x['state_hash'],x['scalar_f32'],x['family_sequence'],
