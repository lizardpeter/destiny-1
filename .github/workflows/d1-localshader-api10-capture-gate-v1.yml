name: D1 LocalShader API10 capture gate v1
on:
  workflow_dispatch:
  push:
    branches: [d1-crota-source-semantics-v1]
    paths:
      - 'tools/d1_localshader_api10_capture_gate_v1.py'
      - 'tests/fixtures/d1_localshader_api10_capture_gate_complete_v1.json'
      - 'tests/fixtures/d1_localshader_api10_capture_gate_incomplete_v1.json'
      - 'tests/fixtures/d1_localshader_api10_capture_gate_negative_semantic_v1.json'
      - 'tests/fixtures/d1_localshader_api10_capture_gate_fake_primary_v1.json'
      - 'evidence/d1_gcn_localshader_api10_access_family_census_2026-09-18.json'
      - '.github/workflows/d1-localshader-api10-capture-gate-v1.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen family contract with non-semantic fixture
        run: |
          python3 tools/d1_localshader_api10_capture_gate_v1.py --frozen evidence/d1_gcn_localshader_api10_access_family_census_2026-09-18.json --captures tests/fixtures/d1_localshader_api10_capture_gate_complete_v1.json --out /tmp/d1_api10_capture_gate.json
      - name: Require incomplete family coverage to fail closed
        run: |
          if python3 tools/d1_localshader_api10_capture_gate_v1.py --frozen evidence/d1_gcn_localshader_api10_access_family_census_2026-09-18.json --captures tests/fixtures/d1_localshader_api10_capture_gate_incomplete_v1.json --out /tmp/d1_api10_capture_gate_incomplete.json; then exit 1; fi
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/d1_api10_capture_gate_incomplete.json'));assert p['status']=='D1_LOCALSHADER_API10_CAPTURE_COVERAGE_INCOMPLETE';assert len(p['missing_families'])==5
          PY
      - name: Require unproven engine semantic to fail closed
        run: |
          if python3 tools/d1_localshader_api10_capture_gate_v1.py --frozen evidence/d1_gcn_localshader_api10_access_family_census_2026-09-18.json --captures tests/fixtures/d1_localshader_api10_capture_gate_negative_semantic_v1.json --out /tmp/d1_api10_capture_gate_semantic.json; then exit 1; fi
      - name: Require unbound primary capture to fail closed
        run: |
          if python3 tools/d1_localshader_api10_capture_gate_v1.py --frozen evidence/d1_gcn_localshader_api10_access_family_census_2026-09-18.json --captures tests/fixtures/d1_localshader_api10_capture_gate_fake_primary_v1.json --out /tmp/d1_api10_capture_gate_fake_primary.json; then
            echo 'ERROR: primary capture was accepted without exact frozen program membership' >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: d1-localshader-api10-capture-gate-v1
          path: |
            /tmp/d1_api10_capture_gate.json
            /tmp/d1_api10_capture_gate_incomplete.json
