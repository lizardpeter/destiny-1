name: D1 LocalShader API10 capture gate v1
on:
  workflow_dispatch:
  push:
    branches: [d1-crota-source-semantics-v1]
    paths:
      - 'tools/d1_localshader_api10_capture_gate_v1.py'
      - 'tools/d1_gcn_localshader_api10_access_family_census_v1.py'
      - 'tests/fixtures/d1_localshader_api10_capture_gate_complete_v1.json'
      - 'tests/fixtures/d1_localshader_api10_capture_gate_incomplete_v1.json'
      - 'tests/fixtures/d1_localshader_api10_capture_gate_negative_semantic_v1.json'
      - 'tests/fixtures/d1_localshader_api10_capture_gate_fake_primary_v1.json'
      - '.github/workflows/d1-localshader-api10-capture-gate-v1.yml'
permissions:
  actions: read
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact program membership from frozen upstream evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10172731401/zip > usage.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10529319011/zip > materials.zip
          gh api repos/${{ github.repository }}/actions/artifacts/10539900120/zip > prior-membership.zip
          unzip -q usage.zip -d usage
          unzip -q materials.zip -d materials
          unzip -q prior-membership.zip -d prior-membership
          mkdir -p membership
          sha256sum usage/D1_GCN_LOCALSHADER_TBUFFER_USAGE_BINDING_V1.json materials/D1_GCN_LOCALSHADER_API10_MATERIAL_CHAIN_V1.json
          python3 tools/d1_gcn_localshader_api10_access_family_census_v1.py \
            --usage usage/D1_GCN_LOCALSHADER_TBUFFER_USAGE_BINDING_V1.json \
            --materials materials/D1_GCN_LOCALSHADER_API10_MATERIAL_CHAIN_V1.json \
            --out membership/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json
          cmp membership/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json prior-membership/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json
          sha256sum membership/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json prior-membership/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json
          python3 - <<'PY'
          import json
          d=json.load(open('membership/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json'))
          assert d['schema']=='d1_gcn_localshader_api10_access_family_census/v2',d
          assert d['status']=='D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_EXACT',d
          assert d['coverage']['program_count']==39,d
          assert d['coverage']['wrapper_count']==56,d
          assert d['coverage']['material_occurrence_count']==3386,d
          assert len(d['programs'])==39,d
          assert len({p['gcn_sha256'] for p in d['programs']})==39,d
          PY
      - name: Validate frozen family contract with non-semantic fixture
        run: |
          python3 tools/d1_localshader_api10_capture_gate_v1.py --frozen membership/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json --captures tests/fixtures/d1_localshader_api10_capture_gate_complete_v1.json --out /tmp/d1_api10_capture_gate.json
      - name: Require incomplete family coverage to fail closed
        run: |
          if python3 tools/d1_localshader_api10_capture_gate_v1.py --frozen membership/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json --captures tests/fixtures/d1_localshader_api10_capture_gate_incomplete_v1.json --out /tmp/d1_api10_capture_gate_incomplete.json; then exit 1; fi
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/d1_api10_capture_gate_incomplete.json'));assert p['status']=='D1_LOCALSHADER_API10_CAPTURE_COVERAGE_INCOMPLETE';assert len(p['missing_families'])==5
          PY
      - name: Require unproven engine semantic to fail closed
        run: |
          if python3 tools/d1_localshader_api10_capture_gate_v1.py --frozen membership/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json --captures tests/fixtures/d1_localshader_api10_capture_gate_negative_semantic_v1.json --out /tmp/d1_api10_capture_gate_semantic.json; then exit 1; fi
      - name: Require unknown primary program to fail closed against exact membership
        run: |
          if python3 tools/d1_localshader_api10_capture_gate_v1.py --frozen membership/D1_GCN_LOCALSHADER_API10_ACCESS_FAMILY_CENSUS_V1.json --captures tests/fixtures/d1_localshader_api10_capture_gate_fake_primary_v1.json --out /tmp/d1_api10_capture_gate_fake_primary.json; then
            echo 'ERROR: unknown primary program was accepted against exact membership' >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: d1-localshader-api10-capture-gate-v1
          path: /tmp/d1_api10_capture_gate.json
          if-no-files-found: error
