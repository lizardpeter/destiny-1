name: Temporary recover 011c small texture from globals 0154

on:
  push:
    paths:
      - '.github/workflows/tmp-011c-texture-0154.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover verified runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports textures
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover ps4_globals_0154 siblings
        run: |
          set -euo pipefail
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --start-offset 0x44EE5D200 \
            --target ps4_globals_0154_0.pkg --target ps4_globals_0154_1.pkg --target ps4_globals_0154_2.pkg \
            --target ps4_globals_0154_3.pkg --target ps4_globals_0154_4.pkg --target ps4_globals_0154_5.pkg \
            --out recovered --manifest reports/0154_extract.json --retries 6 --timeout 90
      - name: Inspect target and export texture
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_entry_extract.py recovered/ps4_globals_0154_5.pkg --runtime runtime --tag-hash 80AA9D4D -o reports/80AA9D4D_entry.json
          cat reports/80AA9D4D_entry.json
          # _0.._5 are physical siblings of one logical package.  The final
          # snapshot's block patch_id resolves bytes through sibling paths.
          python tools/d1_texture_export.py recovered/ps4_globals_0154_5.pkg --runtime runtime \
            --tag-hash 80AA9D4D --out textures/80AA9D4D
          cat textures/80AA9D4D/texture_manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-011c-texture-0154
          path: |
            reports/
            textures/
          retention-days: 3
          if-no-files-found: error
