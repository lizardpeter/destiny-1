name: Build complete textured Gjallarhorn arrangement 1229 GLB

on:
  push:
    paths:
      - '.github/workflows/build-gjallarhorn-1229-textured-glb.yml'
      - 'tools/d1_gjallarhorn_1229_glb.py'
      - 'tools/d1_gjallarhorn_1229_glb_validated.py'
      - 'tools/d1_gjallarhorn_1229_compose_plates.py'
      - 'tools/d1_gjallarhorn_1229_apply_textures.py'
      - 'tools/d1_texture_export.py'
      - 'tools/d1_texture_export_generation_safe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies and verified Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy pygltflib pillow texture2ddecoder
          mkdir -p runtime recovered models textures/011e textures/0100 plates out reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover exact geometry and texture package families
        run: |
          set -euo pipefail
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x43779C800 \
            --target ps4_gear_weapons_011c_0.pkg --target ps4_gear_weapons_011c_1.pkg --target ps4_gear_weapons_011c_2.pkg --target ps4_gear_weapons_011c_3.pkg --target ps4_gear_weapons_011c_5.pkg \
            --target ps4_gear_weapons_011e_0.pkg --target ps4_gear_weapons_011e_1.pkg --target ps4_gear_weapons_011e_2.pkg --target ps4_gear_weapons_011e_3.pkg --target ps4_gear_weapons_011e_5.pkg \
            --out recovered --manifest reports/011c_011e_extract.json --retries 6 --timeout 90
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x59B629600 \
            --target ps4_investment_assets_0139_0.pkg --target ps4_investment_assets_0139_1.pkg --target ps4_investment_assets_0139_2.pkg --target ps4_investment_assets_0139_3.pkg --target ps4_investment_assets_0139_5.pkg \
            --out recovered --manifest reports/0139_extract.json --retries 6 --timeout 90
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x3FEBBBE00 \
            --target ps4_gear_player_0100_0.pkg --target ps4_gear_player_0100_1.pkg --target ps4_gear_player_0100_2.pkg --target ps4_gear_player_0100_5.pkg \
            --target ps4_gear_player_0101_0.pkg --target ps4_gear_player_0101_1.pkg --target ps4_gear_player_0101_2.pkg --target ps4_gear_player_0101_5.pkg \
            --out recovered --manifest reports/0100_0101_extract.json --retries 6 --timeout 90
      - name: Recover all six exact selected model headers
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader
          from d1_entity_model_probe import parse_model
          from d1_remote_investment_parent_probe import RemoteLogicalPackage,parse_member
          from d1_split_tar_extract import SplitHttpTar
          wanted=['80A72202','80A7317B','80A73256','80A73BAB','80A73D13']
          found={}; attempts=[]
          snaps=sorted(Path('recovered').glob('ps4_investment_assets_0139_*.pkg'),reverse=True)
          for tag in wanted:
            for p in snaps:
              rec={'tag':tag,'snapshot':p.name}
              try:
                r=EntryReader(p,Path('runtime')); by={e['tag_hash'].upper():e for e in r.entries}; e=by.get(tag)
                rec['present']=bool(e)
                if not e: attempts.append(rec); continue
                b=r.entry(e['index']); m=parse_model(b,'PS4'); Path('models',f'{tag}.bin').write_bytes(b)
                rec.update({'success':True,'sha256':hashlib.sha256(b).hexdigest(),'mesh_count':m['mesh_count']}); found[tag]=rec; attempts.append(rec); break
              except Exception as ex: rec['error']=repr(ex); attempts.append(rec)
            if tag not in found: raise SystemExit(f'could not recover selected model {tag}')
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=90)
          specs=[
            'ps4_investment_assets_013a_0.pkg:0x59C453A00:95760384','ps4_investment_assets_013a_1.pkg:0x5A1FA6C00:15149056',
            'ps4_investment_assets_013a_2.pkg:0x5A2E19600:7192576','ps4_investment_assets_013a_3.pkg:0x5A34F5800:165888',
            'ps4_investment_assets_013a_4.pkg:0x5A351E200:161792','ps4_investment_assets_013a_5.pkg:0x5A3545C00:165888']
          ms=[parse_member(x) for x in specs]; rr=RemoteLogicalPackage(arc,{m.patch_id:m for m in ms},Path('runtime'))
          tag='80A743A6'; e=rr.entries[934]; assert e['tag_hash'].upper()==tag
          b=rr.entry(934); m=parse_model(b,'PS4'); Path('models',f'{tag}.bin').write_bytes(b)
          found[tag]={'tag':tag,'source':'remote 013a final logical view','sha256':hashlib.sha256(b).hexdigest(),'mesh_count':m['mesh_count']}
          assert sum(x['mesh_count'] for x in found.values())==8
          Path('reports/model_recovery.json').write_text(json.dumps({'found':found,'attempts':attempts},indent=2)+'\n')
          PY
      - name: Build exact six-model geometry
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_gjallarhorn_1229_glb_validated.py \
            --pkg-011c recovered/ps4_gear_weapons_011c_5.pkg --pkg-011e recovered/ps4_gear_weapons_011e_5.pkg \
            --pkg-0139 recovered/ps4_investment_assets_0139_5.pkg --runtime runtime --model-dir models \
            --out out/GJALLARHORN_YEAR3_ARRANGEMENT_1229_GEOMETRY.glb --report reports/gjallarhorn_1229_geometry.json
      - name: Export all 24 exact source textures
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_texture_export_generation_safe.py \
            --snapshot recovered/ps4_gear_weapons_011e_5.pkg --snapshot recovered/ps4_gear_weapons_011e_3.pkg --snapshot recovered/ps4_gear_weapons_011e_2.pkg --snapshot recovered/ps4_gear_weapons_011e_1.pkg --snapshot recovered/ps4_gear_weapons_011e_0.pkg \
            --runtime runtime \
            --tag-hash 80A3DB32 --tag-hash 80A3DB33 --tag-hash 80A3DB34 --tag-hash 80A3DB35 --tag-hash 80A3DB36 --tag-hash 80A3DB37 \
            --tag-hash 80A3DB41 --tag-hash 80A3DB42 --tag-hash 80A3DB43 --tag-hash 80A3DB4D --tag-hash 80A3DB4E --tag-hash 80A3DB4F \
            --tag-hash 80A3DB61 --tag-hash 80A3DB62 --tag-hash 80A3DB63 --tag-hash 80A3DB73 --tag-hash 80A3DB74 --tag-hash 80A3DB75 --tag-hash 80A3DB76 --tag-hash 80A3DB77 --tag-hash 80A3DB78 \
            --tag-hash 80A3DB53 --tag-hash 80A3D8F6 --out textures/011e
          python tools/d1_texture_export.py recovered/ps4_gear_player_0100_5.pkg --runtime runtime \
            --dependency-pkg recovered/ps4_gear_player_0101_5.pkg --tag-hash 80A019BE --out textures/0100
      - name: Compose 18 plates and apply portable exact albedo normal layer
        run: |
          set -euo pipefail
          python tools/d1_gjallarhorn_1229_compose_plates.py --texture-dir textures/011e --texture-dir textures/0100 \
            --out plates --report reports/gjallarhorn_1229_composed_plates.json
          python tools/d1_gjallarhorn_1229_apply_textures.py out/GJALLARHORN_YEAR3_ARRANGEMENT_1229_GEOMETRY.glb \
            --plate-dir plates --plate-report reports/gjallarhorn_1229_composed_plates.json \
            --out out/GJALLARHORN_YEAR3_ARRANGEMENT_1229_TEXTURED.glb --report reports/gjallarhorn_1229_textured.json
          sha256sum out/GJALLARHORN_YEAR3_ARRANGEMENT_1229_TEXTURED.glb | tee reports/textured_glb_sha256.txt
      - name: Validate textured GLB
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from pygltflib import GLTF2
          p=Path('out/GJALLARHORN_YEAR3_ARRANGEMENT_1229_TEXTURED.glb'); g=GLTF2().load_binary(str(p))
          geo=json.loads(Path('reports/gjallarhorn_1229_geometry.json').read_text())
          tex=json.loads(Path('reports/gjallarhorn_1229_textured.json').read_text())
          plates=json.loads(Path('reports/gjallarhorn_1229_composed_plates.json').read_text())
          assert len(g.meshes)==8 and geo['total_lod1_triangles']==10738
          assert tex['model_count']==6 and tex['mesh_count']==8
          assert plates['plate_image_count']==18 and len(g.images)==18 and len(g.textures)==12
          assert g.extras['d1GjallarhornPortableTextureLayer']['geometryChanged'] is False
          assert g.extras['d1GjallarhornPortableTextureLayer']['albedoAndNormalConnected'] is True
          print(json.dumps({'bytes':p.stat().st_size,'meshes':len(g.meshes),'triangles':geo['total_lod1_triangles'],'materials':len(g.materials),'images':len(g.images),'textures':len(g.textures)},indent=2))
          PY
      - name: Bundle complete textured fixture
        run: |
          set -euo pipefail
          cp reports/gjallarhorn_1229_geometry.json reports/gjallarhorn_1229_composed_plates.json reports/gjallarhorn_1229_textured.json reports/textured_glb_sha256.txt out/
          cp plates/plate_sha256.txt out/ || true
          cat > out/README_TEXTURED.txt <<'EOF'
          Destiny 1 Rise of Iron - Gjallarhorn Year 3 arrangement 1229

          GJALLARHORN_YEAR3_ARRANGEMENT_1229_TEXTURED.glb contains the complete six-model,
          eight-mesh, 10,738-triangle retail LOD1 geometry plus each model's exact recovered
          albedo and normal TexturePlate images. 18 plate images are embedded total; six GStack
          plates are retained as exact native provenance but deliberately not remapped to generic
          glTF metallic/roughness because those Destiny deferred-renderer semantics remain separate.

          The geometry is unchanged from the validated arrangement-1229 proof. No mirroring,
          geometry synthesis, guessed UV transforms, texture resampling or gear-dye color synthesis
          is used. The portable PBR roughness/metallic constants are presentation choices only.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: D1-Gjallarhorn-Year3-arrangement-1229-TEXTURED
          path: out/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
