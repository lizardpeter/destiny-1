name: Probe same-owner private repository access

on:
  push:
    branches:
      - falkordb-secure-build-20261009
    paths:
      - '.github/workflows/falkordb-private-access-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Check built-in GitHub token access to private repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          gh api repos/lizardpeter/custom-falkor-db --jq '.private' 2>&1 | ForEach-Object { Write-Host $_ }
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            Write-Host "PRIVATE_REPO_ACCESS_SUCCEEDED"
          } else {
            Write-Host "PRIVATE_REPO_ACCESS_DENIED"
            exit 1
          }
