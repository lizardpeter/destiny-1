name: Temporary trace resolved 09A owner backlinks

on:
  push:
    paths:
      - '.github/workflows/tmp-recover-0767-patches.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified Oodle runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover only 0767 family
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' \
            --part-count 10 \
            --target ps4_arch_vex_com01_0767_0.pkg \
            --target ps4_arch_vex_com01_0767_1.pkg \
            --target ps4_arch_vex_com01_0767_4.pkg \
            --out recovered --manifest reports/0767_split_tar_manifest.json
      - name: Scan parent backlinks and local graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,struct,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader
          r=EntryReader(Path('recovered/ps4_arch_vex_com01_0767_4.pkg'),Path('runtime'))
          by_int={int(e['tag_hash'],16):e for e in r.entries}
          target=0x816CE12B; pat=struct.pack('<I',target)
          backlinks=[]
          for e in r.entries:
            if e['type']!=16 or not r.available(e['index']):continue
            try:b=r.entry(e['index'])
            except Exception as ex:continue
            offsets=[];start=0
            while True:
              j=b.find(pat,start)
              if j<0:break
              offsets.append(j);start=j+1
            if offsets:
              refs=[]
              for o in range(0,len(b)-3,4):
                v=struct.unpack_from('<I',b,o)[0]
                t=by_int.get(v)
                if t:refs.append({'offset':o,'tag_hash':t['tag_hash'],'entry_index':t['index'],'reference':t['reference'],'type':t['type'],'subtype':t['subtype']})
              backlinks.append({'entry_index':e['index'],'tag_hash':e['tag_hash'],'reference':e['reference'],'size':e['file_size'],'target_offsets':offsets,'local_taghash_refs':refs})
          owner=next(e for e in r.entries if e['tag_hash']=='816CE12B')
          ob=r.entry(owner['index'])
          owner_refs=[]
          for o in range(0,len(ob)-3,4):
            v=struct.unpack_from('<I',ob,o)[0]
            t=by_int.get(v)
            if t:owner_refs.append({'offset':o,'tag_hash':t['tag_hash'],'entry_index':t['index'],'reference':t['reference'],'type':t['type'],'subtype':t['subtype']})
          rep={'package':str(r.pkg),'entry_count':len(r.entries),'target_parent':'816CE12B','backlinks':backlinks,
               'owner':{'entry_index':owner['index'],'reference':owner['reference'],'size':owner['file_size'],'local_taghash_refs':owner_refs}}
          Path('reports/816CE12B_backlinks.json').write_text(json.dumps(rep,indent=2)+'\n')
          print(json.dumps(rep,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 09A-owner-backlinks
          path: reports/
          retention-days: 1
