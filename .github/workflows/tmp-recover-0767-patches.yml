name: Temporary 09A shared sampler and texture recovery

on:
  push:
    paths:
      - '.github/workflows/tmp-recover-0767-patches.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified Oodle runtime and image decoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports exported sampler_dump
          python -m pip install --quiet pillow
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Discover exact 0156 family in split TAR
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          echo '===== 0156 manifest names ====='
          grep -oE 'ps4_globals_0156_[0-9]+\.pkg' reports/packages.txt | sort -u | tee reports/0156_names.txt
          test -s reports/0156_names.txt
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar,tar_header_checksum_ok,tar_name,parse_tar_number,BLOCK
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          arc=SplitHttpTar([f'{base}/packages.tar.{i:03d}' for i in range(1,11)],retries=3,timeout=60)
          wanted=set(Path('reports/0156_names.txt').read_text().split())
          before=0x46AF91400
          chunk=8<<20; max_back=768<<20; found={}; scanned=0; end=before
          while end>0 and scanned<max_back and set(found)!=wanted:
              start=max(0,end-chunk); start=(start//BLOCK)*BLOCK
              data=arc.read_at(start,end-start)
              for rel in range(0,len(data)-BLOCK+1,BLOCK):
                  h=data[rel:rel+BLOCK]
                  if h[257:262]!=b'ustar' or not tar_header_checksum_ok(h): continue
                  name=tar_name(h); bn=name.rsplit('/',1)[-1]
                  if bn in wanted:
                      off=start+rel
                      found[bn]={'archive_name':name,'header_offset':off,'data_offset':off+BLOCK,'size':parse_tar_number(h[124:136])}
                      print('FOUND',bn,hex(off),found[bn]['size'],flush=True)
              scanned += end-start; end=start
          rep={'before_offset':before,'bytes_scanned_backwards':scanned,'wanted':sorted(wanted),'found':found}
          Path('reports/0156_reverse_scan.json').write_text(json.dumps(rep,indent=2)+'\n')
          print(json.dumps(rep,indent=2))
          missing=wanted-set(found)
          if missing: raise SystemExit(f'missing 0156 TAR members: {sorted(missing)}')
          Path('reports/0156_start.txt').write_text(hex(min(x['header_offset'] for x in found.values()))+'\n')
          PY
      - name: Recover exact 0156 family
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while read -r x; do args+=(--target "$x"); done < reports/0156_names.txt
          python tools/d1_split_tar_extract.py --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --start-offset "$(cat reports/0156_start.txt)" "${args[@]}" \
            --out recovered --manifest reports/0156_extract.json
      - name: Recover exact 0157 family
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_split_tar_extract.py --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --start-offset 0x46AF91400 \
            --target ps4_globals_0157_0.pkg --target ps4_globals_0157_1.pkg \
            --out recovered --manifest reports/0157_extract.json
      - name: Recover exact 0767 family
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_split_tar_extract.py --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --start-offset 0x105C6E000 \
            --target ps4_arch_vex_com01_0767_0.pkg --target ps4_arch_vex_com01_0767_1.pkg --target ps4_arch_vex_com01_0767_4.pkg \
            --out recovered --manifest reports/0767_extract.json
      - name: Select highest 0156 package view
        shell: bash
        run: |
          set -euo pipefail
          highest="$(ls recovered/ps4_globals_0156_*.pkg | sort -V | tail -1)"
          echo "$highest" | tee reports/0156_highest.txt
      - name: Decode PS4 sampler resources and referenced payloads
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_entry_extract.py recovered/ps4_globals_0157_1.pkg --runtime runtime \
            --tag-hash 80AAE176 --tag-hash 80AAE177 --dump-dir sampler_dump \
            -o reports/sampler_headers.json
          cat reports/sampler_headers.json
          python - <<'PY'
          import hashlib,json,struct,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader,decode_known
          r=EntryReader(Path('recovered/ps4_globals_0157_1.pkg'),Path('runtime'))
          by={e['tag_hash'].upper():e for e in r.entries}
          out=[]
          for h in ('80AAE176','80AAE177'):
              e=by[h]; b=r.entry(e['index']); row={'tag_hash':h,'entry':e,'decoded':decode_known(e,b,r.h['platform']),'raw_hex':b.hex()}
              ref=e['reference'].upper(); re=by.get(ref)
              if re:
                  rb=r.entry(re['index']) if r.available(re['index']) else None
                  row['reference_entry']=re
                  if rb is not None:
                      row['reference_raw_hex']=rb.hex(); row['reference_sha256']=hashlib.sha256(rb).hexdigest(); row['reference_decoded']=decode_known(re,rb,r.h['platform'])
                      Path(f'sampler_dump/{ref}_{re["index"]:04d}_{re["type"]}_{re["subtype"]}.bin').write_bytes(rb)
              out.append(row)
          Path('reports/sampler_chain.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Decode circuitry material binding records
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_material_decode.py recovered/ps4_arch_vex_com01_0767_4.pkg --runtime runtime \
            --tag-hash 816CE240 --tag-hash 816CE241 --tag-hash 816CE242 --tag-hash 816CE243 --tag-hash 816CE244 --tag-hash 816CE1A7 \
            -o reports/circuitry_materials.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/circuitry_materials.json').read_text())
          for m in d['materials']:
              if m.get('available'):
                  print(m['tag_hash'],'textures=',[(x['texture_index'],x['texture']) for x in m['ps_textures']['items']],
                        'tfx=',m['ps_tfx_bytecode']['bytes_hex'],
                        'samplers=',[x['dwords_hex'] for x in m['ps_samplers']['items']])
          PY
      - name: Export exact retail main and circuitry textures
        shell: bash
        run: |
          set -euo pipefail
          HIGHEST_0156="$(cat reports/0156_highest.txt)"
          python tools/d1_texture_export.py "$HIGHEST_0156" --runtime runtime \
            --dependency-pkg recovered/ps4_globals_0157_1.pkg \
            --dependency-pkg recovered/ps4_arch_vex_com01_0767_4.pkg \
            --tag-hash 80AACCDD --tag-hash 80AACCDF --tag-hash 80AACC26 --tag-hash 80AACC28 --tag-hash 816CE1C5 \
            --out exported
          cat exported/texture_manifest.json
          find exported -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > reports/exported_sha256.txt
          cat reports/exported_sha256.txt
      - name: Validate PNG dimensions and image statistics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageStat
          import json
          rows=[]
          for p in sorted(Path('exported').glob('*.png')):
              im=Image.open(p); im.load(); st=ImageStat.Stat(im)
              row={'file':p.name,'mode':im.mode,'size':list(im.size),'mean':st.mean,'extrema':im.getextrema()}
              rows.append(row); print(json.dumps(row))
          Path('reports/png_stats.json').write_text(json.dumps(rows,indent=2)+'\n')
          if not rows: raise SystemExit('no PNGs exported')
          PY
      - name: Upload evidence and exported images
        uses: actions/upload-artifact@v4
        with:
          name: 09A-shared-samplers-retail-textures
          path: |
            reports/
            exported/
            sampler_dump/
          retention-days: 1
          if-no-files-found: error
