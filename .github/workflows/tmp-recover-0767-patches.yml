name: Temporary 09A main material resolution

on:
  push:
    paths:
      - '.github/workflows/tmp-recover-0767-patches.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified Oodle runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover exact 00E2 family
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_split_tar_extract.py --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --start-offset 0xFA2D5000 \
            --target ps4_arch_vex_00e2_0.pkg --target ps4_arch_vex_00e2_1.pkg --target ps4_arch_vex_00e2_2.pkg --target ps4_arch_vex_00e2_4.pkg \
            --out recovered --manifest reports/00e2_extract.json
      - name: Decode main material family from highest namespace
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_material_decode.py recovered/ps4_arch_vex_00e2_4.pkg --runtime runtime \
            --tag-hash 809C475F --tag-hash 809C4760 \
            -o reports/main_materials_patch4.json
          cat reports/main_materials_patch4.json
      - name: Decode main material family from base namespace
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_material_decode.py recovered/ps4_arch_vex_00e2_0.pkg --runtime runtime \
            --tag-hash 809C475F --tag-hash 809C4760 \
            -o reports/main_materials_patch0.json
          cat reports/main_materials_patch0.json
      - name: Summarize exact bindings and state records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          docs=[]
          for fn in ('reports/main_materials_patch4.json','reports/main_materials_patch0.json'):
              d=json.loads(Path(fn).read_text())
              for m in d['materials']:
                  if not m.get('available'): continue
                  docs.append({
                    'source':fn,
                    'material':m['tag_hash'],
                    'pixel_shader':m['pixel_shader'],
                    'ps_vector4_container':m['ps_vector4_container'],
                    'textures':[(x['texture_index'],x['texture']) for x in m['ps_textures']['items']],
                    'tfx':m['ps_tfx_bytecode']['bytes_hex'],
                    'samplers':[x['dwords_hex'] for x in m['ps_samplers']['items']],
                  })
          # De-duplicate identical source views of the same logical material.
          for x in docs:
              print(json.dumps(x,sort_keys=True))
          Path('reports/main_binding_summary.json').write_text(json.dumps(docs,indent=2)+'\n')
          PY
      - name: Compare material bytes outside dynamic payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys,json,struct
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader
          r=EntryReader(Path('recovered/ps4_arch_vex_00e2_4.pkg'),Path('runtime'))
          by={e['tag_hash'].upper():e for e in r.entries}
          blobs={}
          for h in ('809C475F','809C4760'):
              e=by[h]; blobs[h]=r.entry(e['index'])
          a,b=blobs['809C475F'],blobs['809C4760']
          diffs=[]
          n=min(len(a),len(b))
          for o in range(0,n,4):
              aa=a[o:o+4]; bb=b[o:o+4]
              if aa!=bb:
                  diffs.append({'offset':o,'a_hex':aa.hex(),'b_hex':bb.hex()})
          Path('reports/main_material_dword_diff.json').write_text(json.dumps(diffs,indent=2)+'\n')
          print('dword differences',len(diffs))
          for x in diffs: print(f"{x['offset']:#06x} {x['a_hex']} -> {x['b_hex']}")
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: 09A-main-material-resolution
          path: reports/
          retention-days: 1
          if-no-files-found: error
