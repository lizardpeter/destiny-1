name: Temporary 09A PS4 GCN disassembly

on:
  push:
    paths:
      - '.github/workflows/tmp-recover-0767-patches.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM AMDGPU disassembler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-18
          LLVM_MC=/usr/lib/llvm-18/bin/llvm-mc
          "$LLVM_MC" --version
          "$LLVM_MC" --triple=amdgcn-amd-amdhsa --mcpu=help </dev/null > reports_mcpu.txt 2>&1 || true
          grep -E 'gfx70[0-9]|bonaire|hawaii|kaveri' reports_mcpu.txt || true
      - name: Recover verified Oodle runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports shader
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover 0157 shader family
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_split_tar_extract.py --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --start-offset 0x46AF91400 \
            --target ps4_globals_0157_0.pkg --target ps4_globals_0157_1.pkg \
            --out recovered --manifest reports/0157_extract.json
      - name: Recover 0767 shader family
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_split_tar_extract.py --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --start-offset 0x105C6E000 \
            --target ps4_arch_vex_com01_0767_0.pkg --target ps4_arch_vex_com01_0767_1.pkg --target ps4_arch_vex_com01_0767_4.pkg \
            --out recovered --manifest reports/0767_extract.json
      - name: Recover exact OrbShdr-bounded shader code
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_ps4_shader_binary_probe.py recovered/ps4_globals_0157_1.pkg --runtime runtime \
            --tag-hash 80AAE14B --dump-dir shader -o reports/80AAE14B_orbshdr.json
          python tools/d1_ps4_shader_binary_probe.py recovered/ps4_arch_vex_com01_0767_4.pkg --runtime runtime \
            --tag-hash 816CE0A8 --dump-dir shader -o reports/816CE0A8_orbshdr.json
      - name: LLVM disassemble GCN 1.1 candidates
        shell: bash
        run: |
          set -euo pipefail
          LLVM_MC=/usr/lib/llvm-18/bin/llvm-mc
          for tag in 80AAE14B 816CE0A8; do
            xxd -p -c 1000000 "shader/${tag}_gcn_code.bin" | tr -d '\n' > "shader/${tag}.hex"
            for cpu in gfx700 gfx701 gfx702 gfx704; do
              "$LLVM_MC" --disassemble --hex --triple=amdgcn-amd-amdhsa --mcpu="$cpu" \
                "shader/${tag}.hex" > "reports/${tag}_${cpu}.s" 2> "reports/${tag}_${cpu}.err" || true
              printf '%s %s asm_lines=%s err_lines=%s\n' "$tag" "$cpu" \
                "$(wc -l < "reports/${tag}_${cpu}.s")" "$(wc -l < "reports/${tag}_${cpu}.err")"
            done
          done
      - name: Summarize decoded shader instructions
        shell: bash
        run: |
          set -euo pipefail
          for f in reports/*_gfx70*.s; do
            echo "===== $f ====="
            grep -En 'image_|buffer_|sample|load|exp |v_dot|v_mul|v_add|v_mad|v_fma|v_cvt|v_rcp|v_sqrt|v_max|v_min|s_endpgm' "$f" || true
          done
          echo '===== decoder errors ====='
          for f in reports/*_gfx70*.err; do echo "--- $f"; cat "$f"; done
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: 09A-ps4-gcn-disassembly
          path: |
            reports/
            shader/*.hex
            shader/*_gcn_code.bin
            reports_mcpu.txt
          retention-days: 1
          if-no-files-found: error
