name: D1 investment 013F block boundary

on:
  push:
    paths:
      - '.github/workflows/d1-investment-013f-block-boundary.yml'
      - 'tools/d1_remote_block_boundary_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover verified Oodle 3 runtime
        run: |
          set -euo pipefail
          mkdir -p runtime out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Test recorded and physically justified compressed boundaries
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_block_boundary_probe.py \
            --tag-hash 80A7FA34 --tag-hash 80A7FB3B \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/013f_block_boundary.json
      - name: Require known-good control remains decodable
        run: |
          python - <<'PY'
          import json
          d=json.load(open('out/013f_block_boundary.json'))
          by={x['tag_hash']:x for x in d['entries']}
          good=by['80A7FA34'];bad=by['80A7FB3B']
          gs=[x for s in good['snapshots'] for x in s.get('decode_attempts',[]) if x.get('success')]
          assert gs,'known-good block lost all successful official Oodle decodes'
          bs=[x for s in bad['snapshots'] for x in s.get('decode_attempts',[]) if x.get('success')]
          print('GOOD_SUCCESS_COUNT',len(gs))
          print('BAD_SUCCESS_COUNT',len(bs))
          for s in bad['snapshots']:
              if s['snapshot_patch_id'] in (1,5):
                  print('BAD_SNAPSHOT',s['snapshot_patch_id'],'size',s['recorded_size'],'gap',s['gap_to_next_block'],
                        'next',s['next_physical_block'],'comp',s['compressed_input_candidates'],'raw',s['raw_length_candidates'])
          if bs:
              print('BAD_BLOCK_BOUNDARY_RECOVERY',bs)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-investment-013f-block-boundary
          path: out/
          retention-days: 14
