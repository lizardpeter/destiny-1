name: D1 Tower Xur Blender basis fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-xur-blender-basis-fix.yml'
      - 'tools/d1_gltf_fix_standalone_articulated_basis.py'
      - 'tools/d1_gltf_articulated_basis_alignment_probe.py'
      - 'tools/d1_gltf_standalone_basis_preservation_probe.py'
      - 'tools/d1_gltf_skin_bind_identity_probe.py'
      - 'tools/d1_gltf_layer_merge.py'

permissions:
  contents: read
  actions: read

env:
  XUR_ARTIFACT_ID: '10003829268'
  XUR_ARTIFACT_ZIP_SHA256: '9c021b18384955c1b0070ee78429c8565408e94f10bc884f47c120e5e837cbd5'
  XUR_INPUT_SHA256: '77730e3d19ed4c55e35a5353be05e0d1bb1e5bf7a9a65fececd165f2de77d642'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover pinned exact Xur all-actions checkpoint
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q numpy scipy
          mkdir -p input out/reports
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${XUR_ARTIFACT_ID}/zip" -o input/xur.zip
          echo "${XUR_ARTIFACT_ZIP_SHA256}  input/xur.zip" | sha256sum --check --strict
          unzip -q input/xur.zip -d input/artifact
          xur="$(find input/artifact -type f -name 'D1_TOWER_XUR_80C88CEF_EXACT_TEXTURED_ALL_ACTIONS.glb' -print -quit)"
          test -n "$xur" -a -f "$xur"
          echo "${XUR_INPUT_SHA256}  ${xur}" | sha256sum --check --strict
          cp "$xur" input/XUR_SOURCE.glb

      - name: Source-close original Blender-visible basis mismatch
        run: |
          set -euo pipefail
          python tools/d1_gltf_articulated_basis_alignment_probe.py input/XUR_SOURCE.glb --model 80C88CEF \
            --expect-mesh-axis Z --expect-joint-axis Y --allow-mismatch -o out/reports/XUR_BASIS_BEFORE.json
          python - <<'PY'
          import json
          d=json.load(open('out/reports/XUR_BASIS_BEFORE.json'))
          assert d['status']=='D1_GLTF_ARTICULATED_BASIS_ALIGNMENT_COMPLETE' and not d['dominant_axes_aligned'],d
          assert d['mesh_bounds']['dominant_axis']=='Z' and d['joint_bounds']['dominant_axis']=='Y',d
          assert d['skinned_mesh_node_count']==119 and d['joint_count']==70,d
          print('XUR_PRE_FIX_MISMATCH_SOURCE_CLOSED',d['mesh_bounds']['span'],d['joint_bounds']['span'])
          PY

      - name: Repair parser and glTF basis composition
        run: |
          set -euo pipefail
          python tools/d1_gltf_fix_standalone_articulated_basis.py input/XUR_SOURCE.glb \
            --model 80C88CEF --expect-skeleton 809D80C9 \
            --out out/D1_TOWER_XUR_80C88CEF_BLENDER_BASIS_FIXED.glb --report out/reports/XUR_BASIS_FIX.json
          python - <<'PY'
          import json
          d=json.load(open('out/reports/XUR_BASIS_FIX.json'))
          assert d['status']=='D1_STANDALONE_ARTICULATED_PARSER_AND_GLTF_BASIS_FIXED',d
          assert (d['joint_count'],d['skinned_mesh_node_count'],d['animation_count'])==(70,119,267),d
          assert d['animation_channel_count']==56070 and d['animation_output_accessor_count']==56070,d
          assert d['bin_byte_length_unchanged'] is True,d
          print('XUR_BASIS_FIX_COUNTS_CLOSED',d['output_sha256'])
          PY

      - name: Prove final mesh armature animation basis and bind pose
        run: |
          set -euo pipefail
          fixed=out/D1_TOWER_XUR_80C88CEF_BLENDER_BASIS_FIXED.glb
          python tools/d1_gltf_articulated_basis_alignment_probe.py "$fixed" --model 80C88CEF \
            --expect-mesh-axis Y --expect-joint-axis Y -o out/reports/XUR_BASIS_AFTER.json
          python tools/d1_gltf_skin_bind_identity_probe.py "$fixed" --max-error 0.00002 \
            -o out/reports/XUR_BIND_IDENTITY_AFTER.json
          python - <<'PY'
          import json
          a=json.load(open('out/reports/XUR_BASIS_AFTER.json')); b=json.load(open('out/reports/XUR_BIND_IDENTITY_AFTER.json'))
          assert a['status']=='D1_GLTF_ARTICULATED_BASIS_ALIGNMENT_COMPLETE' and a['dominant_axes_aligned'],a
          assert a['mesh_bounds']['dominant_axis']==a['joint_bounds']['dominant_axis']=='Y',a
          assert b['status']=='D1_GLTF_SKIN_BIND_IDENTITY_COMPLETE' and b['tested_skinned_mesh_nodes']==119,b
          assert b['skin_count']==1 and b['max_observed_error']<=2e-5 and not b['violations'],b
          print('XUR_POST_FIX_ALIGNMENT_CLOSED',a['mesh_bounds']['span'],a['joint_bounds']['span'])
          print('XUR_BIND_IDENTITY_CLOSED',b['max_observed_error'])
          PY

      - name: Prove visual resources and all protected binary domains are unchanged
        run: |
          set -euo pipefail
          python tools/d1_gltf_standalone_basis_preservation_probe.py \
            --source input/XUR_SOURCE.glb --fixed out/D1_TOWER_XUR_80C88CEF_BLENDER_BASIS_FIXED.glb \
            --model 80C88CEF -o out/reports/XUR_BASIS_PRESERVATION.json
          python - <<'PY'
          import json,hashlib,os
          p=json.load(open('out/reports/XUR_BASIS_PRESERVATION.json'))
          assert p['status']=='D1_GLTF_STANDALONE_BASIS_PRESERVATION_COMPLETE',p
          c=p['counts']; expected={'nodes':190,'meshes':119,'materials':54,'textures':135,'images':135,'skins':1,'animations':267,'accessors':57124,'bufferViews':57259}
          assert c==expected,(c,expected)
          assert p['fixed_node_count']==191 and p['mesh_node_count']==119,p
          assert p['mutable_basis_accessor_count']==56071 and p['protected_accessor_count']==1053,p
          assert p['visual_resource_json_unchanged'] and p['embedded_image_bytes_unchanged'] and p['mesh_node_json_unchanged'] and p['bin_byte_length_unchanged'],p
          manifest={'schema':'d1_tower_xur_blender_basis_fix/v1','status':'D1_TOWER_XUR_BLENDER_BASIS_FIXED_AND_PROVEN',
                    'source_sha256':p['source_sha256'],'output_sha256':p['fixed_sha256'],'output_bytes':p['fixed_bytes'],
                    'entity_model':'80C88CEF','skeleton':'809D80C9','skin_count':1,'joint_count':70,'mesh_count':119,
                    'material_count':54,'texture_count':135,'image_count':135,'animation_count':267,'animation_channel_count':56070,
                    'protected_accessor_count':1053,'mutable_basis_accessor_count':56071,
                    'fix':'undo parser [x,y,z]->[y,z,x] on articulated domain; wrap full actor native Z-up -> glTF Y-up',
                    'material_policy':'Basis-only checkpoint: portable PBR material choices remain unchanged and are not promoted as native D1 shading.'}
          json.dump(manifest,open('out/reports/XUR_BLENDER_BASIS_MANIFEST.json','w'),indent=2)
          print('XUR_PROTECTED_DOMAINS_CLOSED',json.dumps(manifest,sort_keys=True))
          PY
          sha256sum out/D1_TOWER_XUR_80C88CEF_BLENDER_BASIS_FIXED.glb out/reports/* > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-TOWER-XUR-BLENDER-BASIS-FIXED
          path: out/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
