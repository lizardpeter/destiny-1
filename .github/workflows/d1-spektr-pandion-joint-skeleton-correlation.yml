name: D1 Spektar Pandion joint to 67-bone skeleton correlation

on:
  push:
    paths:
      - '.github/workflows/d1-spektr-pandion-joint-skeleton-correlation.yml'
      - 'tools/d1_guardian_joint_skeleton_correlation.py'
      - 'tools/d1_remote_model_export.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  correlate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies
        run: python -m pip install -q numpy trimesh
      - name: Recover latest Spektar retail resource report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input runtime recovered out
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=d1-spektr-pandion-titan-masculine&per_page=20" \
            | python -c "import json,sys; a=[x for x in json.load(sys.stdin)['artifacts'] if not x['expired']]; print(a[0]['archive_download_url'])")
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$url" -o input/spektar.zip
          unzip -q input/spektar.zip -d input/spektar
          test -f input/spektar/spektar_pandion_resources.json
      - name: Recover verified Oodle and 00EC skeleton family
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --start-offset 0xAAB580800 \
            --target ps4_race_set_all_00ec_0.pkg --target ps4_race_set_all_00ec_1.pkg \
            --target ps4_race_set_all_00ec_2.pkg --target ps4_race_set_all_00ec_3.pkg \
            --target ps4_race_set_all_00ec_4.pkg --target ps4_race_set_all_00ec_5.pkg \
            --out recovered --manifest out/00ec_extract.json --retries 6 --timeout 90
      - name: Correlate all rigid Spektar vertices against 809D8613
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_guardian_joint_skeleton_correlation.py \
            --report input/spektar/spektar_pandion_resources.json --body-role masculine \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --member-catalog evidence/d1_player_gear_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --skeleton-pkg recovered/ps4_race_set_all_00ec_5.pkg --skeleton 809D8613 \
            -o out/spektar_809D8613_joint_correlation.json
          python - <<'PY'
          import json
          d=json.load(open('out/spektar_809D8613_joint_correlation.json'))
          assert d['selected_model_count']==5,d['selected_model_count']
          helmet=[x for x in d['models'] if (x.get('examples') or [{}])[0].get('name')=='Spektar Pandion Helmet'][0]
          assert 18 in helmet['rigid_joint_indices'],helmet['rigid_joint_indices']
          assert d['candidate_bone_hashes'][18]=='40D6927E',d['candidate_bone_hashes'][18]
          print('HELMET INDEX 18 ->',d['candidate_bone_hashes'][18])
          print('AGGREGATE',d['aggregate_rigid_joint_indices'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-spektr-pandion-67bone-joint-correlation
          path: out/
          retention-days: 14
          if-no-files-found: warn
