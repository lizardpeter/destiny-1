name: D1 Xur paired identity owner closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-paired-identity-owner-closure.yml'
      - 'tools/d1_remote_catalog_backlinks.py'
      - 'tools/d1_remote_entity_resource_classify.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog and runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Trace all fourteen paired identity resources into exact s_entity owners
        run: |
          set -euo pipefail
          python tools/d1_remote_catalog_backlinks.py \
            --scan-package-id 0x0244 \
            --target 80C880B9 --target 80C880BA --target 80C880BD --target 80C880BE \
            --target 80C8821D --target 80C8821E --target 80C88221 --target 80C88222 \
            --target 80C8840E --target 80C8840F --target 80C88412 --target 80C88413 \
            --target 80C885C5 --target 80C885C6 \
            --reference 80800734 --max-entry-size 4000000 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            -o out/PAIRED_IDENTITY_SENTITY_BACKLINKS.json | tee out/backlinks_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/PAIRED_IDENTITY_SENTITY_BACKLINKS.json'))
          assert d['error_count']==0,d
          parents=sorted({r['source_tag_hash'] for r in d['hits']})
          print('SENTITY_PARENTS',parents)
          open('out/parents.txt','w').write('\n'.join(parents)+'\n')
          for r in d['hits']:
              print('OWNER',r['source_tag_hash'],r['targets'])
          PY
      - name: Classify every exact parent s_entity Resource array
        run: |
          set -euo pipefail
          mapfile -t parents < out/parents.txt
          args=()
          for h in "${parents[@]}"; do args+=(--entity "$h"); done
          python tools/d1_remote_entity_resource_classify.py \
            "${args[@]}" \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            -o out/PAIRED_IDENTITY_OWNER_RESOURCE_MATRIX.json | tee out/owners_stdout.txt
          python - <<'PY'
          import json,collections
          d=json.load(open('out/PAIRED_IDENTITY_OWNER_RESOURCE_MATRIX.json'))
          print('OWNER_COUNT',len(d['entities']))
          print('ROLE_COUNTS',d['entity_resource_role_counts'])
          print('STATUS_COUNTS',d['resolution_status_counts'])
          print('VARIABLE_RESOURCE_SLOTS')
          for p in d['position_comparison']:
              if not p['all_equal']: print(p['resource_index'],p['hashes'])
          for e in d['entities']:
              print('ENTITY',e['entity_hash'],'RESOURCE_COUNT',e['resource_count'])
              for r in e['resources']:
                  er=r.get('entity_resource') or {}
                  ent=r.get('entry') or {}
                  print(' ',r['resource_index'],r['resource_hash'],ent.get('reference'),er.get('semantic_role'),(er.get('unk10') or {}).get('class_hash'),(er.get('unk18') or {}).get('class_hash'))
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-XUR-PAIRED-IDENTITY-OWNER-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
