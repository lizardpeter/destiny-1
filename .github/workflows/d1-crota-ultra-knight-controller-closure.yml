name: D1 Crota Dark Lens ultra-Knight controller closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-ultra-knight-controller-closure.yml'
      - 'tools/d1_remote_catalog_entity_resource_probe.py'
      - 'tools/d1_remote_catalog_backlinks.py'
      - 'tools/d1_entity_resource_probe.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Decode all ultra-Knight named EntityResources
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_catalog_entity_resource_probe.py \
            --tag-hash 0x8108E421 --tag-hash 0x8108E2E7 --tag-hash 0x8108E2E0 \
            --tag-hash 0x8108E2D6 --tag-hash 0x8108E2D8 --tag-hash 0x8108E2ED \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_ULTRA_KNIGHT_ENTITY_RESOURCES.json | tee out/resources_stdout.txt
      - name: Trace cluster and exact StringHash owners
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_catalog_backlinks.py \
            --scan-package-id 0x0447 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --target 0x8108E421 --target 0x8108E2E7 --target 0x8108E2E0 \
            --target 0x8108E2D6 --target 0x8108E2D8 --target 0x8108E2ED --target 0x8108E52E \
            --target 0x7D04C786 --target 0x0906F4B3 --target 0xC4E73319 \
            --target 0x46ECB6D1 --target 0xBAE2C2BA --target 0x70DF810D --target 0x7EB45754 \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --max-entry-size 8000000 \
            -o out/CROTA_ULTRA_KNIGHT_ALL_BACKLINKS.json | tee out/backlinks_stdout.txt
      - name: Lock exact known Oversoul name-tag relation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('out/CROTA_ULTRA_KNIGHT_ENTITY_RESOURCES.json'))
          assert not r['violations'],r['violations']
          for x in r['entries']:
              er=x['entity_resource']
              print('RESOURCE',x['tag_hash'],'ROLE',er.get('semantic_role'),'U10',(er.get('unk10') or {}).get('class_hash'),'U18',(er.get('unk18') or {}).get('class_hash'))
              print('  MATCHES',[(hex(m['offset']),m['tag_hash'],m['reference']) for m in x['aligned_resolved_tag_matches']])
          b=json.load(open('out/CROTA_ULTRA_KNIGHT_ALL_BACKLINKS.json'))
          assert b['error_count']==0,b['errors']
          print('BY_TARGET',b['hit_sources_by_target'])
          print('BY_REFERENCE',b['hit_sources_by_reference'])
          for x in b['hits']:print('OWNER',x['source_tag_hash'],'CLASS',x['reference'],'TARGETS',x['targets'])
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-ULTRA-KNIGHT-CONTROLLER-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
