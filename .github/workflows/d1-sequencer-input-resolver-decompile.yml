name: D1 Sequencer Input Resolver Decompile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-sequencer-input-resolver-decompile.yml'
      - 'tools/ghidra/D1ExportFunctionOffsets.py'

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EBOOT_URL: https://r2.houseofkublai.com/destiny/CUSA00219_01.33/eboot.bin
      EBOOT_SHA256: 672f03411c0503dfbcda804cbb9fb27cdd9a8d73a8bcb71bf0c4f688073b0833
      EBOOT_SIZE: '29249016'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Recover exact eboot
        run: |
          set -euo pipefail
          mkdir -p build/d1-sequencer-resolver
          curl --fail --location --retry 4 --retry-delay 2 "$EBOOT_URL" -o build/d1-sequencer-resolver/eboot.bin
          test "$(stat -c %s build/d1-sequencer-resolver/eboot.bin)" = "$EBOOT_SIZE"
          echo "$EBOOT_SHA256  build/d1-sequencer-resolver/eboot.bin" | sha256sum --check --strict

      - name: Download Ghidra
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request
          req=urllib.request.Request(
            'https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest',
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'d1-sequencer-resolver'})
          with urllib.request.urlopen(req) as r: rel=json.load(r)
          assets=[x for x in rel.get('assets',[]) if x.get('name','').endswith('.zip') and 'PUBLIC' in x.get('name','')]
          if not assets: raise SystemExit('no Ghidra PUBLIC zip')
          open('build/d1-sequencer-resolver/ghidra_url.txt','w').write(assets[0]['browser_download_url']+'\n')
          PY
          curl --fail --location --retry 4 "$(cat build/d1-sequencer-resolver/ghidra_url.txt)" -o build/d1-sequencer-resolver/ghidra.zip
          unzip -q build/d1-sequencer-resolver/ghidra.zip -d build/d1-sequencer-resolver/
          GHIDRA_DIR="$(find build/d1-sequencer-resolver -maxdepth 1 -type d -name 'ghidra_*' | head -1)"
          test -n "$GHIDRA_DIR"
          echo "GHIDRA_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"

      - name: Install bundled PyGhidra
        run: |
          python3 -m pip install --disable-pip-version-check --quiet --no-index             --find-links "$GHIDRA_DIR/Ghidra/Features/PyGhidra/pypkg/dist" pyghidra

      - name: Decompile exact resolver cluster
        run: |
          set -euo pipefail
          mkdir -p build/d1-sequencer-resolver/project
          "$GHIDRA_DIR/support/pyghidraRun" --headless             build/d1-sequencer-resolver/project D1SequencerResolver             -import build/d1-sequencer-resolver/eboot.bin             -overwrite -analysisTimeoutPerFile 3600             -scriptPath "$GITHUB_WORKSPACE/tools/ghidra"             -postScript D1ExportFunctionOffsets.py               "$GITHUB_WORKSPACE/build/d1-sequencer-resolver/functions.json"               1               0x111070 0x311390 0x3110E0 0x311270 0x30E1D0 0x30E7A0

      - name: Extract compact exact resolver evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('build/d1-sequencer-resolver/functions.json'))
          requested={0x111070,0x311390,0x3110e0,0x311270,0x30e1d0,0x30e7a0}
          rows=[]
          for f in d.get('functions',[]):
              if f.get('image_offset') not in requested:
                  continue
              rows.append({
                'image_offset':f['image_offset'],
                'image_offset_hex':f"0x{f['image_offset']:X}",
                'name':f['name'],
                'prototype':f.get('prototype'),
                'decompile_completed':f.get('decompilation',{}).get('completed'),
                'c':f.get('decompilation',{}).get('c'),
              })
          out={
            'schema':'d1_sequencer_input_resolver_decompile/v1',
            'status':'EXACT_CUSA00219_0133_RESOLVER_CLUSTER_DECOMPILED',
            'executable_sha256':d['program']['executable_sha256'],
            'functions':rows,
            'proof_boundary':'Function code is exact-build Ghidra decompilation. Semantic names for selector values and source keys remain withheld unless the code/data join closes them.'
          }
          Path('build/d1-sequencer-resolver/resolver_compact.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({
            'status':out['status'],
            'functions':[(x['image_offset_hex'],x['name'],x['decompile_completed']) for x in rows]
          },indent=2))
          PY

      - name: Remove raw binaries
        if: always()
        run: |
          rm -f build/d1-sequencer-resolver/eboot.bin build/d1-sequencer-resolver/ghidra.zip
          rm -rf "$GHIDRA_DIR" build/d1-sequencer-resolver/project

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-sequencer-input-resolver-decompile
          path: |
            build/d1-sequencer-resolver/resolver_compact.json
            build/d1-sequencer-resolver/ghidra_url.txt
          if-no-files-found: warn
          retention-days: 30
