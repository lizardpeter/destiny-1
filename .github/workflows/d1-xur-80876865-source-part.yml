name: D1 Xur 80876865 source part probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-80876865-source-part.yml'
      - 'tools/d1_xur_80876865_source_part_probe.py'

permissions: {contents: read, actions: read}

env:
  GH_TOKEN: '${{ github.token }}'
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {LINOODLE_SKIP_DLLMAIN: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact catalog and runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Decode source mesh-5 part neighborhood
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_xur_80876865_source_part_probe.py
          python tools/d1_xur_80876865_source_part_probe.py             --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json             --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10             --runtime runtime -o out/XUR_80876865_SOURCE_PART_NEIGHBORHOOD.json | tee out/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/XUR_80876865_SOURCE_PART_NEIGHBORHOOD.json'))
          assert d['status']=='D1_XUR_80876865_SOURCE_PART_NEIGHBORHOOD_EXACT',d
          assert d['target_parts']==[93,96],d
          assert d['proof']['calibrated_target_winner_is_80876865'] is True,d
          assert d['proof']['D1_retail_consumer_execution_path_proven'] is False,d
          assert not d['violations'],d
          print('XUR_80876865_SOURCE_PART_GREEN',json.dumps([
            {
              'part':r['part_index'],
              'source_part':r['source_part'],
              'winner':None if r['calibrated_selection'] is None else r['calibrated_selection']['winner_material']
            } for r in d['rows'] if r['is_target_part']
          ],sort_keys=True))
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-XUR-80876865-SOURCE-PART
          path: out/
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
