name: D1 texture export v2 strict chain
on:
  workflow_dispatch:
  push:
    branches: [d1-crota-source-semantics-v1]
    paths:
      - 'tools/d1_texture_export.py'
      - 'tools/d1_texture_export_v2.py'
      - 'tools/d1_texture_backing_chain_v1.py'
      - 'tests/test_d1_texture_export_v2.py'
      - 'tests/test_d1_texture_backing_chain_v1.py'
      - 'tools/d1_world_material_texture_export.py'
      - 'tests/test_d1_world_material_texture_strict_chain.py'
      - 'tests/test_d1_remote_activity_texture_chain_strict.py'
      - 'tools/d1_texture_consumer_policy_audit.py'
      - 'tools/d1_texture_export_generation_safe.py'
      - 'tools/d1_texture_census_tolerant.py'
      - 'tools/d1_remote_texture_export.py'
      - 'tools/d1_remote_texture_export_generation_safe.py'
      - 'tools/d1_remote_activity_material_dependency_closure.py'
      - 'tools/d1_remote_activity_texture_export.py'
      - '.github/workflows/d1-texture-export-v2.yml'
permissions:
  contents: read
jobs:
  strict-chain-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: |
          set -euo pipefail
          python -m py_compile tools/d1_texture_export.py tools/d1_texture_export_v2.py tools/d1_texture_backing_chain_v1.py tools/d1_world_material_texture_export.py tools/d1_texture_consumer_policy_audit.py tools/d1_texture_export_generation_safe.py tools/d1_texture_census_tolerant.py tools/d1_remote_texture_export.py tools/d1_remote_texture_export_generation_safe.py tools/d1_remote_activity_material_dependency_closure.py tools/d1_remote_activity_texture_export.py tests/test_d1_texture_export_v2.py tests/test_d1_texture_backing_chain_v1.py tests/test_d1_world_material_texture_strict_chain.py tests/test_d1_remote_activity_texture_chain_strict.py
          python tests/test_d1_texture_backing_chain_v1.py
          python tests/test_d1_texture_export_v2.py
          python tests/test_d1_world_material_texture_strict_chain.py
          python tests/test_d1_remote_activity_texture_chain_strict.py
          python tools/d1_texture_consumer_policy_audit.py -o texture_consumer_policy.json
