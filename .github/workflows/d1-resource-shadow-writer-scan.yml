name: D1 Resource Shadow Writer Scan

on:
  push:
    paths:
      - '.github/workflows/d1-resource-shadow-writer-scan.yml'
      - 'tools/d1_resource_shadow_writer_scan.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EBOOT_URL: https://r2.houseofkublai.com/destiny/CUSA00219_01.33/eboot.bin
      EBOOT_SHA256: 672f03411c0503dfbcda804cbb9fb27cdd9a8d73a8bcb71bf0c4f688073b0833
      EBOOT_SIZE: '29249016'
      CODEGRAPH_ARTIFACT_ID: '10939012869'
    steps:
      - uses: actions/checkout@v4
      - name: Install Capstone
        run: python -m pip install --disable-pip-version-check -q capstone
      - name: Recover exact eboot and code graph
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/resource-shadow
          curl --fail --location --retry 4 --retry-delay 2 "$EBOOT_URL" -o build/resource-shadow/eboot.bin
          test "$(stat -c %s build/resource-shadow/eboot.bin)" = "$EBOOT_SIZE"
          echo "$EBOOT_SHA256  build/resource-shadow/eboot.bin" | sha256sum --check --strict
          curl -fsSL --retry 4             -H "Authorization: Bearer $GH_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CODEGRAPH_ARTIFACT_ID}/zip"             -o build/resource-shadow/codegraph.zip
          unzip -q build/resource-shadow/codegraph.zip -d build/resource-shadow/codegraph
          test -f build/resource-shadow/codegraph/ghidra_code_graph.json.gz
      - name: Scan exact resource shadow writers
        run: |
          python tools/d1_resource_shadow_writer_scan.py             build/resource-shadow/eboot.bin             --codegraph build/resource-shadow/codegraph/ghidra_code_graph.json.gz             --out build/resource-shadow/resource_shadow_writer_scan.json
      - name: Print top candidates
        run: |
          python - <<'PY'
          import json
          d=json.load(open('build/resource-shadow/resource_shadow_writer_scan.json'))
          for x in d['candidates'][:50]:
              print(x['entry_hex'], 'score',x['score'],'stride',x['has_stage_stride'],
                    'writes',x['memory_write_instruction_count'],
                    'known',x['calls_known_resource_path'])
              for h in x['hits'][:4]:
                  print(' ',h['center']['address_hex'],h['center']['mnemonic'],
                        h['center']['op_str'],h['reasons'])
          PY
      - name: Remove executable
        if: always()
        run: rm -f build/resource-shadow/eboot.bin build/resource-shadow/codegraph.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-resource-shadow-writer-scan
          path: build/resource-shadow/resource_shadow_writer_scan.json
          if-no-files-found: warn
          retention-days: 30
