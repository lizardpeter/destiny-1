name: Original Fortnite Athena foliage audit
on:
  pull_request:
    branches: [main]
    paths:
      - tools/fortnite_541_foliage_probe.py
      - 'tools/fortnite_541_foliage_rust/**'
      - .github/workflows/fortnite-541-foliage-audit.yml
  workflow_dispatch:
jobs:
  foliage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate original Fortnite Athena foliage maps and assets
        run: python3 tools/fortnite_541_foliage_probe.py
      - name: Compile production Rust foliage decoder against original SHA1-verified retail grass transforms
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,"tools")
          import fortnite_541_r2_material_probe as r2
          idx=r2.load_index()
          files=[
              ("Athena/Maps/Athena_Terrain",".umap","root"),
              ("Athena/Maps/Athena_Terrain",".uexp","root"),
              ("Athena/Maps/Landscape/Athena_Terrain_LS_01",".umap","LS01"),
              ("Athena/Maps/Landscape/Athena_Terrain_LS_01",".uexp","LS01"),
              ("Athena/Maps/POI/Athena_POI_HedgeMaze",".umap","Hedge"),
              ("Athena/Maps/POI/Athena_POI_HedgeMaze",".uexp","Hedge"),
              ("Athena/Environments/Landscape/Foliage/Athena_SM_WavyGrass_TopologyColor",".uasset","Grass"),
              ("Athena/Environments/Landscape/Foliage/Athena_SM_WavyGrass_TopologyColor",".uexp","Grass")
          ]
          for source,ext,target in files:
              key="FortniteGame/Content/"+source+ext
              raw=r2.source_payload(idx[key])
              Path("/tmp/fortnite541_"+target+ext).write_bytes(raw)
              print("FORTNITE_FOLIAGE_SOURCE_SHA1_VERIFIED",key,len(raw),flush=True)
          PY
          cargo test --manifest-path tools/fortnite_541_foliage_rust/Cargo.toml
          cargo run --quiet --manifest-path tools/fortnite_541_foliage_rust/Cargo.toml -- /tmp/fortnite541_root.umap /tmp/fortnite541_root.uexp /tmp/fortnite541_LS01.umap /tmp/fortnite541_LS01.uexp /tmp/fortnite541_Hedge.umap /tmp/fortnite541_Hedge.uexp /tmp/fortnite541_Grass.uasset /tmp/fortnite541_Grass.uexp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authentic-fortnite-foliage-metadata
          path: fortnite541_authored_foliage_audit.json
          retention-days: 3
          if-no-files-found: ignore
