name: D1 GCN EXEC mask opcode frontier self-test

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/d1_gcn_cfg_ir_v2.py'
      - 'tools/d1_gcn_exec_mask_opcode_frontier.py'
      - '.github/workflows/d1-gcn-exec-mask-opcode-frontier-selftest.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Prove exact fail-closed EXEC opcode frontier inventory
        run: |
          set -euo pipefail
          python tools/d1_gcn_exec_mask_opcode_frontier.py --self-test
