name: D1 Crota renderer final native image samples 808EE505 v1

on:
  workflow_dispatch:
  push:
    branches: [d1-crota-source-semantics-v1]
    paths:
      - '.github/workflows/d1-crota-renderer-final-native-image-samples-v1.yml'
      - 'tools/d1_gcn_renderer_program_close_native_image_sample_semantics.py'

env:
  RENDERER_ARTIFACT_ID: '10081348208'
  RENDERER_ARTIFACT_ZIP_SHA256: 'fd4ab48c924343e84d06e26b224ffd241fdb5d092d810f1883a7a677fb581665'
  GEM5_REV: 'f5c5a6e390f55dd5984977815bf9d0bd05da6945'

permissions:
  contents: read
  actions: read

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover immutable 454 of 456 checkpoint
        run: |
          set -euo pipefail
          mkdir -p input/renderer input/source out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RENDERER_ARTIFACT_ID}/zip" -o input/renderer.zip
          echo "${RENDERER_ARTIFACT_ZIP_SHA256}  input/renderer.zip" | sha256sum --check --strict
          unzip -q input/renderer.zip -d input/renderer
          test -f input/renderer/D1_80D777B6_808EE505_RENDERER_PROGRAM.json
          test -f input/renderer/PS_808EE505_STRUCTURAL_IR_V3.json
      - name: Fetch pinned native MIMG source
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 "https://raw.githubusercontent.com/gem5/gem5/${GEM5_REV}/src/arch/amdgpu/vega/insts/mimg.cc" -o input/source/gem5_mimg.cc
      - name: Close final descriptor-parametric IMAGE_SAMPLE operations
        run: |
          set -euo pipefail
          python tools/d1_gcn_renderer_program_close_native_image_sample_semantics.py \
            --program input/renderer/D1_80D777B6_808EE505_RENDERER_PROGRAM.json \
            --ir input/renderer/PS_808EE505_STRUCTURAL_IR_V3.json \
            --gem5-mimg input/source/gem5_mimg.cc \
            -o out/D1_80D777B6_808EE505_RENDERER_PROGRAM.json
          python - <<'PY'
          import json
          d=json.load(open('out/D1_80D777B6_808EE505_RENDERER_PROGRAM.json'));p=d['program'];c=p['coverage']
          expected={'CONTROL_EXACT':47,'EXPRESSION_EXACT':303,'INPUT_PROVENANCE_EXACT':70,'RECURRENCE_EXACT':36}
          assert d['status']=='D1_GCN_RENDERER_PROGRAM_IR_NATIVE_SEMANTICS_EXACT' and not d['violations'],d
          assert c['primary_resolution_counts']==expected,c
          assert c['exact_nonstructural_instruction_count']==456 and c['structural_only_instruction_count']==0
          assert c['final_native_image_sample_promoted_instructions']==[212,213]
          assert len(p['final_native_image_sample_contracts'])==2
          assert all(x['primary_resolution']!='STRUCTURAL_ONLY' for x in p['instruction_resolution'])
          assert d['semantic_boundary']['native_instruction_semantics']=='EXACT_456_OF_456'
          assert d['semantic_boundary']['portable_resource_dimension_for_808EE500_808EE4FE']=='SEPARATE_RESOURCE_ADAPTER_FRONTIER'
          print('CROTA_808EE505_NATIVE_PROGRAM_CLOSED_456_OF_456',expected)
          PY
          cp input/renderer/PS_808EE505_STRUCTURAL_IR_V3.json out/
          cp input/renderer/PS_808EE505_DESCRIPTOR_LIVE_PROVENANCE.json out/
          cp input/renderer/GFX7_DESCRIPTOR_SEMANTICS.json out/
          sha256sum out/*.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-CROTA-808EE505-NATIVE-PROGRAM-456-OF-456-V1
          path: out/
          retention-days: 30
          if-no-files-found: error
