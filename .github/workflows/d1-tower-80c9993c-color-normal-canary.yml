name: D1 Tower 80C9993C color normal canary

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-80c9993c-color-normal-canary.yml'
      - 'tools/d1_tower_80c9993c_color_normal_bake.py'
      - 'tools/d1_tower_80c9993c_triangle_bake.py'
      - 'tools/d1_tower_80ca0cb7_vs_replay.py'
      - 'tools/d1_tower_80ca0cb7_static_inputs.py'
      - 'tools/d1_tower_grass_shader_80c9994a.py'
      - 'tools/d1_world_static_common.py'
      - 'tests/test_d1_tower_80c9993c_color_normal_bake.py'
      - 'tests/test_d1_tower_80ca0cb7_vs_replay.py'
      - 'tests/test_d1_world_static_common.py'
      - 'tests/test_d1_tower_80c9993c_triangle_bake.py'
      - 'tests/test_d1_tower_80ca0cb7_static_inputs.py'
      - 'tests/test_d1_tower_grass_shader_80c9994a.py'

permissions:
  contents: read
  actions: read

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Run scoped affine VS PS and adapter tests
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy pillow trimesh pytest texture2ddecoder
          pytest -q \
            tests/test_d1_world_static_common.py \
            tests/test_d1_tower_80ca0cb7_vs_replay.py \
            tests/test_d1_tower_80c9993c_color_normal_bake.py \
            tests/test_d1_tower_80c9993c_triangle_bake.py \
            tests/test_d1_tower_80ca0cb7_static_inputs.py \
            tests/test_d1_tower_grass_shader_80c9994a.py

      - name: Recover exact Tower source families and runtime
        run: |
          set -euo pipefail
          mkdir -p index runtime packages reports target_textures proof
          idx_run="$(gh run list --workflow d1-global-activity-index.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$idx_run"
          gh run download "$idx_run" -n d1-global-activity-index -D index
          cp "$(find index -name D1_CURRENT_ACTIVITY_INDEX.json -print -quit)" reports/D1_CURRENT_ACTIVITY_INDEX.json
          cp "$(find index -name packages.txt -print -quit)" reports/packages.txt
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_recover_indexed_package_families.py \
            --index reports/D1_CURRENT_ACTIVITY_INDEX.json --package-list reports/packages.txt \
            --package-id 024c --package-id 0250 --out-dir packages --report reports/recovery.json

      - name: Export exact retail target textures
        run: |
          set -euo pipefail
          cat > reports/selected_visual.json <<'JSON'
          {
            "status": "D1_80C9993C_COLOR_NORMAL_SELECTOR",
            "materials": {"80C9993C": {"visual": true}}
          }
          JSON
          mapfile -t files < <(find packages -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_material_texture_export.py "${args[@]}" \
            --runtime runtime --visual-json reports/selected_visual.json --out target_textures
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('target_textures/material_texture_manifest.json'))
          assert d['material_decode_errors']==0,d
          assert d['texture_errors']==0,d
          assert d['unique_texture_tags']==3,d
          m=d['materials']['80C9993C']
          assert m['vertex_shader']=='80CA0CB7' and m['pixel_shader']=='80C9994A',m
          c=d['textures']['80C9988C']; n=d['textures']['80C9988D']; mask=d['textures']['80C9988E']
          assert c['format_name']=='BC3' and c['native_colorspace_hint']=='sRGB',c
          assert n['format_name']=='BC5' and n['native_colorspace_hint']=='linear',n
          assert mask['format_name']=='BC4' and mask['native_colorspace_hint']=='linear',mask
          for r in (c,n,mask):
              assert Path('target_textures/textures',r['png']).is_file(),r
          print('TEXTURE_GATE',json.dumps({'color':c,'normal':n,'mask':mask},indent=2))
          PY

      - name: Bake native color and normal proof
        run: |
          set -euo pipefail
          mapfile -t files < <(find packages -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          color_png="$(find target_textures/textures -name '80C9988C_*_BC3.png' -print -quit)"
          normal_png="$(find target_textures/textures -name '80C9988D_*_BC5.png' -print -quit)"
          mask_png="$(find target_textures/textures -name '80C9988E_*_BC4.png' -print -quit)"
          test -n "$color_png"; test -n "$normal_png"; test -n "$mask_png"
          python tools/d1_tower_80c9993c_color_normal_bake.py "${args[@]}" \
            --runtime runtime \
            --color-png "$color_png" --normal-png "$normal_png" --mask-png "$mask_png" \
            --out-glb proof/D1_TOWER_80C9993C_NATIVE_RGB_NORMAL_PROOF.glb \
            --out-color-atlas proof/D1_TOWER_80C9993C_NATIVE_RGB_COLOR_ATLAS.png \
            --out-normal-atlas proof/D1_TOWER_80C9993C_GLTF_NORMAL_ATLAS.png \
            --out-native-normal-atlas proof/D1_TOWER_80C9993C_NATIVE_TS_NORMAL_ATLAS.png \
            --report proof/D1_TOWER_80C9993C_NATIVE_RGB_NORMAL_REPORT.json

      - name: Validate normal proof independently
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          import numpy as np
          from PIL import Image
          import trimesh

          gp=Path('proof/D1_TOWER_80C9993C_NATIVE_RGB_NORMAL_PROOF.glb')
          cp=Path('proof/D1_TOWER_80C9993C_NATIVE_RGB_COLOR_ATLAS.png')
          npth=Path('proof/D1_TOWER_80C9993C_GLTF_NORMAL_ATLAS.png')
          tp=Path('proof/D1_TOWER_80C9993C_NATIVE_TS_NORMAL_ATLAS.png')
          rp=Path('proof/D1_TOWER_80C9993C_NATIVE_RGB_NORMAL_REPORT.json')
          for p,min_size in ((gp,10000),(cp,1000),(npth,1000),(tp,1000),(rp,1000)):
              assert p.is_file() and p.stat().st_size>min_size,(p,p.stat().st_size if p.exists() else None)
          r=json.load(open(rp))
          assert r['status']=='D1_80C9993C_COLOR_NATIVE_NORMAL_GLTF_ADAPTER',r
          assert r['atlas']['triangle_count']==648,r['atlas']
          assert [(x['static_index'],x['triangles']) for x in r['draws']]==[(579,232),(799,416)],r['draws']
          assert r['gltf']['standard_tangent_attributes_patched']==2,r['gltf']
          assert r['gltf']['node_transform_policy'].startswith('identity'),r['gltf']
          for d in r['draws']:
              assert len(d['spatial_affine_3x4'])==3
              assert len(d['instance_shader_tail_30_3c'])==4
              # The known retail fourth values are obviously not homogeneous matrix rows.
              assert d['instance_shader_tail_30_3c'][3] > 100000

          data=gp.read_bytes()
          magic,ver,total=struct.unpack_from('<4sII',data,0)
          assert magic==b'glTF' and ver==2 and total==len(data)
          jsz,jkind=struct.unpack_from('<II',data,12)
          assert jkind==0x4E4F534A
          tree=json.loads(data[20:20+jsz].rstrip(b' \x00'))
          prims=[p for m in tree['meshes'] for p in m['primitives']]
          assert len(prims)==2
          for p in prims:
              a=p['attributes']
              assert {'POSITION','NORMAL','TANGENT','TEXCOORD_0'} <= set(a),a
              assert '_TANGENT' not in a,a
          assert tree.get('materials') and all('normalTexture' in m for m in tree['materials']),tree.get('materials')

          s=trimesh.load(gp,force='scene',process=False)
          assert isinstance(s,trimesh.Scene)
          assert len(s.geometry)==2,(len(s.geometry),s.geometry.keys())
          tris=sum(len(g.faces) for g in s.geometry.values())
          verts=sum(len(g.vertices) for g in s.geometry.values())
          assert tris==648,tris
          assert verts==648*3,verts
          for name,g in s.geometry.items():
              assert len(g.vertex_normals)==len(g.vertices),name
              assert getattr(g.visual,'uv',None) is not None,name

          dims=(r['atlas']['height'],r['atlas']['width'])
          ci=np.asarray(Image.open(cp).convert('RGBA'))
          ni=np.asarray(Image.open(npth).convert('RGBA'))
          ti=np.asarray(Image.open(tp).convert('RGBA'))
          assert ci.shape[:2]==dims and ni.shape[:2]==dims and ti.shape[:2]==dims
          for label,im in [('color',ci),('gltf_normal',ni),('native_ts',ti)]:
              occ=im[...,3]>0
              assert occ.any(),label
              unique=len(np.unique(im[occ,:3].reshape(-1,3),axis=0))
              assert unique>100,(label,unique)
          # A real normal field must vary in more than blue and must not be flat 128,128,255.
          occ=ni[...,3]>0
          nrgb=ni[occ,:3]
          assert int(nrgb[:,0].max())>int(nrgb[:,0].min())
          assert int(nrgb[:,1].max())>int(nrgb[:,1].min())
          assert len(np.unique(nrgb,axis=0))>1000

          out={
            'status':'D1_80C9993C_COLOR_NORMAL_CANARY_PASS',
            'glb_bytes':gp.stat().st_size,
            'color_atlas_bytes':cp.stat().st_size,
            'gltf_normal_atlas_bytes':npth.stat().st_size,
            'native_ts_normal_atlas_bytes':tp.stat().st_size,
            'glb_sha256':hashlib.sha256(gp.read_bytes()).hexdigest(),
            'color_atlas_sha256':hashlib.sha256(cp.read_bytes()).hexdigest(),
            'gltf_normal_atlas_sha256':hashlib.sha256(npth.read_bytes()).hexdigest(),
            'native_ts_normal_atlas_sha256':hashlib.sha256(tp.read_bytes()).hexdigest(),
            'geometry_count':len(s.geometry),'triangles':tris,'vertices':verts,
            'gltf_normal_unique_rgb':int(len(np.unique(nrgb,axis=0))),
            'normal_stats':r['normal_stats'],
            'approximation_boundary':r['approximation_boundary'],
          }
          Path('proof/CANARY_NORMAL.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-80c9993c-native-rgb-normal-proof
          path: |
            proof/
            target_textures/material_texture_manifest.json
            reports/selected_visual.json
            reports/recovery.json
          retention-days: 14
          compression-level: 6
