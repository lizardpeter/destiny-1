name: D1 Crota stage model owner closure

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/d1_remote_model_owner_trace_multi.py'
      - '.github/workflows/d1-crota-stage-model-owner-closure.yml'

permissions:
  contents: read
  actions: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    env:
      UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
      UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
      UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Trace all stage models through exact ownership
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_remote_model_owner_trace_multi.py
          python tools/d1_remote_model_owner_trace_multi.py \
            --model 0x8109790F --model 0x808EEF7F --model 0x808EEF7D --model 0x808EEF7B --model 0x8108E4E6 \
            --scan-package-id 0x0447 --scan-package-id 0x044B --scan-package-id 0x044C --scan-package-id 0x044D \
            --scan-package-id 0x0453 --scan-package-id 0x0454 --scan-package-id 0x0455 \
            --scan-package-id 0x005A --scan-package-id 0x005B --scan-package-id 0x005C --scan-package-id 0x005D --scan-package-id 0x005E --scan-package-id 0x005F \
            --scan-package-id 0x0076 --scan-package-id 0x0077 \
            --scan-package-id 0x0151 --scan-package-id 0x0154 --scan-package-id 0x0156 --scan-package-id 0x0169 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_STAGE_MODEL_OWNERS.json | tee out/model_owner_stdout.txt

      - name: Fully decode every exact s_entity model owner
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          ARGS=$(python - <<'PY'
          import json
          d=json.load(open('out/CROTA_STAGE_MODEL_OWNERS.json'))
          print(' '.join('--tag-hash 0x'+h for h in d.get('unique_s_entity_owner_hashes',[])))
          PY
          )
          echo "ENTITY_ARGS=$ARGS" | tee out/entity_args.txt
          if [[ -n "$ARGS" ]]; then
            python tools/d1_remote_exact_s_entity_probe.py $ARGS \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
              --runtime runtime -o out/CROTA_STAGE_MODEL_OWNER_ENTITIES.json | tee out/entities_stdout.txt
          else
            printf '{"schema":"empty","entries":[],"violation_count":0,"violations":[]}\n' > out/CROTA_STAGE_MODEL_OWNER_ENTITIES.json
            echo NO_ENTITY_OWNERS | tee out/entities_stdout.txt
          fi

      - name: Resolve all source-mapped owner names
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          ARGS=$(python - <<'PY'
          import json
          d=json.load(open('out/CROTA_STAGE_MODEL_OWNER_ENTITIES.json'))
          args=[]; seen=set()
          for e in d.get('entries',[]):
              for h in e.get('specific_name_string_hashes',[]):
                  k=('s',h)
                  if k not in seen:
                      seen.add(k); args += ['--string-hash','0x'+h]
              for h in e.get('generic_name_tags',[]):
                  k=('g',h)
                  if k not in seen:
                      seen.add(k); args += ['--generic-name-tag','0x'+h]
          print(' '.join(args))
          PY
          )
          echo "NAME_ARGS=$ARGS" | tee out/name_args.txt
          if [[ -n "$ARGS" ]]; then
            python tools/d1_remote_global_stringhash_resolve.py $ARGS \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --global-package-id 0x0151 --global-package-id 0x0154 --global-package-id 0x0155 \
              --global-package-id 0x0156 --global-package-id 0x0157 --global-package-id 0x0158 \
              --global-package-id 0x0169 --global-package-id 0x018D --global-package-id 0x01E3 \
              --global-package-id 0x072B --global-package-id 0x072F --global-package-id 0x0735 \
              --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
              --runtime runtime -o out/CROTA_STAGE_MODEL_OWNER_NAMES.json | tee out/names_stdout.txt
          else
            printf '{"schema":"empty","resolved":{},"generic_name_tag_to_string_hash":{},"unresolved_target_hashes":[],"violation_count":0,"violations":[]}\n' > out/CROTA_STAGE_MODEL_OWNER_NAMES.json
            echo NO_SOURCE_MAPPED_NAMES | tee out/names_stdout.txt
          fi

      - name: Summarize and enforce proof gates
        run: |
          set -euo pipefail
          python - <<'PY' | tee out/summary.txt
          import json
          m=json.load(open('out/CROTA_STAGE_MODEL_OWNERS.json'))
          e=json.load(open('out/CROTA_STAGE_MODEL_OWNER_ENTITIES.json'))
          n=json.load(open('out/CROTA_STAGE_MODEL_OWNER_NAMES.json'))
          assert not m.get('violations'),m.get('violations')
          assert e.get('violation_count',0)==0,e.get('violations')
          assert n.get('violation_count',0)==0,n.get('violations')
          em={x['tag_hash']:x for x in e.get('entries',[])}
          resolved=n.get('resolved',{})
          name_map={h:sorted({r.get('string') for r in rows if r.get('string')}) for h,rows in resolved.items()}
          generic=n.get('generic_name_tag_to_string_hash',{})
          print('MODELS_REQUESTED',m['models_requested'])
          for mr in m['models']:
              print('MODEL',mr['model_tag_hash'],'RESOURCE_OWNERS',mr['model_owner_resource_count'],'ENTITY_OWNERS',mr['s_entity_owner_count'])
              for owner in mr['s_entity_owners']:
                  h=owner['entity_hash']; x=em.get(h,{})
                  vals=[]
                  for sh in x.get('specific_name_string_hashes',[]): vals += name_map.get(sh,[])
                  for gh in x.get('generic_name_tags',[]):
                      sh=generic.get(gh)
                      if sh: vals += name_map.get(sh,[])
                  print(' OWNER',h,'PKG',owner['package_id'],'SKELETONS',[(s['resource_hash'],s['node_count']) for s in x.get('skeletons',[])],
                        'MODELS',x.get('embedded_models',[]),'NAMES',sorted(set(vals)),
                        'SPECIFIC_HASHES',x.get('specific_name_string_hashes',[]),'GENERIC_TAGS',x.get('generic_name_tags',[]))
          PY
          sha256sum out/* > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-CROTA-STAGE-MODEL-OWNER-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
