name: D1 shared glove-collar PS4 TGXM geometry fixtures

on:
  push:
    paths:
      - '.github/workflows/d1-spektr-shared-glove-collar-geometry-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install dependencies
        run: python -m pip install -q numpy trimesh

      - name: Recover exact target TGXM and verified Oodle runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/historical input/tgxm_extract runtime out/ps4
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=D1-SPEKTAR-HISTORICAL-GEARASSET-EXACT-TGXM&per_page=20" \
            | python -c "import json,sys; a=[x for x in json.load(sys.stdin)['artifacts'] if not x['expired']]; assert a; a.sort(key=lambda x:x['created_at'],reverse=True); print(a[0]['archive_download_url'])")
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$url" -o input/historical.zip
          unzip -q input/historical.zip -d input/historical
          target=$(find input/historical -type f -path '*/tgxm_male/B4BD27A2/2943ee229ea8c0c44dd610a4dd68ace3.tgxm' -print -quit)
          test -n "$target"
          cp "$target" input/shared_glove_collar_984938936-0.tgxm
          echo 'f5e7b2efae7d7737f87997c16dbc36047e0e685bc39f36c311435afc8c47d977  input/shared_glove_collar_984938936-0.tgxm' | sha256sum --check --strict
          python tools/d1_tgxm_unpack.py input/shared_glove_collar_984938936-0.tgxm \
            --extract-dir input/tgxm_extract -o out/shared_glove_collar_tgxm_unpack.json

          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Export exact PS4 candidate 80A6A345
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_model_export.py \
            --model 80A6A345 \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --member-catalog evidence/d1_globals_pvp_0169_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' \
            --part-count 10 --runtime runtime --out-dir out/ps4 \
            --combined-glb out/80A6A345_all_ranges.glb \
            -o out/80A6A345_remote_export.json

      - name: Record fixture hashes
        run: |
          set -euo pipefail
          cp input/shared_glove_collar_984938936-0.tgxm out/
          mkdir -p out/tgxm_extract
          cp -a input/tgxm_extract/. out/tgxm_extract/
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
          python - <<'PY'
          import json
          t=json.load(open('out/shared_glove_collar_tgxm_unpack.json'))
          p=json.load(open('out/80A6A345_remote_export.json'))
          assert t['sha256']=='f5e7b2efae7d7737f87997c16dbc36047e0e685bc39f36c311435afc8c47d977'
          assert t['file_identifier']=='984938936-0'
          assert p['exported_model_count']==1 and p['models'][0]['tag_hash']=='80A6A345'
          print('TGXM FILES',[(x['file_name'],x['file_size']) for x in t['files']])
          print('PS4',p['models'][0])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: d1-shared-glove-collar-80A6A345-geometry-fixtures
          path: out/
          retention-days: 14
          if-no-files-found: error
