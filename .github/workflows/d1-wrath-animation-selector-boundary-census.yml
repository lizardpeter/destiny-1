name: D1 Wrath animation selector boundary census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-wrath-animation-selector-boundary-census.yml'
      - 'tools/d1_remote_activity_animation_selector_boundary_census.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  CONTROL_PLAN_ARTIFACT_ID: '10003732330'
  CONTROL_PLAN_ARTIFACT_ZIP_SHA256: 'cfeddba3d3dd86187f147be523d9a79c2b1a3009c744ba456ff0fdae8c7c3f35'

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact catalog, control plan, and Oodle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog input/control runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CONTROL_PLAN_ARTIFACT_ID}/zip" -o input/control.zip
          echo "${CONTROL_PLAN_ARTIFACT_ZIP_SHA256}  input/control.zip" | sha256sum --check --strict
          unzip -q input/control.zip -d input/control
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Census all exact Wrath selected controls
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python tools/d1_remote_activity_animation_selector_boundary_census.py \
            --control-plan input/control/wrath_activity_actor_animation_control_plan.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/wrath_selector_boundary_census.json \
            | tee out/census.txt
          python - <<'PY'
          import json
          d=json.load(open('out/wrath_selector_boundary_census.json'))
          assert d['status']=='COMPLETE' and d['violation_count']==0,d['violations'][:20]
          assert d['control_count']==45,d['control_count']
          assert d['one_past_bank_to_zero_count']==2,d['one_past_bank_to_zero_records']
          assert d['other_out_of_bounds_count']==0,d['other_out_of_bounds_records'][:20]
          assert {x['control'] for x in d['one_past_bank_to_zero_records']}=={'817A55AD','817BD0EC'}
          print('WRATH_BOUNDARY_CONVENTION',d['selector_count'],d['classification_counts'])
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-WRATH-ANIMATION-SELECTOR-BOUNDARY-CENSUS
          path: out/
          retention-days: 30
          if-no-files-found: error
