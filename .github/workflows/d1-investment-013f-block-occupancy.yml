name: D1 investment 013F block occupancy

on:
  push:
    paths:
      - '.github/workflows/d1-investment-013f-block-occupancy.yml'
      - 'tools/d1_remote_block_occupancy_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover verified Oodle 3 runtime
        run: |
          set -euo pipefail
          mkdir -p runtime out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Compare logical occupancy and justified Oodle raw lengths
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_block_occupancy_probe.py \
            --tag-hash 80A7FA34 \
            --tag-hash 80A7FB3B \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/013f_block_occupancy.json
      - name: Summarize physical producer snapshots
        run: |
          python - <<'PY'
          import json
          d=json.load(open('out/013f_block_occupancy.json'))
          for e in d['entries']:
              print('\n',e['tag_hash'])
              for s in e['snapshots']:
                  # Patch 1 produced both exact physical blocks. Patch 5 is the current logical consumer.
                  if s['snapshot_patch_id'] not in (1,5): continue
                  print('snapshot',s['snapshot_patch_id'],s['entry'])
                  for b in s['blocks']:
                      o=b['occupancy']
                      print(' block',b['logical_block_index'],'owner',b['physical_patch_id'],b['physical_owner_member'])
                      print(' occupancy max_end',hex(o['max_referenced_end']),'trailing',hex(o['trailing_unreferenced_bytes']),
                            'slices',o['entry_slice_count'],'ranges',o['merged_referenced_ranges'])
                      print(' candidates',o['derived_raw_length_candidates'])
                      print(' attempts',[(x.get('requested_raw_length'),x.get('success'),x.get('returned_length')) for x in b['decode_attempts']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-investment-013f-block-occupancy
          path: out/
          retention-days: 14
