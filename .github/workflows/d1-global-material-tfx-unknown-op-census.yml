name: D1 global material TFX unknown-op census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-global-material-tfx-unknown-op-census.yml'
      - 'tools/d1_remote_global_material_tfx_unknown_opcode_census.py'
      - 'tools/d1_material_decode.py'
      - 'tools/d1_tfx_program_inventory.py'

permissions: {contents: read}

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Rebuild exact current package catalog and runtime
        run: |
          set -euo pipefail
          mkdir -p input runtime out
          curl --fail --location --retry 4 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o input/packages.txt
          curl --fail --location --retry 4             'https://github.com/lizardpeter/destiny-1/releases/download/d1-global-activity-index-r1/D1_CURRENT_ACTIVITY_INDEX.json'             -o input/D1_CURRENT_ACTIVITY_INDEX.json
          echo '6b82da75f2f45852fa8addc58d2f835f914adfb48533e0388b4bd24f949b3f06  input/D1_CURRENT_ACTIVITY_INDEX.json' | sha256sum --check --strict
          python tools/d1_universal_member_catalog.py             --activity-index input/D1_CURRENT_ACTIVITY_INDEX.json             --package-list input/packages.txt             --out input/D1_UNIVERSAL_MEMBER_CATALOG.json
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll'             -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3             'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so'             -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Census every current ROI material TFX 0x4A and 0x4B
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_global_material_tfx_unknown_opcode_census.py
          python tools/d1_remote_global_material_tfx_unknown_opcode_census.py             --member-catalog input/D1_UNIVERSAL_MEMBER_CATALOG.json             --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10             --runtime runtime             -o out/D1_GLOBAL_MATERIAL_TFX_UNKNOWN_OPCODE_CENSUS.json | tee out/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/D1_GLOBAL_MATERIAL_TFX_UNKNOWN_OPCODE_CENSUS.json'))
          assert d['status']=='D1_ROI_GLOBAL_MATERIAL_TFX_UNKNOWN_OPCODE_CENSUS_EXACT',d['violations'][:20]
          assert d['material_entry_count']==d['parsed_material_count'],(d['material_entry_count'],d['parsed_material_count'])
          assert d['opcode_histogram'].get('Unk4a',0)>0,d['opcode_histogram']
          assert d['opcode_histogram'].get('Unk4b',0)>0,d['opcode_histogram']
          assert not d['violations'],d['violations'][:20]
          print('D1_GLOBAL_MATERIAL_TFX_UNKNOWN_OP_GREEN',json.dumps({
            'materials':d['material_entry_count'],
            'occurrences':d['unknown_opcode_occurrence_count'],
            'programs':d['unknown_opcode_program_count'],
            'opcodes':d['opcode_histogram'],
            'stage_opcodes':d['stage_opcode_histogram'],
            'operands':d['operand_histograms'],
            'prior_same':d['operand_equals_last_prior_0x42_counts'],
            'in_cbuffer':d['operand_in_serialized_cbuffer_range_counts']
          },sort_keys=True))
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-GLOBAL-MATERIAL-TFX-UNKNOWN-OP-CENSUS
          path: out/
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
