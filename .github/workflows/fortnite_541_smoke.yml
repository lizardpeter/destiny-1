name: Temporary Fortnite UE4 parser smoke test

on:
  push:
    branches:
      - ci/fortnite-541-parser-smoke-20261010
    paths:
      - 'ci/fortnite_541/**'
      - '.github/workflows/fortnite_541_smoke.yml'
  pull_request:
    paths:
      - 'ci/fortnite_541/**'
      - '.github/workflows/fortnite_541_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Show compiler version
        run: rustc --version && cargo --version
      - name: Test synthetic UE4 PAK and loose-file cases
        run: cargo test --manifest-path ci/fortnite_541/Cargo.toml --all-targets -- --nocapture
      - name: Check isolated binary
        run: cargo check --manifest-path ci/fortnite_541/Cargo.toml --all-targets
      - name: Fetch all six original Athena landscape sections (source SHA-1 verified)
        run: python3 ci/fortnite_541/fetch_athena_541.py --all-landscape --destination /tmp/fortnite541/athena/source --sparse-pak /tmp/fortnite541/original-main.pak
      - name: Decode and assemble real in-game terrain source
        run: cargo run --manifest-path ci/fortnite_541/Cargo.toml --bin athena_runtime_smoke -- /tmp/fortnite541/athena/source
      - name: Compile full game-side Fortnite NeutralScene adapter using source-neutral engine crate
        run: cargo check --manifest-path ci/fortnite_game/Cargo.toml --all-targets
      - name: Load real Athena source into actual game-side NeutralScene adapter
        run: RUST_TEST_FORTNITE_541_PAK=/tmp/fortnite541/original-main.pak cargo run --manifest-path ci/fortnite_game/Cargo.toml --release
      - name: Show resolved AES dependency lock entries
        run: cat ci/fortnite_541/Cargo.lock
