name: D1 Crota full stage resource census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-full-stage-resource-census.yml'
      - 'tools/d1_remote_s6e_stage_probe.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  RUNTIME_PLACEMENTS_ARTIFACT_ID: '9995963526'
  RUNTIME_PLACEMENTS_ZIP_SHA256: '69d03bac70adbc70a4950d0874f8245e825363e7578cd6d73a68c8a2dfc9b117'
  F603_CENSUS_ARTIFACT_ID: '9999332178'
  F603_CENSUS_ZIP_SHA256: 'c65b48d54a6463eb116b0c18c525a8a399873e68cd52a27281f4f7982dfacfee'

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover pinned catalogs and raid evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog input/placements input/f603 runtime out/stages
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RUNTIME_PLACEMENTS_ARTIFACT_ID}/zip" -o input/placements.zip
          echo "${RUNTIME_PLACEMENTS_ZIP_SHA256}  input/placements.zip" | sha256sum --check --strict
          unzip -q input/placements.zip -d input/placements

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${F603_CENSUS_ARTIFACT_ID}/zip" -o input/f603.zip
          echo "${F603_CENSUS_ZIP_SHA256}  input/f603.zip" | sha256sum --check --strict
          unzip -q input/f603.zip -d input/f603

      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Decode all source-owned S6E stage containers
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_remote_s6e_stage_probe.py
          python - <<'PY' > out/s6e_tags.txt
          import json
          d=json.load(open('input/placements/CROTA_END_RUNTIME_PLACEMENTS.json'))
          assert d['status']=='D1_REMOTE_ACTIVITY_PLACEMENTS_COMPLETE',d['status']
          assert not d['violations'],d['violations']
          for h in d['unique_s6e_resources']: print(h)
          PY
          while read -r H; do
            echo "PROBE_S6E $H"
            python tools/d1_remote_s6e_stage_probe.py \
              --s6e "0x${H}" \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
              --runtime runtime -o "out/stages/${H}.json" \
              > "out/stages/${H}.stdout.txt"
          done < out/s6e_tags.txt

      - name: Build raid-wide stage schema matrix
        run: |
          set -euo pipefail
          python - <<'PY' | tee out/summary.txt
          import collections,glob,json,os
          placements=json.load(open('input/placements/CROTA_END_RUNTIME_PLACEMENTS.json'))
          f603=json.load(open('input/f603/CROTA_RAID_F603_SCRIPTED_OWNERS.json'))
          assert not placements['violations'],placements['violations']
          assert not f603['violations'],f603['violations']
          fby={r['f603']:r for r in f603['rows']}
          expected=set(placements['unique_f603_entity_resources'])
          seen=[];containers=[];pair_stage=collections.defaultdict(list);pair_container=collections.defaultdict(set)
          pair_dev=collections.defaultdict(set);pair_f603=collections.defaultdict(list)
          for path in sorted(glob.glob('out/stages/*.json')):
            p=json.load(open(path)); assert not p['violations'],(path,p['violations'])
            s6e=p['s6e']; stages=[]
            for s in p['stages']:
              pc=collections.Counter(); roles=collections.Counter(); devs=[]; rows=[]
              for x in s['f603s']:
                fh=x['f603']['hash']
                if fh in ('00000000','FFFFFFFF'): continue
                seen.append(fh); r=fby[fh]
                pair=f"{r.get('unk10_class') or 'NONE'}->{r.get('unk18_class') or 'NONE'}"
                role=r.get('semantic_role','unknown'); pc[pair]+=1;roles[role]+=1
                cp=x.get('activity_collapse') or {}; dev=(cp.get('dev_name') or {}).get('value')
                if dev: devs.append(dev); pair_dev[pair].add(dev)
                pair_stage[pair].append((s6e,s['stage_index'],fh,r.get('entity_resource_hash'),dev))
                pair_container[pair].add(s6e); pair_f603[pair].append(fh)
                rows.append({'f603':fh,'entity_resource':r.get('entity_resource_hash'),'pair':pair,
                             'semantic_role':role,'dev_name':dev,
                             'scripted_entity_table':r.get('scripted_entity_table_hash')})
              stage={'stage_index':s['stage_index'],'map_data_table':s['map_data_table']['hash'],
                     'f603_count':len(rows),'pair_counts':dict(pc),'role_counts':dict(roles),
                     'dev_names':devs,'resources':rows}
              stages.append(stage)
              print('STAGE',s6e,s['stage_index'],'MAP',stage['map_data_table'],'F603',stage['f603_count'],
                    'PAIRS',dict(pc),'DEVS',devs)
            containers.append({'s6e':s6e,'stage_count':len(stages),'stages':stages})
          assert len(seen)==509,(len(seen),len(expected))
          assert set(seen)==expected,(len(set(seen)^expected),sorted(set(seen)^expected)[:20])
          assert len(set(seen))==509
          pair_summary=[]
          for pair,n in sorted(f603['class_pair_counts'].items(), key=lambda kv:(-kv[1],kv[0])):
            locs=pair_stage[pair]
            assert len(locs)==n,(pair,n,len(locs))
            s6es=sorted(pair_container[pair]); unique_stage_keys=sorted({(x[0],x[1]) for x in locs})
            row={'pair':pair,'count':n,'s6e_containers':s6es,'stage_keys':[{'s6e':a,'stage_index':b} for a,b in unique_stage_keys],
                 'stage_count':len(unique_stage_keys),'dev_names':sorted(pair_dev[pair]),
                 'f603_hashes':sorted(pair_f603[pair]),
                 'finale_e17c_stage7_count':sum(a=='8108E17C' and b==7 for a,b,*_ in locs),
                 'ultra_e17f_stage1_count':sum(a=='8108E17F' and b==1 for a,b,*_ in locs)}
            pair_summary.append(row)
            print('PAIR',pair,'COUNT',n,'CONTAINERS',s6es,'STAGES',unique_stage_keys,
                  'E17C7',row['finale_e17c_stage7_count'],'E17F1',row['ultra_e17f_stage1_count'],
                  'DEVS',row['dev_names'])
          out={'schema':'d1_crota_full_stage_resource_census/v1',
               'status':'D1_CROTA_FULL_STAGE_RESOURCE_CENSUS_EXACT',
               'activity':placements['activity'],'s6e_count':len(containers),'f603_count':len(seen),
               'containers':containers,'class_pair_summary':pair_summary,
               'policy':'Every S6E/stage/F603 edge is source-layout-derived. EntityResource class pairs are parsed from the exact activity-owned F603 set. Dev names are emitted only where the source-validated Activity collapse path provides them. Pair concentration is structural evidence, not semantic identity by itself.'}
          open('out/CROTA_FULL_STAGE_RESOURCE_CENSUS.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-FULL-STAGE-RESOURCE-CENSUS
          path: out/
          retention-days: 30
          if-no-files-found: error
