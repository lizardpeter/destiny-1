name: D1 Xur scripted owner switch probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-scripted-owner-switch-probe.yml'
      - 'tools/d1_remote_xur_scripted_owner_switch_probe.py'

permissions: {contents: read, actions: read}
env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env: {GH_TOKEN: '${{ github.token }}', LINOODLE_SKIP_DLLMAIN: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover inputs
        run: |
          set -euo pipefail; mkdir -p input/catalog runtime reports
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Probe scripted Xur owners
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_xur_scripted_owner_switch_probe.py
          python tools/d1_remote_xur_scripted_owner_switch_probe.py \
            --owner 80C7A251 --owner 80C7A441 --owner 80C7A58F --owner 80C7A719 --owner 80C7AC71 --owner 80C7AC81 --owner 80C7ACB9 --owner 80C7AD18 \
            --owner 80C88185 --owner 80C8831B --owner 80C88591 --owner 80C88888 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            -o reports/D1_XUR_SCRIPTED_OWNER_SWITCH_PROBE.json | tee reports/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/D1_XUR_SCRIPTED_OWNER_SWITCH_PROBE.json'))
          assert d['schema']=='d1_remote_xur_scripted_owner_switch_probe/v3'
          assert d['status']=='D1_XUR_PLACEMENT_CONFIGURATION_SOURCE_DECODED'
          assert not d['violations']
          assert sum(r.get('is_source_pinned_SD912_scripted_entity_table',False) for r in d['rows'])==10
          assert d['typed_xur_placement_count']==60,d['typed_xur_placement_count']
          assert d['exact_expected_configuration_count']==60,d['exact_expected_configuration_count']
          assert d['expected_xur_configuration_records']==[['EAFBB478','2CA33BDB'],['26170C92','4AC210DE']]
          assert d['proof']=={
            'placement_configuration_source_decoded':True,
            'material_permutation_consumer_semantics_proven':False,
            'descriptor_A_B_evaluation_semantics_proven':False,
          },d['proof']
          assert all(v is False for v in d['gates'].values())
          print('XUR_SCRIPTED_OWNER_SWITCH_PROBE_V3_ACCEPTED')
          PY
      - run: find reports -type f -print0 | sort -z | xargs -0 sha256sum > reports/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: D1-XUR-SCRIPTED-OWNER-SWITCH-PROBE, path: reports/, retention-days: 90, if-no-files-found: error}
