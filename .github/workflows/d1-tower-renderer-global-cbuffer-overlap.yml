name: D1 Tower renderer global cbuffer overlap

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'D1 Tower common-layer pixel-shader disassembly'
      - 'D1 Tower light shader disassembly'
      - 'D1 Tower sky shader closure'
    types: [completed]
  push:
    paths:
      - '.github/workflows/d1-tower-renderer-global-cbuffer-overlap.yml'
      - 'tools/d1_shader_global_cbuffer_overlap.py'
      - 'tools/d1_github_actions_artifact_pull.py'

permissions:
  contents: read
  actions: read

jobs:
  overlap:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover latest exact common, light, and sky shader reports
        run: |
          set -euo pipefail
          mkdir -p input/common input/light input/sky reports

          common_run="$(gh run list --workflow d1-tower-common-layer-shader-disassembly.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          light_run="$(gh run list --workflow d1-tower-light-shader-disassembly.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          sky_run="$(gh run list --workflow d1-tower-sky-shader-closure.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$common_run" -a -n "$light_run" -a -n "$sky_run"

          python tools/d1_github_actions_artifact_pull.py \
            --repo "$GITHUB_REPOSITORY" --run-id "$common_run" \
            --artifact-name d1-tower-common65-pixel-shader-disassembly \
            --out-dir input/common --clean \
            --report reports/ARTIFACT_PULL_COMMON_SHADER.json
          python tools/d1_github_actions_artifact_pull.py \
            --repo "$GITHUB_REPOSITORY" --run-id "$light_run" \
            --artifact-name d1-tower-light-shader-disassembly \
            --out-dir input/light --clean \
            --report reports/ARTIFACT_PULL_LIGHT_SHADER.json
          python tools/d1_github_actions_artifact_pull.py \
            --repo "$GITHUB_REPOSITORY" --run-id "$sky_run" \
            --artifact-name d1-tower-sky-shader-closure \
            --out-dir input/sky --clean \
            --report reports/ARTIFACT_PULL_SKY_SHADER.json

          mkdir -p input/canonical
          find_one() {
            root="$1"; name="$2"; out="$3"
            mapfile -t hits < <(find "$root" -type f -name "$name" -print | sort)
            if [ "${#hits[@]}" -ne 1 ]; then
              echo "expected exactly one $name under $root, got ${#hits[@]}" >&2
              printf '%s\n' "${hits[@]}" >&2
              exit 1
            fi
            cp "${hits[0]}" "$out"
            printf 'CANONICAL_ARTIFACT_FILE %s <- %s\n' "$out" "${hits[0]}"
          }
          find_one input/common common65_shader_extract.json input/canonical/common_shader_extract.json
          find_one input/common common65_gcn_cbuffer_usage.json input/canonical/common_cbuffer_usage.json
          find_one input/light tower_light_shader_report.json input/canonical/light_shader_report.json
          find_one input/light tower_light_gcn_cbuffer_usage_v2.json input/canonical/light_cbuffer_usage.json
          find_one input/sky tower_sky_shader_report.json input/canonical/sky_shader_report.json
          find_one input/sky tower_sky_gcn_cbuffer_usage.json input/canonical/sky_cbuffer_usage.json

          python - <<'PY'
          import json
          common=json.load(open('input/canonical/common_shader_extract.json'))
          light=json.load(open('input/canonical/light_shader_report.json'))
          sky=json.load(open('input/canonical/sky_shader_report.json'))
          assert common['status']=='D1_WORLD_PIXEL_SHADER_GCN_EXACT' and common['selected_count']==65 and common['error_count']==0,common
          assert light['status']=='D1_WORLD_PIXEL_SHADER_GCN_EXACT' and light['selected_count']==32 and light['error_count']==0,light
          assert sky['status']=='D1_WORLD_PIXEL_SHADER_GCN_EXACT' and sky['selected_count']==43 and sky['error_count']==0,sky
          print('TOWER_RENDERER_DOMAIN_SHADER_COUNTS',65,32,43)
          PY

      - name: Prove exact cross-domain ImmConstBuffer recurrence
        run: |
          set -euo pipefail
          python tools/d1_shader_global_cbuffer_overlap.py \
            --extract common=input/canonical/common_shader_extract.json \
            --cbuffer common=input/canonical/common_cbuffer_usage.json \
            --extract light=input/canonical/light_shader_report.json \
            --cbuffer light=input/canonical/light_cbuffer_usage.json \
            --extract sky=input/canonical/sky_shader_report.json \
            --cbuffer sky=input/canonical/sky_cbuffer_usage.json \
            --out reports/TOWER_RENDERER_GLOBAL_CBUFFER_OVERLAP.json \
            | tee reports/TOWER_RENDERER_GLOBAL_CBUFFER_OVERLAP_stdout.txt

          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_RENDERER_GLOBAL_CBUFFER_OVERLAP.json'))
          assert d['status']=='D1_SHADER_GLOBAL_CBUFFER_OVERLAP_EXACT',d
          assert d['domain_count']==3,d
          assert set(d['domains'])=={'common','light','sky'},d
          assert d['semantic_boundary']['producer_objects']=='WITHHELD',d
          assert d['semantic_boundary']['live_runtime_values']=='WITHHELD',d
          print('TOWER_RENDERER_ALL_DOMAIN_SHARED_API_DWORDS',d['all_domain_shared_api_dwords'])
          for r in d['recurrence_rows'][:80]:
              if r['domain_count']>=2:
                  print('TOWER_RENDERER_RECURRENT_CBUFFER',
                        'API',r['api_slot'],'DWORD',r['dword'],
                        'DOMAINS',r['domains'],'STATS',r['domain_stats'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-TOWER-RENDERER-GLOBAL-CBUFFER-OVERLAP
          path: reports/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
