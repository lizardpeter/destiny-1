name: D1 Tower renderer global cbuffer overlap

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'D1 Tower common-layer pixel-shader disassembly'
      - 'D1 Tower light shader disassembly'
      - 'D1 Tower sky shader closure'
    types: [completed]
  push:
    paths:
      - '.github/workflows/d1-tower-renderer-global-cbuffer-overlap.yml'
      - 'tools/d1_shader_global_cbuffer_overlap.py'
      - 'tools/d1_shader_global_cbuffer_terminal_impact.py'
      - 'tools/d1_ps4_cbuffer_scope_name_proof.py'
      - 'tools/d1_tower_renderer_scope_terminal_contract.py'
      - 'evidence/d1_vex_09a_native_state_closure_2026-09-18.json'
      - 'tools/d1_github_actions_artifact_pull.py'

permissions:
  contents: read
  actions: read

jobs:
  overlap:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover latest exact common, light, and sky shader reports
        run: |
          set -euo pipefail
          mkdir -p input/common input/light input/sky reports

          common_run="$(gh run list --workflow d1-tower-common-layer-shader-disassembly.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          light_run="$(gh run list --workflow d1-tower-light-shader-disassembly.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          sky_run="$(gh run list --workflow d1-tower-sky-shader-closure.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$common_run" -a -n "$light_run" -a -n "$sky_run"

          python tools/d1_github_actions_artifact_pull.py \
            --repo "$GITHUB_REPOSITORY" --run-id "$common_run" \
            --artifact-name d1-tower-common65-pixel-shader-disassembly \
            --out-dir input/common --clean \
            --report reports/ARTIFACT_PULL_COMMON_SHADER.json
          python tools/d1_github_actions_artifact_pull.py \
            --repo "$GITHUB_REPOSITORY" --run-id "$light_run" \
            --artifact-name d1-tower-light-shader-disassembly \
            --out-dir input/light --clean \
            --report reports/ARTIFACT_PULL_LIGHT_SHADER.json
          python tools/d1_github_actions_artifact_pull.py \
            --repo "$GITHUB_REPOSITORY" --run-id "$sky_run" \
            --artifact-name d1-tower-sky-shader-closure \
            --out-dir input/sky --clean \
            --report reports/ARTIFACT_PULL_SKY_SHADER.json

          mkdir -p input/canonical
          find_one() {
            root="$1"; name="$2"; out="$3"
            mapfile -t hits < <(find "$root" -type f -name "$name" -print | sort)
            if [ "${#hits[@]}" -ne 1 ]; then
              echo "expected exactly one $name under $root, got ${#hits[@]}" >&2
              printf '%s\n' "${hits[@]}" >&2
              exit 1
            fi
            cp "${hits[0]}" "$out"
            printf 'CANONICAL_ARTIFACT_FILE %s <- %s\n' "$out" "${hits[0]}"
          }
          find_one input/common common65_shader_extract.json input/canonical/common_shader_extract.json
          find_one input/common common65_gcn_cbuffer_usage.json input/canonical/common_cbuffer_usage.json
          find_one input/light tower_light_shader_report.json input/canonical/light_shader_report.json
          find_one input/light tower_light_gcn_cbuffer_usage_v2.json input/canonical/light_cbuffer_usage.json
          find_one input/sky tower_sky_shader_report.json input/canonical/sky_shader_report.json
          find_one input/sky tower_sky_gcn_cbuffer_usage.json input/canonical/sky_cbuffer_usage.json
          find_one input/common common65_all_mrt0_dependencies.json input/canonical/common_terminal_mrt0.json
          find_one input/light tower_light_all32_mrt0_dependencies.json input/canonical/light_terminal_mrt0.json
          find_one input/sky tower_sky_all_mrt0_dependencies.json input/canonical/sky_terminal_mrt0.json

          python - <<'PY'
          import json
          common=json.load(open('input/canonical/common_shader_extract.json'))
          light=json.load(open('input/canonical/light_shader_report.json'))
          sky=json.load(open('input/canonical/sky_shader_report.json'))
          assert common['status']=='D1_WORLD_PIXEL_SHADER_GCN_EXACT' and common['selected_count']==65 and common['error_count']==0,common
          assert light['status']=='D1_WORLD_PIXEL_SHADER_GCN_EXACT' and light['selected_count']==32 and light['error_count']==0,light
          assert sky['status']=='D1_WORLD_PIXEL_SHADER_GCN_EXACT' and sky['selected_count']==43 and sky['error_count']==0,sky
          print('TOWER_RENDERER_DOMAIN_SHADER_COUNTS',65,32,43)
          PY

      - name: Prove exact cross-domain ImmConstBuffer recurrence
        run: |
          set -euo pipefail
          python tools/d1_shader_global_cbuffer_overlap.py \
            --extract common=input/canonical/common_shader_extract.json \
            --cbuffer common=input/canonical/common_cbuffer_usage.json \
            --extract light=input/canonical/light_shader_report.json \
            --cbuffer light=input/canonical/light_cbuffer_usage.json \
            --extract sky=input/canonical/sky_shader_report.json \
            --cbuffer sky=input/canonical/sky_cbuffer_usage.json \
            --out reports/TOWER_RENDERER_GLOBAL_CBUFFER_OVERLAP.json \
            | tee reports/TOWER_RENDERER_GLOBAL_CBUFFER_OVERLAP_stdout.txt

          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_RENDERER_GLOBAL_CBUFFER_OVERLAP.json'))
          assert d['status']=='D1_SHADER_GLOBAL_CBUFFER_OVERLAP_EXACT',d
          assert d['domain_count']==3,d
          assert set(d['domains'])=={'common','light','sky'},d
          assert d['semantic_boundary']['producer_objects']=='WITHHELD',d
          assert d['semantic_boundary']['live_runtime_values']=='WITHHELD',d
          print('TOWER_RENDERER_ALL_DOMAIN_SHARED_API_DWORDS',d['all_domain_shared_api_dwords'])
          for r in d['recurrence_rows'][:80]:
              if r['domain_count']>=2:
                  print('TOWER_RENDERER_RECURRENT_CBUFFER',
                        'API',r['api_slot'],'DWORD',r['dword'],
                        'DOMAINS',r['domains'],'STATS',r['domain_stats'])
          PY

      - name: Separate recurrent reads from terminal MRT0 impact
        run: |
          set -euo pipefail
          python tools/d1_shader_global_cbuffer_terminal_impact.py \
            --overlap reports/TOWER_RENDERER_GLOBAL_CBUFFER_OVERLAP.json \
            --terminal common=input/canonical/common_terminal_mrt0.json \
            --terminal light=input/canonical/light_terminal_mrt0.json \
            --terminal sky=input/canonical/sky_terminal_mrt0.json \
            --out reports/TOWER_RENDERER_GLOBAL_CBUFFER_TERMINAL_IMPACT.json \
            | tee reports/TOWER_RENDERER_GLOBAL_CBUFFER_TERMINAL_IMPACT_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_RENDERER_GLOBAL_CBUFFER_TERMINAL_IMPACT.json'))
          assert d['status']=='D1_SHADER_GLOBAL_CBUFFER_TERMINAL_IMPACT_EXACT',d
          assert d['domain_count']==3 and set(d['domains'])=={'common','light','sky'},d
          # API0 is the domain-local material/light/sky payload and is expected
          # to influence terminal output in all three domains.  The renderer-global
          # question is whether recurrent API12/API13 reads survive to MRT0.
          all3_terminal=d['all_three_domain_terminal_impact_dwords']
          assert all(x['api_slot']==0 for x in all3_terminal),all3_terminal
          expected={(12,48),(12,49),(12,50),(12,51)}
          got={(x['api_slot'],x['dword']) for x in d['all_three_domain_read_only_dwords']}
          assert expected.issubset(got),(expected,got)
          by={(x['api_slot'],x['dword']):x for x in d['rows']}
          for dw in (48,49,50,51):
              assert by[(12,dw)]['impact_class']=='READ_ONLY_NO_TERMINAL_IMPACT',by[(12,dw)]
          assert by[(13,6)]['terminal_domains']==['common','sky'],by[(13,6)]
          assert by[(13,7)]['terminal_domains']==['common','sky'],by[(13,7)]
          for dw in (28,29,30):
              assert by[(12,dw)]['terminal_domains']==['common','sky'],by[(12,dw)]
          assert by[(12,31)]['terminal_domain_count']==0,by[(12,31)]
          print('TOWER_RENDERER_ALL3_READ_ONLY',d['all_three_domain_read_only_dwords'])
          print('TOWER_RENDERER_ALL3_TERMINAL_API0',all3_terminal)
          print('TOWER_RENDERER_TERMINAL_API13_6',by[(13,6)])
          print('TOWER_RENDERER_TERMINAL_API13_7',by[(13,7)])
          print('TOWER_RENDERER_TERMINAL_API12_28_30',[by[(12,x)] for x in (28,29,30)])
          PY

      - name: Join exact View Frame scope names to Tower terminal impact
        run: |
          set -euo pipefail
          mkdir -p source
          curl -fsSL --retry 4 \
            'https://raw.githubusercontent.com/MontagueM/Charm/50d36ee1f9ecadad7522504c20b1f3f9c97e30af/Tiger/Schema/Shaders/TFX%20Bytecode/Externs.cs' \
            -o source/Externs.cs
          test "$(git hash-object source/Externs.cs)" = '7311688c71ab3a9e9d6eacd5393d07254688bace'

          python -m py_compile \
            tools/d1_ps4_cbuffer_scope_name_proof.py \
            tools/d1_tower_renderer_scope_terminal_contract.py

          python tools/d1_ps4_cbuffer_scope_name_proof.py \
            --charm-externs source/Externs.cs \
            --vex-proof evidence/d1_vex_09a_native_state_closure_2026-09-18.json \
            -o reports/D1_PS4_CBUFFER_SCOPE_NAME_PROOF.json

          python tools/d1_tower_renderer_scope_terminal_contract.py \
            --scope-proof reports/D1_PS4_CBUFFER_SCOPE_NAME_PROOF.json \
            --terminal-impact reports/TOWER_RENDERER_GLOBAL_CBUFFER_TERMINAL_IMPACT.json \
            --out reports/TOWER_RENDERER_SCOPE_TERMINAL_CONTRACT.json

          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_RENDERER_SCOPE_TERMINAL_CONTRACT.json'))
          assert d['status']=='D1_TOWER_RENDERER_SCOPE_TERMINAL_CONTRACT_EXACT',d
          assert not d['violations'],d['violations']
          by={x['api_slot']:x for x in d['scopes']}
          assert by[12]['source_scope_name']=='View',by[12]
          assert by[13]['source_scope_name']=='Frame',by[13]
          assert [(x['dword'],x['terminal_domains']) for x in by[12]['terminal_dwords']]==[
              (28,['common','sky']),(29,['common','sky']),(30,['common','sky'])],by[12]
          assert [(x['dword'],x['terminal_domains']) for x in by[13]['terminal_dwords']]==[
              (6,['common','sky']),(7,['common','sky'])],by[13]
          assert d['negative_boundaries']=={
              'api12_28_30_light_terminal_impact':False,
              'api13_6_7_light_terminal_impact':False,
              'api12_31_terminal_impact':False,
          },d
          assert d['semantic_boundary']['runtime_writer']=='WITHHELD',d
          assert d['semantic_boundary']['live_values']=='WITHHELD',d
          print('TOWER_RENDERER_SCOPE_TERMINAL_CONTRACT_EXACT',
                [(x['api_slot'],x['source_scope_name'],
                  [(q['dword'],q['terminal_domains']) for q in x['terminal_dwords']])
                 for x in d['scopes']])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-TOWER-RENDERER-GLOBAL-CBUFFER-OVERLAP
          path: reports/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
