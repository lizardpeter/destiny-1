name: D1 InputUsage Runtime Frontier

on:
  push:
    paths:
      - '.github/workflows/d1-input-usage-runtime-frontier.yml'
      - 'tools/d1_input_usage_runtime_frontier.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EBOOT_URL: https://r2.houseofkublai.com/destiny/CUSA00219_01.33/eboot.bin
      EBOOT_SHA256: 672f03411c0503dfbcda804cbb9fb27cdd9a8d73a8bcb71bf0c4f688073b0833
      EBOOT_SIZE: '29249016'
      CODEGRAPH_ARTIFACT_ID: '10939012869'

    steps:
      - uses: actions/checkout@v4
      - name: Install Capstone
        run: python -m pip install --disable-pip-version-check -q capstone

      - name: Recover exact owner-provided eboot
        run: |
          set -euo pipefail
          mkdir -p build/input-usage
          curl --fail --location --retry 4 --retry-delay 2 "$EBOOT_URL" -o build/input-usage/eboot.bin
          test "$(stat -c %s build/input-usage/eboot.bin)" = "$EBOOT_SIZE"
          echo "$EBOOT_SHA256  build/input-usage/eboot.bin" | sha256sum --check --strict

      - name: Recover exact-build code graph and renderer frontier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 4             -H "Authorization: Bearer $GH_TOKEN"             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CODEGRAPH_ARTIFACT_ID}/zip"             -o build/input-usage/codegraph.zip
          unzip -q build/input-usage/codegraph.zip -d build/input-usage/codegraph
          test -f build/input-usage/codegraph/ghidra_code_graph.json.gz
          test -f build/input-usage/codegraph/renderer_frontier.json

      - name: Find InputUsageSlot runtime dispatcher
        run: |
          set -euo pipefail
          python tools/d1_input_usage_runtime_frontier.py             build/input-usage/eboot.bin             --codegraph build/input-usage/codegraph/ghidra_code_graph.json.gz             --renderer-frontier build/input-usage/codegraph/renderer_frontier.json             --top 160             --out build/input-usage/d1_input_usage_runtime_frontier.json

      - name: Summarize
        run: |
          python - <<'PY'
          import json
          d=json.load(open('build/input-usage/d1_input_usage_runtime_frontier.json'))
          print('candidates',d['candidate_count'])
          for r in d['candidates'][:60]:
              print(
                  r['entry_hex'],
                  'score',r['score'],
                  'ins',r['instruction_count'],
                  'renderer_distance',r['renderer_distance'],
                  'usage',[x['name'] for x in r['usage_values']],
                  'cmp',[x['name'] for x in r['comparison_usage_values']],
              )
              for h in r['hits'][:20]:
                  print(' ',h['address_hex'],h['mnemonic'],h['op_str'],[x['name'] for x in h['usage_values']])
          PY

      - name: Remove executable
        if: always()
        run: rm -f build/input-usage/eboot.bin build/input-usage/codegraph.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-input-usage-runtime-frontier
          path: build/input-usage/d1_input_usage_runtime_frontier.json
          if-no-files-found: warn
          retention-days: 30
