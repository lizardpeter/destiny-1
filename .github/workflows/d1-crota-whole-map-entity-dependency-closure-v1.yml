name: D1 Crota whole-map SEntity dependency closure v1

on:
  push:
    paths:
      - '.github/workflows/d1-crota-whole-map-entity-dependency-closure-v1.yml'
      - 'tools/d1_world_map_entity_owner_dependency_closure.py'
      - 'tools/d1_world_map_entity_runtime_placements.py'
      - 'tools/d1_expand_world_entity_dependencies_indexed.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_ENTITY_CENSUS_ARTIFACT_ID: '10037939515'
  SOURCE_ENTITY_CENSUS_ZIP_SHA256: '7b84d4ef6ed9c88c5a3970e6d95a22d9bcee8ac8c9d64db5f9ec2b3c31e50383'

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover green whole-Activity map census and current archive identity
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check numpy
          mkdir -p input runtime packages entity_expanded reports/entity_dependency_passes out
          curl -fsSL --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ENTITY_CENSUS_ARTIFACT_ID}/zip" \
            -o input/source.zip
          echo "${SOURCE_ENTITY_CENSUS_ZIP_SHA256}  input/source.zip" | sha256sum --check --strict
          unzip -q input/source.zip -d input/source
          python - <<'PY'
          import json
          p='input/source/map_entity_seeds.json'
          d=json.load(open(p))
          assert d['status']=='D1_CROTA_WHOLE_ACTIVITY_MAP_ENTITY_SEEDS_EXACT',d
          assert d['placement_count']==1535,d
          assert d['unique_entity_count']==81,d
          assert d['entity_owner_package_family_count']==10,d
          assert d['placement_entity_reference_class_counts']=={'80800734':1535},d
          assert d['unique_entity_reference_class_counts']=={'80800734':81},d
          print('SOURCE_ENTITY_CENSUS_ACCEPTED',d['placement_count'],d['unique_entity_count'])
          PY
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' \
            -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' \
            -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 8 --retry-delay 3 \
            'https://github.com/lizardpeter/destiny-1/releases/download/d1-global-activity-index-r1/D1_CURRENT_ACTIVITY_INDEX.json' \
            -o reports/D1_CURRENT_ACTIVITY_INDEX.json
          curl --fail --location --retry 4 \
            'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' \
            -o reports/packages.txt
          python - <<'PY'
          import hashlib,json
          d=json.load(open('reports/D1_CURRENT_ACTIVITY_INDEX.json'))
          actual=hashlib.sha256(open('reports/packages.txt','rb').read()).hexdigest()
          assert d['status']=='D1_REMOTE_ACTIVITY_INDEX_COMPLETE',d.get('status')
          assert actual==(d.get('source') or {}).get('package_list_sha256'),(actual,(d.get('source') or {}).get('package_list_sha256'))
          print('ARCHIVE_INDEX_ACCEPTED',actual)
          PY

      - name: Close exact map-entry entity owner package families generically
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python tools/d1_world_map_entity_owner_dependency_closure.py \
            --index reports/D1_CURRENT_ACTIVITY_INDEX.json \
            --package-list reports/packages.txt \
            --map-layer-json input/source/map_data_layer_census.json \
            --runtime runtime --package-dir packages \
            --work-dir reports/entity_owner_closure_work \
            --out reports/map_entity_owner_closure.json \
            --report reports/map_entity_owner_dependency_closure.json
          python - <<'PY'
          import json
          d=json.load(open('reports/map_entity_owner_closure.json'))
          r=json.load(open('reports/map_entity_owner_dependency_closure.json'))
          assert d['status']=='D1_WORLD_MAP_ENTITY_OWNER_DEPENDENCY_CLOSURE_COMPLETE',d['violations']
          assert r['status']=='D1_WORLD_MAP_ENTITY_OWNER_DEPENDENCY_CLOSURE_COMPLETE',r['violations']
          assert (d['placement_count'],d['unique_entity_count'],d['entity_owner_package_family_count'])==(1535,81,10),d
          assert d['placement_entity_reference_class_counts']=={'80800734':1535},d
          assert d['unique_entity_reference_class_counts']=={'80800734':81},d
          assert not d['unresolved_entity_hashes'],d['unresolved_entity_hashes']
          print('MAP_ENTITY_OWNERS_CLOSED',d['placement_count'],d['unique_entity_count'],d['entity_owner_package_ids'])
          PY

      - name: Build exact runtime placement view
        run: |
          set -euo pipefail
          python tools/d1_world_map_entity_runtime_placements.py \
            --owner-closure reports/map_entity_owner_closure.json \
            --out reports/map_entity_runtime_placements.json
          python - <<'PY'
          import json
          d=json.load(open('reports/map_entity_runtime_placements.json'))
          assert d['status']=='D1_WORLD_MAP_ENTITY_RUNTIME_PLACEMENTS_COMPLETE',d['violations']
          assert d['serialized_entity_placement_reference_count']==1535,d
          assert d['unique_runtime_world_placement_count']==1535,d
          assert d['sentinel_world_id_runtime_placement_count']==736,d
          assert d['duplicate_serialized_placement_reference_count']==0,d
          assert d['unique_entity_hash_count']==81,d
          print('RUNTIME_PLACEMENTS_CLOSED',d['unique_runtime_world_placement_count'],'sentinel',d['sentinel_world_id_runtime_placement_count'])
          PY

      - name: Recursively close all SEntity resources models skeletons and names
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python tools/d1_expand_world_entity_dependencies_indexed.py \
            --snapshot-dir packages \
            --runtime runtime \
            --placements reports/map_entity_runtime_placements.json \
            --index reports/D1_CURRENT_ACTIVITY_INDEX.json \
            --package-list reports/packages.txt \
            --expansion-dir entity_expanded \
            --work-dir reports/entity_dependency_passes \
            --out reports/map_entity_dependency_census.json \
            --report reports/map_entity_dependency_expansion.json
          python - <<'PY'
          import json
          d=json.load(open('reports/map_entity_dependency_census.json'))
          x=json.load(open('reports/map_entity_dependency_expansion.json'))
          assert x['status']=='D1_INDEXED_WORLD_ENTITY_DEPENDENCY_EXPANSION_CLOSED',x
          assert d['status']=='D1_WORLD_ENTITY_DEPENDENCY_CENSUS_COMPLETE',d
          assert d['placed_unique_entity_count']==81,d
          assert d['parsed_entity_count']==81,d
          assert not d['unresolved_dependency_hashes'],d['unresolved_dependency_hashes']
          print('ENTITY_DEPENDENCIES_CLOSED',json.dumps({k:d[k] for k in (
            'placed_unique_entity_count','parsed_entity_count','entity_resource_reference_count',
            'unique_entity_resource_hash_count','entity_composition_class_counts',
            'articulated_candidate_count','named_articulated_candidate_count',
            'unique_entity_name_hash_count','unique_embedded_model_count','unique_embedded_physics_model_count')},sort_keys=True))
          print('ENTITY_PACKAGE_EXPANSION',json.dumps({k:x[k] for k in (
            'initial_package_family_count','final_package_family_count','recovered_package_ids','stop_reason')},sort_keys=True))
          PY

      - name: Build exact articulated map-entity plan
        run: |
          set -euo pipefail
          python tools/d1_world_articulated_entity_plan.py \
            --placements reports/map_entity_runtime_placements.json \
            --entity-dependencies reports/map_entity_dependency_census.json \
            --out reports/map_articulated_entity_plan.json
          python - <<'PY'
          import json
          d=json.load(open('reports/map_articulated_entity_plan.json'))
          assert d['status']=='D1_WORLD_ARTICULATED_ENTITY_PLAN_COMPLETE',d['missing_placement_entities']
          print('ARTICULATED_MAP_PLAN',json.dumps({k:d[k] for k in (
            'candidate_count','rig_export_candidate_count','family_count','runtime_placement_count',
            'serialized_placement_reference_count','unique_model_count','unique_skeleton_resource_count',
            'unique_runtime_rig_resource_count','missing_placement_entities')},sort_keys=True))
          PY
          cp reports/map_entity_owner_closure.json out/
          cp reports/map_entity_owner_dependency_closure.json out/
          cp reports/map_entity_runtime_placements.json out/
          cp reports/map_entity_dependency_census.json out/
          cp reports/map_entity_dependency_expansion.json out/
          cp reports/map_articulated_entity_plan.json out/
          sha256sum out/* > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-WHOLE-MAP-SENTITY-CLOSURE-V1
          path: |
            out/
            reports/entity_dependency_passes/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
