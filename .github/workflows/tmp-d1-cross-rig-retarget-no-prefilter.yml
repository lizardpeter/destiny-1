name: Temporary test D1 cross-rig retarget without count prefilter

on:
  push:
    paths:
      - '.github/workflows/tmp-d1-cross-rig-retarget-no-prefilter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies and 0151
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy scipy pygltflib pyglm
          mkdir -p runtime recovered out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x45190B000 \
            --target ps4_globals_0151_0.pkg --target ps4_globals_0151_1.pkg --target ps4_globals_0151_2.pkg \
            --target ps4_globals_0151_3.pkg --target ps4_globals_0151_4.pkg --target ps4_globals_0151_5.pkg --target ps4_globals_0151_6.pkg \
            --out recovered --manifest out/0151_extract.json --retries 6 --timeout 90
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git tiger-animation-parser
          git -C tiger-animation-parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
      - name: Attempt all selected clips on all three owner rigs
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import io,json,sys,tempfile,traceback
          from pathlib import Path
          sys.path.insert(0,'tools');sys.path.insert(0,str(Path('tiger-animation-parser').resolve()))
          from d1_entry_extract import EntryReader
          from tag.game_version import Game_Version
          from tag_readers.read_skeleton import read_skeleton
          from tag_readers.read_rig import read_runtime_rig
          from tag_readers.read_animation import read_animation
          from animation_decoding.decode_animation import decode_animation
          from runtime_rig.rig_retarget import rig_retarget
          from animation_export.convert_animation_object_to_local import convert_obj_to_local

          PAIRS={
            'CA0':('80AA3CB2','80AA3CB3'),
            'CA1':('80AA3CB8','80AA3CB9'),
            'CA2':('80AA3CBE','80AA3CBF'),
          }
          CLIPS={
            'idle':'80AA3CD6','ready':'80AA3CDA','jump_a':'80AA3CE2','jump_b':'80AA3CE3',
            'ca0_reload':'80AA3CDB','ca0_fire':'80AA3CEC',
            'ca1_reload':'80AA3D2A','ca1_fire':'80AA3D2B',
            'ca2_reload':'80AA3D40','ca2_fire':'80AA3D42',
          }
          r=EntryReader(Path('recovered/ps4_globals_0151_6.pkg'),Path('runtime')); by={e['tag_hash'].upper():e for e in r.entries}
          def raw(t):return r.entry(by[t]['index'])
          ver=Game_Version.D1_ROI
          parsed_pairs={}
          for owner,(rt,st) in PAIRS.items():
            parsed_pairs[owner]=(read_runtime_rig(io.BytesIO(raw(rt)),ver),read_skeleton(io.BytesIO(raw(st)),ver))
          parsed_clips={}
          for name,t in CLIPS.items():
            with tempfile.NamedTemporaryFile() as f:
              f.write(raw(t));f.flush();f.seek(0);a=read_animation(f,ver)
            h=a.animation_header
            parsed_clips[name]=(a,{'tag':t,'frames':int(h.frame_count),'node_count':int(h.node_count),'rig_control_count':int(h.rig_control_count)})
          rows=[]
          for cname,(anim,cm) in parsed_clips.items():
            for owner,(rig,sk) in parsed_pairs.items():
              q={'clip_name':cname,**cm,'owner':owner,'rig':PAIRS[owner][0],'skeleton':PAIRS[owner][1],
                 'skeleton_nodes':len(sk.node_defs),'rig_controls':len(rig.controls_relations)}
              try:
                dec=decode_animation(anim)
                q['decoded_tracks']=len(dec)
                ret=rig_retarget(anim,dec,sk,rig)
                q['retargeted_tracks']=len(ret)
                loc=convert_obj_to_local(anim,ret,sk)
                q['local_tracks']=len(loc);q['success']=True
              except Exception as ex:
                q['success']=False;q['error_type']=type(ex).__name__;q['error']=str(ex);q['trace_tail']=traceback.format_exc().splitlines()[-8:]
              rows.append(q)
          rep={'pairs':{k:{'rig':v[0],'skeleton':v[1]} for k,v in PAIRS.items()},'clips':{k:v[1] for k,v in parsed_clips.items()},'tests':rows,
               'policy':'No node/control count prefilter. Every clip is actually decode->rig_retarget->convert_obj_to_local attempted against every owner pair.'}
          Path('out/cross_rig_retarget_no_prefilter.json').write_text(json.dumps(rep,indent=2)+'\n')
          for q in rows:
            print(q['clip_name'],q['owner'],'clip',q['node_count'],q['rig_control_count'],'target',q['skeleton_nodes'],q['rig_controls'],'SUCCESS' if q['success'] else q['error_type']+':'+q['error'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-cross-rig-retarget-no-prefilter
          path: out/
          retention-days: 7
          if-no-files-found: error
