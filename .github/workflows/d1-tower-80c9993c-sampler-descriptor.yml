name: D1 Tower 80C9993C sampler descriptor

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-80c9993c-sampler-descriptor.yml'
      - 'tools/d1_material_decode.py'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact Tower source families and runtime
        run: |
          set -euo pipefail
          mkdir -p index runtime packages reports
          idx_run="$(gh run list --workflow d1-global-activity-index.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$idx_run"
          gh run download "$idx_run" -n d1-global-activity-index -D index
          cp "$(find index -name D1_CURRENT_ACTIVITY_INDEX.json -print -quit)" reports/D1_CURRENT_ACTIVITY_INDEX.json
          cp "$(find index -name packages.txt -print -quit)" reports/packages.txt
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_recover_indexed_package_families.py \
            --index reports/D1_CURRENT_ACTIVITY_INDEX.json --package-list reports/packages.txt \
            --package-id 024c --package-id 0250 --out-dir packages --report reports/recovery.json

      - name: Dump exact material sampler descriptors
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import d1_tower_map_schema_validate as schema
          from d1_material_decode import parse_material

          c=schema.Corpus([p.resolve() for p in sorted(Path('packages').glob('*.pkg'))],Path('runtime').resolve())
          b,src=c.payload('80C9993C')
          assert b is not None,src
          d=parse_material(b,'PS4')
          assert d['vertex_shader']=='80CA0CB7',d
          assert d['pixel_shader']=='80C9994A',d
          out={
            'schema_version':1,
            'status':'D1_80C9993C_EXACT_RAW_SAMPLER_DESCRIPTORS',
            'material':'80C9993C',
            'payload_source':src,
            'vertex_shader':d['vertex_shader'],
            'pixel_shader':d['pixel_shader'],
            'vs_textures':d['vs_textures'],
            'ps_textures':d['ps_textures'],
            'vs_samplers':d['vs_samplers'],
            'ps_samplers':d['ps_samplers'],
            'vs_vector4_container':d['vs_vector4_container'],
            'ps_vector4_container':d['ps_vector4_container'],
            'boundary':'Sampler descriptor dwords are preserved exactly. Address/filter semantics remain syntactic until independently matched to PS4 GNM bit definitions.'
          }
          Path('reports/80C9993C_raw_sampler_descriptors.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-80c9993c-sampler-descriptor
          path: reports/
          retention-days: 14
