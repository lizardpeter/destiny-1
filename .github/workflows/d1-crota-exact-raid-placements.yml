name: D1 Crota's End exact runtime placements

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-exact-raid-placements.yml'
      - 'tools/d1_remote_activity_placements.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  CROTA_NAMES_ARTIFACT_ID: '9995889882'

jobs:
  placements:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact catalog and resolved candidate names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog input/names runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CROTA_NAMES_ARTIFACT_ID}/zip" -o input/names.zip
          unzip -q input/names.zip -d input/names
          test -f input/names/CROTA_CANDIDATE_NAMES.json
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Traverse only moon_raid_1 scenario_client
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_remote_activity_placements.py
          set +e
          python tools/d1_remote_activity_placements.py \
            --activity-hash 8108E004 --activity-name 'moon_raid_1:scenario_client' --activity-class 80800616 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            --entity-names input/names/CROTA_CANDIDATE_NAMES.json \
            -o out/CROTA_END_RUNTIME_PLACEMENTS.json | tee out/stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
      - name: Lock exact raid-root ownership
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_END_RUNTIME_PLACEMENTS.json'))
          assert d['activity']['tag_hash']=='8108E004'
          assert d['activity']['name']=='moon_raid_1:scenario_client'
          assert d['serialized_placement_count']>0,d
          assert d['runtime_placement_count']>0,d
          print('CROTA_END_PLACEMENTS',d['runtime_placement_count'],'UNIQUE_ENTITIES',d['unique_entity_count'])
          print('NAMES',d['resolved_name_counts'])
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-END-RUNTIME-PLACEMENTS
          path: out/
          retention-days: 14
          if-no-files-found: error
