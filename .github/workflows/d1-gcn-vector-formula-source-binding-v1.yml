name: D1 GCN vector formula source binding v1

on:
  workflow_dispatch:
  push:
    branches:
      - d1-crota-source-semantics-v1
    paths:
      - 'tools/d1_gcn_vector_formula_source_binding_v1.py'
      - 'tools/d1_gcn_vector_formula_source_binding_corpus_replay_v1.py'
      - '.github/workflows/d1-gcn-vector-formula-source-binding-v1.yml'

permissions:
  contents: read
  actions: read

env:
  STRUCTURAL_ARTIFACT_ID: '10087524653'
  STRUCTURAL_ARTIFACT_ZIP_SHA256: 'd806e55c856546df11416e0677989a34f5b454189d10f713da38b93501ec50fb'
  STRUCTURAL_CENSUS_SHA256: '5477f5a4194303b266dabdb22b10f050001011b1f61708c18877736273f800ed'

jobs:
  formula-source-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify frozen architecture prerequisites
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/d1_gcn_vector_formula_source_binding_v1.py \
            tools/d1_gcn_vector_formula_source_binding_corpus_replay_v1.py
          python - <<'PY'
          import json
          f=json.load(open('evidence/d1_gcn_vector_formula_lane_binding_v1_2026-09-09.json'))
          s=json.load(open('evidence/d1_gcn_sgpr_ssa_v1_2026-09-09.json'))
          assert f['status']=='D1_GCN_VECTOR_FORMULA_LANE_BINDING_CORPUS_EXACT',f
          assert f['coverage']['formula_instruction_count']==2994322,f['coverage']
          assert f['coverage']['formula_result_component_binding_count']==2994369,f['coverage']
          assert f['violations']==[],f['violations']
          assert s['status']=='D1_GCN_SGPR_SSA_CORPUS_REPLAY_EXACT',s
          assert s['coverage']['exact_programs_replayed']==26464,s['coverage']
          assert s['coverage']['sgpr_use_entry_count']==4112684,s['coverage']
          assert s['violations']==[],s['violations']
          PY

      - name: Download exact structural corpus
        run: |
          set -euo pipefail
          mkdir -p source/structural out
          curl -fsSL --retry 4 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STRUCTURAL_ARTIFACT_ID}/zip" \
            -o source/structural.zip
          echo "$STRUCTURAL_ARTIFACT_ZIP_SHA256  source/structural.zip" | sha256sum --check --strict
          unzip -q source/structural.zip \
            'out/D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS_PS_VS_DS.json' \
            'work/ir/*' \
            -d source/structural
          echo "$STRUCTURAL_CENSUS_SHA256  source/structural/out/D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS_PS_VS_DS.json" | sha256sum --check --strict
          test "$(find source/structural/work/ir -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 26464

      - name: Bind all vector formula sources to exact state identities
        run: |
          set -euo pipefail
          python tools/d1_gcn_vector_formula_source_binding_corpus_replay_v1.py \
            --workers 2 \
            --ir-dir source/structural/work/ir \
            --census source/structural/out/D1_GCN_SHADER_CORPUS_STRUCTURAL_CENSUS_PS_VS_DS.json \
            -o out/D1_GCN_VECTOR_FORMULA_SOURCE_BINDING_CORPUS_V1.json \
            | tee out/formula_source_binding_stdout.txt

      - name: Fail closed on exact source-state integration
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/D1_GCN_VECTOR_FORMULA_SOURCE_BINDING_CORPUS_V1.json'))
          assert d['status']=='D1_GCN_VECTOR_FORMULA_SOURCE_BINDING_CORPUS_EXACT',d['violations'][:100]
          assert not d['violations']
          c=d['coverage']
          assert c['exact_programs_replayed']==26464,c
          assert c['stage_program_counts']=={'DS':20,'PS':18375,'VS':8069},c
          assert c['exact_instructions_replayed']==4896165,c
          assert c['formula_instruction_count']==2994322,c
          assert c['formula_source_slot_count']==c['exact_formula_source_binding_count'],c
          assert c['vgpr_source_slot_count']+c['sgpr_source_slot_count']+c['literal_source_slot_count']==c['formula_source_slot_count'],c
          assert c['sgpr_placeholder_replacement_count']==c['sgpr_source_slot_count'],c
          assert c['formula_source_placeholder_leak_count']==0,c
          assert c['shader_expression_semantic_promotions']==0,c
          print('D1_GCN_VECTOR_FORMULA_SOURCE_BINDING_CORPUS_EXACT')
          print(json.dumps(c,sort_keys=True))
          PY
          sha256sum out/D1_GCN_VECTOR_FORMULA_SOURCE_BINDING_CORPUS_V1.json > out/SHA256SUMS.txt
          printf '%s\n' "$STRUCTURAL_ARTIFACT_ID" > out/SOURCE_STRUCTURAL_ARTIFACT_ID.txt
          printf '%s\n' "$GITHUB_SHA" > out/SOURCE_COMMIT_SHA.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-GCN-VECTOR-FORMULA-SOURCE-BINDING-V1
          path: out/
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
