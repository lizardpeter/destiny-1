name: D1 Tower Xur exact shader semantic frontier

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-xur-shader-semantic-frontier.yml'
      - 'tools/d1_xur_shader_semantic_frontier.py'
      - 'tools/d1_xur_ps_80876edf_semantic_proof.py'

permissions:
  contents: read
  actions: read

env:
  SHADER_CENSUS_ARTIFACT_ID: '10027557806'
  SHADER_CENSUS_ZIP_SHA256: 'e26febd88c0fcc05d998ec7dab04efcf1582095ee594a459ec472c530c7a5086'
  MATERIAL_STATE_ARTIFACT_ID: '10028092407'
  MATERIAL_STATE_ZIP_SHA256: '83c5b4af4590d986fb917ddc9da4098e2d1272ad30025db8395f53cac61e4407'

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover pinned exact shader and material-state checkpoints
        run: |
          set -euo pipefail
          mkdir -p input/shader input/state reports
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SHADER_CENSUS_ARTIFACT_ID}/zip" -o input/shader.zip
          echo "${SHADER_CENSUS_ZIP_SHA256}  input/shader.zip" | sha256sum --check --strict
          unzip -q input/shader.zip -d input/shader
          test -f input/shader/reports/xur_shader_disassembly_census.json
          test -f input/shader/reports/xur_ps_image_usage.json
          test -f input/shader/reports/xur_material_texture_manifest.json
          test -f input/shader/disasm/PS_80876EDF.s

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${MATERIAL_STATE_ARTIFACT_ID}/zip" -o input/state.zip
          echo "${MATERIAL_STATE_ZIP_SHA256}  input/state.zip" | sha256sum --check --strict
          unzip -q input/state.zip -d input/state
          test -f input/state/xur_material_stage_state.json
          test -f input/state/XUR_MATERIAL_LOCAL_STATE_CHECKPOINT.json

      - name: Build fail-closed shader semantic lifting frontier
        run: |
          set -euo pipefail
          python tools/d1_xur_shader_semantic_frontier.py \
            --material-state input/state/xur_material_stage_state.json \
            --shader-census input/shader/reports/xur_shader_disassembly_census.json \
            --image-usage input/shader/reports/xur_ps_image_usage.json \
            --out reports/XUR_SHADER_SEMANTIC_FRONTIER.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('reports/XUR_SHADER_SEMANTIC_FRONTIER.json'))
          assert d['status']=='D1_XUR_SHADER_SEMANTIC_LIFTING_FRONTIER_EXACT',d
          assert d['material_count']==54,d
          assert d['shader_header_count']==36,d
          assert d['native_gcn_program_count']==31,d
          assert d['exact_ps_image_instruction_count']==116,d
          assert d['stage_structural_unit_count']==38,d
          assert d['vs_stage_structural_unit_count']==12,d
          assert d['ps_stage_structural_unit_count']==26,d
          assert d['material_structural_family_count']==33,d
          assert not d['violations'],d['violations']

          lines=[
            '# Xur exact shader semantic lifting frontier', '',
            f"Status: `{d['status']}`", '',
            f"- Materials: **{d['material_count']}**",
            f"- Shader headers: **{d['shader_header_count']}**",
            f"- Unique bounded native GCN programs: **{d['native_gcn_program_count']}**",
            f"- Exact PS image instructions: **{d['exact_ps_image_instruction_count']}**",
            f"- Stage structural lifting units: **{d['stage_structural_unit_count']}** ({d['vs_stage_structural_unit_count']} VS + {d['ps_stage_structural_unit_count']} PS)",
            f"- Combined material structural families: **{d['material_structural_family_count']}**", '',
            '## Highest-coverage native GCN programs', '',
          ]
          for r in d['native_gcn_lifting_queue'][:12]:
            lines.append(f"- `{r['gcn_sha256']}` — {r['material_count']} materials, stage(s) {','.join(r['stages'])}, ~{r['instruction_count_approx']} instructions, headers {', '.join(r['shader_headers'])}")
          lines += ['', '## Highest-coverage material structural families', '']
          for r in d['material_structural_families'][:12]:
            lines.append(f"- `{r['family_id']}` — {r['material_count']} materials; PS ~{r['ps_instruction_count_approx']} instructions / {r['ps_image_instruction_count']} exact image ops; members {', '.join(r['materials'])}")
          lines += ['', 'This is an exact work-reduction frontier, not a claim of completed shader semantics. Literal texture TagHashes and literal constant values remain per-material parameters.']
          Path('reports/XUR_SHADER_SEMANTIC_FRONTIER.md').write_text('\n'.join(lines)+'\n')
          PY

      - name: Lift highest-coverage PS 80876EDF dataflow exactly
        run: |
          set -euo pipefail
          python tools/d1_xur_ps_80876edf_semantic_proof.py \
            --material-state input/state/xur_material_stage_state.json \
            --shader-census input/shader/reports/xur_shader_disassembly_census.json \
            --image-usage input/shader/reports/xur_ps_image_usage.json \
            --texture-manifest input/shader/reports/xur_material_texture_manifest.json \
            --disassembly input/shader/disasm/PS_80876EDF.s \
            --out reports/XUR_PS_80876EDF_SEMANTIC_PROOF.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('reports/XUR_PS_80876EDF_SEMANTIC_PROOF.json'))
          assert d['status']=='D1_XUR_PS_80876EDF_DATAFLOW_SEMANTICS_EXACT',d
          assert d['scope_material_count']==6,d
          assert d['pixel_shader_dataflow_complete_for_scoped_binary'] is True,d
          assert d['tfx_producer_semantics_complete'] is False,d
          assert d['portable_material_recreation_complete'] is False,d
          assert not d['violations'],d['violations']
          e=d['instruction_level_equations']
          lines=[
            '# Xur PS 80876EDF exact native dataflow', '',
            f"Status: `{d['status']}`", '',
            f"GCN SHA-256: `{d['gcn_sha256']}`", '',
            'Scoped materials: ' + ', '.join(f"`{x}`" for x in d['scope_materials']), '',
            '## Exact equations', '',
            f"- `{e['normal_xy_symbolic']}`",
            f"- `{e['normal_z']}`",
            f"- `{e['basis_transform']}`",
            f"- `{e['packing_scale']}`",
            f"- `{e['mrt1_rgb']}`",
            f"- `{e['mrt1_alpha_symbolic']}`",
            f"- `{e['mrt0_rgb']}`",
            f"- `{e['mrt0_alpha']}`", '',
            '## Proven texture roles', '',
            '- `t1`: signed XY normal-vector source (BC5 / linear).',
            '- `t0`: direct MRT0 RGB source (BC1 / native sRGB); higher-level albedo/base-color naming remains withheld.',
            '- `t2`: sampled-red normal-vector packing-scale modulator (BC1 / native sRGB); roughness/gloss naming remains withheld.', '',
            'This closes the native PS dataflow for this exact GCN binary, not TFX `Unk49` producer semantics, high-level render-target naming, or the full portable material/render-state implementation.'
          ]
          Path('reports/XUR_PS_80876EDF_SEMANTIC_PROOF.md').write_text('\n'.join(lines)+'\n')
          PY

      - name: Persist checkpoint provenance and hashes
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          out={
            'status':'D1_XUR_SHADER_SEMANTIC_LIFTING_FRONTIER_EXACT',
            'source_artifacts':{
              'native_shader_census':{
                'artifact_id':int(os.environ['SHADER_CENSUS_ARTIFACT_ID']),
                'zip_sha256':os.environ['SHADER_CENSUS_ZIP_SHA256'],
              },
              'material_local_state':{
                'artifact_id':int(os.environ['MATERIAL_STATE_ARTIFACT_ID']),
                'zip_sha256':os.environ['MATERIAL_STATE_ZIP_SHA256'],
              },
            },
            'workflow_commit':os.environ['GITHUB_SHA'],
            'promoted_pixel_shader_dataflow_proofs':[
              {'shader':'80876EDF','status':'D1_XUR_PS_80876EDF_DATAFLOW_SEMANTICS_EXACT','material_count':6}
            ],
            'semantic_recreation_complete':False,
            'permutation_selection_complete':False,
          }
          Path('reports/XUR_SHADER_SEMANTIC_FRONTIER_CHECKPOINT.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          find reports -type f -print0 | sort -z | xargs -0 sha256sum > reports/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-TOWER-XUR-EXACT-SHADER-SEMANTIC-FRONTIER
          path: reports/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
