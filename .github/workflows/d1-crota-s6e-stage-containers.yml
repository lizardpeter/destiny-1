name: D1 Crota exact S6E stage containers

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-s6e-stage-containers.yml'
      - 'tools/d1_remote_exact_tag_probe.py'
      - 'tools/d1_remote_catalog_backlinks.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Probe exact Crota and ultra-Knight S6E stage containers
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_exact_tag_probe.py \
            --tag-hash 0x8108E17C --tag-hash 0x8108E17F \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --min-string 4 \
            -o out/CROTA_S6E_STAGE_CONTAINERS.json | tee out/stdout.txt
      - name: Summarize exact S6E dependency classes
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,collections,re
          d=json.load(open('out/CROTA_S6E_STAGE_CONTAINERS.json'))
          assert d['violation_count']==0,d['violations']
          for x in d['entries']:
              assert x['entry']['reference']=='8080076E',x['entry']
              refs=collections.Counter(m['entry']['reference'] for m in x['aligned_resolved_tags'])
              unique=collections.defaultdict(set)
              for m in x['aligned_resolved_tags']:
                  unique[m['entry']['reference']].add(m['tag_hash'])
              print('S6E',x['tag_hash'],'SIZE',x['payload_size'],'SHA256',x['payload_sha256'])
              print(' REF_CLASSES',dict(refs))
              for ref,vals in sorted(unique.items()): print('  UNIQUE_CLASS',ref,len(vals),sorted(vals))
              for s in x['printable_strings']:
                  if re.search(r'crota|ultra|knight|boss|dark|lens|spawn|sword|cleaver|oversoul|final',s['string'],re.I):
                      print(' HIGH_STRING',x['tag_hash'],hex(s['offset']),repr(s['string']))
              for s in x['printable_strings']:
                  print(' STRING',x['tag_hash'],hex(s['offset']),repr(s['string']))
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-S6E-STAGE-CONTAINERS
          path: out/
          retention-days: 30
          if-no-files-found: error
