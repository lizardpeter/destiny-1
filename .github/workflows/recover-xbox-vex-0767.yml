name: Recover Xbox Vex 0767

on:
  push:
    paths:
      - '.github/workflows/recover-xbox-vex-0767.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Xbox mirrors and fetch 0767
        run: |
          set -u
          mkdir -p out
          : > out/probe.txt
          found=''
          for stem in xbox xboxone xb1; do
            base="https://crypt.cohae.dev/destiny/$stem/packages/latest"
            code=$(curl -L -sS -o "out/packages_${stem}.txt" -w '%{http_code}' "$base/packages.txt" || true)
            echo "$stem $code $(wc -c < "out/packages_${stem}.txt" 2>/dev/null || echo 0)" | tee -a out/probe.txt
            if [ "$code" = 200 ]; then
              found="$base"
              cp "out/packages_${stem}.txt" out/packages.txt
              break
            fi
          done
          if [ -z "$found" ]; then
            echo 'NO_XBOX_MANIFEST' | tee out/result.txt
            exit 0
          fi
          python - <<'PY'
          import re, pathlib
          text=pathlib.Path('out/packages.txt').read_text(errors='replace')
          matches=sorted(set(re.findall(r'[^\s"\'<>]*_0767_[01]\.pkg[^\s"\'<>]*', text, flags=re.I)))
          pathlib.Path('out/matches.txt').write_text('\n'.join(matches)+'\n')
          print('\n'.join(matches) if matches else 'NO_MATCH')
          PY
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            name="${f##*/}"
            code=$(curl -L -sS -o "out/$name" -w '%{http_code}' "$found/$name" || true)
            echo "$name HTTP=$code" | tee -a out/result.txt
            [ "$code" = 200 ] && { stat -c '%n %s bytes' "out/$name"; sha256sum "out/$name"; }
          done < out/matches.txt
      - name: Upload Xbox probe
        uses: actions/upload-artifact@v4
        with:
          name: xbox-vex-0767
          path: out/
          retention-days: 1
          if-no-files-found: error
