name: D1 API10 wrapper-native-program map proof
on:
  workflow_dispatch:
  push:
    branches: [d1-crota-source-semantics-v1]
    paths:
      - 'tools/d1_verify_api10_wrapper_native_program_map_v1.py'
      - 'evidence/d1_api10_wrapper_native_program_map_v1.json'
      - 'evidence/d1_api10_program_wrapper_material_index_v1.json'
      - '.github/workflows/d1-api10-wrapper-native-program-map.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover frozen material chain and verify map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input out
          curl -fL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10529319011/zip"             -o input/material.zip
          unzip -q input/material.zip -d input/material
          test -f input/material/D1_GCN_LOCALSHADER_API10_MATERIAL_CHAIN_V1.json
          echo "23415246337abdbb1543447e0123fa809027e3b9e94d5efee12a1476e7a2a113  input/material/D1_GCN_LOCALSHADER_API10_MATERIAL_CHAIN_V1.json" | sha256sum -c -
          python -m py_compile tools/d1_verify_api10_wrapper_native_program_map_v1.py
          python tools/d1_verify_api10_wrapper_native_program_map_v1.py             --map evidence/d1_api10_wrapper_native_program_map_v1.json             --index evidence/d1_api10_program_wrapper_material_index_v1.json             --material input/material/D1_GCN_LOCALSHADER_API10_MATERIAL_CHAIN_V1.json
          sha256sum evidence/d1_api10_wrapper_native_program_map_v1.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-API10-WRAPPER-NATIVE-PROGRAM-MAP
          path: |
            evidence/d1_api10_wrapper_native_program_map_v1.json
            out/SHA256SUMS.txt
          retention-days: 90
          if-no-files-found: error
