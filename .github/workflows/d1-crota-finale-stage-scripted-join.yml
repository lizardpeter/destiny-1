name: D1 Crota finale stage scripted join

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-finale-stage-scripted-join.yml'
      - 'tools/d1_remote_s6e_stage_probe.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  SCRIPTED_CENSUS_ARTIFACT_ID: '9997371058'
  SCRIPTED_CENSUS_ZIP_SHA256: '756a6ead36218efe3208532ba5b6b94c2769ffa71c3857af43e2ca01c44e8202'
  FAMILY_PREIMAGE_ARTIFACT_ID: '9998530596'
  FAMILY_PREIMAGE_ZIP_SHA256: '6c4e8710f4748743a21392d5dfc5b6d4d6d71bbda30eaab65dea31f620409885'

jobs:
  join:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover pinned catalogs and raid evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog input/census input/preimages runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SCRIPTED_CENSUS_ARTIFACT_ID}/zip" -o input/census.zip
          echo "${SCRIPTED_CENSUS_ZIP_SHA256}  input/census.zip" | sha256sum --check --strict
          unzip -q input/census.zip -d input/census

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FAMILY_PREIMAGE_ARTIFACT_ID}/zip" -o input/preimages.zip
          echo "${FAMILY_PREIMAGE_ZIP_SHA256}  input/preimages.zip" | sha256sum --check --strict
          unzip -q input/preimages.zip -d input/preimages

      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Decode exact raid-phase and ultra-Knight S6E stages
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_remote_s6e_stage_probe.py
          python tools/d1_remote_s6e_stage_probe.py \
            --s6e 0x8108E17C \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_RAID_PHASE_S6E_8108E17C.json \
            | tee out/e17c_stdout.txt
          python tools/d1_remote_s6e_stage_probe.py \
            --s6e 0x8108E17F \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_ULTRA_KNIGHT_S6E_8108E17F.json \
            | tee out/e17f_stdout.txt

      - name: Join stage-owned F603s to exact D912 actors and machine preimages
        run: |
          set -euo pipefail
          python - <<'PY' | tee out/summary.txt
          import collections,json
          census=json.load(open('input/census/CROTA_RAID_SCRIPTED_ENTITY_CENSUS.json'))
          preimages=json.load(open('input/preimages/CROTA_ALL_SCRIPT_FAMILY_STRINGHASH_PREIMAGES.json'))
          probes=[json.load(open('out/CROTA_RAID_PHASE_S6E_8108E17C.json')),
                  json.load(open('out/CROTA_ULTRA_KNIGHT_S6E_8108E17F.json'))]
          assert not census['violations'],census['violations']
          assert not preimages['errors'],preimages['errors']
          for p in probes: assert not p['violations'],p['violations']

          pre=collections.defaultdict(set)
          for h in preimages['hits']: pre[h['string_hash']].add(h['preimage'])
          table_by_hash={t['scripted_entity_table']:t for t in census['scripted_tables']}
          owner_by_f603={x['f603']:x for x in census['owners']}

          outputs=[]
          for p in probes:
              s6e=p['s6e']; stages=[]
              print('\nS6E',s6e,'STAGES',len(p['stages']))
              for s in p['stages']:
                  scripted=[]; machines=collections.defaultdict(set); entities=collections.Counter(); tables=[]
                  for f in s['f603s']:
                      fh=f['f603']['hash']; owner=owner_by_f603.get(fh)
                      if not owner: continue
                      th=owner.get('scripted_entity_table')
                      if not th: continue
                      t=table_by_hash[th]; tables.append(th)
                      fam=t.get('script_family_string_hash')
                      pnames=sorted(pre.get(fam,set()))
                      records=[]
                      for r in t.get('records',[]):
                          eh=r.get('entity_hash'); entities[eh]+=1
                          for n in pnames: machines[eh].add(n)
                          records.append({'entity_hash':eh,'type_string_hash':r.get('type_string_hash'),
                                          'entity_name_string_hash':r.get('entity_name_string_hash'),
                                          'world_id_hex':r.get('world_id_hex')})
                      scripted.append({'f603':fh,'entity_resource':owner.get('entity_resource'),
                                       'd912':th,'script_family_string_hash':fam,
                                       'machine_preimages':pnames,'records':records})
                  row={'stage_index':s['stage_index'],'map_data_table':s['map_data_table']['hash'],
                       'f603_count':len(s['f603s']),'scripted_owner_count':len(scripted),
                       'scripted_tables':scripted,'entity_record_counts':dict(entities),
                       'entity_machine_names':{h:sorted(v) for h,v in machines.items()}}
                  stages.append(row)
                  print(' STAGE',row['stage_index'],'MAP',row['map_data_table'],'F603',row['f603_count'],
                        'SCRIPTED',row['scripted_owner_count'],'ENTITIES',row['entity_record_counts'])
                  for h,names in sorted(row['entity_machine_names'].items()):
                      print('   ENTITY',h,'MACHINES',names)
              outputs.append({'s6e':s6e,'stage_count':len(stages),'stages':stages})

          # Exact locations of the two semantically important boss-alias tables.
          target_tables={'8108E300':'dark_lens.sq_crota','8108E361':'sq_ultra_knight'}
          locations=[]
          for o in outputs:
              for s in o['stages']:
                  for t in s['scripted_tables']:
                      if t['d912'] in target_tables:
                          locations.append({'d912':t['d912'],'machine':target_tables[t['d912']],
                                            's6e':o['s6e'],'stage_index':s['stage_index'],
                                            'f603':t['f603'],'entity_resource':t['entity_resource'],
                                            'records':t['records']})
          print('\nTARGET_TABLE_LOCATIONS',locations)
          out={'schema':'d1_crota_s6e_stage_scripted_join/v1',
               'status':'D1_CROTA_S6E_STAGE_SCRIPTED_JOIN_EXACT',
               'containers':outputs,'target_table_locations':locations,
               'policy':'S6E stage, F603, EntityResource and D912 ownership edges come from source-pinned layouts. Machine names are exact FNV1-32 retail preimages joined through each D912 script-family hash. No proximity inference is used.'}
          open('out/CROTA_S6E_STAGE_SCRIPTED_JOIN.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
          find out -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-FINALE-STAGE-SCRIPTED-JOIN
          path: out/
          retention-days: 30
          if-no-files-found: error
