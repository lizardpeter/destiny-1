name: D1 character corpus payload census

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['D1 archive character candidate index']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  base:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover latest exact character candidate index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input runtime out
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=D1-ARCHIVE-CHARACTER-CANDIDATE-INDEX&per_page=20" \
            | python -c "import json,sys; a=[x for x in json.load(sys.stdin)['artifacts'] if not x['expired']]; assert a; print(a[0]['archive_download_url'])")
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$url" -o input/candidates.zip
          unzip -q input/candidates.zip -d input/candidates
          test -f input/candidates/D1_CHARACTER_CANDIDATE_INDEX.json
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Probe every strong base character payload family
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_remote_character_corpus_probe.py
          python tools/d1_remote_character_corpus_probe.py \
            input/candidates/D1_CHARACTER_CANDIDATE_INDEX.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --kind base \
            --out out/D1_BASE_CHARACTER_CORPUS.json \
            | tee out/stdout.txt
      - name: Preserve structural census
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/D1_BASE_CHARACTER_CORPUS.json'))
          assert d['probed_family_count']>0
          assert d['structural_articulated_family_count']>0
          assert d['unique_ordered_skeleton_family_count']>0
          print(json.dumps({k:d[k] for k in ('status','requested_family_count','probed_family_count','fatal_family_count','structural_articulated_family_count','skeleton_occurrence_count','unique_ordered_skeleton_family_count','skeleton_bone_count_frequency')},indent=2))
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-BASE-CHARACTER-CORPUS
          path: out/
          retention-days: 14
          if-no-files-found: error
