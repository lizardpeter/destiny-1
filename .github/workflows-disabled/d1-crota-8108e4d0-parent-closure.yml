name: D1 Crota 8108E4D0 exact parent closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-8108e4d0-parent-closure.yml'
      - 'tools/d1_remote_catalog_entity_resource_probe.py'
      - 'tools/d1_remote_exact_tag_probe.py'
      - 'tools/d1_remote_catalog_backlinks.py'

permissions:
  contents: read
  actions: read

env:
  BASE_URL: https://crypt.cohae.dev/destiny/ps4/packages/latest
  CATALOG_ARTIFACT_ID: '9994811238'
  CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact catalog and runtime
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Decode exact 8108E4D0 EntityResource and payload
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python tools/d1_remote_catalog_entity_resource_probe.py \
            --tag-hash 0x8108E4D0 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url "$BASE_URL" --part-count 10 --runtime runtime \
            -o out/CROTA_8108E4D0_ENTITY_RESOURCE.json | tee out/resource_stdout.txt
          python tools/d1_remote_exact_tag_probe.py \
            --tag-hash 0x8108E4D0 --tag-hash 0x8108E5C3 --tag-hash 0x8108E671 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url "$BASE_URL" --part-count 10 --runtime runtime --min-string 4 \
            -o out/CROTA_8108E4D0_EXACT_TAGS.json | tee out/tags_stdout.txt
          python - <<'PY'
          import json
          r=json.load(open('out/CROTA_8108E4D0_ENTITY_RESOURCE.json'))
          assert not r['violations'],r['violations']
          e=r['entries'][0]; er=e['entity_resource']
          print('E4D0','REF',e['entry']['reference'],'SIZE',e['payload_size'],'ROLE',er.get('semantic_role'))
          print('U10',er.get('unk10_class') or (er.get('unk10') or {}).get('class_hash'),'U18',er.get('unk18_class') or (er.get('unk18') or {}).get('class_hash'))
          print('MATCHES',[(hex(x['offset']),x['tag_hash'],x['reference']) for x in e['aligned_resolved_tag_matches']])
          t=json.load(open('out/CROTA_8108E4D0_EXACT_TAGS.json'))
          assert t['violation_count']==0,t['violations']
          x=next(y for y in t['entries'] if y['tag_hash']=='8108E4D0')
          print('STRINGS',[(hex(y['offset']),y['string']) for y in x['printable_strings']])
          PY
      - name: Trace exact backlinks for parent and frontier entities
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python tools/d1_remote_catalog_backlinks.py \
            --scan-package-id 0x0447 --scan-package-id 0x044B --scan-package-id 0x0450 --scan-package-id 0x0458 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --target 0x8108E4D0 --target 0x8108E5C3 --target 0x8108E671 \
            --base-url "$BASE_URL" --part-count 10 --runtime runtime --max-entry-size 8000000 \
            -o out/CROTA_8108E4D0_BACKLINKS.json | tee out/backlinks_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_8108E4D0_BACKLINKS.json'))
          assert d['error_count']==0,d['errors']
          print('COUNTS',d['occurrences_by_target'])
          print('CLASSES',d['hit_sources_by_reference'])
          for x in d['hits']:
              print('BACKLINK',x['package_id'],x['source_tag_hash'],x['reference'],x['targets'])
          PY
      - name: Persist exact frontier checkpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          r=json.load(open('out/CROTA_8108E4D0_ENTITY_RESOURCE.json'))['entries'][0]
          b=json.load(open('out/CROTA_8108E4D0_BACKLINKS.json'))
          out={
            'schema':'d1_crota_8108e4d0_parent_closure/v1',
            'status':'D1_CROTA_8108E4D0_PARENT_CLOSURE_EXACT',
            'parent_resource':r,
            'backlinks':{'occurrences_by_target':b['occurrences_by_target'],'hit_sources_by_reference':b['hit_sources_by_reference'],'hits':b['hits']},
            'policy':'8108E4D0 is admitted because exact package-0447 backlink evidence serializes 8108E5C3. No identity is promoted from aligned hashes alone; typed EntityResource structure and backlinks are preserved for the next source-mapped handoff.'
          }
          pathlib.Path('out/CROTA_8108E4D0_PARENT_CLOSURE.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-8108E4D0-PARENT-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
