name: D1 Spektar TGXM PS4 active-signature calibration

on:
  push:
    paths:
      - '.github/workflows/d1-spektr-cross-platform-active-signature-calibration.yml'
      - 'tools/d1_tgxm_ps4_active_signature_calibrate.py'
      - 'tools/d1_remote_model_tgxm_signature_match.py'
      - 'tools/d1_tgxm_unpack.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install dependencies
        run: python -m pip install -q numpy trimesh

      - name: Recover exact historical TGXM evidence and verified Oodle runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/historical runtime out
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=D1-SPEKTAR-HISTORICAL-GEARASSET-EXACT-TGXM&per_page=20" \
            | python -c "import json,sys; a=[x for x in json.load(sys.stdin)['artifacts'] if not x['expired']]; assert a; a.sort(key=lambda x:x['created_at'],reverse=True); print(a[0]['archive_download_url'])")
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "$url" -o input/historical.zip
          unzip -q input/historical.zip -d input/historical

          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Calibrate on five independently proven masculine Spektar model pairs
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          g=$(find input/historical -type f -path '*/tgxm_male/B4BD27A2/ed38d31f52081295a7f5bd5b7a22d7d5.tgxm' -print -quit)
          p=$(find input/historical -type f -path '*/tgxm_male/1DF65286/5d4be985dfa3c5cd84e432e9c5dd93e8.tgxm' -print -quit)
          m=$(find input/historical -type f -path '*/tgxm_male/4A37316F/029ecb8d6137932f00523c35ed0d90b4.tgxm' -print -quit)
          h=$(find input/historical -type f -path '*/tgxm_male/4A2AD693/0d8720b55b738cd631e469f9fef086b5.tgxm' -print -quit)
          b=$(find input/historical -type f -path '*/tgxm_male/4A5B75DC/60836459fa3936875b8ef7c016299e4b.tgxm' -print -quit)
          test -n "$g"; test -n "$p"; test -n "$m"; test -n "$h"; test -n "$b"
          python tools/d1_tgxm_ps4_active_signature_calibrate.py \
            --pair "$g=80A8274E" \
            --pair "$p=80A85682" \
            --pair "$m=809FDB1E" \
            --pair "$h=80A816E4" \
            --pair "$b=80A862BA" \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --member-catalog evidence/d1_player_gear_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' \
            --part-count 10 --runtime runtime --vertex-tolerance 3 \
            -o out/spektar_tgxm_ps4_active_signature_calibration.json

      - name: Lock calibration canary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('out/spektar_tgxm_ps4_active_signature_calibration.json'))
          assert d['schema']=='d1_tgxm_ps4_active_signature_calibration/v1'
          assert d['pair_count']==5,d
          assert d['matched_pair_count']==5,d
          assert d['failure_model_hashes']==[],d
          assert d['max_observed_active_vertex_count_delta']<=3,d
          expected={'80A8274E','80A85682','809FDB1E','80A816E4','80A862BA'}
          assert {x['ps4_model_hash'] for x in d['pairs']}==expected
          for x in d['pairs']:
              c=x['comparison']
              assert c['active_stage0_highest_part_count_sequence_match'] is True
              assert c['active_vertex_counts_within_tolerance'] is True
              assert c['calibrated_active_structure_match'] is True
              print(x['ps4_model_hash'],x['tgxm_file_identifier'],c['target_active_stage0_highest_part_counts'],c['target_active_vertex_counts'],'->',c['candidate_active_vertex_counts'],'delta',c['active_vertex_count_deltas_candidate_minus_target'])
          print('CALIBRATION MAX ABS VERTEX DELTA',d['max_observed_active_vertex_count_delta'])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: d1-spektr-tgxm-ps4-active-signature-calibration
          path: out/
          retention-days: 14
          if-no-files-found: error
