name: Temporary disassemble main weapon shader 80A3D145

on:
  push:
    paths:
      - '.github/workflows/tmp-disasm-80A3D145.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Recover exact 011C/011E final logical families
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports shader
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x43779C800 \
            --target ps4_gear_weapons_011c_0.pkg --target ps4_gear_weapons_011c_1.pkg \
            --target ps4_gear_weapons_011c_2.pkg --target ps4_gear_weapons_011c_3.pkg --target ps4_gear_weapons_011c_5.pkg \
            --target ps4_gear_weapons_011e_0.pkg --target ps4_gear_weapons_011e_1.pkg \
            --target ps4_gear_weapons_011e_2.pkg --target ps4_gear_weapons_011e_3.pkg --target ps4_gear_weapons_011e_5.pkg \
            --out recovered --manifest reports/011c_011e_extract.json --retries 6 --timeout 90

      - name: Decode final main material and bounded PS binary
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_material_decode.py recovered/ps4_gear_weapons_011c_5.pkg --runtime runtime \
            --tag-hash 80A382A6 -o reports/material_80A382A6.json
          # The PS FileHash resolves in the 011E namespace; use the final entry table.
          python tools/d1_ps4_shader_binary_probe.py recovered/ps4_gear_weapons_011e_5.pkg --runtime runtime \
            --tag-hash 80A3D145 --dump-dir shader -o reports/shader_80A3D145.json
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('reports/material_80A382A6.json').read_text())['materials'][0]
          print('main material',m['tag_hash'])
          print('VS',m['vertex_shader'],'PS',m['pixel_shader'])
          print('PS Vector4',m['ps_vector4_container'])
          print('PS textures',[(x['texture_index'],x['texture']) for x in m['ps_textures']['items']])
          print('PS sampler first dwords',[x['first_dword_hex'] for x in m['ps_samplers']['items']])
          assert m['pixel_shader']=='80A3D145'
          assert m['ps_vector4_container']=='FFFFFFFF'
          assert {x['texture'] for x in m['ps_textures']['items']} >= {'80AB0B74','80A3D4D6'}
          s=json.loads(Path('reports/shader_80A3D145.json').read_text())
          assert len(s['shaders'])==1 and s['shaders'][0]['tag_hash']=='80A3D145' and s['shaders'][0]['present']
          PY

      - name: Build pinned CLRX
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/CLRX/CLRX-mirror.git clrx
          git -C clrx checkout --quiet fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df
          test "$(git -C clrx rev-parse HEAD)" = 'fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df'
          cmake -S clrx -B clrx/build -DCMAKE_BUILD_TYPE=Release -DNO_CLWRAPPER=ON \
            -DBUILD_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_DOCUMENTATION=OFF
          cmake --build clrx/build --target clrxdisasm -j2

      - name: Disassemble exact bounded GCN code
        run: |
          set -euo pipefail
          exe="$(find clrx/build -type f -name clrxdisasm -perm -111 | head -1)"
          test -n "$exe"
          "$exe" --raw --gpuType=GFX700 --hexcode shader/80A3D145_gcn_code.bin > reports/80A3D145_gfx700.s 2> reports/80A3D145_gfx700.stderr
          "$exe" --raw --arch=GCN1.1 --hexcode shader/80A3D145_gcn_code.bin > reports/80A3D145_gcn11.s 2> reports/80A3D145_gcn11.stderr
          cat reports/80A3D145_gcn11.s
          test ! -s reports/80A3D145_gcn11.stderr
          grep -q 's_endpgm' reports/80A3D145_gcn11.s

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 80A3D145-clrx-disassembly
          path: |
            reports/
            shader/
          retention-days: 3
