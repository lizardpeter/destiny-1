name: D1 Crota stage-specific map tables

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-stage-map-tables.yml'
      - 'tools/d1_remote_exact_map_data_table_probe.py'
      - 'tools/d1_remote_exact_s_entity_probe.py'
      - 'tools/d1_remote_global_stringhash_resolve.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Decode exact Crota and ultra-Knight SMapDataTables
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_remote_exact_map_data_table_probe.py
          python tools/d1_remote_exact_map_data_table_probe.py \
            --tag-hash 0x810978FC --tag-hash 0x8108E2FF \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_STAGE_MAP_TABLES.json | tee out/map_tables_stdout.txt
      - name: Decode every exact EntitySK placed by either stage table
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          ARGS=$(python - <<'PY'
          import json
          d=json.load(open('out/CROTA_STAGE_MAP_TABLES.json'))
          tags=[]
          for t in d['tables']:
              for h in t.get('unique_entity_hashes',[]):
                  if h not in tags: tags.append(h)
          print(' '.join('--tag-hash 0x'+h for h in tags))
          PY
          )
          echo "ENTITY_ARGS=$ARGS" | tee out/entity_args.txt
          if [[ -n "$ARGS" ]]; then
            python tools/d1_remote_exact_s_entity_probe.py $ARGS \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
              --runtime runtime -o out/CROTA_STAGE_MAP_ENTITIES.json | tee out/entities_stdout.txt
          else
            printf '{"schema":"empty","entries":[],"violation_count":0,"violations":[]}\n' > out/CROTA_STAGE_MAP_ENTITIES.json
            echo NO_ENTITY_SK_ROWS | tee out/entities_stdout.txt
          fi
      - name: Resolve every source-mapped name on placed EntitySKs
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          ARGS=$(python - <<'PY'
          import json
          d=json.load(open('out/CROTA_STAGE_MAP_ENTITIES.json'))
          args=[];seen=set()
          for e in d.get('entries',[]):
              for h in e.get('specific_name_string_hashes',[]):
                  k=('s',h)
                  if k not in seen: seen.add(k);args += ['--string-hash','0x'+h]
              for h in e.get('generic_name_tag_hashes',[]):
                  k=('g',h)
                  if k not in seen: seen.add(k);args += ['--generic-name-tag','0x'+h]
          print(' '.join(args))
          PY
          )
          echo "NAME_ARGS=$ARGS" | tee out/name_args.txt
          if [[ -n "$ARGS" ]]; then
            python tools/d1_remote_global_stringhash_resolve.py $ARGS \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --global-package-id 0x0151 --global-package-id 0x0154 --global-package-id 0x0155 \
              --global-package-id 0x0156 --global-package-id 0x0157 --global-package-id 0x0158 \
              --global-package-id 0x0169 --global-package-id 0x018D --global-package-id 0x01E3 \
              --global-package-id 0x072B --global-package-id 0x072F --global-package-id 0x0735 \
              --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
              --runtime runtime -o out/CROTA_STAGE_MAP_ENTITY_NAMES.json | tee out/names_stdout.txt
          else
            printf '{"schema":"empty","resolved":{},"unresolved_target_hashes":[],"violation_count":0,"violations":[]}\n' > out/CROTA_STAGE_MAP_ENTITY_NAMES.json
            echo NO_SOURCE_MAPPED_NAMES | tee out/names_stdout.txt
          fi
      - name: Summarize exact stage placements
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          m=json.load(open('out/CROTA_STAGE_MAP_TABLES.json'))
          assert m['violation_count']==0,m['violations']
          e=json.load(open('out/CROTA_STAGE_MAP_ENTITIES.json'))
          assert e.get('violation_count',0)==0,e.get('violations')
          n=json.load(open('out/CROTA_STAGE_MAP_ENTITY_NAMES.json'))
          assert n.get('violation_count',0)==0,n.get('violations')
          em={x['tag_hash']:x for x in e.get('entries',[])}
          names={}
          for h,rows in n.get('resolved',{}).items():
              vals=sorted({x['string'] for x in rows if x.get('string') is not None})
              if vals:names[h]=vals
          for t in m['tables']:
              print('TABLE',t['tag_hash'],'COUNT',t['entry_count'],'DATA_CLASSES',t['unique_data_resource_classes'])
              for r in t['entries']:
                  x=em.get(r['entity_hash']) or {}
                  vals=[]
                  for sh in x.get('specific_name_string_hashes',[]): vals += names.get(sh,[])
                  for gh in x.get('generic_name_tag_hashes',[]):
                      sh=n.get('generic_name_tag_to_string_hash',{}).get(gh)
                      if sh: vals += names.get(sh,[])
                  print(' PLACEMENT',r['index'],'ENTITY',r['entity_hash'],'WORLD',r['world_id_hex'],
                        'TRANSLATION',r['translation'],'DR',r['data_resource'].get('resource_class'),
                        'MODELS',x.get('embedded_models',[]),
                        'SKELETONS',[(s['resource_hash'],s['node_count']) for s in x.get('skeletons',[])],
                        'NAMES',sorted(set(vals)))
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-STAGE-MAP-TABLES
          path: out/
          retention-days: 30
          if-no-files-found: error
