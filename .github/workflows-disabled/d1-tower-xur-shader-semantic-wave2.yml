name: D1 Tower Xur shader semantic wave 2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-xur-shader-semantic-wave2.yml'
      - 'tools/d1_xur_shader_semantic_frontier.py'
      - 'tools/d1_xur_ps_80876edf_semantic_proof.py'
      - 'tools/d1_xur_ps_808764aa_semantic_proof.py'
      - 'tools/d1_xur_vs_8087695c_family_semantic_proof.py'

permissions:
  contents: read
  actions: read

env:
  SHADER_CENSUS_ARTIFACT_ID: '10027557806'
  SHADER_CENSUS_ZIP_SHA256: 'e26febd88c0fcc05d998ec7dab04efcf1582095ee594a459ec472c530c7a5086'
  MATERIAL_STATE_ARTIFACT_ID: '10028092407'
  MATERIAL_STATE_ZIP_SHA256: '83c5b4af4590d986fb917ddc9da4098e2d1272ad30025db8395f53cac61e4407'

jobs:
  semantic-wave2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover pinned exact Xur shader and material-state checkpoints
        run: |
          set -euo pipefail
          mkdir -p input/shader input/state reports
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SHADER_CENSUS_ARTIFACT_ID}/zip" -o input/shader.zip
          echo "${SHADER_CENSUS_ZIP_SHA256}  input/shader.zip" | sha256sum --check --strict
          unzip -q input/shader.zip -d input/shader
          test -f input/shader/reports/xur_shader_disassembly_census.json
          test -f input/shader/reports/xur_ps_image_usage.json
          test -f input/shader/reports/xur_material_texture_manifest.json
          test -f input/shader/disasm/PS_80876EDF.s
          test -f input/shader/disasm/PS_808764AA.s
          test -f input/shader/disasm/PS_8087695C.s

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${MATERIAL_STATE_ARTIFACT_ID}/zip" -o input/state.zip
          echo "${MATERIAL_STATE_ZIP_SHA256}  input/state.zip" | sha256sum --check --strict
          unzip -q input/state.zip -d input/state
          test -f input/state/xur_material_stage_state.json
          test -f input/state/XUR_MATERIAL_LOCAL_STATE_CHECKPOINT.json

      - name: Rebuild exact structural frontier
        run: |
          set -euo pipefail
          python tools/d1_xur_shader_semantic_frontier.py \
            --material-state input/state/xur_material_stage_state.json \
            --shader-census input/shader/reports/xur_shader_disassembly_census.json \
            --image-usage input/shader/reports/xur_ps_image_usage.json \
            --out reports/XUR_SHADER_SEMANTIC_FRONTIER.json
          python - <<'PY'
          import json
          d=json.load(open('reports/XUR_SHADER_SEMANTIC_FRONTIER.json'))
          assert d['status']=='D1_XUR_SHADER_SEMANTIC_LIFTING_FRONTIER_EXACT',d
          assert d['native_gcn_program_count']==31,d
          assert d['stage_structural_unit_count']==38,d
          assert d['material_structural_family_count']==33,d
          assert not d['violations'],d['violations']
          PY

      - name: Revalidate first six-material PS family
        run: |
          set -euo pipefail
          python tools/d1_xur_ps_80876edf_semantic_proof.py \
            --material-state input/state/xur_material_stage_state.json \
            --shader-census input/shader/reports/xur_shader_disassembly_census.json \
            --image-usage input/shader/reports/xur_ps_image_usage.json \
            --texture-manifest input/shader/reports/xur_material_texture_manifest.json \
            --disassembly input/shader/disasm/PS_80876EDF.s \
            --out reports/XUR_PS_80876EDF_SEMANTIC_PROOF.json
          python - <<'PY'
          import json
          d=json.load(open('reports/XUR_PS_80876EDF_SEMANTIC_PROOF.json'))
          assert d['status']=='D1_XUR_PS_80876EDF_DATAFLOW_SEMANTICS_EXACT',d
          assert d['scope_material_count']==6,d
          assert d['pixel_shader_dataflow_complete_for_scoped_binary'] is True,d
          assert not d['violations'],d['violations']
          PY

      - name: Close four-material reflected-cube PS 808764AA family
        run: |
          set -euo pipefail
          python tools/d1_xur_ps_808764aa_semantic_proof.py \
            --material-state input/state/xur_material_stage_state.json \
            --shader-census input/shader/reports/xur_shader_disassembly_census.json \
            --image-usage input/shader/reports/xur_ps_image_usage.json \
            --texture-manifest input/shader/reports/xur_material_texture_manifest.json \
            --disassembly input/shader/disasm/PS_808764AA.s \
            --out reports/XUR_PS_808764AA_SEMANTIC_PROOF.json
          python - <<'PY'
          import json
          d=json.load(open('reports/XUR_PS_808764AA_SEMANTIC_PROOF.json'))
          assert d['status']=='D1_XUR_PS_808764AA_DATAFLOW_SEMANTICS_EXACT',d
          assert d['scope_material_count']==4,d
          assert d['pixel_shader_dataflow_complete_for_scoped_binary'] is True,d
          assert d['instruction_level_equations']['cube_lod_floor_current_source_value']=='lod_floor = 1.5',d
          assert d['instruction_level_equations']['reflection_strength_current_source_constants']=='reflection_strength = 0.025 * cube.a',d
          assert d['instruction_level_equations']['normal_packing_scale_current_source_value']=='k = 0.1125',d
          assert not d['violations'],d['violations']
          PY

      - name: Close shared 31-material dual-quaternion VS family
        run: |
          set -euo pipefail
          python tools/d1_xur_vs_8087695c_family_semantic_proof.py \
            --material-state input/state/xur_material_stage_state.json \
            --shader-census input/shader/reports/xur_shader_disassembly_census.json \
            --disassembly input/shader/disasm/PS_8087695C.s \
            --out reports/XUR_VS_A5AD940F_SEMANTIC_PROOF.json
          python - <<'PY'
          import json
          d=json.load(open('reports/XUR_VS_A5AD940F_SEMANTIC_PROOF.json'))
          assert d['status']=='D1_XUR_VS_A5AD940F_DATAFLOW_SEMANTICS_EXACT',d
          assert d['scope_material_count']==31,d
          assert d['header_material_counts']=={'8087695C':29,'809DF743':1,'80A08C19':1},d
          assert d['dual_quaternion_skinning_dataflow_complete_for_scoped_binary'] is True,d
          assert d['fetch_shader_source_layout_complete'] is False,d
          assert not d['violations'],d['violations']
          PY

      - name: Promote exact native-dataflow progress into frontier
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/XUR_SHADER_SEMANTIC_FRONTIER.json')
          d=json.load(open(p))
          proofs=[
            json.load(open('reports/XUR_PS_80876EDF_SEMANTIC_PROOF.json')),
            json.load(open('reports/XUR_PS_808764AA_SEMANTIC_PROOF.json')),
            json.load(open('reports/XUR_VS_A5AD940F_SEMANTIC_PROOF.json')),
          ]
          closed_gcn={x['gcn_sha256'] for x in proofs}
          closed_ps={x['gcn_sha256'] for x in proofs if x.get('shader')}
          closed_vs={x['gcn_sha256'] for x in proofs if x.get('shader_headers')}
          for r in d['native_gcn_lifting_queue']:
            r['semantic_lifting_complete']=r['gcn_sha256'] in closed_gcn
          for r in d['stage_structural_lifting_queue']:
            r['semantic_lifting_complete']=r['gcn_sha256'] in closed_gcn
          for r in d['material_structural_families']:
            r['semantic_lifting_complete']=r['vs_gcn_sha256'] in closed_vs and r['ps_gcn_sha256'] in closed_ps
          closed_materials=sorted({m for r in d['material_structural_families'] if r['semantic_lifting_complete'] for m in r['materials']})
          progress={
            'status':'D1_XUR_NATIVE_GCN_DATAFLOW_WAVE2_EXACT',
            'native_gcn_programs_complete':sum(r['semantic_lifting_complete'] for r in d['native_gcn_lifting_queue']),
            'native_gcn_programs_total':d['native_gcn_program_count'],
            'stage_structural_units_complete':sum(r['semantic_lifting_complete'] for r in d['stage_structural_lifting_queue']),
            'stage_structural_units_total':d['stage_structural_unit_count'],
            'material_structural_families_both_stages_complete':sum(r['semantic_lifting_complete'] for r in d['material_structural_families']),
            'material_structural_families_total':d['material_structural_family_count'],
            'materials_with_both_stage_native_dataflow_complete':len(closed_materials),
            'materials_total':d['material_count'],
            'materials':closed_materials,
            'closed_gcn_sha256':sorted(closed_gcn),
            'pixel_shader_material_coverage':10,
            'vertex_shader_material_coverage':31,
            'tfx_producer_semantics_complete':False,
            'render_state_semantics_complete':False,
            'permutation_selection_complete':False,
            'portable_recreation_complete':False,
          }
          assert progress['native_gcn_programs_complete']==3,progress
          assert progress['stage_structural_units_complete']==5,progress
          assert progress['material_structural_families_both_stages_complete']==2,progress
          assert progress['materials_with_both_stage_native_dataflow_complete']==10,progress
          d['native_dataflow_progress']=progress
          p.write_text(json.dumps(d,indent=2)+'\n')
          Path('reports/XUR_SHADER_SEMANTIC_PROGRESS_WAVE2.json').write_text(json.dumps(progress,indent=2)+'\n')
          lines=[
            '# Xur native shader semantic progress — wave 2','',
            f"Status: `{progress['status']}`",'',
            f"- Native GCN binaries with exact instruction-level dataflow: **{progress['native_gcn_programs_complete']} / {progress['native_gcn_programs_total']}**",
            f"- Stage structural units covered by those binaries: **{progress['stage_structural_units_complete']} / {progress['stage_structural_units_total']}**",
            f"- Combined material structural families with both VS+PS native dataflow closed: **{progress['material_structural_families_both_stages_complete']} / {progress['material_structural_families_total']}**",
            f"- Materials whose current VS+PS native binaries are both dataflow-closed: **{progress['materials_with_both_stage_native_dataflow_complete']} / {progress['materials_total']}**",'',
            'This is native instruction/dataflow closure only. TFX producer semantics, render/blend/depth/raster state, live material permutation selection and portable retail-equivalent recreation remain separate proof gates.'
          ]
          Path('reports/XUR_SHADER_SEMANTIC_PROGRESS_WAVE2.md').write_text('\n'.join(lines)+'\n')
          print(json.dumps(progress,indent=2))
          PY

      - name: Persist source provenance and hashes
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          out={
            'status':'D1_XUR_NATIVE_GCN_DATAFLOW_WAVE2_EXACT',
            'source_artifacts':{
              'native_shader_census':{'artifact_id':int(os.environ['SHADER_CENSUS_ARTIFACT_ID']),'zip_sha256':os.environ['SHADER_CENSUS_ZIP_SHA256']},
              'material_local_state':{'artifact_id':int(os.environ['MATERIAL_STATE_ARTIFACT_ID']),'zip_sha256':os.environ['MATERIAL_STATE_ZIP_SHA256']},
            },
            'workflow_commit':os.environ['GITHUB_SHA'],
            'promoted_proofs':[
              {'stage':'ps','shader_headers':['80876EDF'],'gcn_sha256':'966131017fed6ba96524161765eeab841bcf09d4c7757deec82273f17e783ca8','material_count':6},
              {'stage':'ps','shader_headers':['808764AA'],'gcn_sha256':'05eac4afa0c0e050b3f1237424cb984d20923f619d20066bccd333498e7c80f8','material_count':4},
              {'stage':'vs','shader_headers':['8087695C','809DF743','80A08C19'],'gcn_sha256':'a5ad940fbf21746563f6585b889ac91b4220c94a3559e768028c894454bcdc12','material_count':31},
            ],
            'semantic_recreation_complete':False,
            'permutation_selection_complete':False,
          }
          Path('reports/XUR_SHADER_SEMANTIC_WAVE2_CHECKPOINT.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          find reports -type f -print0 | sort -z | xargs -0 sha256sum > reports/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-TOWER-XUR-SHADER-SEMANTIC-WAVE2
          path: reports/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
