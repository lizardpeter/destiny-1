name: Build byte-proven Gjallarhorn rocket-launcher fire motion

on:
  push:
    paths:
      - '.github/workflows/build-gjallarhorn-rocket-launcher-fire.yml'
      - 'tools/d1_animation_control_state_map.py'
      - 'tools/d1_fnv1_action_probe.py'
      - 'tools/d1_gltf_add_external_root_motion.py'
      - 'tools/d1_gltf_bake_rigid_weapon_motion.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies and Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy scipy pygltflib pyglm
          mkdir -p runtime recovered inputs out reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git tiger-animation-parser
          git -C tiger-animation-parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
      - name: Recover exact shared animation package and proven Gjallarhorn fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x45190B000 \
            --target ps4_globals_0151_0.pkg --target ps4_globals_0151_1.pkg --target ps4_globals_0151_2.pkg \
            --target ps4_globals_0151_3.pkg --target ps4_globals_0151_4.pkg --target ps4_globals_0151_5.pkg --target ps4_globals_0151_6.pkg \
            --out recovered --manifest reports/0151_extract.json --retries 6 --timeout 90
          gh run download 33930517073 --repo "$GITHUB_REPOSITORY" \
            -n D1-Gjallarhorn-Year3-FULL-TEXTURED-ANIMATED -D inputs
          test -f inputs/GJALLARHORN_YEAR3_ARRANGEMENT_1229_TEXTURED_ANIMATED.glb
          echo '52aadfab799ad377287065b5b19154b43ddba14f106548599d3e4f4feb7ce3f3  inputs/GJALLARHORN_YEAR3_ARRANGEMENT_1229_TEXTURED_ANIMATED.glb' | sha256sum --check --strict
      - name: Decode exact rocket-launcher action selector
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_animation_control_state_map.py recovered/ps4_globals_0151_6.pkg --runtime runtime \
            --control-tag 80AA3CC9 -o reports/80AA3CC9_state_map.json
          python - <<'PY'
          import json
          r=json.load(open('reports/80AA3CC9_state_map.json'))
          assert r['animation_list']['count']==91
          assert r['state_table']['count']==72
          fire=[x for x in r['state_table']['records'] if x['state_name']=='fire']
          assert len(fire)==1,fire
          f=fire[0]
          assert f['selection_count']==1 and f['selection_start']==33,f
          assert [x['tag_hash'] for x in f['selected_animations']]==['80AA3D42'],f
          assert f['selected_animations'][0]['entry']['reference']=='808005A1'
          known={x['state_name']:x for x in r['state_table']['records'] if x['state_name']}
          assert known['idle']['selection_start']==1
          assert known['ready']['selection_start']==4
          assert known['reload_empty']['selection_start']==19
          assert known['reload_full']['selection_start']==19
          assert sum(1 for x in r['state_table']['records'] if x['selection_count']==2)==11
          print(json.dumps({'fire':f,'two_clip_state_count':11},indent=2))
          PY
      - name: Decode exact fire clip and prove the native recoil child
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import io,json,sys,tempfile
          from pathlib import Path
          from pygltflib import GLTF2,Asset,Scene
          sys.path.insert(0,'tools')
          sys.path.insert(0,str(Path('tiger-animation-parser').resolve()))
          from d1_entry_extract import EntryReader
          from tag.game_version import Game_Version
          from tag_readers.read_skeleton import read_skeleton
          from tag_readers.read_rig import read_runtime_rig
          from tag_readers.read_animation import read_animation
          from animation_decoding.decode_animation import decode_animation
          from runtime_rig.rig_retarget import rig_retarget
          from animation_export.convert_animation_object_to_local import convert_obj_to_local
          from animation_export.gltf_export import create_armature_hierarchy,add_animation
          from animation_export.enums import Name_Convention

          SK='80AA3CBF';RIG='80AA3CBE';CLIP='80AA3D42';PED=0xC410084A;MOTION=0xE6477C3B
          r=EntryReader(Path('recovered/ps4_globals_0151_6.pkg'),Path('runtime'));by={e['tag_hash'].upper():e for e in r.entries}
          def raw(t):return r.entry(by[t]['index'])
          ver=Game_Version.D1_ROI
          sk=read_skeleton(io.BytesIO(raw(SK)),ver);rig=read_runtime_rig(io.BytesIO(raw(RIG)),ver)
          assert len(sk.node_defs)==75,len(sk.node_defs)
          assert len(rig.controls_relations)==73,len(rig.controls_relations)
          assert len(rig.controls_transforms)==73,len(rig.controls_transforms)
          bones=[{'index':i,'hash':f'{int(n.bone_hash)&0xffffffff:08X}','parent':int(n.parent_node_index),
                  'first_child':int(n.first_child_node_index),'next_sibling':int(n.next_sibling_node_index)} for i,n in enumerate(sk.node_defs)]
          ped=[x for x in bones if x['hash']==f'{PED:08X}'];motion=[x for x in bones if x['hash']==f'{MOTION:08X}']
          assert len(ped)==1,ped
          assert len(motion)==1,motion
          assert motion[0]['parent']==ped[0]['index'],(ped,motion)
          with tempfile.NamedTemporaryFile() as f:
              f.write(raw(CLIP));f.flush();f.seek(0);anim=read_animation(f,ver)
          h=anim.animation_header
          assert int(h.node_count)==75 and int(h.rig_control_count)==73,(h.node_count,h.rig_control_count)
          assert int(h.frame_count)==19,h.frame_count
          decoded=decode_animation(anim);ret=rig_retarget(anim,decoded,sk,rig);local=convert_obj_to_local(anim,ret,sk)
          g=GLTF2(asset=Asset(version='2.0',generator='destiny-1 byte-proven rocket_launcher fire viewmodel proof'),scene=0,
                  scenes=[Scene(nodes=[])],nodes=[],meshes=[],skins=[],animations=[],materials=[],textures=[],images=[],samplers=[],buffers=[],bufferViews=[],accessors=[])
          root,gltf_bones=create_armature_hierarchy(g,sk,Name_Convention.FNV1BE);g.scenes[0].nodes.append(root)
          add_animation(g,gltf_bones,local,Name_Convention.FNV1BE,fps=30);g.animations[-1].name='rocket_launcher_fire_STATE_9FAC79C9_80AA3D42'
          ped_name=f'{PED:08X}';motion_name=f'{MOTION:08X}'
          assert ped_name in gltf_bones,(ped_name,sorted(gltf_bones))
          assert motion_name in gltf_bones,(motion_name,sorted(gltf_bones))
          ped_node=int(gltf_bones[ped_name]);motion_node=int(gltf_bones[motion_name])
          g.extras={'d1ActionStateHash':'9FAC79C9','d1ActionStateName':'fire','d1AnimationControl':'80AA3CC9','d1AnimationListIndex':33,
                    'd1Clip':CLIP,'d1Skeleton':SK,'d1RuntimeRig':RIG,'d1PedestalBoneHash':'C410084A','d1PedestalGltfNode':ped_node,
                    'd1WeaponMotionBoneHash':'E6477C3B','d1WeaponMotionGltfNode':motion_node,
                    'semanticEvidence':'exact FNV1 fire state -> packed count/start -> FileHash clip; E6477C3B is a direct child of C410084A and carries the native fire impulse'}
          out=Path('out/ROCKET_LAUNCHER_FIRE_VIEWMODEL_PROOF.glb');g.save_binary(str(out))
          rep={'control':'80AA3CC9','state_hash':'9FAC79C9','state_name':'fire','selection_count':1,'selection_start':33,'clip':CLIP,
               'clip_frames':int(h.frame_count),'clip_duration_s':(int(h.frame_count)-1)/30.0,'skeleton':SK,'skeleton_nodes':len(sk.node_defs),
               'runtime_rig':RIG,'rig_controls':len(rig.controls_relations),'pedestal':ped[0],'pedestal_gltf_node':ped_node,
               'weapon_motion':motion[0],'weapon_motion_gltf_node':motion_node,
               'decoded_tracks':len(decoded),'retargeted_tracks':len(ret),'local_tracks':len(local),'bones':bones,'output':str(out),'output_bytes':out.stat().st_size}
          Path('reports/rocket_launcher_fire_proof.json').write_text(json.dumps(rep,indent=2)+'\n')
          print(json.dumps({k:v for k,v in rep.items() if k!='bones'},indent=2))
          PY
      - name: Bake exact native recoil-child fire motion above full Gjallarhorn
        run: |
          set -euo pipefail
          MOTION_NODE=$(python -c "import json;print(json.load(open('reports/rocket_launcher_fire_proof.json'))['weapon_motion_gltf_node'])")
          python tools/d1_gltf_add_external_root_motion.py \
            inputs/GJALLARHORN_YEAR3_ARRANGEMENT_1229_TEXTURED_ANIMATED.glb \
            out/ROCKET_LAUNCHER_FIRE_VIEWMODEL_PROOF.glb \
            --source-node "$MOTION_NODE" --source-animation rocket_launcher_fire_STATE_9FAC79C9_80AA3D42 \
            --animation-name rocket_launcher_fire_STATE_9FAC79C9_80AA3D42_VIEWMODEL_MOTION \
            --root-name RocketLauncherViewmodelMotionRoot \
            --out out/GJALLARHORN_YEAR3_TEXTURED_ANIMATED_WITH_FIRE.glb \
            --report reports/gjallarhorn_with_fire.json
          sha256sum out/GJALLARHORN_YEAR3_TEXTURED_ANIMATED_WITH_FIRE.glb | tee reports/final_sha256.txt
      - name: Validate visible native fire impulse
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from pygltflib import GLTF2
          p=Path('out/GJALLARHORN_YEAR3_TEXTURED_ANIMATED_WITH_FIRE.glb');g=GLTF2().load_binary(str(p));r=json.load(open('reports/gjallarhorn_with_fire.json'))
          assert len(g.meshes)==8
          assert len(g.images)==18 and len(g.textures)==12
          assert len(g.skins)==1 and len(g.skins[0].joints)==7
          names=[a.name for a in g.animations]
          assert names==['80AA2E4A','80AA2E4B','rocket_launcher_fire_STATE_9FAC79C9_80AA3D42_VIEWMODEL_MOTION'],names
          assert r['sample_count']==19 and abs(r['duration_s']-0.6)<1e-5
          assert r['source_node_name']=='E6477C3B',r
          assert 0.030 < r['max_translation'] < 0.050,r
          fire=g.animations[-1];targets={c.target.node for c in fire.channels};assert targets=={r['root_node']}
          print(json.dumps({'bytes':p.stat().st_size,'meshes':len(g.meshes),'images':len(g.images),'internal_joints':len(g.skins[0].joints),'animations':names,
                            'fire_translation':r['max_translation'],'fire_rotation_deg':r['max_rotation_deg'],'source_node':r['source_node_name']},indent=2))
          PY
      - name: Bundle
        run: |
          set -euo pipefail
          cp reports/80AA3CC9_state_map.json reports/rocket_launcher_fire_proof.json reports/gjallarhorn_with_fire.json reports/final_sha256.txt out/
          cat > out/README_FIRE.txt <<'EOF'
          Destiny 1 Rise of Iron - Gjallarhorn Year 3 with byte-proven rocket-launcher firing motion

          Internal weapon layer:
            pattern 39 -> 7-bone Gjallarhorn rig -> clips 80AA2E4A / 80AA2E4B

          Shared first-person rocket-launcher layer:
            control 80AA3CC9
            FNV1("fire") = 9FAC79C9
            selector = count 1, zero-based animation-list start 33
            animation-list[33] = s_animation_clip 80AA3D42
            clip = 19 frames / 0.6 s, 75 nodes / 73 controls
            matching skeleton/runtime rig = 80AA3CBF / 80AA3CBE

          Fire-motion correction:
            C410084A is a direct child of the right-grip chain but its local fire track is effectively static.
            E6477C3B is a direct child of C410084A and carries the actual native one-frame recoil impulse.
            The standalone weapon therefore receives E6477C3B's exact evaluated world delta, rebased to frame 0.
            Validation requires >3 cm and <5 cm maximum translation so the visible impulse cannot silently disappear.

          No recoil curve, joint assignment, clip identity, geometry, or texture is synthesized.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: D1-Gjallarhorn-Year3-TEXTURED-ANIMATED-WITH-FIRE
          path: out/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
