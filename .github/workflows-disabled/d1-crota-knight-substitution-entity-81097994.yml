name: D1 Crota Knight substitution-only entity 81097994

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-knight-substitution-entity-81097994.yml'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover corpus/runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Probe class-source tags and substitution-only entity
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          C=input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json
          B='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_remote_exact_tag_probe.py \
            --tag-hash 0x80AAC4E6 --tag-hash 0x80AAC4E7 --tag-hash 0x81097994 --tag-hash 0x81096661 \
            --member-catalog "$C" --base-url "$B" --part-count 10 --runtime runtime --min-string 4 \
            -o out/CROTA_KNIGHT_SUBSTITUTION_TAGS.json | tee out/tags.txt
          python tools/d1_remote_entity_dependency_closure_universal.py \
            --seed 0x81097994 --seed 0x81096661 \
            --member-catalog "$C" --base-url "$B" --part-count 10 --runtime runtime --max-depth 5 --max-nodes 350 \
            -o out/CROTA_KNIGHT_SUBSTITUTION_ENTITY_CLOSURE.json | tee out/closure.txt
          python - <<'PY' | tee out/summary.txt
          import json
          p=json.load(open('out/CROTA_KNIGHT_SUBSTITUTION_TAGS.json'))
          c=json.load(open('out/CROTA_KNIGHT_SUBSTITUTION_ENTITY_CLOSURE.json'))
          assert p['violation_count']==0,p['violations']
          assert c['status']=='D1_ENTITY_DEPENDENCY_CLOSURE_COMPLETE' and not c['violations'] and not c['truncated']
          for e in p['entries']:
            print('TAG',e['tag_hash'],'CLASS',e['entry']['reference'],'SIZE',e['payload_size'],'STRINGS',[x['string'] for x in e['printable_strings']])
          print('CLOSURE','NODES',c['node_count'],'TYPED',c['typed_edge_count'],'ARTICULATED',len(c['articulated_entities']))
          for a in c['articulated_entities']:
            print('ARTICULATED',a['tag_hash'],'DEPTH',a['depth'],'PATH',a['path_class'],'MODELS',a.get('embedded_models'),'SKELETONS',a.get('skeletons'),'GENERIC',a.get('generic_name_hashes'),'SPECIFIC',a.get('specific_name_hashes'))
          PY
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-KNIGHT-SUBSTITUTION-ENTITY-81097994
          path: out/
          retention-days: 30
          if-no-files-found: error
