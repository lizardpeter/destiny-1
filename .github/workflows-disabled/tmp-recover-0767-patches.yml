name: Temporary 09A sampler and constant census

on:
  push:
    paths:
      - '.github/workflows/tmp-recover-0767-patches.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover verified Oodle runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover 0157 and 0767 package families
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_split_tar_extract.py --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --start-offset 0x46AF91400 \
            --target ps4_globals_0157_0.pkg --target ps4_globals_0157_1.pkg \
            --out recovered --manifest reports/0157_extract.json
          python tools/d1_split_tar_extract.py --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --start-offset 0x105C6E000 \
            --target ps4_arch_vex_com01_0767_0.pkg --target ps4_arch_vex_com01_0767_1.pkg --target ps4_arch_vex_com01_0767_4.pkg \
            --out recovered --manifest reports/0767_extract.json
      - name: Decode target native sampler descriptors
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_ps4_sampler_probe.py recovered/ps4_globals_0157_1.pkg --runtime runtime \
            --tag-hash 80AAE176 --tag-hash 80AAE177 -o reports/main_samplers.json
          python tools/d1_ps4_sampler_probe.py recovered/ps4_arch_vex_com01_0767_4.pkg --runtime runtime \
            --tag-hash 816CE0AA -o reports/circuitry_sampler.json
          cat reports/main_samplers.json
          cat reports/circuitry_sampler.json
      - name: Census all validated sampler-class descriptors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections,json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader
          from d1_ps4_sampler_probe import decode_blob,SAMPLER_CLASS
          rows=[]
          for pkg in ('recovered/ps4_globals_0157_1.pkg','recovered/ps4_arch_vex_com01_0767_4.pkg'):
              r=EntryReader(Path(pkg),Path('runtime'))
              for e in r.entries:
                  if e['type']==16 and e['subtype']==0 and e['reference'].upper()==SAMPLER_CLASS and r.available(e['index']):
                      try: d=decode_blob(r.entry(e['index']))
                      except Exception as ex: rows.append({'package':pkg,'tag_hash':e['tag_hash'],'error':repr(ex)}); continue
                      rows.append({'package':pkg,'tag_hash':e['tag_hash'],'entry_index':e['index'],**d})
          sig=collections.Counter(tuple(x.get('words_hex',[])) for x in rows if 'words_hex' in x)
          print('sampler entries',len(rows),'unique descriptors',len(sig))
          for k,n in sig.most_common(): print(n,k)
          Path('reports/sampler_census.json').write_text(json.dumps({'count':len(rows),'unique_descriptor_count':len(sig),'rows':rows},indent=2)+'\n')
          PY
      - name: Decode exact main and circuitry material constants
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_vector_container_probe.py recovered/ps4_globals_0157_1.pkg --runtime runtime \
            --tag-hash 80AAE14C -o reports/80AAE14C_vectors.json
          python tools/d1_vector_container_probe.py recovered/ps4_arch_vex_com01_0767_4.pkg --runtime runtime \
            --tag-hash 816CE185 -o reports/816CE185_vectors.json
          python - <<'PY'
          import json
          from pathlib import Path
          for fn in ('reports/80AAE14C_vectors.json','reports/816CE185_vectors.json'):
              d=json.loads(Path(fn).read_text())
              print('====',fn,'====')
              for row in d['rows']:
                  print(row['tag_hash'],'vectors=',row.get('vector_count'))
                  for v in row.get('vectors',[]): print(v['index'],v['float4'],v['u32_hex'])
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: 09A-sampler-constant-census
          path: reports/
          retention-days: 1
          if-no-files-found: error
