name: D1 00EC 67-bone humanoid animation retarget validation

on:
  push:
    paths:
      - '.github/workflows/d1-00ec-67bone-animation-retarget.yml'
      - 'tools/d1_animation_retarget_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies
        run: python -m pip install -q numpy scipy pygltflib pyglm
      - name: Recover verified runtime and 00EC family
        run: |
          set -euo pipefail
          mkdir -p runtime recovered out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --start-offset 0xAAB580800 \
            --target ps4_race_set_all_00ec_0.pkg --target ps4_race_set_all_00ec_1.pkg \
            --target ps4_race_set_all_00ec_2.pkg --target ps4_race_set_all_00ec_3.pkg \
            --target ps4_race_set_all_00ec_4.pkg --target ps4_race_set_all_00ec_5.pkg \
            --out recovered --manifest out/00ec_extract.json --retries 6 --timeout 90
      - name: Pin animation parser
        run: |
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
          test "$(git -C parser rev-parse HEAD)" = b9fdc3a43dd28118113275624fcc9054b75855f4
      - name: Fully decode and retarget all exact 67-node clips
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_animation_retarget_probe.py recovered/ps4_race_set_all_00ec_5.pkg \
            --runtime runtime --parser-root parser \
            --skeleton 809D8613 --rig 809D856E \
            --clip 809D8469 --clip 809D846A --clip 809D8572 \
            -o out/809D8613_809D856E_retarget.json
          python - <<'PY'
          import json
          d=json.load(open('out/809D8613_809D856E_retarget.json'))
          assert d['target']['skeleton_node_count']==67,d['target']
          assert d['target']['runtime_rig_control_count']==67,d['target']
          assert d['summary']=={'clip_count':3,'success_count':3,'failure_count':0},d['summary']
          for c in d['clips']:
              assert c['native_control_limit']==67,c
              assert c['decoded_track_count']==67,c
              assert c['retargeted_track_count']==67,c
              assert c['local_track_count']==67,c
          print('VALIDATED',[(c['tag_hash'],c['frame_count'],c['local_track_count']) for c in d['clips']])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-00ec-67bone-animation-retarget
          path: out/
          retention-days: 14
          if-no-files-found: warn
