name: D1 Tower all scenario AI location census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-all-scenario-ai-location-census.yml'
      - 'tools/d1_remote_activity_scripted_entity_census.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog and runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Enumerate all exact Tower scenario AI tables and locations
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_remote_activity_scripted_entity_census.py
          while IFS='|' read -r hash slug name; do
            echo "=== $slug $hash ==="
            set +e
            python tools/d1_remote_activity_scripted_entity_census.py \
              --activity-hash "$hash" --activity-name "$name" --activity-class 80800616 \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
              -o "out/${slug}.json" | tee "out/${slug}.stdout.txt"
            rc=${PIPESTATUS[0]}
            set -e
            test "$rc" -eq 0 -o "$rc" -eq 2
          done <<'EOF'
          80C7A005|default1|city_tower_default1:scenario_client
          80C7A00B|queen|city_tower_queen:scenario_client
          80C7A013|harvest|city_tower_harvest:scenario_client
          80C7A0A2|srl|city_tower_srl:scenario_client
          80C7A0A7|fol|city_tower_fol:scenario_client
          80C7A0F2|crimson|city_tower_crimson:scenario_client
          80C7A9E8|chalice|city_tower_chalice:scenario_client
          80C88003|ambient|ambient_city_tower:scenario_client
          EOF
      - name: Cross-scenario population and broom-distance join
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob,json,math,os,collections
          broom=(127.7325210571289,93.54338836669922,-9.023451805114746)
          activity=[]; nearest=[]; unique_entities=collections.defaultdict(set); unique_tables=collections.defaultdict(set)
          all_locs=[]
          for fn in sorted(glob.glob('out/*.json')):
              if fn.endswith('summary.json'): continue
              d=json.load(open(fn)); slug=os.path.basename(fn)[:-5]
              activity.append({
                'slug':slug,'activity_hash':d['activity']['tag_hash'],'activity_name':d['activity']['name'],
                'f603_count':d['f603_count'],'scripted_owner_f603_count':d['scripted_owner_f603_count'],
                'unique_scripted_table_count':d['unique_scripted_table_count'],'scripted_record_count':d['scripted_record_count'],
                'scripted_location_count':d.get('scripted_location_count',0),'singleton_entity_location_pair_count':d.get('singleton_entity_location_pair_count',0),
                'violations':d['violations'],
              })
              for h in d.get('scripted_entity_hash_counts',{}): unique_entities[h].add(slug)
              for h in d.get('unique_scripted_tables',[]): unique_tables[h].add(slug)
              rows=[]
              for t in d.get('scripted_tables',[]):
                  ents=sorted({r.get('entity_hash') for r in t.get('records',[]) if r.get('entity_hash') not in (None,'00000000','FFFFFFFF')})
                  types=sorted({r.get('type_string_hash') for r in t.get('records',[]) if r.get('type_string_hash') not in (None,'00000000','FFFFFFFF')})
                  for loc in t.get('locations',[]):
                      p=loc.get('location')
                      if not p or len(p)<3: continue
                      dist=math.sqrt(sum((float(p[i])-broom[i])**2 for i in range(3)))
                      row={'scenario':slug,'distance_to_broom':dist,'d912':t['scripted_entity_table'],'location_index':loc.get('index'),
                           'location':p,'rotation':loc.get('rotation'),'entity_hashes':ents,'type_string_hashes':types,
                           'entity_record_count':len(t.get('records',[])),'location_count':len(t.get('locations',[])),
                           'singleton_entity_location_pair':t.get('singleton_entity_location_pair')}
                      rows.append(row);all_locs.append(row)
              rows.sort(key=lambda x:x['distance_to_broom'])
              nearest.append({'scenario':slug,'nearest':rows[:15],'within_1m':[x for x in rows if x['distance_to_broom']<1.0],
                              'within_5m':[x for x in rows if x['distance_to_broom']<5.0],
                              'within_15m':[x for x in rows if x['distance_to_broom']<15.0]})
          all_locs.sort(key=lambda x:x['distance_to_broom'])
          summary={
            'status':'D1_TOWER_ALL_SCENARIO_AI_LOCATION_CENSUS_COMPLETE',
            'broom_world_translation':broom,
            'activities':activity,
            'unique_scripted_entity_count_across_scenarios':len(unique_entities),
            'entity_scenario_membership':{h:sorted(v) for h,v in sorted(unique_entities.items())},
            'unique_d912_count_across_scenarios':len(unique_tables),
            'd912_scenario_membership':{h:sorted(v) for h,v in sorted(unique_tables.items())},
            'per_scenario_nearest':nearest,
            'all_scenario_nearest_to_broom':all_locs[:100],
            'all_scenario_within_1m':[x for x in all_locs if x['distance_to_broom']<1.0],
            'all_scenario_within_5m':[x for x in all_locs if x['distance_to_broom']<5.0],
            'all_scenario_within_15m':[x for x in all_locs if x['distance_to_broom']<15.0],
            'policy':'D912 S2B138080 locations are exact source-owned scenario locations. When a D912 has multiple entity records or locations, proximity narrows candidates but does not assign a specific entity to a location.'
          }
          assert not [x for x in activity if x['violations']], [x for x in activity if x['violations']]
          json.dump(summary,open('out/TOWER_ALL_SCENARIO_AI_LOCATION_SUMMARY.json','w'),indent=2)
          print('ACTIVITIES')
          for x in activity: print(x)
          print('UNIQUE_ENTITIES',len(unique_entities),'UNIQUE_D912',len(unique_tables))
          print('WITHIN_1M',len(summary['all_scenario_within_1m']))
          print('WITHIN_5M',len(summary['all_scenario_within_5m']))
          print('NEAREST_ALL')
          for x in all_locs[:30]: print(x)
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-TOWER-ALL-SCENARIO-AI-LOCATION-CENSUS
          path: out/
          retention-days: 30
          if-no-files-found: error
