name: D1 Guardian 67-bone owner backlinks

on:
  push:
    paths:
      - '.github/workflows/d1-guardian-67bone-owner-backlinks.yml'
      - 'tools/d1_character_owner_backlinks.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact 00EC retail family and Oodle
        run: |
          set -euo pipefail
          mkdir -p runtime recovered out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --start-offset 0xAAB580800 \
            --target ps4_race_set_all_00ec_0.pkg --target ps4_race_set_all_00ec_1.pkg \
            --target ps4_race_set_all_00ec_2.pkg --target ps4_race_set_all_00ec_3.pkg \
            --target ps4_race_set_all_00ec_4.pkg --target ps4_race_set_all_00ec_5.pkg \
            --out recovered --manifest out/00ec_extract.json --retries 6 --timeout 90
      - name: Scan every readable payload for exact family backlinks
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_character_owner_backlinks.py recovered/ps4_race_set_all_00ec_5.pkg \
            --runtime runtime \
            --target 809D8613 --target 809D856E \
            --target 809D8469 --target 809D846A --target 809D8572 \
            --max-entry-size 8000000 \
            -o out/809D8613_family_backlinks.json
          python - <<'PY'
          import json
          d=json.load(open('out/809D8613_family_backlinks.json'))
          print('SCANNED',d['scanned_entry_count'],'hit sources',d['source_with_hit_count'])
          for target,rows in d['backlinks'].items():
              print('\nTARGET',target,'backlinks',len(rows))
              for r in rows:
                  s=r['source']
                  print(' ',s['tag_hash'],'ref',s['reference'],'idx',s['entry_index'],'offs',r['offsets'],
                        'with',r['cooccurring_targets'])
          print('\nCOOCCURRENCE GROUPS')
          for x in d['cooccurrence_groups'][:30]: print(x)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-guardian-67bone-owner-backlinks
          path: out/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
