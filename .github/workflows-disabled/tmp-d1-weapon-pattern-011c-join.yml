name: Temporary join D1 weapon patterns to retail entities

on:
  push:
    paths:
      - '.github/workflows/tmp-d1-weapon-pattern-011c-join.yml'
      - 'tools/d1_weapon_pattern_assignment_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Recover verified Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Recover fixed D1 Investment weapon-pattern globals
        run: |
          set -euo pipefail
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x61A5CB200 \
            --target ps4_investment_globals_012f_0.pkg --target ps4_investment_globals_012f_1.pkg \
            --target ps4_investment_globals_012f_2.pkg --target ps4_investment_globals_012f_3.pkg \
            --target ps4_investment_globals_012f_4.pkg --target ps4_investment_globals_012f_5.pkg \
            --target ps4_investment_globals_012f_6.pkg \
            --out recovered --manifest reports/012f_extract.json --retries 6 --timeout 90
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x5A9421400 \
            --target ps4_investment_assets_013f_1.pkg --target ps4_investment_assets_013f_2.pkg \
            --target ps4_investment_assets_013f_3.pkg --target ps4_investment_assets_013f_4.pkg \
            --target ps4_investment_assets_013f_5.pkg \
            --out recovered --manifest reports/013f_extract.json --retries 6 --timeout 90

      - name: Recover 011c logical weapon family for negative validation
        run: |
          set -euo pipefail
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --start-offset 0x43779C800 \
            --target ps4_gear_weapons_011c_0.pkg --target ps4_gear_weapons_011c_1.pkg \
            --target ps4_gear_weapons_011c_2.pkg --target ps4_gear_weapons_011c_3.pkg \
            --target ps4_gear_weapons_011c_5.pkg \
            --out recovered --manifest reports/011c_extract.json --retries 6 --timeout 90

      - name: Join pattern table and census actual entity packages
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_weapon_pattern_assignment_probe.py \
            recovered/ps4_investment_globals_012f_6.pkg \
            recovered/ps4_investment_assets_013f_5.pkg \
            --runtime runtime \
            --target-package-id 0x011c \
            --target-pkg recovered/ps4_gear_weapons_011c_5.pkg \
            -o reports/weapon_pattern_join.json

          python - <<'PY'
          import collections,json
          p='reports/weapon_pattern_join.json'
          d=json.load(open(p))
          rows=d['patterns']
          if d['join']['missing_assignment_count'] != 0:
              raise SystemExit(f"weapon-pattern join unexpectedly has misses: {d['join']}")
          counts=collections.Counter(x['entity_relation_package_id'] for x in rows)
          by_pkg={}
          for pkg,count in sorted(counts.items(), key=lambda kv:(-kv[1], kv[0] if kv[0] is not None else -1)):
              samples=[x for x in rows if x['entity_relation_package_id']==pkg][:8]
              by_pkg[f'{pkg:04X}' if pkg is not None else 'NONE']={
                  'count':count,
                  'samples':[{
                      'weapon_pattern_index':x['weapon_pattern_index'],
                      'pattern_global_tag_id_hash':x['pattern_global_tag_id_hash'],
                      'weapon_content_group_hash':x['weapon_content_group_hash'],
                      'weapon_type_hash':x['weapon_type_hash'],
                      'pattern_hash':x['pattern_hash'],
                      'entity_relation_hash':x['entity_relation_hash'],
                      'entity_relation_file_index':x['entity_relation_file_index'],
                  } for x in samples]
              }
          census={
              'weapon_pattern_rows':len(rows),
              'resolved_assignment_rows':d['join']['resolved_assignment_count'],
              'missing_assignment_rows':d['join']['missing_assignment_count'],
              'direct_011c_pattern_entities':d['match_count'],
              'entity_relation_package_count':len(counts),
              'entity_relation_packages':by_pkg,
          }
          json.dump(census,open('reports/weapon_pattern_package_census.json','w'),indent=2)
          print(json.dumps(census,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: d1-weapon-pattern-package-census
          path: reports/
          retention-days: 5
          if-no-files-found: error
