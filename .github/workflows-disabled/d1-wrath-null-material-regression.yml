name: D1 Wrath explicit-null material regression

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-wrath-null-material-regression.yml'
      - 'tools/d1_world_entity_model_material_bindings.py'
      - 'tools/d1_remote_activity_model_material_bindings.py'
      - 'tools/d1_activity_selected_material_plan.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  WRATH_SOURCE_ARTIFACT_ID: '10003468849'
  WRATH_SOURCE_ARTIFACT_ZIP_SHA256: '81c395d9be86c569b96e0de1e79f852f8f7d642aa33344fc7807d505feee0999'

jobs:
  wrath-null-material:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover verified universal catalog and prior Wrath closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog input/wrath runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${WRATH_SOURCE_ARTIFACT_ID}/zip" -o input/wrath.zip
          echo "${WRATH_SOURCE_ARTIFACT_ZIP_SHA256}  input/wrath.zip" | sha256sum --check --strict
          unzip -q input/wrath.zip -d input/wrath
          test -f input/wrath/wrath/entity_dependency_closure.json
          test -f input/wrath/wrath/activity_model_visual_dependency_closure.json

      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Rebind exact Wrath materials with null semantics
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile \
            tools/d1_world_entity_model_material_bindings.py \
            tools/d1_remote_activity_model_material_bindings.py \
            tools/d1_activity_selected_material_plan.py
          python tools/d1_remote_activity_model_material_bindings.py \
            --entity-closure input/wrath/wrath/entity_dependency_closure.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime \
            -o out/wrath_activity_model_material_bindings.json \
            | tee out/wrath_material_bindings.txt
          python - <<'PY'
          import json
          d=json.load(open('out/wrath_activity_model_material_bindings.json'))
          assert d['status']=='D1_REMOTE_ACTIVITY_MODEL_MATERIAL_BINDINGS_COMPLETE',d['violations'][:20]
          assert not d['violations'],d['violations'][:20]
          assert d['model_parent_pair_count']==87,d['model_parent_pair_count']
          assert d['validated_pair_count']==87,d['validated_pair_count']
          assert d['part_count']==5471,d['part_count']
          assert d['external_variant_part_count']==1968,d['external_variant_part_count']
          assert d['explicit_null_material_part_count']==25,d['explicit_null_material_part_count']
          assert d['renderable_material_part_count']==5446,d['renderable_material_part_count']
          assert d['selection_status_counts'].get('EXPLICIT_NULL_MATERIAL')==25,d['selection_status_counts']
          assert 'FFFFFFFF' not in d['selected_materials'] and '00000000' not in d['selected_materials']
          print('WRATH_NULL_MATERIAL_CLOSED',d['model_parent_pair_count'],d['explicit_null_material_part_count'],d['unique_selected_material_count'])
          PY

      - name: Build exact Wrath selected Material plan
        run: |
          set -euo pipefail
          python tools/d1_activity_selected_material_plan.py \
            --visual-closure input/wrath/wrath/activity_model_visual_dependency_closure.json \
            --material-bindings out/wrath_activity_model_material_bindings.json \
            -o out/wrath_activity_selected_material_plan.json \
            | tee out/wrath_selected_material_plan.txt
          python - <<'PY'
          import json
          d=json.load(open('out/wrath_activity_selected_material_plan.json'))
          assert d['status']=='D1_ACTIVITY_SELECTED_MATERIAL_PLAN_COMPLETE',d
          assert not d['violations'],d['violations']
          assert d['explicit_null_material_part_count']==25,d
          assert not d['unresolved_external_variant_models'],d['unresolved_external_variant_models']
          assert 'FFFFFFFF' not in d['materials'] and '00000000' not in d['materials']
          print('WRATH_SELECTED_MATERIAL_PLAN',d['unique_material_count'])
          PY
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-WRATH-EXPLICIT-NULL-MATERIAL-REGRESSION
          path: out/
          retention-days: 30
          if-no-files-found: error
