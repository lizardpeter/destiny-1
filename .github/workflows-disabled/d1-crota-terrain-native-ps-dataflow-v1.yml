name: D1 Crota terrain native PS dataflow v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-terrain-native-ps-dataflow-v1.yml'
      - 'tools/d1_world_terrain_ps_resource_census.py'
      - 'tools/d1_world_shader_extract.py'
      - 'tools/d1_gcn_image_usage_analyze.py'
      - 'tools/d1_material_decode.py'
      - 'tools/d1_ps4_shader_binary_probe.py'

permissions:
  contents: read
  actions: read

env:
  TERRAIN_LAYOUT_ARTIFACT_ID: '10056800992'
  TERRAIN_LAYOUT_ARTIFACT_SHA256: 'ce44de0c43089fb9ee94ea01b7474796b1eab6e050aafa43ab39f32a1eb061a0'
  CLRX_COMMIT: 'fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df'
  LINOODLE_SKIP_DLLMAIN: '1'

jobs:
  dataflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover authoritative terrain census and archive identity
        run: |
          set -euo pipefail
          mkdir -p input runtime packages shader_expanded shader disasm out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${TERRAIN_LAYOUT_ARTIFACT_ID}/zip" -o input/layout.zip
          echo "${TERRAIN_LAYOUT_ARTIFACT_SHA256}  input/layout.zip" | sha256sum --check --strict
          unzip -q input/layout.zip -d input/layout
          census="$(find input/layout -name terrain_census_final.json -type f -print -quit)"
          test -n "$census"
          cp "$census" out/terrain_census_final.json
          python - <<'PY'
          import json
          d=json.load(open('out/terrain_census_final.json'))
          assert d['status']=='D1_WORLD_TERRAIN_CENSUS_COMPLETE' and not d['violations'] and not d['missing_dependency_package_ids'],d
          assert d['unique_terrain_count']==49 and d['selected_main_geom0_part_count']==1582 and d['unique_selected_material_count']==108,d
          print('TERRAIN_CENSUS_ACCEPTED',d['unique_terrain_count'],d['selected_main_geom0_part_count'],d['unique_selected_material_count'])
          PY
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl -fsSL --retry 8 'https://github.com/lizardpeter/destiny-1/releases/download/d1-global-activity-index-r1/D1_CURRENT_ACTIVITY_INDEX.json' -o out/D1_CURRENT_ACTIVITY_INDEX.json
          curl -fsSL --retry 4 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o out/packages.txt
          python - <<'PY'
          import hashlib,json
          d=json.load(open('out/D1_CURRENT_ACTIVITY_INDEX.json'));h=hashlib.sha256(open('out/packages.txt','rb').read()).hexdigest()
          assert d['status']=='D1_REMOTE_ACTIVITY_INDEX_COMPLETE' and h==(d.get('source') or {}).get('package_list_sha256'),(h,d.get('source'))
          print('ARCHIVE_INDEX_ACCEPTED',h)
          PY

      - name: Recover terrain material owner corpus
        run: |
          set -euo pipefail
          python tools/d1_recover_indexed_package_families.py \
            --index out/D1_CURRENT_ACTIVITY_INDEX.json --package-list out/packages.txt \
            --package-id 02b7 --package-id 02ba --package-id 02bb \
            --package-id 0430 --package-id 0431 --package-id 0458 \
            --out-dir packages --report out/base_package_recovery.json

      - name: Close every selected terrain PixelShader and native resource table
        run: |
          set -euo pipefail
          for pass in 1 2 3 4; do
            mapfile -t files < <(find packages shader_expanded -maxdepth 1 -name '*.pkg' -type f | sort -u)
            args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
            set +e
            python tools/d1_world_terrain_ps_resource_census.py "${args[@]}" --runtime runtime \
              --terrain-census out/terrain_census_final.json --out "out/terrain_ps_resources_pass${pass}.json"
            rc=$?
            set -e
            test "$rc" -eq 0 -o "$rc" -eq 2
            cp "out/terrain_ps_resources_pass${pass}.json" out/terrain_ps_resources_final.json
            python - "$pass" <<'PY'
          import json,sys
          p=sys.argv[1];d=json.load(open(f'out/terrain_ps_resources_pass{p}.json'))
          ids=sorted((d.get('missing_dependency_package_ids') or {}).keys())
          open('out/missing_ps_package_ids.txt','w').write(''.join(x+'\n' for x in ids))
          print('TERRAIN_PS_PASS',p,d['status'],'materials',d['resolved_selected_material_count'],'/',d['selected_material_count'],'pixel_shaders',d['resolved_pixel_shader_count'],'/',d['unique_pixel_shader_count'],'missing',ids)
          PY
            if [ ! -s out/missing_ps_package_ids.txt ]; then break; fi
            rargs=(); while read -r p; do rargs+=(--package-id "$p"); done < out/missing_ps_package_ids.txt
            python tools/d1_recover_indexed_package_families.py \
              --index out/D1_CURRENT_ACTIVITY_INDEX.json --package-list out/packages.txt \
              "${rargs[@]}" --out-dir shader_expanded --report "out/ps_package_recovery_pass${pass}.json"
          done
          python - <<'PY'
          import json
          d=json.load(open('out/terrain_ps_resources_final.json'))
          assert d['status']=='D1_WORLD_TERRAIN_PS_RESOURCE_CENSUS_COMPLETE',d
          assert d['selected_material_count']==108 and d['resolved_selected_material_count']==108,d
          assert d['unique_pixel_shader_count']==d['resolved_pixel_shader_count'] and d['unique_pixel_shader_count']>0,d
          assert d['native_stage_histogram']=={'PixelShader':d['unique_pixel_shader_count']},d
          assert not d['missing_dependency_package_ids'] and not d['violations'],d
          json.dump({'pixel_shader_frequency':d['pixel_shader_frequency']},open('out/terrain_shader_manifest.json','w'),indent=2)
          print('TERRAIN_PS_RESOURCE_TABLES_CLOSED','unique_ps',d['unique_pixel_shader_count'],'frequency',d['pixel_shader_frequency'],'texture_api_layouts',d['native_texture_api_slot_histogram'])
          PY

      - name: Extract all bounded native terrain GCN programs
        run: |
          set -euo pipefail
          mapfile -t files < <(find packages shader_expanded -maxdepth 1 -name '*.pkg' -type f | sort -u)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          n="$(python - <<'PY'
          import json
          print(json.load(open('out/terrain_ps_resources_final.json'))['unique_pixel_shader_count'])
          PY
          )"
          python tools/d1_world_shader_extract.py "${args[@]}" --runtime runtime \
            --manifest out/terrain_shader_manifest.json --top "$n" \
            --out-dir shader --report out/TERRAIN_SHADER_EXTRACT.json
          python - <<'PY'
          import json
          d=json.load(open('out/TERRAIN_SHADER_EXTRACT.json'));c=json.load(open('out/terrain_ps_resources_final.json'))
          assert d['status']=='D1_WORLD_PIXEL_SHADER_GCN_EXACT' and d['error_count']==0,d
          assert d['selected_count']==c['unique_pixel_shader_count'],(d,c['unique_pixel_shader_count'])
          print('TERRAIN_GCN_EXTRACTED',[(x['shader'],x['native_shader'],x['gcn_bytes'],x['gcn_sha256']) for x in d['shaders']])
          PY

      - name: Build pinned GFX700 disassembler and disassemble every terrain PS
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/CLRX/CLRX-mirror.git clrx
          git -C clrx checkout --quiet "$CLRX_COMMIT"
          test "$(git -C clrx rev-parse HEAD)" = "$CLRX_COMMIT"
          cmake -S clrx -B clrx/build -DCMAKE_BUILD_TYPE=Release -DNO_CLWRAPPER=ON -DBUILD_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_DOCUMENTATION=OFF >/dev/null
          cmake --build clrx/build --target clrxdisasm -j2 >/dev/null
          exe="$(find clrx/build -type f -name clrxdisasm -perm -111 | head -1)"; test -n "$exe"
          shopt -s nullglob
          n=0
          for f in shader/PS_*_gcn.bin; do
            b="$(basename "$f" _gcn.bin)"
            "$exe" --raw --gpuType=GFX700 --hexcode "$f" > "disasm/${b}.s" 2> "disasm/${b}.stderr"
            test ! -s "disasm/${b}.stderr"
            grep -q 's_endpgm' "disasm/${b}.s"
            n=$((n+1))
          done
          expected="$(python - <<'PY'
          import json
          print(json.load(open('out/terrain_ps_resources_final.json'))['unique_pixel_shader_count'])
          PY
          )"
          test "$n" -eq "$expected"

      - name: Close native image instructions to exact terrain texture indices
        run: |
          set -euo pipefail
          python tools/d1_gcn_image_usage_analyze.py \
            --extract-report out/TERRAIN_SHADER_EXTRACT.json --disasm-dir disasm \
            --out out/TERRAIN_GCN_IMAGE_USAGE.json
          python - <<'PY'
          import json
          c=json.load(open('out/terrain_ps_resources_final.json'));u=json.load(open('out/TERRAIN_GCN_IMAGE_USAGE.json'))
          assert u['status']=='D1_GCN_IMAGE_RESOURCE_USAGE_EXACT',u
          rows={x['shader']:x for x in u['shaders']}
          assert set(rows)==set(c['pixel_shader_frequency']),(set(rows),set(c['pixel_shader_frequency']))
          for h in sorted(rows):
            r=rows[h]
            assert r['unmatched_image_instruction_count']==0,r
            print('TERRAIN_PIXEL',h,'materials',c['pixel_shader_frequency'][h],'image_instructions',r['image_instruction_count'],'used_texture_indices',r['used_texture_indices'],'ops',r['image_opcodes'])
          out={
            'schema_version':1,
            'status':'D1_CROTA_TERRAIN_NATIVE_PS_DATAFLOW_EXACT',
            'activity':'810B0002',
            'terrain_count':49,
            'selected_main_geom0_part_count':1582,
            'selected_material_count':108,
            'unique_pixel_shader_count':c['unique_pixel_shader_count'],
            'pixel_shader_frequency':c['pixel_shader_frequency'],
            'native_texture_api_slot_histogram':c['native_texture_api_slot_histogram'],
            'image_usage_status':u['status'],
            'pixel_shaders':u['shaders'],
            'proof_boundary':'Exact retail PS4 terrain materials -> +0x2A8 PixelShader -> native OrbShdr InputUsageSlot -> bounded GCN image instructions. Image resource indices are exact. No diffuse/normal/dyemap semantic role or blend equation is assigned without instruction-level proof.',
          }
          json.dump(out,open('out/FINAL_CROTA_TERRAIN_NATIVE_PS_DATAFLOW.json','w'),indent=2)
          PY
          cp disasm/PS_*.s out/
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-TERRAIN-NATIVE-PS-DATAFLOW-V1
          path: out/
          retention-days: 30
          if-no-files-found: error
