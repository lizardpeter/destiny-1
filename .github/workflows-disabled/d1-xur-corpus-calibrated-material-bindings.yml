name: D1 Xur corpus-calibrated visual material bindings

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-corpus-calibrated-material-bindings.yml'
      - 'tools/d1_xur_corpus_calibrated_material_bindings.py'

permissions: {contents: read, actions: read}

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {GH_TOKEN: '${{ github.token }}', LINOODLE_SKIP_DLLMAIN: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover catalog and runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime reports
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Evaluate every Xur external material group
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_xur_corpus_calibrated_material_bindings.py
          set +e
          python tools/d1_xur_corpus_calibrated_material_bindings.py \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            --config-pair 26170C92=4AC210DE \
            -o reports/D1_XUR_CORPUS_CALIBRATED_VISUAL_MATERIAL_BINDINGS.json | tee reports/stdout.txt
          rc=${PIPESTATUS[0]}; set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json
          d=json.load(open('reports/D1_XUR_CORPUS_CALIBRATED_VISUAL_MATERIAL_BINDINGS.json'))
          assert d['proof']['D1_retail_consumer_execution_path_proven'] is False,d['proof']
          assert d['proof']['descriptor_evaluation_algorithm_source_closed'] is False,d['proof']
          assert all(v is False for v in d['gates'].values()),d['gates']
          if not d['violations']:
              assert d['status']=='D1_WORLD_ENTITY_MODEL_MATERIAL_BINDINGS_COMPLETE',d
              assert d['xur_status']=='D1_XUR_CORPUS_CALIBRATED_VISUAL_MATERIAL_BINDINGS_COMPLETE',d
              assert d['proof']['all_xur_external_parts_unique_under_candidate_rule'] is True,d['proof']
              assert len(d['calibrated_external_part_selections'])==d['external_variant_part_count'],d
          print('XUR_CALIBRATED_BINDING',d['xur_status'],'external',len(d['calibrated_external_part_selections']),'/',d['external_variant_part_count'],'materials',d['unique_selected_material_count'])
          PY
      - name: Persist hashes
        if: always()
        run: find reports -type f -print0 | sort -z | xargs -0 sha256sum > reports/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: D1-XUR-CORPUS-CALIBRATED-VISUAL-MATERIAL-BINDINGS, path: reports/, retention-days: 90, if-no-files-found: error}
