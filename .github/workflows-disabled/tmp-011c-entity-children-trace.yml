name: Temporary trace 011c weapon entity children

on:
  push:
    paths:
      - '.github/workflows/tmp-011c-entity-children-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover runtime and 011c package family
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --start-offset 0x43779C800 \
            --target ps4_gear_weapons_011c_0.pkg --target ps4_gear_weapons_011c_1.pkg \
            --target ps4_gear_weapons_011c_2.pkg --target ps4_gear_weapons_011c_3.pkg --target ps4_gear_weapons_011c_5.pkg \
            --out recovered --manifest reports/011c_extract.json --retries 6 --timeout 90
      - name: Probe every EntityResource and target entity references
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_entity_resource_probe.py recovered/ps4_gear_weapons_011c_5.pkg --runtime runtime -o reports/entity_resources.json
          python - <<'PY'
          import json,struct,sys,hashlib
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader
          r=EntryReader(Path('recovered/ps4_gear_weapons_011c_5.pkg'),Path('runtime'))
          byhash={e['tag_hash'].upper():e for e in r.entries}
          e=byhash['80A39E0E']; b=r.entry(e['index'])
          refs=[]
          for o in range(0,len(b)-3,4):
              v=struct.unpack_from('<I',b,o)[0]; h=f'{v:08X}'
              q=byhash.get(h)
              if q:
                  refs.append({'offset':o,'value':h,'index':q['index'],'reference':q['reference'].upper(),'type':q['type'],'subtype':q['subtype'],'size':q['file_size'],'available':r.available(q['index'])})
          out={'entity':'80A39E0E','entry_index':e['index'],'size':len(b),'sha256':hashlib.sha256(b).hexdigest(),'payload_hex':b.hex(),'local_tag_references':refs}
          Path('reports/80A39E0E_refs.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          er=json.load(open('reports/entity_resources.json'))
          print('=== nearby / target-linked EntityResources ===')
          refhash={x['value'] for x in refs if x['reference']=='80800861'}
          for x in er['resources']:
              if x['tag_hash'].upper() in refhash or abs(x['entry_index']-e['index'])<32:
                  print(json.dumps(x,indent=2))
          PY
      - name: Record exact Charm D1 child schemas
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/MontagueM/Charm/50d36ee1f9ecadad7522504c20b1f3f9c97e30af/Tiger/Schema/Entity/EntityStructs.cs' \
            -o reports/Charm_EntityStructs.cs
          for pat in 'struct SEntity' 'struct D2Class_12848080' 'struct D2Class_0E848080' 'struct S712B8080' 'struct S93278080'; do
            echo "===== $pat ====="
            grep -n -B8 -A45 "$pat" reports/Charm_EntityStructs.cs || true
          done | tee reports/charm_child_schema_excerpt.txt
      - uses: actions/upload-artifact@v4
        with:
          name: d1-011c-entity-children-trace
          path: reports/
          retention-days: 2
          if-no-files-found: error
