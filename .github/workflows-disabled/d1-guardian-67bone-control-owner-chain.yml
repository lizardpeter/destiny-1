name: D1 Guardian 67-bone control owner chain

on:
  push:
    paths:
      - '.github/workflows/d1-guardian-67bone-control-owner-chain.yml'
      - 'tools/d1_character_owner_backlinks.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact 00EC retail family and Oodle
        run: |
          set -euo pipefail
          mkdir -p runtime recovered out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --start-offset 0xAAB580800 \
            --target ps4_race_set_all_00ec_0.pkg --target ps4_race_set_all_00ec_1.pkg \
            --target ps4_race_set_all_00ec_2.pkg --target ps4_race_set_all_00ec_3.pkg \
            --target ps4_race_set_all_00ec_4.pkg --target ps4_race_set_all_00ec_5.pkg \
            --out recovered --manifest out/00ec_extract.json --retries 6 --timeout 90
      - name: Walk literal backlinks three hops above both controls
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_character_owner_backlinks import scan_package

          pkg=Path('recovered/ps4_race_set_all_00ec_5.pkg'); runtime=Path('runtime')
          frontier=['809D8466','809D856F']
          seen=set(frontier)
          result={'schema':'d1_literal_owner_chain/v1','roots':frontier.copy(),'hops':[]}
          for hop in range(1,4):
              if not frontier: break
              rep=scan_package(pkg,runtime,frontier,max_entry_size=8_000_000)
              Path(f'out/control_owner_hop{hop}.json').write_text(json.dumps(rep,indent=2)+'\n')
              sources=[]
              for row in rep['source_rows']:
                  h=row['source']['tag_hash']
                  if h not in seen:
                      seen.add(h);sources.append(h)
              result['hops'].append({'hop':hop,'targets':frontier,'new_sources':sources,
                                     'source_rows':rep['source_rows'],'cooccurrence_groups':rep['cooccurrence_groups']})
              print('\nHOP',hop,'targets',frontier,'new sources',sources)
              for row in rep['source_rows']:
                  s=row['source']
                  print(' ',s['tag_hash'],'ref',s['reference'],'idx',s['entry_index'],
                        'hits',[(h['target'],h['offset']) for h in row['hits']])
              frontier=sources
          result['all_discovered']=sorted(seen)
          Path('out/67bone_control_owner_chain.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-guardian-67bone-control-owner-chain
          path: out/
          retention-days: 14
          if-no-files-found: warn
          compression-level: 6
