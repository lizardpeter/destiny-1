name: D1 global scope class census

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/d1_remote_reference_class_census.py'
      - '.github/workflows/d1-global-scope-class-census.yml'

permissions: {contents: read, actions: read}

env:
  GH_TOKEN: '${{ github.token }}'
  LINOODLE_SKIP_DLLMAIN: '1'
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover pinned universal catalog and Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out/payloads
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Enumerate all current D1 s_scope entries
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_reference_class_census.py
          python tools/d1_remote_reference_class_census.py \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime \
            --reference 80801C47 --reference 80801AD0 \
            --dump-dir out/payloads \
            -o out/D1_GLOBAL_SCOPE_CLASS_CENSUS.json | tee out/stdout.txt
          python - <<'PY'
          import json,pathlib
          d=json.load(open('out/D1_GLOBAL_SCOPE_CLASS_CENSUS.json'))
          assert d['status']=='D1_REMOTE_REFERENCE_CLASS_CENSUS_EXACT',d['violations']
          assert d['package_family_count']==d['opened_package_family_count']==337,d
          assert int(d['reference_counts'].get('80801C47',0))>0,d['reference_counts']
          assert d['gates']['all_matching_payloads_recovered'] is True,d['gates']
          assert len(list(pathlib.Path('out/payloads').glob('*.bin')))==d['matching_entry_count'],d
          print('GLOBAL_SCOPE_CENSUS_GREEN',d['reference_counts'],d['package_counts'],d['declared_size_histogram'])
          PY
      - name: Persist hashes
        if: always()
        run: find out -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-GLOBAL-SCOPE-CLASS-CENSUS
          path: out/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
