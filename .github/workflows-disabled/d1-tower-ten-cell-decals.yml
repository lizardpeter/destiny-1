name: D1 Tower ten-cell embedded decals

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-ten-cell-decals.yml'
      - 'tools/d1_tower_static_map_decal_validate.py'

permissions:
  contents: read

jobs:
  decals:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover current Tower corpus and runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py --package-list reports/packages.txt --out-dir recovered --report reports/current_corpus.json
      - name: Validate all ten SStaticMapData embedded decal arrays
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          mkdir -p reports/decals
          for h in 80C98254 80C984D8 80C98A6B 80C993CD 80C993CF 80C997F5 80C99981 80CA0B70 80CA0B72 80CA0C60; do
            python tools/d1_tower_static_map_decal_validate.py "${args[@]}" --runtime runtime \
              --static-map-data "$h" --out "reports/decals/${h}.json" | tee "reports/decals/${h}.txt"
          done
          python - <<'PY'
          import glob,json
          rows=[]
          for p in sorted(glob.glob('reports/decals/*.json')):
              d=json.load(open(p)); s=d['summary']; rows.append({
                'static_map_data':d['static_map_data'], **s, 'ok':d['ok']})
          out={
            'cell_count':len(rows),
            'total_decal_records':sum((x['decal_count'] or 0) for x in rows),
            'total_model_reference_occurrences':sum(x['model_reference_occurrences'] for x in rows),
            'unique_entity_models_union':len({h for p in glob.glob('reports/decals/*.json') for d in [json.load(open(p))] for r in d['decals'] for m in r.get('models',[]) if m.get('reference_matches') for h in [m['hash']]}),
            'rows':rows,
          }
          open('reports/ten_cell_decal_summary.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-ten-cell-embedded-decals
          path: reports/
          retention-days: 14
          compression-level: 6
