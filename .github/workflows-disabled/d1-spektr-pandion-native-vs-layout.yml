name: D1 Spektar Pandion native VS layout

on:
  push:
    paths:
      - '.github/workflows/d1-spektr-pandion-native-vs-layout.yml'
      - 'tools/d1_guardian_native_vs_layout_probe.py'
      - 'tools/d1_ps4_shader_binary_probe.py'
      - 'evidence/d1_investment_asset_member_catalog.json'
      - 'evidence/d1_player_gear_member_catalog.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          python -m pip install -q numpy trimesh
          mkdir -p runtime out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Probe the four resident Spektar native vertex shaders
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_guardian_native_vs_layout_probe.py \
            --vertex-shader 80A087F1 --vertex-shader 80A08817 \
            --vertex-shader 80A08819 --vertex-shader 80A08A01 \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --member-catalog evidence/d1_player_gear_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/spektar_native_vs_layout.json

      - name: Validate framing
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/spektar_native_vs_layout.json'))
          assert d['schema']=='d1_guardian_native_vs_layout_probe/v1',d
          assert d['vertex_shader_count']==4,d
          assert d['resolved_header_count']==4,d
          assert d['resolved_native_count']==4,d
          assert d['orbshdr_resolved_count']==4,d
          for r in d['rows']:
              assert r['binary_info']['stage']=='VertexShader',r
              m=r['metadata_layout']
              assert m['bytes_code_to_slots'] >= 0,m
              assert m['bytes_slots'] == r['binary_info']['num_input_usage_slots']*4,m
              assert m['bytes_masks'] == r['binary_info']['chunk_usage_base_offset_dwords']*4,m
          print('SPEKTAR NATIVE VS METADATA FRAMING VALIDATED')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-spektr-pandion-native-vs-layout
          path: out/
          retention-days: 14
          if-no-files-found: error
