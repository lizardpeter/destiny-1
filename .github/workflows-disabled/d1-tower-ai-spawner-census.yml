name: D1 Tower nested AI spawner census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-ai-spawner-census.yml'
      - 'tools/d1_tower_ai_spawner_census.py'
      - 'tools/d1_world_scripted_entity_identity_census.py'
      - 'tools/d1_world_entity_dependency_census.py'
      - 'tools/d1_world_activity_entity_table_census.py'
      - 'tools/d1_world_activity_entity_resource_census.py'
      - 'tools/d1_tower_recover_current_corpus.py'
      - 'tools/d1_tower_recover_activity_root_corpus.py'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install exact runtime and recover Tower corpus
        run: |
          set -euo pipefail
          mkdir -p runtime recovered roots reports
          python -m py_compile tools/d1_tower_ai_spawner_census.py
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py --package-list reports/packages.txt --out-dir recovered --report reports/current_corpus.json
          python tools/d1_tower_recover_activity_root_corpus.py --package-list reports/packages.txt --out-dir roots --report reports/root_corpus.json

      - name: Reconstruct exact Activity placement inputs
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t deps < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          mapfile -t rootsf < <(find roots -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${deps[@]}" "${rootsf[@]}"; do args+=(--snapshot "$f"); done
          rootargs=(); for f in "${rootsf[@]}"; do rootargs+=(--named-root-snapshot "$f"); done
          set +e
          python tools/d1_world_activity_entity_table_census.py "${args[@]}" "${rootargs[@]}" --runtime runtime --out reports/entity_tables.json
          rc=$?; set -e; test "$rc" -eq 0 -o "$rc" -eq 2
          set +e
          python tools/d1_world_activity_entity_resource_census.py "${args[@]}" --runtime runtime --entity-table-census reports/entity_tables.json --out reports/runtime_placements.json
          rc=$?; set -e; test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json
          d=json.load(open('reports/runtime_placements.json'))
          assert not d['violations'], d['violations'][:20]
          assert d['unique_runtime_world_placement_count']==1215, d['unique_runtime_world_placement_count']
          e=json.load(open('reports/entity_tables.json'))
          names={x['name'] for x in e['named_tag_discovery']['selected_activities']}
          assert 'ambient_city_tower:scenario_client' in names
          PY

      - name: Follow Charm NPC enemy AI carrier path
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered roots -maxdepth 1 -name '*.pkg' -type f | sort -u)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          set +e
          python tools/d1_tower_ai_spawner_census.py "${args[@]}" --runtime runtime \
            --entity-tables reports/entity_tables.json --placements reports/runtime_placements.json \
            --out reports/TOWER_AI_SPAWNER_CENSUS.json | tee reports/TOWER_AI_SPAWNER_CENSUS_stdout.txt
          rc=${PIPESTATUS[0]}; set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_AI_SPAWNER_CENSUS.json'))
          print('AI carriers',d['charm_ai_carrier_count'])
          print('ambient AI carriers',d['ambient_city_tower_ai_carrier_count'])
          print('D912 tables',d['unique_d912_count'])
          print('spawn records',d['scripted_spawn_record_count'])
          print('spawned entities',d['unique_spawned_entity_count'])
          print('classifications',d['spawned_entity_classification_counts'])
          print('bone counts',d['spawned_entity_bone_count_frequency'])
          print('articulated',d['spawned_articulated_entities'])
          print('spawned WorldIDs absent from direct placement census',d['spawned_world_ids_absent_from_direct_placement_census_count'])
          if d['violations']:
              print('VIOLATIONS',d['violations'][:30])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-ai-spawner-census
          path: reports/
          retention-days: 14
          compression-level: 6
