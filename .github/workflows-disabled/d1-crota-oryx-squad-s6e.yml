name: D1 Crota oryx_squad S6E stage owner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-oryx-squad-s6e.yml'
      - 'tools/d1_world_activity_entity_table_census.py'
      - 'tools/d1_remote_activity_placements.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Decode exact 8108EE4A S6E stages
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY' | tee out/stdout.txt
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_playable_guardian_entity_resource_resolve import load_catalogs
          from d1_split_tar_extract import SplitHttpTar
          from d1_remote_activity_placements import RemoteCorpus
          from d1_world_activity_entity_table_census import parse_s6e
          catalogs=load_catalogs([Path('input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json')])
          arc=SplitHttpTar([f'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=90)
          c=RemoteCorpus(arc,catalogs,Path('runtime'))
          violations=[]
          r=parse_s6e(c,'8108EE4A',violations)
          assert r['target']['class_matches'],r
          f603=[]; maps=[]
          for st in r.get('stages',[]):
              mh=st['map_data_table']['hash']
              if mh not in ('00000000','FFFFFFFF'): maps.append(mh)
              f603.extend(x['hash'] for x in st['entity_resource_tables'] if x['hash'] not in ('00000000','FFFFFFFF'))
          out={'schema':'d1_crota_oryx_squad_s6e/v1','s6e':'8108EE4A','class':'8080076E','stage_count':len(r.get('stages',[])),
               'map_tables':maps,'f603_tables':f603,'contains_8108EE97':'8108EE97' in f603,'violations':violations,'parsed':r}
          Path('out/CROTA_ORYX_SQUAD_S6E.json').write_text(json.dumps(out,indent=2)+'\n')
          print('STAGES',len(r.get('stages',[])))
          print('F603_COUNT',len(f603),'UNIQUE',len(set(f603)))
          print('CONTAINS_8108EE97',out['contains_8108EE97'])
          print('MAP_TABLES',maps)
          print('F603_TABLES',f603)
          print('VIOLATIONS',violations)
          assert not violations,violations
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-ORYX-SQUAD-S6E
          path: out/
          retention-days: 30
          if-no-files-found: error
