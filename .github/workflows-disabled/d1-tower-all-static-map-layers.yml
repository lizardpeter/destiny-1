name: D1 Tower all static-map layers

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-all-static-map-layers.yml'
      - 'tools/d1_world_static_map_layer_census.py'

permissions:
  contents: read
  actions: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover map census, current corpus and runtime
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p runtime recovered prior reports
          gh run download 33989166179 -n d1-tower-map-data-layer-census -D prior
          test -f prior/tower_map_data_layer_census.json
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py --package-list reports/packages.txt --out-dir recovered --report reports/current_corpus.json
      - name: Follow all 337 serialized static-map parent chains and embedded model arrays
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          set +e
          python tools/d1_world_static_map_layer_census.py "${args[@]}" --runtime runtime \
            --map-layer-census prior/tower_map_data_layer_census.json \
            --out reports/tower_all_static_map_layers.json | tee reports/tower_all_static_map_layers_stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_all_static_map_layers.json'))
          s={k:d.get(k) for k in ('status','source_map_entry_count','unique_static_map_parents','unique_static_maps','direct_d1_static_child_rows','embedded_record_static_map_rows','embedded_record_count','singleton_transform_model_records','embedded_model_reference_occurrences','unique_embedded_entity_models')}
          open('reports/tower_all_static_map_layers_summary.json','w').write(json.dumps(s,indent=2)+'\n')
          print(json.dumps(s,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-all-static-map-layers
          path: reports/
          retention-days: 14
          compression-level: 6
