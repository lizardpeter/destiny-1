name: Temporary scan 0137 parents for 80A39E0E

on:
  push:
    paths:
      - '.github/workflows/tmp-investment-0137-target.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover runtime and 0137
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x5996C3000 \
            --target ps4_investment_assets_0137_0.pkg --target ps4_investment_assets_0137_1.pkg --target ps4_investment_assets_0137_2.pkg --target ps4_investment_assets_0137_3.pkg --target ps4_investment_assets_0137_5.pkg \
            --out recovered --manifest reports/0137_extract.json
      - name: Find exact EntityParent carrying 80A39E0E
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import json,struct,sys,re
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader
          target=int('80A39E0E',16)
          # highest physical snapshot as logical view
          ps=sorted(Path('recovered').glob('ps4_investment_assets_0137_*.pkg'), key=lambda p:int(re.search(r'_(\d+)\.pkg$',p.name).group(1)))
          p=ps[-1]; r=EntryReader(p,Path('runtime'))
          hits=[]
          for e in r.entries:
              if not r.available(e['index']): continue
              try:b=r.entry(e['index'])
              except Exception: continue
              if len(b)>=0x14 and struct.unpack_from('<I',b,0x10)[0]==target:
                  hits.append({'parent':e['tag_hash'].upper(),'index':e['index'],'reference':e['reference'].upper(),'size':e['file_size'],'entity_data':f'{target:08X}'})
          print('TARGET PARENTS',hits)
          Path('reports/target_0137.json').write_text(json.dumps({'logical_view':p.name,'hits':hits},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: investment-0137-target-80A39E0E
          path: reports/
          retention-days: 2
