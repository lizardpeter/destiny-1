name: D1 Tower Family A child animation target

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-family-a-child-target.yml'
      - 'tools/d1_tower_family_a_child_target_probe.py'
      - 'tools/d1_tower_family_f_animation_ownership.py'
      - 'tools/d1_animation_retarget_probe.py'
      - 'tools/d1_entity_resource_probe.py'
      - 'tools/d1_recover_member_catalog.py'
      - 'evidence/d1_tower_family_e_animation_source_member_catalog.json'
      - 'evidence/d1_tower_family_a_01e3_member_catalog.json'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Python dependencies
        run: python -m pip install -q numpy scipy pygltflib pyglm
      - name: Install verified Oodle runtime and package index
        run: |
          set -euo pipefail
          mkdir -p runtime source reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
      - name: Recover exact 023D and 01E3 families
        run: |
          set -euo pipefail
          python tools/d1_recover_member_catalog.py \
            --catalog evidence/d1_tower_family_e_animation_source_member_catalog.json \
            --package-list reports/packages.txt --family 023d --out-dir source --report reports/recover_023d.json
          python tools/d1_recover_member_catalog.py \
            --catalog evidence/d1_tower_family_a_01e3_member_catalog.json \
            --package-list reports/packages.txt --family 01e3 --out-dir source --report reports/recover_01e3.json
          echo 'de0a2e4052602d26184d9f739678a0805b8cb8272f3758204700e1687cb55695  source/ps4_city_tower_activities_act_023d_5.pkg' | sha256sum --check --strict
          echo '1aa58455b8c5bbcf0ff893d87f07affaba5a9dd0586a51d81be212565627cfba  source/ps4_globals_cinematic_01e3_2.pkg' | sha256sum --check --strict
      - name: Pin animation parser
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
          test "$(git -C parser rev-parse HEAD)" = b9fdc3a43dd28118113275624fcc9054b75855f4
      - name: Trace exact Family A child target candidates
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python tools/d1_tower_family_a_child_target_probe.py \
            --activity-pkg source/ps4_city_tower_activities_act_023d_5.pkg \
            --cinematic-pkg source/ps4_globals_cinematic_01e3_2.pkg \
            --runtime runtime --parser-root parser \
            -o reports/TOWER_FAMILY_A_CHILD_TARGET.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-family-a-child-target
          path: reports/
          retention-days: 14
          compression-level: 6
