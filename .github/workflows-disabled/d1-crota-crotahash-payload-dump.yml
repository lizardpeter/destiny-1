name: D1 Crota exact crota-hash payload dump

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-crotahash-payload-dump.yml'

permissions:
  contents: read
  actions: read

env:
  CATALOG_ARTIFACT_ID: '9994811238'
  CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover catalog and runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Extract exact payload bytes
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import hashlib,json,struct,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entity_resource_probe import parse_resource
          from d1_playable_guardian_entity_resource_resolve import load_catalogs
          from d1_remote_investment_parent_probe import RemoteLogicalPackage
          from d1_split_tar_extract import SplitHttpTar
          catalogs=load_catalogs([Path('input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json')])
          arc=SplitHttpTar([f'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=90)
          specs=[(0x0156,7486,'80AADD3E',0x1B04,'80AA83E6'),(0x0158,622,'80AB026E',0x1B04,'80AA9B44'),(0x0735,1000,'8166A3E8',0x0E24,'8166A3EC')]
          rows=[]
          for pkg,index,tag,crooff,model in specs:
              view=RemoteLogicalPackage(arc,catalogs[pkg],Path('runtime'))
              e=view.entries[index]
              assert e['tag_hash'].upper()==tag and e['reference'].upper()=='80800861',e
              b=view.entry(index)
              er=parse_resource(b,'PS4')
              assert er['semantic_role']=='entity_model' and er['embedded_model_tag_hash'].upper()==model,er
              assert struct.unpack_from('<I',b,crooff)[0]==0xACC65F88
              Path(f'out/{tag}.bin').write_bytes(b)
              rows.append({'package_id':f'{pkg:04X}','entry_index':index,'tag_hash':tag,'size':len(b),'sha256':hashlib.sha256(b).hexdigest(),'crota_offset':crooff,'crota_offset_hex':f'0x{crooff:X}','model':model,'entity_resource':er})
          Path('out/METADATA.json').write_text(json.dumps({'schema':'d1_crota_crotahash_payload_dump/v1','rows':rows},indent=2)+'\n')
          PY
          sha256sum out/*.bin out/METADATA.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: D1-CROTA-CROTAHASH-EXACT-PAYLOADS
          path: out/
          retention-days: 30
          if-no-files-found: error
