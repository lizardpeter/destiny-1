name: D1 Xur model parent permutation layout

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-model-parent-permutation-layout.yml'
      - 'tools/d1_remote_model_parent_permutation_layout_probe.py'
      - 'notes/D1_XUR_WAVE8_AND_PERMUTATION_LAYOUT_FRONTIER_2026-09-07.md'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact universal catalog and D1 Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime reports
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Probe exact Xur model-parent permutation layout
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_model_parent_permutation_layout_probe.py
          set +e
          python tools/d1_remote_model_parent_permutation_layout_probe.py \
            --entity 80C7ACC8 --entity 80C885AA --model-tag 80C88CEF \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime \
            -o reports/D1_XUR_MODEL_PARENT_PERMUTATION_LAYOUT.json | tee reports/stdout.txt
          rc=${PIPESTATUS[0]}; set -e
          test "$rc" -eq 0 -o "$rc" -eq 2

          python - <<'PY'
          import json
          d=json.load(open('reports/D1_XUR_MODEL_PARENT_PERMUTATION_LAYOUT.json'))
          assert d['status'] in {'D1_XUR_MODEL_PARENT_PERMUTATION_LAYOUT_EXACT','D1_XUR_MODEL_PARENT_PERMUTATION_LAYOUT_FRONTIER'},d
          assert d['target_model']=='80C88CEF',d
          assert d['entities']==['80C7ACC8','80C885AA'],d
          assert not d['violations'],d['violations']
          assert len(d['rows'])==2,d
          for r in d['rows']:
              assert r['parent_class_hash']=='80801A9C',r
              assert r['parsed_model_tag']=='80C88CEF',r
              f=r['parent_fields']
              assert f['external_materials_map']['bounds_valid'],r
              assert f['descriptor_0x260_FE1A8080']['bounds_valid'],r
              assert f['external_materials']['bounds_valid'],r
          print('XUR_MODEL_PARENT_LAYOUT_PROBE_ACCEPTED',d['status'])
          PY

      - name: Persist provenance and hashes
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.load(open('reports/D1_XUR_MODEL_PARENT_PERMUTATION_LAYOUT.json'))
          p={
            'status':d['status'],
            'workflow_commit':os.environ['GITHUB_SHA'],
            'universal_catalog':{
              'artifact_id':int(os.environ['UNIVERSAL_CATALOG_ARTIFACT_ID']),
              'zip_sha256':os.environ['UNIVERSAL_CATALOG_ZIP_SHA256'],
              'json_sha256':os.environ['UNIVERSAL_CATALOG_JSON_SHA256'],
            },
            'source_package_base':'https://crypt.cohae.dev/destiny/ps4/packages/latest',
            'target_model':'80C88CEF',
            'entities':['80C7ACC8','80C885AA'],
            'live_configuration_state_complete':False,
            'retail_material_member_selection_complete':False,
          }
          Path('reports/CHECKPOINT.json').write_text(json.dumps(p,indent=2)+'\n')
          PY
          find reports -type f -print0 | sort -z | xargs -0 sha256sum > reports/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-XUR-MODEL-PARENT-PERMUTATION-LAYOUT
          path: reports/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
