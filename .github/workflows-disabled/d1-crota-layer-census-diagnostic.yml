name: D1 Crota whole-Activity layer census diagnostic

on:
  push:
    paths:
      - '.github/workflows/d1-crota-layer-census-diagnostic.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN: '34175421771'
    steps:
      - name: Extract map-data resource-class census from successful Crota export
        run: |
          set -euo pipefail
          gh run view "$TARGET_RUN" --repo "$GITHUB_REPOSITORY" --log > run.log
          echo '=== EXACT ACTIVITY RESOURCE CLASS COUNT BLOCK ==='
          sed -n '1118,1162p' run.log
          echo '=== STATIC SUBSET COUNT BLOCK ==='
          sed -n '1338,1358p' run.log
