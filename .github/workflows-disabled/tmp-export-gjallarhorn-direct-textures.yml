name: Temporary export Gjallarhorn direct shader textures

on:
  push:
    paths:
      - '.github/workflows/tmp-export-gjallarhorn-direct-textures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install texture dependencies and runtime
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow numpy texture2ddecoder
          mkdir -p runtime recovered out reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover exact 011e and 013a package families
        run: |
          set -euo pipefail
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x439A04A00 \
            --target ps4_gear_weapons_011e_0.pkg --target ps4_gear_weapons_011e_1.pkg --target ps4_gear_weapons_011e_2.pkg --target ps4_gear_weapons_011e_3.pkg --target ps4_gear_weapons_011e_5.pkg \
            --out recovered --manifest reports/011e_extract.json --retries 6 --timeout 90
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x59C453800 \
            --target ps4_investment_assets_013a_0.pkg --target ps4_investment_assets_013a_1.pkg --target ps4_investment_assets_013a_2.pkg --target ps4_investment_assets_013a_3.pkg --target ps4_investment_assets_013a_4.pkg --target ps4_investment_assets_013a_5.pkg \
            --out recovered --manifest reports/013a_extract.json --retries 6 --timeout 90
      - name: Export direct textures proven by material records
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_texture_export.py recovered/ps4_gear_weapons_011e_5.pkg --runtime runtime --tag-hash 80A3D241 --out out/011e
          python tools/d1_texture_export.py recovered/ps4_investment_assets_013a_5.pkg --runtime runtime --tag-hash 80A7441A --tag-hash 80A743B4 --tag-hash 80A7451D --out out/013a
          python - <<'PY'
          import json,glob,os
          from PIL import Image
          rows=[]
          for p in glob.glob('out/**/*.png',recursive=True):
            im=Image.open(p)
            rows.append({'path':p,'size':list(im.size),'mode':im.mode})
            print('GJ_DIRECT_TEXTURE',p,im.size,im.mode)
          json.dump({'images':rows},open('reports/direct_texture_images.json','w'),indent=2)
          if not rows: raise SystemExit('no direct shader textures exported')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-gjallarhorn-direct-shader-textures
          path: |
            out/
            reports/direct_texture_images.json
          retention-days: 7
          if-no-files-found: error
