name: D1 full-character skeleton bone-name resolution

on:
  push:
    paths:
      - '.github/workflows/d1-humanoid-bone-name-resolution.yml'
      - 'tools/d1_stringhash_wordlist_resolve.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover QuickTag extracted Destiny wordlist
        run: |
          set -euo pipefail
          git clone --depth 1 --quiet https://github.com/v4nguard/quicktag.git quicktag
          python -m pip install -q zstandard
          python - <<'PY'
          import zstandard as zstd
          src='quicktag/wordlist.txt.zst'; dst='wordlist.txt'
          with open(src,'rb') as i, open(dst,'wb') as o:
              zstd.ZstdDecompressor().copy_stream(i,o)
          print('wordlist bytes',__import__('os').path.getsize(dst))
          PY
      - name: Resolve large 00EC/00EE/00EF skeleton hashes with FNV1
        run: |
          set -euo pipefail
          mkdir -p reports
          targets=(
            E5685C1A 6EBAC0C7 9EF0E980 09AF5D69 8CD20F9F A2A652A1 1B4DB135 3F4AD48B A2A652A2 5D508B0F 5DE0B9B9 A2A652A3 3A2D8E03 C6359025 10BB4E0D 1664D7A9 98412EC3 A22B23D1 AFFB585B 10BB4E0E 505F0217 036B0EC1 40D6927E 04157A89 4FF150E3 CD1D78A3 112FF885 67CB838C 9C592B2A EA6B9DDE E5EFCD7C CAA7BCC3 40BC82E5 EF4BAB19 C8472F93 0E355AA8 A91E97AF 3AE77E9D 3284136B 0FAB2B51 363F23DB 7B86173C 9CE6197A FDB26189 2F6EFFE3 F1C7B263 AD943545 1F2F2FC2 F0FE5C68 92403903 3A5AE325 0FAB2B52 960FEAD8 7B86173F 5882DB59 FDB2618A 714E6040 F1C7B260 A1644966 1F2F2FC1 6CE0D0AB 92403900 DA88A8C6 0FAB2B53 212748D5 7B86173E 39A95F9C FDB2618B AD186F5D F1C7B261 42E79A8B 1F2F2FC0 10E94486 92403901 5245BFEB
            B2977AD2 7F62FCC1 4CBE4D22 3206EFEE 41ADC6A1 F4D37063 205915D4 D66CBF0C BDC92507 8E1AA114 9B74FBB0 9A853AD1 5726EF22 96A11D62 0E34902F 9B74FBB3 9A853AD2 96A11D61 0E34902C 9B74FBB2 9A853AD3 96A11D60 0E34902D
          )
          args=()
          for t in "${targets[@]}"; do args+=(--target "$t"); done
          python tools/d1_stringhash_wordlist_resolve.py wordlist.txt "${args[@]}" -o reports/full_character_bone_names.json
      - uses: actions/upload-artifact@v4
        with:
          name: d1-full-character-bone-name-resolution
          path: reports/
          retention-days: 14
