name: D1 investment 013F Oodle call matrix

on:
  push:
    paths:
      - '.github/workflows/d1-investment-013f-oodle-call-matrix.yml'
      - 'tools/d1_remote_oodle_call_matrix_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover verified Oodle 3 runtime
        run: |
          set -euo pipefail
          mkdir -p runtime out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Cross exact D1 call flags with 0x4000 raw-size rule
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_oodle_call_matrix_probe.py \
            --tag-hash 80A7FA34 --tag-hash 80A7FB3B \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/013f_oodle_call_matrix.json
      - name: Validate control and report recovery
        run: |
          python - <<'PY'
          import json
          d=json.load(open('out/013f_oodle_call_matrix.json'));by={x['tag_hash']:x for x in d['entries']}
          good=by['80A7FA34'];bad=by['80A7FB3B']
          gh=[x for x in good['attempts'] if x['mode']=='project_historical' and x['requested_raw_length']==0x40000 and x['success']]
          gc=[x for x in good['attempts'] if x['mode']=='charm_d1_roi' and x['requested_raw_length']==0x40000 and x['success']]
          assert gh and gc,'known-good control must decode in both historical and Charm D1 modes'
          assert gh[0]['sha256']==gc[0]['sha256'],(gh,gc)
          print('GOOD_BYTE_IDENTICAL_SHA256',gh[0]['sha256'])
          ok=[x for x in bad['attempts'] if x['success']]
          print('BAD_SUCCESS_COUNT',len(ok))
          for x in ok: print('BAD_RECOVERY',x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-investment-013f-oodle-call-matrix
          path: out/
          retention-days: 14
