name: D1 Crota squad neighborhood closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-squad-neighborhood-closure.yml'
      - 'tools/d1_remote_filehash_probe.py'
      - 'tools/d1_remote_exact_tag_probe.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          python - <<'PY'
          import json
          d=json.load(open('input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json'))
          names=[]
          for members in d['families'].values():
              names.extend(m['name'] for m in members)
          open('input/packages.txt','w').write('\n'.join(sorted(set(names)))+'\n')
          PY

      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Recover exact entry-table neighborhoods
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_filehash_probe.py \
            --tag-hash 0x8108E295 --tag-hash 0x8108E2E7 \
            --package-list input/packages.txt --runtime runtime \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --out out/CROTA_SQUAD_NEIGHBORHOODS.json | tee out/neighborhood_stdout.txt

      - name: Probe every exact neighbor payload
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          ARGS=$(python - <<'PY'
          import json
          d=json.load(open('out/CROTA_SQUAD_NEIGHBORHOODS.json'))
          tags=[]
          for e in d['entries']:
              for n in e['neighborhood']:
                  if n['tag_hash'] not in tags: tags.append(n['tag_hash'])
          print(' '.join('--tag-hash 0x'+h for h in tags))
          open('out/neighbor_tags.txt','w').write('\n'.join(tags)+'\n')
          PY
          )
          echo "$ARGS" > out/exact_probe_args.txt
          python tools/d1_remote_exact_tag_probe.py $ARGS \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --min-string 4 -o out/CROTA_SQUAD_NEIGHBOR_PAYLOADS.json \
            | tee out/exact_probe_stdout.txt

      - name: Build structural comparison
        run: |
          set -euo pipefail
          python - <<'PY' | tee out/summary.txt
          import json,collections
          nb=json.load(open('out/CROTA_SQUAD_NEIGHBORHOODS.json'))
          ex=json.load(open('out/CROTA_SQUAD_NEIGHBOR_PAYLOADS.json'))
          assert not nb['violations'],nb['violations']
          assert ex['violation_count']==0,ex['violations']
          em={e['tag_hash']:e for e in ex['entries']}
          for target in nb['entries']:
              print('\nTARGET',target['tag_hash'],'INDEX',target['entry']['index'])
              for n in target['neighborhood']:
                  e=em[n['tag_hash']]
                  er=e.get('entity_resource') or {}
                  strings=[s['string'] for s in e.get('printable_strings',[]) if len(s['string'])>=4]
                  refs=[]
                  for m in e.get('aligned_resolved_tags',[]):
                      if m['tag_hash']==e['tag_hash']: continue
                      refs.append((hex(m['offset']),m['tag_hash'],m['entry']['reference']))
                  print(' N',n['relative_index'],n['tag_hash'],'REF',n['reference'],'SIZE',n['size'],
                        'ER',er.get('semantic_role'),er.get('unk10_class'),er.get('unk18_class'),
                        'STRINGS',strings[:12],'REFS',refs[:30])
          # Find class/size patterns at equal relative offsets around both targets.
          a,b=nb['entries']
          aa={n['relative_index']:n for n in a['neighborhood']};bb={n['relative_index']:n for n in b['neighborhood']}
          print('\nRELATIVE_COMPARISON')
          for r in sorted(set(aa)&set(bb)):
              x,y=aa[r],bb[r]
              print(r,x['tag_hash'],x['reference'],x['size'],'|',y['tag_hash'],y['reference'],y['size'],
                    'SAME_CLASS',x['reference']==y['reference'])
          PY
          find out -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-SQUAD-NEIGHBORHOOD-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
