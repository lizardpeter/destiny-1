            -o reports/sparse_parent_resolution.json
      - name: Summarize exact target arrangement
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('reports/sparse_parent_resolution.json'))
          print('parents',d['resolved_count'],'/',d['parent_count'],'errors',d['error_count'])
          print('target matches',len(d['matches']))
          for m in d['matches']:
              print(json.dumps(m,indent=2))
          if not d['matches']:
              raise SystemExit('80A39E0E was not reverse-resolved; inspect sparse resolver errors')
          PY
      - uses: actions/upload-artifact@v4
