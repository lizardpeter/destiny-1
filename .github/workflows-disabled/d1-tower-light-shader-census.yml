name: D1 Tower light shader census

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['D1 Tower light material census']
    types: [completed]
  push:
    paths:
      - '.github/workflows/d1-tower-light-shader-census.yml'
      - 'tools/d1_close_world_shader_dependencies.py'
      - 'tools/d1_world_shader_extract.py'

permissions:
  contents: read
  actions: read

jobs:
  shaders:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover authoritative light-material manifest
        run: |
          set -euo pipefail
          mkdir -p upstream index packages runtime reports work shader_out
          if [ "${{ github.event_name }}" = workflow_run ]; then
            run_id='${{ github.event.workflow_run.id }}'
          else
            run_id="$(gh run list --workflow d1-tower-light-material-census.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id"
          gh run download "$run_id" -n d1-tower-light-material-census -D upstream
          cp upstream/tower_light_material_manifest.json reports/tower_light_material_manifest.json
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_light_material_manifest.json'))
          assert d['status']=='D1_WORLD_LIGHT_MATERIAL_MANIFEST_COMPLETE',d.get('error_materials')
          assert (d['light_instance_count'],d['unique_light_material_count'],d['pixel_shader_count'])==(737,497,32),d
          print('LIGHT_SHADER_SOURCE',d['pixel_shader_count'],'pixel shaders for',d['light_instance_count'],'light instances')
          PY

      - name: Recover current global package index and exact Oodle runtime
        run: |
          set -euo pipefail
          idx_run="$(gh run list --workflow d1-global-activity-index.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$idx_run"
          gh run download "$idx_run" -n d1-global-activity-index -D index
          cp "$(find index -name D1_CURRENT_ACTIVITY_INDEX.json -print -quit)" reports/D1_CURRENT_ACTIVITY_INDEX.json
          cp "$(find index -name packages.txt -print -quit)" reports/packages.txt
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Close every native light pixel shader through indexed FileHash dependencies
        run: |
          set -euo pipefail
          python tools/d1_close_world_shader_dependencies.py \
            --index reports/D1_CURRENT_ACTIVITY_INDEX.json \
            --package-list reports/packages.txt \
            --manifest reports/tower_light_material_manifest.json \
            --runtime runtime \
            --package-dir packages \
            --work-dir work \
            --out-dir shader_out \
            --report reports/tower_light_shader_dependency_closure.json
          cp shader_out/shader_report.json reports/tower_light_shader_report.json
          mkdir -p reports/light_gcn
          cp shader_out/PS_*_gcn.bin reports/light_gcn/
          python - <<'PY'
          import json,glob,os
          c=json.load(open('reports/tower_light_shader_dependency_closure.json'))
          s=json.load(open('reports/tower_light_shader_report.json'))
          assert c['status']=='D1_WORLD_PIXEL_SHADER_DEPENDENCY_CLOSURE_COMPLETE',c
          assert c['source_pixel_shader_count']==32,c
          assert s['status']=='D1_WORLD_PIXEL_SHADER_GCN_EXACT',s
          assert s['selected_count']==32 and s['error_count']==0,s
          files=glob.glob('reports/light_gcn/PS_*_gcn.bin')
          assert len(files)==32,len(files)
          print('LIGHT_SHADER_CLOSURE',json.dumps({
            'pixel_shaders':32,
            'gcn_files':len(files),
            'total_gcn_bytes':sum(os.path.getsize(x) for x in files),
            'recovered_package_ids':c['recovered_package_ids'],
          },indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-light-shader-census
          path: reports/
          retention-days: 14
          compression-level: 6
