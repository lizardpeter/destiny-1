name: D1 investment 013F Oodle raw-length probe

on:
  push:
    paths:
      - '.github/workflows/d1-investment-013f-rawlen-probe.yml'
      - 'tools/d1_remote_block_rawlen_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Probe block 99 from exact serialized coverage
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python tools/d1_remote_block_rawlen_probe.py \
            --package-id 0x013F --block 99 \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/013f_block99_rawlen.json
          python - <<'PY'
          import json
          d=json.load(open('out/013f_block99_rawlen.json'))['blocks'][0]
          print('successful raw lengths',[hex(x['raw_len']) for x in d['successful_attempts']])
          assert d['stored_sha1']
          assert d['usage_count']>0
          assert d['successful_attempts'],d
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-investment-013f-rawlen-probe
          path: out/
          retention-days: 14
