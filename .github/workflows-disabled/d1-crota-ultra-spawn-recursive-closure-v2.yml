name: D1 Crota ultra-spawn recursive closure v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-ultra-spawn-recursive-closure-v2.yml'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact universal catalog and runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Compile current dependency walkers
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_entity_dependency_closure.py tools/d1_remote_entity_dependency_closure_universal.py

      - name: Typed-only Crota ultra-spawn closure
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_entity_dependency_closure_universal.py \
            --seed 0x8108E5C3 --seed 0x8108E671 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --max-depth 10 --max-nodes 500 \
            -o out/CROTA_ULTRA_SPAWN_TYPED_V2.json | tee out/typed_stdout.txt

      - name: Isolated discovery closure
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_entity_dependency_closure_universal.py \
            --seed 0x8108E5C3 --seed 0x8108E671 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --max-depth 7 --max-nodes 600 --recurse-untyped \
            -o out/CROTA_ULTRA_SPAWN_DISCOVERY_V2.json | tee out/discovery_stdout.txt

      - name: Summarize Crota physical actor frontier
        run: |
          set -euo pipefail
          python - <<'PY' | tee out/summary.txt
          import json
          for label,path in [('TYPED','out/CROTA_ULTRA_SPAWN_TYPED_V2.json'),('DISCOVERY','out/CROTA_ULTRA_SPAWN_DISCOVERY_V2.json')]:
              d=json.load(open(path))
              print(label,'STATUS',d.get('status'),'NODES',d.get('node_count'),'EDGES',d.get('edge_count'),'TYPED_EDGES',d.get('typed_edge_count'),'UNTYPED_EDGES',d.get('untyped_literal_edge_count'),'TRUNCATED',d.get('truncated'),'VIOLATIONS',len(d.get('violations',[])))
              print(label,'ARTICULATED_COUNT',len(d.get('articulated_entities',[])))
              for a in d.get('articulated_entities',[]):
                  print(label,'ARTICULATED',a.get('tag_hash'),'DEPTH',a.get('depth'),'PATH',a.get('path_class'),'MODELS',a.get('embedded_models'),'SKELETONS',a.get('skeletons'))
              for h in ('8108E5C3','8108E671','8108E679','8108E67A','8108E740'):
                  n=d.get('nodes',{}).get(h)
                  if n:
                      print(label,'NODE',h,'KIND',n.get('kind'),'ROLE',n.get('semantic_role'),'U10',n.get('unk10_class'),'U18',n.get('unk18_class'),'STRINGS',n.get('printable_strings',[])[:8])
                      for e in d.get('edges',[]):
                          if e.get('subject')==h:
                              print(' EDGE',e.get('predicate'),e.get('object'),e.get('evidence_class'),e.get('offset_hex'))
              if d.get('violations'):
                  print(label,'VIOLATIONS_DETAIL',d['violations'][:20])
          PY
          find out -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-ULTRA-SPAWN-RECURSIVE-CLOSURE-V2
          path: out/
          retention-days: 30
          if-no-files-found: error
