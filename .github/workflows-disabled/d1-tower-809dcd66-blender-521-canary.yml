name: D1 Tower 809DCD66 Blender 5.2.1 LTS canary

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-809dcd66-blender-521-canary.yml'
      - 'tools/install_blender_lts.sh'
      - 'tools/d1_blender_apply_809dcd66.py'
      - 'tools/d1_gltf_split_d1_basis_attributes.py'
      - 'tools/d1_gltf_layer_merge.py'

permissions:
  contents: read
  actions: read

jobs:
  blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Build one-material structural GLB fixture and recover exact adapter manifest
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy trimesh pillow
          mkdir -p fixture fixture_textures reports manifest
          gh run download 34049203609 -n d1-tower-809dcd66-adapter-manifest -D manifest
          test -f manifest/809DCD66_blender_adapter_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import trimesh
          from PIL import Image

          d=json.load(open('manifest/809DCD66_blender_adapter_manifest.json'))
          h='80CA0D9F'
          assert h in d['materials']
          r=d['materials'][h]

          verts=np.array([[-1,0,-1],[1,0,-1],[1,0,1],[-1,0,1]],dtype=np.float32)
          faces=np.array([[0,1,2],[0,2,3]],dtype=np.int64)
          uv=np.array([[0,0],[1,0],[1,1],[0,1]],dtype=np.float32)
          v2=np.vstack([verts,verts+np.array([3,0,0],dtype=np.float32)])
          f2=np.vstack([faces,faces+4])
          uv2=np.vstack([uv,uv])
          visual=trimesh.visual.TextureVisuals(uv=uv2,material=trimesh.visual.material.PBRMaterial(name='TigerMaterial_'+h))
          tm=trimesh.Trimesh(vertices=v2,faces=f2,visual=visual,process=False,validate=False)
          tm.vertex_normals=np.tile(np.array([[0,1,0]],dtype=np.float32),(8,1))
          tang=np.zeros((8,4),dtype=np.float32); tang[:,0]=1; tang[:4,3]=-1; tang[4:,3]=1
          tm.vertex_attributes['D1_TANGENT']=tang
          trimesh.Scene(tm).export('fixture/fixture_source.glb',file_type='glb')

          for key,size in [('t0',(256,64)),('t1',(1024,256))]:
              tr=r['texture_bindings'][key]
              rel=Path(tr['portable_png'] or f"{tr['taghash']}.png")
              p=Path('fixture_textures')/rel.name
              arr=np.zeros((size[1],size[0],4),dtype=np.uint8)
              xx=np.arange(size[0],dtype=np.uint16)[None,:]
              arr[...,0]=(xx%256).astype(np.uint8)
              arr[...,1]=64 if key=='t0' else 128
              arr[...,2]=32
              arr[...,3]=255
              Image.fromarray(arr,'RGBA').save(p)
              print(key,tr['taghash'],p)
          PY

          python tools/d1_gltf_split_d1_basis_attributes.py \
            --input-glb fixture/fixture_source.glb \
            --out fixture/fixture_d1_basis.glb \
            --report reports/fixture_basis_split.json
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from d1_gltf_layer_merge import read_glb
          d,b=read_glb(__import__('pathlib').Path('fixture/fixture_d1_basis.glb'))
          attrs=d['meshes'][0]['primitives'][0]['attributes']
          required={'NORMAL','_D1_TANGENT','_D1_NORMAL','_D1_TANGENT_XYZ','_D1_TANGENT_W'}
          assert required<=set(attrs),attrs
          print('FIXTURE_GLTF_APPLICATION_ATTRIBUTES_READY',attrs)
          PY

      - name: Install project Blender 5.2.1 LTS baseline
        run: |
          set -euo pipefail
          BLENDER="$(bash tools/install_blender_lts.sh .blender)"
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"
          "$BLENDER" --version | tee reports/blender_version.txt
          grep -q 'Blender 5.2.1' reports/blender_version.txt

      - name: Import custom attributes and build native-equation node graph
        run: |
          set -euo pipefail
          "$BLENDER" --background --factory-startup \
            --python tools/d1_blender_apply_809dcd66.py -- \
            --input-glb fixture/fixture_d1_basis.glb \
            --manifest manifest/809DCD66_blender_adapter_manifest.json \
            --texture-root fixture_textures \
            --out-blend fixture/809DCD66_BLENDER_521_CANARY.blend \
            --report reports/809DCD66_blender_521_canary.json \
            | tee reports/809DCD66_blender_521_stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('reports/809DCD66_blender_521_canary.json'))
          assert d['status']=='D1_TOWER_809DCD66_BLENDER_NATIVE_EQUATION_PREVIEW_BUILT',d
          assert d['blender_version_string'].startswith('5.2.1'),d['blender_version_string']
          assert d['target_materials_in_input']==1,d
          assert d['verified_saved_material_count']==1,d
          assert d['api13_runtime_source_resolved'] is False
          assert d['native_blend_state_resolved'] is False
          assert d['frame0_time_unit_phase_resolved'] is False
          print('BLENDER_521_809DCD66_NATIVE_EQUATION_CANARY_GREEN')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-809dcd66-blender-521-canary
          path: |
            reports/
            fixture/fixture_d1_basis.glb
            fixture/809DCD66_BLENDER_521_CANARY.blend
          retention-days: 14
          compression-level: 6
