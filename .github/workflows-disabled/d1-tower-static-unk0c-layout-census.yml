name: D1 Tower static unk0C layout census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-static-unk0c-layout-census.yml'
      - 'tools/d1_tower_map_schema_validate.py'
      - 'tools/d1_material_decode.py'

permissions:
  contents: read
  actions: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover exact 024c/0250 families and runtime
        run: |
          set -euo pipefail
          mkdir -p index runtime packages reports
          idx_run="$(gh run list --workflow d1-global-activity-index.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$idx_run"
          gh run download "$idx_run" -n d1-global-activity-index -D index
          cp "$(find index -name D1_CURRENT_ACTIVITY_INDEX.json -print -quit)" reports/D1_CURRENT_ACTIVITY_INDEX.json
          cp "$(find index -name packages.txt -print -quit)" reports/packages.txt
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_recover_indexed_package_families.py \
            --index reports/D1_CURRENT_ACTIVITY_INDEX.json --package-list reports/packages.txt \
            --package-id 024c --package-id 0250 --out-dir packages --report reports/recovery.json

      - name: Correlate unk0C with retail buffer strides and material VS
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,struct,sys
          from collections import Counter,defaultdict
          from pathlib import Path
          sys.path.insert(0,'tools')
          import d1_tower_map_schema_validate as schema
          from d1_material_decode import parse_material

          c=schema.Corpus([p.resolve() for p in sorted(Path('packages').glob('*.pkg'))],Path('runtime').resolve())
          t=schema.parse_static_table(c,'80C99827')
          assert t.get('mesh_entries') and t.get('info_entries') and t.get('material_hashes')

          def stride_type(h):
              h=str(h).upper()
              if h=='FFFFFFFF': return {'hash':h,'stride':None,'type':None,'header_bytes':None}
              b,src=c.payload(h); meta=c.entry_meta(h)
              if b is None or len(b)<8: return {'hash':h,'stride':None,'type':None,'header_bytes':None,'source':src,'meta':meta}
              return {'hash':h,'stride':struct.unpack_from('<h',b,4)[0],'type':struct.unpack_from('<h',b,6)[0],
                      'header_bytes':len(b),'source':src,'meta':meta}

          mat_cache={}
          def mat_vs(h):
              h=str(h).upper()
              if h in mat_cache:return mat_cache[h]
              b,src=c.payload(h)
              r={'material':h,'source':src,'vertex_shader':None,'pixel_shader':None,'decode_ok':False}
              if b is not None:
                  try:
                      p=parse_material(b,'PS4')
                      r.update({'vertex_shader':str(p['vertex_shader']).upper(),'pixel_shader':str(p['pixel_shader']).upper(),
                                'decode_ok':True,'material_bytes':len(b)})
                  except Exception as e:r['error']=repr(e)
              mat_cache[h]=r;return r

          mesh_rows=[]
          for m in t['mesh_entries']:
              v0=stride_type(m['vertices0']);v1=stride_type(m['vertices1'])
              mesh_rows.append({'static_index':m['index'],'unk0C':m['unk0C'],'unk0C_hex':f"{m['unk0C']:04X}",
                                'detail_level':m['detail_level'],'primitive_type':m['primitive_type'],
                                'vertices0':v0,'vertices1':v1,'indices':m['indices'],
                                'index_offset':m['index_offset'],'index_count':m['index_count']})

          draws=[]
          for info in t['info_entries']:
              if not (0<=info['static_index']<len(mesh_rows) and 0<=info['material_index']<len(t['material_hashes'])):continue
              m=mesh_rows[info['static_index']]; mh=t['material_hashes'][info['material_index']]; sh=mat_vs(mh)
              draws.append({'info_index':info['index'],'static_index':info['static_index'],'material_index':info['material_index'],
                            'material':mh,'vertex_shader':sh['vertex_shader'],'pixel_shader':sh['pixel_shader'],
                            'unk0C':m['unk0C'],'unk0C_hex':m['unk0C_hex'],'stride0':m['vertices0']['stride'],
                            'stride1':m['vertices1']['stride'],'type0':m['vertices0']['type'],'type1':m['vertices1']['type'],
                            'detail_level':m['detail_level'],'primitive_type':m['primitive_type'],
                            'instance_count':info['instance_count']})

          def freq(keyfn, rows):
              c=Counter(keyfn(r) for r in rows)
              return [{'key':list(k) if isinstance(k,tuple) else k,'count':n} for k,n in c.most_common()]

          by_unk=defaultdict(list)
          for r in draws:by_unk[r['unk0C_hex']].append(r)
          groups={}
          for u,rs in sorted(by_unk.items()):
              groups[u]={
                'draw_count':len(rs),
                'layout_frequency':freq(lambda r:(r['stride0'],r['stride1'],r['type0'],r['type1']),rs),
                'vertex_shader_frequency':freq(lambda r:r['vertex_shader'],rs),
                'detail_primitive_frequency':freq(lambda r:(r['detail_level'],r['primitive_type']),rs),
                'materials':freq(lambda r:r['material'],rs),
              }

          target=[r for r in draws if r['material']=='80C9993C']
          # Retail serializes paired detail-7 and detail-1 variants for each of
          # the two geometry ranges.  Preserve all four here.  The normal visual
          # Tower selection rule keeps detail level 1 and excludes level 7.
          assert len(target)==4,target
          assert sorted(r['static_index'] for r in target)==[578,579,798,799],target
          assert all(r['unk0C_hex']=='0104' for r in target),target
          target_visible=[r for r in target if r['detail_level'] in (0,1,2,3,10)]
          target_nonvisual=[r for r in target if r['detail_level'] not in (0,1,2,3,10)]
          assert sorted(r['static_index'] for r in target_visible)==[579,799],target_visible
          assert sorted(r['static_index'] for r in target_nonvisual)==[578,798],target_nonvisual

          same_unk=[r for r in draws if r['unk0C_hex']=='0104']
          same_layout=[r for r in draws if (r['stride0'],r['stride1'])==(8,24)]
          out={
            'schema_version':2,'status':'D1_TOWER_STATIC_UNK0C_LAYOUT_CENSUS','table':'80C99827',
            'table_global_ok':t.get('ok'),'table_global_violations':t.get('violations',[]),
            'mesh_count':len(mesh_rows),'draw_count':len(draws),'mesh_rows':mesh_rows,'draw_rows':draws,
            'unk0C_groups':groups,
            'target_80C9993C_all':target,
            'target_80C9993C_visible':target_visible,
            'target_80C9993C_nonvisual_detail7':target_nonvisual,
            'unk0104_summary':{
              'draw_count':len(same_unk),
              'layout_frequency':freq(lambda r:(r['stride0'],r['stride1'],r['type0'],r['type1']),same_unk),
              'vertex_shader_frequency':freq(lambda r:r['vertex_shader'],same_unk),
              'material_frequency':freq(lambda r:r['material'],same_unk),
            },
            'stride8_24_summary':{
              'draw_count':len(same_layout),
              'unk0C_frequency':freq(lambda r:r['unk0C_hex'],same_layout),
              'vertex_shader_frequency':freq(lambda r:r['vertex_shader'],same_layout),
              'material_frequency':freq(lambda r:r['material'],same_layout),
            },
            'policy':'Correlation census only. No semantic meaning is assigned to unk0C unless retail relationships are exclusive enough to justify it.'
          }
          Path('reports/80C99827_unk0C_layout_census.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps({k:out[k] for k in ('status','mesh_count','draw_count','target_80C9993C_all','target_80C9993C_visible','unk0104_summary','stride8_24_summary')},indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-static-unk0c-layout-census
          path: reports/
          retention-days: 14
