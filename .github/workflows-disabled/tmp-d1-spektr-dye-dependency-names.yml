name: Temporary D1 Spektar dye dependency names

on:
  push:
    paths:
      - '.github/workflows/tmp-d1-spektr-dye-dependency-names.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Print current package members and archive-list neighbors
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o packages.txt
          python - <<'PY'
          import re
          from pathlib import Path
          names=[Path(x.strip()).name for x in Path('packages.txt').read_text(errors='replace').splitlines() if x.strip()]
          for pid in ('0135','0432'):
              hits=[i for i,n in enumerate(names) if re.search(rf'_{pid}_[0-9]+\.pkg$',n,re.I)]
              rows=[names[i] for i in hits]
              print('FAMILY',pid,'indices',hits,'members',rows)
              if not hits: raise SystemExit(f'no package members for {pid}')
              lo=max(0,min(hits)-8); hi=min(len(names),max(hits)+9)
              print('NEIGHBORS',pid)
              for i in range(lo,hi): print(i,names[i])
          for exact in ('ps4_investment_assets_013f_1.pkg','ps4_investment_globals_012f_0.pkg'):
              if exact in names: print('KNOWN_INDEX',exact,names.index(exact))
          PY
