name: D1 logical package-family census

on:
  push:
    paths:
      - '.github/workflows/d1-package-family-census.yml'
      - 'tools/d1_package_family_probe.py'
      - 'tools/d1_vector_container_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Recover verified Oodle runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Recover 0157 and 0767 complete families
        shell: bash
        run: |
          set -euo pipefail
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 \
            --start-offset 0x46AF91400 \
            --target ps4_globals_0157_0.pkg \
            --target ps4_globals_0157_1.pkg \
            --out recovered --manifest reports/0157_extract.json
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 \
            --start-offset 0x105C6E000 \
            --target ps4_arch_vex_com01_0767_0.pkg \
            --target ps4_arch_vex_com01_0767_1.pkg \
            --target ps4_arch_vex_com01_0767_4.pkg \
            --out recovered --manifest reports/0767_extract.json

      - name: Census logical family entry collisions and vector hashes
        shell: bash
        run: |
          set -euo pipefail
          python tools/d1_package_family_probe.py recovered/ps4_globals_0157_0.pkg --runtime runtime \
            --tag-hash 80AAE14C \
            -o reports/0157_family.json
          python tools/d1_package_family_probe.py recovered/ps4_arch_vex_com01_0767_0.pkg --runtime runtime \
            --tag-hash 816CE185 --tag-hash 816CE186 --tag-hash 816CE187 \
            --tag-hash 816CE188 --tag-hash 816CE189 --tag-hash 816CE0A9 \
            -o reports/0767_family.json
          python - <<'PY'
          import json
          from pathlib import Path
          for fn in ('reports/0157_family.json','reports/0767_family.json'):
              d=json.loads(Path(fn).read_text())
              print('\n###',fn)
              print('members',[(x['patch_member'],x['entry_count'],x['block_count']) for x in d['family_members']])
              print('union tags',d['union_tag_hash_count'])
              print('physical occurrences',d['total_physical_entry_occurrences'])
              print('duplicates',d['duplicate_tag_hash_count'])
              print('duplicate metadata identical/conflicting',d['duplicate_metadata_identical_count'],d['duplicate_metadata_conflicting_count'])
              print('selected')
              for x in d['selected']:
                  print(x['tag_hash'],[(o['patch_member'],o['entry_index'],o['type'],o['subtype'],o['reference'],o.get('available'),o.get('sha256')) for o in x['occurrences']])
          PY

      - name: Decode requested PS4 Vector4 containers in every physical member
        shell: bash
        run: |
          set -euo pipefail
          for p in recovered/ps4_globals_0157_*.pkg; do
            n="$(basename "$p" .pkg)"
            python tools/d1_vector_container_probe.py "$p" --runtime runtime \
              --tag-hash 80AAE14C -o "reports/${n}_vectors.json"
          done
          for p in recovered/ps4_arch_vex_com01_0767_*.pkg; do
            n="$(basename "$p" .pkg)"
            python tools/d1_vector_container_probe.py "$p" --runtime runtime \
              --tag-hash 816CE185 --tag-hash 816CE186 --tag-hash 816CE187 \
              --tag-hash 816CE188 --tag-hash 816CE189 --tag-hash 816CE0A9 \
              -o "reports/${n}_vectors.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path('reports').glob('*_vectors.json')):
              d=json.loads(p.read_text())
              real=[r for r in d['rows'] if not r.get('missing_or_wrong_representation')]
              if not real: continue
              print('\n###',p.name)
              for r in real:
                  print(r['tag_hash'],'entry',r['entry_index'],'type',r['type'],r['subtype'],'ref',r['reference'],'available',r['available'],'vectors',r.get('vectors'))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: d1-package-family-vector-census
          path: reports/
          retention-days: 1
          if-no-files-found: error
