name: D1 Tower collision resource census

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-collision-resource-census.yml'
      - 'tools/d1_world_collision_resource_census.py'
      - 'tools/d1_tower_recover_current_corpus.py'
      - 'tools/d1_tower_recover_activity_root_corpus.py'
      - 'tools/d1_split_tar_extract.py'
      - 'tools/d1_tower_map_schema_validate.py'
      - 'tools/d1_tower_map_schema_validate_v5.py'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Install Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Recover exact current Tower dependency and Activity corpus
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py \
            --package-list reports/packages.txt \
            --out-dir recovered \
            --report reports/current_corpus.json
          python tools/d1_tower_recover_activity_root_corpus.py \
            --package-list reports/packages.txt \
            --out-dir recovered \
            --report reports/activity_root_corpus.json

      - name: Census Havok physics candidates and occlusion AABBs
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          set +e
          python tools/d1_world_collision_resource_census.py "${args[@]}" --runtime runtime \
            --out reports/tower_collision_resource_census.json \
            | tee reports/tower_collision_resource_census_stdout.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_collision_resource_census.json'))
          print('TOWER_COLLISION_CENSUS',json.dumps({
              'status':d.get('status'),
              'havok_resources':d.get('havok_resource_count'),
              'havok_payloads':d.get('havok_payload_available_count'),
              'havok_packages':d.get('havok_package_histogram'),
              'static_maps':d.get('static_map_data_count'),
              'occlusion_resources':d.get('unique_occlusion_bounds_count'),
              'occlusion_boxes':d.get('occlusion_bound_record_count'),
              'violations':d.get('violations'),
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-collision-resource-census
          path: reports/
          retention-days: 14
          compression-level: 6
