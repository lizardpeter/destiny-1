name: D1 Tower three-NPC PS semantics wave 3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/d1_three_npc_ps_80876577_semantic_proof.py'
      - '.github/workflows/d1-tower-three-npc-ps-semantics-wave3.yml'

permissions: {contents: read, actions: read}

env:
  FRONTIER_ARTIFACT_ID: '10069257974'
  FRONTIER_ARTIFACT_SHA256: 'fe26726d4853c2ad2e2bc46c4a4ae51346e71583420f6e36cc573bb344799f27'
  STATE_ARTIFACT_ID: '10069795151'
  STATE_ARTIFACT_SHA256: '5dd54066b4460a49b7bb9106b870f4a1523e2ecd7d83e0932a59fcebbda70830'
  HIGH_IMPACT_ARTIFACT_ID: '10071676350'
  HIGH_IMPACT_ARTIFACT_SHA256: '19f8c4927a4f57befe67663804416b55b9a5f835775911b0e55b4b2bfc328e64'
  WAVE2_ARTIFACT_ID: '10072094359'
  WAVE2_ARTIFACT_SHA256: 'bbd05ec0c9d5e1268084c964068c830a9d36982272feff21f3a18d1be8a449cf'

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover pinned frontier, material state and prior semantic checkpoints
        run: |
          set -euo pipefail
          mkdir -p input/frontier input/state input/high input/wave2 reports
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FRONTIER_ARTIFACT_ID}/zip" -o input/frontier.zip
          echo "${FRONTIER_ARTIFACT_SHA256}  input/frontier.zip" | sha256sum --check --strict
          unzip -q input/frontier.zip -d input/frontier

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${STATE_ARTIFACT_ID}/zip" -o input/state.zip
          echo "${STATE_ARTIFACT_SHA256}  input/state.zip" | sha256sum --check --strict
          unzip -q input/state.zip -d input/state

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HIGH_IMPACT_ARTIFACT_ID}/zip" -o input/high.zip
          echo "${HIGH_IMPACT_ARTIFACT_SHA256}  input/high.zip" | sha256sum --check --strict
          unzip -q input/high.zip -d input/high

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${WAVE2_ARTIFACT_ID}/zip" -o input/wave2.zip
          echo "${WAVE2_ARTIFACT_SHA256}  input/wave2.zip" | sha256sum --check --strict
          unzip -q input/wave2.zip -d input/wave2

          test -f input/frontier/THREE_NPC_PS_SEMANTIC_FRONTIER.json
          test -f input/frontier/all_visible_ps_extract.json
          test -f input/frontier/THREE_NPC_PS_IMAGE_USAGE.json
          test -f input/frontier/disasm/PS_80876577.s
          test -f input/state/THREE_NPC_MATERIAL_STAGE_STATE.json
          test -f input/high/HIGH_IMPACT_PS_SEMANTICS_CHECKPOINT.json
          test -f input/wave2/WAVE2_CHECKPOINT.json

      - name: Verify immutable prior coverage boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          frontier=json.load(open('input/frontier/THREE_NPC_PS_SEMANTIC_FRONTIER.json'))
          high=json.load(open('input/high/HIGH_IMPACT_PS_SEMANTICS_CHECKPOINT.json'))
          wave2=json.load(open('input/wave2/WAVE2_CHECKPOINT.json'))
          assert frontier['status']=='D1_TOWER_THREE_NPC_PS_SEMANTIC_FRONTIER_EXACT' and not frontier['violations'],frontier
          assert frontier['unmatched_primitive_count']==218,frontier
          assert high['status']=='D1_TOWER_THREE_NPC_HIGH_IMPACT_PS_SEMANTICS_EXACT' and high['visible_primitive_count']==96,high
          assert wave2['status']=='D1_TOWER_THREE_NPC_PS_SEMANTICS_WAVE2_EXACT' and wave2['visible_primitive_count']==44,wave2
          print('PRIOR_SEMANTIC_BOUNDARY_EXACT','blocked',218,'closed',140,'remaining',78)
          PY

      - name: Prove 80876577 exact current-state color and coverage dataflow
        run: |
          set -euo pipefail
          python tools/d1_three_npc_ps_80876577_semantic_proof.py \
            --extract-report input/frontier/all_visible_ps_extract.json \
            --image-usage input/frontier/THREE_NPC_PS_IMAGE_USAGE.json \
            --material-state input/state/THREE_NPC_MATERIAL_STAGE_STATE.json \
            --disassembly input/frontier/disasm/PS_80876577.s \
            --out reports/PS_80876577_SEMANTICS.json
          python - <<'PY'
          import json
          d=json.load(open('reports/PS_80876577_SEMANTICS.json'))
          assert d['status']=='D1_TOWER_PS_80876577_CURRENT_STATE_COLOR_SEMANTICS_EXACT' and not d['violations'],d
          assert d['visible_primitive_count']==27,d
          assert d['gates']['current_material_native_color_dataflow_closed'] is True,d
          assert d['gates']['coverage_kill_path_closed'] is True,d
          assert d['gates']['portable_blender_recreation_complete'] is False,d
          print('PS_80876577_CURRENT_STATE_COLOR_EXACT',d['visible_primitive_count'])
          PY

      - name: Build cumulative 167-of-218 semantic checkpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          frontier=json.load(open('input/frontier/THREE_NPC_PS_SEMANTIC_FRONTIER.json'))
          high=json.load(open('input/high/HIGH_IMPACT_PS_SEMANTICS_CHECKPOINT.json'))
          wave2=json.load(open('input/wave2/WAVE2_CHECKPOINT.json'))
          wave3=json.load(open('reports/PS_80876577_SEMANTICS.json'))
          original=frontier['unmatched_primitive_count']
          closed=high['visible_primitive_count']+wave2['visible_primitive_count']+wave3['visible_primitive_count']
          remaining=original-closed
          assert (original,closed,remaining)==(218,167,51),(original,closed,remaining)
          out={
            'schema_version':1,
            'status':'D1_TOWER_THREE_NPC_BLOCKED_PS_SEMANTICS_167_OF_218_EXACT',
            'original_blocked_visible_primitive_count':original,
            'semantic_closed_visible_primitive_count':closed,
            'semantic_remaining_visible_primitive_count':remaining,
            'semantic_closed_fraction':closed/original,
            'new_wave_shader':'80876577',
            'new_wave_visible_primitive_count':27,
            'portable_blender_recreation_complete':False,
            'policy':'167 of the original 218 heuristic-forbidden visible primitives now have CI-promoted native/current-state color semantics. Remaining 51 are not promoted by similarity or texture appearance.',
          }
          Path('reports/CUMULATIVE_PS_SEMANTICS_167_OF_218.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          find reports -type f -print0 | sort -z | xargs -0 sha256sum > reports/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-TOWER-3-NPC-PS-SEMANTICS-WAVE3
          path: reports/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
