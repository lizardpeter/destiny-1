name: D1 Xur D912 owner parent backlinks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-d912-owner-parent-backlinks.yml'
      - 'tools/d1_remote_catalog_backlinks.py'

permissions: {contents: read, actions: read}

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: {GH_TOKEN: '${{ github.token }}', LINOODLE_SKIP_DLLMAIN: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact catalog and runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl -fsSL 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          curl -fsSL 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
      - name: Scan exact Tower structured payloads for Xur D912 owner backlinks
        run: |
          set -euo pipefail
          python tools/d1_remote_catalog_backlinks.py \
            --scan-package-id 0x023d --scan-package-id 0x0244 \
            --target 80C7A251 --target 80C7A441 --target 80C7A58F --target 80C7A719 \
            --target 80C7AC71 --target 80C7AC81 --target 80C7ACB9 \
            --target 80C88185 --target 80C8831B --target 80C88591 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            -o out/XUR_D912_OWNER_PARENT_BACKLINKS.json | tee out/stdout.txt
          python - <<'PY'
          import json
          d=json.load(open('out/XUR_D912_OWNER_PARENT_BACKLINKS.json'))
          assert d['error_count']==0,d['errors']
          print('XUR_D912_BACKLINKS','sources',d['hit_source_count'],'by_ref',json.dumps(d['hit_sources_by_reference'],sort_keys=True),'by_target',json.dumps(d['occurrences_by_target'],sort_keys=True))
          PY
      - name: Persist hashes
        run: find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: D1-XUR-D912-OWNER-PARENT-BACKLINKS, path: out/, retention-days: 90, if-no-files-found: error}
