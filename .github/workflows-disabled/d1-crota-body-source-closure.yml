name: D1 Crota body source closure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-body-source-closure.yml'
      - 'tools/d1_remote_exact_s_entity_probe.py'
      - 'tools/d1_remote_catalog_entity_resource_probe.py'
      - 'tools/d1_remote_catalog_backlinks.py'
      - 'tools/d1_entity_resource_probe.py'
      - 'tools/d1_remote_s_entity_resource_package_find.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Decode exact Crota-immunity s_entity assembly
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_exact_s_entity_probe.py \
            --tag-hash 0x8108E5BF \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_IMMUNITY_S_ENTITY_8108E5BF.json | tee out/s_entity_stdout.txt
      - name: Decode exact enclosing Crota and ultra-Knight EntityResources
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_catalog_entity_resource_probe.py \
            --tag-hash 0x8108E4D9 --tag-hash 0x8108E4C5 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_ENCLOSING_ENTITY_RESOURCES.json | tee out/enclosing_resources_stdout.txt
      - name: Probe ultra-Knight spawn target exactly
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY' | tee out/ultra_spawn_target_stdout.txt
          import hashlib,json,struct,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_playable_guardian_entity_resource_resolve import load_catalogs
          from d1_crota_raid_candidate_probe import LazyExactHashResolver
          from d1_split_tar_extract import SplitHttpTar
          catalogs=load_catalogs([Path('input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json')])
          arc=SplitHttpTar([f'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=90)
          r=LazyExactHashResolver(arc,catalogs,Path('runtime'))
          rows=[]
          for h in ('8108E52E','8108E5BF'):
              v,e=r.locate(h); b=v.entry(e['index'])
              matches=[]
              for off in range(0,len(b)-3,4):
                  x=struct.unpack_from('<I',b,off)[0]
                  try:
                      xv,xe=r.locate(f'{x:08X}')
                  except Exception:
                      continue
                  matches.append({'offset':off,'tag_hash':f'{x:08X}','reference':xe['reference'].upper(),'size':xe['file_size']})
              strings=[];start=None
              for i,x in enumerate(b+b'\0'):
                  if 0x20<=x<0x7f:
                      if start is None:start=i
                  else:
                      if start is not None and i-start>=4:
                          s=b[start:i].decode('ascii','replace')
                          if any(k in s.lower() for k in ('ultra','knight','crota','darklens','final')):
                              strings.append({'offset':start,'string':s})
                      start=None
              rows.append({'tag_hash':h,'entry':{k:e[k] for k in ('index','tag_hash','reference','type','subtype','file_size')},'payload_sha256':hashlib.sha256(b).hexdigest(),'aligned_resolved_tags':matches,'relevant_strings':strings})
              print('TAG',h,'ENTRY',rows[-1]['entry'],'STRINGS',strings,'MATCHES',matches)
          Path('out/CROTA_ULTRA_SPAWN_TARGETS.json').write_text(json.dumps({'entries':rows},indent=2)+'\n')
          PY
      - name: Trace Crota-immunity entity and ultra-spawn target backlinks
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_catalog_backlinks.py \
            --scan-package-id 0x0447 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --target 0x8108E5BF --target 0x8108E52E --target 0x8108E4D9 --target 0x8108E4C5 \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --max-entry-size 8000000 \
            -o out/CROTA_BODY_SOURCE_BACKLINKS.json | tee out/backlinks_stdout.txt
      - name: Validate and summarize source closure
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          s=json.load(open('out/CROTA_IMMUNITY_S_ENTITY_8108E5BF.json'))
          assert s['violation_count']==0,s['violations']
          e=s['entries'][0]
          assert e['entry']['reference']=='80800734',e['entry']
          print('IMMUNITY_ENTITY',e['tag_hash'],'RESOURCE_COUNT',e['resource_count'])
          for r in e['resources']:
              m=r.get('entry') or {}; er=r.get('entity_resource') or {}
              print(' CHILD',r.get('resource_index'),r.get('resource_hash'),'REF',m.get('reference'),'ROLE',er.get('semantic_role'),'MODEL',er.get('embedded_model_tag_hash'))
          b=json.load(open('out/CROTA_BODY_SOURCE_BACKLINKS.json'))
          assert b['error_count']==0,b['errors']
          print('BACKLINKS',b['hit_source_count'],'OCCURRENCES_BY_TARGET',b['occurrences_by_target'],'BY_REFERENCE',b['hit_sources_by_reference'])
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-BODY-SOURCE-CLOSURE
          path: out/
          retention-days: 30
          if-no-files-found: error
