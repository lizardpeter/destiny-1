name: D1 shared glove-collar external material decode

on:
  push:
    paths:
      - '.github/workflows/d1-shared-glove-collar-external-material-decode.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Decode exact external materials
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_material_exact_probe.py \
            --tag-hash 80A6A3F9 --tag-hash 80A6A400 \
            --member-catalog evidence/d1_investment_asset_member_catalog.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' \
            --part-count 10 --runtime runtime -o out/external_materials.json
      - name: Compare external and static hand material families
        run: |
          python - <<'PY'
          import json
          d=json.load(open('out/external_materials.json'))
          assert d['resolved_count']==2 and d['error_count']==0,d
          for m in d['materials']:
              print('EXTERNAL',m['tag_hash'],'VS',m['vertex_shader'],'PS',m['pixel_shader'])
              print(' PS_TEXTURES',m['ps_texture_tags'])
              print(' VS_TEXTURES',m['vs_texture_tags'])
          PY
          sha256sum out/external_materials.json > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: d1-shared-glove-collar-external-material-decode
          path: out/
          retention-days: 14
          if-no-files-found: error
