name: D1 Crota raid-owned scripted entities

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-raid-owned-scripted-entities.yml'
      - 'tools/d1_remote_raid_f603_scripted_owner_census.py'
      - 'tools/d1_crota_scripted_entity_table_probe.py'
      - 'tools/d1_remote_exact_s_entity_probe.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  CROTA_PLACEMENTS_ARTIFACT_ID: '9995963526'
  CROTA_PLACEMENTS_ZIP_SHA256: '69d03bac70adbc70a4950d0874f8245e825363e7578cd6d73a68c8a2dfc9b117'
  CROTA_PLACEMENTS_JSON_SHA256: 'a460f9e2500460897d4d34aebf0def24982bc6b80af54166b97839abf3c02ec0'

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog and moon_raid_1 traversal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog input/placements runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum -c --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum -c --strict
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CROTA_PLACEMENTS_ARTIFACT_ID}/zip" -o input/placements.zip
          echo "${CROTA_PLACEMENTS_ZIP_SHA256}  input/placements.zip" | sha256sum -c --strict
          unzip -q input/placements.zip -d input/placements
          echo "${CROTA_PLACEMENTS_JSON_SHA256}  input/placements/CROTA_END_RUNTIME_PLACEMENTS.json" | sha256sum -c --strict
          python - <<'PY'
          import json
          d=json.load(open('input/placements/CROTA_END_RUNTIME_PLACEMENTS.json'))
          assert d['activity']['tag_hash']=='8108E004',d['activity']
          assert d['activity']['name']=='moon_raid_1:scenario_client',d['activity']
          assert len(d['unique_f603_entity_resources'])==509,len(d['unique_f603_entity_resources'])
          assert not d['violations'],d['violations']
          print('EXACT_RAID_ROOT',d['activity'],'F603',len(d['unique_f603_entity_resources']))
          PY
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum -c --strict
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum -c --strict
      - name: Classify all 509 raid-owned SF603 EntityResources
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_remote_raid_f603_scripted_owner_census.py
          python tools/d1_remote_raid_f603_scripted_owner_census.py \
            --placements input/placements/CROTA_END_RUNTIME_PLACEMENTS.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_RAID_F603_SCRIPTED_OWNERS.json | tee out/f603_stdout.txt
      - name: Decode every raid-owned scripted table
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          ARGS=$(python - <<'PY'
          import json
          d=json.load(open('out/CROTA_RAID_F603_SCRIPTED_OWNERS.json'))
          assert d['input_f603_count']==509,d['input_f603_count']
          assert not d['violations'],d['violations']
          print(' '.join('--table 0x'+h for h in d['scripted_table_hashes']))
          PY
          )
          echo "TABLE_ARGS=$ARGS" | tee out/table_args.txt
          if [[ -n "$ARGS" ]]; then
            python tools/d1_crota_scripted_entity_table_probe.py $ARGS \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
              --runtime runtime -o out/CROTA_RAID_SCRIPTED_TABLES.json | tee out/tables_stdout.txt
          else
            printf '{"schema":"empty","table_count":0,"tables":[],"entity_hash_counts":{},"entity_name_string_hash_counts":{},"script_family_string_hash_counts":{},"type_string_hash_counts":{},"violations":[]}\n' > out/CROTA_RAID_SCRIPTED_TABLES.json
          fi
      - name: Fully decode every raid-scripted EntitySK
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          ARGS=$(python - <<'PY'
          import json
          d=json.load(open('out/CROTA_RAID_SCRIPTED_TABLES.json'))
          hs=sorted(h for h in d.get('entity_hash_counts',{}) if h not in ('00000000','FFFFFFFF'))
          print(' '.join('--tag-hash 0x'+h for h in hs))
          PY
          )
          echo "ENTITY_ARGS=$ARGS" | tee out/entity_args.txt
          if [[ -n "$ARGS" ]]; then
            python tools/d1_remote_exact_s_entity_probe.py $ARGS \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
              --runtime runtime -o out/CROTA_RAID_SCRIPTED_ENTITIES.json | tee out/entities_stdout.txt
          else
            printf '{"schema":"empty","entries":[],"violation_count":0,"violations":[]}\n' > out/CROTA_RAID_SCRIPTED_ENTITIES.json
          fi
      - name: Gate exact semantic frontier
        run: |
          set -euo pipefail
          python - <<'PY' | tee out/summary.txt
          import json
          c=json.load(open('out/CROTA_RAID_F603_SCRIPTED_OWNERS.json'))
          t=json.load(open('out/CROTA_RAID_SCRIPTED_TABLES.json'))
          e=json.load(open('out/CROTA_RAID_SCRIPTED_ENTITIES.json'))
          assert c['input_f603_count']==509
          assert not c['violations'],c['violations']
          assert not t.get('violations'),t.get('violations')
          assert e.get('violation_count',0)==0,e.get('violations')
          target_hashes={
            'ACC65F88':'crota',
            '1FD437C8':'R1S2RaidMoon0Ultra0',
            '2F28D739':'HiveUltraKnightA',
            '2EA84559':'Crota, Son of Oryx',
            '2CF43F68':'Crota',
          }
          scalar_sets={
            'script_family':set(t.get('script_family_string_hash_counts',{})),
            'script_type':set(t.get('type_string_hash_counts',{})),
            'instance_entity_name':set(t.get('entity_name_string_hash_counts',{})),
          }
          matches=[]
          for field,vals in scalar_sets.items():
            for h in sorted(vals & set(target_hashes)):
              matches.append((field,h,target_hashes[h]))
          articulated=[]
          for x in e.get('entries',[]):
            sk=[(s['resource_hash'],s['node_count']) for s in x.get('skeletons',[])]
            if sk:
              articulated.append({'entity':x['tag_hash'],'package':x.get('package_id'),'models':x.get('embedded_models',[]),'skeletons':sk,
                                  'specific_name_hashes':x.get('specific_name_string_hashes',[]),'generic_name_tags':x.get('generic_name_tags',[])})
          print('RAID_F603',c['input_f603_count'])
          print('ROLE_COUNTS',c['role_counts'])
          print('SCRIPTED_OWNER_COUNT',c['scripted_owner_count'])
          print('SCRIPTED_TABLES',c['scripted_table_hashes'])
          print('SCRIPT_FAMILIES',t.get('script_family_string_hash_counts',{}))
          print('SCRIPT_TYPES',t.get('type_string_hash_counts',{}))
          print('INSTANCE_NAME_HASHES',t.get('entity_name_string_hash_counts',{}))
          print('ENTITY_COUNTS',t.get('entity_hash_counts',{}))
          print('ARTICULATED_SCRIPTED_ENTITIES',articulated)
          print('DIRECT_TARGET_HASH_MATCHES',matches)
          print('POLICY raid ownership is exact; semantic Crota identity remains unpromoted unless a source-typed semantic hash/name edge closes it.')
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-RAID-OWNED-SCRIPTED-ENTITIES
          path: out/
          retention-days: 30
          if-no-files-found: error
