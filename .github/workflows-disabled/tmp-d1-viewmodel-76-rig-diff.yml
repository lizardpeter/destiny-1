name: Temporary diff D1 76-node shared viewmodel rig variants

on:
  push:
    paths:
      - '.github/workflows/tmp-d1-viewmodel-76-rig-diff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies and 0151
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy scipy pygltflib pyglm
          mkdir -p runtime recovered out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x45190B000 \
            --target ps4_globals_0151_0.pkg --target ps4_globals_0151_1.pkg --target ps4_globals_0151_2.pkg \
            --target ps4_globals_0151_3.pkg --target ps4_globals_0151_4.pkg --target ps4_globals_0151_5.pkg --target ps4_globals_0151_6.pkg \
            --out recovered --manifest out/0151_extract.json --retries 6 --timeout 90
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git tiger-animation-parser
          git -C tiger-animation-parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
      - name: Parse and compare exact variants
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import io,json,sys
          from pathlib import Path
          sys.path.insert(0,'tools');sys.path.insert(0,str(Path('tiger-animation-parser').resolve()))
          from d1_entry_extract import EntryReader
          from tag.game_version import Game_Version
          from tag_readers.read_skeleton import read_skeleton
          from tag_readers.read_rig import read_runtime_rig
          from fnv_hashes.bones_names import convert_hash_to_bungie_name,convert_hash_to_blender_name
          r=EntryReader(Path('recovered/ps4_globals_0151_6.pkg'),Path('runtime'));by={e['tag_hash'].upper():e for e in r.entries}
          def raw(t):return r.entry(by[t]['index'])
          ver=Game_Version.D1_ROI
          pairs=[('80AA3CB2','80AA3CB3'),('80AA3CB8','80AA3CB9'),('80AA3CBE','80AA3CBF')]
          out=[]
          for rt,st in pairs:
              rig=read_runtime_rig(io.BytesIO(raw(rt)),ver);sk=read_skeleton(io.BytesIO(raw(st)),ver)
              bones=[]
              for i,n in enumerate(sk.node_defs):
                  h=int(n.bone_hash)&0xffffffff
                  try: bungie=convert_hash_to_bungie_name(h)
                  except Exception: bungie=None
                  try: blender=convert_hash_to_blender_name(h)
                  except Exception: blender=None
                  bones.append({'index':i,'hash':f'{h:08X}','parent':int(n.parent_node_index),'first_child':int(n.first_child_node_index),'next_sibling':int(n.next_sibling_node_index),'bungie_name':bungie,'blender_name':blender})
              out.append({'rig':rt,'skeleton':st,'rig_controls':len(rig.controls_relations),'bones':bones,
                          'control_name_to_bone_index':[int(x) if isinstance(x,(int,bool)) else str(x) for x in rig.control_name_to_bone_index]})
          # diff bone defs and control maps by index
          diffs=[]
          for a,b in [(out[0],out[1]),(out[0],out[2]),(out[1],out[2])]:
              q={'a':a['skeleton'],'b':b['skeleton'],'bone_diffs':[],'control_map_diffs':[]}
              for i,(x,y) in enumerate(zip(a['bones'],b['bones'])):
                  if x!=y:q['bone_diffs'].append({'index':i,'a':x,'b':y})
              for i,(x,y) in enumerate(zip(a['control_name_to_bone_index'],b['control_name_to_bone_index'])):
                  if x!=y:q['control_map_diffs'].append({'index':i,'a':x,'b':y})
              q['lengths']=[len(a['bones']),len(b['bones'])]
              diffs.append(q)
          rep={'pairs':out,'diffs':diffs}
          Path('out/d1_viewmodel_76_rig_diff.json').write_text(json.dumps(rep,indent=2)+'\n')
          print('DIFFS',json.dumps(diffs,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-viewmodel-76-rig-diff
          path: out/
          retention-days: 7
          if-no-files-found: error
