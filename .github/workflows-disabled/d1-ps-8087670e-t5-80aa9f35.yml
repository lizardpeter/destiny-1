name: D1 PS 8087670E alternate t5 80AA9F35 decode

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-ps-8087670e-t5-80aa9f35.yml'
      - 'tools/d1_texture_export.py'
      - 'tools/d1_dds_to_png.py'

permissions: {contents: read}

jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover verified runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports/raw textures
          python -m pip install --disable-pip-version-check pillow
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Recover exact current 0154 logical package siblings
        run: |
          set -euo pipefail
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --start-offset 0x44EE5D200 \
            --target ps4_globals_0154_0.pkg --target ps4_globals_0154_1.pkg --target ps4_globals_0154_2.pkg \
            --target ps4_globals_0154_3.pkg --target ps4_globals_0154_4.pkg --target ps4_globals_0154_5.pkg \
            --out recovered --manifest reports/0154_extract.json --retries 6 --timeout 90
          test -f recovered/ps4_globals_0154_5.pkg
      - name: Decode exact t5 resource 80AA9F35 and preserve payload
        run: |
          set -euo pipefail
          python tools/d1_entry_extract.py recovered/ps4_globals_0154_5.pkg --runtime runtime --tag-hash 80AA9F35 \
            --dump-dir reports/raw -o reports/80AA9F35_entry.json
          raw="$(find reports/raw -name '80AA9F35_*.bin' -type f -print -quit)"
          test -n "$raw"
          python tools/d1_texture_export.py recovered/ps4_globals_0154_5.pkg --runtime runtime \
            --tag-hash 80AA9F35 --out textures/80AA9F35
          python - "$raw" <<'PY'
          import json,pathlib,struct,sys
          from tools.d1_entry_extract import EntryReader
          from tools.d1_investment_arrangement_probe import filehash_pkg_index
          raw=pathlib.Path(sys.argv[1]).read_bytes(); assert len(raw)==132,len(raw)
          r=EntryReader(pathlib.Path('recovered/ps4_globals_0154_5.pkg'),pathlib.Path('runtime'))
          by_index={int(e['index']):e for e in r.entries}
          rows=[]
          for off in range(0,len(raw)-3,4):
              v=struct.unpack_from('<I',raw,off)[0]
              pkg,idx=filehash_pkg_index(v)
              rec={'offset':off,'value':f'{v:08X}','decoded_package_id':f'{pkg:04X}','decoded_entry_index':idx}
              if pkg==int(r.h['pkg_id']) and idx in by_index:
                  e=by_index[idx]
                  rec['same_package_entry']={k:e.get(k) for k in ('tag_hash','index','type','subtype','reference','file_size')}
                  rec['same_package_tag_matches_value']=str(e.get('tag_hash','')).upper()==f'{v:08X}'
              rows.append(rec)
          matches=[x for x in rows if x.get('same_package_tag_matches_value')]
          assert matches==[{'offset':128,'value':'80AA9F36','decoded_package_id':'0154','decoded_entry_index':7990,
                            'same_package_entry':{'tag_hash':'80AA9F36','index':7990,'type':32,'subtype':1,'reference':'80AA9F37','file_size':60},
                            'same_package_tag_matches_value':True}],matches
          out={'schema_version':1,'tag_hash':'80AA9F35','payload_bytes':len(raw),'payload_hex':raw.hex(),
               'u32_aligned_words':rows,'typed_texture_header_edge':matches[0],
               'policy':'The 0x80 edge is promoted because its exact value is an existing same-package TagHash whose entry is a Texture2DHeader. Other words remain discovery-only.'}
          pathlib.Path('reports/80AA9F35_aligned_words.json').write_text(json.dumps(out,indent=2)+'\n')
          print('TYPED_T5_EDGE_GREEN',json.dumps(matches[0],indent=2))
          PY
          cat reports/80AA9F35_entry.json
          cat textures/80AA9F35/texture_manifest.json
      - name: Close 80AA9F36 to 80AA9F37 texture chain
        run: |
          set -euo pipefail
          python tools/d1_entry_extract.py recovered/ps4_globals_0154_5.pkg --runtime runtime --tag-hash 80AA9F36 \
            --dump-dir reports/raw -o reports/80AA9F36_entry.json
          python tools/d1_entry_extract.py recovered/ps4_globals_0154_5.pkg --runtime runtime --tag-hash 80AA9F37 \
            --dump-dir reports/raw -o reports/80AA9F37_entry.json
          python tools/d1_texture_export.py recovered/ps4_globals_0154_5.pkg --runtime runtime \
            --tag-hash 80AA9F36 --out textures/80AA9F36
          python - <<'PY'
          import json,pathlib
          from PIL import Image,ImageStat
          h=json.load(open('reports/80AA9F36_entry.json'))
          assert h['missing_tag_hashes']==[] and h['errors']==[] and len(h['entries'])==1,h
          e=h['entries'][0]
          assert e['tag_hash']=='80AA9F36' and e['type']==32 and e['subtype']==1 and e['reference']=='80AA9F37' and e['size']==60,e
          backing=json.load(open('reports/80AA9F37_entry.json'))
          manifest=json.load(open('textures/80AA9F36/texture_manifest.json'))
          assert manifest.get('missing_requested')==[],manifest
          rows=manifest.get('textures') or []
          assert len(rows)==1,manifest
          row=rows[0]
          files=sorted(str(p) for p in pathlib.Path('textures/80AA9F36').rglob('*') if p.is_file())
          pngs=[pathlib.Path(p) for p in files if p.lower().endswith('.png')]
          stats=[]
          for p in pngs:
              im=Image.open(p).convert('RGBA')
              st=ImageStat.Stat(im)
              stats.append({'file':str(p),'size':list(im.size),'mode':im.mode,'extrema':[list(x) for x in im.getextrema()],
                            'mean':[float(x) for x in st.mean],'rms':[float(x) for x in st.rms]})
          out={'schema_version':1,'status':'D1_PS_8087670E_T5_80AA9F35_TYPED_TEXTURE_CHAIN_EXACT',
               'wrapper':{'tag_hash':'80AA9F35','class':'80802070','payload_bytes':132,'texture_header_offset':128},
               'texture_header':e,'reference_entry_probe':backing,'texture_manifest_row':row,
               'png_statistics':stats,'files':files,'violations':[],
               'policy':'Semantic role is promoted only from exact header/backing/format and decoded pixel evidence; this report does not infer t4 or API15 state.'}
          pathlib.Path('reports/80AA9F35_T5_CHAIN_EXACT.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Persist hashes
        if: always()
        run: |
          find reports textures -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > reports/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-PS-8087670E-T5-80AA9F35-EXACT
          path: |
            reports/
            textures/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
