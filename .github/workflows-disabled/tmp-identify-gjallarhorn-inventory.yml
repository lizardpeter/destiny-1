name: Temporary identify D1 Gjallarhorn inventory definitions

on:
  push:
    paths:
      - '.github/workflows/tmp-identify-gjallarhorn-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover verified Oodle runtime and 012f logical family
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_split_tar_extract.py \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --start-offset 0x61A5CB200 \
            --target ps4_investment_globals_012f_0.pkg --target ps4_investment_globals_012f_1.pkg \
            --target ps4_investment_globals_012f_2.pkg --target ps4_investment_globals_012f_3.pkg \
            --target ps4_investment_globals_012f_4.pkg --target ps4_investment_globals_012f_5.pkg \
            --target ps4_investment_globals_012f_6.pkg \
            --out recovered --manifest reports/012f_extract.json --retries 6 --timeout 90
      - name: Resolve Gjallarhorn API hashes through retail 80A5FFBE inventory map
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import json,struct,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_entry_extract import EntryReader
          from d1_investment_arrangement_probe import dyn_header,filehash_pkg_index

          targets={
              0x4BF4BE3F:'Gjallarhorn Year 1',
              0xD471D331:'Gjallarhorn Year 3',
              0x45CA94E4:'Iron Gjallarhorn',
          }
          r=EntryReader(Path('recovered/ps4_investment_globals_012f_6.pkg'),Path('runtime'))
          by={e['tag_hash'].upper():e for e in r.entries}
          e=by['80A5FFBE']; b=r.entry(e['index'])
          count,data=dyn_header(b,0x08)
          hits=[]
          for i in range(count):
              o=data+i*0x18
              inv=struct.unpack_from('<I',b,o)[0]
              if inv not in targets:
                  continue
              fh=struct.unpack_from('<I',b,o+0x10)[0]
              pkg,idx=filehash_pkg_index(fh)
              row={
                  'name':targets[inv],
                  'map_index':i,
                  'inventory_item_hash_decimal':inv,
                  'inventory_item_hash_hex':f'{inv:08X}',
                  'item_file_hash':f'{fh:08X}',
                  'item_package_id':pkg,
                  'item_package_id_hex':f'{pkg:04X}',
                  'item_file_index':idx,
              }
              hits.append(row)
              print('GJALLARHORN_INVENTORY_MATCH',json.dumps(row,separators=(',',':')))
          rep={
              'map_tag':'80A5FFBE','map_entry_index':e['index'],'map_reference':e['reference'].upper(),
              'row_count':count,'targets':{f'{k:08X}':v for k,v in targets.items()},'hits':hits,
          }
          Path('reports/gjallarhorn_inventory_resolution.json').write_text(json.dumps(rep,indent=2)+'\n')
          found={x['inventory_item_hash_hex'] for x in hits}
          missing=sorted(set(rep['targets'])-found)
          print('FOUND',len(hits),'MISSING',missing)
          if 'D471D331' not in found:
              raise SystemExit('Rise of Iron Gjallarhorn inventory hash not found in retail map')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-gjallarhorn-inventory-resolution
          path: reports/
          retention-days: 7
          if-no-files-found: warn
