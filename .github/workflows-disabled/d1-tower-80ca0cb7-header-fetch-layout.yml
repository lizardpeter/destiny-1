name: D1 Tower 80CA0CB7 header and target stage

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-80ca0cb7-header-fetch-layout.yml'
      - 'tools/d1_entry_extract.py'
      - 'tools/d1_tower_map_schema_validate.py'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LINOODLE_SKIP_DLLMAIN: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover current archive index, runtime, and exact 024c/0250 families
        run: |
          set -euo pipefail
          mkdir -p index runtime packages dumps reports
          idx_run="$(gh run list --workflow d1-global-activity-index.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$idx_run"
          gh run download "$idx_run" -n d1-global-activity-index -D index
          cp "$(find index -name D1_CURRENT_ACTIVITY_INDEX.json -print -quit)" reports/D1_CURRENT_ACTIVITY_INDEX.json
          cp "$(find index -name packages.txt -print -quit)" reports/packages.txt
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          python tools/d1_recover_indexed_package_families.py \
            --index reports/D1_CURRENT_ACTIVITY_INDEX.json --package-list reports/packages.txt \
            --package-id 024c --package-id 0250 --out-dir packages --report reports/recovery.json

      - name: Dump exact 80CA0CB7 engine shader header
        run: |
          set -euo pipefail
          p="$(find packages -name 'ps4_city_tower_destination_0250_5.pkg' -print -quit)"
          test -n "$p"
          python tools/d1_entry_extract.py "$p" --runtime runtime --tag-hash 80CA0CB7 \
            --dump-dir dumps --output reports/80CA0CB7_entry.json
          f="$(find dumps -name '80CA0CB7_*_32_9.bin' -print -quit)"
          test -f "$f"
          cp "$f" reports/80CA0CB7_header.bin
          python - <<'PY'
          import json,struct,hashlib
          from pathlib import Path
          b=Path('reports/80CA0CB7_header.bin').read_bytes()
          out={'status':'D1_80CA0CB7_RAW_HEADER','bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),
               'hex':b.hex(),'u32_le':[f'{x:08X}' for x in struct.unpack('<'+'I'*(len(b)//4),b)]}
          Path('reports/80CA0CB7_header_words.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Decode target table 80C99827 and exact unk0C values
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import d1_tower_map_schema_validate as m
          c=m.Corpus([p.resolve() for p in sorted(Path('packages').glob('*.pkg'))],Path('runtime').resolve())
          t=m.parse_static_table(c,'80C99827')
          # The table parser deliberately records unresolved buffer targets anywhere in
          # the table as global violations.  Those do not invalidate serialized fields
          # on the three independently identified rows we are probing here, so preserve
          # the violations as evidence instead of using t['ok'] as an unrelated gate.
          rows=[]
          for info_index in (926,976,978):
              assert 0 <= info_index < len(t['info_entries'])
              info=t['info_entries'][info_index]
              assert 0 <= info['static_index'] < len(t['mesh_entries'])
              assert 0 <= info['material_index'] < len(t['material_hashes'])
              mesh=t['mesh_entries'][info['static_index']]
              mh=t['material_hashes'][info['material_index']]
              rows.append({'info_index':info_index,'info':info,'mesh':mesh,'material_hash':mh})
          target=[r for r in rows if r['material_hash']=='80C9993C']
          assert len(target)==2,target
          out={'status':'D1_TOWER_80C99827_TARGET_STAGE_CENSUS','table':'80C99827',
               'table_global_ok':t['ok'],'table_global_violations':t.get('violations',[]),
               'rows':rows,'target_80C9993C_static_indices':[r['info']['static_index'] for r in target],
               'target_80C9993C_unk0C':[r['mesh']['unk0C'] for r in target],
               'all_unk0C_frequency':{str(k):sum(1 for x in t['mesh_entries'] if x['unk0C']==k) for k in sorted({x['unk0C'] for x in t['mesh_entries']})}}
          Path('reports/80C99827_target_stage.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Decode PS4 Gnm-like VS trailing semantic tables by bounded candidate layout
        if: always()
        run: |
          set -euo pipefail
          test -f reports/80CA0CB7_header.bin
          python - <<'PY'
          import json,struct
          from pathlib import Path
          b=Path('reports/80CA0CB7_header.bin').read_bytes()
          # Do not assume the whole Tiger entry is a raw GnmVsShader. Search all 4-byte
          # aligned positions for a self-consistent trailing table layout where byte
          # fields encode plausible input/export counts and the total stays in bounds.
          candidates=[]
          for base in range(0,len(b)-0x28+1,4):
              nin,nout,gsm,fetch=b[base+0x24:base+0x28]
              if not (1<=nin<=16 and 1<=nout<=16): continue
              common=struct.unpack_from('<I',b,base)[0]
              nusage=(common>>24)&0xff
              if nusage>32: continue
              end=base+0x28+nusage*4+nin*4+nout*2
              if end>len(b): continue
              inputs=[]
              p=base+0x28+nusage*4
              for i in range(nin):
                  sem,vgpr,size,unused=struct.unpack_from('<4B',b,p+i*4)
                  inputs.append({'semantic':sem,'vgpr':vgpr,'size_in_elements':size,'unused':unused})
              exports=[]
              p2=p+nin*4
              for i in range(nout):
                  sem,packed=struct.unpack_from('<2B',b,p2+i*2)
                  exports.append({'semantic':sem,'out_index':packed&0x1f,'unused_bit':(packed>>5)&1,'export_f16':(packed>>6)&3,'raw':f'{sem:02X}{packed:02X}'})
              score=sum(1 for x in inputs if x['unused']==0 and 1<=x['size_in_elements']<=4 and x['vgpr']<64)
              score+=sum(1 for x in exports if x['out_index']<16)
              candidates.append({'base':base,'nusage':nusage,'num_inputs':nin,'num_exports':nout,'gs_mode':gsm,'fetch_control':fetch,'end':end,'score':score,'inputs':inputs,'exports':exports})
          candidates=sorted(candidates,key=lambda x:(-x['score'],x['base']))
          out={'status':'D1_80CA0CB7_GNM_LAYOUT_CANDIDATES','header_bytes':len(b),'candidates':candidates[:20],
               'policy':'Candidate layouts only; no layout is promoted unless structural offsets and semantic behavior independently agree.'}
          Path('reports/80CA0CB7_gnm_layout_candidates.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-80ca0cb7-header-fetch-layout
          path: reports/
          retention-days: 14
