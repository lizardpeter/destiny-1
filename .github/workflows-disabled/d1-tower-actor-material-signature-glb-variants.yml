name: D1 Tower actor material signature GLB variants

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-actor-material-signature-glb-variants.yml'
      - 'tools/d1_gltf_apply_tower_actor_material_signatures.py'
      - 'tools/d1_gltf_restore_native_tiger_skin_basis.py'
      - 'tools/d1_gltf_skin_bind_identity_probe.py'

permissions: {contents: read, actions: read}

env:
  SIGNATURE_ARTIFACT_ID: '10035991740'
  SIGNATURE_ARTIFACT_SHA256: '4bb937be6206900ff241c93a40dd54e4e7b00387c30dfd28f991039fd5760c6f'
  VISUAL_ARTIFACT_ID: '10001232930'
  VISUAL_ARTIFACT_SHA256: 'a662155f8a6259def83474f08b7508c6f1f5f1f87b1d368b924b2648e6737113'
  SKINNED_ARTIFACT_ID: '10001481050'
  SKINNED_ARTIFACT_SHA256: '6390225a8c0f5ef9c092692ec7b9cf2fff6e5dcb8c3cbb32fb3859564b27a43d'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -q numpy scipy

      - name: Recover exact signature, visual, and 13-model skin checkpoints
        run: |
          set -euo pipefail
          mkdir -p input/signatures input/visual input/skinned native reports/bind variants out
          pull_artifact() {
            id="$1"; sha="$2"; zip="$3"; dst="$4"
            curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" -o "$zip"
            echo "${sha}  ${zip}" | sha256sum --check --strict
            unzip -q "$zip" -d "$dst"
          }
          pull_artifact "$SIGNATURE_ARTIFACT_ID" "$SIGNATURE_ARTIFACT_SHA256" input/signatures.zip input/signatures
          pull_artifact "$VISUAL_ARTIFACT_ID" "$VISUAL_ARTIFACT_SHA256" input/visual.zip input/visual
          pull_artifact "$SKINNED_ARTIFACT_ID" "$SKINNED_ARTIFACT_SHA256" input/skinned.zip input/skinned
          test "$(find input/skinned -maxdepth 1 -name '*_SKINNED.glb' -type f | wc -l)" = 13

      - name: Restore and verify exact native D1 basis for the 13 source models
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_gltf_restore_native_tiger_skin_basis.py tools/d1_gltf_skin_bind_identity_probe.py
          for src in input/skinned/*_SKINNED.glb; do
            model="$(basename "$src" _SKINNED.glb)"
            python tools/d1_gltf_restore_native_tiger_skin_basis.py "$src" \
              --out "native/${model}_SKINNED_NATIVE_D1.glb" \
              --report "reports/${model}_NATIVE_BASIS.json"
            python tools/d1_gltf_skin_bind_identity_probe.py "native/${model}_SKINNED_NATIVE_D1.glb" \
              --max-error 2e-5 -o "reports/bind/${model}.json"
          done
          python - <<'PY'
          import glob,json
          fs=glob.glob('native/*_SKINNED_NATIVE_D1.glb'); assert len(fs)==13,fs
          for p in glob.glob('reports/bind/*.json'):
              d=json.load(open(p)); assert d['status']=='D1_GLTF_SKIN_BIND_IDENTITY_COMPLETE' and d['max_observed_error']<=2e-5,d
          print('NATIVE_BASES_GREEN',len(fs))
          PY

      - name: Emit every exact visible material signature as its own GLB
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_gltf_apply_tower_actor_material_signatures.py
          python tools/d1_gltf_apply_tower_actor_material_signatures.py \
            --signatures input/signatures/D1_TOWER_ACTOR_VISIBLE_MATERIAL_SIGNATURES_FINAL.json \
            --model-export input/visual/tower_spawned_actor_model_export.json \
            --input-dir native --out-dir variants \
            --report out/D1_TOWER_ACTOR_MATERIAL_SIGNATURE_GLB_VARIANTS.json | tee out/stdout.txt
          python - <<'PY'
          import glob,json,os,struct
          d=json.load(open('out/D1_TOWER_ACTOR_MATERIAL_SIGNATURE_GLB_VARIANTS.json'))
          assert d['status']=='D1_TOWER_ACTOR_MATERIAL_SIGNATURE_GLB_VARIANTS_COMPLETE',d['violations']
          assert d['actor_model_count']==13 and d['output_variant_count']==30,d
          assert d['per_model_output_counts']['809D8104']==5,d
          assert d['per_model_output_counts']['80C885E3']==8,d
          assert d['per_model_output_counts']['80C88CEF']==7,d
          fs=sorted(glob.glob('variants/*_SKINNED_NATIVE_D1.glb')); assert len(fs)==30,fs
          def jdoc(p):
              b=open(p,'rb').read(); n,t=struct.unpack_from('<I4s',b,12); assert t==b'JSON'
              return json.loads(b[20:20+n].decode().rstrip('\x00 '))
          for p in fs:
              g=jdoc(p); assert len(g.get('skins',[]))==1,(p,len(g.get('skins',[])))
              assert all(n.get('skin')==0 for n in g.get('nodes',[]) if 'mesh' in n),(p,'skin')
          print('MATERIAL_VARIANTS_GREEN',len(fs))
          PY

      - name: Publish production material-variant checkpoint
        run: |
          set -euo pipefail
          cp variants/*.glb out/
          cp input/signatures/D1_TOWER_ACTOR_VISIBLE_MATERIAL_SIGNATURES_FINAL.json out/
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-TOWER-ACTOR-30-MATERIAL-SIGNATURE-SKINNED-VARIANTS
          path: out/
          retention-days: 90
          if-no-files-found: error
          compression-level: 6
