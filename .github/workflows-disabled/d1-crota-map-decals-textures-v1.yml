name: D1 Crota map decal textures v1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-map-decals-textures-v1.yml'
      - 'tools/d1_close_world_texture_dependencies_indexed.py'
      - 'tools/d1_world_material_texture_export_v2.py'
      - 'tools/d1_world_texture_role_inventory.py'

permissions:
  contents: read
  actions: read

env:
  DECAL_ARTIFACT_ID: '10038932898'
  DECAL_ARTIFACT_SHA256: '88d3a3dc15b825a531e21e4dce113c1688627f9857fe176d1eb28858e494d721'

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover authoritative decal census and current archive identity
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q numpy pillow texture2ddecoder
          mkdir -p input runtime packages texture_expanded texture_work textures reports out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DECAL_ARTIFACT_ID}/zip" -o input/decals.zip
          echo "${DECAL_ARTIFACT_SHA256}  input/decals.zip" | sha256sum --check --strict
          unzip -q input/decals.zip -d input/decals
          src="$(find input/decals -name crota_map_decal_census.json -type f -print -quit)"
          test -n "$src"
          cp "$src" reports/crota_map_decal_census.json
          python - <<'PY'
          import json
          d=json.load(open('reports/crota_map_decal_census.json'))
          assert d['status']=='D1_WORLD_MAP_DECAL_CENSUS_COMPLETE',d
          assert d['decal_resource_occurrences']==13,d
          assert d['nonnull_decal_collection_occurrences']==12,d
          assert d['explicit_null_decal_collection_occurrences']==1,d
          assert d['decal_resource_record_count']==77,d
          assert d['decal_location_count']==1089,d
          assert d['projected_decal_count']==1092,d
          assert d['unique_material_count']==47,d
          assert not d['missing_dependency_package_ids'] and not d['violations'],d
          mats=sorted(d['material_reference_counts'])
          assert len(mats)==47,mats
          json.dump({'status':'D1_CROTA_DECAL_MATERIAL_SELECTOR_EXACT','material_count':47,
                     'materials':{h:{'visual':True} for h in mats}},
                    open('reports/decal_material_selector.json','w'),indent=2)
          print('DECAL_CENSUS_ACCEPTED',len(mats),'materials',d['projected_decal_count'],'applications')
          PY
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl -fsSL --retry 8 'https://github.com/lizardpeter/destiny-1/releases/download/d1-global-activity-index-r1/D1_CURRENT_ACTIVITY_INDEX.json' -o reports/D1_CURRENT_ACTIVITY_INDEX.json
          curl -fsSL --retry 4 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python - <<'PY'
          import hashlib,json
          d=json.load(open('reports/D1_CURRENT_ACTIVITY_INDEX.json'))
          h=hashlib.sha256(open('reports/packages.txt','rb').read()).hexdigest()
          assert d['status']=='D1_REMOTE_ACTIVITY_INDEX_COMPLETE',d
          assert h==(d.get('source') or {}).get('package_list_sha256'),(h,d.get('source'))
          print('ARCHIVE_INDEX_ACCEPTED',h)
          PY

      - name: Recover exact Material owner families
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from tools.d1_filehash import package_hex
          d=json.load(open('reports/decal_material_selector.json'))
          ids=sorted({package_hex(h).lower() for h in d['materials']})
          assert ids
          open('reports/decal_material_package_ids.txt','w').write('\n'.join(ids)+'\n')
          print('DECAL_MATERIAL_PACKAGE_IDS',len(ids),ids)
          PY
          args=(); while read -r p; do args+=(--package-id "$p"); done < reports/decal_material_package_ids.txt
          python tools/d1_recover_indexed_package_families.py \
            --index reports/D1_CURRENT_ACTIVITY_INDEX.json --package-list reports/packages.txt \
            "${args[@]}" --out-dir packages --report reports/decal_material_package_recovery.json

      - name: Close every exact decal material texture dependency
        run: |
          set -euo pipefail
          python tools/d1_close_world_texture_dependencies_indexed.py \
            --snapshot-dir packages --runtime runtime \
            --visual-json reports/decal_material_selector.json \
            --index reports/D1_CURRENT_ACTIVITY_INDEX.json --package-list reports/packages.txt \
            --expansion-dir texture_expanded --work-dir texture_work --out textures \
            --report reports/crota_decal_texture_dependency_closure.json
          python tools/d1_world_texture_role_inventory.py textures/material_texture_manifest.json \
            -o reports/crota_decal_texture_roles.json
          python - <<'PY'
          import json
          c=json.load(open('reports/crota_decal_texture_dependency_closure.json'))
          m=json.load(open('textures/material_texture_manifest.json'))
          assert c['status']=='D1_INDEXED_WORLD_TEXTURE_DEPENDENCY_CLOSURE_COMPLETE',c
          assert m['visible_material_count']==47,m
          assert m['material_decode_errors']==0,m
          assert m['texture_errors']==0,m
          assert m['decoded_texture_tags']==m['unique_texture_tags'],m
          assert not m['missing_texture_package_ids'],m
          print('CROTA_DECAL_TEXTURES_CLOSED',m['visible_material_count'],'materials',m['unique_texture_tags'],'textures',m['png_outputs'],'png')
          PY

      - name: Package authoritative decal render resources
        run: |
          set -euo pipefail
          mkdir -p out/textures out/reports
          cp reports/crota_map_decal_census.json out/reports/
          cp reports/decal_material_selector.json out/reports/
          cp reports/decal_material_package_recovery.json out/reports/
          cp reports/crota_decal_texture_dependency_closure.json out/reports/
          cp reports/crota_decal_texture_roles.json out/reports/
          cp textures/material_texture_manifest.json out/reports/
          cp -a textures/textures/. out/textures/
          sha256sum out/reports/* out/textures/* > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-MAP-DECAL-TEXTURES-V1
          path: out/
          retention-days: 30
          if-no-files-found: error
