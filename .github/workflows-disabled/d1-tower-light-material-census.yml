name: D1 Tower light material census

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['D1 Tower original lighting and sky census']
    types: [completed]
  push:
    paths:
      - '.github/workflows/d1-tower-light-material-census.yml'
      - 'tools/d1_world_light_material_manifest.py'

permissions:
  contents: read
  actions: read

jobs:
  materials:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover authoritative lighting semantic artifact
        run: |
          set -euo pipefail
          mkdir -p upstream index packages runtime reports
          if [ "${{ github.event_name }}" = workflow_run ]; then
            run_id='${{ github.event.workflow_run.id }}'
          else
            run_id="$(gh run list --workflow d1-tower-original-lighting-census.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id"
          gh run download "$run_id" -n d1-tower-original-lighting-census -D upstream
          test -f upstream/tower_map_light_semantic_probe.json
          cp upstream/tower_map_light_semantic_probe.json reports/tower_map_light_semantic_probe.json
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_map_light_semantic_probe.json'))
          assert d['status']=='D1_WORLD_MAP_LIGHT_SEMANTIC_PROBE_COMPLETE',d.get('violations')
          r=d['record_plus_0x80_candidate_reference']
          assert r['total_occurrences']==737 and r['resolved_occurrences']==737,r
          assert r['reference_class_histogram']=={'80801AD7':737},r
          assert r['package_id_histogram']=={'024c':685,'0250':52},r
          print('PROVEN_LIGHT_MATERIAL_REFS',r)
          PY

      - name: Recover current global package index and exact Oodle runtime
        run: |
          set -euo pipefail
          idx_run="$(gh run list --workflow d1-global-activity-index.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$idx_run"
          gh run download "$idx_run" -n d1-global-activity-index -D index
          cp "$(find index -name D1_CURRENT_ACTIVITY_INDEX.json -print -quit)" reports/D1_CURRENT_ACTIVITY_INDEX.json
          cp "$(find index -name packages.txt -print -quit)" reports/packages.txt
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict

      - name: Recover only proven light-material package families
        run: |
          set -euo pipefail
          python tools/d1_recover_indexed_package_families.py \
            --index reports/D1_CURRENT_ACTIVITY_INDEX.json \
            --package-list reports/packages.txt \
            --package-id 024c --package-id 0250 \
            --out-dir packages \
            --report reports/light_material_family_recovery.json

      - name: Decode all 497 source-proven D1 light materials
        run: |
          set -euo pipefail
          mapfile -t files < <(find packages -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_light_material_manifest.py "${args[@]}" \
            --runtime runtime \
            --semantic-probe reports/tower_map_light_semantic_probe.json \
            --out reports/tower_light_material_manifest.json
          python - <<'PY'
          import json
          d=json.load(open('reports/tower_light_material_manifest.json'))
          assert d['status']=='D1_WORLD_LIGHT_MATERIAL_MANIFEST_COMPLETE',d['error_materials']
          assert d['light_instance_count']==737,d
          assert d['unique_light_material_count']==497,d
          assert d['material_decode_errors']==0,d
          assert sum(d['pixel_shader_frequency'].values())==737,d
          print('LIGHT_MATERIAL_COUNTS',json.dumps({k:d[k] for k in ('light_instance_count','unique_light_material_count','pixel_shader_count','vertex_shader_count','unique_constant_container_count')},indent=2))
          print('TOP_PIXEL_SHADERS',json.dumps(list(d['pixel_shader_frequency'].items())[:50],indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-light-material-census
          path: reports/
          retention-days: 14
          compression-level: 6
