name: D1 Tower three-NPC exact material local state direct

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d1-tower-three-npc-material-local-state-direct.yml'
      - 'tools/d1_material_stage_state_resolve.py'
      - 'tools/d1_material_decode.py'
      - 'tools/d1_ps4_sampler_probe.py'
      - 'tools/d1_tfx_program_inventory.py'
      - 'tools/d1_world_material_constant_export.py'

permissions: {contents: read, actions: read}

env:
  AUDIT_ARTIFACT_ID: '10068794522'
  AUDIT_ARTIFACT_SHA256: '90812780872801f05055650a3a070a786c2a67e9489f38ee8fb3849cd6d6ce8b'
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  state-direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      LINOODLE_SKIP_DLLMAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}

      - name: Recover pinned audit, catalog, runtime and package index
        run: |
          set -euo pipefail
          mkdir -p input/audit input/catalog runtime reports corpus_material corpus_deps corpus_payload out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUDIT_ARTIFACT_ID}/zip" -o input/audit.zip
          echo "${AUDIT_ARTIFACT_SHA256}  input/audit.zip" | sha256sum --check --strict
          unzip -q input/audit.zip -d input/audit
          test -f input/audit/THREE_NPC_MATERIAL_CORRECTNESS_AUDIT.json

          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict

          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 4 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt

      - name: Derive exact 85 target materials and source package families
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('input/audit/THREE_NPC_MATERIAL_CORRECTNESS_AUDIT.json'))
          assert d['status']=='D1_TOWER_THREE_NPC_MATERIAL_CORRECTNESS_AUDIT_COMPLETE' and not d['violations'],d
          target=sorted({m['material'].upper() for a in d['actors'] for m in a['materials']})
          assert len(target)==85,target
          def pid(h):
              v=int(h,16); assert v>=0x80800000,h
              return f'{((v-0x80800000)>>13)&0x7ff:04x}'
          ids=sorted({pid(h) for h in target})
          Path('reports/material_tags.txt').write_text('\n'.join(target)+'\n')
          Path('reports/material_package_ids.txt').write_text('\n'.join(ids)+'\n')
          print('DIRECT_MATERIAL_SEED',len(target),ids)
          PY

      - name: Recover only material-owning package families
        run: |
          set -euo pipefail
          args=(); while read -r p; do args+=(--required-package-id "$p"); done < reports/material_package_ids.txt
          python tools/d1_tower_recover_articulated_visual_corpus.py \
            --package-list reports/packages.txt "${args[@]}" \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --out-dir corpus_material --report reports/material_corpus.json

      - name: Parse target materials and derive exact external dependency tags
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import d1_tower_map_schema_validate_v5 as v5
          from d1_material_decode import parse_material
          NULL={'00000000','FFFFFFFF'}
          def norm(x):return str(x).upper().removeprefix('0X').zfill(8)
          def pid(h):
              v=int(h,16); assert v>=0x80800000,h
              return f'{((v-0x80800000)>>13)&0x7ff:04x}'
          snaps=sorted(Path('corpus_material').glob('*.pkg'))
          c=v5.v3.base.Corpus([p.resolve() for p in snaps],Path('runtime').resolve())
          target=[x.strip() for x in open('reports/material_tags.txt') if x.strip()]
          const=set(); samp=set(); rows={}; viol=[]
          for h in target:
              meta=c.entry_meta(h); b,src=c.payload(h)
              if meta is None or b is None:
                  viol.append(f'{h}:material payload unavailable'); continue
              p=parse_material(b,'PS4')
              if norm(p['pixel_shader'])=='FFFFFFFF' or norm(p['vertex_shader'])=='FFFFFFFF':
                  viol.append(f'{h}:null shader'); continue
              for stage in ('vs','ps'):
                  ch=norm(p[f'{stage}_vector4_container'])
                  if ch not in NULL: const.add(ch)
                  for rec in p[f'{stage}_samplers']['items']:
                      sh=norm(rec.get('first_dword_hex','FFFFFFFF'))
                      if sh not in NULL:samp.add(sh)
              rows[h]={'source':src,'vs':norm(p['vertex_shader']),'ps':norm(p['pixel_shader']),
                       'vs_container':norm(p['vs_vector4_container']),'ps_container':norm(p['ps_vector4_container'])}
          if viol: raise SystemExit(repr(viol))
          deps=sorted(const|samp)
          ids=sorted({pid(h) for h in deps})
          Path('reports/constant_container_tags.txt').write_text('\n'.join(sorted(const))+('\n' if const else ''))
          Path('reports/sampler_tags.txt').write_text('\n'.join(sorted(samp))+('\n' if samp else ''))
          Path('reports/dependency_package_ids.txt').write_text('\n'.join(ids)+('\n' if ids else ''))
          Path('reports/material_dependency_parse.json').write_text(json.dumps({
              'status':'D1_TOWER_THREE_NPC_MATERIAL_DEPENDENCIES_PARSED_EXACT',
              'material_count':len(rows),'constant_container_count':len(const),'sampler_count':len(samp),
              'dependency_package_ids':ids,'materials':rows
          },indent=2)+'\n')
          print('DIRECT_DEPS','materials',len(rows),'containers',len(const),'samplers',len(samp),'package_ids',ids)
          PY

      - name: Recover exact container and sampler package families
        run: |
          set -euo pipefail
          if [ -s reports/dependency_package_ids.txt ]; then
            args=(); while read -r p; do args+=(--required-package-id "$p"); done < reports/dependency_package_ids.txt
            python tools/d1_tower_recover_articulated_visual_corpus.py \
              --package-list reports/packages.txt "${args[@]}" \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --out-dir corpus_deps --report reports/dependency_corpus.json
          else
            printf '%s\n' '{"status":"NO_EXTERNAL_DEPENDENCY_FAMILIES"}' > reports/dependency_corpus.json
          fi

      - name: Resolve exact Vector4Container payload package families
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import d1_tower_map_schema_validate_v5 as v5
          NULL={'00000000','FFFFFFFF'}
          def norm(x):return str(x).upper().removeprefix('0X').zfill(8)
          def pid(h):
              v=int(h,16); assert v>=0x80800000,h
              return f'{((v-0x80800000)>>13)&0x7ff:04x}'
          snaps=sorted(list(Path('corpus_material').glob('*.pkg'))+list(Path('corpus_deps').glob('*.pkg')))
          c=v5.v3.base.Corpus([p.resolve() for p in snaps],Path('runtime').resolve())
          tags=[x.strip() for x in open('reports/constant_container_tags.txt') if x.strip()]
          refs=[]; viol=[]
          for h in tags:
              m=c.entry_meta(h)
              if m is None:
                  viol.append(f'{h}:metadata unavailable'); continue
              ref=norm(m.get('reference','FFFFFFFF'))
              if ref in NULL:
                  viol.append(f'{h}:null payload reference'); continue
              refs.append({'container':h,'payload':ref,'payload_package_id':pid(ref)})
          if viol: raise SystemExit(repr(viol))
          have={x.strip() for x in open('reports/material_package_ids.txt') if x.strip()}|{x.strip() for x in open('reports/dependency_package_ids.txt') if x.strip()}
          ids=sorted({r['payload_package_id'] for r in refs}-have)
          Path('reports/payload_package_ids.txt').write_text('\n'.join(ids)+('\n' if ids else ''))
          Path('reports/constant_payload_refs.json').write_text(json.dumps({'status':'D1_TOWER_THREE_NPC_CONSTANT_PAYLOAD_REFS_EXACT','rows':refs,'extra_package_ids':ids},indent=2)+'\n')
          print('DIRECT_PAYLOAD_REFS',len(refs),'extra',ids)
          PY

      - name: Recover any extra Vector4Container payload families
        run: |
          set -euo pipefail
          if [ -s reports/payload_package_ids.txt ]; then
            args=(); while read -r p; do args+=(--required-package-id "$p"); done < reports/payload_package_ids.txt
            python tools/d1_tower_recover_articulated_visual_corpus.py \
              --package-list reports/packages.txt "${args[@]}" \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --out-dir corpus_payload --report reports/payload_corpus.json
          else
            printf '%s\n' '{"status":"NO_EXTRA_VECTOR4_PAYLOAD_FAMILIES"}' > reports/payload_corpus.json
          fi

      - name: Resolve all 85 exact local material states
        run: |
          set -euo pipefail
          mapfile -t files < <(find corpus_material corpus_deps corpus_payload -maxdepth 1 -name '*.pkg' -type f | sort -u)
          snaps=(); for f in "${files[@]}"; do snaps+=(--snapshot "$f"); done
          mapfile -t mats < reports/material_tags.txt
          margs=(); for m in "${mats[@]}"; do margs+=(--material "$m"); done
          python tools/d1_material_stage_state_resolve.py \
            "${snaps[@]}" --runtime runtime "${margs[@]}" \
            --out out/THREE_NPC_MATERIAL_STAGE_STATE.json
          python - <<'PY'
          import json
          d=json.load(open('out/THREE_NPC_MATERIAL_STAGE_STATE.json'))
          assert d['status']=='D1_MATERIAL_STAGE_STATE_EXACT',d
          assert d['selected_material_count']==85 and d['resolved_material_count']==85,d
          assert not d['violations'],d['violations']
          print('DIRECT_STATE_GREEN','materials',85,'VS',d['unique_vertex_shader_count'],'PS',d['unique_pixel_shader_count'],
                'TFX',d['unique_tfx_program_count_by_stage_sha'],'containers',d['unique_external_vector4_container_count'],
                'samplers',d['unique_native_sampler_count'])
          PY
          cp reports/material_dependency_parse.json out/
          cp reports/constant_payload_refs.json out/
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: D1-TOWER-3-NPC-EXACT-MATERIAL-LOCAL-STATE-DIRECT
          path: out/
          retention-days: 90
          if-no-files-found: error
          compression-level: 9
