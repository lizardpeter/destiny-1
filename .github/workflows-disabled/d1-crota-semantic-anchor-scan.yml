name: D1 Crota semantic anchor scan

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-semantic-anchor-scan.yml'
      - 'tools/d1_remote_stringhash_preimage_scan.py'
      - 'tools/d1_remote_catalog_backlinks.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out/backlinks
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Scan exact semantic StringHash preimages in raid Hive and global families
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python tools/d1_remote_stringhash_preimage_scan.py \
            --package-id 0x0447 --package-id 0x044B --package-id 0x0450 --package-id 0x0458 \
            --package-id 0x0075 --package-id 0x0077 --package-id 0x075D \
            --package-id 0x0151 --package-id 0x0154 --package-id 0x0155 --package-id 0x0156 \
            --package-id 0x0157 --package-id 0x0158 --package-id 0x0169 --package-id 0x018D \
            --package-id 0x01E3 --package-id 0x072B --package-id 0x072F --package-id 0x0735 \
            --target 0x2F28D739 --target 0x1FD437C8 --target 0xECBF97D6 --target 0xE0265F7C \
            --target 0x2EA84559 --target 0x2CF43F68 --target 0xACC65F88 \
            --target 0x7B1F58EE --target 0x6C64AE47 --target 0xE8EDA4A9 --target 0x17842842 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --max-entry-size 8000000 \
            -o out/CROTA_SEMANTIC_ANCHOR_PREIMAGES.json | tee out/preimages_stdout.txt
      - name: Scan aligned literal semantic hashes in same families
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          : > out/backlinks_stdout.txt
          for PKG in 0x0447 0x044B 0x0450 0x0458 0x0075 0x0077 0x075D 0x0151 0x0154 0x0155 0x0156 0x0157 0x0158 0x0169 0x018D 0x01E3 0x072B 0x072F 0x0735; do
            NAME=$(printf '%04X' $((PKG)))
            python tools/d1_remote_catalog_backlinks.py \
              --scan-package-id "$PKG" \
              --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
              --target 0x2F28D739 --target 0x1FD437C8 --target 0xECBF97D6 --target 0xE0265F7C \
              --target 0x2EA84559 --target 0x2CF43F68 --target 0xACC65F88 \
              --target 0x7B1F58EE --target 0x6C64AE47 --target 0xE8EDA4A9 --target 0x17842842 \
              --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
              --runtime runtime --max-entry-size 8000000 \
              -o "out/backlinks/${NAME}.json" | tee -a out/backlinks_stdout.txt
          done
      - name: Summarize semantic anchor hits
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,glob,collections
          names={
            '2F28D739':'HiveUltraKnightA','1FD437C8':'R1S2RaidMoon0Ultra0','ECBF97D6':'RaidMoon0',
            'E0265F7C':'OversoulThrone','2EA84559':'Crota, Son of Oryx','2CF43F68':'Crota',
            'ACC65F88':'crota','7B1F58EE':'UltraKnight','6C64AE47':'ultra_knight',
            'E8EDA4A9':'Cleaver','17842842':'Shredder',
          }
          p=json.load(open('out/CROTA_SEMANTIC_ANCHOR_PREIMAGES.json'))
          assert not p['errors'],p['errors']
          print('PREIMAGE_HIT_COUNTS',p['hit_counts'])
          for x in p['hits']:
              print('PREIMAGE',x['string_hash'],names.get(x['string_hash']),repr(x['preimage']),'SOURCE',x['package_id'],x['source_tag_hash'],x['source_reference'],hex(x['byte_offset']))
          occ=collections.Counter(); source_classes=collections.Counter(); source_rows=[]
          for path in sorted(glob.glob('out/backlinks/*.json')):
              b=json.load(open(path)); assert b['error_count']==0,(path,b['errors'])
              occ.update(b['occurrences_by_target']); source_classes.update(b['hit_sources_by_reference'])
              for h in b['hits']:
                  source_rows.append({'package_id':b['package_id'],'source_tag_hash':h['source_tag_hash'],'reference':h['reference'],'targets':h['targets']})
          print('LITERAL_OCCURRENCES',dict(occ))
          print('LITERAL_SOURCE_CLASSES',dict(source_classes))
          for r in source_rows: print('LITERAL_SOURCE',r)
          out={'schema':'d1_crota_semantic_anchor_scan/v1','names':names,'preimage_hit_counts':p['hit_counts'],'literal_occurrences':dict(occ),'literal_source_classes':dict(source_classes),'literal_sources':source_rows,'policy':'All target hashes are exact D1 FNV1-32 values of the named semantic target strings. Preimages require exact retail printable equality; literal hits are aligned serialized dword occurrences and are not typed without a source schema.'}
          open('out/CROTA_SEMANTIC_ANCHOR_SUMMARY.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
          find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-SEMANTIC-ANCHOR-SCAN
          path: out/
          retention-days: 30
          if-no-files-found: error
