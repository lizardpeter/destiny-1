name: Temporary decode rocket launcher action graph and viewmodel rigs

on:
  push:
    paths:
      - '.github/workflows/tmp-gjallarhorn-rocket-launcher-action-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies runtime and 0151
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy scipy pygltflib pyglm
          mkdir -p runtime recovered reports out
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          base='https://crypt.cohae.dev/destiny/ps4/packages/latest'
          python tools/d1_split_tar_extract.py --base-url "$base" --part-count 10 --start-offset 0x45190B000 \
            --target ps4_globals_0151_0.pkg --target ps4_globals_0151_1.pkg --target ps4_globals_0151_2.pkg \
            --target ps4_globals_0151_3.pkg --target ps4_globals_0151_4.pkg --target ps4_globals_0151_5.pkg --target ps4_globals_0151_6.pkg \
            --out recovered --manifest reports/0151_extract.json --retries 6 --timeout 90
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git tiger-animation-parser
          git -C tiger-animation-parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
      - name: Decode action graph skeletons rigs states and clips
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python - <<'PY'
          import io,json,struct,sys,tempfile,hashlib
          from collections import Counter,defaultdict
          from pathlib import Path
          sys.path.insert(0,'tools')
          sys.path.insert(0,str(Path('tiger-animation-parser').resolve()))
          from d1_entry_extract import EntryReader
          from d1_entity_resource_probe import parse_resource
          from tag.game_version import Game_Version
          from tag_readers.read_skeleton import read_skeleton
          from tag_readers.read_rig import read_runtime_rig
          from tag_readers.read_animation import read_animation
          from animation_decoding.decode_animation import decode_animation
          from runtime_rig.rig_retarget import rig_retarget
          from animation_export.convert_animation_object_to_local import convert_obj_to_local

          CONTROL='80AA3CC9'; ROCKET_CFG='80AA3CD1'; roi=Game_Version.D1_ROI
          CONTROL_CLASS='80802C0E'; CLIP_CLASS='808005A1'; WRAPPER_CLASS='8080222A'; RESOURCE_CLASS='80800861'
          r=EntryReader(Path('recovered/ps4_globals_0151_6.pkg'),Path('runtime'))
          by={e['tag_hash'].upper():e for e in r.entries}
          def raw(tag): return r.entry(by[tag]['index'])
          def brief(e): return {'index':e['index'],'tag_hash':e['tag_hash'].upper(),'reference':e['reference'].upper(),'size':e['file_size']}
          def fnv1(s):
              h=0x811c9dc5
              for c in s.lower().encode('utf-8'):
                  h=(h*0x01000193)&0xffffffff; h^=c
              return h
          # Deliberately broad dictionary. Matches are evidence only when the hash is literally present.
          stems=['fire','recoil','reload','idle','ready','equip','stow','sprint','zoom','aim','ads','melee','inspect','lower','raise','charge','release','shoot','firing','trigger','walk','run','jump','land','base']
          names=set(stems)
          for s in stems:
              for i in range(1,9): names|={f'{s}_{i}',f'{s}{i}'}
          names |= {'primary_fire','secondary_fire','fire_primary','fire_secondary','hip_fire','aim_fire','fire_hip','fire_ads','ads_fire','zoom_fire',
                    'rocket_launcher','first_person','weapon','reload_empty','reload_full','reload_1','reload_2','reload_3','fire_1','fire_2','fire_3'}
          sem={fnv1(s):s for s in sorted(names)}
          assert fnv1('rocket_launcher')==0xC9EB0270 and fnv1('reload_1')==0xEB22859A and fnv1('fire')==0x9FAC79C9

          # Control's exact clip refs.
          cb=raw(CONTROL); cliprefs=[]
          for off in range(0,len(cb)-(len(cb)%4),4):
              h=f'{struct.unpack_from("<I",cb,off)[0]:08X}'; e=by.get(h)
              if e and e['reference'].upper()==CLIP_CLASS:
                  cliprefs.append({'offset':off,'tag_hash':h,'entry':brief(e)})
          clip_tags=[x['tag_hash'] for x in cliprefs]

          # Parse all direct clips, preserving complete header signature distribution.
          clips=[]
          for tag in clip_tags:
              b=raw(tag)
              try:
                  with tempfile.NamedTemporaryFile() as f:
                      f.write(b);f.flush();f.seek(0);a=read_animation(f,roi)
                  h=a.animation_header
                  clips.append({'tag_hash':tag,'index':by[tag]['index'],'bytes':len(b),'frame_count':int(h.frame_count),
                                'duration_s':max(0,int(h.frame_count)-1)/30.0,'node_count':int(h.node_count),'rig_control_count':int(h.rig_control_count)})
              except Exception as ex:
                  clips.append({'tag_hash':tag,'index':by[tag]['index'],'bytes':len(b),'error':repr(ex)})
          signatures=Counter((x.get('node_count'),x.get('rig_control_count')) for x in clips if 'node_count' in x)

          # Nearby entity resources are prime skeleton/rig owners. Parse nested classes and attempt both readers conservatively.
          ci=by[CONTROL]['index']; resources=[]
          for i in range(max(0,ci-80),min(len(r.entries),ci+80)):
              e=r.entries[i]
              if e['reference'].upper()!=RESOURCE_CLASS or not r.available(i): continue
              q={'relative_index':i-ci,'entry':brief(e)}
              try:
                  b=r.entry(i); q['sha256']=hashlib.sha256(b).hexdigest(); q['parsed_resource']=parse_resource(b,'PS4')
              except Exception as ex:q['parse_resource_error']=repr(ex)
              try:
                  sk=read_skeleton(io.BytesIO(b),roi)
                  lens=[]
                  for n in ('nodes','bone_nodes','parent_node_indices','node_hashes'):
                      v=getattr(sk,n,None)
                      if v is not None:
                          try:lens.append((n,len(v)))
                          except:pass
                  q['skeleton_parse_ok']=True;q['skeleton_lengths']=lens
                  # Search common object fields recursively for Pedestal hash without inventing semantic field layout.
                  q['skeleton_repr_contains_pedestal']='C410084A' in repr(vars(sk)).upper()
              except Exception as ex:q['skeleton_parse_ok']=False;q['skeleton_error']=repr(ex)
              try:
                  rig=read_runtime_rig(io.BytesIO(b),roi)
                  lens=[]
                  for n in ('controls','control_nodes','nodes','bone_indices','control_name_to_bone_index','controls_relations','controls_transforms'):
                      v=getattr(rig,n,None)
                      if v is not None:
                          try:lens.append((n,len(v)))
                          except:pass
                  q['rig_parse_ok']=True;q['rig_lengths']=lens
              except Exception as ex:q['rig_parse_ok']=False;q['rig_error']=repr(ex)
              resources.append(q)

          # Literal semantic-state hashes in the whole local action cluster and exact rocket-launcher references.
          focus_lo=max(0,ci-120);focus_hi=min(len(r.entries),ci+180)
          state_hits=[]; resolved_links=[]
          rocket_hash=fnv1('rocket_launcher')
          for i in range(focus_lo,focus_hi):
              e=r.entries[i]
              if e['type']!=16 or not r.available(i):continue
              try:b=r.entry(i)
              except:continue
              sh=[]; links=[]
              for off in range(0,len(b)-(len(b)%4),4):
                  v=struct.unpack_from('<I',b,off)[0]
                  if v in sem:sh.append({'offset':off,'hash':f'{v:08X}','name':sem[v]})
                  h=f'{v:08X}'; x=by.get(h)
                  if x and x['reference'].upper() in {CONTROL_CLASS,CLIP_CLASS,WRAPPER_CLASS,RESOURCE_CLASS}:
                      links.append({'offset':off,'tag_hash':h,'reference':x['reference'].upper(),'index':x['index']})
              if sh:state_hits.append({'entry':brief(e),'relative_index':i-ci,'state_hits':sh})
              if links and (abs(i-ci)<=20 or sh or i==by[ROCKET_CFG]['index']):resolved_links.append({'entry':brief(e),'relative_index':i-ci,'links':links})

          # Explicitly inspect 80AA3CD1 and all three nearby wrappers in detail.
          detailed=[]
          for tag in [ROCKET_CFG,'80AA3CC4','80AA3CC7','80AA3CCB','80AA3CC2','80AA3CC5',CONTROL]:
              e=by.get(tag)
              if not e:continue
              b=raw(tag); d={'entry':brief(e),'sha256':hashlib.sha256(b).hexdigest(),'dwords':[]}
              for off in range(0,len(b)-(len(b)%4),4):
                  v=struct.unpack_from('<I',b,off)[0]; row={'offset':off,'value':f'{v:08X}'}
                  if v in sem:row['semantic_name']=sem[v]
                  x=by.get(f'{v:08X}')
                  if x:row['resolves_to']=brief(x)
                  if v==rocket_hash:row['semantic_name']='rocket_launcher'
                  if len(row)>2:d['dwords'].append(row)
              detailed.append(d)

          # Pair every skeleton-looking and rig-looking nearby resource against each observed clip signature by actual retarget success.
          sk_tags=[q['entry']['tag_hash'] for q in resources if q.get('skeleton_parse_ok')]
          rig_tags=[q['entry']['tag_hash'] for q in resources if q.get('rig_parse_ok')]
          pair_tests=[]
          # Limit representative clips per signature to keep CI bounded.
          reps={}
          for c in clips:
              if 'node_count' in c:reps.setdefault((c['node_count'],c['rig_control_count']),c['tag_hash'])
          for st in sk_tags:
              try:sk=read_skeleton(io.BytesIO(raw(st)),roi)
              except:continue
              for rt in rig_tags:
                  try:rig=read_runtime_rig(io.BytesIO(raw(rt)),roi)
                  except:continue
                  successes=[]
                  for sig,ct in reps.items():
                      try:
                          with tempfile.NamedTemporaryFile() as f:
                              f.write(raw(ct));f.flush();f.seek(0);a=read_animation(f,roi)
                          dec=decode_animation(a);ret=rig_retarget(a,dec,sk,rig);loc=convert_obj_to_local(a,ret,sk)
                          successes.append({'signature':list(sig),'clip':ct,'decoded_tracks':len(dec),'retargeted_tracks':len(ret),'local_tracks':len(loc)})
                      except Exception:pass
                  if successes:pair_tests.append({'skeleton':st,'rig':rt,'successes':successes})

          out={'control':brief(by[CONTROL]),'rocket_config':brief(by[ROCKET_CFG]),'direct_clip_count':len(cliprefs),'clip_refs':cliprefs,'clips':clips,
               'signature_counts':[{ 'node_count':k[0], 'rig_control_count':k[1], 'count':v } for k,v in signatures.most_common()],
               'nearby_resources':resources,'semantic_hash_catalog':{s:f'{fnv1(s):08X}' for s in sorted(names)},
               'semantic_state_hits':state_hits,'resolved_cluster_links':resolved_links,'detailed_entries':detailed,
               'skeleton_candidates':sk_tags,'rig_candidates':rig_tags,'skeleton_rig_pair_tests':pair_tests,
               'evidence_policy':'Literal FNV1 state hashes and FileHash links are binary evidence. Retarget success establishes structural compatibility only unless ownership is also linked.'}
          Path('reports/gjallarhorn_rocket_launcher_action_graph.json').write_text(json.dumps(out,indent=2)+'\n')
          print('CONTROL',json.dumps(out['control']))
          print('DIRECT_CLIPS',len(cliprefs))
          print('SIGNATURES',json.dumps(out['signature_counts'],separators=(',',':')))
          print('STATE_HITS',json.dumps(state_hits,separators=(',',':')))
          print('SKELETON_CANDIDATES',sk_tags)
          print('RIG_CANDIDATES',rig_tags)
          print('PAIR_TESTS',json.dumps(pair_tests,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-gjallarhorn-rocket-launcher-action-graph
          path: reports/
          retention-days: 7
          if-no-files-found: error
