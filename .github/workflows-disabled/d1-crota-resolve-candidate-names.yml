name: D1 Crota exact candidate name resolution

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-crota-resolve-candidate-names.yml'
      - 'tools/d1_remote_entity_names_resolve.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  CROTA_0447_ARTIFACT_ID: '9995829343'
  CROTA_044B_ARTIFACT_ID: '9995818422'

jobs:
  names:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact universal catalog and Crota candidate reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/catalog input/0447 input/044b runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CROTA_0447_ARTIFACT_ID}/zip" -o input/0447.zip
          unzip -q input/0447.zip -d input/0447
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CROTA_044B_ARTIFACT_ID}/zip" -o input/044b.zip
          unzip -q input/044b.zip -d input/044b
          test -f input/0447/CROTA_0447_CANDIDATES.json
          test -f input/044b/CROTA_044B_CANDIDATES.json
      - name: Install verified Oodle runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Resolve source-mapped Crota raid entity names through GlobalStrings
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          python -m py_compile tools/d1_remote_entity_names_resolve.py
          python tools/d1_remote_entity_names_resolve.py \
            --candidate-report input/0447/CROTA_0447_CANDIDATES.json \
            --candidate-report input/044b/CROTA_044B_CANDIDATES.json \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --global-package-id 0x0151 --global-package-id 0x0154 --global-package-id 0x0155 \
            --global-package-id 0x0156 --global-package-id 0x0157 --global-package-id 0x0158 \
            --global-package-id 0x0169 --global-package-id 0x018D --global-package-id 0x01E3 \
            --global-package-id 0x072B --global-package-id 0x072F --global-package-id 0x0735 \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime -o out/CROTA_CANDIDATE_NAMES.json | tee out/stdout.txt
      - name: Search exact Crota string result and lock hashes
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('out/CROTA_CANDIDATE_NAMES.json'))
          print('CONTAINERS',d['global_container_count'],'TARGETS',d['target_string_hashes'],'UNRESOLVED',d['unresolved_target_hashes'])
          for e in d['entities']:
              vals=[]
              for n in e['names']:
                  vals += [x['string'] for x in n.get('resolved',[]) if x.get('string') is not None]
              if vals: print(e['entity_hash'],e['models'],[(x.get('resource_hash'),x.get('node_count')) for x in e['skeletons']],vals)
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-CROTA-CANDIDATE-NAMES
          path: out/
          retention-days: 14
          if-no-files-found: error
