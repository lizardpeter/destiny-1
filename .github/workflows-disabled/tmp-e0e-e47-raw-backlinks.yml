    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover verified Oodle runtime
        run: |
          set -euo pipefail
          mkdir -p runtime reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Raw type-16 backlink scan ${{ matrix.family }}
        env:
          MEMBER_ARGS: ${{ matrix.members }}
        run: |
          set -euo pipefail
          export LINOODLE_SKIP_DLLMAIN=1
          eval python tools/d1_remote_hash_backlink_scan.py \
            --package-id '${{ matrix.package_id }}' --target 80A39E0E --target 80A39E47 \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            $MEMBER_ARGS \
            -o reports/backlinks_${{ matrix.family }}.json
          python - <<'PY'
          import json,glob
          for p in glob.glob('reports/backlinks_*.json'):
              r=json.load(open(p)); print(p,'candidates',r['candidate_count'],'hits',r['hit_entry_count'],'occ',r['hit_occurrence_count'],'errors',r['error_count'])
              for h in r['hits']: print('BACKLINK SUMMARY',h['tag_hash'],h['reference'],h['hits'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-e0e-e47-backlinks-${{ matrix.family }}
          path: reports/
          retention-days: 4
          if-no-files-found: warn
