name: D1 Tiger animation safe-offset unit regression

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tiger-animation-safe-offset-unit.yml'
      - 'tools/d1_tiger_animation_safe_offsets.py'
      - 'tests/test_tiger_animation_safe_offsets.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Reproduce and close NumPy int16 offset overflow
        run: |
          set -euo pipefail
          python -m pip install -q pytest numpy
          python -m py_compile tools/d1_tiger_animation_safe_offsets.py
          python -m pytest -q tests/test_tiger_animation_safe_offsets.py
