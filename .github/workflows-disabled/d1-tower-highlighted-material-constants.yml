name: D1 Tower highlighted material constants

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-highlighted-material-constants.yml'
      - 'tools/d1_world_material_constant_export.py'

permissions:
  contents: read

jobs:
  constants:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact current 024c family and runtime
        run: |
          set -euo pipefail
          mkdir -p runtime recovered reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from d1_split_tar_extract import SplitHttpTar
          rows=[
            ('ps4_city_tower_destination_024c_0.pkg',7542949376,137527296,'ffb2e3cbb9777956384063e3c0fc5636200df51ae82a35a6aad06850dbf1fff2'),
            ('ps4_city_tower_destination_024c_1.pkg',7680477184,12226560,'21e75033fcba2f85b5d22b7377a7122c5135ce2c3f10f8453fc54a1d304c10f8'),
            ('ps4_city_tower_destination_024c_2.pkg',7692704256,13574144,'681349e0d32c213cae4bdef839bee8a6fa5aa3a5989c4a5344ee342cbe9d6e45'),
            ('ps4_city_tower_destination_024c_3.pkg',7706278912,2134016,'c6846bbe0bdf9aaf9ba194ed8a2a3b2c7e26178bd79218134e909fa460ebcaef'),
            ('ps4_city_tower_destination_024c_4.pkg',7708413440,6987776,'12dfe5e7dc65a8477d5ceabba5bb921b07c83110151a57b86a52ba3eb7d82018'),
            ('ps4_city_tower_destination_024c_5.pkg',7715401728,1687552,'b404bacccf44a4bf6859bf3b867ae02f5dc840432bdaa081c341439c2ae83311'),
          ]
          listed={Path(x.strip()).name for x in Path('reports/packages.txt').read_text().splitlines() if x.strip()}
          cur=sorted(n for n in listed if '_024c_' in n.lower())
          exp=sorted(r[0] for r in rows)
          if cur!=exp: raise SystemExit(f'024c family mismatch current={cur} expected={exp}')
          arc=SplitHttpTar([f'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.tar.{i:03d}' for i in range(1,11)],retries=6,timeout=120)
          out=[]
          for name,off,size,sha in rows:
              got=arc.copy_to(off,size,Path('recovered')/name)
              if got.lower()!=sha: raise SystemExit(f'{name}: sha mismatch {got} != {sha}')
              out.append({'name':name,'size':size,'sha256':got})
              print('RECOVERED',name,size,got,flush=True)
          Path('reports/024c_recovery.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - name: Decode exact 80C98909 and 80C9890B vec4 containers
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          import d1_tower_map_schema_validate_v5 as v5
          from d1_world_material_constant_export import export_container
          files=sorted(Path('recovered').glob('*.pkg'))
          c=v5.v3.base.Corpus([p.resolve() for p in files],Path('runtime').resolve())
          out={h:export_container(c,h) for h in ('80C98909','80C9890B')}
          Path('reports/highlighted_material_constants.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          bad={h:r.get('error') for h,r in out.items() if r.get('error')}
          if bad: raise SystemExit('highlighted constant decode failed: '+json.dumps(bad))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d1-tower-highlighted-material-constants
          path: reports/
          retention-days: 14
          compression-level: 6
