name: D1 Wrath codec1 array7 probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-wrath-codec1-array7-probe.yml'
      - 'tools/d1_remote_codec1_array7_probe.py'

permissions:
  contents: read
  actions: read

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'
  PARSER_COMMIT: 'b9fdc3a43dd28118113275624fcc9054b75855f4'

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover catalog, parser, and Oodle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q numpy scipy pyglm
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet "$PARSER_COMMIT"
          test "$(git -C parser rev-parse HEAD)" = "$PARSER_COMMIT"
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Compare failed and successful exact-family clips
        env:
          LINOODLE_SKIP_DLLMAIN: '1'
        run: |
          set -euo pipefail
          python -m py_compile tools/d1_remote_codec1_array7_probe.py
          python tools/d1_remote_codec1_array7_probe.py \
            --clip 8179E6A6 --clip 8179E6AE --clip 8179E6B8 \
            --clip 8179E6A7 --clip 8179E6AF --clip 8179E6A2 \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 \
            --runtime runtime --parser-root parser \
            -o out/wrath_codec1_array7_probe.json | tee out/probe.txt
          python - <<'PY'
          import json
          d=json.load(open('out/wrath_codec1_array7_probe.json'))
          assert d['status']=='COMPLETE' and not d['violations'],d['violations']
          by={x['clip']:x for x in d['clips']}
          for h in ('8179E6A6','8179E6AE','8179E6B8'):
              r=by[h]
              assert r['animated']['header']['codec_type']==1,r
              print('FAILED_FIXTURE',h,'FRAMES',r['frame_count'],'STREAMS',r['animated']['header'],'BUFFERS',r['animated']['buffer_lengths'],'ZEROS',r['animated']['zero_entries'],'CORR',r['animated_zero_route_control_map_correlation'])
          for h in ('8179E6A7','8179E6AF','8179E6A2'):
              r=by[h]
              print('SUCCESS_FIXTURE',h,'FRAMES',r['frame_count'],'CODEC',r['animated']['header']['codec_type'],'ZEROS',r['animated'].get('zero_entries'),'BUFFERS',r['animated'].get('buffer_lengths'))
          PY
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-WRATH-CODEC1-ARRAY7-PROBE
          path: out/
          retention-days: 30
          if-no-files-found: error
