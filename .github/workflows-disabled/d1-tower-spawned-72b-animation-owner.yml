name: D1 Tower spawned 72-bone actor animation owner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-spawned-72b-animation-owner.yml'
      - 'tools/d1_tower_unrigged_animation_owner_discovery.py'
      - 'tools/d1_tower_recover_current_corpus.py'
      - 'tools/d1_tower_recover_activity_root_corpus.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install exact runtime, parser, and recover Tower corpus
        run: |
          set -euo pipefail
          python -m pip install -q numpy scipy pygltflib pyglm
          mkdir -p runtime recovered roots reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          git clone --quiet https://github.com/SolUnshadowed/tiger-animation-parser.git parser
          git -C parser checkout --quiet b9fdc3a43dd28118113275624fcc9054b75855f4
          test "$(git -C parser rev-parse HEAD)" = b9fdc3a43dd28118113275624fcc9054b75855f4
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py --package-list reports/packages.txt --out-dir recovered --report reports/current_corpus.json
          python tools/d1_tower_recover_activity_root_corpus.py --package-list reports/packages.txt --out-dir roots --report reports/root_corpus.json
      - name: Discover literal animation-control edges on Ikora and Zavala SEntities
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered roots -maxdepth 1 -name '*.pkg' -type f | sort -u)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          set +e
          python tools/d1_tower_unrigged_animation_owner_discovery.py "${args[@]}" --runtime runtime --parser-root parser \
            --family IKORA_A:80C7A5AD:80AD27B2 \
            --family IKORA_B:80C7ACC5:80AD27B2 \
            --family ZAVALA_A:80C7ACCD:80AD27B2 \
            --family ZAVALA_B:80C883C8:80AD27B2 \
            --family IKORA_C:80C883CA:80AD27B2 \
            -o reports/TOWER_SPAWNED_72B_ANIMATION_OWNER.json | tee reports/TOWER_SPAWNED_72B_ANIMATION_OWNER_stdout.txt
          rc=${PIPESTATUS[0]}; set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json
          d=json.load(open('reports/TOWER_SPAWNED_72B_ANIMATION_OWNER.json'))
          for f in d['families']:
              print('\n',f['family'],f['sentity'],'nodes',f.get('skeleton_node_count'),'resources',len(f.get('resource_hashes',[])))
              for e in f.get('animation_control_edges',[]): print('EDGE',e)
              for h,c in f.get('controls',{}).items():
                  print('CONTROL',h,'SELECTED',c.get('unique_selected_clips'))
                  for x in c.get('selected_clips',[]): print('CLIP',x)
          print('VIOLATIONS',d['violations'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: D1-TOWER-SPAWNED-72B-ANIMATION-OWNER
          path: reports/
          retention-days: 30
