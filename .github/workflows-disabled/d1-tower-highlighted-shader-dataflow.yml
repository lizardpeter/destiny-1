name: D1 Tower highlighted architecture shader dataflow

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-tower-highlighted-shader-dataflow.yml'

permissions:
  contents: read
  actions: read

jobs:
  shaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Dependencies and verified Oodle runtime
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p runtime recovered prior shader disasm reports
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
          gh run download 33987189885 -n d1-tower-ten-cell-corrected-textured-reports -D prior
          test -f prior/reports/material_texture_manifest_ten_cell.json
      - name: Recover exact current Tower corpus
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://crypt.cohae.dev/destiny/ps4/packages/latest/packages.txt' -o reports/packages.txt
          python tools/d1_tower_recover_current_corpus.py --package-list reports/packages.txt --out-dir recovered --report reports/current_corpus.json
      - name: Extract exact highlighted pixel shaders
        env: {LINOODLE_SKIP_DLLMAIN: '1'}
        run: |
          set -euo pipefail
          mapfile -t files < <(find recovered -maxdepth 1 -name '*.pkg' -type f | sort)
          args=(); for f in "${files[@]}"; do args+=(--snapshot "$f"); done
          python tools/d1_world_shader_extract.py "${args[@]}" --runtime runtime \
            --manifest prior/reports/material_texture_manifest_ten_cell.json \
            --shader 80C98908 --shader 80C9890A --out-dir shader --report reports/highlighted_shader_extract.json
      - name: Build pinned CLRX disassembler
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/CLRX/CLRX-mirror.git clrx
          git -C clrx checkout --quiet fb8fbf972e19ea1fb1f7a9c8d84fdef1bf7cc3df
          cmake -S clrx -B clrx/build -DCMAKE_BUILD_TYPE=Release -DNO_CLWRAPPER=ON -DBUILD_TESTS=OFF -DBUILD_SAMPLES=OFF -DBUILD_DOCUMENTATION=OFF
          cmake --build clrx/build --target clrxdisasm -j2
      - name: Disassemble and map native image resource usage
        run: |
          set -euo pipefail
          exe="$(find clrx/build -type f -name clrxdisasm -perm -111 | head -1)"
          for f in shader/PS_*_gcn.bin; do
            b="$(basename "$f" _gcn.bin)"
            "$exe" --raw --gpuType=GFX700 --hexcode "$f" > "disasm/${b}.s"
            grep -q 's_endpgm' "disasm/${b}.s"
          done
          python tools/d1_gcn_image_usage_analyze.py --extract-report reports/highlighted_shader_extract.json --disasm-dir disasm --out reports/highlighted_gcn_image_usage.json | tee reports/highlighted_gcn_image_usage_stdout.txt
      - name: Build focused material/shader packet
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.load(open('prior/reports/material_texture_manifest_ten_cell.json'))
          u=json.load(open('reports/highlighted_gcn_image_usage.json'))
          out={'materials':{},'image_usage':u}
          for h in ['80C988A8','80C988A9']:
              out['materials'][h]=m['materials'][h]
          Path('reports/highlighted_material_shader_packet.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d1-tower-highlighted-architecture-shader-dataflow
          path: |
            reports/
            shader/
            disasm/
          retention-days: 14
          compression-level: 6
