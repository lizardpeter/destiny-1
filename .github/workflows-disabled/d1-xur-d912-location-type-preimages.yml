name: D1 Xur D912 location type preimages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d1-xur-d912-location-type-preimages.yml'
      - 'tools/d1_remote_stringhash_preimage_scan.py'

permissions: {contents: read, actions: read}

env:
  UNIVERSAL_CATALOG_ARTIFACT_ID: '9994811238'
  UNIVERSAL_CATALOG_ZIP_SHA256: '404a6b4cdc34c7d305eb7b120df3b6f7d3f1121600631c2b3dbc66efd29d144a'
  UNIVERSAL_CATALOG_JSON_SHA256: '58255411fd53a8c64eb6f55e0da76a103d494ea3606096b2d995a5b5f35eca72'

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env: {GH_TOKEN: '${{ github.token }}', LINOODLE_SKIP_DLLMAIN: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Recover exact catalog and runtime
        run: |
          set -euo pipefail
          mkdir -p input/catalog runtime out
          curl -fsSL --retry 4 -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNIVERSAL_CATALOG_ARTIFACT_ID}/zip" -o input/catalog.zip
          echo "${UNIVERSAL_CATALOG_ZIP_SHA256}  input/catalog.zip" | sha256sum --check --strict
          unzip -q input/catalog.zip -d input/catalog
          echo "${UNIVERSAL_CATALOG_JSON_SHA256}  input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/Crauzer/OodleSharp/master/OodleSharp/oo2core_3_win64.dll' -o runtime/oo2core_3_win64.dll
          echo '682c0aad216fae443e0f9561876cfabfddaeffcd48e5990613ad2cf47c49fa62  runtime/oo2core_3_win64.dll' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/v4nguard/tiger-pkg/657f41c0851001b2d371592b2f7a5cb9c686ddb4/liblinoodle3.so' -o runtime/liblinoodle3.so
          echo '0167cfd2b31623ce15afd129c3ad568776d63af223824ab085254b7ea0730e35  runtime/liblinoodle3.so' | sha256sum --check --strict
      - name: Search exact retail text for the six Xur D912 Type hashes
        run: |
          set -euo pipefail
          set +e
          python tools/d1_remote_stringhash_preimage_scan.py \
            --package-id 0x023d --package-id 0x0244 --package-id 0x024c --package-id 0x0250 --package-id 0x009f --package-id 0x0157 \
            --target 721945F6 --target 2112ABDE --target 7F62493C --target FB2B5117 --target F89ADEE0 --target 58A7319C \
            --contains xur --contains vendor --contains tower --contains weekend --contains friday --contains saturday --contains sunday --contains location \
            --member-catalog input/catalog/D1_UNIVERSAL_MEMBER_CATALOG.json \
            --base-url 'https://crypt.cohae.dev/destiny/ps4/packages/latest' --part-count 10 --runtime runtime \
            -o out/XUR_D912_LOCATION_TYPE_PREIMAGES.json | tee out/stdout.txt
          rc=${PIPESTATUS[0]}; set -e
          test "$rc" -eq 0 -o "$rc" -eq 2
          python - <<'PY'
          import json
          d=json.load(open('out/XUR_D912_LOCATION_TYPE_PREIMAGES.json'))
          print('XUR_TYPE_PREIMAGE_STATUS',d.get('status'))
          print('TARGETS',json.dumps(d.get('targets') or d.get('target_results') or {},sort_keys=True))
          print('VIOLATIONS',d.get('violations'))
          PY
      - name: Persist hashes
        if: always()
        run: find out -type f -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: D1-XUR-D912-LOCATION-TYPE-PREIMAGES, path: out/, retention-days: 90, if-no-files-found: error}
