[package]
name = "d1-backend"
version = "0.1.0"
edition = "2021"
description = "Replacement online services for Destiny 1 (CUSA00219 01.33) running under d1-native"
license = "MIT"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
