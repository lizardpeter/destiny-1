# Windows builds (cross-compiled with llvm-mingw) link statically, so d1-backend.exe needs
# only system DLLs next to d1-native.exe (no libunwind.dll / libc++.dll to ship).
[target.x86_64-pc-windows-gnullvm]
linker = "x86_64-w64-mingw32-clang"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=-static", "-C", "link-arg=-static-libgcc"]
