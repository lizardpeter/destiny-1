[package]
name = "d1_oodle3"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Clean-room Oodle 2.3 framing compatibility work for Destiny 1"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]



[features]
profile = []

[[bin]]
name = "profile_decode"
path = "src/bin/profile_decode.rs"
required-features = ["profile"]
