[package]
name = "t6-ff-zlibrs"
version = "0.1.0"
edition = "2021"
[[bin]]
name = "t6-ff-zlibrs"
path = "../src/main.rs"
[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
